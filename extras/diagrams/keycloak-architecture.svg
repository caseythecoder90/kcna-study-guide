<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="751px" preserveAspectRatio="none" style="width:1089px;height:751px;background:#FFFFFF;" version="1.1" viewBox="0 0 1089 751" width="1089px" zoomAndPan="magnify"><title>Keycloak &#8212; how the pieces fit (server side)</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="370.1338" x="351.9331" y="30.8838">Keycloak &#8212; how the pieces fit (server side)</text></g><!--cluster clients--><g class="cluster" data-entity="clients" data-source-line="4" data-uid="ent0002" id="cluster_clients"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="803" x="209" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="43.3418" x="588.8291" y="79.8921">Clients</text></g><!--cluster kc--><g class="cluster" data-entity="kc" data-source-line="12" data-uid="ent0008" id="cluster_kc"><rect fill="#F8FAFC" height="400" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="835" x="14" y="201.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="216.0361" x="323.4819" y="219.8921">Keycloak server (Quarkus runtime)</text></g><!--entity db--><g class="entity" data-entity="db" data-source-line="24" data-uid="ent0018" id="entity_db"><path d="M297.5,640.6982 C297.5,630.6982 390.9653,630.6982 390.9653,630.6982 C390.9653,630.6982 484.4307,630.6982 484.4307,640.6982 L484.4307,697.9448 C484.4307,707.9448 390.9653,707.9448 390.9653,707.9448 C390.9653,707.9448 297.5,707.9448 297.5,697.9448 L297.5,640.6982" fill="#F1F5F9" style="stroke:#64748B;stroke-width:1.5;"/><path d="M297.5,640.6982 C297.5,650.6982 390.9653,650.6982 390.9653,650.6982 C390.9653,650.6982 484.4307,650.6982 484.4307,640.6982" fill="none" style="stroke:#64748B;stroke-width:1.5;"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4854" x="311.5" y="670.8921">Relational DB</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="158.9307" x="311.5" y="683.9648">PostgreSQL &#183; MySQL &#183; MariaDB</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="137.5376" x="311.5" y="696.6138">Oracle &#183; MSSQL (H2 in dev)</text></g><!--entity ext--><g class="entity" data-entity="ext" data-source-line="25" data-uid="ent0019" id="entity_ext"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="226.0645" x="857" y="432.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.4917" x="871" y="458.8921">External identity</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="136.9468" x="871" y="471.9648">LDAP / AD (user federation)</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="198.0645" x="871" y="484.6138">OIDC / SAML / social (identity brokering)</text></g><!--entity browser--><g class="entity" data-entity="browser" data-source-line="5" data-uid="ent0003" id="entity_browser"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="213.8936" x="251" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.6772" x="265" y="120.8921">Browser</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.8936" x="265" y="133.9648">login, account console, admin console</text></g><!--entity app--><g class="entity" data-entity="app" data-source-line="6" data-uid="ent0004" id="entity_app"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="247.4629" x="483.5" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.228" x="497.5" y="120.8921">Your application</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="219.4629" x="497.5" y="133.9648">Spring Security OIDC client / resource server</text></g><!--entity adm--><g class="entity" data-entity="adm" data-source-line="7" data-uid="ent0005" id="entity_adm"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="255.3853" x="748.5" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.7808" x="762.5" y="120.8921">Admin automation</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="227.3853" x="762.5" y="133.9648">Admin REST API &#183; kcadm &#183; Terraform provider</text></g><!--entity rest--><g class="entity" data-entity="rest" data-source-line="13" data-uid="ent0009" id="entity_rest"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="405.3892" x="22.5" y="234.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="289.7769" x="36.5" y="260.8921">REST layer &#8212; org.keycloak.services.resources</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="377.3892" x="36.5" y="273.9648">RealmsResource &#183; OIDC + SAML protocol endpoints &#183; admin/AdminRoot</text></g><!--entity svc--><g class="entity" data-entity="svc" data-source-line="14" data-uid="ent0010" id="entity_svc"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="377.6099" x="54" y="327.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.939" x="68" y="353.8921">Services &amp; authentication</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="349.6099" x="68" y="366.9648">AuthenticationProcessor &#183; flows &#183; authenticators &#183; required actions</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.7837" x="68" y="379.6138">protocol mappers &#183; token issuance &#183; events</text></g><!--entity spi--><g class="entity" data-entity="spi" data-source-line="15" data-uid="ent0011" id="entity_spi"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="452.8428" x="164.5" y="432.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="324.4033" x="178.5" y="458.8921">SPI / provider model &#8212; server-spi, server-spi-private</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="424.8428" x="178.5" y="471.9648">Spi &#8594; ProviderFactory (singleton) &#8594; Provider (per request, via KeycloakSession)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="314.8105" x="178.5" y="484.6138">registered in META-INF/services; custom JARs in providers/</text></g><!--entity model--><g class="entity" data-entity="model" data-source-line="16" data-uid="ent0012" id="entity_model"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="331.3672" x="225.5" y="537.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="303.3672" x="239.5" y="563.8921">Model &#8212; RealmModel, ClientModel, UserModel ...</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="287.2944" x="239.5" y="576.9648">model/jpa (Hibernate) &#183; Infinispan caches and sessions</text></g><!--entity ui--><g class="entity" data-entity="ui" data-source-line="17" data-uid="ent0013" id="entity_ui"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="394.7974" x="445.5" y="234.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3799" x="459.5" y="260.8921">UI &#8212; js/ and themes/</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="366.7974" x="459.5" y="273.9648">admin-ui and account-ui (React, PatternFly) &#183; login themes (FreeMarker .ftl)</text></g><g class="link" data-entity-1="rest" data-entity-2="svc" data-uid="lnk14" id="link_rest_svc"><polygon fill="#475569" points="236.8597,327.6088,239.1505,318.0301,235.9474,322.6927,231.2848,319.4897,236.8597,327.6088" style="stroke:#475569;stroke-width:1;"/><path d="M230.014,290.7182 C232.1361,302.1539 233.534,309.687 235.765,321.7095" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="svc" data-entity-2="spi" data-uid="lnk15" id="link_svc_spi"><polygon fill="#475569" points="343.4465,432.6036,338.3443,424.1793,339.3425,429.7474,333.7744,430.7457,343.4465,432.6036" style="stroke:#475569;stroke-width:1;"/><path d="M290.6428,395.855 C307.5432,407.6168 321.6287