<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="528px" preserveAspectRatio="none" style="width:646px;height:528px;background:#FFFFFF;" version="1.1" viewBox="0 0 646 528" width="646px" zoomAndPan="magnify"><title>Is my application cloud native?</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="267.0557" x="181.9722" y="30.8838">Is my application cloud native?</text></g><!--cluster cloud--><g class="cluster" data-entity="cloud" data-source-line="4" data-uid="ent0002" id="cluster_cloud"><rect fill="#F0FDF4" height="375" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="298" x="14" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="249.8945" x="38.0527" y="71.8921">Running in the cloud gives you (for free)</text></g><!--cluster cn--><g class="cluster" data-entity="cn" data-source-line="14" data-uid="ent0010" id="cluster_cn"><rect fill="#F8FAFC" height="469" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="320" x="320" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="296.8799" x="331.5601" y="71.8921">Cloud native requires the application itself to be</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="5" data-uid="ent0003" id="entity_c1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="246.8936" x="56.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="178.4072" x="70.5" y="112.8921">Cloud infrastructure benefits</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.8936" x="70.5" y="125.9648">cost savings vs legacy &#183; scale as required</text></g><!--entity c2--><g class="entity" data-entity="c2" data-source-line="6" data-uid="ent0004" id="entity_c2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="206.0249" x="77" y="178.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="142.3335" x="91" y="204.8921">Guaranteed availability</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="178.0249" x="91" y="217.9648">the provider's SLA within a region</text></g><!--entity c3--><g class="entity" data-entity="c3" data-source-line="7" data-uid="ent0005" id="entity_c3"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="216.2407" x="72" y="270.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.73" x="86" y="296.8921">Cloud provider API</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.2407" x="86" y="309.9648">automation with Terraform / Ansible</text></g><!--entity cap1--><g class="entity" data-entity="cap1" data-source-line="8" data-uid="ent0006" id="entity_cap1"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="89.5908" x="73" y="388.8921">Comes with the</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="52.0127" x="166.2026" y="388.8921">provider</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="3.6118" x="218.2153" y="388.8921">.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="213.8779" x="73" y="403.8408">A lift-and-shift monolith gets all three.</text></g><!--entity q1--><g class="entity" data-entity="q1" data-source-line="15" data-uid="ent0011" id="entity_q1"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="153.313" x="403.5" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.8882" x="417.5" y="112.8921">Automated</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.313" x="417.5" y="125.9648">in its setup and delivery</text></g><!--entity q2--><g class="entity" data-entity="q2" data-source-line="16" data-uid="ent0012" id="entity_q2"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="193.6284" x="383" y="178.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1836" x="397" y="204.8921">Resilient</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="165.6284" x="397" y="217.9648">designed to protect from failure</text></g><!--entity q3--><g class="entity" data-entity="q3" data-source-line="17" data-uid="ent0013" id="entity_q3"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="205.8638" x="377" y="270.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.3945" x="391" y="296.8921">Autoscaling</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="177.8638" x="391" y="309.9648">based on its operational workload</text></g><!--entity q4--><g class="entity" data-entity="q4" data-source-line="18" data-uid="ent0014" id="entity_q4"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="156.3369" x="402" y="363.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.3672" x="416" y="389.8921">Secure by default</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128.3369" x="416" y="402.9648">not bolted on afterwards</text></g><!--entity cap2--><g class="entity" data-entity="cap2" data-source-line="19" data-uid="ent0015" id="entity_cap2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="70.7891" x="366" y="482.8921">Comes from</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="122.0908" x="440.4009" y="482.8921">design and practice</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="3.6118" x="562.4917" y="482.8921">.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="227.627" x="366" y="497.8408">These decide whether it is cloud native.</text></g><!--SRC=[RPGnRzim48Lt_ughbxQ3BTZ9L0WgZ0n1W0v5agtjS29FqY4KAPEK3RVex-hUNzOJbQHIRC23JP7ltNlyh7TibUarmNgTZP_ed0cPPgmzjY5xKXPNiQ6MrbtVcaNaQ0Zk0hGdmAuph32oiw2CwpLO-N6Wpuk59nNHrh9rUTzRoxO6jY0wpnjhsHRWv7huK3aFbIVwk8GyhxthkrldT540XkVDlnO04y6RjCYsyXYYxrNi