<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="227px" preserveAspectRatio="none" style="width:964px;height:227px;background:#FFFFFF;" version="1.1" viewBox="0 0 964 227" width="964px" zoomAndPan="magnify"><title>The four cloud native philosophies</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="298.0195" x="329.4902" y="30.8838">The four cloud native philosophies</text></g><!--entity core--><g class="entity" data-entity="core" data-source-line="4" data-uid="ent0002" id="entity_core"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="107.4536" x="419" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.4536" x="433" y="87.8921">Cloud Native</text></g><!--entity a--><g class="entity" data-entity="a" data-source-line="6" data-uid="ent0003" id="entity_a"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="233.4282" x="6" y="140.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="76.5781" x="20" y="166.8921">Architecture</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="163.8076" x="20" y="179.9648">how applications are designed:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="205.4282" x="20" y="192.6138">microservices &#183; resilience &#183; autoscaling</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.7998" x="20" y="205.2627">serverless &#183; immutable infrastructure</text></g><!--entity p--><g class="entity" data-entity="p" data-source-line="7" data-uid="ent0004" id="entity_p"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="203.4038" x="257" y="140.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.5317" x="271" y="166.8921">Personas</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="142.4253" x="271" y="179.9648">the roles that make it work:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="175.4038" x="271" y="192.6138">DevOps &#183; SRE &#183; FinOps &#183; platform</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="139.9814" x="271" y="205.2627">security &#183; data engineering</text></g><!--entity g--><g class="entity" data-entity="g" data-source-line="8" data-uid="ent0005" id="entity_g"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="219.2915" x="478" y="140.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.2554" x="492" y="166.8921">Community &amp; Governance</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="183.9492" x="492" y="179.9648">how the CNCF and its projects run:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="158.9146" x="492" y="192.6138">TOC &#183; SIGs &#183; open governance</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.2915" x="492" y="205.2627">Sandbox &#8594; Incubating &#8594; Graduated</text></g><!--entity s--><g class="entity" data-entity="s" data-source-line="9" data-uid="ent0006" id="entity_s"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="243.1875" x="715" y="140.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="100.4072" x="729" y="166.8921">Open Standards</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="215.1875" x="729" y="179.9648">what keeps the ecosystem interoperable:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="105.1069" x="729" y="192.6138">OCI &#183; CRI &#183; CNI &#183; CSI</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="109.4146" x="729" y="205.2627">OpenTelemetry &#183; SMI</text></g><g class="link" data-entity-1="core" data-entity-2="a" data-uid="lnk7" id="link_core_a"><polygon fill="#475569" points="239.2058,143.0761,248.9637,144.4117,244.0081,141.6838,246.736,136.7282,239.2058,143.0761" style="stroke:#475569;stroke-width:1;"/><path d="M418.6148,96.7677 C372.8829,107.6648 305.6257,124.2324 247.5,140.6982 C244.7628,141.4736 247.7576,140.5967 244.9685,141.4053" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="core" data-entity-2="p" data-uid="lnk8" id="link_core_p"><polygon fill="#475569" points="405.453,140.6589,414.9137,137.9213,409.2776,137.4382,409.7607,131.802,405.453,140.6589" style="stroke:#475569;stroke-width:1;"/><path d="M448.0441,104.7927 C435.6136,115.2604 424.6672,124.4785 410.0425,