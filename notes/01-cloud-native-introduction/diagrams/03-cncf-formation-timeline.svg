<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="170px" preserveAspectRatio="none" style="width:965px;height:170px;background:#FFFFFF;" version="1.1" viewBox="0 0 965 170" width="965px" zoomAndPan="magnify"><title>How the Cloud Native Computing Foundation was formed</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="492.9873" x="233.0063" y="30.8838">How the Cloud Native Computing Foundation was formed</text></g><!--cluster lf--><g class="cluster" data-entity="lf" data-source-line="7" data-uid="ent0004" id="cluster_lf"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="234" x="509" y="54.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.0337" x="571.4832" y="72.3921">Linux Foundation</text></g><!--entity y2014--><g class="entity" data-entity="y2014" data-source-line="5" data-uid="ent0002" id="entity_y2014"><rect fill="#EFF6FF" height="85.4951" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="207.3784" x="6" y="78.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.9199" x="20" y="104.8921">2014</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.0845" x="20" y="119.8408">Kubernetes open-sourced</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="63.5591" x="20" y="134.7896">by Google</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="179.3784" x="20" y="147.8623">built on ~15 years of running Borg</text></g><!--entity y2015--><g class="entity" data-entity="y2015" data-source-line="6" data-uid="ent0003" id="entity_y2015"><rect fill="#EFF6FF" height="70.5464" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="232.3945" x="249" y="85.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.9199" x="263" y="111.8921">2015</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="204.3945" x="263" y="126.8408">Kubernetes donated to the CNCF</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="139.3638" x="263" y="139.9136">the first ever CNCF project</text></g><!--entity eco--><g class="entity" data-entity="eco" data-source-line="10" data-uid="ent0006" id="entity_eco"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="188.7998" x="771" y="87.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.4326" x="785" y="113.3921">The ecosystem grows</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.7998" x="785" y="126.4648">Prometheus &#183; Envoy &#183; containerd</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="158.313" x="785" y="139.1138">Helm &#183; Argo &#183; etcd &#183; CoreDNS ...</text></g><!--entity cncf--><g class="entity" data-entity="cncf" data-source-line="8" data-uid="ent0005" id="entity_cncf"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="218.083" x="517" y="87.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.1055" x="531" y="113.3921">CNCF</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="190.083" x="531" y="126.4648">founded 2015 &#183; vendor-neutral home</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="150.3584" x="531" y="139.1138">for cloud native open source</text></g><g class="link" data-entity-1="y2014" data-entity-2="y2015" data-uid="lnk7" id="link_y2014_y2015"><polygon fill="#475569" points="248.6701,121.1982,239.6701,117.1982,243.6701,121.1982,239.6701,125.1982,248.6701,121.1982" style="stroke:#475569;stroke-width:1;"/><path d="M213.2427,121.1982 C224.9086,121.1982 230.856,121.1982 242.6701,121.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="y2015" data-entity-2="cncf" data-uid="lnk8" id="link_y2015_cncf"><polygon fill="#475569" points="516.8605,121.1982,507.8605,117.1982,511.8605,121.1982,507.8605,125.1982,516.8605,121.1982" style="stroke:#475569;stroke-width:1;"/><path d="M481.1095,121.1982 C492.9985,121.1982 499.0514,121.1982 510.8605,121.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="cncf" data-entity-2="eco" data-uid="lnk9" id="link_cncf_eco"><polygon fill="#475569" points="770.8668,121.1982,761.8668,117.1982,765.8668,121.1982,761.8668,125.1982,770.8668,121.1982" style="stroke:#475569;stroke-width:1;"/><path d="M735.3249,121.1982 C747.1919,121.1982 753.1989,121.1982 764.8668,121.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><!--SRC=[PPB1ZjCm48RlUOgXnqffwMfxGL4aAEokjAX2WcClhZr93SvCDBPR0eBNuiwJOIUhLUXAaPr9_fdlzunVMT8k6eJLQZqzWTdvjR6g5TNvzJTDgWmdx73LnyuL3fi0WK5iUmfWhA0Ebga8DZY41xv04iFESJImLy6UKy1T7uEb5kuuab5P3nVbeM7fq1H5hg6eJVcBvVBczUPskJpGOpoY40Rqm3rIwJcAHdEWum3tp4bzeChR7_XciwcFqRe0gUpl