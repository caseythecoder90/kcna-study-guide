<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="389px" preserveAspectRatio="none" style="width:1193px;height:389px;background:#FFFFFF;" version="1.1" viewBox="0 0 1193 389" width="1193px" zoomAndPan="magnify"><title>Serverless &#8212; event-driven execution, billed by what it used</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="507.1641" x="339.418" y="30.8838">Serverless &#8212; event-driven execution, billed by what it used</text></g><!--cluster you--><g class="cluster" data-entity="you" data-source-line="12" data-uid="ent0007" id="cluster_you"><rect fill="#F0FDF4" height="139" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="385" x="310" y="79.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="60.6582" x="472.1709" y="97.8921">You bring</text></g><!--cluster prov--><g class="cluster" data-entity="prov" data-source-line="17" data-uid="ent0011" id="cluster_prov"><rect fill="#F8FAFC" height="127" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="674.5" x="512.5" y="226.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="280.5283" x="709.4858" y="244.8921">The provider brings (someone else's servers)</text></g><!--entity ev--><g class="entity" data-entity="ev" data-source-line="5" data-uid="ent0002" id="entity_ev"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="256.5991" x="15" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="35.4009" x="29" y="79.8921">Event</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.5991" x="29" y="92.9648">HTTP request &#183; queue message &#183; file upload</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.7168" x="29" y="105.6138">schedule &#183; database change</text></g><!--entity ex--><g class="entity" data-entity="ex" data-source-line="6" data-uid="ent0003" id="entity_ex"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="274.9038" x="6" y="164.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.1245" x="20" y="190.8921">Execution</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="239.0029" x="20" y="203.9648">the provider starts an execution environment,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.9038" x="20" y="216.6138">runs your function, and tears it down when idle</text></g><!--entity bill--><g class="entity" data-entity="bill" data-source-line="7" data-uid="ent0004" id="entity_bill"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="236.3931" x="25.5" y="275.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.7173" x="39.5" y="301.8921">Billing</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="172.686" x="39.5" y="314.9648">duration (per ms) &#215; memory size,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="208.3931" x="39.5" y="327.6138">plus request count &#8212; nothing while idle</text></g><!--entity zip--><g class="entity" data-entity="zip" data-source-line="13" data-uid="ent0008" id="entity_zip"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="153.6245" x="318" y="112.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.6899" x="332" y="138.8921">Code as a .zip</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.6245" x="332" y="151.9648">handler + dependencies</text></g><!--entity img--><g class="entity" data-entity="img" data-source-line="14" data-uid="ent0009" id="entity_img"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="177.7407" x="509" y="112.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="127.1499" x="523" y="138.8921">or a container image</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="149.7407" x="523" y="151.9648">OCI image with your runtime</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="18" data-uid="ent0012" id="entity_p1"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="155.1689" x="520.5" y="260.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.1689" x="534.5" y="286.3921">Servers, OS, patching</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="19" data-uid="ent0013" id="entity_p2"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="222.3335" x="724" y="260.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.3335" x="738" y="286.3921">Runtime, cores, memory, network</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="20" data-uid="ent0014" id="entity_p3"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="196.3462" x="983" y="260.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3462" x="997" y="286.3921">Scaling from zero, availability</text></g><g class="link" data-entity-1="ev" data-entity-2="ex" data-uid="lnk5" id="link_ev_ex"><polygon fill="#475569" points="143.5,164.4889,147.5,155.4889,143.5,159.4889,139.5,155.4889,143.5,164.4889" style="stroke:#475569;stroke-width:1;"/><path d="M143.5,121.9857 C143.5,135.4978 143.5,144.9844 143.5,158.4889" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="40.0137" x="108" y="147.9541">triggers</text></g><g class="link" data-entity-1="ex" data-entity-2="bill" data-uid="lnk6" id="link_ex_bill"><polygon fill="#475569" points="143.5,275.4889,147.5,266.4889,143.5,270.4889,139.5,266.4889,143.5,275.4889" style="stroke:#475569;stroke-width:1;"/><path d="M143.5,232.9857 C143.5,246.4978 143.5,255.9844 143.5,269.4889" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="44.0215" x="106" y="258.9541">metered</text></g><g class="caption" data-source-line="27"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="707.9434" x="239.0283" y="373.8301">"Serverless" does not mean no servers &#8212; it means the servers are not yours to choose, size, patch, or depreciate.</text></g><!--SRC=[RLJDRjD04BxxAOPSQ8MJAEsjidoWGi2fYFQ2WCDcTsAFQk-QdTsaAKBY8P1ubDxXJNWIPkt-E4abIt5cTxxvvfjl_8AiRg91cCtcmnESQtXkI5LUjJo_rbPDGuqjphhODbc3gm31WQUg3c38emxaR1OeD0YNwDVe6sI6Vpz_0QxHXgdn9B-0DwXZkfl3afe63IotiAbL00eG6KsM9J1bAm6Ql4cfNsp1T8jdYqNvxkhg0tZy5f43_Ba3UOa8hLHI5QR0YYGjTerJffYdh7AKpRf64vl-eb51BHKZw5fguVtb2HI5qbgAbYKe5kexR1wuZp155EYyMvD13noK3mngr2QWNPDtjXNC_92IZvPXwwA7LRHwq4LP0m6LvoI9SHih-eXoP9edcedRpPZRQn6JR3M2Dj6hdi5H9zHQFeQ_lqMgrlajf3lFiEcQo8_oQXTjw0TeNQW5MsWaTNTu54Nbd1d4IlFCCbp3j1HoS0P1x56Xvqp-IIoTIxJ5W7vlpfzSXAMN6ZsYTx5x-mWhwi3t361q_To9L-L8mUoMkb43CajXv-4L6EpG6hIQa9zbAucxeCuBddOsAB82GQrOQWHzSVv-YC66GZtCJAONg7rU3MehmPSgCFrSan4gNzCiHOTqycFS_TNOGxqC34ViMdGM0Hl6bmpSxnGVFmeqL4bf- -eCwySvN5pcqAcWwtjXsnZmdbstsCtvE7IIYm0U9NNmIGuMmyRvw_tiaxsAMYNpmSgx5cxHEp7nMb6ZPEGKjllPfvBTBGvqwL6xayFugSYLN71m8CtttjgBozqiqwhhtLzGENdw84raeP2JewL5sLFh7fJjdKv3c26jzSE1yjWdf95p-khfsZaMhVej6XJEGUmZdXDHI0MS5NCg_mC0]--></g></svg>