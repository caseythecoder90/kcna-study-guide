9648">virtualisation</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.96" x="650.7212" y="351.6138">containerisation</text></g><!--entity monitor--><g class="entity" data-entity="monitor" data-source-line="12" data-uid="ent0009" id="entity_monitor"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="94.6338" x="783.2212" y="226.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="47.6519" x="797.2212" y="252.8921">Monitor</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="66.6338" x="797.2212" y="265.9648">visualisation</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="39.7085" x="797.2212" y="278.6138">logging</text></g><g class="link" data-entity-1="plan" data-entity-2="code" data-uid="lnk10" id="link_plan_code"><polygon fill="#475569" points="501.7212,147.4326,505.7212,138.4326,501.7212,142.4326,497.7212,138.4326,501.7212,147.4326" style="stroke:#475569;stroke-width:1;"/><path d="M501.7212,130.0531 C501.7212,135.8463 501.7212,135.6394 501.7212,141.4326" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="code" data-entity-2="build" data-uid="lnk11" id="link_code_build"><polygon fill="#475569" points="501.7212,233.4326,505.7212,224.4326,501.7212,228.4326,497.7212,224.4326,501.7212,233.4326" style="stroke:#475569;stroke-width:1;"/><path d="M501.7212,216.0531 C501.7212,221.8463 501.7212,221.6394 501.7212,227.4326" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="build" data-entity-2="test" data-uid="lnk12" id="link_build_test"><polygon fill="#475569" points="501.7212,319.5732,505.7212,310.5732,501.7212,314.5732,497.7212,310.5732,501.7212,319.5732" style="stroke:#475569;stroke-width:1;"/><path d="M501.7212,301.7412 C501.7212,307.6852 501.7212,307.6292 501.7212,313.5732" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="test" data-entity-2="release" data-uid="lnk13" id="link_test_release"><polygon fill="#475569" points="501.7212,393.6357,505.7212,384.6357,501.7212,388.6357,497.7212,384.6357,501.7212,393.6357" style="stroke:#475569;stroke-width:1;"/><path d="M501.7212,376.0503 C501.7212,381.9121 501.7212,381.7739 501.7212,387.6357" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="release" data-entity-2="deploy" data-uid="lnk14" id="link_release_deploy"><polygon fill="#475569" points="501.7212,479.4326,505.7212,470.4326,501.7212,474.4326,497.7212,470.4326,501.7212,479.4326" style="stroke:#475569;stroke-width:1;"/><path d="M501.7212,462.0531 C501.7212,467.8463 501.7212,467.6394 501.7212,473.4326" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="deploy" data-entity-2="operate" data-uid="lnk15" id="link_deploy_operate"><polygon fill="#475569" points="677.1561,367.9245,669.6067,374.2497,674.9579,372.4154,676.7922,377.7667,677.1561,367.9245" style="stroke:#475569;stroke-width:1;"/><path d="M586.2355,482.7556 C592.2487,479.1087 597.9935,475.0969 603.2212,470.6982 C636.7517,442.4854 659.5887,403.8158 674.5183,373.3136" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="operate" data-entity-2="monitor" data-uid="lnk16" id="link_operate_monitor"><polygon fill="#475569" points="783.1668,285.7792,773.3463,286.5264,778.765,288.1507,777.1407,293.5693,783.1668,285.7792" style="stroke:#475569;stroke-width:1;"/><path d="M749.7252,303.7957 C760.8343,297.8107 767.1156,294.4267 777.8846,288.625" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="monitor" data-entity-2="plan" data-uid="lnk17" id="link_monitor_plan"><polygon fill="#475569" points="575.8015,126.0532,582.4032,133.3619,580.3711,128.0827,585.6504,126.0506,575.8015,126.0532" style="stroke:#475569;stroke-width:1;"/><path d="M783.0729,233.9795 C737.7183,208.3833 666.5894,169.2447 603.2212,138.6982 C594.4171,134.4543 590.5715,132.613 581.285,128.4886" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.0879" x="627.2212" y="140.9541">feedback closes the loop</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1261.4424" x="5" y="559.8301">Blue = Dev half (build it), green = Ops half (run it), Release is the hand-off.  DevOps Engineer: the whole loop.  CloudOps Engineer: leans to the green half on cloud resources (Terraform, provider tooling).</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="867.5967" x="201.9229" y="575.9287">SRE: lives in operate/monitor and measures it (SLIs, SLOs).  DevSecOps: security gates in every phase.  Full Stack Developer: plan &#8594; test.</text></g><!--SRC=[VLJDRXCn4BxlKmpbqaf9LfKeY2ZieJz8I4L5JM_0mTsTtRNYjRV-ILLEd7W0n1FsIPYn4-hGg59aPpqptpV_hwIkLMWGPhCo_RmnofMD59qLWojNjHPJt-E0ip4Cgb3OUl06hEnw3usqM7jfTE6bLmWtFS8vhgz61ygO4Hv__W6CccCl7Be92Dt0VOyM0KNTmuZM6Ir0eT2kA1XDw8wG3hueeR_fXPC_S7vyNDq69pKw1nRl0h4EgBrRb2okChNWq4ABsDoAUhKH7u1mC19S3dzc6ipid0csHgZfzJdecfoa64cglJKgXsM37FOqIDLafY9uCmZEq7FO1jUepCYHv92t395Ztg3pcTbT44hwXttUUDBCBQ-HykhoEDb8wc220wazKett-vRfDQWaPU01IlexAlEmu_1Y8UgQ7ggA7R29CFVXFDfaqACrQydvbBhRIzpABYI_O11QTFWVOMTCa-YIFpdR5JMKy7d4QsazPyoz4AcWrhAx6hj49i7cJ9yf06_i3fDxYKYPhdiAUHT_I615mMqAqohr5H_yaJeYdlmPgym7VpnbFDxyjCbAklXXw_tcvgSjuUQ6wLTjhD2hoUitxqvEthx_JZhHb_c_QO9Q6HfXe6KGXxieQZ76AYraTQe2mWUUVUY5Qk4mUIlzqGGwYwX9o5iX2MtGIR