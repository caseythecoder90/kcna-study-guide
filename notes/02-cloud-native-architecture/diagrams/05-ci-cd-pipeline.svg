<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="348px" preserveAspectRatio="none" style="width:1055px;height:348px;background:#FFFFFF;" version="1.1" viewBox="0 0 1055 348" width="1055px" zoomAndPan="magnify"><title>CI/CD &#8212; continuous integration, then delivery or deployment</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="522.0439" x="262.9419" y="30.8838">CI/CD &#8212; continuous integration, then delivery or deployment</text></g><!--cluster ci--><g class="cluster" data-entity="ci" data-source-line="7" data-uid="ent0004" id="cluster_ci"><rect fill="#F8FAFC" height="84" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="385" x="232.7139" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="361.1499" x="244.6389" y="71.8921">Continuous Integration &#8212; every commit is built and tested</text></g><!--cluster cdel--><g class="cluster" data-entity="cdel" data-source-line="15" data-uid="ent0010" id="cluster_cdel"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="453" x="185.7139" y="187.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="286.0635" x="269.1821" y="205.3921">Continuous Delivery &#8212; deployable at any time</text></g><!--cluster cdep--><g class="cluster" data-entity="cdep" data-source-line="23" data-uid="ent0016" id="cluster_cdep"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="335" x="646.7139" y="187.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="262.8882" x="682.7698" y="205.3921">Continuous Deployment &#8212; no human step</text></g><!--entity code--><g class="entity" data-entity="code" data-source-line="4" data-uid="ent0002" id="entity_code"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="59.0781" x="73.2139" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.0781" x="87.2139" y="112.8921">Code</text></g><!--entity commit--><g class="entity" data-entity="commit" data-source-line="5" data-uid="ent0003" id="entity_commit"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="72.7764" x="150.2139" y="80.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.7764" x="164.2139" y="106.3921">Commit</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="38.5269" x="164.2139" y="119.4648">git push</text></g><!--entity b--><g class="entity" data-entity="b" data-source-line="8" data-uid="ent0005" id="entity_b"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="60.4937" x="241.7139" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="32.4937" x="255.7139" y="112.8921">Build</text></g><!--entity ut--><g class="entity" data-entity="ut" data-source-line="9" data-uid="ent0006" id="entity_ut"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="87.23" x="320.2139" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.23" x="334.2139" y="112.8921">Unit tests</text></g><!--entity it--><g class="entity" data-entity="it" data-source-line="10" data-uid="ent0007" id="entity_it"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="129.1245" x="425.2139" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.1245" x="439.2139" y="112.8921">Integration tests</text></g><!--entity art--><g class="entity" data-entity="art" data-source-line="16" data-uid="ent0011" id="entity_art"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="163.1289" x="194.2139" y="220.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.1289" x="208.2139" y="246.3921">Release-ready artifact</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="110.0054" x="208.2139" y="259.4648">deployed to staging /</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128.9922" x="208.2139" y="272.1138">acceptance environment</text></g><!--entity rev--><g class="entity" data-entity="rev" data-source-line="17" data-uid="ent0012" id="entity_rev"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="141.1313" x="375.2139" y="226.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.3271" x="389.2139" y="252.3921">Review / approval</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.1313" x="389.2139" y="265.4648">a person decides when</text></g><!--entity rel1--><g class="entity" data-entity="rel1" data-source-line="18" data-uid="ent0013" id="entity_rel1"><rect fill="#EFF6FF" height="57.8975" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="95.8755" x="534.7139" y="225.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.0317" x="548.7139" y="251.3921">Release to</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.8755" x="548.7139" y="266.3408">production</text></g><!--entity gate--><g class="entity" data-entity="gate" data-source-line="24" data-uid="ent0017" id="entity_gate"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="134.9976" x="655.2139" y="220.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="105.46" x="669.2139" y="246.3921">Automated gates</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="106.9976" x="669.2139" y="259.4648">tests, policy checks,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="81.9468" x="669.2139" y="272.1138">canary analysis</text></g><!--entity rel2--><g class="entity" data-entity="rel2" data-source-line="25" data-uid="ent0018" id="entity_rel2"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="164.519" x="808.2139" y="220.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.519" x="822.2139" y="246.3921">Release to production</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="114.2915" x="822.2139" y="259.4648">automatic; automated</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="86.8022" x="822.2139" y="272.1138">rollback if it fails</text></g><g class="link" data-entity-1="b" data-entity-2="ut" data-uid="lnk8" id="link_b_ut"><polygon fill="#475569" points="319.769,108.1982,310.769,104.1982,314.769,108.1982,310.769,112.1982,319.769,108.1982" style="stroke:#475569;stroke-width:1;"/><path d="M301.9014,108.1982 C307.8573,108.1982 307.8132,108.1982 313.769,108.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ut" data-entity-2="it" data-uid="lnk9" id="link_ut_it"><polygon fill="#475569" points="425.1777,108.1982,416.1777,104.1982,420.1777,108.1982,416.1777,112.1982,425.1777,108.1982" style="stroke:#475569;stroke-width:1;"/><path d="M407.5186,108.1982 C413.4049,108.1982 413.2913,108.1982 419.1777,108.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="art" data-entity-2="rev" data-uid="lnk14" id="link_art_rev"><polygon fill="#475569" points="374.9886,254.1982,365.9886,250.1982,369.9886,254.1982,365.9886,258.1982,374.9886,254.1982" style="stroke:#475569;stroke-width:1;"/><path d="M357.3936,254.1982 C363.2586,254.1982 363.1236,254.1982 368.9886,254.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="rev" data-entity-2="rel1" data-uid="lnk15" id="link_rev_rel1"><polygon fill="#475569" points="534.4996,254.1982,525.4996,250.1982,529.4996,254.1982,525.4996,258.1982,534.4996,254.1982" style="stroke:#475569;stroke-width:1;"/><path d="M516.3545,254.1982 C522.4029,254.1982 522.4513,254.1982 528.4996,254.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="gate" data-entity-2="rel2" data-uid="lnk19" id="link_gate_rel2"><polygon fill="#475569" points="807.9572,254.1982,798.9572,250.1982,802.9572,254.1982,798.9572,258.1982,807.9572,254.1982" style="stroke:#475569;stroke-width:1;"/><path d="M790.3076,254.1982 C796.1908,254.1982 796.074,254.1982 801.9572,254.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="code" data-entity-2="commit" data-uid="lnk20" id="link_code_commit"><polygon fill="#475569" points="150.1177,108.1982,141.1177,104.1982,145.1177,108.1982,141.1177,112.1982,150.1177,108.1982" style="stroke:#475569;stroke-width:1;"/><path d="M132.2451,108.1982 C138.2026,108.1982 138.1602,108.1982 144.1177,108.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="commit" data-entity-2="b" data-uid="lnk21" id="link_commit_b"><polygon fill="#475569" points="241.416,108.1982,232.416,104.1982,236.416,108.1982,232.416,112.1982,241.416,108.1982" style="stroke:#475569;stroke-width:1;"/><path d="M223.2373,108.1982 C229.2969,108.1982 229.3564,108.1982 235.416,108.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="it" data-entity-2="art" data-uid="lnk22" id="link_it_art"><polygon fill="#475569" points="319.6686,220,329.2862,217.8784,323.693,217.0327,324.5386,211.4394,319.6686,220" style="stroke:#475569;stroke-width:1;"/><path d="M455.6122,129.7452 C430.4646,145.1144 395.579,166.8924 365.7139,187.1982 C350.4918,197.548 339.0026,205.7445 324.4978,216.4393" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="38.0215" x="422.7139" y="171.4541">passes</text></g><g class="link" data-entity-1="it" data-entity-2="gate" data-uid="lnk23" id="link_it_gate"><polygon fill="#475569" points="685.7686,219.8703,681.4625,211.0127,681.9446,216.6489,676.3084,217.1311,685.7686,219.8703" style="stroke:#475569;stroke-width:1;"/><path d="M536.3609,129.7255 C567.4468,144.1802 608.6858,164.8735 642.7139,187.1982 C657.4674,196.8776 668.0601,204.9526 681.1798,216.0047" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="38.0215" x="632.7139" y="171.4541">passes</text></g><g class="caption" data-source-line="34"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="961.707" x="43.1104" y="316.3301">Both branches start from the same CI output. Delivery stops at "deployable, and a person approves the release"; deployment goes all the way to production</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1037.9277" x="5" y="332.4287">on its own, which is why it demands stronger automated testing and rollback. On the exam, plain "CD" means continuous delivery unless the question says deployment.</text></g><!--SRC=[VLHDRzim3BtdLt0v9p7QOni4M5jWw6d0WDrwOMJ69YfBcZwIUSE0_OZzmlsIKNPYEqax80WIYNnwV7pa1pPAfv9WjIhwJxHMXw9ah3mseNXL1fUnfePMBZLw5ZbgWiVdul49_lx-0ygQo2RP581D94cARCq29CL0IPhtv5kmNduxRTk6J9pDFAc8fXAW-QCjQGxhjTF8PhC1309Pqdb8qt1yCUl0F-ZkvcPJSGINGhqkyidcAZs7Npmoa7mUINRygUFNvm07s2RM4T2K42b4AZDuvMroHt26dpE02VQ394YKt6tFBxuQGSmWeRjDyVnwIcICuXorXQNdgexBJP-LudWW0R_Ug-tf97SkhDSRjnA3kQ0M8ZTqMOvqwBAWBwG90oqzOTa2-iWxL5FvUsGIXIo4Y1MR2efZBoPXg1Gv0LK4PFRihSdD7techmlsvTDxfWCKWCvvkqSzXGD7FjXiAiKb1JY8moOEQ99qgw_Aq_xDaeJmYn7WCgai-xoFrJSIB5H6ZK_v- -cHXFr7-9EtE-cDXJerQ4GTSeFYdwmj1zNTfUeVKxGDIWbGoNUO5DwPOm7EQbRYr9hKQrXSowtGeBHUldKRE4oKgOQ7C_Hxoi0ep5JrdXQhUy0Jm-ktlTLwY-eLU2S6XHsoVfk0o7Wh13AFCsrlixPvxiVJunWV9tCutixolz8UZFp9NRi3Xo5Gc9vt-CF5JA7hncpDcmSRQzXwSMKj5XBt2iBEsoRlAmZOvDK6DaMNucgSfn2j2tcCvkDKBRebCRYoTwnWPY3Vgpg_dsmzgApSejPTn07RSytN1MT5UIDO70D88GknEAiwRwL3tMPXIn9NbPctJ5D5Vkn9jqBo86PIftQiuBFfNgFls8Y3yeuKtpxDeI4qORgxXqsTZARGL_4jPKpX4x0DaqfMcUi_]--></g></svg>