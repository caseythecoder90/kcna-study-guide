<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="622px" preserveAspectRatio="none" style="width:1104px;height:622px;background:#FFFFFF;" version="1.1" viewBox="0 0 1104 622" width="1104px" zoomAndPan="magnify"><title>Vertical scaling (up) vs horizontal scaling (across)</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="429.1172" x="329.9414" y="30.8838">Vertical scaling (up) vs horizontal scaling (across)</text></g><!--cluster v--><g class="cluster" data-entity="v" data-source-line="4" data-uid="ent0002" id="cluster_v"><rect fill="#F8FAFC" height="563" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="486" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.8589" x="143.5706" y="71.8921">Vertical &#8212; make one machine bigger</text></g><!--cluster h--><g class="cluster" data-entity="h" data-source-line="16" data-uid="ent0012" id="cluster_h"><rect fill="#F0FDF4" height="341.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="590" x="508" y="60.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="205.8735" x="700.0632" y="78.3921">Horizontal &#8212; add more machines</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="5" data-uid="ent0003" id="entity_v1"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="106.8584" x="369.5" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.5718" x="383.5" y="112.8921">Server A</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="78.8584" x="383.5" y="125.9648">4 vCPU &#183; 16 GB</text></g><!--entity v2--><g class="entity" data-entity="v2" data-source-line="6" data-uid="ent0004" id="entity_v2"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="114.2007" x="267" y="203.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.479" x="281" y="229.8921">Server A</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="86.2007" x="281" y="242.9648">16 vCPU &#183; 64 GB</text></g><!--entity v3--><g class="entity" data-entity="v3" data-source-line="7" data-uid="ent0005" id="entity_v3"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="120.3184" x="213" y="329.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.479" x="227" y="355.3921">Server A</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="92.3184" x="227" y="368.4648">64 vCPU &#183; 256 GB</text></g><!--entity cap--><g class="entity" data-entity="cap" data-source-line="8" data-uid="ent0006" id="entity_cap"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="249.2568" x="135.5" y="430.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="43.3354" x="149.5" y="456.8921">Ceiling</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.2568" x="149.5" y="469.9648">the biggest machine you can buy &#8212; or the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="217.6206" x="149.5" y="482.6138">spare capacity left on the hypervisor host</text></g><!--entity vcap--><g class="entity" data-entity="vcap" data-source-line="12" data-uid="ent0010" id="entity_vcap"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="383.6523" x="36" y="561.8921">Bare metal: open the case (downtime, hard limit, price climbs fast).</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="442.1777" x="36" y="576.8408">Virtual: the hypervisor (e.g. VMware ESXi) grants the VM more of the host &#8212;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="253.6333" x="36" y="591.7896">but only what the physical host still has free.</text></g><!--entity lb--><g class="entity" data-entity="lb" data-source-line="17" data-uid="ent0013" id="entity_lb"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="171.7935" x="719" y="93.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="143.7935" x="733" y="119.3921">Load balancer / service</text></g><!--entity h1--><g class="entity" data-entity="h1" data-source-line="18" data-uid="ent0014" id="entity_h1"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="81.479" x="516.5" y="210.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.479" x="530.5" y="236.3921">Server A</text></g><!--entity h2--><g class="entity" data-entity="h2" data-source-line="19" data-uid="ent0015" id="entity_h2"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="81.479" x="615.5" y="210.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.479" x="629.5" y="236.3921">Server B</text></g><!--entity h3--><g class="entity" data-entity="h3" data-source-line="20" data-uid="ent0016" id="entity_h3"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="81.479" x="714.5" y="210.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.479" x="728.5" y="236.3921">Server C</text></g><!--entity h4--><g class="entity" data-entity="h4" data-source-line="21" data-uid="ent0017" id="entity_h4"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="81.479" x="813.5" y="203.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.479" x="827.5" y="229.8921">Server D</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="32.3931" x="827.5" y="242.9648">added</text></g><!--entity h5--><g class="entity" data-entity="h5" data-source-line="22" data-uid="ent0018" id="entity_h5"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="80.7617" x="912.5" y="203.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="52.7617" x="926.5" y="229.8921">Server E</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="32.3931" x="926.5" y="242.9648">added</text></g><!--entity h6--><g class="entity" data-entity="h6" data-source-line="23" data-uid="ent0019" id="entity_h6"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="77.8418" x="1012" y="203.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.8418" x="1026" y="229.8921">Server F</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="9.1685" x="1026" y="242.9648">...</text></g><!--entity hcap--><g class="entity" data-entity="hcap" data-source-line="30" data-uid="ent0026" id="entity_hcap"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="452.3086" x="530" y="346.8921">Commodity machines working together as a distributed system; add or remove</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="447.3003" x="530" y="361.8408">resources relative to what is already there. No hard ceiling, but the application</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="349.0068" x="530" y="376.7896">must be built to share work and data across many instances.</text></g><g class="link" data-entity-1="v1" data-entity-2="v2" data-uid="lnk7" id="link_v1_v2"><polygon fill="#475569" points="347.2932,203.6405,356.1964,199.4294,350.5553,199.8512,350.1335,194.2101,347.2932,203.6405" style="stroke:#475569;stroke-width:1;"/><path d="M399.5384,142.9516 C383.757,161.2836 366.9538,180.8024 351.2077,199.0933" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="85.3594" x="389" y="177.9541">add CPU / RAM</text></g><g class="link" data-entity-1="v2" data-entity-2="v3" data-uid="lnk8" id="link_v2_v3"><polygon fill="#475569" points="284.1661,329.1589,291.2984,322.367,286.0745,324.5374,283.9041,319.3135,284.1661,329.1589" style="stroke:#475569;stroke-width:1;"/><path d="M312.8078,259.8008 C304.3046,280.3921 294.953,303.0374 286.4562,323.6131" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="50.6953" x="311" y="294.9541">add more</text></g><g class="link" data-entity-1="v3" data-entity-2="cap" data-uid="lnk9" id="link_v3_cap"><polygon fill="#DC2626" points="264.079,430.5955,269.1497,422.1523,264.6905,425.6331,261.2097,421.1739,264.079,430.5955" style="stroke:#DC2626;stroke-width:1;"/><path d="M269.6522,385.3671 C267.952,399.165 266.6059,410.089 264.8128,424.6406" fill="none" style="stroke:#DC2626;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="h1" data-uid="lnk20" id="link_lb_h1"><polygon fill="#475569" points="594.2416,210.1827,604.0707,209.559,598.6729,207.8668,600.3652,202.469,594.2416,210.1827" style="stroke:#475569;stroke-width:1;"/><path d="M755.694,136.3614 C715.3378,153.5718 656.9681,179.148 607,203.6982 C602.8385,205.7429 603.8372,205.1677 599.5591,207.4036" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="h2" data-uid="lnk21" id="link_lb_h2"><polygon fill="#475569" points="682.6584,210.123,692.2271,207.7906,686.6165,207.068,687.3391,201.4575,682.6584,210.123" style="stroke:#475569;stroke-width:1;"/><path d="M778.3618,136.2579 C751.3246,157.1256 714.4526,185.5838 687.4082,206.457" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="h3" data-uid="lnk22" id="link_lb_h3"><polygon fill="#475569" points="764.0302,209.9288,771.287,203.2701,766.0238,205.3435,763.9504,200.0803,764.0302,209.9288" style="stroke:#475569;stroke-width:1;"/><path d="M796.061,136.2579 C787.0162,157.0609 775.4999,183.5486 766.4225,204.4264" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="h4" data-uid="lnk23" id="link_lb_h4"><polygon fill="#16A34A" points="842.3673,203.397,842.5193,193.5493,840.4074,198.7972,835.1595,196.6852,842.3673,203.397" style="stroke:#16A34A;stroke-width:1;"/><path d="M813.7602,136.2579 C821.7432,154.9936 831.2406,177.2834 840.0154,197.8772" fill="none" style="stroke:#16A34A;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="h5" data-uid="lnk24" id="link_lb_h5"><polygon fill="#16A34A" points="918.1383,203.6098,913.4859,194.9291,914.1901,200.5419,908.5773,201.2462,918.1383,203.6098" style="stroke:#16A34A;stroke-width:1;"/><path d="M831.4594,136.2579 C855.6545,155.0582 886.8703,179.3137 913.4005,199.9284" fill="none" style="stroke:#16A34A;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="h6" data-uid="lnk25" id="link_lb_h6"><polygon fill="#94A3B8" points="1011.8694,208.2912,1005.8014,200.5337,1007.4549,205.9435,1002.045,207.597,1011.8694,208.2912" style="stroke:#94A3B8;stroke-width:1;"/><path d="M854.8303,136.3051 C895.237,153.3812 953.4137,178.8021 1003,203.6982 C1005.9052,205.1569 1003.5879,203.8871 1006.5719,205.474" fill="none" style="stroke:#94A3B8;stroke-width:1.6;"/></g><!--SRC=[ZLNRQjj047ttLqoJbnXY6LyYsjGOR2TD7vfI6ceAQHzMqbXQijeLkoiPfHJw4VsNllTJ-YMTbMnPSGKf65bYvXpFd3r7Vi5bAF88mVE6zSSg9SmmuYpMB3N3Xr2oWKqmHI_BKz6pt0g4DMhBGoR0q8NB6Cxoh0-5WKHf_gYaRPTOg9Kn_LvFOsYPZ0b_qX3y-V4JKlQ0e2JIJPXm-Wvu7AC-WTairYhFvdDW1WhurWDeSToXBb33uekS6Vw8bwFHV0h5wiCd-FqBHZxSB6T3LvWxeZIt6Es8Hi_o47fFv4_RH0u-VXRk7-OON_Z7-CbJ_0gvqwa59xbh2Onj92bL3Y6J4EHbfPdIG6qxtXRMP4mZTMOivBO4WHjBqhfUICgCHkM6e8aojYLEm7RI48w6AqOmYDHM3kQqB5m2Yo9mwmpXu-BMrSU7-cHNJvL6Lvh0uFxqQZNsn_xNNKzDAbY00avcVBvq4wP87ha4bM4zNCWCmfb3M9xYEIHCHo1uokqvP9g7r45FWO4DCxRlpORSRStdQwvjxfYEDZn3B_PWVRjrFtPzzvdtWGmjhQaQrxVLmA0sDOxaSAesh47kL1CbR1DcgvOiAKrbsAhNM2xebXJRQCHgclfiwrtfIZ8aF8fGxbMeIj-VXE3j8IpkIFSoxi_SD06uKMftGCbn2Duf5a7019CXcN08nWaGeeEoC4HfQvm8karR_SI1lJi