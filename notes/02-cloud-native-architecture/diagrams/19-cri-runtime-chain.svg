<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="814px" preserveAspectRatio="none" style="width:1241px;height:814px;background:#FFFFFF;" version="1.1" viewBox="0 0 1241 814" width="1241px" zoomAndPan="magnify"><title>What actually runs on a node: boxes are PROGRAMS, arrows are the STANDARDS between them</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="832.166" x="200.5522" y="30.8838">What actually runs on a node: boxes are PROGRAMS, arrows are the STANDARDS between them</text></g><!--cluster pod--><g class="cluster" data-qualified-name="pod" data-source-line="16" id="ent0008"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="463" x="650.8853" y="669.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="265.313" x="749.7288" y="687.8921">The Pod's processes (children of the shim)</text></g><!--entity kubelet--><g class="entity" data-qualified-name="kubelet" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="333.0244" x="500.3853" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="514.3853" y="79.8921">kubelet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.8931" x="514.3853" y="92.9648">long-running daemon (systemd) &#183; one per node</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="305.0244" x="514.3853" y="105.6138">decides WHAT should run; never creates a container itself</text></g><!--entity ctd--><g class="entity" data-qualified-name="ctd" data-source-line="6" id="ent0003"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="366.6421" x="483.3853" y="210.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="497.3853" y="236.8921">containerd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.877" x="497.3853" y="249.9648">long-running daemon &#183; one per node</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="236.2207" x="497.3853" y="262.6138">its built-in CRI plugin = the server side of CRI</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="338.6421" x="497.3853" y="275.2627">pulls images &#183; unpacks layers (snapshotter) &#183; writes OCI bundles</text></g><!--entity cni--><g class="entity" data-qualified-name="cni" data-source-line="8" id="ent0004"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="228.5728" x="94.3853" y="217.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.6963" x="108.3853" y="243.3921">CNI plugin</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="200.5728" x="108.3853" y="256.4648">a plain executable, e.g. /opt/cni/bin/calico</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="151.6206" x="108.3853" y="269.1138">runs for a moment, then EXITS</text></g><!--entity reg--><g class="entity" data-qualified-name="reg" data-source-line="10" id="ent0005"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="153.9146" x="991.8853" y="223.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.6772" x="1005.8853" y="249.3921">Registry</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="125.9146" x="1005.8853" y="262.4648">Docker Hub, GHCR, ECR</text></g><!--entity shim--><g class="entity" data-qualified-name="shim" data-source-line="12" id="ent0006"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="316.9971" x="508.3853" y="366.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152.4136" x="522.3853" y="392.8921">containerd-shim-runc-v2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="153.9893" x="522.3853" y="405.9648">long-running &#183; ONE PER POD</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="288.9971" x="522.3853" y="418.6138">parent of the Pod's processes: keeps their stdio + logs,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="254.3374" x="522.3853" y="431.2627">collects exit codes, survives a containerd restart</text></g><!--entity runc--><g class="entity" data-qualified-name="runc" data-source-line="14" id="ent0007"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="357.8765" x="487.8853" y="536.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="25.2891" x="501.8853" y="562.8921">runc</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="253.7251" x="501.8853" y="575.9648">a CLI binary &#183; runs for each create/start, then EXITS</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="329.8765" x="501.8853" y="588.6138">reads config.json, builds namespaces + cgroups, execs the process</text></g><!--entity pause--><g class="entity" data-qualified-name="pod.pause" data-source-line="17" id="ent0009"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="221.166" x="693.3853" y="702.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="37.5718" x="707.3853" y="728.8921">pause</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="167.4546" x="707.3853" y="741.9648">PID 1 of the sandbox &#183; holds the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.166" x="707.3853" y="754.6138">network, IPC, UTS namespaces open</text></g><!--entity app--><g class="entity" data-qualified-name="pod.app" data-source-line="18" id="ent0010"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="173.1968" x="932.3853" y="702.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.1245" x="946.3853" y="728.8921">app container(s)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="145.1968" x="946.3853" y="741.9648">e.g. nginx master + workers</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.354" x="946.3853" y="754.6138">JOIN pause's namespaces</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="666.8853,210.6109,670.8853,201.6109,666.8853,205.6109,662.8853,201.6109,666.8853,210.6109" style="stroke:#475569;stroke-width:1;"/><path d="M666.8853,121.7699 C666.8853,147.5169 666.8853,177.3392 666.8853,204.6109" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="20.666" x="833.3091" y="156.9541">CRI</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.4688" x="712.9077" y="170.7529">gRPC over unix:///run/containerd/containerd.sock</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="341.5137" x="672.8853" y="184.5518">RunPodSandbox &#183; PullImage &#183; CreateContainer &#183; StartContainer</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="991.7833,251.1982,982.7833,247.1982,986.7833,251.1982,982.7833,255.1982,991.7833,251.1982" style="stroke:#475569;stroke-width:1;"/><path d="M850.5329,251.1982 C900.2946,251.1982 945.4855,251.1982 985.7833,251.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.043" x="865.1353" y="226.4541">OCI distribution-spec</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="69.3398" x="886.4868" y="240.2529">(HTTPS pull)</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="323.5716,251.1982,332.5716,255.1982,328.5716,251.1982,332.5716,247.1982,323.5716,251.1982" style="stroke:#475569;stroke-width:1;"/><path d="M329.5716,251.1982 C377.7954,251.1982 429.1155,251.1982 482.9716,251.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="49.3477" x="379.0728" y="212.4541">CNI spec</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.7227" x="338.3853" y="226.2529">exec with JSON on stdin</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.373" x="357.5601" y="240.0518">ADD &#8594; eth0 + IP</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="666.8853,366.6738,670.8853,357.6738,666.8853,361.6738,662.8853,357.6738,666.8853,366.6738" style="stroke:#475569;stroke-width:1;"/><path d="M666.8853,291.8571 C666.8853,314.8499 666.8853,337.7039 666.8853,360.6738" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="82.6758" x="692.2358" y="326.9541">ttrpc (shim API)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.377" x="672.8853" y="340.7529">over a per-shim socket</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" id="lnk17"><polygon fill="#475569" points="666.8853,536.5869,670.8853,527.5869,666.8853,531.5869,662.8853,527.5869,666.8853,536.5869" style="stroke:#475569;stroke-width:1;"/><path d="M666.8853,447.7056 C666.8853,474.9733 666.8853,504.8176 666.8853,530.5869" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="94.0254" x="708.7563" y="482.9541">OCI runtime-spec</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.7676" x="672.8853" y="496.7529">exec "runc create" / "runc start"</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.1016" x="678.7183" y="510.5518">+ bundle: config.json + rootfs</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" id="lnk18"><polygon fill="#475569" points="666.8853,669.691,670.8853,660.691,666.8853,664.691,662.8853,660.691,666.8853,669.691" style="stroke:#475569;stroke-width:1;"/><path d="M666.8853,604.8861 C666.8853,623.5117 666.8853,641.4201 666.8853,663.691" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="75.7031" x="717.4048" y="639.9541">clone() + exec</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.7422" x="672.8853" y="653.7529">(kernel: namespaces, cgroups)</text></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1223.2705" x="5" y="798.8301">Swap the implementations, keep the standards: CRI-O replaces containerd (with one conmon per container instead of the shim); crun, gVisor or Kata replace runc (picked per Pod by RuntimeClass).</text></g><?plantuml-src XLNDZY8t4Bxp59MvB6Y0pkR84YG4enasoO20P2DbSZ1sqJZZjbksUnWIvPe7oCladaV9awJA_4mZMAtKXswtNVNLLrzz_afRQIg5qErc-oSwPqAcjCYzA4BsBAten0qMs2shmZIYZWRXqqP4439MmfWT-Ce6S1O4MAUm1oltYW64HvZDf_VpuG-BDdrvjzqlKZHOB8UFu-5yl80LnYsYvTMYqV0eex0vfRXvhbPeC3xPVj2_O-_z-u5nDkzG