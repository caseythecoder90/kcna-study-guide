<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="691px" preserveAspectRatio="none" style="width:1033px;height:691px;background:#FFFFFF;" version="1.1" viewBox="0 0 1033 691" width="1033px" zoomAndPan="magnify"><title>Container Runtime Interface &#8212; from kubelet to a running container</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="572.0625" x="226.7046" y="30.8838">Container Runtime Interface &#8212; from kubelet to a running container</text></g><!--cluster hl--><g class="cluster" data-entity="hl" data-source-line="6" data-uid="ent0004" id="cluster_hl"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="694" x="266.7358" y="241.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="247.7427" x="489.8645" y="259.8921">High-level runtime (CRI implementation)</text></g><!--cluster ll--><g class="cluster" data-entity="ll" data-source-line="14" data-uid="ent0011" id="cluster_ll"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="657" x="266.7358" y="442.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="383.5508" x="403.4604" y="460.8921">Low-level (OCI) runtime &#8212; chosen per Pod with RuntimeClass</text></g><!--entity kubelet--><g class="entity" data-entity="kubelet" data-source-line="4" data-uid="ent0002" id="entity_kubelet"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="385.2207" x="90.2358" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="104.2358" y="87.8921">kubelet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="127.1177" x="104.2358" y="100.9648">node agent; gRPC client</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="357.2207" x="104.2358" y="113.6138">--container-runtime-endpoint=unix:///run/containerd/containerd.sock</text></g><!--entity cri--><g class="entity" data-entity="cri" data-source-line="5" data-uid="ent0003" id="entity_cri"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="415.2935" x="75.2358" y="165.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="216.6963" x="89.2358" y="191.8921">CRI &#8212; Container Runtime Interface</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="353.3105" x="89.2358" y="204.9648">gRPC API: RuntimeService (pod sandboxes, containers, exec, logs)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="387.2935" x="89.2358" y="217.6138">+ ImageService (pull, list, remove) &#183; v1 API required since Kubernetes 1.26</text></g><!--entity oci--><g class="entity" data-entity="oci" data-source-line="13" data-uid="ent0010" id="entity_oci"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="421.7979" x="71.7358" y="378.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.3545" x="85.7358" y="404.8921">OCI runtime-spec</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="393.7979" x="85.7358" y="417.9648">the high-level runtime hands each container's bundle to a low-level runtime</text></g><!--entity pod--><g class="entity" data-entity="pod" data-source-line="23" data-uid="ent0019" id="entity_pod"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="258.7476" x="153.2358" y="579.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="167.2358" y="605.8921">Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="230.7476" x="167.2358" y="618.9648">pause (sandbox) container + app containers</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="198.0645" x="167.2358" y="631.6138">sharing network and IPC namespaces</text></g><!--entity containerd--><g class="entity" data-entity="containerd" data-source-line="7" data-uid="ent0005" id="entity_containerd"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="253.5161" x="308.7358" y="274.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="322.7358" y="300.8921">containerd</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="139.3047" x="322.7358" y="313.9648">with its built-in CRI plugin;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.5161" x="322.7358" y="326.6138">the common default (kind, EKS, GKE, AKS)</text></g><!--entity crio--><g class="entity" data-entity="crio" data-source-line="8" data-uid="ent0006" id="entity_crio"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="147.7915" x="580.7358" y="274.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.8291" x="594.7358" y="300.8921">CRI-O</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="119.7915" x="594.7358" y="313.9648">built only to serve CRI;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="103.2808" x="594.7358" y="326.6138">Red Hat / OpenShift</text></g><!--entity docker--><g class="entity" data-entity="docker" data-source-line="9" data-uid="ent0007" id="entity_docker"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="205.9067" x="746.7358" y="274.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2681" x="760.7358" y="300.8921">Docker Engine</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.9067" x="760.7358" y="313.9648">not CRI-native &#8212; needs cri-dockerd;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.1768" x="760.7358" y="326.6138">dockershim removed in 1.24</text></g><!--entity runc--><g class="entity" data-entity="runc" data-source-line="15" data-uid="ent0012" id="entity_runc"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="192.7476" x="309.2358" y="481.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1709" x="323.2358" y="507.8921">runc</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="164.7476" x="323.2358" y="520.9648">default: namespaces + cgroups</text></g><!--entity crun--><g class="entity" data-entity="crun" data-source-line="16" data-uid="ent0013" id="entity_crun"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="53.2891" x="520.2358" y="488.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="25.2891" x="534.2358" y="514.3921">crun</text></g><!--entity gvisor--><g class="entity" data-entity="gvisor" data-source-line="17" data-uid="ent0014" id="entity_gvisor"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="172.3105" x="591.7358" y="481.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4727" x="605.7358" y="507.8921">gVisor / runsc</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="144.3105" x="605.7358" y="520.9648">sandboxed user-space kernel</text></g><!--entity kata--><g class="entity" data-entity="kata" data-source-line="18" data-uid="ent0015" id="entity_kata"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="132.5322" x="782.2358" y="475.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.2217" x="796.2358" y="501.8921">Kata Containers</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="104.5322" x="796.2358" y="514.9648">micro-VM per pod via</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="103.8984" x="796.2358" y="527.6138">QEMU or Firecracker</text></g><g class="link" data-entity-1="kubelet" data-entity-2="cri" data-uid="lnk20" id="link_kubelet_cri"><polygon fill="#475569" points="282.7358,165.3989,286.7358,156.3989,282.7358,160.3989,278.7358,156.3989,282.7358,165.3989" style="stroke:#475569;stroke-width:1;"/><path d="M282.7358,129.8147 C282.7358,141.2162 282.7358,147.9829 282.7358,159.3989" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="cri" data-entity-2="hl" data-uid="lnk21" id="link_cri_hl"><polygon fill="#475569" points="282.7358,241.4358,286.7358,232.4358,282.7358,236.4358,278.7358,232.4358,282.7358,241.4358" style="stroke:#475569;stroke-width:1;"/><path d="M282.7358,233.9672 C282.7358,235.3092 282.7358,236.6711 282.7358,238.0487 C282.7358,238.7376 282.7358,239.4303 282.7358,240.1265 C282.7358,240.4746 282.7358,240.8236 282.7358,241.1733 C282.7358,241.2608 282.7358,235.3483 282.7358,235.4358" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="hl" data-entity-2="oci" data-uid="lnk22" id="link_hl_oci"><polygon fill="#475569" points="282.7358,378.4693,286.7358,369.4693,282.7358,373.4693,278.7358,369.4693,282.7358,378.4693" style="stroke:#475569;stroke-width:1;"/><path d="M282.7358,350.8082 C282.7358,350.8895 282.7358,350.9709 282.7358,351.0522 C282.7358,351.2149 282.7358,351.3778 282.7358,351.5407 C282.7358,352.8441 282.7358,354.1537 282.7358,355.4654 C282.7358,358.089 282.7358,360.7215 282.7358,363.3315 C282.7358,368.5514 282.7358,367.6812 282.7358,372.4693" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="oci" data-entity-2="ll" data-uid="lnk23" id="link_oci_ll"><polygon fill="#475569" points="282.7358,442.4961,286.7358,433.4961,282.7358,437.4961,278.7358,433.4961,282.7358,442.4961" style="stroke:#475569;stroke-width:1;"/><path d="M282.7358,434.7644 C282.7358,436.0499 282.7358,437.3614 282.7358,438.6944 C282.7358,439.3609 282.7358,440.0327 282.7358,440.7094 C282.7358,441.0477 282.7358,441.3872 282.7358,441.7278 C282.7358,441.8981 282.7358,442.0687 282.7358,442.2396 C282.7358,442.325 282.7358,436.4105 282.7358,436.4961" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ll" data-entity-2="pod" data-uid="lnk24" id="link_ll_pod"><polygon fill="#475569" points="282.7358,579.5619,286.7358,570.5619,282.7358,574.5619,278.7358,570.5619,282.7358,579.5619" style="stroke:#475569;stroke-width:1;"/><path d="M282.7358,551.8916 C282.7358,552.053 282.7358,552.2145 282.7358,552.3762 C282.7358,553.6697 282.7358,554.9714 282.7358,556.278 C282.7358,558.8911 282.7358,561.5233 282.7358,564.147 C282.7358,569.3942 282.7358,568.6068 282.7358,573.5619" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="31"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1015.4717" x="5" y="659.8301">Two interfaces at two levels: CRI is how the kubelet talks to a runtime; the OCI runtime-spec is how that runtime talks to the thing that actually creates the container.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="791.2393" x="117.1162" y="675.9287">Firecracker is a micro-VM monitor (AWS), not a CRI or OCI runtime itself &#8212; it is reached through Kata or firecracker-containerd.</text></g><!--SRC=[VLNDZYCr4BxdAOgza6ZJQGr2UyY4IACmi55OpJ21vG0SFEvAjnMttTZkP00XyH2y2tSUXIUXxFvpJoAaHEcExQ- - -kghyYT2SLbd28j5sdoSrjAccM2vOQLDZronn1LOugAgIpbnmac4ZLQE2OK6dchbH8cmLGxDWN64V__y2mv6bt2idr6Y0wU1WQcL4Ye7tfsSJ0nonrHES6_QhJ-fbHM_uVBcPgqqaM8vAdSB-TFZ1hWKzB9A_OPrj359UiZ4D6GIL5cbXN9Vr4gyBDCqfOMqtvP5Zmkh-R45VGEh5UESegpNm6p7F-QvUTg6_Fud_uXQu7ttk5rsk_PeJe8acbOw0yjKzgnVqCu7KUWPNv3FGUhSpYwJVGlRaaGPS6efQREmRWu6Itt26VppDvnkV5ZwvvTQ6AHGL6M47ULZ53gqSBFux5sKTQvrrkJCZOZpVI_o8f5uGWcjjZ3r6eYoacG9Oks4LhE0ONHTDI25XDyd017E87YKp5cu0eIpy5mBwHAXm4DNiiw5khtCdKn8GfMbLf3XWTNImVGeL3Q7-zr-3b_lxkTmjzlF-hnyEdt