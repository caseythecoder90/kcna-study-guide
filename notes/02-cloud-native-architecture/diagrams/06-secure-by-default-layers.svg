<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="497px" preserveAspectRatio="none" style="width:834px;height:497px;background:#FFFFFF;" version="1.1" viewBox="0 0 834 497" width="834px" zoomAndPan="magnify"><title>Secure by default &#8212; three questions every request must pass</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="528.1787" x="149.3955" y="30.8838">Secure by default &#8212; three questions every request must pass</text></g><!--entity a--><g class="entity" data-entity="a" data-source-line="4" data-uid="ent0002" id="entity_a"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="118.4331" x="174.9849" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.2617" x="188.9849" y="87.8921">Service A</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="90.4331" x="188.9849" y="100.9648">identity: frontend</text></g><!--entity b--><g class="entity" data-entity="b" data-source-line="5" data-uid="ent0003" id="entity_b"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="108.0669" x="362.9849" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.2617" x="376.9849" y="87.8921">Service B</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="80.0669" x="376.9849" y="100.9648">identity: orders</text></g><!--entity l1--><g class="entity" data-entity="l1" data-source-line="8" data-uid="ent0005" id="entity_l1"><rect fill="#FFFFFF" height="70.5464" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="555.6509" x="138.9849" y="154.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114.8799" x="152.9849" y="180.8921">1 &#183; Secure channel</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="260.8633" x="152.9849" y="195.8408">Can anyone read or alter the traffic in transit?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="527.6509" x="152.9849" y="208.9136">TLS encrypts the connection and protects its integrity. On its own it still trusts whoever reaches the endpoint.</text></g><!--entity l2--><g class="entity" data-entity="l2" data-source-line="9" data-uid="ent0006" id="entity_l2"><rect fill="#FFFFFF" height="83.1953" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="595.9248" x="118.9849" y="262.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="255.0361" x="132.9849" y="288.8921">2 &#183; Zero trust &#8212; never trust, always verify</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="567.9248" x="132.9849" y="303.8408">Do we know who is calling &#8212; on every request, regardless of where on the network it comes from?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="545.3862" x="132.9849" y="316.9136">Mutual TLS: both sides present a certificate, so identity is proven in both directions. Default-deny network policy.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="211.4331" x="132.9849" y="329.5625">Being "inside the perimeter" grants nothing.</text></g><!--entity l3--><g class="entity" data-entity="l3" data-source-line="10" data-uid="ent0007" id="entity_l3"><rect fill="#FFFFFF" height="70.5464" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="651.6162" x="90.9849" y="382.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8208" x="104.9849" y="408.8921">3 &#183; Least privilege</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="270.2451" x="104.9849" y="423.8408">Once verified, what is this caller allowed to do?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="623.6162" x="104.9849" y="436.9136">Only what its job needs: RBAC roles, minimal service accounts, non-root containers, dropped capabilities, read-only filesystems.</text></g><g class="link" data-entity-1="a" data-entity-2="b" data-uid="lnk4" id="link_a_b"><polygon fill="#16A34A" points="362.9823,89.6982,353.9823,85.6982,357.9823,89.6982,353.9823,93.6982,362.9823,89.6982" style="stroke:#16A34A;stroke-width:1;"/><path d="M293.147,89.6982 C315.5986,89.6982 335.0312,89.6982 356.9823,89.6982" fill="none" style="stroke:#16A34A;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="40.0254" x="307.9849" y="78.9541">request</text></g><g class="caption" data-source-line="16"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="816.9697" x="5" y="465.8301">mTLS is where 1 and 2 overlap: it both encrypts the channel and proves both identities. Secure channels answer "is the pipe safe?";</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="665.7588" x="80.6055" y="481.9287">zero trust answers "who is on the other end, every time?"; least privilege answers "and what may they do?".</text></g><!--SRC=[TPHBSXen48RtdA93TYuU1KvbGIXSs5uwvQeugoHU2Ac1ZZNIHD90JLOvHEwIVOwIa-JNp60RFwfu2lNZ_xf_teZJjZ9Cez6uVIJlRHmRKPkWYZY-qquDqvOB7fLLONj9acMwOLq5fbLDXjUgied-_VfDQHkOwKV5CObtaNZ7eQR0pGaL5LvA5MEl5rWdvJP8rB_Xi1FDjFpcvb5-ycmoMOXXXphrZDR1kyJEpCVvjqMVL2JrKlZvY-4-60xnSV2gfsZuzUta_VBqtV8so6QRXWjQqUpGvb5p9oSJ-llde5PlbNDiJqvGInONof5ojNUCK6LGYvHD7421AGMrNeicSVcZYvBEvcDPF6hoyzKDiTEXBbDiGhH7Sft18QsXClY4hv4aFm5X4o1fHDUkEV7x_4u0RIrA06sa_TPduhaTlUKsAzYL7k6ZUmZpUMcLkCKYux2JOxdJBFSB1z_cRARgcgJDzm4axbKT2IUohZiIbvxsJ7VExtCB996qibRSfWc7dgCz6E33HWLZEKB66Y4CjhYLstMSzZxSPMdQ5z201IYUeljOfKfP0i4PhNpQKiJ48uXnnE19aUQG1FXLuW55TDGjH6uDN7Viyc2QK2EXXHv7TDckyX2tw_jEIcz5rmTyZxeuvwomBovNRvel0QLWh42Vu1s7YJYKmAtNu4-FuPzc-5Uiias2xCJoXZl4rmuxta0NDWCmKocBGVOMDkVbitxFXf8duvyYktQsxgBGrdU_WZusSKQVpfSN53o6CQ12d1G06pjFAQrz1Ha3w733u7qUYale7wOQa0c-B55GgrAjn4gId2HxOUXpkJK4n3ecBk9h04vxlHNik1K3vhS6ImqpOYVjvFdfj6Udpq-H0VKRrm1JaLqbiTkfIMEaAM7WmQfobhUg6VgnxrfN7qotmoOrbxgbWQZHapy0_0Mvk0VolhGfIYcPebhpMVz31ruMFnzSr5wFrE_iqIqxgY0973he79AmFaX1zdW77k9pZyqK2rNd57KUTN-KQ_u7]--></g></svg>