<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="470px" preserveAspectRatio="none" style="width:1509px;height:470px;background:#FFFFFF;" version="1.1" viewBox="0 0 1509 470" width="1509px" zoomAndPan="magnify"><title>Open Container Initiative &#8212; three specifications, one pipeline</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="525.1025" x="488.4487" y="30.8838">Open Container Initiative &#8212; three specifications, one pipeline</text></g><!--cluster build--><g class="cluster" data-entity="build" data-source-line="8" data-uid="ent0005" id="cluster_build"><rect fill="#F8FAFC" height="84" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="324" x="116" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.1582" x="244.4209" y="71.8921">Build tools</text></g><!--cluster reg--><g class="cluster" data-entity="reg" data-source-line="13" data-uid="ent0009" id="cluster_reg"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="248" x="465" y="315.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.8608" x="557.5696" y="333.8921">Registries</text></g><!--cluster runtimes--><g class="cluster" data-entity="runtimes" data-source-line="16" data-uid="ent0011" id="cluster_runtimes"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="612" x="891" y="309.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.6245" x="1156.1877" y="327.8921">OCI runtimes</text></g><!--entity img--><g class="entity" data-entity="img" data-source-line="4" data-uid="ent0002" id="entity_img"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="251.7061" x="6" y="190.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="71.5317" x="20" y="216.8921">image-spec</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.7061" x="20" y="229.9648">how a filesystem is bundled into an image:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="192.5376" x="20" y="242.6138">manifest &#183; config &#183; layers (tar) &#183; index</text></g><!--entity dist--><g class="entity" data-entity="dist" data-source-line="5" data-uid="ent0003" id="entity_dist"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="279.1899" x="341.5" y="190.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="105.4473" x="355.5" y="216.8921">distribution-spec</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="251.1899" x="355.5" y="229.9648">the registry API for pushing and pulling images;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="215.1499" x="355.5" y="242.6138">built on the Docker Registry HTTP API v2</text></g><!--entity rt--><g class="entity" data-entity="rt" data-source-line="6" data-uid="ent0004" id="entity_rt"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="311.3252" x="751.5" y="190.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.6309" x="765.5" y="216.8921">runtime-spec</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="260.9814" x="765.5" y="229.9648">how to run a filesystem bundle unpacked on disk:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="283.3252" x="765.5" y="242.6138">config.json + rootfs &#8594; namespaces, cgroups, process</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="9" data-uid="ent0006" id="entity_b1"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="124.0908" x="158" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.0908" x="172" y="112.8921">Docker / BuildKit</text></g><!--entity b2--><g class="entity" data-entity="b2" data-source-line="10" data-uid="ent0007" id="entity_b2"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="130.6226" x="300.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.6226" x="314.5" y="112.8921">Podman / Buildah</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="14" data-uid="ent0010" id="entity_r1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="197.7554" x="507" y="348.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.7554" x="521" y="374.8921">Docker Hub &#183; Harbor &#183; GHCR</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="93.5107" x="521" y="387.9648">ECR &#183; GCR &#183; Quay</text></g><!--entity runc--><g class="entity" data-entity="runc" data-source-line="17" data-uid="ent0012" id="entity_runc"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="164.9307" x="933.5" y="342.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1709" x="947.5" y="368.8921">runc</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.9307" x="947.5" y="381.9648">reference implementation,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.6792" x="947.5" y="394.6138">donated by Docker (Go)</text></g><!--entity crun--><g class="entity" data-entity="crun" data-source-line="18" data-uid="ent0013" id="entity_crun"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="82.4092" x="1117" y="348.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="25.2891" x="1131" y="374.8921">crun</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="54.4092" x="1131" y="387.9648">Red Hat, C</text></g><!--entity gvisor--><g class="entity" data-entity="gvisor" data-source-line="19" data-uid="ent0014" id="entity_gvisor"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="115.4307" x="1217.5" y="348.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.9072" x="1231.5" y="374.8921">gVisor (runsc)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="87.4307" x="1231.5" y="387.9648">user-space kernel</text></g><!--entity kata--><g class="entity" data-entity="kata" data-source-line="20" data-uid="ent0015" id="entity_kata"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="144.1606" x="1351" y="342.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.2217" x="1365" y="368.8921">Kata Containers</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="116.1606" x="1365" y="381.9648">each pod in a micro-VM</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="104.5" x="1365" y="394.6138">(QEMU / Firecracker)</text></g><g class="link" data-entity-1="build" data-entity-2="img" data-uid="lnk19" id="link_build_img"><polygon fill="#475569" points="132,190.6233,136,181.6233,132,185.6233,128,181.6233,132,190.6233" style="stroke:#475569;stroke-width:1;"/><path d="M132,137.9212 C132,138.0097 132,138.0983 132,138.187 C132,138.5419 132,138.8988 132,139.2575 C132,140.6924 132,142.1569 132,143.646 C132,146.6243 132,149.7009 132,152.8354 C132,165.3732 132,172.8358 132,184.6233" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="43.3652" x="138" y="164.9541">produce</text></g><g class="link" data-entity-1="img" data-entity-2="dist" data-uid="lnk20" id="link_img_dist"><polygon fill="#475569" points="341.3633,224.6982,332.3633,220.6982,336.3633,224.6982,332.3633,228.6982,341.3633,224.6982" style="stroke:#475569;stroke-width:1;"/><path d="M258.4905,224.6982 C285.4106,224.6982 307.9838,224.6982 335.3633,224.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="54.7031" x="272.75" y="213.9541">push / pull</text></g><g class="link" data-entity-1="dist" data-entity-2="rt" data-uid="lnk21" id="link_dist_rt"><polygon fill="#475569" points="751.1814,224.6982,742.1814,220.6982,746.1814,224.6982,742.1814,228.6982,751.1814,224.6982" style="stroke:#475569;stroke-width:1;"/><path d="M620.7833,224.6982 C662.5071,224.6982 702.4985,224.6982 745.1814,224.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.7266" x="640.8438" y="199.9541">download image,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.4141" x="635.5" y="213.7529">unpack to a bundle</text></g><g class="link" data-entity-1="rt" data-entity-2="runtimes" data-uid="lnk22" id="link_rt_runtimes"><polygon fill="#475569" points="907,309.5292,911,300.5292,907,304.5292,903,300.5292,907,309.5292" style="stroke:#475569;stroke-width:1;"/><path d="M907,258.9881 C907,267.3603 907,276.7492 907,286.4691 C907,291.3291 907,296.2718 907,301.2115 C907,303.6814 907,306.1505 907,308.6082 C907,308.9154 907,303.2224 907,303.5292" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.7285" x="913" y="293.9541">run the bundle</text></g><g class="link" data-entity-1="dist" data-entity-2="reg" data-uid="lnk24" id="link_dist_reg"><polygon fill="#475569" points="481,258.9881,477,267.9881,481,263.9881,485,267.9881,481,258.9881" style="stroke:#475569;stroke-width:1;"/><path d="M481,264.9881 C481,273.3603 481,276.7492 481,286.4691 C481,291.3291 481,296.2718 481,301.2115 C481,303.6814 481,306.1505 481,308.6082 C481,309.837 481,311.063 481,312.2847 C481,312.8956 481,313.5055 481,314.1141 C481,314.4184 481,314.7224 481,315.0261 C481,315.1779 481,315.3297 481,315.4813" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="55.3535" x="487" y="293.9541">implement</text></g><g class="caption" data-source-line="32"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1126.8975" x="187.5513" y="438.8301">Established June 2015 under the Linux Foundation by Docker, CoreOS and others: an open governance structure for open industry standards around container formats and runtimes.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="755.9521" x="373.0239" y="454.9287">Because all three are open, any builder's image runs on any runtime from any registry &#8212; that portability is the whole point.</text></g><!--SRC=[TLNDRjj64BxpAQQvr4P5gJBGYoe8Q5J7SjF0ZflcqlImsXsHMoztYVsnenO1Uke357sNtlieUPBEB2cRicH0W9Rpyyt7uRSpNsWhJL88u_6a-qNdJ9WeBIelcZ2vbLQKiSO6nsrgJ15rD0XNBLfOEXk5jkZXqkgeHTHt29___0TYxH4Xj2ZrHakoEnj6u2n2griqb58K7cKKjYAi5xeH5POS_i7EW_uTPzFfedRt862Z3OPjYDY03h1ELXbKe6rq82panDbymZcBGMuZhDvWYF3Vlo2TtUYAJqPiqGSuYSAVyhEs2Z_soIzWFXTIeesB1OX0oDMGeT8XUhrE_2PFYL9lm6F54LluxleIDiv3cqAjRKKa5PsDuNDc6xuzfBjEsaHg3p3KzqxUKaTlTeYhT- -kC-pTsJDScToGh4yswkPeGwbjvDtlQzTKIBOLL5an3qAyFTBMhfNZtmA5V0NUkRW9yFclly6A1WEb8trbMNcNMZgqtf4XF4FQnpq9lAGMACZIuyYCqGMki-UF0c0GtZTf0ZdljOwSr1eIOvyqtO-_TeeqiOiNzTFmCmfVJw7yfTPAeVtLwwgEvO8TduOq-w-YyIbB4i0p75TfpM9R2RycNT3fOhMy6JJrV7cJhTtVsoIsWuuDEFhfFfMhvINqN_gHp8LpgW_lNKzPaNqe2eyRz6WbaZfRGvUSRZIBV7JuzPMp8f8-rjkTHayktEc0R3KiBlVBIZ8Di6u8PoNY29R7NvR3zm6gzpfG_qx84UJf02e5z6KM7n0dY-OuOdN7-VkOhqKKZqCi341Ho1fQnvE6BakZfNVb-pU7FJbvU_xcPvBLAqsmdk-FFprU_vPgSNNgpA7C-jVblqFd0_FkS1YGeJyLHNTJIkNkBLbfWi6CBw5A4Wj-AdS9F33OHpEAkFDuAhBf8S2pct6C4wgRMwCFjfiGF4D4FpGA2jpLUn3SB8yO7cMx8BeRPMeV2pz8hIYaQ5bkCDUByn35skXGapP-IBGhphwUVaDZIP7I6Er7RTD7UEN8aYNwA4IIaVDuzLEUjevYVPZnUd2yf2ftHx8GB76wkKd6v36FwEob7P3ocANYXEjL0E6v1E-DVhbHS2DYoEYxjnpF9vg5e1SlKGhI80XZ-hqdg023ZoXZsyqlz5-6