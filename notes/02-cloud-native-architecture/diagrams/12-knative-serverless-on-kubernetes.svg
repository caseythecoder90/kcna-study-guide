<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="560px" preserveAspectRatio="none" style="width:1174px;height:560px;background:#FFFFFF;" version="1.1" viewBox="0 0 1174 560" width="1174px" zoomAndPan="magnify"><title>Serverless on Kubernetes &#8212; Knative Serving and Eventing</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="504.1582" x="327.4209" y="30.8838">Serverless on Kubernetes &#8212; Knative Serving and Eventing</text></g><!--cluster serving--><g class="cluster" data-entity="serving" data-source-line="4" data-uid="ent0002" id="cluster_serving"><rect fill="#F8FAFC" height="455" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="302" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.7808" x="60.6096" y="71.8921">Knative Serving &#8212; request-driven</text></g><!--cluster pods--><g class="cluster" data-entity="pods" data-source-line="8" data-uid="ent0006" id="cluster_pods"><rect fill="#F0FDF4" height="97" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="244" x="64" y="403.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.5845" x="121.7078" y="421.8921">Revision Pods 0 &#8230; n</text></g><!--cluster eventing--><g class="cluster" data-entity="eventing" data-source-line="20" data-uid="ent0015" id="cluster_eventing"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="844" x="324" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="202.9917" x="644.5042" y="71.8921">Knative Eventing &#8212; event-driven</text></g><!--entity req--><g class="entity" data-entity="req" data-source-line="5" data-uid="ent0003" id="entity_req"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="188.8105" x="115.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.4199" x="129.5" y="112.8921">Request</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.8105" x="129.5" y="125.9648">https://hello.default.example.com</text></g><!--entity ing--><g class="entity" data-entity="ing" data-source-line="6" data-uid="ent0004" id="entity_ing"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="216.9014" x="65.5" y="179.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.8862" x="79.5" y="205.8921">Ingress / load balancer</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="177.8638" x="79.5" y="218.9648">routes by Knative Route; can split</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.9014" x="79.5" y="231.6138">traffic between revisions (e.g. 90/10)</text></g><!--entity as--><g class="entity" data-entity="as" data-source-line="7" data-uid="ent0005" id="entity_as"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="284.7275" x="22.5" y="284.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.1953" x="36.5" y="310.8921">Autoscaler + activator</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="235.9253" x="36.5" y="323.9648">counts in-flight requests per revision; at zero</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256.7275" x="36.5" y="336.6138">the activator holds the request while a Pod starts</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="9" data-uid="ent0007" id="entity_p1"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="52.5527" x="106.5" y="443.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="120.5" y="469.3921">Pod</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="10" data-uid="ent0008" id="entity_p2"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="52.5527" x="177.5" y="443.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="191.5" y="469.3921">Pod</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="11" data-uid="ent0009" id="entity_p3"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="51.1309" x="248.5" y="436.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="23.1309" x="262.5" y="462.8921">Pod</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="20.7915" x="262.5" y="475.9648">next</text></g><!--entity src--><g class="entity" data-entity="src" data-source-line="21" data-uid="ent0016" id="entity_src"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="210.7837" x="366.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.3735" x="380.5" y="112.8921">Event sources</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="182.7837" x="380.5" y="125.9648">Kafka &#183; GitHub &#183; cron &#183; cloud services</text></g><!--entity broker--><g class="entity" data-entity="broker" data-source-line="22" data-uid="ent0017" id="entity_broker"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="196.7168" x="675.5" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.5054" x="689.5" y="112.8921">Broker + Trigger</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.7168" x="689.5" y="125.9648">filters events by type / attributes</text></g><!--entity sink--><g class="entity" data-entity="sink" data-source-line="23" data-uid="ent0018" id="entity_sink"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="188.7891" x="970.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.1162" x="984.5" y="112.8921">Knative Service (sink)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="160.7891" x="984.5" y="125.9648">scales from zero like any other</text></g><g class="link" data-entity-1="req" data-entity-2="ing" data-uid="lnk12" id="link_req_ing"><polygon fill="#475569" points="186.2806,179.6088,193.1622,172.563,188.0203,174.9212,185.662,169.7794,186.2806,179.6088" style="stroke:#475569;stroke-width:1;"/><path d="M199.972,142.7182 C195.7278,154.1539 192.8302,161.9612 188.3683,173.9837" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ing" data-entity-2="as" data-uid="lnk13" id="link_ing_as"><polygon fill="#475569" points="167.8918,284.6036,172.66,275.9859,168.327,279.6225,164.6904,275.2895,167.8918,284.6036" style="stroke:#475569;stroke-width:1;"/><path d="M171.1028,247.855 C170.0751,259.6168 169.4413,266.8697 168.4141,278.6263" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="as" data-entity-2="pods" data-uid="lnk14" id="link_as_pods"><polygon fill="#475569" points="98.1117,403.4852,105.839,397.3787,100.4375,399.0591,98.7571,393.6575,98.1117,403.4852" style="stroke:#475569;stroke-width:1;"/><path d="M133.7682,352.7615 C127.4978,360.1081 120.9354,368.2978 114.7508,376.923 C111.6585,381.2356 108.6606,385.6572 105.8409,390.1367 C104.4311,392.3764 103.0657,394.6307 101.7554,396.8931 C101.1003,398.0243 100.4589,399.1575 99.8325,400.292 C99.5194,400.8592 99.21,401.4267 98.9045,401.9945 C98.7517,402.2783 98.6,402.5623 98.4492,402.8462 C98.3739,402.9882 98.2987,403.1302 98.2239,403.2722 C98.1864,403.3432 100.9399,398.1028 100.9026,398.1738" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="88.7051" x="124" y="387.9541">scale 0 &#8594; n &#8594; 0</text></g><g class="link" data-entity-1="src" data-entity-2="broker" data-uid="lnk19" id="link_src_broker"><polygon fill="#475569" points="675.2739,114.6982,666.2739,110.6982,670.2739,114.6982,666.2739,118.6982,675.2739,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M577.6249,114.6982 C609.3475,114.6982 638.0154,114.6982 669.2739,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="592.5" y="103.9541">CloudEvents</text></g><g class="link" data-entity-1="broker" data-entity-2="sink" data-uid="lnk20" id="link_broker_sink"><polygon fill="#475569" points="970.0303,114.6982,961.0303,110.6982,965.0303,114.6982,961.0303,118.6982,970.0303,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M872.5193,114.6982 C904.0124,114.6982 932.7951,114.6982 964.0303,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0391" x="887.5" y="103.9541">CloudEvents</text></g><g class="caption" data-source-line="30"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="939.2031" x="109.8984" y="528.8301">Both halves are ordinary Kubernetes objects (CRDs) on an ordinary cluster. A Knative Service is a Deployment-like resource that gets a URL, revisions,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1010.0986" x="74.4507" y="544.9287">traffic splitting and scale-to-zero for free. OpenFaaS is the other common option: functions packaged as OCI images, deployed on Kubernetes, also scaling to zero.</text></g><!--SRC=[XLNDZjis4BxxAQOvPT6Lj4vFtHW6aasR1biWnIOvfJsCgP74cY8LSkID4mJegGzGz1do2httKV8a6LAMBRi62XYsIStFDz_CVFf6MsNwaY3FY-73pfbGb1fhZsqerifYnWsrb7TzQsQisH2y8hyXRoW4S1Pk-nLvIqm1llpnDznQPBqPZBIj0Mq9Fsp8iXncCq-AqTOIvC6fONJszAwdm5dfvObz08j5xLtVBPU00SBEyECCO1BdRl3vrIw2_a3Ny_coOUx2TL4qP8pBIwgmDvpJUsmxGxboxQA8fiiOlpEexH1VaXz7Vc5h7uiim3WiOOK6hI8_oIJWOjshxRxiktZp61HQ29tHl4iryM6FLQKLh8ZlYQmatEYWdGtmaF8wX- -lYldLnGGYAYNq3HWZYKSOd_JiWa937hu5L881sKqXAjTRZevPPNJTyCXnW4vynkIF0Ha-a7Tdy3Pq20oDCsM0UBUB0_UD5Y08lxWI0gFdiCSkW36STcj86Cq3N4dNFyEXqS-TAuT2k_WuTlh8MvoIxS5i_lycZywOJEgpz9udRBVIlz7pk-JPpI5xs-Yo9FkRZnHcop5ez-ZCe-ZrALNz3hBItLkv7FeMftUyISH8al6S2hw6rCl8ovz_WKtVLxDFP_TcNAgqE1GFvzU6HhkJlKd-45pl5OK97xTOhH7-_GUUQ_wfNyL_oal3ugznVJdieVYStwBWrN6UfzwjqtI-5eRge_Mfj67oEu