<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="374px" preserveAspectRatio="none" style="width:1138px;height:374px;background:#FFFFFF;" version="1.1" viewBox="0 0 1138 374" width="1138px" zoomAndPan="magnify"><title>Serverless autoscaling &#8212; from zero, but not to infinity</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="463.0693" x="333.9653" y="30.8838">Serverless autoscaling &#8212; from zero, but not to infinity</text></g><!--cluster cold--><g class="cluster" data-entity="cold" data-source-line="10" data-uid="ent0007" id="cluster_cold"><rect fill="#F8FAFC" height="170.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="614" x="55" y="168.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="190.6772" x="266.6614" y="186.3921">First request to a cold function</text></g><!--cluster warm--><g class="cluster" data-entity="warm" data-source-line="21" data-uid="ent0017" id="cluster_warm"><rect fill="#F0FDF4" height="177" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="455" x="677" y="161.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="187.0845" x="810.9578" y="179.8921">With provisioned concurrency</text></g><!--entity zero--><g class="entity" data-entity="zero" data-source-line="4" data-uid="ent0002" id="entity_zero"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="130.1313" x="6" y="60.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="20" y="86.3921">0</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="102.1313" x="20" y="99.4648">idle: nothing running,</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.8291" x="20" y="112.1138">nothing billed</text></g><!--entity n--><g class="entity" data-entity="n" data-source-line="5" data-uid="ent0003" id="entity_n"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="228.4761" x="257" y="60.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.9409" x="271" y="86.3921">n</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="163.2007" x="271" y="99.4648">one execution environment per</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="200.4761" x="271" y="112.1138">concurrent request, added on demand</text></g><!--entity cap--><g class="entity" data-entity="cap" data-source-line="6" data-uid="ent0004" id="entity_cap"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="344.6152" x="570.5" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9009" x="584.5" y="79.8921">The ceiling</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="316.6152" x="584.5" y="92.9648">account concurrency quota (soft limit, e.g. 1,000 per Region)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="278.0938" x="584.5" y="105.6138">per-function reserved concurrency &#183; function timeout</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="250.5991" x="584.5" y="118.2627">budget alarms &#8212; set them, or the bill is the limit</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="11" data-uid="ent0008" id="entity_c1"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="142.1689" x="97" y="201.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1689" x="111" y="227.3921">Create environment</text></g><!--entity c2--><g class="entity" data-entity="c2" data-source-line="12" data-uid="ent0009" id="entity_c2"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="146.8853" x="257.5" y="201.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.8853" x="271.5" y="227.3921">Load runtime + code</text></g><!--entity c3--><g class="entity" data-entity="c3" data-source-line="13" data-uid="ent0010" id="entity_c3"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="103.8799" x="423" y="201.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.8799" x="437" y="227.3921">Run init code</text></g><!--entity c4--><g class="entity" data-entity="c4" data-source-line="14" data-uid="ent0011" id="entity_c4"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="116.1689" x="545" y="201.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.1689" x="559" y="227.3921">Handle request</text></g><!--entity ccap--><g class="entity" data-entity="ccap" data-source-line="18" data-uid="ent0015" id="entity_ccap"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="403.9395" x="243" y="313.8921">cold start: hundreds of ms to seconds, paid on every new environment</text></g><!--entity w1--><g class="entity" data-entity="w1" data-source-line="22" data-uid="ent0018" id="entity_w1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="224.8237" x="719.5" y="194.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="191.4263" x="733.5" y="220.8921">N environments kept initialized</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="196.8237" x="733.5" y="233.9648">created and initialized ahead of traffic</text></g><!--entity w2--><g class="entity" data-entity="w2" data-source-line="23" data-uid="ent0019" id="entity_w2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="160.6177" x="962.5" y="194.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.9136" x="976.5" y="220.8921">Handle request</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132.6177" x="976.5" y="233.9648">double-digit milliseconds</text></g><!--entity wcap--><g class="entity" data-entity="wcap" data-source-line="25" data-uid="ent0021" id="entity_wcap"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="291.2241" x="818.5" y="313.8921">no cold start &#8212; but billed continuously, used or not</text></g><g class="link" data-entity-1="zero" data-entity-2="n" data-uid="lnk5" id="link_zero_n"><polygon fill="#16A34A" points="256.7187,94.1982,247.7187,90.1982,251.7187,94.1982,247.7187,98.1982,256.7187,94.1982" style="stroke:#16A34A;stroke-width:1;"/><path d="M136.0955,94.1982 C171.3368,94.1982 209.901,94.1982 250.7187,94.1982" fill="none" style="stroke:#16A34A;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="91.3945" x="151" y="83.4541">scale on demand</text></g><g class="link" data-entity-1="n" data-entity-2="cap" data-uid="lnk6" id="link_n_cap"><polygon fill="#DC2626" points="570.1896,94.1982,561.1896,90.1982,565.1896,94.1982,561.1896,98.1982,570.1896,94.1982" style="stroke:#DC2626;stroke-width:1;"/><path d="M485.1404,94.1982 C512.051,94.1982 535.333,94.1982 564.1896,94.1982" fill="none" style="stroke:#DC2626;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="56.7012" x="499.75" y="83.4541">throttled at</text></g><g class="link" data-entity-1="c1" data-entity-2="c2" data-uid="lnk12" id="link_c1_c2"><polygon fill="#475569" points="257.2202,222.6982,248.2202,218.6982,252.2202,222.6982,248.2202,226.6982,257.2202,222.6982" style="stroke:#475569;stroke-width:1;"/><path d="M239.3125,222.6982 C245.2817,222.6982 245.251,222.6982 251.2202,222.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="c2" data-entity-2="c3" data-uid="lnk13" id="link_c2_c3"><polygon fill="#475569" points="422.8149,222.6982,413.8149,218.6982,417.8149,222.6982,413.8149,226.6982,422.8149,222.6982" style="stroke:#475569;stroke-width:1;"/><path d="M404.6875,222.6982 C410.73,222.6982 410.7725,222.6982 416.8149,222.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="c3" data-entity-2="c4" data-uid="lnk14" id="link_c3_c4"><polygon fill="#475569" points="544.708,222.6982,535.708,218.6982,539.708,222.6982,535.708,226.6982,544.708,222.6982" style="stroke:#475569;stroke-width:1;"/><path d="M527.25,222.6982 C533.0693,222.6982 532.8887,222.6982 538.708,222.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="w1" data-entity-2="w2" data-uid="lnk20" id="link_w1_w2"><polygon fill="#475569" points="962.204,222.6982,953.204,218.6982,957.204,222.6982,953.204,226.6982,962.204,222.6982" style="stroke:#475569;stroke-width:1;"/><path d="M944.5059,222.6982 C950.4052,222.6982 950.3046,222.6982 956.204,222.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="31"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="989.8438" x="70.5781" y="358.8301">Reserved concurrency = a cap (and guarantee) on how many environments a function may use, free. Provisioned concurrency = environments kept warm, paid.</text></g><!--SRC=[VLLBRXD14DtFAOgm2SAVs8coi8obA0XO88G24Wl8ejrTdccbfzlfJmO78N48xiAUet0IgiPctFu8oTACkxxztgkQ9zfAanJ2O31S_w9p9WoL5gKNTHZUIIlwiS8Q1yjKcoBgQ10-e7z0Rp0442cw88NHjeG_Ftx2mhiQ7j6x7inJ1EiYH0VQBhJLSLKK7cKKjgGa9sTVx3JeHvoCHZEj34xOk-94FbbBpzvqoFPPvlVFOwwDGRMndy1qMgU8QZO34ThgUHsRnJkBW5zHfgYT1RGFsZjReusmH7zOJZeha_TiztYVCCGU2ALG0KKhh8NDUoYTsxHWy_eVAmI9cY7AKWifNQAyNGcvWllaee3Ju1OHZAurLSD1EO1Hx-piZ3k46oofyMU7dPAnlqXMjlVo69WXjPFyzo_e7AAkqQLuc6QUL8aHX16-3YsXWVwo07hWFB-qq8CExNlRP8R0N6m0a69PC0_G__nqT7brVd5rwtLPnVuCB4o05ODR30lBVY-lnvVZoywFKf1dhBoBf3a58kwevvNseME5DIRejaPrTsm9yIujDmsnxLi1aAMuzYWYvYhWeAKHscw2Hhi1RvrGB4w63vvJJeNx4UFTY9jaWPL_rFTyr_SD8K7FpPNsdI_8MOwWty73bUGuE-1qyZmxu10ZvcZWPAfdBG8X2XydK2MhFAe0RW74Cw4NaBIYGW-MGhVgHfhm5LXiSdocGqqySpjCC9Mx8E8gJHDXRvLhB5Tbo_USgKywLh3qxa47ucLNbHrBhxlPQKXw-qozovi8S8VBsCAgQV4yeiedjkMKr69LxW6YGkAEhXkzM2oqF3gspUX_Z6HLb4jpWtsbIwAsfe7G6_oEfsMgceoxzc3BZ7Mm9QSTEbwTwnN7O4Ljaql1h7gG0kyUpvkouw9PSz6C3xXerbni1d6F9wfOj6KxIzSUCL0K5Dlk2chmvjW-US4JHpDwob2NINXX8-8praxb6g2vNkso9hRxfnOhlagFFXU80tX_N1nKuf1sRcwjqW4Zy1S0]--></g></svg>