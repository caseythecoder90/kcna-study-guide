<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="495px" preserveAspectRatio="none" style="width:1087px;height:495px;background:#FFFFFF;" version="1.1" viewBox="0 0 1087 495" width="1087px" zoomAndPan="magnify"><title>SLI &#8594; SLO &#8594; SLA &#8212; measure, target, promise</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="399.0938" x="340.0781" y="30.8838">SLI &#8594; SLO &#8594; SLA &#8212; measure, target, promise</text></g><!--cluster ex--><g class="cluster" data-entity="ex" data-source-line="12" data-uid="ent0007" id="cluster_ex"><rect fill="#FEF2F2" height="151" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="282" x="557.625" y="61.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.3193" x="630.9653" y="79.8921">The lecture's example</text></g><!--entity sli--><g class="entity" data-entity="sli" data-source-line="5" data-uid="ent0002" id="entity_sli"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="236.5005" x="269.125" y="152.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.2471" x="283.125" y="178.3921">SLI &#8212; Service Level Indicator</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="65.436" x="283.125" y="191.4648">a quantitative</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="71.5322" x="351.6172" y="191.4648">measurement</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="65.4199" x="426.2056" y="191.4648">of the service</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="158.6729" x="283.125" y="204.1138">e.g. measured availability = 97%</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="169.6675" x="283.125" y="216.7627">measured response time = 300 ms</text></g><!--entity slo--><g class="entity" data-entity="slo" data-source-line="6" data-uid="ent0003" id="entity_slo"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="220.2007" x="277.625" y="276.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.2007" x="291.625" y="302.3921">SLO &#8212; Service Level Objective</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.2861" x="291.625" y="315.4648">the internal</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="30.5615" x="353.9673" y="315.4648">target</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="50.7246" x="387.585" y="315.4648">for an SLI</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="163.8398" x="291.625" y="328.1138">e.g. responses in under 200 ms</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140.6206" x="291.625" y="340.7627">99.9% of requests succeed</text></g><!--entity sla--><g class="entity" data-entity="sla" data-source-line="7" data-uid="ent0004" id="entity_sla"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="282.2783" x="246.625" y="399.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.8589" x="260.625" y="425.8921">SLA &#8212; Service Level Agreement</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="16.5" x="260.625" y="438.9648">the</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="43.3984" x="280.1812" y="438.9648">contract</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.2676" x="326.6357" y="438.9648">with customers, with consequences</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="195.6475" x="260.625" y="451.6138">e.g. 99.99% uptime, or service credits</text></g><!--entity bad--><g class="entity" data-entity="bad" data-source-line="13" data-uid="ent0008" id="entity_bad"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="266.1113" x="565.625" y="94.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.9243" x="579.625" y="120.8921">SLI says 97% uptime, 300 ms</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.1113" x="579.625" y="133.9648">SLO wanted &lt; 200 ms &#183; SLA promised 99.99%</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="56.23" x="579.625" y="146.6138">&#8594; meeting</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="36.6738" x="638.9111" y="146.6138">neither</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="107.5562" x="678.6411" y="146.6138">the SLO nor the SLA</text></g><g class="link" data-entity-1="sli" data-entity-2="slo" data-uid="lnk5" id="link_sli_slo"><polygon fill="#475569" points="387.625,276.096,391.625,267.096,387.625,271.096,383.625,267.096,387.625,276.096" style="stroke:#475569;stroke-width:1;"/><path d="M387.625,233.3917 C387.625,247.1014 387.625,256.3934 387.625,270.096" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.3906" x="324.625" y="259.4541">compared against</text></g><g class="link" data-entity-1="slo" data-entity-2="sla" data-uid="lnk6" id="link_slo_sla"><polygon fill="#475569" points="387.625,399.5425,391.625,390.5425,387.625,394.5425,383.625,390.5425,387.625,399.5425" style="stroke:#475569;stroke-width:1;"/><path d="M387.625,357.3088 C387.625,371.0835 387.625,380.3224 387.625,393.5425" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="356.625" y="383.2041">backs</text></g><g class="caption" data-source-line="17"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1069.25" x="5" y="479.8301">SLOs are set tighter than SLAs so the internal alarm fires before the contract is breached. Error budget = 100% &#8722; SLO: the failure you are allowed before feature work stops.</text></g><!--SRC=[TPJ9QXj148RlynGLWmW8UIGdXo0p4IYGWy7WWtDBSYXrbqOTzJBkHR8J0Zc5d4FU9VSyYfuarQEH6Nc1WLcwg-l_lwgQ5yeAdIH1MOxtLtHEXx5KM7iqORmM5a_ZYWoLJJAwqBIC41ruLQyYIEL9HELi4LNK1DUN