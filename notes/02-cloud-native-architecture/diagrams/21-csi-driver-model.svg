<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="490px" preserveAspectRatio="none" style="width:1290px;height:490px;background:#FFFFFF;" version="1.1" viewBox="0 0 1290 490" width="1290px" zoomAndPan="magnify"><title>Container Storage Interface &#8212; one driver per storage system, any orchestrator</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="673.2158" x="304.8521" y="30.8838">Container Storage Interface &#8212; one driver per storage system, any orchestrator</text></g><!--cluster k8s--><g class="cluster" data-entity="k8s" data-source-line="4" data-uid="ent0002" id="cluster_k8s"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="671" x="325.46" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="71.519" x="625.2004" y="71.8921">Kubernetes</text></g><!--cluster csi--><g class="cluster" data-entity="csi" data-source-line="12" data-uid="ent0008" id="cluster_csi"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="797" x="254.46" y="193.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="227.5698" x="539.175" y="211.8921">CSI driver (gRPC over a Unix socket)</text></g><!--cluster storage--><g class="cluster" data-entity="storage" data-source-line="20" data-uid="ent0014" id="cluster_storage"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="643" x="254.46" y="345.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.0508" x="523.9346" y="363.8921">Storage systems</text></g><!--entity pvc--><g class="entity" data-entity="pvc" data-source-line="5" data-uid="ent0003" id="entity_pvc"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="216.9229" x="333.96" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.1035" x="347.96" y="112.8921">PersistentVolumeClaim</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="188.9229" x="347.96" y="125.9648">the app asks for 10Gi, ReadWriteOnce</text></g><!--entity sc--><g class="entity" data-entity="sc" data-source-line="6" data-uid="ent0004" id="entity_sc"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="223.0298" x="568.96" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.0381" x="582.96" y="112.8921">StorageClass</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="195.0298" x="582.96" y="125.9648">provisioner: rook-ceph.rbd.csi.ceph.com</text></g><!--entity kubelet--><g class="entity" data-entity="kubelet" data-source-line="7" data-uid="ent0005" id="entity_kubelet"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="177.7031" x="810.46" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="824.46" y="112.8921">kubelet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="149.7031" x="824.46" y="125.9648">on the node running the Pod</text></g><!--entity id--><g class="entity" data-entity="id" data-source-line="13" data-uid="ent0009" id="entity_id"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="220.5376" x="296.96" y="232.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.6563" x="310.96" y="258.8921">Identity service</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="192.5376" x="310.96" y="271.9648">who am I, what can I do, am I healthy</text></g><!--entity ctrl--><g class="entity" data-entity="ctrl" data-source-line="14" data-uid="ent0010" id="entity_ctrl"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="235.249" x="535.96" y="226.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.5444" x="549.96" y="252.8921">Controller service</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="207.249" x="549.96" y="265.9648">create / delete volumes, attach / detach,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="194.3853" x="549.96" y="278.6138">snapshots, expand &#8212; runs anywhere</text></g><!--entity node--><g class="entity" data-entity="node" data-source-line="15" data-uid="ent0011" id="entity_node"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="253.5322" x="789.46" y="226.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.9326" x="803.46" y="252.8921">Node service</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="215.7085" x="803.46" y="265.9648">stage, publish (mount) and unpublish the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.5322" x="803.46" y="278.6138">volume on this node &#8212; runs on every node</text></g><!--entity rook--><g class="entity" data-entity="rook" data-source-line="21" data-uid="ent0015" id="entity_rook"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="231.6021" x="296.46" y="378.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.6963" x="310.46" y="404.8921">Rook (Ceph)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="203.6021" x="310.46" y="417.9648">open source &#183; CNCF Graduated Oct 2020</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="178.5459" x="310.46" y="430.6138">storage orchestration for Kubernetes</text></g><!--entity pwx--><g class="entity" data-entity="pwx" data-source-line="22" data-uid="ent0016" id="entity_pwx"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="158.8237" x="546.96" y="384.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.2891" x="560.96" y="410.8921">Portworx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="130.8237" x="560.96" y="423.9648">commercial &#183; Pure Storage</text></g><!--entity cloud--><g class="entity" data-entity="cloud" data-source-line="23" data-uid="ent0017" id="entity_cloud"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="164.9146" x="723.96" y="384.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.1963" x="737.96" y="410.8921">Cloud disks</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="136.9146" x="737.96" y="423.9648">EBS &#183; Azure Disk &#183; GCE PD</text></g><g class="link" data-entity-1="pvc" data-entity-2="sc" data-uid="lnk6" id="link_pvc_sc"><polygon fill="#475569" points="568.9011,114.6982,559.9011,110.6982,563.9011,114.6982,559.9011,118.6982,568.9011,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M551.2334,114.6982 C557.1226,114.6982 557.0119,114.6982 562.9011,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="sc" data-entity-2="ctrl" data-uid="lnk20" id="link_sc_ctrl"><polygon fill="#475569" points="659.6532,226.6674,665.2433,218.5587,660.5747,221.753,657.3804,217.0844,659.6532,226.6674" style="stroke:#475569;stroke-width:1;"/><path d="M675.3815,142.7835 C670.9209,166.5731 665.5238,195.3578 660.759,220.7701" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="48.0234" x="678.46" y="177.9541">provision</text></g><g class="link" data-entity-1="kubelet" data-entity-2="node" data-uid="lnk21" id="link_kubelet_node"><polygon fill="#475569" points="912.5605,226.6674,915.4777,217.2605,911.9743,221.7019,907.5329,218.1984,912.5605,226.6674" style="stroke:#475569;stroke-width:1;"/><path d="M902.6575,142.7835 C905.466,166.5731 908.857,195.2964 911.857,220.7088" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.7344" x="912.46" y="177.9541">mount into the Pod</text></g><g class="link" data-entity-1="csi" data-entity-2="storage" data-uid="lnk22" id="link_csi_storage"><polygon fill="#475569" points="270.46,345.5953,274.46,336.5953,270.46,340.5953,266.46,336.5953,270.46,345.5953" style="stroke:#475569;stroke-width:1;"/><path d="M270.46,302.7544 C270.46,303.4558 270.46,304.1623 270.46,304.8734 C270.46,306.2957 270.46,307.7367 270.46,309.1938 C270.46,312.108 270.46,315.0865 270.46,318.1079 C270.46,324.1509 270.46,330.3657 270.46,336.5815 C270.46,338.1355 270.46,339.6895 270.46,341.2409 C270.46,342.0166 270.46,342.7917 270.46,343.5658 C270.46,343.9528 270.46,344.3396 270.46,344.7261 C270.46,344.9194 270.46,345.1126 270.46,345.3057 C270.46,345.4022 270.46,339.4988 270.46,339.5953" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="59.3672" x="276.46" y="329.9541">vendor API</text></g><g class="caption" data-source-line="32"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1272.9199" x="5" y="474.8301">Before CSI, every storage backend was code inside the Kubernetes tree ("in-tree" plugins). CSI moved that out: vendors ship one driver that works with Kubernetes, Mesos, Cloud Foundry and Docker alike.</text></g><!--SRC=[TLLBRjim4Dtx5DEi4i2V9Al2C0mapWT6qTQ8qNRHTi6G4sbWYIEGb1stAD13z2xTzoWzIOUIvSYV0hObayDvCtfldbwHrLbf4FhzGVq9p9aV65A9KxaVBBHLlP1YZlsYpBDEe90XJDW6HHOTp0CxbI1CRK3tf3J2tv-_W2s2SRIKW4A-VXFarpvWtWLbry1Ef-Y3KxBNwJZKGTb4Kf-yAH_HMGpeJs0qIXoNnNWCoiFYjOVl7O1Mx0oT9ybfmqVEoXmdcQByYnrv-eR3Yukn50wgAEJqmiCJExWulwSkFA0odnm5V6yrZWOnUXp12ZbkQx1YgNUXDeqAWlSjXCBnaZn9msu8ZddHqrYaVVTe-jfJl_gZEJyEulSm5j9wXg6LdYt47YmBHQwqbcnIBSpOj58ghUKHR9vIdKCIImlGSvIaeJUkeRmiV4x96BHVcuqc_iSE2PFvj27mD7cOJO3ZhO8Fbfx1irvWEDlISyziQd1fUP-YgO29QDRWqIr9OwkvLSgWSfXsOPMg05fP45JkLekGeif2kcwrcMnnoEo2H3qwphAejGCOxL05X06Os2Z2ifAA5vWGb4whZNZJtK2rZdgh2fzoa61yBfGrbRg521yrl4hHuT7wT73PReNl8eE7jVaWckf2KJvcv5CupRcquGmYKccRLI7yiBIw2wW4GhvMoBOuMKKXR5qj7wqmRaY5P0uLiIa-NWutgtExMfdlJFV-r3QploUB1naLE9t8U9orvLwW5NcLJdpaps-Ol9lSmRrJfXG23RpN0IxFBy-FyBG1UJ4LcSXgu5_SvFW8nf7TynHsOS