<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="450px" preserveAspectRatio="none" style="width:904px;height:450px;background:#FFFFFF;" version="1.1" viewBox="0 0 904 450" width="904px" zoomAndPan="magnify"><title>Self-healing &#8212; declare the desired state, Kubernetes keeps it true</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="561.1816" x="167.8154" y="30.8838">Self-healing &#8212; declare the desired state, Kubernetes keeps it true</text></g><!--cluster pods--><g class="cluster" data-entity="pods" data-source-line="6" data-uid="ent0004" id="cluster_pods"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="493" x="271.6563" y="301.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="188.519" x="423.8967" y="319.8921">Pods &#8212; desired: 4 &#183; running: 4</text></g><!--entity dep--><g class="entity" data-entity="dep" data-source-line="4" data-uid="ent0002" id="entity_dep"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="296.9683" x="139.1563" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.4009" x="153.1563" y="79.8921">Deployment</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="268.9683" x="153.1563" y="92.9648">declarative desired state: which image, how it runs,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.9629" x="153.1563" y="105.6138">how many replicas &#8212; e.g. replicas: 4</text></g><!--entity rs--><g class="entity" data-entity="rs" data-source-line="5" data-uid="ent0003" id="entity_rs"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="292.0645" x="141.6563" y="182.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4727" x="155.6563" y="208.8921">ReplicaSet</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.2168" x="155.6563" y="221.9648">created and managed by the Deployment;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="264.0645" x="155.6563" y="234.6138">keeps exactly the desired number of Pods running</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="7" data-uid="ent0005" id="entity_p1"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="52.5527" x="314.1563" y="341.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="328.1563" y="367.3921">Pod</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="8" data-uid="ent0006" id="entity_p2"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="52.5527" x="385.1563" y="341.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="399.1563" y="367.3921">Pod</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="9" data-uid="ent0007" id="entity_p3"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="52.5527" x="456.1563" y="341.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="470.1563" y="367.3921">Pod</text></g><!--entity p4--><g class="entity" data-entity="p4" data-source-line="10" data-uid="ent0008" id="entity_p4"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="56.73" x="527.1563" y="334.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="541.1563" y="360.8921">Pod</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="28.73" x="541.1563" y="373.9648">failed</text></g><!--entity p5--><g class="entity" data-entity="p5" data-source-line="11" data-uid="ent0009" id="entity_p5"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="92.8076" x="663.1563" y="334.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="677.1563" y="360.8921">Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.8076" x="677.1563" y="373.9648">replacement</text></g><g class="link" data-entity-1="p4" data-entity-2="p5" data-uid="lnk13" id="link_p4_p5"><polygon fill="#DC2626" points="663.0545,362.6982,654.0545,358.6982,658.0545,362.6982,654.0545,366.6982,663.0545,362.6982" style="stroke:#DC2626;stroke-width:1;"/><path d="M584.2616,362.6982 C606.3554,362.6982 631.3888,362.6982 657.0545,362.6982" fill="none" style="stroke:#DC2626;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="49.3711" x="599.1563" y="337.9541">detected,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="46.0313" x="600.8262" y="351.7529">replaced</text></g><g class="link" data-entity-1="dep" data-entity-2="rs" data-uid="lnk14" id="link_dep_rs"><polygon fill="#475569" points="287.6563,182.3862,291.6563,173.3862,287.6563,177.3862,283.6563,173.3862,287.6563,182.3862" style="stroke:#475569;stroke-width:1;"/><path d="M287.6563,121.7345 C287.6563,140.4022 287.6563,157.6734 287.6563,176.3862" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.0137" x="293.6563" y="156.9541">owns</text></g><g class="link" data-entity-1="rs" data-entity-2="pods" data-uid="lnk15" id="link_rs_pods"><polygon fill="#475569" points="287.6563,301.3586,291.6563,292.3586,287.6563,296.3586,283.6563,292.3586,287.6563,301.3586" style="stroke:#475569;stroke-width:1;"/><path d="M287.6563,250.7348 C287.6563,258.7476 287.6563,267.6818 287.6563,276.9053 C287.6563,281.5171 287.6563,286.2013 287.6563,290.8787 C287.6563,293.2175 287.6563,295.5546 287.6563,297.8801 C287.6563,299.0429 287.6563,294.2028 287.6563,295.3586" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.1113" x="293.6563" y="285.9541">reconciles actual state to desired state</text></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="886.8125" x="5" y="418.8301">Pod = the smallest deployable unit in Kubernetes: one or more containers sharing networking and storage &#8212; think of a Pod as an isolated host.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="651.0205" x="122.896" y="434.9287">Nobody restarts the failed Pod by hand; the ReplicaSet notices running &lt; desired and creates a new one.</text></g><!--SRC=[VLFDZjCm4BxdAORbsgPgjxk7RiY5lI4Xn1vP3bDxcbXrRCjsA0KXyH2y2tSUXITXx7JRT7-GSd3czvjlldcbZD2z92ZBsV15QtMOIOMDnoxCjiBWDBRKKUdwJXTHHKrmHtepRGcrCWty_VaB90cDde0Z-HsK9maXOgG9lElNv0r52h0bSW5KXEXxAWfF8g9fkDx5BJbjznsPU6-geBxHQZwlXw8OrPT7HLUmQvLeGNNOS8VMxb9HtvimgMOfknvLITuEpHuyzr02GmPCPLCUBIjO7l8keAfG2CPHry2XajmOviSXuOx6C8KdnYG1ZKoD69A4zJvJSHhhvYcmWGtwYYBg_Hbpfk-OCx0R-61bI8CP9le8aN7vC8QLeuOrv08y3_pv_P37VscinjlU3LEv5F-z03YlaIkx-GlsnGlsooVsqOmRL9haYDmroWE6vV_oqcPGK69kbDnO-v1znTbk3jDFhPAIp6UlcZPEwm6cMppZI3ZTvJEE1CGjsV7wzktYUd5zybp1YYcD39BavDuSGCdYHy6wWAcqEyDXFd0OFtabuMZC5A_IWDO8vY00hxb7FGWOeZrNT548T55P0vMgcGfuamKHEjIS6vCEMKYuPgPwmrfNPdHNtDqGM0-TvHFaXX6L8GOJMlJfGZbgP_qsFPD8GxIULPeL4rjbjabfcBIMg4K3AbYT9TtQ4Cjgff9iLVtUhgrCTyIGVGmPuR3WdCkQRxdyJRQVBWMCZKhGKSPG7KTFO8RhuRQCSfS6oVt-0G00]--></g></svg>