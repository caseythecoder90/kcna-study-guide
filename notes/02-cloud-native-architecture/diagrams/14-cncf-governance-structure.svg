<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="711px" preserveAspectRatio="none" style="width:1140px;height:711px;background:#FFFFFF;" version="1.1" viewBox="0 0 1140 711" width="1140px" zoomAndPan="magnify"><title>How the CNCF is governed</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="231.0205" x="450.7202" y="30.8838">How the CNCF is governed</text></g><!--cluster cncf--><g class="cluster" data-entity="cncf" data-source-line="5" data-uid="ent0003" id="cluster_cncf"><rect fill="#F8FAFC" height="523" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="755" x="200.2305" y="136.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.1055" x="559.6777" y="154.8921">CNCF</text></g><!--entity lf--><g class="entity" data-entity="lf" data-source-line="4" data-uid="ent0002" id="entity_lf"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="127.7407" x="300.2305" y="53.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.7407" x="314.2305" y="79.8921">Linux Foundation</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="77.0537" x="314.2305" y="92.9648">nonprofit parent</text></g><!--entity gb--><g class="entity" data-entity="gb" data-source-line="6" data-uid="ent0004" id="entity_gb"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="243.1714" x="538.7305" y="169.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="137.9473" x="552.7305" y="195.8921">Governing Board (GB)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="215.1714" x="552.7305" y="208.9648">business: budget, marketing, trademarks</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="103.3184" x="552.7305" y="221.6138">member companies</text></g><!--entity toc--><g class="entity" data-entity="toc" data-source-line="7" data-uid="ent0005" id="entity_toc"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="381.9497" x="469.2305" y="298.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234.7617" x="483.2305" y="324.8921">Technical Oversight Committee (TOC)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="353.9497" x="483.2305" y="337.9648">the technical governing body &#183; 11 members, 2-year staggered terms</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="351.4951" x="483.2305" y="350.6138">technical vision &#183; accepts and promotes projects &#183; aligns interfaces</text></g><!--entity tab--><g class="entity" data-entity="tab" data-source-line="8" data-uid="ent0006" id="entity_tab"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="125.813" x="240.2305" y="298.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.0845" x="254.2305" y="324.8921">End User TAB</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="92.3291" x="254.2305" y="337.9648">voice of end users;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.813" x="254.2305" y="350.6138">advisory to the TOC</text></g><!--entity tags--><g class="entity" data-entity="tags" data-source-line="9" data-uid="ent0007" id="entity_tags"><rect fill="#EFF6FF" height="80.8955" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="414.9873" x="208.7305" y="427.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.9854" x="222.7305" y="453.8921">Technical Advisory Groups (TAGs)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="295.249" x="222.7305" y="466.9648">domain experts who review projects and advise the TOC</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="386.9873" x="222.7305" y="479.6138">since 2025: Developer Experience &#183; Infrastructure &#183; Operational Resilience</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.7461" x="222.7305" y="492.2627">Security &amp; Compliance &#183; Workloads Foundation</text></g><!--entity projects--><g class="entity" data-entity="projects" data-source-line="10" data-uid="ent0008" id="entity_projects"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="271.2891" x="524.7305" y="583.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.3018" x="538.7305" y="609.8921">Projects</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="176.6177" x="538.7305" y="622.9648">Sandbox &#183; Incubating &#183; Graduated</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="243.2891" x="538.7305" y="635.6138">Kubernetes, Prometheus, Envoy, etcd, Helm ...</text></g><g class="link" data-entity-1="gb" data-entity-2="toc" data-uid="lnk9" id="link_gb_toc"><polygon fill="#475569" points="660.2305,298.3862,664.2305,289.3862,660.2305,293.3862,656.2305,289.3862,660.2305,298.3862" style="stroke:#475569;stroke-width:1;"/><path d="M660.2305,237.7345 C660.2305,256.4022 660.2305,273.6734 660.2305,292.3862" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.3711" x="666.2305" y="272.9541">elects 6 seats</text></g><g class="link" data-entity-1="tab" data-entity-2="toc" data-uid="lnk10" id="link_tab_toc"><polygon fill="#475569" points="469.1196,332.6982,460.1196,328.6982,464.1196,332.6982,460.1196,336.6982,469.1196,332.6982" style="stroke:#475569;stroke-width:1;"/><path d="M366.2331,332.6982 C395.4581,332.6982 425.9218,332.6982 463.1196,332.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.3711" x="381.2305" y="307.9541">elects 2 seats</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="40.6875" x="397.5723" y="321.7529">advises</text></g><g class="link" data-entity-1="toc" data-entity-2="projects" data-uid="lnk12" id="link_toc_projects"><polygon fill="#475569" points="660.2305,366.7158,656.2305,375.7158,660.2305,371.7158,664.2305,375.7158,660.2305,366.7158" style="stroke:#475569;stroke-width:1;"/><path d="M660.2305,372.7158 C660.2305,427.1012 660.2305,528.9198 660.2305,583.4535" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.7324" x="666.2305" y="472.9541">maintainers elect 1 seat</text></g><g class="link" data-entity-1="toc" data-entity-2="tags" data-uid="lnk13" id="link_toc_tags"><polygon fill="#475569" points="488.4404,427.6899,498.2559,426.8792,492.8268,425.29,494.416,419.861,488.4404,427.6899" style="stroke:#475569;stroke-width:1;"/><path d="M599.9158,366.6983 C566.1873,385.1522 529.1862,405.3966 493.7041,424.81" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="43.3477" x="565.2305" y="401.9541">charters</text></g><g class="link" data-entity-1="tags" data-entity-2="projects" data-uid="lnk14" id="link_tags_projects"><polygon fill="#475569" points="600.258,583.6688,594.3997,575.7517,595.9078,581.2038,590.4557,582.7119,600.258,583.6688" style="stroke:#475569;stroke-width:1;"/><path d="M477.5689,508.9042 C505.3497,526.6231 538.7339,547.5517 569.2305,565.6982 C579.1912,571.6252 584.6389,574.8182 595.0378,580.7108" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.0391" x="575.2305" y="543.9541">review, guide,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="63.3574" x="580.5713" y="557.7529">recommend</text></g><g class="link" data-entity-1="toc" data-entity-2="projects" data-uid="lnk15" id="link_toc_projects"><polygon fill="#475569" points="727.6104,583.5423,737.3602,582.1491,731.8462,580.8857,733.1096,575.3717,727.6104,583.5423" style="stroke:#475569;stroke-width:1;"/><path d="M738.5675,366.8609 C763.5092,381.614 788.2376,401.6544 802.2305,427.6982 C819.269,459.4108 818.2218,476.4449 802.2305,508.6982 C786.4085,540.6101 761.2293,562.4573 732.6934,580.3544" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.3789" x="820.2305" y="465.9541">accepts, promotes,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.707" x="821.5664" y="479.7529">archives (2/3 vote)</text></g><g class="link" data-entity-1="lf" data-entity-2="cncf" data-uid="lnk16" id="link_lf_cncf"><polygon fill="#475569" points="364.2305,136.5121,368.2305,127.5121,364.2305,131.5121,360.2305,127.5121,364.2305,136.5121" style="stroke:#475569;stroke-width:1;"/><path d="M364.2305,109.9281 C364.2305,116.3591 364.2305,123.5146 364.2305,130.9193 C364.2305,132.7705 364.2305,128.6372 364.2305,130.5121" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="21"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1122.4609" x="5" y="679.8301">Open governance: no single vendor decides. The TOC's 11 seats come from four constituencies (6 Governing Board, 2 end users, 1 project maintainers, 2 chosen by the TOC itself),</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="415.543" x="358.459" y="695.9287">and every project decision is a recorded vote after public comment.</text></g><!--SRC=[TLLDRzj64BtpLqnoQ6o0aY85oK4H1DYkemGfwY1raOilozqXjVLobzWFschGtzLxVrbcI8gcxGQG094xy_RDcpUZ5zfAanJ2VBxeFz4v4nPAYygBEYnkfHMpkCSQvqsgJHPrD0WVtHtGIxZu_U83w02LQz5RL5dcKKPXAufv-PkswHu-k6ILYDhP6xi9-czSBvTRwspZNQaZDCAZZPi5dsnVmcPJfuXgkmKHm9HJEBwB0ohlKjC7I2jB-9u1JC9s7HLjApXtmYiusPsVJcukKj0MGrX3aLI5COTQ-5kCb913z48XFuU1q2Innhf03zBLZR0QmuIoa99gw2bLnMCwroZtLajXu8fu1Ltj8roukjOn8iB9zTN5b1rh6iUCQYobSEe0__qBooNqF48Egza1XOSGHLMXHqM9lluVuWzuhGxK1iPXnaqC8Am2QaJj8WR-yHSH3rs0qPKDe2s1baB-jDpevEDwBmdnpq12NP-TJqYqJai4LmBIUQBpyFuvKw68eVC7GktSHU9ChcsCq7QuLVnKvRCZnevj4aZXirsOIgn