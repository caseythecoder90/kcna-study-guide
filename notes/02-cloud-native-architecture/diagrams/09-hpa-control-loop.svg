<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="667px" preserveAspectRatio="none" style="width:929px;height:667px;background:#FFFFFF;" version="1.1" viewBox="0 0 929 667" width="929px" zoomAndPan="magnify"><title>HorizontalPodAutoscaler &#8212; the control loop, every 15 seconds</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="539.1123" x="191.4438" y="30.8838">HorizontalPodAutoscaler &#8212; the control loop, every 15 seconds</text></g><!--entity kubelet--><g class="entity" data-entity="kubelet" data-source-line="4" data-uid="ent0002" id="entity_kubelet"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="213.2437" x="6" y="209.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.4199" x="20" y="235.8921">kubelets</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.2437" x="20" y="248.9648">report container CPU / memory usage</text></g><!--entity ms--><g class="entity" data-entity="ms" data-source-line="5" data-uid="ent0003" id="entity_ms"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="251.8027" x="280.5" y="203.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.3354" x="294.5" y="229.8921">metrics-server</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="223.8027" x="294.5" y="242.9648">aggregates usage cluster-wide and exposes it</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="192.5591" x="294.5" y="255.6138">through the Metrics API (metrics.k8s.io)</text></g><!--entity hpa--><g class="entity" data-entity="hpa" data-source-line="6" data-uid="ent0004" id="entity_hpa"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="323.2061" x="600" y="190.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="91.0127" x="614" y="216.8921">HPA controller</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="265.8853" x="614" y="229.9648">in kube-controller-manager &#183; reads the HPA object,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="295.2061" x="614" y="242.6138">compares current utilization to the target and computes:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="276.3105" x="614" y="255.2627">desired = ceil( current &#215; currentMetric / targetMetric )</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="217.0566" x="614" y="267.9116">several metrics &#8594; takes the largest result</text></g><!--entity obj--><g class="entity" data-entity="obj" data-source-line="7" data-uid="ent0005" id="entity_obj"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="235.8613" x="643.5" y="61.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="155.2954" x="657.5" y="87.8921">HorizontalPodAutoscaler</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="172.9922" x="657.5" y="100.9648">scaleTargetRef: Deployment web</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="207.8613" x="657.5" y="113.6138">min 2 &#183; max 10 &#183; cpu 60% &#183; memory 70%</text></g><!--entity dep--><g class="entity" data-entity="dep" data-source-line="8" data-uid="ent0006" id="entity_dep"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="210.7837" x="462" y="345.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="103.2954" x="476" y="371.8921">Deployment web</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="182.7837" x="476" y="384.9648">spec.replicas is written by the HPA</text></g><!--entity rs--><g class="entity" data-entity="rs" data-source-line="9" data-uid="ent0007" id="entity_rs"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="207.6953" x="413.5" y="462.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4727" x="427.5" y="488.8921">ReplicaSet</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="179.6953" x="427.5" y="501.9648">reconciles the Pod count to match</text></g><!--entity pods--><g class="entity" data-entity="pods" data-source-line="10" data-uid="ent0008" id="entity_pods"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="294.5513" x="265" y="555.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.7827" x="279" y="581.8921">Pods</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="266.5513" x="279" y="594.9648">each container declares CPU / memory requests &#8212;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="254.2891" x="279" y="607.6138">utilization % is measured against those requests</text></g><g class="link" data-entity-1="kubelet" data-entity-2="ms" data-uid="lnk9" id="link_kubelet_ms"><polygon fill="#475569" points="280.3039,237.6982,271.3039,233.6982,275.3039,237.6982,271.3039,241.6982,280.3039,237.6982" style="stroke:#475569;stroke-width:1;"/><path d="M219.0564,237.6982 C238.9405,237.6982 253.8952,237.6982 274.3039,237.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="32.6953" x="233.75" y="226.9541">usage</text></g><g class="link" data-entity-1="ms" data-entity-2="hpa" data-uid="lnk10" id="link_ms_hpa"><polygon fill="#475569" points="599.7325,237.6982,590.7325,233.6982,594.7325,237.6982,590.7325,241.6982,599.7325,237.6982" style="stroke:#475569;stroke-width:1;"/><path d="M532.6593,237.6982 C554.382,237.6982 571.2273,237.6982 593.7325,237.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="38.666" x="547.25" y="226.9541">metrics</text></g><g class="link" data-entity-1="obj" data-entity-2="hpa" data-uid="lnk11" id="link_obj_hpa"><polygon fill="#475569" points="761.5,190.5175,765.5,181.5175,761.5,185.5175,757.5,181.5175,761.5,190.5175" style="stroke:#475569;stroke-width:1;"/><path d="M761.5,129.8763 C761.5,147.9887 761.5,164.6992 761.5,184.5175" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="30.6855" x="767.5" y="164.9541">target</text></g><g class="link" data-entity-1="hpa" data-entity-2="dep" data-uid="lnk12" id="link_hpa_dep"><polygon fill="#475569" points="606.6348,345.667,616.3133,343.8433,610.7488,342.8254,611.7667,337.2609,606.6348,345.667" style="stroke:#475569;stroke-width:1;"/><path d="M694.7362,284.8134 C665.3623,305.1026 636.815,324.8209 611.5716,342.2571" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="66.6914" x="670.5" y="319.9541">sets replicas</text></g><g class="link" data-entity-1="dep" data-entity-2="rs" data-uid="lnk13" id="link_dep_rs"><polygon fill="#475569" points="529.2642,462.6405,536.5211,455.9817,531.2579,458.0551,529.1845,452.7919,529.2642,462.6405" style="stroke:#475569;stroke-width:1;"/><path d="M555.6507,401.9516 C547.6803,420.2836 539.6092,438.8471 531.6566,457.1381" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="rs" data-entity-2="pods" data-uid="lnk14" id="link_rs_pods"><polygon fill="#475569" points="448.3184,555.6088,457.6435,552.4398,451.9911,552.216,452.215,546.5635,448.3184,555.6088" style="stroke:#475569;stroke-width:1;"/><path d="M488.2516,518.7182 C475.8727,530.1539 465.7397,539.5149 452.7257,551.5374" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="kubelet" data-entity-2="pods" data-uid="lnk16" id="link_kubelet_pods"><polygon fill="#475569" points="135.7909,265.8709,138.611,275.3074,139.0448,269.6672,144.685,270.1011,135.7909,265.8709" style="stroke:#475569;stroke-width:1;"/><path d="M139.6956,270.4265 C194.0059,333.7884 324.9957,486.6099 384.0499,555.5065" fill="none" style="stroke:#475569;stroke-width:1.6;stroke-dasharray:7,7;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="32.6953" x="293.5" y="436.9541">usage</text></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="689.4932" x="116.2534" y="635.8301">No resource requests on the containers means no utilization figure, and the HPA takes no action on that metric.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="767.6416" x="77.1792" y="651.9287">Scale-up is immediate; scale-down waits out a 300 s stabilization window by default so brief dips don't flap the replica count.</text></g><!--SRC=[RLJBRXCn5DtdAowLAbgfCqb0F1H2f0eMPG6AMjYnSJmt4nC_1lkQj5snuWCG4f_27lwaNyArPv9Eb4fHD3Esppttt7FyI5cfOuLGbiFsHyxfCAoKgBqmORYMLXIqGeDb4uqUa2ADSE6ykdMMX9wxwZoI2r9ez73t_HVmPf2yvfq6xLnp1lWD_GsCdq50NgZ2OE1Hah0r8nsjum8rKlXifq7TucGyddbidASC8fHbs3VpJp04WyOnJWoYnkamRPuTmNHg8c4rcu48q67ruGsILp8K0Jspw1KHTUsn5eIXHGJM8H3wOgDO3c4hmEl61LvMr5NhdQQLTx5UvMRVjoNWVFuEJhfwvVfbA9KxVPYd2NsA5_FphM1wZwAokQFYVh4mmZ9N3t__W4THXKmW0RZ55qOyEsGgdMc4vpPaz1ujGIIbrQqWvIoGom0aV8sKcqxRcMYO729L69J72bw3HALFTe3_VcyVMoLuL2rWztfw21MI9OI6JYsu-_6JpwonxKUdqu6umn0rzIGKKdALLiDL8_P4VDYH_PhfmyTCx1AN4tYBZNOt9dMmmSKXHyFoFqb26t4Dur5waas4vwFZ_B4ruulHyOuVa-8fz4djb-XpQL2MR7Ej99zI0JPU4Q65nSrsedtO2fi-x6Lxy0ffBpHi4wbqfo6hmBECN9bdR0J9LH_GxncGz_RZXqAkUk6hKEfieBqKUlmQUKOXHVvGkxx7ZbD_1aM8oJoYPbIUBQquMpkKtenhvxgKD2vT5LsceV2gNb4nu_30f8tiW1ztdzaF_Bqpr8070KNbDdQtqbfoa5ws2omhBmI-V60xYq7wjbrFAeNTMwQJ_g2CJJdRNZOxCWCfcjpmLCq-k6HU5xsyxn5IthgxCIkRLR41hDlBv5BLhDHPJkCstMqsUAEGUK-64jIrMqw7AgclPbV9uqLiakJA6EHhdF0LPEldFc0ZLA8IEUtmT3I20874uhxwHbdUbtnOuL9m_20uM7Y5IwXKmrPqzZ71Keica-jqQwsMUVm7]--></g></svg>