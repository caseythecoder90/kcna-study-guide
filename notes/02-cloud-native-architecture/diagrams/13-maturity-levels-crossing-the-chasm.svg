<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="319px" preserveAspectRatio="none" style="width:1042px;height:319px;background:#FFFFFF;" version="1.1" viewBox="0 0 1042 319" width="1042px" zoomAndPan="magnify"><title>CNCF maturity levels mapped to the technology adoption curve (&#8220;Crossing the Chasm&#8221;)</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="754.1016" x="139.9678" y="30.8838">CNCF maturity levels mapped to the technology adoption curve (&#8220;Crossing the Chasm&#8221;)</text></g><!--cluster tiers--><g class="cluster" data-entity="tiers" data-source-line="4" data-uid="ent0002" id="cluster_tiers"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="786" x="168.5186" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="189.2173" x="466.9099" y="71.8921">Adoption tier (Geoffrey Moore)</text></g><!--cluster levels--><g class="cluster" data-entity="levels" data-source-line="18" data-uid="ent0014" id="cluster_levels"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="700" x="102.5186" y="158.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="278.8271" x="313.105" y="176.8921">CNCF maturity level &#8212; the signal to adopters</text></g><!--entity t1--><g class="entity" data-entity="t1" data-source-line="5" data-uid="ent0003" id="entity_t1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="88.7026" x="177.0186" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.7026" x="191.0186" y="112.8921">Innovators</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="42.1792" x="191.0186" y="125.9648">&#8220;techies&#8221;</text></g><!--entity t2--><g class="entity" data-entity="t2" data-source-line="6" data-uid="ent0004" id="entity_t2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="111.8208" x="284.5186" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.8208" x="298.5186" y="112.8921">Early adopters</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="59.2915" x="298.5186" y="125.9648">&#8220;visionaries&#8221;</text></g><!--entity chasm--><g class="entity" data-entity="chasm" data-source-line="7" data-uid="ent0005" id="entity_chasm"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="185.0938" x="415.0186" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="77.2764" x="429.0186" y="112.8921">THE CHASM</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.0938" x="429.0186" y="125.9648">where most technologies stall</text></g><!--entity t3--><g class="entity" data-entity="t3" data-source-line="8" data-uid="ent0006" id="entity_t3"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="106.7363" x="618.0186" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.7363" x="632.0186" y="112.8921">Early majority</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.1792" x="632.0186" y="125.9648">&#8220;pragmatists&#8221;</text></g><!--entity t4--><g class="entity" data-entity="t4" data-source-line="9" data-uid="ent0007" id="entity_t4"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="102.5776" x="743.0186" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.4199" x="757.0186" y="112.8921">Late majority</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="74.5776" x="757.0186" y="125.9648">&#8220;conservatives&#8221;</text></g><!--entity t5--><g class="entity" data-entity="t5" data-source-line="10" data-uid="ent0008" id="entity_t5"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="82.209" x="864.5186" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.209" x="878.5186" y="112.8921">Laggards</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="47.0615" x="878.5186" y="125.9648">&#8220;skeptics&#8221;</text></g><!--entity l1--><g class="entity" data-entity="l1" data-source-line="19" data-uid="ent0015" id="entity_l1"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="163.7114" x="110.5186" y="191.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.3208" x="124.5186" y="217.8921">Sandbox</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="116.1499" x="124.5186" y="230.9648">experiments, early work</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="135.7114" x="124.5186" y="243.6138">low barrier &#183; not compulsory</text></g><!--entity l2--><g class="entity" data-entity="l2" data-source-line="20" data-uid="ent0016" id="entity_l2"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="237.6553" x="292.5186" y="191.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.7173" x="306.5186" y="217.8921">Incubating</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="168.6738" x="306.5186" y="230.9648">used in production by a few; the</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="209.6553" x="306.5186" y="243.6138">significant barrier &#8212; most due diligence</text></g><!--entity l3--><g class="entity" data-entity="l3" data-source-line="21" data-uid="ent0017" id="entity_l3"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="245.583" x="548.5186" y="191.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.0127" x="562.5186" y="217.8921">Graduated</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="217.583" x="562.5186" y="230.9648">stable, widely adopted, production-ready;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="185.1631" x="562.5186" y="243.6138">the &#8220;obvious path&#8221; from incubating</text></g><g class="link" data-entity-1="t1" data-entity-2="t2" data-uid="lnk9" id="link_t1_t2"><polygon fill="#475569" points="284.4468,114.6982,275.4468,110.6982,279.4468,114.6982,275.4468,118.6982,284.4468,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M266.1436,114.6982 C272.2446,114.6982 272.3457,114.6982 278.4468,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="t2" data-entity-2="chasm" data-uid="lnk10" id="link_t2_chasm"><polygon fill="#475569" points="414.8144,114.6982,405.8144,110.6982,409.8144,114.6982,405.8144,118.6982,414.8144,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M396.6201,114.6982 C402.6849,114.6982 402.7496,114.6982 408.8144,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="chasm" data-entity-2="t3" data-uid="lnk11" id="link_chasm_t3"><polygon fill="#475569" points="617.9463,114.6982,608.9463,110.6982,612.9463,114.6982,608.9463,118.6982,617.9463,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M600.0889,114.6982 C606.0413,114.6982 605.9938,114.6982 611.9463,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="t3" data-entity-2="t4" data-uid="lnk12" id="link_t3_t4"><polygon fill="#475569" points="742.8982,114.6982,733.8982,110.6982,737.8982,114.6982,733.8982,118.6982,742.8982,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M725.3311,114.6982 C731.1868,114.6982 731.0425,114.6982 736.8982,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="t4" data-entity-2="t5" data-uid="lnk13" id="link_t4_t5"><polygon fill="#475569" points="864.2154,114.6982,855.2154,110.6982,859.2154,114.6982,855.2154,118.6982,864.2154,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M846.1162,114.6982 C852.1493,114.6982 852.1823,114.6982 858.2154,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="l1" data-entity-2="l2" data-uid="lnk18" id="link_l1_l2"><polygon fill="#475569" points="292.2876,225.6982,283.2876,221.6982,287.2876,225.6982,283.2876,229.6982,292.2876,225.6982" style="stroke:#475569;stroke-width:1;"/><path d="M274.6436,225.6982 C280.5249,225.6982 280.4063,225.6982 286.2876,225.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="l2" data-entity-2="l3" data-uid="lnk19" id="link_l2_l3"><polygon fill="#475569" points="548.4906,225.6982,539.4906,221.6982,543.4906,225.6982,539.4906,229.6982,548.4906,225.6982" style="stroke:#475569;stroke-width:1;"/><path d="M530.6006,225.6982 C536.5639,225.6982 536.5272,225.6982 542.4906,225.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="30"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1024.0371" x="5" y="287.8301">Sandbox &#8596; innovators &#183; Incubating &#8596; early adopters &#183; Graduated &#8596; early majority. A graduated project has crossed the chasm: it is safe for mainstream enterprises.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="975.8574" x="29.0898" y="303.9287">Archived is the fourth state &#8212; inactive projects the TOC no longer supports. Late majority and laggards have no CNCF level; they adopt long after graduation.</text></g><!--SRC=[VLHDRnCn4BtlhnWuWTGaIbik44Mg8YX8V1pQ6t1mrhExfbxFofvD20Yf9tu1H_WTtFaf_IMCdKswMKgbI57ioVERDs_U0-Dossg4yNYo_J2H3HDjLEbL7IPNkLCZhh36STFMDcF35c7nTl42QiMjDxm1YokqGNut3MfW0ga7nhnoPAdSWDBKi247UUjN28zkhdykF8LWN9bA5vKAzStrhyTPvZ5dvKfvuk7PxbziqCEZSwIYyBY1DqGU7p-4sQpqr3RpEQYGQW9ypG1w2A-SevLYyk63cmNp1PzEftDvF58p6EJ5sIGUpoDOOvLn7TZq4EUvyhRh0eTOAnE4e_BtuXqVubs-V0wBbsSNRtfGwmezGas1RvKJJ0YihEt1BfNUWkPHjBjurkeJnR4SycoyAcLW9l0zF4yEyLuhnl_0vUG2UX7Nh8QDrorZnv5FXu1bgRmUI1YkK0QTtmFpH61u2YDloef7ywsWV7nxi1CZVVVgOaDyqZk8XFYqT_0a-tRWkZkS3JVNFv9FWocTij7WEo_iNNXEr97jbc5WnGlbz98-znh7pmrwKwFZS0IO9hScVzKfq2kqj8QbyZvkmP_Vu8WXfxffRI2_kLimEnqkGjukPLQkxE6sGPRLE6WywJPFcxOKbqE1wsUntN-PnFvDONBbUCyeQfDSgri4RQmfqUMufnN93Dn_xfLknL