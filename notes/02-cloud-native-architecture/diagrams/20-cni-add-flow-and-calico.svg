<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="669px" preserveAspectRatio="none" style="width:1330px;height:669px;background:#FFFFFF;" version="1.1" viewBox="0 0 1330 669" width="1330px" zoomAndPan="magnify"><title>Container Network Interface &#8212; what happens when a Pod gets its network</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="635.1152" x="343.6138" y="30.8838">Container Network Interface &#8212; what happens when a Pod gets its network</text></g><!--cluster calico--><g class="cluster" data-entity="calico" data-source-line="16" data-uid="ent0013" id="cluster_calico"><rect fill="#F0FDF4" height="434" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="382" x="263.6714" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="358.979" x="275.1819" y="201.8921">Where Calico fits &#8212; a CNI plugin plus a running dataplane</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="4" data-uid="ent0002" id="entity_s1"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="369.0723" x="477.1714" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.0723" x="491.1714" y="79.8921">1 &#183; kubelet asks the CRI runtime to create the Pod sandbox</text></g><!--entity s2--><g class="entity" data-entity="s2" data-source-line="5" data-uid="ent0003" id="entity_s2"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="455.0576" x="588.1714" y="132.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.0576" x="602.1714" y="158.8921">2 &#183; runtime creates the pause container and its empty network namespace</text></g><!--entity s3--><g class="entity" data-entity="s3" data-source-line="6" data-uid="ent0004" id="entity_s3"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="427.9907" x="653.6714" y="216.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.0508" x="667.6714" y="242.8921">3 &#183; runtime executes the CNI plugin binary</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="308.0054" x="667.6714" y="255.9648">from /opt/cni/bin, config from /etc/cni/net.d, JSON on stdin,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.9907" x="667.6714" y="268.6138">env: CNI_COMMAND=ADD &#183; CNI_CONTAINERID &#183; CNI_NETNS &#183; CNI_IFNAME</text></g><!--entity s4--><g class="entity" data-entity="s4" data-source-line="7" data-uid="ent0005" id="entity_s4"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="349.5352" x="692.6714" y="320.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.1689" x="706.6714" y="346.8921">4 &#183; plugin wires the namespace</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="293.584" x="706.6714" y="359.9648">creates a veth pair, moves one end into the Pod's netns,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="321.5352" x="706.6714" y="372.6138">asks IPAM for an address, sets routes, connects the host end</text></g><!--entity s5--><g class="entity" data-entity="s5" data-source-line="8" data-uid="ent0006" id="entity_s5"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="345.8398" x="694.6714" y="430.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="317.8398" x="708.6714" y="456.8921">5 &#183; plugin returns JSON: interfaces, ips, routes, dns</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="247.5269" x="708.6714" y="469.9648">that IP is the Pod IP kubectl shows with -o wide</text></g><!--entity s6--><g class="entity" data-entity="s6" data-source-line="9" data-uid="ent0007" id="entity_s6"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="297.1406" x="719.1714" y="547.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.1406" x="733.1714" y="573.8921">on delete &#183; CNI_COMMAND=DEL undoes it all</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="17" data-uid="ent0014" id="entity_c1"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="204.6616" x="430.1714" y="216.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="176.6616" x="444.1714" y="242.8921">calico + calico-ipam binaries</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="170.5107" x="444.1714" y="255.9648">the CNI plugin invoked in step 3;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.9146" x="444.1714" y="268.6138">IPs from Calico IP pools</text></g><!--entity c2--><g class="entity" data-entity="c2" data-source-line="18" data-uid="ent0015" id="entity_c2"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="282.2944" x="348.6714" y="320.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="197.2153" x="362.6714" y="346.8921">calico-node DaemonSet &#8212; Felix</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="230.4253" x="362.6714" y="359.9648">runs continuously on every node: programs</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="254.2944" x="362.6714" y="372.6138">routes and iptables / eBPF rules, enforces policy</text></g><!--entity c3--><g class="entity" data-entity="c3" data-source-line="19" data-uid="ent0016" id="entity_c3"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="296.3506" x="328.6714" y="424.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.9009" x="342.6714" y="450.8921">BIRD (BGP) or VXLAN / IPIP</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="237.1929" x="342.6714" y="463.9648">tells every node how to reach every Pod IP &#8212;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="268.3506" x="342.6714" y="476.6138">routed with no overlay, or an overlay where needed</text></g><!--entity c4--><g class="entity" data-entity="c4" data-source-line="20" data-uid="ent0017" id="entity_c4"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="333.5938" x="303.6714" y="528.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.2153" x="317.6714" y="554.8921">NetworkPolicy enforcement</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="305.5938" x="317.6714" y="567.9648">Kubernetes NetworkPolicy has no built-in implementation;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.7095" x="317.6714" y="580.6138">Felix turns those objects (and Calico's own</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201.7168" x="317.6714" y="593.2627">GlobalNetworkPolicy) into kernel rules</text></g><g class="link" data-entity-1="s1" data-entity-2="s2" data-uid="lnk8" id="link_s1_s2"><polygon fill="#475569" points="774.5555,132.6403,768.2946,125.0377,770.0834,130.4043,764.7168,132.1931,774.5555,132.6403" style="stroke:#475569;stroke-width:1;"/><path d="M702.9406,96.8328 C725.1252,107.9252 747.0278,118.8765 769.189,129.957" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s2" data-entity-2="s3" data-uid="lnk9" id="link_s2_s3"><polygon fill="#475569" points="849.4592,216.6011,848.6248,206.7877,847.0487,212.2205,841.6159,210.6444,849.4592,216.6011" style="stroke:#475569;stroke-width:1;"/><path d="M826.9546,175.7033 C833.5261,187.6457 839.0752,197.7302 846.5666,211.3444" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s3" data-entity-2="s4" data-uid="lnk10" id="link_s3_s4"><polygon fill="#475569" points="867.6714,320.3989,871.6714,311.3989,867.6714,315.3989,863.6714,311.3989,867.6714,320.3989" style="stroke:#475569;stroke-width:1;"/><path d="M867.6714,284.8147 C867.6714,296.2162 867.6714,302.9829 867.6714,314.3989" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s4" data-entity-2="s5" data-uid="lnk11" id="link_s4_s5"><polygon fill="#475569" points="867.6714,430.5358,871.6714,421.5358,867.6714,425.5358,863.6714,421.5358,867.6714,430.5358" style="stroke:#475569;stroke-width:1;"/><path d="M867.6714,388.8147 C867.6714,402.3103 867.6714,411.7188 867.6714,424.5358" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s5" data-entity-2="s6" data-uid="lnk12" id="link_s5_s6"><polygon fill="#475569" points="867.6714,547.5728,871.6714,538.5728,867.6714,542.5728,863.6714,538.5728,867.6714,547.5728" style="stroke:#475569;stroke-width:1;"/><path d="M867.6714,486.7975 C867.6714,505.6277 867.6714,524.338 867.6714,541.5728" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s3" data-entity-2="c1" data-uid="lnk21" id="link_s3_c1"><polygon fill="#475569" points="635.396,250.6982,644.396,254.6982,640.396,250.6982,644.396,246.6982,635.396,250.6982" style="stroke:#475569;stroke-width:1;"/><path d="M653.5425,250.6982 C647.4937,250.6982 647.4448,250.6982 641.396,250.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1312.3428" x="5" y="637.8301">CNI itself runs only at Pod create and delete &#8212; it is a contract between the runtime and a plugin executable. The provider's agent (Felix for Calico, the Cilium agent, kube-flannel) is what keeps working afterwards.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="748.6104" x="286.8662" y="653.9287">A node stays NotReady until a CNI plugin is installed; Docker Desktop and minikube hide this, kubeadm makes you do it.</text></g><!--SRC=[TLRTRYir4BxFKmpdXbRaHsdISz4J8gLDM-tXD2TgAq02X9pr937nsYlRcpGW91w2T-6UH-59c5dlfXiQfBQflUkPRsQ-xtE-K2RLXKJeTdln9rYhVKygiN8YyxrDQaGdh373RbvakXLKq0WtrWIX33gOOTXPju7417HBaIByyyUVi5kB06kHvsWyBT20WBcLiCBWGT6lYSTQBOTf46P5CT_ruU-_O5CiK6C0uJSUA2_SF2RW2XDKXX0if0v5mF891_J2o8LzUGUZKQu9qNXC9y7tct4lE6uT8fwFeNDHUDevr4AnId2OvM5VGmGZClGvLVRV91VD98Dc4dp1jAYptCmIo7MnKWOMoWYt_z6ClFeLh_hzyTBP37es3xtKg1uzRZESfLf1V88XBPyGbgvimyUdppEm1doGzEgens76ZN1ejbUSx-URpmyFazdqwybqohZYrknvaink7vF3rkpsUVPKBvAxsUJXjeh9fOeqHHEgMWVDMeTyfYfffrnLvw5F3K1rjmLiCQofuSgr8RDRshA6-iGDDpJLQfnVbiGm_aHf9H-I-UG1bfOd1K9AokpRu9bJpdA_o-uP0XeHhQqFdADHrCfQMPKqR9PqsIZ9OIWSyPQxVSNu8h4fkihfJvrA6j_05vZnoHoKFt2JLipcD6ZmQxiZ8IZgGSVIfyJJc2wRc6ZGahM0hoECKvtUVeB2I8ki9H1QSvICKDLXthTy7phIxandp3pr5w-hGSiFNbV3bX- -hYvR_l9rzVv8dT-jqH6PXLQfXINBX8KkclIc3nurgS0eim8fWY2zc58uAsfRVd-eD8rnVci1D79KkrzLZpig5raKZSBZPX_9IfcjtI1JYPI1EGm-lELFClTHKrK5D9oSdUxa7DB-ALmTOyaefm8pQvx8ehZ-EzJgfP66QlUbeoXJsCBhFSiLj-Z8J-Zq5UJEbiRw5c7aLJIXF8Y5faKFy7f-HntLp3Wqn7qY8Y4dFFlJq2-EeLydZrCukxwVdmFfvjllFqrc53MP9_DcFr5htu19ojcnsP9wqtMrNp6QYluVw3BosrWWVJijzcs8IgsMV0yGWmoYnDEIJ0V7sAkxPLvMMrUVaIarKdz32dDa6jILuzVN592mB0gbGuT9akMwF2o2ikO4GyfHGfH-8Ej0i8jVIYyvuvb4tf13aJhU7hxNTY7q4OBpQ6qRXgVZ24zNFQIgKzBh3sib9PgVAlsLaqmltkvpbzB1s_rXw_TIsqwjre4t-gKDrAyTjij2MgrKvDm96AanQuaKZNe99O6j8UAId_7CgmkNMr2v4VEUV4UnrfdgJgG15bGwqZtFqgolGJuZQf76Ev5ftOLdldoTtP8FEkgeMD5Ou2mEWEqzzheThq-bLP75TzgbeNQMP2hKqtE6K7xJs23cz2-rddr7BCcnTy99tntr54z9ZIUHrpw8FH75XaSKSW-CKnzx68LKXbxJ6kK7cDgKvWTJz9jWyxAWJ1d5A83Qojz3b8-eXCmW4nlYuTuM82srg4p_Bm00]--></g></svg>