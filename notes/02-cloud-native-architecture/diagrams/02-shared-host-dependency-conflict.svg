<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="471px" preserveAspectRatio="none" style="width:777px;height:471px;background:#FFFFFF;" version="1.1" viewBox="0 0 777 471" width="777px" zoomAndPan="magnify"><title>Many applications on one host &#8212; the shared-dependency problem</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="569.083" x="96.4585" y="30.8838">Many applications on one host &#8212; the shared-dependency problem</text></g><!--cluster host--><g class="cluster" data-entity="host" data-source-line="4" data-uid="ent0002" id="cluster_host"><rect fill="#F8FAFC" height="226" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="661" x="14" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="222.498" x="233.251" y="79.8921">Linux host &#8212; one shared filesystem</text></g><!--entity problem--><g class="entity" data-entity="problem" data-source-line="18" data-uid="ent0013" id="entity_problem"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="495.416" x="240.5" y="316.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="467.416" x="254.5" y="342.8921">Upgrade the library for app3 and app2 breaks. Leave it and app3 is blocked.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="377.1152" x="254.5" y="355.9648">Neither application can change independently &#8212; the host couples them.</text></g><!--entity answer--><g class="entity" data-entity="answer" data-source-line="19" data-uid="ent0014" id="entity_answer"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="566.1797" x="205" y="409.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="538.1797" x="219" y="435.8921">Cloud native answer: package each application with its own dependencies (containers)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="383.2705" x="219" y="448.9648">app2 ships v1.0, app3 ships v2.0, both run side by side on the same host.</text></g><!--entity nginx--><g class="entity" data-entity="nginx" data-source-line="5" data-uid="ent0003" id="entity_nginx"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="147.2222" x="22.5" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.0781" x="36.5" y="120.8921">nginx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="119.2222" x="36.5" y="133.9648">/usr/*/nginx &#183; /etc/*/nginx</text></g><!--entity app1--><g class="entity" data-entity="app1" data-source-line="6" data-uid="ent0004" id="entity_app1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="143.5698" x="188" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.9199" x="202" y="120.8921">app1</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="115.5698" x="202" y="133.9648">/usr/*/app1 &#183; /etc/*/app1</text></g><!--entity app2--><g class="entity" data-entity="app2" data-source-line="7" data-uid="ent0005" id="entity_app2"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="149.0376" x="350.5" y="94.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="30.3418" x="364.5" y="120.8921">app2</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.0376" x="364.5" y="133.9648">/usr/*/app2 &#183; /etc/*/app2</text></g><!--entity app3--><g class="entity" data-entity="app3" data-source-line="8" data-uid="ent0006" id="entity_app3"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="149.0376" x="517.5" y="94.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="30.3418" x="531.5" y="120.8921">app3</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.0376" x="531.5" y="133.9648">/usr/*/app3 &#183; /etc/*/app3</text></g><!--entity lib--><g class="entity" data-entity="lib" data-source-line="9" data-uid="ent0007" id="entity_lib"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="174.0615" x="401" y="211.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.9663" x="415" y="237.8921">Library XYZ</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.0615" x="415" y="250.9648">one copy for the whole host</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="72.7515" x="415" y="263.6138">installed: v1.0</text></g><g class="link" data-entity-1="app2" data-entity-2="lib" data-uid="lnk11" id="link_app2_lib"><polygon fill="#16A34A" points="452.1542,211.5733,449.5066,202.0869,448.97,207.7183,443.3386,207.1817,452.1542,211.5733" style="stroke:#16A34A;stroke-width:1;"/><path d="M427.3363,150.7926 C429.343,164.2843 433.0719,180.4907 440,193.6982 C443.2759,199.9434 443.7103,201.3506 448.3331,206.9473" fill="none" style="stroke:#16A34A;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="82.0254" x="446" y="185.9541">works with v1.0</text></g><g class="link" data-entity-1="app3" data-entity-2="lib" data-uid="lnk12" id="link_app3_lib"><polygon fill="#DC2626" points="518.1442,211.6831,527.1278,207.6465,521.4795,207.9581,521.1679,202.3099,518.1442,211.6831" style="stroke:#DC2626;stroke-width:1;"/><path d="M569.9524,150.8446 C559.2298,163.908 546.0771,179.7299 534,193.6982 C528.931,199.5611 527.4729,201.2647 522.1466,207.2132" fill="none" style="stroke:#DC2626;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="94.7168" x="561" y="185.9541">now requires v2.0</text></g><!--SRC=[RPJDZjCm4CVlUOfXkG2Y2KrG3rLLQRKS2pSallRWEBE9LSSEjhFPW91u2Dw5Eu_2ap2Easv2AwMACZF-pSn_F7qY59TjWH37INYSrj8cXM2bORLDZbonbQkmnhXfQnavuIJ2MwPwO4qZ1MTEQ6L1AteGAcqT_Ftv2-W8s8ePB5O5DgWALBo7nkXSOXr51hbZgYJKrK6ezk7neAU4Wt0d9DhUEgolOBShZMwR_HwO3S7V8u0PHfL2FNnHEok-uNQztYUjDScBP333dz-GeEFJzoxnKNjFRIGJAb07rn9ABQxFcTuwG_hFoqJlEGEc5u7f4fYUW06Jdc6oYvXiYSd-msHBp47aXfaUFdpyDAFv2N3Tz72dpJ37hj8oZ7R4pOA5iev9YSKMxjVngvaEEIk22bBa4UKDarXzhaH1b-7MYB9og_saqQ3f9MSQdEb5P_ReVBhUN6UlhsyBtIboKbBOGgVDqK8dN3LK5w8p7_tc9jsacsMqqXsfyxKL1YtSfnJ_Ot5JtpUq4xGhNXCvIkSr6fXC5Q6Kt20xsXWEoEuHX9iy6GWBkTJyY4KyK_0TKdbevki4dD6lehG4KDF-EDcVLclO04uBGHlY3NLyIVbftMOzt4ZT5g0e3HN7bEtGRA5X_CWe5p9UBUeOb1EErhjJSDfZGJcVSQqSNNGqzlcicK41Mud63eA_38sFXjGRSar8qogmWgJC-_2cNCC_1gj3R_DsIgt7VaAzKUJ7TReEumYdNiVtcJ-S_GS0]--></g></svg>