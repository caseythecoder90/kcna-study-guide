<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="399px" preserveAspectRatio="none" style="width:1096px;height:399px;background:#FFFFFF;" version="1.1" viewBox="0 0 1096 399" width="1096px" zoomAndPan="magnify"><title>Kubernetes autoscaling &#8212; which autoscaler changes what</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="502.1279" x="293.436" y="30.8838">Kubernetes autoscaling &#8212; which autoscaler changes what</text></g><!--cluster hz--><g class="cluster" data-entity="hz" data-source-line="10" data-uid="ent0006" id="cluster_hz"><rect fill="#F0FDF4" height="171" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="226" x="864" y="160.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.1182" x="893.9409" y="178.8921">Horizontal &#8212; more of them</text></g><!--cluster vt--><g class="cluster" data-entity="vt" data-source-line="14" data-uid="ent0009" id="cluster_vt"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="222" x="508" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.9199" x="565.54" y="79.8921">Vertical &#8212; bigger</text></g><!--entity ca--><g class="entity" data-entity="ca" data-source-line="5" data-uid="ent0002" id="entity_ca"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="266.4229" x="486" y="169.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="115.5908" x="500" y="195.3921">Cluster Autoscaler</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.8833" x="500" y="208.4648">adds nodes when Pods can't be scheduled</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.4229" x="500" y="221.1138">for lack of resources; removes nodes that are</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="227.9868" x="500" y="233.7627">underutilized and whose Pods fit elsewhere</text></g><!--entity keda--><g class="entity" data-entity="keda" data-source-line="6" data-uid="ent0003" id="entity_keda"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="270.0376" x="6" y="261.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="134.3608" x="20" y="287.8921">KEDA &#8212; event-driven</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.7168" x="20" y="300.9648">CNCF graduated &#183; ScaledObject names the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="242.0376" x="20" y="313.6138">workload and its triggers: queue length, Kafka</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="231.0859" x="20" y="326.2627">lag, Prometheus query, cron ... Scales 0 &#8594; 1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="196.2275" x="20" y="338.9116">itself; can scale a Deployment to zero</text></g><!--entity hpa--><g class="entity" data-entity="hpa" data-source-line="7" data-uid="ent0004" id="entity_hpa"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="231.5859" x="503" y="268.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="155.2954" x="517" y="294.3921">HorizontalPodAutoscaler</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.8638" x="517" y="307.4648">built in &#183; adjusts replicas from CPU /</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="203.5859" x="517" y="320.1138">memory (via metrics-server) or custom</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="106.9922" x="517" y="332.7627">and external metrics</text></g><!--entity vpa--><g class="entity" data-entity="vpa" data-source-line="8" data-uid="ent0005" id="entity_vpa"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="228.519" x="26.5" y="82.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.7153" x="40.5" y="108.3921">VerticalPodAutoscaler</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.998" x="40.5" y="121.4648">add-on, not built in &#183; adjusts a Pod's</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="200.519" x="40.5" y="134.1138">resource requests and limits; typically</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="158.3076" x="40.5" y="146.7627">restarts the Pod to apply them</text></g><!--entity nodes--><g class="entity" data-entity="nodes" data-source-line="11" data-uid="ent0007" id="entity_nodes"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="140.4707" x="907" y="193.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="71.4937" x="921" y="219.8921">Node count</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="112.4707" x="921" y="232.9648">the size of the cluster</text></g><!--entity reps--><g class="entity" data-entity="reps" data-source-line="12" data-uid="ent0008" id="entity_reps"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="210.1392" x="872" y="267.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.2363" x="886" y="293.8921">Replica count</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="182.1392" x="886" y="306.9648">Pods of a Deployment / StatefulSet</text></g><!--entity res--><g class="entity" data-entity="res" data-source-line="15" data-uid="ent0010" id="entity_res"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="206.4976" x="516" y="94.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="90.3145" x="530" y="120.8921">Pod resources</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="178.4976" x="530" y="133.9648">CPU / memory requests and limits</text></g><g class="link" data-entity-1="ca" data-entity-2="nodes" data-uid="lnk11" id="link_ca_nodes"><polygon fill="#475569" points="906.5418,219.357,897.6817,215.056,901.5446,219.1885,897.4121,223.0515,906.5418,219.357" style="stroke:#475569;stroke-width:1;"/><path d="M752.0554,214.1495 C804.4933,215.9171 856.645,217.675 900.5452,219.1548" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.043" x="780" y="207.9541">scale nodes</text></g><g class="link" data-entity-1="keda" data-entity-2="hpa" data-uid="lnk12" id="link_keda_hpa"><polygon fill="#16A34A" points="502.6518,308.6982,493.6518,304.6982,497.6518,308.6982,493.6518,312.6982,502.6518,308.6982" style="stroke:#16A34A;stroke-width:1;"/><path d="M276.1765,308.6982 C347.5258,308.6982 428.3588,308.6982 496.6518,308.6982" fill="none" style="stroke:#16A34A;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.4199" x="309.3164" y="286.9541">creates and feeds the HPA</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="162.0527" x="300" y="300.7529">with external metrics for 1 &#8594; n</text></g><g class="link" data-entity-1="hpa" data-entity-2="reps" data-uid="lnk13" id="link_hpa_reps"><polygon fill="#475569" points="871.8386,299.5019,862.6986,295.833,866.8419,299.6844,862.9906,303.8277,871.8386,299.5019" style="stroke:#475569;stroke-width:1;"/><path d="M735.0914,304.4955 C779.0724,302.8894 822.9378,301.2876 865.8426,299.7208" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.6973" x="776" y="291.9541">scale replicas</text></g><g class="link" data-entity-1="vpa" data-entity-2="res" data-uid="lnk14" id="link_vpa_res"><polygon fill="#475569" points="515.7248,122.6982,506.7248,118.6982,510.7248,122.6982,506.7248,126.6982,515.7248,122.6982" style="stroke:#475569;stroke-width:1;"/><path d="M255.7114,122.6982 C334.7772,122.6982 433.2811,122.6982 509.7248,122.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="32.0098" x="365" y="114.9541">resize</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="646.584" x="221.208" y="367.8301">Horizontal = more Pods (HPA, KEDA) or more nodes (Cluster Autoscaler). Vertical = bigger Pods (VPA).</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="653.1807" x="217.9097" y="383.9287">Don't run HPA and VPA on the same CPU/memory metric for the same workload &#8212; they fight each other.</text></g><!--SRC=[TLNDRXit4BxlKqpJGsp0aYgqoC5M10XsMmC67256VQbpeCXPBICkkUMF7Ba8a5CU8EYxzDv7yPDqXYilvEmQ42JjSdw-R-QRuG_QIfCKmdWyQJ_HEHCcIekr5tMORAGLerXXZUCcrQOmM4Q83hnULn6KzYYZThQ8EXg4gxH2Rp5Y096Y2r8ORTVm-EKVkA-qhBgtw45Mmgx9yBuIiIWu3ZrJZ5Vd9eL81elEzixEWdx0q-bqBfGAO9tAZcXXwUXP2liwmWeXo0fLCgXc4tQO7pYMpeCHSWEk18_19IyndD7VsctnAMGaB20yzjsJLUXJr8QU5GYhABqBsEOlTGGq0GbHv_iAPZCX9TeuduDWZ8SShtwzMEIou9OiHifh-Zr8Ttvz_XjG1rGIaVBzzo_SS2NKkzL72W9Mr1dj0D1xvpV6YHQZZcH5hLgZ3wVmLyA4OD2kOtK2LwBSYBw_4UiJM7fN8uLFWPtyxWIaTvP4Ccvn1FW97hz-WsdVdrAYAS-u9v2x1m8ki35kLnDJbiu3UdTGfBLpgYtH1jMp8bqwhn-SZS9GbGVLi4hQHD2M2oJKHz9De8usHaiALn89E5_-0PC-ofhQxdTmjDK2YAdNCem2-YtwOo2XI8hawhuRrnG_aJYjC4z-B_IxQfvnkKKV2TMBJ4ZN8sTFI8Sav05MWfNsElGXFMcPU5EhiYc1DBgcHfn1t3MSrUm67QFmCSk8WtDhHDEO7R-eNs2r9LR3BSfgfg8Y3nX7oBtrBZM_Tmsk7k3l0k30_vh63gHBDXuWOq3yVny9PBiG1ZMJv_PvpFUj07fXywXIo6TwdC1Df14haxd1E9Y1z1IApqEzp9HNURewilionU-9Se6xjNCuwAnFsCjne8KTf8o4WHH4RJIQxpVMwNx8sZhm1C7epn-dRnO__xBuG5OaGxAH7aLUoXItH5Hjqo-NYpjxhsFLqpJmjfpc4RS5X-24N8WktzEK5Tlkb0_fc-0oneQl1PZf-O54thO2oOquekoqX6WFvedB1osbe_u5S3o6hkXlzoNVXxbTBex7iubcQUlvXUERm2VBv39TEWS2aZL5MvCNmcHVxfPivjeTT-kJUqjlTxJS-QP3GRUNenS-9_iV]--></g></svg>