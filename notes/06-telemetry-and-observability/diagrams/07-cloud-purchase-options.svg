<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="287px" preserveAspectRatio="none" style="width:1004px;height:287px;background:#FFFFFF;" version="1.1" viewBox="0 0 1004 287" width="1004px" zoomAndPan="magnify"><title>Same EC2 instance, three ways to pay for it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="372.1289" x="308.4355" y="30.8838">Same EC2 instance, three ways to pay for it</text></g><!--cluster od--><g class="cluster" data-qualified-name="od" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="198" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="368" x="14" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.6709" x="161.1646" y="71.8921">On-Demand</text></g><!--cluster ri--><g class="cluster" data-qualified-name="ri" data-source-line="10" id="ent0006"><rect fill="#F8FAFC" height="198" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="304" x="390" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="221.1079" x="431.446" y="71.8921">Reserved Instances / Savings Plans</text></g><!--cluster sp--><g class="cluster" data-qualified-name="sp" data-source-line="16" id="ent0010"><rect fill="#F0FDF4" height="198" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="296" x="702" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.8818" x="835.5591" y="71.8921">Spot</text></g><!--entity od1--><g class="entity" data-qualified-name="od.od1" data-source-line="5" id="ent0003"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="240.083" x="106" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="195.0635" x="120" y="112.8921">Pay per second (60 s minimum)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="212.083" x="120" y="125.9648">no commitment &#183; start and stop any time</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.3291" x="120" y="138.6138">the most expensive rate</text></g><!--entity odl--><g class="entity" data-qualified-name="od.odl" data-source-line="6" id="ent0004"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="238.4336" x="36.5" y="215.0161">Best for: spiky, short-lived or unknown workloads</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="323.4204" x="36.5" y="227.665">Trap: the On-Demand paradigm &#8212; everything, forever, at full price</text></g><!--entity ri1--><g class="entity" data-qualified-name="ri.ri1" data-source-line="11" id="ent0007"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="254.1499" x="432" y="86.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.2153" x="446" y="112.8921">Commit for 1 or 3 years</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="134.4438" x="446" y="125.9648">up to 72% off On-Demand</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.1499" x="446" y="138.6138">a BILLING discount, not a specific machine</text></g><!--entity ril--><g class="entity" data-qualified-name="ri.ril" data-source-line="12" id="ent0008"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="209.1289" x="448" y="215.0161">Best for: the steady baseline that runs 24/7</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="221.9282" x="448" y="227.665">Risk: paying for a commitment you stop using</text></g><!--entity sp1--><g class="entity" data-qualified-name="sp.sp1" data-source-line="17" id="ent0011"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="245.6099" x="744" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6753" x="758" y="112.8921">Spare EC2 capacity</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="134.4438" x="758" y="125.9648">up to 90% off On-Demand</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="217.6099" x="758" y="138.6138">can be reclaimed with a 2-minute warning</text></g><!--entity spl--><g class="entity" data-qualified-name="sp.spl" data-source-line="18" id="ent0012"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="221.3159" x="754.5" y="215.0161">Best for: stateless, fault-tolerant, flexible work</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="203.6021" x="754.5" y="227.665">Risk: interruption, or no capacity available</text></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="804.6104" x="92.1948" y="271.8301">A typical mix: Reserved/Savings Plans for the baseline, Spot for the elastic and fault-tolerant part, On-Demand for whatever is left.</text></g><?plantuml-src XLJTQXD15BxFKnmBWaAIRQ9O325WgvH2qT9wfrwSx9maXypE37DcawuY-12-Y_S-Ya_YcQJDJuCMSh6PsPdp_UuJTgMj3K6tMwn_oNihXM6SHgoac9SEEsb65NL3NTbMucG9Rh0YU7VM1tQIq9NKXZIBHB34HY1v2DZ0n4VWr6f5AlMTgHux-k0wRwb2PuvWE9n6NuTJDACHe80tyAq5iFFobTuHA89GwPs1Pw-EGQ1YnrLTFV_iXi9VQT3hZPo7qbSLfufSWj-_G27513f5dtpGXmOILpGiyedHpadb1PMN17GRo0al22Ac-nSpnl4MNa_HMHoJXQFD1QUaXvNd02Jml6c3p7nC7Qit6L3wjPixltImz75kFHevnF0nOXX0Hh8HHzMBQ7XQmPyVFu4M59iqOpTjvr7vRnjGnzRMGeXSRl6kS5h5gMYXysd6nf3xOXH1PxJQ-RxdnZK9nOpquiv5WKAjNUWeWIkBJZOshKM8_D2ZivNmAwjxcV0BQ0YZxF2hGyx3IVyf-Cbao_5G28JJYylBY_VdO5XANxlK1kVLHzMMIfvm2HMMgiCUtyZ_zoKBAudGD3168Ql7TKtbYxKJwByiJWwHNBFC1pd2AiIA6ku6hF7rEbUrwFu-bgoz8ZhGFk_iQtyJVDgeU-xzNSmaF5JuHiEmxbg90KjEpO6uhuyV5RT41sFAzrhKAXXOSfefhtv72rMdNDpeTkaeiXrGZsG_QMaiYMX0iRQfaxobYDd0YQLR7YkFt81_ASqkKOnrIEnTEwSeD_gEBE02MKVRFTSbPAKLru7IUKULrg_9PYVoT9PM9hGqm0VB4bejdPQ7mv17Ro0rWKkq-gcv7S1zHugzNgnIaQDrdwasP4CtosHHaWOsbtbVajnjrMNRzNnagO7ClGOMi3H9tM71exy0?></g></svg>