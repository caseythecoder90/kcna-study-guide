<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="170px" preserveAspectRatio="none" style="width:1468px;height:170px;background:#FFFFFF;" version="1.1" viewBox="0 0 1468 170" width="1468px" zoomAndPan="magnify"><title>A Spot node being reclaimed, and how Kubernetes absorbs it</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="526.0781" x="467.4609" y="30.8838">A Spot node being reclaimed, and how Kubernetes absorbs it</text></g><!--entity s1--><g class="entity" data-qualified-name="s1" data-source-line="5" id="ent0002"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="227.2407" x="6" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.1582" x="20" y="87.8921">1. Running</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="141.1792" x="20" y="100.9648">Spot node joins the cluster</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="158.9199" x="20" y="113.6138">you pay the current Spot price</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="199.2407" x="20" y="126.2627">(set by long-term supply and demand)</text></g><!--entity s2--><g class="entity" data-qualified-name="s2" data-source-line="6" id="ent0003"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="215.1543" x="269" y="68.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1543" x="283" y="94.3921">2. AWS needs the capacity back</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="142.4521" x="283" y="107.4648">(or the price rises above your</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="92.9307" x="283" y="120.1138">optional max price)</text></g><!--entity s3--><g class="entity" data-qualified-name="s3" data-source-line="7" id="ent0004"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="157.2827" x="520" y="68.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129.2827" x="534" y="94.3921">3. Interruption notice</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.0669" x="534" y="107.4648">2 minutes before (AWS)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="127.4507" x="534" y="120.1138">~30 s on GCP and Azure</text></g><!--entity s4--><g class="entity" data-qualified-name="s4" data-source-line="8" id="ent0005"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="234.5884" x="713" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.7744" x="727" y="87.8921">4. Handler reacts</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="206.5884" x="727" y="100.9648">Karpenter or Node Termination Handler</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.5923" x="727" y="113.6138">cordon + drain the node</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="155.2676" x="727" y="126.2627">(Eviction API, respects PDBs)</text></g><!--entity s5--><g class="entity" data-qualified-name="s5" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="222.439" x="984" y="68.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="126.4326" x="998" y="94.3921">5. Pods rescheduled</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="194.439" x="998" y="107.4648">ReplicaSets recreate Pods elsewhere</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="190.126" x="998" y="120.1138">autoscaler adds a replacement node</text></g><!--entity s6--><g class="entity" data-qualified-name="s6" data-source-line="10" id="ent0007"><rect fill="#F1F5F9" height="70.5464" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="220.2261" x="1242" y="66.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.5972" x="1256" y="92.8921">6. Instance is</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2261" x="1256" y="107.8408">terminated &#183; stopped &#183; hibernated</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="118.6206" x="1256" y="120.9136">(your chosen behaviour)</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="268.8173,102.1982,259.8173,98.1982,263.8173,102.1982,259.8173,106.1982,268.8173,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M233.089,102.1982 C244.9634,102.1982 251.0127,102.1982 262.8173,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="519.9822,102.1982,510.9822,98.1982,514.9822,102.1982,510.9822,106.1982,519.9822,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M484.2778,102.1982 C496.3204,102.1982 502.4145,102.1982 513.9822,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="712.6207,102.1982,703.6207,98.1982,707.6207,102.1982,703.6207,106.1982,712.6207,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M677.0469,102.1982 C688.5232,102.1982 694.5582,102.1982 706.6207,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="983.991,102.1982,974.991,98.1982,978.991,102.1982,974.991,106.1982,983.991,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M948.165,102.1982 C960.0778,102.1982 966.1528,102.1982 977.991,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="1241.6794,102.1982,1232.6794,98.1982,1236.6794,102.1982,1232.6794,106.1982,1241.6794,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M1206.3636,102.1982 C1218.0741,102.1982 1223.981,102.1982 1235.6794,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="18"><text fill="#0F172A" font-family="Arial, Helvetica, 