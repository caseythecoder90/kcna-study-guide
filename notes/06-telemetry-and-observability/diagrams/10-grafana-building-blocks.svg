<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="337px" preserveAspectRatio="none" style="width:865px;height:337px;background:#FFFFFF;" version="1.1" viewBox="0 0 865 337" width="865px" zoomAndPan="magnify"><title>Grafana's building blocks: from a data source to a page, and to a pager</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="608.4053" x="124.7974" y="30.8838">Grafana's building blocks: from a data source to a page, and to a pager</text></g><!--cluster viz--><g class="cluster" data-qualified-name="viz" data-source-line="7" id="ent0003"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="610" x="249" y="117.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6372" x="526.1814" y="135.8921">Visualize</text></g><!--cluster al--><g class="cluster" data-qualified-name="al" data-source-line="13" id="ent0007"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="588.5" x="250" y="234.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="29.6182" x="529.4409" y="252.8921">Alert</text></g><!--entity ds--><g class="entity" data-qualified-name="ds" data-source-line="5" id="ent0002"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="204.6821" x="6" y="144.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.5908" x="20" y="170.3921">Data sources</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="176.6821" x="20" y="183.4648">Prometheus &#183; Loki &#183; Tempo &#183; Jaeger</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.7729" x="20" y="196.1138">InfluxDB &#183; Elasticsearch &#183; SQL ...</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="162.6367" x="20" y="208.7627">Grafana stores NONE of the data</text></g><!--entity ex--><g class="entity" data-qualified-name="ex" data-source-line="19" id="ent0011"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="174.1582" x="247" y="53.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0781" x="261" y="79.8921">Explore</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="146.1582" x="261" y="92.9648">ad-hoc queries, no dashboard</text></g><!--entity q--><g class="entity" data-qualified-name="viz.q" data-source-line="8" id="ent0004"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="153.8877" x="257" y="156.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="37.5718" x="271" y="182.8921">Query</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.8877" x="271" y="195.9648">PromQL, LogQL, SQL ...</text></g><!--entity p--><g class="entity" data-qualified-name="viz.p" data-source-line="9" id="ent0005"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="158.2061" x="457" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="34.6836" x="471" y="176.8921">Panel</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.7168" x="471" y="189.9648">time series, stat, gauge,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="130.2061" x="471" y="202.6138">table, heatmap, bar chart</text></g><!--entity d--><g class="entity" data-qualified-name="viz.d" data-source-line="10" id="ent0006"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="199.5098" x="651" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9009" x="665" y="176.8921">Dashboard</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.5098" x="665" y="189.9648">panels + variables ($namespace)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="154.376" x="665" y="202.6138">+ time range &#183; saved as JSON</text></g><!--entity ar--><g class="entity" data-qualified-name="al.ar" data-source-line="14" id="ent0008"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="152.4106" x="258" y="267.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0718" x="272" y="293.8921">Alert rule</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.4106" x="272" y="306.9648">query + condition + 'for'</text></g><!--entity np--><g class="entity" data-qualified-name="al.np" data-source-line="15" id="ent0009"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="140.6709" x="465.5" y="267.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="112.6709" x="479.5" y="293.8921">Notification policy</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="83.7515" x="479.5" y="306.9648">routes by labels</text></g><!--entity cp--><g class="entity" data-qualified-name="al.cp" data-source-line="16" id="ent0010"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="159.4414" x="671.5" y="267.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.7637" x="685.5" y="293.8921">Contact point</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="131.4414" x="685.5" y="306.9648">email &#183; Slack &#183; PagerDuty</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="256.7256,184.6982,247.7256,180.6982,251.7256,184.6982,247.7256,188.6982,256.7256,184.6982" style="stroke:#475569;stroke-width:1;"/><path d="M211.1132,184.6982 C226.45,184.6982 236.0435,184.6982 250.7256,184.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="456.7069,184.6982,447.7069,180.6982,451.7069,184.6982,447.7069,188.6982,456.7069,184.6982" style="stroke:#475569;stroke-width:1;"/><path d="M411.182,184.6982 C426.0847,184.6982 435.7367,184.6982 450.7069,184.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" dat