<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="384px" preserveAspectRatio="none" style="width:802px;height:384px;background:#FFFFFF;" version="1.1" viewBox="0 0 802 384" width="802px" zoomAndPan="magnify"><title>How Kubecost / OpenCost turn a cloud bill into per-team costs</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="536.0449" x="129.7275" y="30.8838">How Kubecost / OpenCost turn a cloud bill into per-team costs</text></g><!--cluster in--><g class="cluster" data-qualified-name="in" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="664" x="132.5" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.9937" x="445.0032" y="71.8921">Inputs</text></g><!--cluster out--><g class="cluster" data-qualified-name="out" data-source-line="14" id="ent0009"><rect fill="#F0FDF4" height="99" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="660" x="132.5" y="279.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8228" x="437.5886" y="297.8921">Outputs</text></g><!--entity eng--><g class="entity" data-qualified-name="eng" data-source-line="12" id="ent0008"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="284.7598" x="6" y="190.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.3418" x="20" y="216.8921">Allocation engine</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256.7598" x="20" y="229.9648">cost = max(request, usage) &#215; price, per container</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="230.7637" x="20" y="242.6138">+ shared costs (control plane, system Pods)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.7407" x="20" y="255.2627">+ IDLE = provisioned but unused</text></g><!--entity price--><g class="entity" data-qualified-name="in.price" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="193.6929" x="174.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="36.1182" x="188.5" y="112.8921">Prices</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="165.6929" x="188.5" y="125.9648">cloud pricing APIs or billing export</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="155.8906" x="188.5" y="138.6138">(on-prem: a custom price sheet)</text></g><!--entity use--><g class="entity" data-qualified-name="in.use" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="195.4868" x="387" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.3525" x="401" y="112.8921">Usage and requests</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="167.4868" x="401" y="125.9648">Prometheus: CPU, memory, GPU,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="148.5806" x="401" y="138.6138">storage, network per container</text></g><!--entity own--><g class="entity" data-qualified-name="in.own" data-source-line="7" id="ent0005"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="188.2144" x="600.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.1372" x="614.5" y="112.8921">Ownership</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.2144" x="614.5" y="125.9648">namespaces, labels, annotations</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="140.6152" x="614.5" y="138.6138">(team, app, env, cost-center)</text></g><!--entity o1--><g class="entity" data-qualified-name="out.o1" data-source-line="15" id="ent0010"><rect fill="#DCFCE7" height="57.8975" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="253.418" x="175" y="312.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="207.3398" x="189" y="338.8921">Cost by namespace, Deployment,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="225.418" x="189" y="353.8408">label, team (showback / chargeback)</text></g><!--entity o2--><g class="entity" data-qualified-name="out.o2" data-source-line="16" id="ent0011"><rect fill="#DCFCE7" height="57.8975" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="174.2754" x="446.5" y="312.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="146.2754" x="460.5" y="338.8921">Efficiency + right-sizing</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.9727" x="460.5" y="353.8408">recommendations</text></g><!--entity o3--><g class="entity" data-qualified-name="out.o3" data-source-line="17" id="ent0012"><rect fill="#DCFCE7" height="57.8975" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="145.0254" x="639" y="312.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.0254" x="653" y="338.8921">Budgets and alerts</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114.1372" x="653" y="353.8408">(spend anomalies)</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="148.5,190.473,152.5,181.473,148.5,185.473,144.5,181.473,148.5,190.473" style="stroke:#475569;stroke-width:1;"/><path d="M148.5,162.9062 C148.5,164.1973 148.5,165.4988 148.5,166.8077 C148.5,169.4255 148.5,172.0725 148.5,174.7234 C148.5,180.0252 148.5,179.3427 148.5,184.473" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="148.5,279.5622,152.5,270.5622,148.5,274.5622,144.5,270.5622,148.5,279.5622" style="stroke:#475569;stroke-width:1;"/><path d="M148.5,271.9835 C148.5,273.2687 148.5,274.5656 148.5,275.871 C148.5,276.5237 148.5,277.1785 148.5,277.8351 C148.5,278.1634 148.5,278.4921 148.5,278.8211 C148.5,278.9857 148.5,279.1503 148.5,279.3151 C148.5,279.3974 148.5,273.4798 148.5,273.5622" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><?plantuml-src TLHBRjj03Dtx56nMDYBPSB8BN0Df4gH12yIRhEeknX8Z3pn3JkSJnorwZXwe5oj7CbhPSG7zA96FZu-atccgJAeHnkD9TqHc4oQrLerNDams5Qaohj7Ys2Lh1b57W_2Hj_0fhR3Y4642Zmxf9Z_6v0aKL8PJ3Ijj36YA30vz6L5PoFvXCF1OHKMD09qza4indC5irdXERZu75IG8VWm0UcuBhoiCIve5