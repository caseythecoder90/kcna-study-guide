<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="378px" preserveAspectRatio="none" style="width:977px;height:378px;background:#FFFFFF;" version="1.1" viewBox="0 0 977 378" width="977px" zoomAndPan="magnify"><title>What the HPA can read, and who serves each API</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="424.125" x="272.6836" y="30.8838">What the HPA can read, and who serves each API</text></g><!--cluster r--><g class="cluster" data-qualified-name="r" data-source-line="6" id="ent0003"><rect fill="#F8FAFC" height="123" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="200" x="123.2461" y="131.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.7153" x="179.8884" y="149.8921">metrics.k8s.io</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.1768" x="137.6577" y="162.9648">Resource metrics: CPU, memory</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="79.4707" x="183.5107" y="175.6138">type: Resource</text></g><!--cluster c--><g class="cluster" data-qualified-name="c" data-source-line="9" id="ent0005"><rect fill="#F0FDF4" height="123" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="276" x="331.2461" y="131.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.5571" x="400.9675" y="149.8921">custom.metrics.k8s.io</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="177.2676" x="380.6123" y="162.9648">metrics about Kubernetes objects</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="99.6284" x="419.4319" y="175.6138">type: Pods / Object</text></g><!--cluster e--><g class="cluster" data-qualified-name="e" data-source-line="12" id="ent0007"><rect fill="#F0FDF4" height="123" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="254" x="615.2461" y="131.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.188" x="672.1521" y="149.8921">external.metrics.k8s.io</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="167.4868" x="658.5027" y="162.9648">metrics from outside the cluster</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="72.7461" x="705.873" y="175.6138">type: External</text></g><!--entity hpa--><g class="entity" data-qualified-name="hpa" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="183.2954" x="255.7461" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="155.2954" x="269.7461" y="87.8921">HorizontalPodAutoscaler</text></g><!--entity prom--><g class="entity" data-qualified-name="prom" data-source-line="16" id="ent0009"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="98.0908" x="521.2461" y="307.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.0908" x="535.2461" y="333.8921">Prometheus</text></g><!--entity kub--><g class="entity" data-qualified-name="kub" data-source-line="17" id="ent0010"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="76.4199" x="202.2461" y="307.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.4199" x="216.2461" y="333.8921">kubelets</text></g><!--entity ms--><g class="entity" data-qualified-name="r.ms" data-source-line="7" id="ent0004"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="149.0537" x="165.7461" y="190.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.3354" x="179.7461" y="216.8921">metrics-server</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="121.0537" x="179.7461" y="229.9648">(or Prometheus Adapter)</text></g><!--entity pa--><g class="entity" data-qualified-name="c.pa" data-source-line="10" id="ent0006"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="225.436" x="373.7461" y="190.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="127.8608" x="387.7461" y="216.8921">Prometheus Adapter</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="197.436" x="387.7461" y="229.9648">runs PromQL, e.g. requests/s per Pod</text></g><!--entity pe--><g class="entity" data-qualified-name="e.pe" data-source-line="13" id="ent0008"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="204.249" x="657.2461" y="190.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="176.249" x="671.2461" y="216.8921">Prometheus Adapter &#183; K