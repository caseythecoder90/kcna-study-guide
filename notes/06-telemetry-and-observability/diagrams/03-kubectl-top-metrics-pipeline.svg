<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="250px" preserveAspectRatio="none" style="width:1769px;height:250px;background:#FFFFFF;" version="1.1" viewBox="0 0 1769 250" width="1769px" zoomAndPan="magnify"><title>kubectl top is just a client of the metrics.k8s.io API</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="434.1094" x="659.9453" y="30.8838">kubectl top is just a client of the metrics.k8s.io API</text></g><!--cluster node--><g class="cluster" data-qualified-name="node" data-source-line="5" id="ent0002"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="185" x="14" y="105.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0845" x="71.4578" y="123.8921">Every node</text></g><!--cluster clients--><g class="cluster" data-qualified-name="clients" data-source-line="13" id="ent0006"><rect fill="#F8FAFC" height="139" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="601" x="1162" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234.8188" x="1345.0906" y="71.8921">Clients of /apis/metrics.k8s.io/v1beta1</text></g><!--entity ms--><g class="entity" data-qualified-name="ms" data-source-line="9" id="ent0004"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="229.7544" x="370" y="132.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.6162" x="384" y="158.3921">metrics-server</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="185.8667" x="384" y="171.4648">scrapes every kubelet (default 15 s)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201.7544" x="384" y="184.1138">keeps only recent samples, in memory</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="115.5107" x="384" y="196.7627">no history, no storage</text></g><!--entity api--><g class="entity" data-qualified-name="api" data-source-line="11" id="ent0005"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="205.939" x="748" y="138.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="762" y="164.8921">kube-apiserver</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="91.6953" x="762" y="177.9648">aggregation layer</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="177.939" x="762" y="190.6138">APIService v1beta1.metrics.k8s.io</text></g><!--entity kubelet--><g class="entity" data-qualified-name="node.kubelet" data-source-line="6" id="ent0003"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="169.2061" x="22" y="138.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="36" y="164.8921">kubelet</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="103.9199" x="36" y="177.9648">cAdvisor / CRI stats</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="141.2061" x="36" y="190.6138">/metrics/resource endpoint</text></g><!--entity top--><g class="entity" data-qualified-name="clients.top" data-source-line="14" id="ent0007"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="184.4976" x="1170" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.6958" x="1184" y="112.8921">kubectl top node | pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="156.4976" x="1184" y="125.9648">reads NodeMetrics / PodMetrics</text></g><!--entity hpa--><g class="entity" data-qualified-name="clients.hpa" data-source-line="15" id="ent0008"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="171.0762" x="1391" y="93.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.0762" x="1405" y="119.3921">HorizontalPodAutoscaler</text></g><!--entity vpa--><g class="entity" data-qualified-name="clients.vpa" data-source-line="16" id="ent0009"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="155.8989" x="1599" y="93.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.8989" x="1613" y="119.3921">VerticalPodAutoscaler</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="369.9759,172.6982,360.9759,168.6982,364.9759,172.6982,360.9759,176.6982,369.9759,172.6982" style="stroke:#475569;stroke-width:1;"/><path d="M191.0576,172.6982 C243.7012,172.6982 306.361,172.6982 363.9759,172.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="82.3477" x="239.5391" y="150.9541">CPU + memory</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="131.4258" x="215" y="164.7529">per node, Pod, container</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="747.9457,172.6982,738.9457,168.6982,742.9457,172.6982,738.9457,176.6982,747.9457,172.6982" style="stroke:#475569;stroke-width:1;"/><path d="M600.1732,172.6982 C647.5015,172.6982 695.9707,172.6982 741.9457,172.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="62.0215" x="643.0283" y="150.9541">registers as</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.0781" x="624" y="164.7529">an aggregated API</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk14"><polygon fill="#475569" points="1161.8241,172.6982,1152.8241,168.6982,1156.8241,172.6982,1152.8241,176.6982,1161.8241,172.6982" style="stroke:#475569;stroke-width:1;"/><path d="M954.1529,172.6982 C1007.6262,172.6982 1073.6785,172.6982 1130.7862,172.6982 C1137.9247,172.6982 1144.9234,172.6982 1151.7403,172.6982 C1155.1488,172.6982 1152.5118,172.6982 1155.8241,172.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.0332" x="1025.3613" y="150.9541">GET .../nodes</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.7559" x="978" y="164.7529">GET .../namespaces/&lt;ns&gt;/pods</text></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="709.6523" x="522.1738" y="234.8301">CPU and memory only. For history, dashboards, custom metrics and alerting you need Prometheus (next chapter).</text></g><?plantuml-src VLJBRjim4BphAxOv9QWjmOS2HI0828AqpQ65qTUbwM53RYJM54bmARVkuz-xbEN0Yei2Xc2AExF3sH6V6QVie0dAijh_alUMAssmZTXpjL4EbwcZdiemzBQmz90WUOYcxH9e4qabursHJB84c-5UrbOA0XY6RmCdG53Ma4lW7q28eASKZU9oyv9Bu-5gVLiKcGLTAmndDrkAEt1UqndKTHlz49e6aCTNyAi0E2hE_IobErUp-KcNgrMZhlJMi8zGmVNxM-24YUigxpP7LTKaeeh4VeYAW9mEthWqrPxbZXDxyMScS88kcQ98FI9b5J4G0uqdcC1mhka11vjWzGBuubJAXYWmU6Tt-M3P9yO-ME8562TczJxkJb7EGsSuoTv2Z87y3rjw52_6UQ_tllKyavzrBJ6O4_dOjf5QpDC4YpkAfrrbLXy4PiIlxUgU4gxA-JIF1A3AXzbBa7Op3TTZ83WdeifIgZbBDP4_2O2QKF_8m25pOqP-G_3wI7Kar0plPEljleraO-trj3YI72mQj-ybPFCkRtmqFxrBQ0LwDIJF2Yt59x0ku1pscM8owl-WxGZAyfTVEgCrkQ_QVtVBPgAJvybEnaWi3o5RogkUuHAkrv_W-PIQEnSeZfOiydaNeB9-uoWMKfiXuhrWPEeI9Oeo9xvpwE2G1DBZrvchSlN1_qjuVVDHBeooojm2ULnYJnnG4LUruwQICKZs58OnKxLfiZfqUj8tXhw4L_AnFcPP8tVt7gEM-2kvFNn_k2z6O7Ol6TV2pW_WI0IkevU2ZWQ6SqS_4gXE-b6yAElAD7y1?></g></svg>