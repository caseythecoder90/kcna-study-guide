, API server, etcd</text></g><!--entity s3--><g class="entity" data-qualified-name="src.s3" data-source-line="8" id="ent0005"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="130.1152" x="601.5" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="60.6899" x="615.5" y="120.8921">Processes</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="102.1152" x="615.5" y="133.9648">containers, daemons</text></g><!--entity s4--><g class="entity" data-qualified-name="src.s4" data-source-line="9" id="ent0006"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="98.0972" x="953.5" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.0972" x="967.5" y="120.8921">Applications</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.7969" x="967.5" y="133.9648">your services</text></g><!--entity l--><g class="entity" data-qualified-name="pillars.l" data-source-line="16" id="ent0011"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="244.4175" x="235" y="241.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.0527" x="249" y="267.8921">Logs</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="207.8452" x="249" y="280.9648">discrete events, as text: what happened</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="216.4175" x="249" y="293.6138">levels &#183; formats &#183; files or streams &#183; syslog</t