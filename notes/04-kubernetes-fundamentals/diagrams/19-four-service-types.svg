<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="424px" preserveAspectRatio="none" style="width:1303px;height:424px;background:#FFFFFF;" version="1.1" viewBox="0 0 1303 424" width="1303px" zoomAndPan="magnify"><title>Four Service types &#8212; three of them stack, one does not</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="476.1211" x="409.6987" y="30.8838">Four Service types &#8212; three of them stack, one does not</text></g><!--cluster lb--><g class="cluster" data-entity="lb" data-source-line="4" data-uid="ent0002" id="cluster_lb"><rect fill="#F8FAFC" height="202" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="565" x="645.5093" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="299.7935" x="778.1125" y="71.8921">type: LoadBalancer &#183; reachable from the internet</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="456.7793" x="699.6196" y="84.9648">asks the cloud provider for an external load balancer pointing at every node's nodePort</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="541.5298" x="657.2444" y="97.6138">Kubernetes ships no load balancer itself &#8212; no provider, no EXTERNAL-IP, and it sits at pending forever</text></g><!--cluster np--><g class="cluster" data-entity="np" data-source-line="5" data-uid="ent0003" id="cluster_np"><rect fill="#F8FAFC" height="135" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="495" x="692.5093" y="112.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="317.1162" x="781.4512" y="130.8921">type: NodePort &#183; reachable from outside the cluster</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="471.8774" x="704.0706" y="143.9648">opens the SAME port on EVERY node, from the range 30000-32767, and forwards it inward</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="353.9175" x="763.0505" y="156.6138">PORT(S) reads 80:32610/TCP &#8212; the service port, then the node port</text></g><!--cluster en--><g class="cluster" data-entity="en" data-source-line="10" data-uid="ent0005" id="cluster_en"><rect fill="#FEF2F2" height="109" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="648" x="645.5093" y="263.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="230.4136" x="854.3025" y="281.8921">type: ExternalName &#183; the odd one out</text></g><!--entity headless--><g class="entity" data-entity="headless" data-source-line="14" data-uid="ent0007" id="entity_headless"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="323.1899" x="9.0093" y="290.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="169.7236" x="23.0093" y="316.3921">Not a fifth type: HEADLESS</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="247.5645" x="23.0093" y="329.4648">type is still ClusterIP &#8212; you set clusterIP: None</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="295.1899" x="23.0093" y="342.1138">no virtual IP, no kube-proxy, no platform load balancing;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="190.1152" x="23.0093" y="354.7627">DNS returns the Pod IPs themselves</text></g><!--entity ingress--><g class="entity" data-entity="ingress" data-source-line="16" data-uid="ent0008" id="entity_ingress"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="285.3828" x="350.0093" y="290.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8398" x="364.0093" y="316.3921">Not a Service at all: INGRESS</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="242.752" x="364.0093" y="329.4648">an Application Service, not one of the core four &#8212;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="257.3828" x="364.0093" y="342.1138">it exposes HTTP and HTTPS routes from outside the</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="250.0459" x="364.0093" y="354.7627">cluster to Services within it, and sits in front of them</text></g><!--entity cip--><g class="entity" data-entity="cip" data-source-line="6" data-uid="ent0004" id="entity_cip"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="476.6045" x="702.0093" y="171.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="337.3652" x="716.0093" y="197.8921">type: ClusterIP &#183; reachable from inside the cluster only</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="448.6045" x="716.0093" y="210.9648">THE DEFAULT. A stable virtual IP plus a DNS name in front of a changing set of Pods.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="418.6821" x="716.0093" y="223.6138">Every type above is built on one of these &#8212; they add to it, they do not replace it.</text></g><!--entity enb--><g class="entity" data-entity="enb" data-source-line="11" data-uid="ent0006" id="entity_enb"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="597.9243" x="687.5093" y="296.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="569.9243" x="701.5093" y="322.8921">No ClusterIP. No selector. No EndpointSlices. No kube-proxy rules. No proxying of any kind.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="532.4043" x="701.5093" y="335.9648">CoreDNS simply returns a CNAME pointing at spec.externalName, and the client connects there itself.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="476.7651" x="701.5093" y="348.6138">Redirection happens at the DNS level, which is why it can point outside the cluster entirely.</text></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1285.5186" x="5" y="392.8301">kubectl create service has exactly four subcommands &#8212; clusterip, nodeport, loadbalancer, externalname &#8212; which is the cleanest proof that there are four types. Headless is a ClusterIP with its IP set to None,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1101.1738" x="97.1724" y="408.9287">and Ingress is a separate object that routes to Services. Delete a NodePort Service and its ClusterIP goes too: the outer types allocate an inner one, they are not alternatives to it.</text></g><!--SRC=[RLRTRkD45BxFKnps1f0SfzsLTb698cLRBwssXAW920HSJEn9F7GyOysCqmQq4W_1kt3Fe_0aV6Vi9AP9LQdsUERyV3zd-faokMuAIMawQd-3jTgF2YKsJbH-z9WRCGobh6HQDvKU11Mqf0-sSRIGRgjoIM5NIq___laNXT99INPDV81y4FbZGjP8AYns61i60oVp8Cm6CLxnkIkwjw9uBxGmkNJqpz_afCXBiSA6jRCLHo9bWdH6Xb_CsAlVvTNbvKJuHn-_vTes1TNERbM106lhI1YIptn2QDA8Jgjz-DeYb38R4e7aLheTQYhavpx-cLiNnYDECEab-jYiOcxKxqjLyzONGLNmKgzZ__YshoJXb-p7PVOmczuFx-O9oYgmbppsS_vQce9BGSLSIfVv5Ot76sURUZ8XuKclw8y1qGbeiwxUCu3P9dWKq87JU03HQySYRGlSOlfj1a0GmnhAViWUVeee94VO7L9AUdE1d-6Rr-_UlcjxGC5FmXMUcr667qzHct_tiFnYyINNXerVNLozUVtsycAql9vtEf7aE_Lm2GclcBZCDSIryu2OEW9o1fBhjjUx-HbCb7a92PhMkrx1ozkCRh8Fq-_lbobDMRfyUAjSQA0Y1ArnZWJTp1PaHCMQvD0ciDe58PdPC9jUnfMvBNnw2aiMDSVrabZPBQ9uMZLAHmxO9wrrlDoZj2DH51Gii4xQzyAoZz1WhGNGKo7j0INoN9hG8fMh6a1z6dmwuxciiyUCEm5S38n5ebX24mwOlnT56mpalD3Xp1uHJw57TAxnrRhuafaYUcsXGR6FIuymqX3kUDwHQtIt6DyPDqRHxEXHcIBj0NODSp3aNbMrna4P6cUOX-jPAz-ZdtqjyrJs6clLsdAk00lbrXYK6ENlPEVRComzo49nfmgabAAEZa42ZiIrQDXL9_HKghna0f_A7LiXnzY9zPnp800CYAbtVRPMHtHNBsYQWM91QxKE9RMKtMRJc_jiiUZL6NM40dnGMlVqpzhPsIPgCT-lyimmyhHPJAcZokFGEX8LNw6p0CjN_Qa7oBy-3SNWx1dYtc42n8pF5Q3UIj_tjBLTzoLc1FJWpm2mls60lj3wYkvctppy7mE0Fgrhg4n4khe3IVJ8qL2W7eIl-T82EAULWpxvN5kF8N-xNCwZSFW1_O1ChBwShASXzaJ3grqHK8OA9UO4UvSZnidVdniCJ0-I2gawJ02mYv3W0XZ-NAgYaERNmZwPuGHg6S2EXrMdDcN0yW76_SFfbaFKNDGHhh6QCDjvq9HZP8RZL2vPbiy2NtOjRhvPvRQgq4TxrNVzgZg98xkTuYoH_RsO72xXE2_vpC4ohJEaCD87dW4HYzPYu4dikOh_MAHqksz8HUSVTCxmiejvFBFM0JrhF1cF53EZ9WpwNTjpUzRBMZXkqwv-GzTjqexY7d4ftM2OOPiuNhG7ASPRtFVAsDXusbwrOxI9AeZ_4a6pDkTqKAd2xE5RHtPpd9jaaGeTGGfgszOG1xgQ_0S0]--></g></svg>