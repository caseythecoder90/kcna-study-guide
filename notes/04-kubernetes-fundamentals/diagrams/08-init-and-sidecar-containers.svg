<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="491px" preserveAspectRatio="none" style="width:1190px;height:491px;background:#FFFFFF;" version="1.1" viewBox="0 0 1190 491" width="1190px" zoomAndPan="magnify"><title>What starts when inside one Pod</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="282.0322" x="446.7339" y="30.8838">What starts when inside one Pod</text></g><!--cluster phase1--><g class="cluster" data-entity="phase1" data-source-line="4" data-uid="ent0002" id="cluster_phase1"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="698" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="405.2471" x="160.3765" y="71.8921">Phase 1 &#183; initContainers &#8212; one at a time, each runs to completion</text></g><!--cluster phase2--><g class="cluster" data-entity="phase2" data-source-line="10" data-uid="ent0006" id="cluster_phase2"><rect fill="#F0FDF4" height="220.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="466" x="111" y="218.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="397.3252" x="145.3374" y="236.8921">Phase 2 &#183; containers &#8212; all started together, meant to run forever</text></g><!--entity native--><g class="entity" data-entity="native" data-source-line="21" data-uid="ent0014" id="entity_native"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="598.8257" x="585.5" y="356.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="570.8257" x="599.5" y="382.8921">Since 1.33 the supported way to write a sidecar: an entry in initContainers with restartPolicy Always</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="487.9746" x="599.5" y="395.9648">starts in phase 1 but does not block the next init container, then keeps running for the life of the Pod,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="462.8916" x="599.5" y="408.6138">and is shut down after the app containers so a log shipper outlives the thing whose logs it ships</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="500.7739" x="599.5" y="421.2627">beta 1.28 &#183; stable 1.33 &#183; a plain second entry under containers still works and is what the lecture shows</text></g><!--entity i1--><g class="entity" data-entity="i1" data-source-line="5" data-uid="ent0003" id="entity_i1"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="315.9873" x="22" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.8271" x="36" y="112.8921">init-countdown</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="223.1797" x="36" y="125.9648">image busybox &#183; counts 120 &#8594; 0, then exits 0</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="282.5034" x="36" y="138.6138">the next init container starts only once this one succeeded</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="287.9873" x="36" y="151.2627">no liveness, readiness or startup probes; no lifecycle hooks</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="6" data-uid="ent0004" id="entity_s1"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="347.7627" x="356" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9624" x="370" y="112.8921">what kubectl get pods shows meanwhile</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="319.7627" x="370" y="125.9648">STATUS Init:0/1 &#183; READY 0/1 &#8212; no app container has started yet</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="286.0967" x="370" y="138.6138">exits non-zero? restartPolicy Always or OnFailure retries it;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="168.1313" x="370" y="151.2627">Never marks the whole Pod Failed</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="11" data-uid="ent0007" id="entity_a1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="121.1836" x="119.5" y="257.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.1836" x="133.5" y="283.8921">main-container</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="77.6177" x="133.5" y="296.9648">the application</text></g><!--entity a2--><g class="entity" data-entity="a2" data-source-line="12" data-uid="ent0008" id="entity_a2"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="217.4761" x="317.5" y="251.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5317" x="331.5" y="277.8921">sidecar</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.4761" x="331.5" y="290.9648">helper in the same Pod: log shipper,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="122.2729" x="331.5" y="303.6138">proxy, metrics exporter</text></g><!--entity s2--><g class="entity" data-entity="s2" data-source-line="13" data-uid="ent0009" id="entity_s2"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="415.6104" x="135" y="363.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.667" x="149" y="389.3921">what kubectl get pods shows now</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="387.6104" x="149" y="402.4648">STATUS Running &#183; READY 2/2 &#183; RESTARTS counts per container, not per Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="336.9126" x="149" y="415.1138">kill one container and only that one restarts &#8212; the Pod and its IP stay</text></g><g class="link" data-entity-1="a1" data-entity-2="a2" data-uid="lnk10" id="link_a1_a2"><polygon fill="#475569" points="317.4939,285.6982,308.4939,281.6982,312.4939,285.6982,308.4939,289.6982,317.4939,285.6982" style="stroke:#475569;stroke-width:1;"/><path d="M240.809,285.6982 C264.0007,285.6982 285.1955,285.6982 311.4939,285.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="47.3613" x="255.5" y="274.9541">localhost</text></g><g class="link" data-entity-1="i1" data-entity-2="a1" data-uid="lnk13" id="link_i1_a1"><polygon fill="#475569" points="180,257.6794,184,248.6794,180,252.6794,176,248.6794,180,257.6794" style="stroke:#475569;stroke-width:1;"/><path d="M180,168.0947 C180,196.1685 180,226.9927 180,251.6794" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0801" x="186" y="202.9541">every init container exited 0</text></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1151.7324" x="11.8838" y="459.3301">Init containers are for work that must finish before the app may start &#8212; waiting on a dependency, fetching config, running a migration. Sidecars are for work that must happen alongside it.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="838.4893" x="168.5054" y="475.4287">Both share the Pod's network namespace and volumes, which is the whole reason to put them in this Pod instead of a Pod of their own.</text></g><!--SRC=[ZPRDRkCs4CVlVehfNdhnzrwAhE4Y_KGkRH2dA8gs1reQIuGfaX2fADwYG4zzWABlqdiVPP-a_w5ahs8xG870YCZXSEO_lndf4sqpq-HCq-ci-ulEcJ3BjIfgLONPFhDg4akkUEgRoeoYZeRfnr952b7LCL1RiYLjWuONPvdkNJuQrPn5PGkOlhalLM1QqB__m4h7BvsDIbkk0ttuu-zq0huKHLtnc5Xb9TMD3HGTPQxoXgDszWsjLaNj6hzUamhanUM2VXiH3IuIxvFCDJRchhM_s5NGx_bciLZhIXLCsoOSjkvPuaX6WHRBENtuyo-QZobA4loiiJfVpUJWUk00ksJvEQO4SBhFuAY0i-Q0dupXHeUKKcYoZ3dd_DAPTMJq4riEOOpmLQxbNtAzkyQJhzsMmpjAbZlE3XdIAvtRXzwRo54raVDE3hruAKGhrTatMwmOAZYITtcWKBesKCNAjgKsF8XeytZx-CE6xf3SpNoMAlNmzUrNFv4yI94GYF9-a3ZqxwBbd0uSBvFifBJEJjvpxJv7TCdytXcT7UZMjEgGKlxUVgEqQMg6HQmr8vduxjBTT_o4MojLxuEK2imvaqWZENvIMNJn1Y5skWJHHIzeydEfyvpjhxKkoZXPoyRlLnXTTcoyu5CPSyeqEeXPSZrEAaP15AZIpjKItedHRvtB1vmkppcju7vokkOCC-WCYPH0FqYgEBbKPxMMjilKq4l9naCiRPDIGLL9g1iohW03scDpVAamc7i-I6AeGXRG2juXv_fw3Cl_pvjrxILf3usrsXOVGLlEbjq331uUDyS6bJnEGetXAwObf7EPm5wZKj9w7obLDkzwCqg0ijTZs9LMv164n4nelRk