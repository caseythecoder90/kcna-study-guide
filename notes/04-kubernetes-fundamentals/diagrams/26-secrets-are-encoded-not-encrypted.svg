<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="657px" preserveAspectRatio="none" style="width:1561px;height:657px;background:#FFFFFF;" version="1.1" viewBox="0 0 1561 657" width="1561px" zoomAndPan="magnify"><title>base64 is encoding, not encryption</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="301.0605" x="622.7197" y="30.8838">base64 is encoding, not encryption</text></g><!--cluster undo--><g class="cluster" data-entity="undo" data-source-line="6" data-uid="ent0003" id="cluster_undo"><rect fill="#FEF2F2" height="279" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="510" x="14" y="142.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="151.6836" x="193.1582" y="160.8921">One command undoes it</text></g><!--cluster prot--><g class="cluster" data-entity="prot" data-source-line="12" data-uid="ent0007" id="cluster_prot"><rect fill="#F0FDF4" height="443" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="498" x="532" y="162.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.8989" x="684.5505" y="180.8921">What actually protects a Secret</text></g><!--entity sec--><g class="entity" data-entity="sec" data-source-line="4" data-uid="ent0002" id="entity_sec"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="206.1807" x="417" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.2617" x="431" y="79.8921">Secret db-creds</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="26.2808" x="431" y="92.9648">data:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="172.0684" x="437.1123" y="105.6138">password: c3VwZXJzZWNyZXQ=</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.0107" x="431" y="118.2627">looks protected &#183; is not</text></g><!--entity buys--><g class="entity" data-entity="buys" data-source-line="22" data-uid="ent0015" id="entity_buys"><rect fill="#FFFFFF" height="93.5444" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="517.1025" x="1038.5" y="313.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7197" x="1052.5" y="339.8921">What a Secret DOES buy you, even so</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="252.5542" x="1052.5" y="352.9648">the value is out of the container image and out of git</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="258.0488" x="1052.5" y="365.6138">a Secret is only sent to a node if a Pod there needs it</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="375.4019" x="1052.5" y="378.2627">the kubelet holds mounted Secret data in tmpfs &#8212; RAM, never written to disk</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="489.1025" x="1052.5" y="390.9116">kubectl describe REDACTS the values; the type system and RBAC can treat it differently from config</text></g><!--entity dec--><g class="entity" data-entity="dec" data-source-line="7" data-uid="ent0004" id="entity_dec"><rect fill="#FEE2E2" height="95.8442" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="460.0786" x="56" y="175.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="432.0786" x="70" y="201.8921">kubectl get secret db-creds -o jsonpath='{.data.password}' | base64 -d</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="76.4253" x="70" y="214.9648">&#8594; supersecret</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="70" y="229.4897">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="316.6475" x="70" y="242.5625">base64 exists to make binary safe to put in YAML and JSON.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="287.8799" x="70" y="255.2114">It takes no key, so it protects nothing. It is not a cipher.</text></g><!--entity who--><g class="entity" data-entity="who" data-source-line="8" data-uid="ent0005" id="entity_who"><rect fill="#FEE2E2" height="106.1934" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="460.1904" x="56" y="307.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9326" x="70" y="333.8921">Who can already read it</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="213.9575" x="70" y="346.9648">anyone with API access to get the Secret</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="432.1904" x="70" y="359.6138">anyone with list or watch on Secrets &#8212; that reads EVERY Secret in the namespace</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="380.8105" x="70" y="372.2627">anyone with access to etcd, where it is stored UNENCRYPTED by default</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="387.4868" x="70" y="384.9116">anyone who can CREATE A POD in the namespace &#8212; mount it and print it</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="263.4092" x="70" y="397.5605">any container running privileged: true on the node</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="13" data-uid="ent0008" id="entity_p1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="396.5537" x="582.5" y="195.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133.6372" x="596.5" y="221.8921">1 &#183; Encryption at Rest</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="368.5537" x="596.5" y="234.9648">an EncryptionConfiguration on the API server so etcd holds ciphertext</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="14" data-uid="ent0009" id="entity_p2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="445.5327" x="558" y="332.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="150.2681" x="572" y="358.8921">2 &#183; RBAC, least privilege</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="417.5327" x="572" y="371.9648">no blanket get/list/watch on Secrets; remember creating Pods is indirect access</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="15" data-uid="ent0010" id="entity_p3"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="296.313" x="633" y="449.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="204.4517" x="647" y="475.8921">3 &#183; Restrict to specific containers</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="268.313" x="647" y="488.9648">mount a Secret only into the container that needs it</text></g><!--entity p4--><g class="entity" data-entity="p4" data-source-line="16" data-uid="ent0011" id="entity_p4"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="480.9658" x="540.5" y="541.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="154.6353" x="554.5" y="567.8921">4 &#183; External secret stores</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="452.9658" x="554.5" y="580.9648">Vault, a cloud KMS, the Secrets Store CSI driver &#8212; the cluster never holds the material</text></g><g class="link" data-entity-1="sec" data-entity-2="undo" data-uid="lnk16" id="link_sec_undo"><polygon fill="#475569" points="47.3242,142.4157,56.7759,139.6468,51.1381,139.1824,51.6025,133.5446,47.3242,142.4157" style="stroke:#475569;stroke-width:1;"/><path d="M416.8218,99.1785 C351.388,102.1863 265.669,107.0286 192.9402,114.1377 C156.5758,117.6923 123.459,121.8136 97.7492,126.5557 C84.8942,128.9267 73.8911,131.4529 65.2596,134.1411 C60.9438,135.4852 57.221,136.8698 54.1561,138.2957 C52.6236,139.0086 51.2556,139.7319 50.0602,140.4656 C49.4625,140.8325 48.908,141.202 48.3976,141.5741 C48.1424,141.7601 47.8983,141.9468 47.6653,142.1342 C47.5488,142.2279 52.0118,138.4417 51.9009,138.5357" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="sec" data-entity-2="prot" data-uid="lnk17" id="link_sec_prot"><polygon fill="#475569" points="1002.9511,162.5095,1003.0954,152.6617,1000.9876,157.9112,995.7381,155.8033,1002.9511,162.5095" style="stroke:#475569;stroke-width:1;"/><path d="M623.2518,99.4793 C752.9152,105.7946 961.8082,119.4436 989,142.6982 C994.0472,147.0147 997.9562,152.3826 1000.9734,158.2813 C1001.3505,159.0186 1001.7138,159.7642 1002.0635,160.5171 C1002.2384,160.8936 1002.4099,161.2718 1002.5782,161.6518 C1002.6623,161.8418 1002.7455,162.0322 1002.828,162.223 C1002.8692,162.3184 1000.554,156.8959 1000.5949,156.9915" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1140.0156" x="203.2422" y="625.8301">The exam sentence: Secrets are NOT encrypted, they are ENCODED with base64. Knowing that is the point &#8212; a Secret is an intent-declaring container for sensitive values, not a vault.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="456.7979" x="544.8511" y="641.9287">Everything that makes it actually secret is configuration you add around it.</text></g><!--SRC=[VLPBRYCt4Dth59NPp4OV-8Ci78q0ZIm4deajHtBiiPCig6P9OiGc6oJRSizaWAnoW21toJv7cPEaYjsIMfyCOCXgDibwzTwhAdsZJA9pYT1kTyg_OAts7Qd4t8dKTvQ94Qsmm1JRMPxgHb118qo5ns_FGNb0arYfpBm9nWP-SaKMb3MDXiCa23EdtQycc3WC8ASj-Y_zBwRhrKUyE3dfIH74HRV3ZxtQCa0cl5zP9oyWERjVFNruz_7fuQPu-l3ZcyFTsjgbXypPG25Hmh__C3B2Ksrz1TskI18qeTS3uS5ZiWDlP10IcwR2ICYDjEX11JuqTpRFtWfP7kDNyAa1K3kwpAVqe65Ew