<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="570px" preserveAspectRatio="none" style="width:1267px;height:570px;background:#FFFFFF;" version="1.1" viewBox="0 0 1267 570" width="1267px" zoomAndPan="magnify"><title>The rule of thumb: did the container ever start?</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="405.0439" x="427.3682" y="30.8838">The rule of thumb: did the container ever start?</text></g><!--cluster never--><g class="cluster" data-entity="never" data-source-line="6" data-uid="ent0003" id="cluster_never"><rect fill="#FEF2F2" height="371" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="438" x="193.3901" y="147.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.0972" x="370.8416" y="165.8921">Never started</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.7515" x="260.5144" y="178.9648">STATUS: Pending &#183; ContainerCreating &#183; ImagePullBackOff</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="363.0591" x="230.8606" y="191.6138">InvalidImageName &#183; CreateContainerConfigError &#183; RunContainerError</text></g><!--cluster died--><g class="cluster" data-entity="died" data-source-line="14" data-uid="ent0009" id="cluster_died"><rect fill="#F0FDF4" height="358.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="450" x="639.3901" y="160.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.7891" x="809.4956" y="178.3921">Started, then died</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="320.2407" x="704.2698" y="191.4648">STATUS: CrashLoopBackOff &#183; Error &#183; Completed &#183; OOMKilled</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="119.7915" x="804.4944" y="204.1138">RESTARTS is climbing</text></g><!--entity start--><g class="entity" data-entity="start" data-source-line="4" data-uid="ent0002" id="entity_start"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="171" x="384.8901" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="143" x="398.8901" y="79.8921">The Pod is not working</text></g><!--entity nolog--><g class="entity" data-entity="nolog" data-source-line="7" data-uid="ent0004" id="entity_nolog"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="387.9546" x="235.3901" y="206.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="285.397" x="249.3901" y="232.8921">There are no logs. There was never a process.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="114.9253" x="249.3901" y="245.9648">kubectl logs answers:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="359.9546" x="249.3901" y="258.6138">Error from server (BadRequest): container &#8220;ubuntu&#8221; in pod &#8220;ubuntu&#8221;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256.6792" x="249.3901" y="271.2627">is waiting to start: trying and failing to pull image</text></g><!--entity nowhere--><g class="entity" data-entity="nowhere" data-source-line="8" data-uid="ent0005" id="entity_nowhere"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="341.0488" x="258.8901" y="324.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.3525" x="272.8901" y="350.8921">Look here instead</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="313.0488" x="272.8901" y="363.9648">kubectl describe pod NAME &#8212; the Events list at the bottom, and</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="276.3804" x="272.8901" y="376.6138">State / Last State / Reason / Message for each container</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="188.9014" x="272.8901" y="389.2627">kubectl events --for pod/NAME --watch</text></g><!--entity nowhat--><g class="entity" data-entity="nowhat" data-source-line="9" data-uid="ent0006" id="entity_nowhat"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="319.0381" x="269.8901" y="442.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.96" x="283.8901" y="468.8921">What it will say</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="291.0381" x="283.8901" y="481.9648">FailedScheduling &#183; Failed to pull image &#183; InvalidImageName</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="258.0435" x="283.8901" y="494.6138">executable file not found in $PATH &#183; secret not found</text></g><!--entity yeslog--><g class="entity" data-entity="yeslog" data-source-line="15" data-uid="ent0010" id="entity_yeslog"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="399.6689" x="681.3901" y="219.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.7427" x="695.3901" y="245.3921">Logs exist &#8212; from the run that just ended.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="371.6689" x="695.3901" y="258.4648">The live container may be between restarts, so the current log is empty</text></g><!--entity yeswhere--><g class="entity" data-entity="yeswhere" data-source-line="16" data-uid="ent0011" id="entity_yeswhere"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="368.436" x="697.3901" y="324.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="90.2954" x="711.3901" y="350.8921">Look here first</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="340.436" x="711.3901" y="363.9648">kubectl logs NAME --previous (or -p) &#8212; the instance that crashed</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="291.833" x="711.3901" y="376.6138">kubectl logs -f --tail=20 NAME &#8212; follow the next attempt</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="262.8452" x="711.3901" y="389.2627">then kubectl describe for the exit code and reason</text></g><!--entity yeswhat--><g class="entity" data-entity="yeswhat" data-source-line="17" data-uid="ent0012" id="entity_yeswhat"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="336.7896" x="712.8901" y="442.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.96" x="726.8901" y="468.8921">What it will say</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="285.5273" x="726.8901" y="481.9648">an application stack trace &#183; a missing environment variable</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="308.7896" x="726.8901" y="494.6138">or nothing at all, because the command simply ran and exited 0</text></g><g class="link" data-entity-1="start" data-entity-2="never" data-uid="lnk15" id="link_start_never"><polygon fill="#475569" points="226.8553,147.1793,235.8507,143.169,230.2016,143.4641,229.9065,137.815,226.8553,147.1793" style="stroke:#475569;stroke-width:1;"/><path d="M384.6766,79.2487 C358.0872,82.5436 328.4137,88.5583 300.4385,99.2981 C286.4508,104.668 272.8878,111.2192 260.3471,119.2023 C254.0768,123.1939 248.0621,127.5434 242.3777,132.2823 C239.5355,134.6518 236.7758,137.1185 234.1081,139.6865 C232.7743,140.9706 231.4634,142.2799 230.1767,143.615 C229.5333,144.2825 228.896,144.9566 228.2649,145.6371 C227.9493,145.9773 227.6353,146.3192 227.3228,146.6628 C227.1666,146.8345 231.0263,142.5485 230.8708,142.7211" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.3945" x="269.3901" y="131.9541">container never ran</text></g><g class="link" data-entity-1="start" data-entity-2="died" data-uid="lnk16" id="link_start_died"><polygon fill="#475569" points="643.4256,160.1032,642.8447,150.2715,641.1289,155.6618,635.7385,153.9461,643.4256,160.1032" style="stroke:#475569;stroke-width:1;"/><path d="M555.9134,95.8336 C585.0725,106.5834 615.3394,122.9593 635.3901,147.6982 C637.9996,150.9178 640.297,154.3878 642.3178,158.0341 C642.5704,158.4898 642.8187,158.9484 643.0628,159.4095 C643.1848,159.6401 640.5497,154.5417 640.6696,154.7736" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.4219" x="632.3901" y="131.9541">container ran at least once</text></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1249.7803" x="5" y="538.8301">Container not started means no application or container logs &#8212; asking for them wastes the first five minutes of an incident. Container started and then crashed means the logs from the last run are there,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="764.9346" x="247.4229" y="554.9287">and --previous is how you reach them. RESTARTS greater than 0 in kubectl get pods is the fastest way to tell the two apart.</text></g><!--SRC=[bLRBZjj64BphApf63ZQmajOv2eg2jR19ZEmBae8SaXn6mwOuqN26cOUqSX337v6Z_HsvvrFy9UaUKXIrqWO8i0zgo6bLLLVry0jbf8uPmc0mh7-2jTeFCoLMJfH-k9P6z4E19GwgMEfUK44ZB0e45-d2vX2AM2v7aAcCBX6aDK4eWmvmGtzy42vyq-ivb46O5MrvmPiVR0RAWx41jjQjbLczWF5OI8acJ2OWVBtnQD_TeI1clvYnL-zmzFhrPBwuMlmu7y43cemAmJz_mtGFOkfGX6RnRIbM-12rVYFa-ZxFnqEkCEbKUcisGgiiFNWdIaobk08U2bgJgzMrSzRntLaqxQsqs1HbDYjdO_L6P3KVaz3_qGCubi8X2Fer5hHT-G7KIzjsXu3AMOdU3pf0rt59HNJQ0iBuBJe_EkLJmyoTBS6Zusel2SyCVu_emwjHfrUVFtoCosX2_FpX4oW35VMdktPQcxgt5Iff6spTbH44j-C5OJB8XTBDpOeq1yMYTjHPji9OOd4iousrQqWwAEC3YkmCzGozT6g92UhTrUqruVqhEV1wGoRoe9KF849QMjeGR7d1m4wPp0Cr68Pm8sZ3_iCCXRU6Bcv9Ua8EEIc9GXO7qKuhxR5XZU1z_tsVjn72OKB82riHPD7HeT9KRA_4baaVQ_5JGHmKnKIHY5xiEb_tBKcCsLmMc4NTcBnUErOzcV-9jK_1uoFA6CIIlZId6YcRkOtKIlB3bmzNY- -vZaVfC1nkFiz412AIcWlzdmkLPMX-pUpMz2STei