<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="403px" preserveAspectRatio="none" style="width:1215px;height:403px;background:#FFFFFF;" version="1.1" viewBox="0 0 1215 403" width="1215px" zoomAndPan="magnify"><title>completions and parallelism &#8212; how many finish, and how many at once</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="614.1182" x="296.7656" y="30.8838">completions and parallelism &#8212; how many finish, and how many at once</text></g><!--cluster defs--><g class="cluster" data-entity="defs" data-source-line="4" data-uid="ent0002" id="cluster_defs"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="986" x="165.3247" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="235.6631" x="540.4932" y="79.8921">The two fields, in the API's own words</text></g><!--entity pat1--><g class="entity" data-entity="pat1" data-source-line="10" data-uid="ent0006" id="entity_pat1"><rect fill="#FFFFFF" height="136.0908" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="236.4629" x="63.3247" y="211.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.8735" x="77.3247" y="237.3921">1 &#183; Non-parallel</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.8828" x="77.3247" y="250.4648">leave BOTH unset &#8212; both default to 1</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="77.3247" y="264.9897">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="81.313" x="77.3247" y="278.0625">[pod] &#8594; success</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="77.3247" y="292.5874">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="206.6797" x="77.3247" y="305.6602">one Pod; the Job is complete as soon as it</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="208.4629" x="77.3247" y="318.3091">terminates successfully. A failure is retried,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="155.3159" x="77.3247" y="330.958">but only one Pod runs at a time.</text></g><!--entity pat2--><g class="entity" data-entity="pat2" data-source-line="12" data-uid="ent0007" id="entity_pat2"><rect fill="#326CE5" height="161.3887" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="318.9575" x="317.8247" y="198.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.6772" x="331.8247" y="224.8921">2 &#183; Fixed completion count</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.7114" x="331.8247" y="237.9648">completions: 6 &#183; parallelism: 2</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="331.8247" y="252.4897">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="199.1279" x="331.8247" y="265.5625">[pod][pod] &#8594; [pod][pod] &#8594; [pod][pod]</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="331.8247" y="280.0874">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="244.5083" x="331.8247" y="293.1602">six Pods must succeed, at most two at once &#8212;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="251.8506" x="331.8247" y="305.8091">so three waves. Near the end the controller runs</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="266.5298" x="331.8247" y="318.458">fewer than parallelism, because only the remaining</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.9038" x="331.8247" y="331.1069">completions are left to do.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="290.9575" x="331.8247" y="343.7559">completionMode: Indexed gives each Pod an index 0..5.</text></g><!--entity pat3--><g class="entity" data-entity="pat3" data-source-line="14" data-uid="ent0008" id="entity_pat3"><rect fill="#DCFCE7" height="148.7397" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="313.4897" x="654.8247" y="204.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.1772" x="668.8247" y="230.8921">3 &#183; Work queue</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="185.2114" x="668.8247" y="243.9648">completions UNSET &#183; parallelism: 3</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="668.8247" y="258.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.0908" x="668.8247" y="271.5625">[pod][pod][pod] all pulling from a shared queue</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="668.8247" y="286.0874">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="275.6929" x="668.8247" y="299.1602">&#8220;the success of ANY pod signals the success of all&#8221;.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="285.4897" x="668.8247" y="311.8091">Once one succeeds, no new Pods are created; the rest</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="249.9814" x="668.8247" y="324.458">are allowed to finish. The Pods must coordinate</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="245.1099" x="668.8247" y="337.1069">amongst themselves to decide who does what.</text></g><!--entity c--><g class="entity" data-entity="c" data-source-line="5" data-uid="ent0003" id="entity_c"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="469.8477" x="207.3247" y="94.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="76.5654" x="221.3247" y="120.8921">completions</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="441.8477" x="221.3247" y="133.9648">&#8220;the desired number of SUCCESSFULLY FINISHED pods the job should be run with&#8221;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="380.8052" x="221.3247" y="146.6138">a TOTAL across the whole Job &#8212; set it to 10 and ten Pods must succeed</text></g><!--entity p--><g class="entity" data-entity="p" data-source-line="6" data-uid="ent0004" id="entity_p"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="447.8638" x="695.3247" y="94.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9263" x="709.3247" y="120.8921">parallelism</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="419.8638" x="709.3247" y="133.9648">&#8220;the maximum desired number of pods the job should run AT ANY GIVEN TIME&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="350.2061" x="709.3247" y="146.6138">a CONCURRENCY CAP &#8212; set it to 3 and at most three run together</text></g><g class="link" data-entity-1="c" data-entity-2="p" data-uid="lnk5" id="link_c_p"><polygon fill="#475569" points="695.035,128.6982,686.035,124.6982,690.035,128.6982,686.035,132.6982,695.035,128.6982" style="stroke:#475569;stroke-width:1;"/><path d="M677.564,128.6982 C683.3876,128.6982 683.2113,128.6982 689.035,128.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pat1" data-entity-2="pat2" data-uid="lnk10" id="link_pat1_pat2"><polygon fill="#475569" points="317.6064,279.1982,308.6064,275.1982,312.6064,279.1982,308.6064,283.1982,317.6064,279.1982" style="stroke:#475569;stroke-width:1;"/><path d="M299.5513,279.1982 C305.5696,279.1982 305.588,279.1982 311.6064,279.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pat2" data-entity-2="pat3" data-uid="lnk11" id="link_pat2_pat3"><polygon fill="#475569" points="654.4985,279.1982,645.4985,275.1982,649.4985,279.1982,645.4985,283.1982,654.4985,279.1982" style="stroke:#475569;stroke-width:1;"/><path d="M637.1489,279.1982 C642.9321,279.1982 642.7153,279.1982 648.4985,279.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1197.6494" x="5" y="371.8301">parallelism 0 pauses the Job. Actual concurrency can be lower than requested: a fixed-count Job never runs more Pods than it has completions left, quota or permissions can block Pod creation,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1147.0225" x="30.3135" y="387.9287">and the controller throttles after repeated failures. Setting completions to null is what makes a Job a work queue &#8212; it is not the same as setting it to 1, which caps parallelism at 1 as well.</text></g><!--SRC=[VLR1RYD54BtxAugzSB4dSI8uXCYICGvhb7MYjGEAbZsqPygU9ZrTGtVFJW92oeaFG1pXExZpAVaIgdh6cp5sLeeSkwUxkkgzLw_cCsrJKsK8INBK_0KYuuyohJPE5VxeBhLg478iC2chmlI23WOXfQ8q63HP3yfcK2gdZ46ZVG5FZtz2JZKKoZx0MbljytxSz75H1I2ROg_dC0tARZZWgsME46hY0sWotmTjWM-5yVNiSmzKMwZ9PVuLd9zl75NbQ0JAGuPh3x_s03g1EgdzQC-z_WNFXiFHq-DV4Yv3hnrcOAjYXGve3OkRoMIwM5pSN5xUmiLiFbkyddu39MK-tlyJhS3dL9aCLWYkuZnqo9yU_pu_aj2ZpXKAbbVByIMer95lJjSvSKhVSGm1nMC07I0G38yZ804jNCjDHUK3-2fD4RCsi5IgUC66fjHqjyeEuFjL5kfU5rLneDf3TKbHuoMCvxVmxUpxwHoMipVJ5ogSNCqdDs_VJkUJMvYCh_zNrcciYjajYEi9kSC6ia0Rv4jTfxGDKTOKLd9XAGoStkHXCEAVl-teOWZ__WDpieDjnPry3AeF25zVBLz3PIKDIMT58HTXgCeqM7-ietFo7GFn7fv-_wD1tVj3cyYYqFDL14n8r7uhV9JCFP6L_phiGnNG5TggW7vxmxeovY61CQoLDfL3YUOmE8rPV__ygf8UCG_G9Y4uUe5MGT3SYnqeIwEqRR5KORY3tecWTw7lMGJFVS5VAniwbtLQvWo