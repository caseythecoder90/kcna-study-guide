<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="486px" preserveAspectRatio="none" style="width:1314px;height:486px;background:#FFFFFF;" version="1.1" viewBox="0 0 1314 486" width="1314px" zoomAndPan="magnify"><title>Two selector grammars, and two things &#8220;namespaced&#8221; means</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="533.1533" x="386.624" y="30.8838">Two selector grammars, and two things &#8220;namespaced&#8221; means</text></g><!--cluster eq--><g class="cluster" data-entity="eq" data-source-line="4" data-uid="ent0002" id="cluster_eq"><rect fill="#F8FAFC" height="222" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="436" x="255.7007" y="74.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="209.5107" x="368.9453" y="92.3921">Equality-based &#183; operators = == !=</text></g><!--cluster set--><g class="cluster" data-entity="set" data-source-line="8" data-uid="ent0004" id="cluster_set"><rect fill="#F0FDF4" height="247" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="528" x="699.7007" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="224.6563" x="851.3726" y="79.8921">Set-based &#183; operators in notin exists</text></g><!--entity ns1--><g class="entity" data-entity="ns1" data-source-line="12" data-uid="ent0006" id="entity_ns1"><rect fill="#326CE5" height="106.1934" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="371.5405" x="85.7007" y="336.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="237.707" x="99.7007" y="362.8921">Sense 1 &#183; the KEY can be namespaced</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="343.5405" x="99.7007" y="375.9648">a key is an optional PREFIX plus a name: app.kubernetes.io/name</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="342.9336" x="99.7007" y="388.6138">prefix = a DNS subdomain, up to 253 characters &#183; name = up to 63</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="212.7329" x="99.7007" y="401.2627">no prefix means the key is private to you</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.1499" x="99.7007" y="413.9116">automated components MUST use a prefix, and</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="330.0913" x="99.7007" y="426.5605">kubernetes.io/ and k8s.io/ are RESERVED for core components</text></g><!--entity ns2--><g class="entity" data-entity="ns2" data-source-line="14" data-uid="ent0007" id="entity_ns2"><rect fill="#FEE2E2" height="106.1934" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="473.6289" x="475.7007" y="336.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="293.3188" x="489.7007" y="362.8921">Sense 2 &#183; the SELECTOR is namespace-scoped</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="421.2119" x="489.7007" y="375.9648">a Service selects only Pods in its OWN namespace &#8212; labels are not cluster-wide</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="395.8013" x="489.7007" y="388.6138">kubectl get pods -l app=web searches the current namespace; add -A for all</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="398.1162" x="489.7007" y="401.2627">a NetworkPolicy's podSelector means THIS namespace; to allow traffic from</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="445.6289" x="489.7007" y="413.9116">another one you must add a namespaceSelector, which matches NAMESPACE labels</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="369.2842" x="489.7007" y="426.5605">(every namespace carries kubernetes.io/metadata.name automatically)</text></g><!--entity e--><g class="entity" data-entity="e" data-source-line="5" data-uid="ent0003" id="entity_e"><rect fill="#FFFFFF" height="180.937" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="384.7373" x="298.2007" y="107.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.0625" x="312.2007" y="133.3921">environment = production</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.189" x="312.2007" y="148.3408">tier != frontend</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.416" x="312.2007" y="163.2896">environment=production,tier!=frontend</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="312.2007" y="178.2383">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="356.7373" x="312.2007" y="191.311">the comma is AND. != also matches objects that have NO such key at all.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="312.2007" y="205.8359">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="180.3506" x="312.2007" y="218.9087">Written as a plain MAP in a manifest:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="41.5723" x="312.2007" y="231.5576">selector:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="84.3799" x="318.313" y="244.2065">component: redis</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="312.2007" y="258.7314">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="290.3936" x="312.2007" y="271.8042">ONLY grammar available to: Service &#183; ReplicationController</text></g><!--entity s--><g class="entity" data-entity="s" data-source-line="9" data-uid="ent0005" id="entity_s"><rect fill="#DCFCE7" height="206.2349" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="477.8667" x="741.7007" y="94.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="195.7173" x="755.7007" y="120.8921">environment in (production, qa)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="180.5527" x="755.7007" y="135.8408">tier notin (frontend, backend)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.9937" x="755.7007" y="150.7896">partition</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="142.4629" x="843.8125" y="151.2134">&#8212; the key exists, any value</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56.3228" x="755.7007" y="165.7383">!partition</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128.9814" x="844.5298" y="166.1621">&#8212; the key does not exist</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="755.7007" y="180.687">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="368.8921" x="755.7007" y="193.7598">In a manifest, matchLabels + matchExpressions, ALL ANDed together:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="45.853" x="755.7007" y="206.4087">selector:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.813" x="761.813" y="219.0576">matchLabels: {component: redis}</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="101.4814" x="761.813" y="231.7065">matchExpressions:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.2891" x="761.813" y="244.3555">- {key: tier, operator: In, values: [cache]}</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.583" x="755.7007" y="257.0044">operators: In &#183; NotIn &#183; Exists &#183; DoesNotExist</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="755.7007" y="271.5293">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="449.8667" x="755.7007" y="284.6021">Available to: Deployment &#183; ReplicaSet &#183; DaemonSet &#183; StatefulSet &#183; Job &#183; NetworkPolicy</text></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1296.4014" x="5" y="454.8301">Equality is a special case of set-based: environment=production is the same as environment in (production). Mixing them is allowed at the command line &#8212; partition in (customerA, customerB),environment!=qa.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1127.6152" x="89.3931" y="470.9287">The scoping point is the one that surprises people: a label selector never crosses a namespace on its own, so &#8220;it matches nothing&#8221; is usually a namespace problem rather than a typo.</text></g><!--SRC=[bLR1RYD54BtxAofxOIDiHzaL29dOajaC44YSA0uigyqUoZrbkqbFzwIxnubPhRGVmH6-WpkVaY-XQiOUZx4NYIXnnZrThwhhlQhg0ssLALA2RlUe-etEcN2KQfnvpCBHdRBOYNFAg9iNcMb57Gt1pOE3G8PKT1vaOuO-j05j2f5VnRcsim1F7_-mc578KL7wzF5Fo0XjQBKysw6TCSwpvBv0e-EoCy50AVpz5xYSF39iW3xq-t3GVmOd9pFlYdmm00n0z_2-1T308BlGtjcCR6IRtBkqK54xUskZ9iy8CENNaMnwQnjx-vkTRTbuqDzikxKdGVz6lUFZ0PyTbEC3WWum79rs1H1DS91XL7CAu2Q_SZ21JuqHvhWW65r2ADGSxcW9l8R6T4-E172m1VtQwyZ-v5G8kK5juM9u1VmF6TpgAONOgmrhitNYzxm22JLtVCpOunIbEkppUpawVxDc3N21sk244nbT3yRa5rgH475DkT4A9J-lE2_U6KD-1IUSb06lE6bzs69rJ74VeNmmwo9_qgCECTJ4VkTSMW45Yl_5Bfi-Rx06ztYu8hd2VRvci0qJL7VymEzpz2nQtW_rJvs9fu-_Wn0iH5L1YOYNi41JK9swWrs8lGYfOpLm91