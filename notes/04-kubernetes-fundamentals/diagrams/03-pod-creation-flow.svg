<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="433px" preserveAspectRatio="none" style="width:1157px;height:433px;background:#FFFFFF;" version="1.1" viewBox="0 0 1157 433" width="1157px" zoomAndPan="magnify"><title>kubectl run nginx &#8212; every step goes through the API server; nobody calls anybody else</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="753.1875" x="198.0996" y="30.8838">kubectl run nginx &#8212; every step goes through the API server; nobody calls anybody else</text></g><!--entity kubectl--><g class="entity" data-entity="kubectl" data-source-line="4" data-uid="ent0002" id="entity_kubectl"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="221.832" x="191.4434" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1899" x="205.4434" y="87.8921">kubectl</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="193.832" x="205.4434" y="100.9648">POST /api/v1/namespaces/default/pods</text></g><!--entity sched--><g class="entity" data-entity="sched" data-source-line="5" data-uid="ent0003" id="entity_sched"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="194.2139" x="431.4434" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.0845" x="445.4434" y="87.8921">kube-scheduler</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="166.2139" x="445.4434" y="100.9648">watching for Pods with no node</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="6" data-uid="ent0004" id="entity_api"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="266.4014" x="282.4434" y="192.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="296.4434" y="218.8921">kube-apiserver</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.4014" x="296.4434" y="231.9648">authenticates &#183; authorises &#183; admits &#183; validates</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="206.626" x="296.4434" y="244.6138">persists to etcd &#183; notifies every watcher</text></g><!--entity etcd--><g class="entity" data-entity="etcd" data-source-line="7" data-uid="ent0005" id="entity_etcd"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="238.8691" x="725.9434" y="192.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="26.73" x="739.9434" y="218.8921">etcd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="187.6392" x="739.9434" y="231.9648">the Pod object, nodeName empty &#8230;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.8691" x="739.9434" y="244.6138">then nodeName: worker-1 &#8230; then status</text></g><!--entity kubelet--><g class="entity" data-entity="kubelet" data-source-line="8" data-uid="ent0006" id="entity_kubelet"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="239.46" x="295.9434" y="327.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="122.8081" x="309.9434" y="353.8921">kubelet on worker-1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="211.46" x="309.9434" y="366.9648">watching for Pods assigned to this node</text></g><!--entity rt--><g class="entity" data-entity="rt" data-source-line="9" data-uid="ent0007" id="entity_rt"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="279.292" x="635.9434" y="321.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.2217" x="649.9434" y="347.8921">containerd &#8594; runc</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="251.292" x="649.9434" y="360.9648">pull nginx &#183; create the sandbox (CNI assigns the IP)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="94.7676" x="649.9434" y="373.6138">&#183; start the container</text></g><g class="link" data-entity-1="kubectl" data-entity-2="api" data-uid="lnk8" id="link_kubectl_api"><polygon fill="#475569" points="387.8185,192.6951,385.1091,183.2263,384.6092,188.861,378.9745,188.3612,387.8185,192.6951" style="stroke:#475569;stroke-width:1;"/><path d="M325.3106,118.0175 C343.3678,139.5903 364.78,165.1712 383.9674,188.0942" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="75.375" x="378.4434" y="159.9541">1 &#183; create Pod</text></g><g class="link" data-entity-1="api" data-entity-2="etcd" data-uid="lnk9" id="link_api_etcd"><polygon fill="#475569" points="725.7308,226.6982,716.7308,222.6982,720.7308,226.6982,716.7308,230.6982,725.7308,226.6982" style="stroke:#475569;stroke-width:1;"/><path d="M548.5533,226.6982 C605.1602,226.6982 664.6714,226.6982 719.7308,226.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.7168" x="563.1934" y="215.9541">2 &#183; write (nodeName empty)</text></g><g class="link" data-entity-1="sched" data-entity-2="api" data-uid="lnk10" id="link_sched_api"><polygon fill="#475569" points="447.4152,192.6526,456.4625,188.7607,450.81,188.9817,450.589,183.3291,447.4152,192.6526" style="stroke:#475569;stroke-width:1;"/><path d="M508.5924,117.7025 C496.0382,134.4348 479.2507,156.1894 463.4434,174.6982 C458.3897,180.6156 456.9365,182.3567 451.4889,188.2475" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.0996" x="516.6104" y="152.9541">3 &#183; watch fires: unscheduled Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.4336" x="501.4434" y="166.7529">4 &#183; filter + score nodes, write a Binding</text></g><g class="link" data-entity-1="api" data-entity-2="kubelet" data-uid="lnk11" id="link_api_kubelet"><polygon fill="#475569" points="322.2135,327.6316,316.8708,319.3578,318.029,324.8948,312.492,326.053,322.2135,327.6316" style="stroke:#475569;stroke-width:1;"/><path d="M312.9117,260.7595 C295.3641,272.0291 286.001,286.2874 297.4434,303.6982 C303.8171,313.3965 307.4487,317.9749 317.1921,324.3474" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.4375" x="303.4434" y="295.9541">5 &#183; watch fires: a Pod is assigned here</text></g><g class="link" data-entity-1="kubelet" data-entity-2="rt" data-uid="lnk12" id="link_kubelet_rt"><polygon fill="#475569" points="635.8373,355.6982,626.8373,351.6982,630.8373,355.6982,626.8373,359.6982,635.8373,355.6982" style="stroke:#475569;stroke-width:1;"/><path d="M535.3181,355.6982 C567.5331,355.6982 596.651,355.6982 629.8373,355.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="71.3496" x="549.9434" y="344.9541">6 &#183; CRI: run it</text></g><g class="link" data-entity-1="api" data-entity-2="kubelet" data-uid="lnk14" id="link_api_kubelet"><polygon fill="#475569" points="497.242,261.0639,501.4547,269.9663,501.0319,264.3252,506.6729,263.9024,497.242,261.0639" style="stroke:#475569;stroke-width:1;"/><path d="M501.7898,264.9775 C507.7288,270.0882 508.4102,272.0211 512.4434,278.6982 C524.3893,298.4756 508.9919,315.0921 487.1961,327.6949" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.0801" x="522.4434" y="295.9541">7 &#183; status: Running, PodIP</text></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1067.7119" x="40.8374" y="401.8301">The scheduler never talks to the kubelet, and the kubelet never talks to the scheduler. Each watches the API server for the change it cares about and writes back what it did.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1139.3867" x="5" y="417.9287">Loose coupling through one shared, watched store is the Kubernetes design pattern &#8212; and why every component can restart independently. A Pod with no node yet shows as Pending.</text></g><!--SRC=[VLJDRjD04BxxAOQUMf742hzIY2ALYaC4Ab7fZNBOx4xi9PjTQtVSD9muyG28P-0LkFCeVH9crtPgqe8K9R7z-Pjlvljs7cahJQqGHgEy-P1p9kHA