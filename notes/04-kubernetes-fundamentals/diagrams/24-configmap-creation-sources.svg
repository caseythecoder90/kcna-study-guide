<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="461px" preserveAspectRatio="none" style="width:1322px;height:461px;background:#FFFFFF;" version="1.1" viewBox="0 0 1322 461" width="1322px" zoomAndPan="magnify"><title>Three ways to fill a ConfigMap &#8212; and the keys each one produces</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="565.1279" x="374.5093" y="30.8838">Three ways to fill a ConfigMap &#8212; and the keys each one produces</text></g><!--entity file--><g class="entity" data-entity="file" data-source-line="4" data-uid="ent0002" id="entity_file"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="155.9116" x="786.8232" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.9116" x="800.8232" y="87.8921">app.properties on disk</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="57.1807" x="800.8232" y="100.9648">colour=blue</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="50.4453" x="800.8232" y="113.6138">size=large</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="43.103" x="800.8232" y="126.2627">retries=3</text></g><!--entity lit--><g class="entity" data-entity="lit" data-source-line="6" data-uid="ent0003" id="entity_lit"><rect fill="#FFFFFF" height="136.0908" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="389.9097" x="99.8232" y="242.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.5444" x="113.8232" y="268.8921">--from-literal=key=value</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="361.9097" x="113.8232" y="281.9648">kubectl create cm demo --from-literal=colour=blue --from-literal=size=large</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="113.8232" y="296.4897">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="286.7681" x="113.8232" y="309.5625">ONE key per flag, typed by hand. Repeat the flag for more.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="113.8232" y="324.0874">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="24.4653" x="113.8232" y="337.1602">data:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="56.8691" x="119.9355" y="349.8091">colour: blue</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="50.1338" x="119.9355" y="362.458">size: large</text></g><!--entity ff--><g class="entity" data-entity="ff" data-source-line="8" data-uid="ent0004" id="entity_ff"><rect fill="#326CE5" height="214.2842" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="347.8701" x="507.8232" y="203.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.5454" x="521.8232" y="229.8921">--from-file=app.properties</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="262.5391" x="521.8232" y="242.9648">kubectl create cm demo --from-file=app.properties</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="521.8232" y="257.4897">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="319.8701" x="521.8232" y="270.5625">ONE key for the WHOLE FILE. The key is the file's basename,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="251.2383" x="521.8232" y="283.2114">the value is its entire contents, newlines and all.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="521.8232" y="297.7363">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="26.2808" x="521.8232" y="310.8091">data:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="86.2007" x="527.9355" y="323.458">app.properties: |</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="62.6484" x="534.0479" y="336.1069">colour=blue</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="53.5068" x="534.0479" y="348.7559">size=large</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="46.1753" x="534.0479" y="361.4048">retries=3</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="521.8232" y="375.9297">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="279.3452" x="521.8232" y="389.0024">--from-file=cfg=app.properties renames the key to cfg</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="239.3252" x="521.8232" y="401.6514">--from-file=dir/ takes every file in the directory</text></g><!--entity fef--><g class="entity" data-entity="fef" data-source-line="10" data-uid="ent0005" id="entity_fef"><rect fill="#DCFCE7" height="161.3887" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="347.4404" x="874.3232" y="230.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="185.2754" x="888.3232" y="256.3921">--from-env-file=app.properties</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="285.1567" x="888.3232" y="269.4648">kubectl create cm demo --from-env-file=app.properties</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="888.3232" y="283.9897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="319.4404" x="888.3232" y="297.0625">MANY keys from ONE file. Each LINE is parsed as key=value.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="173.6206" x="888.3232" y="309.7114">The filename disappears entirely.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="888.3232" y="324.2363">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="26.2808" x="888.3232" y="337.3091">data:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="62.9438" x="894.4355" y="349.958">colour: blue</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="53.8022" x="894.4355" y="362.6069">size: large</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="57.4707" x="894.4355" y="375.2559">retries: &#8220;3&#8221;</text></g><g class="link" data-entity-1="file" data-entity-2="ff" data-uid="lnk6" id="link_file_ff"><polygon fill="#475569" points="775.9533,203.4804,784.9161,199.3977,779.2695,199.7384,778.9288,194.0918,775.9533,203.4804" style="stroke:#475569;stroke-width:1;"/><path d="M829.539,143.0135 C814.0635,160.4763 799.0645,177.4014 779.9328,198.99" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0332" x="815.8232" y="177.9541">the same file</text></g><g class="link" data-entity-1="file" data-entity-2="fef" data-uid="lnk7" id="link_file_fef"><polygon fill="#475569" points="977.0379,229.823,974.0624,220.4344,973.7217,226.081,968.0752,225.7403,977.0379,229.823" style="stroke:#475569;stroke-width:1;"/><path d="M900.1075,143.0135 C921.9186,167.6256 946.7083,195.5986 973.0585,225.3326" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="68.0332" x="939.8232" y="177.9541">the same file</text></g><g class="caption" data-source-line="17"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1304.1465" x="5" y="429.8301">The pair that catches people: the same file through --from-file gives ONE key holding the whole text, and through --from-env-file gives ONE KEY PER LINE. Use --from-file when the container wants a config FILE</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1142.2646" x="85.9409" y="445.9287">(nginx.conf, application.yaml) and --from-env-file when it wants ENVIRONMENT VARIABLES. Keys must be alphanumeric plus - _ . &#8212; and the whole ConfigMap may not exceed 1 MiB.</text></g><!--SRC=[jLNHQjim57tlLzprPHia3gLl8GcqmsEXRJgohgDiOoZoZIqYIqQIasQCqe_Ou_Pp_P9ToSaMn-wWZ44Wjg_ElLVd7Xqz4uhBCa68ebxrSrfBsqi4ImtBRM_15Ukw37ECYZAN1quuYN2L6KHOiRK5fs4kf0G6hxIQY_I25V1m_nsOIe1mi41QX8nde1L2ONHIShG71mQvOogbP8UiA28A56YSG4lh815syKaDhFYA_QEZ4TTIbsOuaoKEUlxZQ2Ve_uUIcRGbPj0PIZayteGEOJ38IuV9Q0JC-iQnribTzwuxDphlIk7GC3caxeTBHdLtaYxA6I4aS8FC8V0S4imrDB0xNJU3BLtlbBYSn9uu84fWBbdQ0RSkC87P6Z8YDe8f5bGy4EpZCDS6ScqmQikMCCVwJN80gWxxq4uiG7Y2tIuzWOLaGbK4qcxQ-VFC3kjpVGA3BUY_iUGtxvduyERoF8RNu_Cu8eK6wO6m5KcKyRc56REeM8wTvcxzgZ1f3n6EDAkSCDISLeuURGSKhgHG950lRIRbqxYkRwSFtzeMRKSoV6mYrKmUaxkFxqk-rbsTOJvFzrWcjAV7Ra-kFzsqgbcfdYWHfWUEBGY8IpJhG3S85T9Ga8QjpNf7GenpudHp2EVj4aAr_4SPFPAXZPYBaybDPLKU2LvP7Xb1x9thV4pl98k26Kkda9h-xGjHavkhZTuyazx9g3eIS2CekVxVPxGMtiYXJvxyu_ZX_kVE45Ajjpw8D8CmiswYLwexeg50FqpF-aq4dwp7iRc0p02w7pEH9AW-6v5cBYGwe5pDpxuYPuKJvFO34JWhcF3dc6oDCySp4bE1kf2uLuVUZ2xJh6uNa8eb8RQMa6cP29K6v8fU28MthhEvbVRmMvtiv3YBR-1jF0sJZ-2znRrggmmhTNjx83iadrunSWcw1dcu1eCD3Nh2JqECNgXKgDl8XphU2QIWBTBMepNBvSlGLRERK8CuhHB7a-lnz79o4K-kuFfaEZuvFO_VHN3cDPkNri4CoPGAkXxA78tWKCZIGXU-G5IxZois_jpLELk3qWxmbYDf-mWkn6da6_y5]--></g></svg>