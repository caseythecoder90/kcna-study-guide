<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="372px" preserveAspectRatio="none" style="width:1339px;height:372px;background:#FFFFFF;" version="1.1" viewBox="0 0 1339 372" width="1339px" zoomAndPan="magnify"><title>What sits inside a namespace, and what sits above them all</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="509.1592" x="411.0693" y="30.8838">What sits inside a namespace, and what sits above them all</text></g><!--cluster cluster--><g class="cluster" data-entity="cluster" data-source-line="4" data-uid="ent0002" id="cluster_cluster"><rect fill="#F8FAFC" height="267" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="1250" x="52.1489" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="71.5254" x="641.3862" y="71.8921">One cluster</text></g><!--entity cw--><g class="entity" data-entity="cw" data-source-line="6" data-uid="ent0003" id="entity_cw"><rect fill="#F1F5F9" height="95.8442" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="534.1289" x="60.1489" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.4014" x="74.1489" y="112.8921">Cluster-scoped &#183; no namespace &#183; one set for the whole cluster</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="407.1665" x="74.1489" y="125.9648">Node &#183; Namespace &#183; PersistentVolume &#183; StorageClass &#183; CustomResourceDefinition</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="506.1289" x="74.1489" y="138.6138">ClusterRole &#183; ClusterRoleBinding &#183; IngressClass &#183; PriorityClass &#183; APIService &#183; RuntimeClass &#183; CSIDriver</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="74.1489" y="153.1387">&#160;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="475.417" x="74.1489" y="166.2114">kubectl api-resources --namespaced=false &#183; adding -n or -A to kubectl get nodes changes nothing</text></g><!--entity ks--><g class="entity" data-entity="ks" data-source-line="8" data-uid="ent0004" id="entity_ks"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="244.4229" x="60.1489" y="225.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.1226" x="74.1489" y="251.3921">namespace: kube-system</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="204.832" x="74.1489" y="264.4648">objects created by the Kubernetes system</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="216.4229" x="74.1489" y="277.1138">coredns &#183; kube-proxy &#183; etcd &#183; kube-apiserver</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="204.8213" x="74.1489" y="289.7627">kube-scheduler &#183; kube-controller-manager</text></g><!--entity df--><g class="entity" data-entity="df" data-source-line="10" data-uid="ent0005" id="entity_df"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="301.8936" x="322.1489" y="218.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.3735" x="336.1489" y="244.8921">namespace: default</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201.6953" x="336.1489" y="257.9648">where objects go when you pass no -n</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="273.8936" x="336.1489" y="270.6138">service/kubernetes lives here, not in kube-system &#8212;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="243.2783" x="336.1489" y="283.2627">the ClusterIP for the API server, kept in default</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="229.2437" x="336.1489" y="295.9116">so every Pod can find the API the same way</text></g><!--entity ta--><g class="entity" data-entity="ta" data-source-line="12" data-uid="ent0006" id="entity_ta"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="329.3076" x="642.6489" y="218.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6689" x="656.6489" y="244.8921">namespace: team-a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="257.3506" x="656.6489" y="257.9648">Pod &#183; Deployment &#183; ReplicaSet &#183; Service &#183; Ingress</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="301.3076" x="656.6489" y="270.6138">ConfigMap &#183; Secret &#183; ServiceAccount &#183; Role &#183; RoleBinding</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.5215" x="656.6489" y="283.2627">PVC &#183; Job &#183; CronJob &#183; HPA &#183; NetworkPolicy</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="254.853" x="656.6489" y="295.9116">ResourceQuota &#183; LimitRange &#183; Endpoints &#183; Event</text></g><!--entity tb--><g class="entity" data-entity="tb" data-source-line="14" data-uid="ent0007" id="entity_tb"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="303.6768" x="990.1489" y="225.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.3799" x="1004.1489" y="251.3921">namespace: team-b</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="237.7783" x="1004.1489" y="264.4648">a Pod named web here and a Pod named web</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="275.6768" x="1004.1489" y="277.1138">in team-a are two different objects &#8212; names must be</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.1099" x="1004.1489" y="289.7627">unique within a namespace, not across them</text></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1321.2979" x="5" y="340.8301">A namespace scopes names, RBAC and resource budgets. It does not scope the network: a Pod in team-a can still reach a Service in team-b at web.team-b.svc.cluster.local unless a NetworkPolicy says otherwise.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1145.5254" x="92.8862" y="356.9287">Namespaces cannot be nested, every object belongs to exactly one, and deleting a namespace deletes everything inside it. Namespaces starting with kube- are reserved for the system.</text></g><!--SRC=[XLRThXet4BxdAQQvPa6vFQ98X1Efz2Ub72czQ7lXjOV5nUlPsbx8jcgKX-Yxz3wFaYVfs5wMFO6e4bgmr_FD-9jlPlXAMsbQXJ2RpVCd41a_LrfKJjH-VfHM5E60DSwQjZQJe8D1-FaW0dWTF6ZhDPiBiA96tmY9Kn1MmNau8Kew8KG84CPC9Wvb4BPYb1S_MWHsxmEw5x1OL8xQPha4uI-xyDTa0Z2oMEVzmajgKC77Vy7IrNLS4sDw3B0d5vro86G6Bx_QXTT_uiFBbyitfDBvDsFZBJgl-Q0DRycqTTfx2kH4XMiZl8_hDIDHlKDFhPFuY7jjTT1a5_C8lHovw8FTnG2YuNNvIbkbRHLtDxPowFq0ltMQd0xTiB7QRfxGdNIESDVQeEjHD4-RHwTFw0Rtem2ERSdK6H2DBbmVi8VtnVjYe4nzlHV69sYXKao51QQkM44Wk01KJAXbmZWn1yu4VriA1pxTUutPgzk0gi_U-REq3UuU4cJXEsQY7aLAvUzycYqT2eQ1ial9-uuFEuk17MQJMv8bELGsSP6W6qVlkhZ28DMmomnu9d54qpEIM4y7LArXnLqi9DdWoF1MKGlB0d2ZkpP6Q9llUlHVlgl2lMXD63ax7z0XN6vR4SiJBNJKGXCJoc8kxWZ9v_pFZrSw3EVSGqIRnbnm7OwPXKyV_hc5YOps8jniXm9XVK7cPWf7R19K7_YTI0YGJtQm9GLIM63rgm4cVdk-Ffn5Ds9BICaLbUbI-o_J5L3KXHXvYquu7u_O6EfgnaWLm2ijnHEcrQWq-agwKuTazxhwGJJPW3KsDbr9IMqFtLVgg4HlqRPlr_7CjrIc-dDa-v_VR5UfeM0uapjkYQFiRiqlZUEdbeA8vx_NjGwxM5LnzTggXhGDIT2lJtpd4P4LKLzXGVmFZUN8fKZPYYUuBsEPL9EQz6SlReDbAUIaW60JlXSelT-pEVDr4J5BBNTWg5bQKE8jJ6lr7oshGiUUyNnMHEqAwOZ57qV4_SkMyRBo3CKl1wqKsjyKdMsnZBK7_BZkErqT0hzWbG4_RbymRy2FEo_AoT-JYHHDREMmqClLQAoaQUFpnXHshrRhHD-bfKBPAkwGVWQR08foTyn6gIHiLiH3p_ULr5X0FcXZ64h80x-_oFbofWGUevoQMLxD_4dE-basCoI5WTOQ5ZsRFjCTbs7dWNiqkZDtljbYhcD2z78OTpvwZt6MCK06LDE-j7DYUT-GhNmS0_XEy1JeucpDqrsXmH27nIYNUPDn4qgQ3fT_1phCOEJO1-6ITHH4Rbj9Nyndx4DgQ4svcQNW_mC0]--></g></svg>