<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="671px" preserveAspectRatio="none" style="width:1073px;height:671px;background:#FFFFFF;" version="1.1" viewBox="0 0 1073 671" width="1073px" zoomAndPan="magnify"><title>High availability &#8212; three control plane nodes, an API load balancer, etcd quorum</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="691.1367" x="187.2549" y="30.8838">High availability &#8212; three control plane nodes, an API load balancer, etcd quorum</text></g><!--cluster cp1--><g class="cluster" data-entity="cp1" data-source-line="7" data-uid="ent0004" id="cluster_cp1"><rect fill="#F8FAFC" height="257" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="172" x="279.3232" y="236.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.6182" x="318.0142" y="254.8921">Control plane 1</text></g><!--cluster cp2--><g class="cluster" data-entity="cp2" data-source-line="14" data-uid="ent0010" id="cluster_cp2"><rect fill="#F8FAFC" height="257" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="172" x="459.3232" y="236.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.6182" x="498.0142" y="254.8921">Control plane 2</text></g><!--cluster cp3--><g class="cluster" data-entity="cp3" data-source-line="21" data-uid="ent0016" id="cluster_cp3"><rect fill="#F8FAFC" height="250.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="170" x="639.3232" y="236.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.6182" x="677.0142" y="254.8921">Control plane 3</text></g><!--entity clients--><g class="entity" data-entity="clients" data-source-line="4" data-uid="ent0002" id="entity_clients"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="225.2534" x="448.8232" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2534" x="462.8232" y="87.8921">kubectl &#183; kubelets on every worker</text></g><!--entity lb--><g class="entity" data-entity="lb" data-source-line="5" data-uid="ent0003" id="entity_lb"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="345.8345" x="388.3232" y="141.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.0908" x="402.3232" y="167.8921">API load balancer</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="317.8345" x="402.3232" y="180.9648">one stable endpoint (:6443) in front of three kube-apiservers;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="304.9922" x="402.3232" y="193.6138">the kubeconfig and every kubelet point here, not at a node</text></g><!--entity raft--><g class="entity" data-entity="raft" data-source-line="29" data-uid="ent0022" id="entity_raft"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="460.792" x="314.8232" y="546.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="127.1436" x="328.8232" y="572.8921">etcd Raft consensus</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="345.9736" x="328.8232" y="585.9648">a write is committed when a majority &#8212; quorum = n/2 + 1 &#8212; has it.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="432.792" x="328.8232" y="598.6138">3 members tolerate 1 failure &#183; 5 tolerate 2 &#183; 7 tolerate 3. Even numbers add nothing.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="373.0386" x="328.8232" y="611.2627">Lose quorum and the cluster goes read-only: the API server can't write.</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="8" data-uid="ent0005" id="entity_a1"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="120.4917" x="323.3232" y="269.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="337.3232" y="295.8921">kube-apiserver</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="9" data-uid="ent0006" id="entity_e1"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="108.9199" x="316.8232" y="349.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.9199" x="330.8232" y="375.8921">etcd member</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="10" data-uid="ent0007" id="entity_s1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="156.4121" x="287.3232" y="429.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.5781" x="301.3232" y="455.8921">scheduler &#183; c-m</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="128.4121" x="301.3232" y="468.9648">one active, others standby</text></g><!--entity a2--><g class="entity" data-entity="a2" data-source-line="15" data-uid="ent0011" id="entity_a2"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="120.4917" x="501.3232" y="269.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="515.3232" y="295.8921">kube-apiserver</text></g><!--entity e2--><g class="entity" data-entity="e2" data-source-line="16" data-uid="ent0012" id="entity_e2"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="108.9199" x="496.8232" y="349.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.9199" x="510.8232" y="375.8921">etcd member</text></g><!--entity s2--><g class="entity" data-entity="s2" data-source-line="17" data-uid="ent0013" id="entity_s2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="155.7998" x="467.3232" y="429.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.5781" x="481.3232" y="455.8921">scheduler &#183; c-m</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="127.7998" x="481.3232" y="468.9648">leader election via the API</text></g><!--entity a3--><g class="entity" data-entity="a3" data-source-line="22" data-uid="ent0017" id="entity_a3"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="120.4917" x="681.3232" y="269.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="695.3232" y="295.8921">kube-apiserver</text></g><!--entity e3--><g class="entity" data-entity="e3" data-source-line="23" data-uid="ent0018" id="entity_e3"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="108.9199" x="666.8232" y="349.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.9199" x="680.8232" y="375.8921">etcd member</text></g><!--entity s3--><g class="entity" data-entity="s3" data-source-line="24" data-uid="ent0019" id="entity_s3"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="117.5781" x="649.3232" y="436.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.5781" x="663.3232" y="462.3921">scheduler &#183; c-m</text></g><g class="link" data-entity-1="clients" data-entity-2="lb" data-uid="lnk23" id="link_clients_lb"><polygon fill="#475569" points="561.3232,141.4652,565.3232,132.4652,561.3232,136.4652,557.3232,132.4652,561.3232,141.4652" style="stroke:#475569;stroke-width:1;"/><path d="M561.3232,104.7341 C561.3232,115.5815 561.3232,123.1622 561.3232,135.4652" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="a1" data-uid="lnk24" id="link_lb_a1"><polygon fill="#475569" points="409.4335,269.5758,419.0103,267.277,413.4023,266.5347,414.1446,260.9268,409.4335,269.5758" style="stroke:#475569;stroke-width:1;"/><path d="M499.7334,209.854 C484.9734,218.2651 469.4124,227.5266 455.3232,236.6982 C439.6616,246.8935 427.6251,255.6368 414.1961,265.9265" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="a2" data-uid="lnk25" id="link_lb_a2"><polygon fill="#475569" points="561.3232,269.6977,565.3232,260.6977,561.3232,264.6977,557.3232,260.6977,561.3232,269.6977" style="stroke:#475569;stroke-width:1;"/><path d="M561.3232,209.8323 C561.3232,229.2001 561.3232,247.0345 561.3232,263.6977" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="lb" data-entity-2="a3" data-uid="lnk26" id="link_lb_a3"><polygon fill="#475569" points="716.8159,269.6104,712.329,260.843,712.9266,266.4682,707.3014,267.0658,716.8159,269.6104" style="stroke:#475569;stroke-width:1;"/><path d="M626.9261,209.852 C642.1114,218.1554 658.0079,227.3695 672.3232,236.6982 C687.6898,246.7121 699.2779,255.4412 712.1488,265.8397" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s1" data-entity-2="raft" data-uid="lnk29" id="link_s1_raft"><polygon fill="#475569" points="489.4337,546.6098,484.4016,538.1436,485.3536,543.7197,479.7774,544.6718,489.4337,546.6098" style="stroke:#475569;stroke-width:1;"/><path d="M403.4966,485.7377 C428.4705,503.4276 456.6248,523.3702 484.5376,543.1417" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="467.3232" y="520.9541">e1</text></g><g class="link" data-entity-1="s2" data-entity-2="raft" data-uid="lnk30" id="link_s2_raft"><polygon fill="#475569" points="545.3232,546.6098,549.3232,537.6098,545.3232,541.6098,541.3232,537.6098,545.3232,546.6098" style="stroke:#475569;stroke-width:1;"/><path d="M545.3232,485.7377 C545.3232,503.4276 545.3232,520.8383 545.3232,540.6098" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="551.3232" y="520.9541">e2</text></g><g class="link" data-entity-1="s3" data-entity-2="raft" data-uid="lnk31" id="link_s3_raft"><polygon fill="#475569" points="595.8952,546.6405,605.4485,544.2461,599.8334,543.5599,600.5196,537.9448,595.8952,546.6405" style="stroke:#475569;stroke-width:1;"/><path d="M681.7717,479.4671 C658.5875,497.602 629.0249,520.7261 600.6211,542.9438" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="13.3477" x="652.3232" y="520.9541">e3</text></g><g class="caption" data-source-line="41"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1055.6465" x="5" y="639.8301">This is the "stacked etcd" topology: each control plane node carries an etcd member. "External etcd" moves the members to their own three hosts so losing a control plane</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1045.8506" x="9.8979" y="655.9287">node does not also lose an etcd member &#8212; more resilient, twice the machines. Either way, all API servers are active; scheduler and controller-manager elect one leader.</text></g><!--SRC=[bLN1ZjD03BtdAqmlW6XQ9Lb0wfPA2261n04XRi31pRZ9i9EPCZDfAMWbFe9_uSwdy2LuadIRDhkhNIc7ZEFOVi_scmTIvweM19F9j7syCSfDXSJ2OkMc5xd6s9TKqMHTLohoqYk2Dx8e0JSe5Iwbadu7_txz1bzQ8iYDzjOeM2lK1De8ScD03I_VlmLbKC0I-KjETWpaSm7VQcFhAeeivHvrmT575_MI3mh-_e7mgiWxC1feGtO7MsClo8vWFkSCKYyMW0vo9KbxrmyooFTPpvtyGRCaMHYkp7bSiXzfiJPIUtWqUtPsbZq6gM5b6GEOLOSer13ZMZgoN84xdqz3d4Kl7XFKU37sbImOhUYAxSg7DaL9biPCYGVaf-6cYnNWO9upXXQFMXuHykg8qoHu5zRKwmxyEe6V4S09WuUI6tzZHEkEoR5lquMAgkMf8vqukhmaKIkoeJ5vN9qGYhcN6yPdc0th0hzQB7SzWBr-kH0Q4uW_bL88qb-4sUfuqQQaePtzBsyc91qGajwBaFIkXAHt9aGH2hPpyvaLdjsDH0XJmbDv0oCXDgP3HeATXdRsluMHRC18TYz6ihioajtEo2d8u8xP46Imqz3E_fT7Yz0KyW5NFiYC8-rgroCTOMkb9v0Cs5ILz9u4R4lIl6mLVZLshrIjvi0BqDCKda3I64ikKFh9SBkp3he3RnWQSeO4LYn-jQM0y-d1deRpyyCvcy3h3UVNTHi0XGZxNqfTN9FedN6qhoreI1WObcVdcS_2a6EcKSH6gzriFqpGjWzor0zz2tzoWwPOfYsAEgM4kAEObKOjhqwi3VrJUdJAeg0qLpsoV0bujlEsHM7ZhlcGHIwv-Z_aXrbOSPSEZ6daie4nut9ntUpFN2u-bjnNVWBo4QjBVi7T3GCnOhxNHfc2QI7Coskk8ER7MiaCyaNK6-O9Z5v_PtOrgYvIPJRKfZZqF1ob1Qwjkn1AuvX1P_X-STn9dgwZZFEf35sLYoQp28rhD5-rVz194StmLOPdoPAJJNl6uBSofxOEHYGrEPua6PGLjhZZ2