<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="661px" preserveAspectRatio="none" style="width:1177px;height:661px;background:#FFFFFF;" version="1.1" viewBox="0 0 1177 661" width="1177px" zoomAndPan="magnify"><title>Five Pod phases, and the STATUS column that is none of them</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="538.0576" x="315.4946" y="30.8838">Five Pod phases, and the STATUS column that is none of them</text></g><!--entity created--><g class="entity" data-entity="created" data-source-line="4" data-uid="ent0002" id="entity_created"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="320.665" x="213.2734" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.665" x="227.2734" y="87.8921">Pod accepted by the API server and written to etcd</text></g><!--entity pending--><g class="entity" data-entity="pending" data-source-line="6" data-uid="ent0003" id="entity_pending"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="124.7891" x="311.2734" y="200.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.7891" x="325.2734" y="226.8921">phase: Pending</text></g><!--entity pdetail--><g class="entity" data-entity="pdetail" data-source-line="7" data-uid="ent0004" id="entity_pdetail"><rect fill="#FFFFFF" height="161.3887" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="504.1504" x="454.7734" y="141.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.3086" x="468.7734" y="167.8921">Accepted by the cluster, but not every container is set up. This covers</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1519" x="872.6938" y="167.8921">both</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="40.4663" x="904.4575" y="167.8921">waiting</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="58.5444" x="468.7734" y="182.8408">for a node</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="23.1118" x="530.9297" y="182.8408">and</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.1968" x="557.6533" y="182.8408">pulling images &#8212; two very different problems under one phase.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="468.7734" y="197.7896">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="199.9336" x="468.7734" y="210.8623">STATUS you actually see while Pending:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="388.2979" x="468.7734" y="223.5112">Pending &#8212; no node matched. Events say FailedScheduling: no such scheduler,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="377.8833" x="468.7734" y="236.1602">taints, insufficient cpu/memory, unbound PVC, nodeSelector matched nothing</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="409.6479" x="468.7734" y="248.8091">ContainerCreating &#8212; kubelet is pulling the image, mounting volumes, wiring the CNI</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="325.8535" x="468.7734" y="261.458">ErrImagePull &#8594; ImagePullBackOff &#8212; valid name, but it will not pull</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="361.3296" x="468.7734" y="274.1069">InvalidImageName &#8212; the reference itself is malformed, e.g. a capital letter</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="398.6318" x="468.7734" y="286.7559">CreateContainerConfigError &#8212; a ConfigMap or Secret it references does not exist</text></g><!--entity running--><g class="entity" data-entity="running" data-source-line="9" data-uid="ent0005" id="entity_running"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="126.2173" x="310.7734" y="416.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.2173" x="324.7734" y="442.8921">phase: Running</text></g><!--entity rdetail--><g class="entity" data-entity="rdetail" data-source-line="10" data-uid="ent0006" id="entity_rdetail"><rect fill="#FFFFFF" height="148.7397" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="507.7559" x="454.7734" y="363.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="474.0684" x="468.7734" y="389.8921">Bound to a node, all containers created, at least one running, starting or restarting.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.1055" x="468.7734" y="404.8408">Running is not healthy</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.0386" x="612.4907" y="404.8408">&#8212; a container in a crash loop keeps the Pod in this phase.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="468.7734" y="419.7896">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="200.5405" x="468.7734" y="432.8623">STATUS you actually see while Running:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="265.3481" x="468.7734" y="445.5112">Running &#8212; what you want, and READY n/n confirms it</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="395.5811" x="468.7734" y="458.1602">CrashLoopBackOff &#8212; it starts, exits, and the kubelet is waiting before the next try</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="402.9072" x="468.7734" y="470.8091">RunContainerError &#8212; the runtime could not start the process at all (bad command)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="242.0806" x="468.7734" y="483.458">OOMKilled &#8212; exceeded its memory limit; exit 137</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="394.9849" x="468.7734" y="496.1069">Completed / Error &#8212; the last run ended; restartPolicy decides what happens next</text></g><!--entity succ--><g class="entity" data-entity="succ" data-source-line="12" data-uid="ent0007" id="entity_succ"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="154.5215" x="241.2734" y="549.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114.1563" x="255.2734" y="575.8921">phase: Succeeded</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.3398" x="255.2734" y="588.9648">every container exited 0</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="126.5215" x="255.2734" y="601.6138">and will not be restarted</text></g><!--entity fail--><g class="entity" data-entity="fail" data-source-line="13" data-uid="ent0008" id="entity_fail"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="197.9307" x="414.7734" y="549.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.0781" x="428.7734" y="575.8921">phase: Failed</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="143.0269" x="428.7734" y="588.9648">a container exited non-zero</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="169.9307" x="428.7734" y="601.6138">or was killed, and will not restart</text></g><!--entity unknown--><g class="entity" data-entity="unknown" data-source-line="14" data-uid="ent0009" id="entity_unknown"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="173.5459" x="630.7734" y="549.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.8398" x="644.7734" y="575.8921">phase: Unknown</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="145.5459" x="644.7734" y="588.9648">the node stopped reporting &#8212;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="136.9897" x="644.7734" y="601.6138">check the node, not the Pod</text></g><g class="link" data-entity-1="created" data-entity-2="pending" data-uid="lnk10" id="link_created_pending"><polygon fill="#475569" points="373.7734,200.5477,377.7734,191.5477,373.7734,195.5477,369.7734,191.5477,373.7734,200.5477" style="stroke:#475569;stroke-width:1;"/><path d="M373.7734,104.7085 C373.7734,130.5358 373.7734,168.6545 373.7734,194.5477" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pending" data-entity-2="pdetail" data-uid="lnk11" id="link_pending_pdetail"><polygon fill="#475569" points="454.7455,222.1982,445.7455,218.1982,449.7455,222.1982,445.7455,226.1982,454.7455,222.1982" style="stroke:#475569;stroke-width:1;"/><path d="M436.5361,222.1982 C442.6059,222.1982 442.6757,222.1982 448.7455,222.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pending" data-entity-2="running" data-uid="lnk12" id="link_pending_running"><polygon fill="#475569" points="373.7734,416.4267,377.7734,407.4267,373.7734,411.4267,369.7734,407.4267,373.7734,416.4267" style="stroke:#475569;stroke-width:1;"/><path d="M373.7734,243.7175 C373.7734,284.517 373.7734,369.4215 373.7734,410.4267" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.7813" x="379.7734" y="337.9541">sandbox created, containers started</text></g><g class="link" data-entity-1="running" data-entity-2="rdetail" data-uid="lnk13" id="link_running_rdetail"><polygon fill="#475569" points="454.7008,438.1982,445.7008,434.1982,449.7008,438.1982,445.7008,442.1982,454.7008,438.1982" style="stroke:#475569;stroke-width:1;"/><path d="M436.9131,438.1982 C442.8423,438.1982 442.7716,438.1982 448.7008,438.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="running" data-entity-2="succ" data-uid="lnk14" id="link_running_succ"><polygon fill="#475569" points="331.5244,549.4299,338.4804,542.4576,333.3138,544.7611,331.0103,539.5945,331.5244,549.4299" style="stroke:#475569;stroke-width:1;"/><path d="M365.8933,459.7583 C356.9229,483.1627 344.2884,516.1274 333.6717,543.8273" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="running" data-entity-2="fail" data-uid="lnk15" id="link_running_fail"><polygon fill="#475569" points="481.3165,549.4299,477.8947,540.1946,477.8249,545.851,472.1685,545.7811,481.3165,549.4299" style="stroke:#475569;stroke-width:1;"/><path d="M393.832,459.7583 C416.6656,483.1627 450.1023,517.4353 477.1266,545.1352" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="fail" data-entity-2="unknown" data-uid="lnk16" id="link_fail_unknown"><polygon fill="#475569" points="630.5857,583.6982,621.5857,579.6982,625.5857,583.6982,621.5857,587.6982,630.5857,583.6982" style="stroke:#475569;stroke-width:1;"/><path d="M612.9844,583.6982 C618.8515,583.6982 618.7186,583.6982 624.5857,583.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1159.0469" x="5" y="629.8301">The five phases are what the API stores in status.phase. The word in the STATUS column of kubectl get pods is usually not a phase at all &#8212; it is the reason from the container's own state,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1126.0498" x="21.4985" y="645.9287">which is why ImagePullBackOff and CrashLoopBackOff never appear in the phase list. Read the phase to know how far the Pod got; read the STATUS reason to know what is wrong.</text></g><!--SRC=[bLPDRnit4BtxLqnpQIl8KeCU2ZY60CTD0ADDOyHEWGAvKBkpMa9SSa5oBIkddle3Ylx2_9A-8Rdonb8F1Vo19JapRsRUFF8RRIipr4oBnJB_HETCMDPQRRpgmd9RMNKUM-vuqG-TEOiw6gQt-e7frjNKjofmc9EoDU4KtTrVtN-yeygPeRDOKP5q8EiiaslaH7TsvhcAocxWveMuK5N5VUIQrllaukhsXWBx1_R9wyxh61c-776iwXTqUTaDEBvQaGfKULRu-CffmdH1jsnhRJTY825ip1PzNfuQN3r3W8g4o7vEwo42UoG6c3sIib5f2rn8AN2aeL_GVOkFok50eDbixM8xcz5EwOWOdspZa0HSeC2p6RB1NZyOWptIdTfme2z__aDnvoX5g7NJi0TKwhrR6-u23RP6GAbVIclnoNwobq5_vekNBrUbsdite8fnKCRi0OnfrshaLGfmSRcKywk9NTb9mQtB-3eLgvRh1Rrv000agFRqLi5FVIVhWu2-aDDXg5eAUGr5ElOkHOhWXBPXQ1fTQKceweTbnvtp-pboMZlaHRU_NyzJy3isw0PgLK18qLl4E_PzFVRWMXe_vh0Trl2Gg3QML_gOIZod3i7IqGTXfR1rf_ruvlgtc-CeRxo_4TjREAClV_rDXw_Ngjg-RveKzK4P3QYguymK7U4O1i8OWN7izyOcc-JjDzZbxWE5vzJt2fXZODD89fqoe4_7zPnuiLc0HvNgTLI6a2heUQ8uQHYUIkHiepV81OMLG8hooZlL4vRk6CEJK1-Y1weTXqpvHnrY2I4Zr1luB1DKCmAOKpFtOR2spDp6kJAZFYzEZxzE_ST8v-60Vg1kX_awZ3NM8x9L8QO9A8xc5ABogQD8m_FuXTcOpGg2h3gHMbOcjdlCNQx0P8QjV7eLMZBEzRHbxaDgXeYI5l4IEltVeIlnJmpTY4o0x4GOnSDEsPZLyyERgv__8BkqWh7H7hEluwaU0_6l03nb8dgOYW1geszneiUJoIYYH6i6hJZjMdwC5Ft-9DW3ZvuObAWgmmJgLcumQL1pwBG7rGA9WdHD6lhTMjKurtL0y_rnZFVlt_s2US6uYsz-h9XhV00_PQKWepiTNwMSwEMFFvsIWwv7Uh1QqjSmZP06M0bIn_MhaIQtpkWAGikLhi7qr8TMzRWKGgh6QSRx_sRytL1bt1DKpwyBmG-8FnpZJnVSg1bh7b5oFS7nD4XGtke4XApIKw_7iN43dtzcxuuXe6Ox-DwcJcJY710LE1Cmw6Z6qaWzZh5yj5lhTjDnIJoJ2oP4XphNSDexFqhtCHxeVxMbqMgUS9IfdE2OF0667FBih8W6dTVuF5yTRlhodywzthHHDaex3nl5eEWBNU3oi_NQFJxfq4IRIeVEnjC7joDB3Xl5RMxRiyLKF_dpPF-KYEgZTfOkzUeUcJVosCeFBLAUCsaFBoLScrY7NW5N7C8YAnQ9uSxvecJF7sPuYuaoLD7G1khGkpg8H0mXovdKNEMGuomNcT6Xt5Sg063ZNPTVJ6DvlWs4518MnjD0IsVr2jA8DuDeKBi_lak5SaUoPZaz0C4OvSSSCY23Ysb17rZLaqLS9L8yQl7Rm6BKyOsBCllggzTfGJ_QxCehTUSTBX41_Iy0]--></g></svg>