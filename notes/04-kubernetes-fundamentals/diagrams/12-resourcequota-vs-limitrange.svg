<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="524px" preserveAspectRatio="none" style="width:1174px;height:524px;background:#FFFFFF;" version="1.1" viewBox="0 0 1174 524" width="1174px" zoomAndPan="magnify"><title>Two budgets in one namespace: the total, and the each</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="473.0713" x="346.6582" y="30.8838">Two budgets in one namespace: the total, and the each</text></g><!--cluster ns--><g class="cluster" data-entity="ns" data-source-line="4" data-uid="ent0002" id="cluster_ns"><rect fill="#F8FAFC" height="419" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="636" x="276.6938" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6689" x="534.3594" y="71.8921">namespace: team-a</text></g><!--entity quota--><g class="entity" data-entity="quota" data-source-line="6" data-uid="ent0003" id="entity_quota"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="526.2065" x="331.6938" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="315.6182" x="345.6938" y="112.8921">ResourceQuota &#183; the budget for ALL Pods together</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="378.4043" x="345.6938" y="125.9648">requests.cpu 4 &#183; limits.memory 8Gi &#183; pods 20 &#183; persistentvolumeclaims 5</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="463.9873" x="345.6938" y="138.6138">the SUM across the namespace may not exceed this &#8212; one object, checked in aggregate</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="498.2065" x="345.6938" y="151.2627">set a cpu or memory quota and every new Pod MUST declare requests or limits, or it is rejected</text></g><!--entity lr--><g class="entity" data-entity="lr" data-source-line="8" data-uid="ent0004" id="entity_lr"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="619.626" x="284.6938" y="228.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="345.2617" x="298.6938" y="254.8921">LimitRange &#183; the rule EACH Pod or container must obey</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="237.1499" x="298.6938" y="267.9648">min / max &#8212; reject anything outside the band</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="591.626" x="298.6938" y="280.6138">default / defaultRequest &#8212; fill in what the manifest author left out (which is what keeps the quota above satisfied)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="385.6875" x="298.6938" y="293.2627">maxLimitRequestRatio &#8212; stop a container requesting 100m and limiting 4</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="281.166" x="298.6938" y="305.9116">applies to Container, Pod and PersistentVolumeClaim</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="10" data-uid="ent0005" id="entity_p1"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="164.3613" x="298.6938" y="390.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.5317" x="312.6938" y="416.3921">pod a</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="99.0483" x="312.6938" y="429.4648">requests 500m / 1Gi</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="136.3613" x="312.6938" y="442.1138">within the band, fits the total</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="11" data-uid="ent0006" id="entity_p2"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="177.8052" x="480.6938" y="390.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.5317" x="494.6938" y="416.3921">pod b</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="81.3184" x="494.6938" y="429.4648">no resources set</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="149.8052" x="494.6938" y="442.1138">LimitRange injects the defaults</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="12" data-uid="ent0007" id="entity_p3"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="227.8262" x="676.6938" y="383.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.3799" x="690.6938" y="409.8921">pod c &#183; rejected 403</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="187.6445" x="690.6938" y="422.9648">either its own request is outside the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="199.8262" x="690.6938" y="435.6138">LimitRange band, or it would push the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="164.4253" x="690.6938" y="448.2627">namespace total past the quota</text></g><g class="link" data-entity-1="lr" data-entity-2="p1" data-uid="lnk8" id="link_lr_p1"><polygon fill="#475569" points="409.2599,390.0534,418.3199,386.1914,412.6667,386.3937,412.4644,380.7405,409.2599,390.0534" style="stroke:#475569;stroke-width:1;"/><path d="M491.9584,322.783 C482.1475,328.3923 472.5623,334.3882 463.6938,340.6982 C443.8286,354.8327 428.4379,369.4518 413.3481,385.6618" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.7285" x="469.6938" y="357.9541">checked per object</text></g><g class="link" data-entity-1="lr" data-entity-2="p2" data-uid="lnk9" id="link_lr_p2"><polygon fill="#475569" points="575.3355,390.1381,580.7925,381.9392,576.1766,385.2094,572.9065,380.5935,575.3355,390.1381" style="stroke:#475569;stroke-width:1;"/><path d="M586.7837,323.0518 C583.0644,344.847 579.7248,364.4171 576.3448,384.2236" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="lr" data-entity-2="p3" data-uid="lnk10" id="link_lr_p3"><polygon fill="#475569" points="737.8355,383.6893,733.0215,375.0972,733.8306,380.6959,728.2319,381.505,737.8355,383.6893" style="stroke:#475569;stroke-width:1;"/><path d="M656.4404,322.8507 C682.5853,342.3927 707.9318,361.3378 733.0296,380.0972" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="quota" data-entity-2="lr" data-uid="lnk13" id="link_quota_lr"><polygon fill="#475569" points="594.6938,228.5309,598.6938,219.5309,594.6938,223.5309,590.6938,219.5309,594.6938,228.5309" style="stroke:#475569;stroke-width:1;"/><path d="M594.6938,167.8433 C594.6938,186.5707 594.6938,203.0396 594.6938,222.5309" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="259.4824" x="600.6938" y="202.9541">both run at admission, before the object is stored</text></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1145.0674" x="10.6602" y="492.8301">ResourceQuota is the namespace's ceiling; LimitRange is the per-object rule. They are separate objects and neither implies the other, but they are written together: without a LimitRange</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1156.3877" x="5" y="508.9287">supplying defaults, a cpu or memory quota makes every manifest that omits requests fail with 403 Forbidden. Both are namespaced, and both reject at admission rather than evicting later.</text></g><!--SRC=[VLLBRXj74Dtp51LlaW3yY98C60n1m1OIPo43ZYndasJHx2dEb3NJtUwFQ3e8a4FuBjxdA3c9gxg7r8IK0t0n_QjwzLxLupTaT9igXEbqLdxHsZRCAbArLrsOtMcZ9h713gSkTUqeKcmHRhSMrgcgCGOW0zOW6DLXS4hZ0lWwH1jLEmPbghn4fPlHoAEEojGSuCdmEgfkefx0Sbbxczng1Ig02V3dQ0GmU7A3mIQlyPV4iU6VppbmGG4Rw-7vzJMyjbNWtBpLeF_TB0DznCLyllBuFc68OQfTWajvt597lEwmitu7prwIR3fvVdwMFz472X5DlBTjwb2tYhe0JvSpYRaQn1OORzw-0gMz3I6ZEbG7dTg1iH7mWqOKBYZ0ltz_ofJPzJkkRWowGNt7XyoagckFjOfucYPmcGe4FzVQmtwVgH2IyHvvRN0h5C2hjszkeHBC7c5VkxmhLO_bao8m5e-20Qi-dwYWjEQgYmmvmP4ErnBZXXUu5y4dtl_n-TNFEJd7rjP4HGOPQ0gH2yNTe9AE2vqnCnyo4mK15x5ZSamDDiL0t95PNIxjb8aADograMFqNpUbmXnkGsqhJ6uR5NECJXdQoAbAiH4AS1Cb2NotRKWtGaA-UuVeYdezgsjxZn1KfB0XhBu_nS4L52vA-Xk-QZE64AqJhGuiz198UVEpiouhbgMGdSlJoCgvbb0w6QxsGSQPN7dv-j2Ql-RMl9BM70XOMriL-Lf_f9sJ48_C1J