<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="681px" preserveAspectRatio="none" style="width:1384px;height:681px;background:#FFFFFF;" version="1.1" viewBox="0 0 1384 681" width="1384px" zoomAndPan="magnify"><title>A kubeadm cluster &#8212; control plane and one worker node, and who talks to whom</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="696.1025" x="336.4487" y="30.8838">A kubeadm cluster &#8212; control plane and one worker node, and who talks to whom</text></g><!--cluster cp--><g class="cluster" data-entity="cp" data-source-line="6" data-uid="ent0003" id="cluster_cp"><rect fill="#F8FAFC" height="455" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="1051" x="14" y="174.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.4409" x="480.2795" y="192.8921">Control plane node</text></g><!--cluster static--><g class="cluster" data-entity="static" data-source-line="7" data-uid="ent0004" id="cluster_static"><rect fill="#F0FDF4" height="305" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="588" x="22" y="207.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="283.1943" x="174.4028" y="225.8921">Static Pods &#8212; from /etc/kubernetes/manifests</text></g><!--cluster normal--><g class="cluster" data-entity="normal" data-source-line="15" data-uid="ent0011" id="cluster_normal"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="439" x="618" y="384.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="247.7554" x="713.6223" y="402.8921">Normal Pods &#8212; created through the API</text></g><!--cluster node--><g class="cluster" data-entity="node" data-source-line="31" data-uid="ent0027" id="cluster_node"><rect fill="#F8FAFC" height="422" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="290" x="1088" y="207.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.4536" x="1193.2732" y="225.8921">Worker node</text></g><!--entity kubectl--><g class="entity" data-entity="kubectl" data-source-line="4" data-uid="ent0002" id="entity_kubectl"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="127.0645" x="337.5" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1899" x="351.5" y="79.8921">kubectl</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="99.0645" x="351.5" y="92.9648">the user; kubeconfig</text></g><!--entity cprt--><g class="entity" data-entity="cprt" data-source-line="22" data-uid="ent0017" id="entity_cprt"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="264.5483" x="501.5" y="565.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="180.5845" x="515.5" y="591.8921">kubelet &#8594; containerd &#8594; runc</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="236.5483" x="515.5" y="604.9648">runs every Pod on this node, static or normal</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="8" data-uid="ent0005" id="entity_api"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="230.8716" x="285.5" y="265.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="299.5" y="291.8921">kube-apiserver</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="202.8716" x="299.5" y="304.9648">the front door: REST API, authN/authZ,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="170.5054" x="299.5" y="317.6138">the ONLY thing that talks to etcd</text></g><!--entity etcd--><g class="entity" data-entity="etcd" data-source-line="9" data-uid="ent0006" id="entity_etcd"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="199.1499" x="30.5" y="436.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="26.73" x="44.5" y="462.8921">etcd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.7915" x="44.5" y="475.9648">source of truth &#8212; consistent,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.1499" x="44.5" y="488.6138">distributed key/value store (Raft)</text></g><!--entity sched--><g class="entity" data-entity="sched" data-source-line="10" data-uid="ent0007" id="entity_sched"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="140.4814" x="248" y="436.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.0845" x="262" y="462.8921">kube-scheduler</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="112.4814" x="262" y="475.9648">picks a node for each</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="91.6738" x="262" y="488.6138">unscheduled Pod</text></g><!--entity cm--><g class="entity" data-entity="cm" data-source-line="11" data-uid="ent0008" id="entity_cm"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="195.4492" x="406.5" y="436.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.1436" x="420.5" y="462.8921">kube-controller-manager</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="167.4492" x="420.5" y="475.9648">control loops: node, replication,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="134.4492" x="420.5" y="488.6138">deployment, endpoints &#8230;</text></g><!--entity kp1--><g class="entity" data-entity="kp1" data-source-line="16" data-uid="ent0012" id="entity_kp1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="92.3081" x="660" y="442.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.3081" x="674" y="468.8921">kube-proxy</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="58.0884" x="674" y="481.9648">DaemonSet</text></g><!--entity dns--><g class="entity" data-entity="dns" data-source-line="17" data-uid="ent0013" id="entity_dns"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="86.6953" x="770.5" y="442.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.6245" x="784.5" y="468.8921">CoreDNS</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="58.6953" x="784.5" y="481.9648">Deployment</text></g><!--entity ccm--><g class="entity" data-entity="ccm" data-source-line="18" data-uid="ent0014" id="entity_ccm"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="172.5107" x="875.5" y="442.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5107" x="889.5" y="468.8921">cloud-controller-manager</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="90.4868" x="889.5" y="481.9648">cloud clusters only</text></g><!--entity kubelet--><g class="entity" data-entity="kubelet" data-source-line="32" data-uid="ent0028" id="entity_kubelet"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="232.1553" x="1117" y="265.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="1131" y="291.8921">kubelet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="204.1553" x="1131" y="304.9648">registers the node; watches the API for</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="183.9976" x="1131" y="317.6138">Pods assigned here; reports status</text></g><!--entity rt--><g class="entity" data-entity="rt" data-source-line="33" data-uid="ent0029" id="entity_rt"><rect fill="#EFF6FF" height="42.9487" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="142.8481" x="1161.5" y="449.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114.8481" x="1175.5" y="475.3921">containerd &#8594; runc</text></g><!--entity pods--><g class="entity" data-entity="pods" data-source-line="34" data-uid="ent0030" id="entity_pods"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="274.3022" x="1096" y="565.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.7827" x="1110" y="591.8921">Pods</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.3022" x="1110" y="604.9648">kube-proxy (DaemonSet) &#183; your apps (nginx &#8230;)</text></g><g class="link" data-entity-1="api" data-entity-2="etcd" data-uid="lnk18" id="link_api_etcd"><polygon fill="#475569" points="151.6773,436.6586,160.1712,431.6731,154.5898,432.5944,153.6685,427.0131,151.6773,436.6586" style="stroke:#475569;stroke-width:1;"/><path d="M285.2842,327.2554 C267.7129,333.7963 250.348,341.8422 235,351.6982 C200.6194,373.7765 174.1851,405.251 155.1723,431.7816" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="71.3555" x="241" y="368.9541">reads / writes</text></g><g class="link" data-entity-1="api" data-entity-2="sched" data-uid="lnk20" id="link_api_sched"><polygon fill="#475569" points="345.2932,333.9874,336.0201,337.3053,341.6753,337.4386,341.542,343.0939,345.2932,333.9874" style="stroke:#475569;stroke-width:1;"/><path d="M340.9518,338.1289 C335.3978,343.4269 334.771,345.1943 331,351.6982 C316.1135,377.3732 313.861,411.4998 314.7395,436.4462" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="67.7109" x="337" y="368.9541">watch + bind</text></g><g class="link" data-entity-1="api" data-entity-2="cm" data-uid="lnk22" id="link_api_cm"><polygon fill="#475569" points="421.3495,334.0872,422.6177,343.8541,423.9516,338.3567,429.449,339.6906,421.3495,334.0872" style="stroke:#475569;stroke-width:1;"/><path d="M424.4721,339.2106 C442.588,368.9349 465.8187,407.0513 483.8683,436.6666" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="61.0313" x="453" y="368.9541">watch + act</text></g><g class="link" data-entity-1="api" data-entity-2="normal" data-uid="lnk24" id="link_api_normal"><polygon fill="#475569" points="487.4598,333.7867,494.049,341.1067,492.0259,335.824,497.3086,333.8009,487.4598,333.7867" style="stroke:#475569;stroke-width:1;"/><path d="M492.9391,336.2314 C505.4039,341.7928 512.4365,345.3807 524,351.6982 C541.0948,361.0377 541.8886,369.5265 560,376.6982 C582.5578,385.6306 596.1389,368.278 614,384.6982 C615.3044,385.8974 616.5313,387.1642 617.6852,388.49 C617.7573,388.5729 617.8292,388.656 617.9007,388.7393" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="566" y="368.9541">watch</text></g><g class="link" data-entity-1="kubelet" data-entity-2="rt" data-uid="lnk31" id="link_kubelet_rt"><polygon fill="#475569" points="1233,449.1392,1237,440.1392,1233,444.1392,1229,440.1392,1233,449.1392" style="stroke:#475569;stroke-width:1;"/><path d="M1233,334.0872 C1233,368.3326 1233,414.5179 1233,443.1392" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="20.666" x="1239" y="368.9541">CRI</text></g><g class="link" data-entity-1="rt" data-entity-2="pods" data-uid="lnk32" id="link_rt_pods"><polygon fill="#475569" points="1233,565.6894,1237,556.6894,1233,560.6894,1229,556.6894,1233,565.6894" style="stroke:#475569;stroke-width:1;"/><path d="M1233,492.2242 C1233,512.4519 1233,537.4703 1233,559.6894" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="21.334" x="1239" y="539.9541">OCI</text></g><g class="link" data-entity-1="kubectl" data-entity-2="api" data-uid="lnk33" id="link_kubectl_api"><polygon fill="#475569" points="401,265.5598,405,256.5598,401,260.5598,397,256.5598,401,265.5598" style="stroke:#475569;stroke-width:1;"/><path d="M401,110.0548 C401,149.6735 401,216.9309 401,259.5598" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.6973" x="407" y="151.9541">HTTPS :6443</text></g><g class="link" data-entity-1="api" data-entity-2="kubelet" data-uid="lnk35" id="link_api_kubelet"><polygon fill="#475569" points="419.2564,265.5246,427.3226,259.8734,421.8332,261.2398,420.4668,255.7504,419.2564,265.5246" style="stroke:#475569;stroke-width:1;"/><path d="M422.3486,260.3828 C441.6091,228.3556 472.1524,187.6518 516,167.6982 C743.2389,64.2898 1045.9693,198.6014 1172.9499,265.6946" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.084" x="549.0088" y="144.9541">HTTPS &#8212; the node talks TO the API server</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="286.1016" x="522" y="158.7529">(the API server calls back for exec, logs, port-forward)</text></g><g class="caption" data-source-line="42"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="838.8721" x="265.064" y="649.8301">Two rules explain the whole picture: every component talks to the API server, never to each other; and only the API server talks to etcd.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="755.6172" x="306.6914" y="665.9287">The control plane is itself a node &#8212; it has a kubelet and a runtime &#8212; which is how it can run its own components as Pods.</text></g><!--SRC=[XLRRQYD747tNLrJyP1F9WycI1wqGBDwG689jB478xQ7TNPffrDCzTFUih2mBUSe7X7n3VY7l-PJzabJDJJEZCG4ZMTDrENtgLDLyeQqqfKAulaxgl-YS2OdI8lKY3ybUMh686UPuNPIvcKKT3S8xs9VFA5GEv1qYUlZy-ryWdOtU6IYCi0Z2Ad3qVN1-JmRMAPnN3m-PWoZCFa1q_2EVpJpAA6nAaIyui8pc5xiA-ZTStjoiAJkK0VtRAYabsUbqbV3f-W9MAygcxNeD8a3ZEuXtEm35ADWfzQuiQYTPmCSPGCzb4qNK4XwT2jMzTjxba62K2IVm5YE691TMxp34q8NxrZbLXmnr00ux2Cpk2r5ekim7zAChKXORGJddb_3qpMOBxnxlYB0oPlS9V_uqRouzydku__v7Y9csANsAUAAM0AiUJq9AjB46I1Z6sDYw5pcuqai4juFeANbRtw2fsZPEG55qulLp6L717e_91s5A92QSHxXy4hjurSEITbHnsacQWinGbMP0Kw4bNKrKLOITyu12PkTGIjiwAoxYPDxAOZ9nesBAlA0QYtI0e9MuSQu8oqRK7WkZ9PNSsIbYwDGTSsODqAh2QHjPLtzFuf9v1OffWSNFcLOAxQzUfrbSh7kWg__E3IhlJqCrtpkV2tDIi_Gek4Wn8z6c6R26I6gZhh2rrxI42-zUZhqhlXUOExl1-4fR5ZVZCBSaY_VtctwCZgRf8Cg6SH1fNAd-frviqWwfGFF877lXSrPhmtj3F64zfxNDJTyJd4-HpZGPZF3vZp-hiKZNGA-gdxwqieUGVb8Nq3WuSea88VToQ9JL31Bdctgyqiwoy97oKrV3Ghc39LILW9O4IL3P4pXuJKDhrWcdBCY6xPTm455cy2KyQylQaldagP2SeL75cG47hg5sz3GuQe-Uw-YyWlvfCB5_E2sCCr5Itt-SPBhFAAQwBZTBcttUrYWnj6BduN7UgLMBY11qQecZ33qvKcyx7-kHNePN-6ym385DbFs2ZVt8ZhFsG9mQ32wxlhg2V_-18ura8hq8S6bJRLzuXamFrO92Kf9MXAqcVAHwtJxTSVxJKpQcvm-tTro7PeLsftMHlzjk7pUm_FhDcwzcNLI3kpYouFdIajuiekr3HtgxzYw73q0AOm8y2xclX_eBoZbDs3JCWSbVqCE3yEfgDfEYu2aBAxtU7XnnQgYc-5ADYIeDlKuGfxGdOkbnsVILT7b1RoAsjnk72EPWsR9QchHHmD4nlMxKRp3cEB8URjZhLQ9PH8I8h8QlGDJ7EWOqktPdCJywGiOhk2iFfn6iZwZpskIGQK91tfaxiBqKbiyv651PJXTYkLQJlKBn7m00]--></g></svg>