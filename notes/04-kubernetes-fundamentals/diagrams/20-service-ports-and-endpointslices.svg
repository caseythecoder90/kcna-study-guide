<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="662px" preserveAspectRatio="none" style="width:1277px;height:662px;background:#FFFFFF;" version="1.1" viewBox="0 0 1277 662" width="1277px" zoomAndPan="magnify"><title>One request, three ports, and the chain that finds a Pod</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="475.0664" x="397.4258" y="30.8838">One request, three ports, and the chain that finds a Pod</text></g><!--cluster ports--><g class="cluster" data-entity="ports" data-source-line="16" data-uid="ent0010" id="cluster_ports"><rect fill="#F8FAFC" height="369" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="246" x="833.209" y="241.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="222.498" x="844.96" y="259.8921">The three ports, and whose they are</text></g><!--entity out--><g class="entity" data-entity="out" data-source-line="4" data-uid="ent0002" id="entity_out"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="167.4644" x="303.709" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.4644" x="317.709" y="79.8921">client outside the cluster</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="106.4175" x="317.709" y="92.9648">curl 172.18.0.3:32610</text></g><!--entity node--><g class="entity" data-entity="node" data-source-line="5" data-uid="ent0003" id="entity_node"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="378.9688" x="197.709" y="146.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.3105" x="211.709" y="172.8921">any node, on nodePort 32610</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="350.9688" x="211.709" y="185.9648">NodePort only. Every node listens, whether or not it runs a backing Pod.</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="223.1958" x="211.709" y="198.6138">Allocated from 30000-32767 unless you pin it.</text></g><!--entity in--><g class="entity" data-entity="in" data-source-line="7" data-uid="ent0004" id="entity_in"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="217.5352" x="595.209" y="152.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.5107" x="609.209" y="178.8921">client inside the cluster</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="189.5352" x="609.209" y="191.9648">curl nginx  &#8594; CoreDNS &#8594; 10.43.22.69</text></g><!--entity svc--><g class="entity" data-entity="svc" data-source-line="8" data-uid="ent0005" id="entity_svc"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="352.5591" x="447.709" y="274.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="280.3442" x="461.709" y="300.8921">Service nginx &#183; ClusterIP 10.43.22.69 &#183; port 80</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="292.1177" x="461.709" y="313.9648">a VIRTUAL IP: nothing listens on it, no interface holds it</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="324.5591" x="461.709" y="326.6138">kube-proxy (or an eBPF CNI) programs the rules that rewrite it</text></g><!--entity eps--><g class="entity" data-entity="eps" data-source-line="10" data-uid="ent0006" id="entity_eps"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="519.4282" x="305.709" y="410.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8481" x="319.709" y="436.3921">EndpointSlice nginx-abcde</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="491.4282" x="319.709" y="449.4648">created and kept current by the endpoint controllers, which watch Pods matching the selector</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="352.0698" x="319.709" y="462.1138">holds the READY Pod IPs and ports &#183; a new slice per 100 endpoints</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="450.522" x="319.709" y="474.7627">the legacy Endpoints object has the SAME NAME as the Service and truncates at 1000</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="12" data-uid="ent0007" id="entity_p1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="108.958" x="383.709" y="540.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.958" x="397.709" y="566.8921">Pod 10.42.0.3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.5938" x="397.709" y="579.9648">targetPort 80</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="13" data-uid="ent0008" id="entity_p2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="108.958" x="510.709" y="540.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.958" x="524.709" y="566.8921">Pod 10.42.1.3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.5938" x="524.709" y="579.9648">targetPort 80</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="14" data-uid="ent0009" id="entity_p3"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="108.958" x="637.709" y="540.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.958" x="651.709" y="566.8921">Pod 10.42.2.3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.5938" x="651.709" y="579.9648">targetPort 80</text></g><!--entity pp--><g class="entity" data-entity="pp" data-source-line="17" data-uid="ent0011" id="entity_pp"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="168.1265" x="888.209" y="274.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="43.3418" x="902.209" y="300.8921">port 80</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140.1265" x="902.209" y="313.9648">the SERVICE's own port &#8212;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.6284" x="902.209" y="326.6138">what clients connect to</text></g><!--entity tp--><g class="entity" data-entity="tp" data-source-line="18" data-uid="ent0012" id="entity_tp"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="164.2646" x="890.209" y="403.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.1899" x="904.209" y="429.8921">targetPort 80</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132.1719" x="904.209" y="442.9648">the CONTAINER's port &#8212;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="111.8638" x="904.209" y="455.6138">where the app listens</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.2646" x="904.209" y="468.2627">defaults to port if omitted;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="110.0322" x="904.209" y="480.9116">may be a named port</text></g><!--entity npp--><g class="entity" data-entity="npp" data-source-line="19" data-uid="ent0013" id="entity_npp"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="171.3223" x="886.709" y="534.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.5234" x="900.709" y="560.8921">nodePort 32610</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="143.3223" x="900.709" y="573.9648">the NODE's port &#8212; NodePort</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="112.5298" x="900.709" y="586.6138">and LoadBalancer only</text></g><g class="link" data-entity-1="out" data-entity-2="node" data-uid="lnk16" id="link_out_node"><polygon fill="#475569" points="387.209,146.6088,391.209,137.6088,387.209,141.6088,383.209,137.6088,387.209,146.6088" style="stroke:#475569;stroke-width:1;"/><path d="M387.209,109.7182 C387.209,121.1539 387.209,128.5863 387.209,140.6088" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="node" data-entity-2="svc" data-uid="lnk17" id="link_node_svc"><polygon fill="#475569" points="561.9449,274.5958,555.8758,266.8391,557.53,272.2487,552.1204,273.9028,561.9449,274.5958" style="stroke:#475569;stroke-width:1;"/><path d="M449.4779,214.8033 C484.176,233.2503 521.9497,253.3326 556.647,271.7792" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="in" data-entity-2="svc" data-uid="lnk18" id="link_in_svc"><polygon fill="#475569" points="645.3302,274.4323,653.5312,268.9784,648.0103,270.2112,646.7775,264.6903,645.3302,274.4323" style="stroke:#475569;stroke-width:1;"/><path d="M687.047,208.7284 C674.8345,227.963 661.5669,248.8596 648.5463,269.367" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="svc" data-entity-2="eps" data-uid="lnk19" id="link_svc_eps"><polygon fill="#475569" points="581.9243,410.0347,589.1056,403.2945,583.8661,405.4271,581.7335,400.1877,581.9243,410.0347" style="stroke:#475569;stroke-width:1;"/><path d="M610.2268,342.8763 C601.7418,363.0102 593.1925,383.2967 584.2545,404.5056" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.0938" x="608.209" y="377.9541">which Pods are ready right now?</text></g><g class="link" data-entity-1="eps" data-entity-2="p1" data-uid="lnk20" id="link_eps_p1"><polygon fill="#475569" points="467.7795,540.6889,477.1224,537.5727,471.4713,537.3169,471.7271,531.6658,467.7795,540.6889" style="stroke:#475569;stroke-width:1;"/><path d="M521.858,491.2944 C504.0374,507.5715 488.285,521.9595 472.2097,536.6425" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="eps" data-entity-2="p2" data-uid="lnk21" id="link_eps_p2"><polygon fill="#475569" points="565.209,540.6889,569.209,531.6889,565.209,535.6889,561.209,531.6889,565.209,540.6889" style="stroke:#475569;stroke-width:1;"/><path d="M565.209,491.2944 C565.209,507.5715 565.209,520.006 565.209,534.6889" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="eps" data-entity-2="p3" data-uid="lnk22" id="link_eps_p3"><polygon fill="#475569" points="662.6384,540.6889,658.6908,531.6658,658.9466,537.3169,653.2956,537.5727,662.6384,540.6889" style="stroke:#475569;stroke-width:1;"/><path d="M608.56,491.2944 C626.3806,507.5715 642.133,521.9595 658.2083,536.6425" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="svc" data-entity-2="ports" data-uid="lnk23" id="link_svc_ports"><polygon fill="#475569" points="833.0819,308.6982,824.0819,304.6982,828.0819,308.6982,824.0819,312.6982,833.0819,308.6982" style="stroke:#475569;stroke-width:1;"/><path d="M800.8691,308.6982 C807.541,308.6982 814.213,308.6982 820.8849,308.6982 C824.2208,308.6982 827.5568,308.6982 830.8927,308.6982 C831.3097,308.6982 831.7267,308.6982 832.1437,308.6982 C832.3522,308.6982 832.5607,308.6982 832.7692,308.6982 C832.8734,308.6982 826.9777,308.6982 827.0819,308.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="33"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1259.918" x="5" y="630.8301">The Service is a stable name and a stable virtual IP; the EndpointSlice is the live list behind it. Pods come and go, the EndpointSlice is rewritten, and the ClusterIP never changes &#8212; that is the entire point.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1129.167" x="70.3755" y="646.9287">A Service with no matching ready Pods has an empty EndpointSlice and connections are refused, which is why kubectl get endpoints is the first check when a Service returns nothing.</text></g><!--SRC=[bLRDRkCs4BxxAQPxsHQ85VyiacqsSE5DNC30rZ6IT86YxO6cnXORcbH9obwrAD1J7w3ek_JUHzadwGmbENBij5Z3DaHAdFdccszcz9aoKXSfGfASLjzWhVQdgH8h9zR-z44QqGqPhZ79YxNk11Kqmer1SFXpWJwSGCWS8kJM1Ny2mgIqWI0peGnTYG1BPL8F0kOsxNGSoY3CYcoya5gX2M2Bu1KXYATquGEw7yobLx_WHRy_aeNJq3yV9FtNIIyPNWm7P_tUvIdV7hs0oyjSav_H28HdGstpmfHWR8edO4syc1D2YETRzcVD3MjqcS1aWwuw1beH54CXRJCaR0wieni1L01N60ve8UI3CYiEBAaXjIoFjRPI14nXwUmQXZtwT8U3yxDpA8n6xw6q1UJ4aWf9Aw9rGMUgY1Z7CSgK-J_6p4gP3m0V__WJhgp3wzbTlExtabV3P318phuypg4oRNTtw3PAOctjdx_Xgl8sdRSjyGtEFhnk4olW_VJs_jlnEvZEBvYuZAcgIUMKA9AEiUIH32u5USci9fseS4ZbGx70RkxiXn8-fom80_Xs_ZLSpQPV06r7fKOsN474Lgfpk7KguACzZbH8IVnLeVgDtEDsOjBS4fexlGkvAnOonJQt3cD6MUKFc0SWiXrdP556_rZR06bDS5PhT550IcQm5O7-IIiUrdp9TF0PZvf0M7SOTaK8FtCx6Lz_nsU9J1-znt9ZvWKOt8AFe7DIQR_Nsy7mXpRPciQLa2Kq0LCs5ZyH1CX4vUrk_Cq4PlpNRDGwYCLDucTP4up0pjh5kBAsLYxcVezSXiwI6N0Hj-48jy8mhzHpN99v_xYX_YSR6XmtDFXaGyEzsEupFEo1sypwMA4b28UH76UBl3OGa_Th1w1bvh248lMJs_VJgybBIjBML6NsyVU_3lEwPSrNxS6p-WmdDDXdj9_d-xxtWdw2uEfcTZ-UpYQtB_r_-aTNTIIHvqsP7pwMub8KcY06MnbJIx1h5QYetXm-lHObB90bBjPOQVwesiAJS9xjzenlTdCzQOK2pGGuTCzvV6T5-bPeOIHF09eHptJgo2X5tlq-KscAviUKyjKTLT32uJuV-AtJePa5tMQBktqSFSqEjoYQ3-qb_NPhAZAugBjBx2kaDA91f2KujSe2MTn-rU6dcXDKItlBmVvoM9cFXtdDCkrqfCY3eePzgKRthMQWU0Jw81R4EESdodwtir4k549JlteJLR7VNLNLLxJQL7EMiapzCEL9M4KYRMrmPK-Edw_wEwdiyPtZSJePf3dExo1cHOsAinndGksMoa0vhbQoHvDNSSxLQBoBRAj2ngDfrwOhJYCmxf4yVzPvA9-0OXXrvH5TJJQMXSUqcG44O9kLmFDC1WrKSu-zka6tL8u8aHdA1txrCCHf0ynXA9pnpJIDsFy5]--></g></svg>