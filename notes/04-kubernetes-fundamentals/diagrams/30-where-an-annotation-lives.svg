<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="531px" preserveAspectRatio="none" style="width:1345px;height:531px;background:#FFFFFF;" version="1.1" viewBox="0 0 1345 531" width="1345px" zoomAndPan="magnify"><title>The same annotation, two places &#8212; one of them redeploys your application</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="646.1104" x="345.564" y="30.8838">The same annotation, two places &#8212; one of them redeploys your application</text></g><!--cluster dep--><g class="cluster" data-entity="dep" data-source-line="4" data-uid="ent0002" id="cluster_dep"><rect fill="#F8FAFC" height="426" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="392" x="789.1191" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="103.2954" x="933.4714" y="71.8921">Deployment web</text></g><!--entity safe--><g class="entity" data-entity="safe" data-source-line="12" data-uid="ent0006" id="entity_safe"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="366.3413" x="413.1191" y="122.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.5381" x="427.1191" y="148.8921">Harmless</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="338.3413" x="427.1191" y="161.9648">kubectl annotate deployment/web company.org/ticket=OPS-1234</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="231.0376" x="427.1191" y="174.6138">the object is updated; the Pods never notice</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.4653" x="427.1191" y="187.2627">kubectl rollout history is unchanged</text></g><!--entity boom--><g class="entity" data-entity="boom" data-source-line="14" data-uid="ent0007" id="entity_boom"><rect fill="#FEE2E2" height="93.5444" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="617.832" x="163.1191" y="326.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="278.8018" x="177.1191" y="352.8921">A deployment, whether you meant one or not</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="519.2612" x="177.1191" y="365.9648">kubectl patch deployment web -p '{&#8220;spec&#8221;:{&#8220;template&#8221;:{&#8220;metadata&#8221;:{&#8220;annotations&#8221;:{&#8220;note&#8221;:&#8220;x&#8221;}}}}}'</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="523.3862" x="177.1191" y="378.6138">chapter 05's rule with no exception: a rollout is triggered IF AND ONLY IF .spec.template changes &#8212;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286.2202" x="177.1191" y="391.2627">and the template's annotations are part of the template</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="589.832" x="177.1191" y="403.9116">this is exactly how kubectl rollout restart works: it stamps a timestamp annotation INTO the template on purpose</text></g><!--entity top--><g class="entity" data-entity="top" data-source-line="5" data-uid="ent0003" id="entity_top"><rect fill="#DCFCE7" height="153.3394" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="375.7783" x="797.1191" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="61.4072" x="811.1191" y="112.8921">metadata:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="77.9937" x="818.3428" y="127.8408">annotations:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="231.1372" x="825.5664" y="142.7896">company.org/owner: &#8220;platform-team&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="811.1191" y="157.7383">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="347.7783" x="811.1191" y="170.811">Lives on the DEPLOYMENT object only. Ops metadata, ownership,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="245.7168" x="811.1191" y="183.46">ticket IDs, the change-cause for rollout history.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="811.1191" y="197.9849">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="310.4761" x="811.1191" y="211.0576">NOT part of .spec.template &#8594; no new pod-template-hash &#8594;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="343.4976" x="811.1191" y="223.7065">no new ReplicaSet &#8594; NOTHING RESTARTS. Safe to edit any time.</text></g><!--entity tmpl--><g class="entity" data-entity="tmpl" data-source-line="7" data-uid="ent0004" id="entity_tmpl"><rect fill="#FEE2E2" height="195.8857" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="351.9414" x="804.1191" y="275.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="33.96" x="818.1191" y="301.8921">spec:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.7891" x="825.3428" y="316.8408">template:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="61.4072" x="832.5664" y="331.7896">metadata:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="77.9937" x="839.79" y="346.7383">annotations:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="252.7954" x="847.0137" y="361.687">company.org/note: &#8220;this lands on a Pod&#8221;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="818.1191" y="376.6357">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="320.8906" x="818.1191" y="389.7085">Lives inside the POD TEMPLATE, so it ends up on every Pod.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="282.4551" x="818.1191" y="402.3574">Where a service mesh reads sidecar.istio.io/inject and</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="216.4067" x="818.1191" y="415.0063">Prometheus reads prometheus.io/scrape.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="818.1191" y="429.5313">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="323.9414" x="818.1191" y="442.604">IS part of .spec.template &#8594; new hash &#8594; NEW REPLICASET &#8594;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="249.9868" x="818.1191" y="455.2529">A FULL ROLLING UPDATE, every Pod replaced.</text></g><g class="link" data-entity-1="top" data-entity-2="safe" data-uid="lnk8" id="link_top_safe"><polygon fill="#475569" points="779.2227,163.1982,788.2227,167.1982,784.2227,163.1982,788.2227,159.1982,779.2227,163.1982" style="stroke:#475569;stroke-width:1;"/><path d="M796.9169,163.1982 C791.0188,163.1982 791.1207,163.1982 785.2227,163.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="tmpl" data-entity-2="boom" data-uid="lnk9" id="link_tmpl_boom"><polygon fill="#475569" points="781.1855,373.6982,790.1855,377.6982,786.1855,373.6982,790.1855,369.6982,781.1855,373.6982" style="stroke:#475569;stroke-width:1;"/><path d="M804.1095,373.6982 C796.4682,373.6982 794.8269,373.6982 787.1855,373.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1327.2383" x="5" y="499.8301">Two nearly identical edits, two very different blast radii. Before annotating a workload, look at the indentation: metadata at the top is a note about the object, metadata under spec.template is part of the Pod's identity.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="579.7969" x="378.7207" y="515.9287">The same applies to LABELS in a pod template &#8212; and to anything else under .spec.template.</text></g><!--SRC=[VLPDZo8t4BtpAofxcGiqcNnS245Y0vj5wWKqz6grokHWkWlQcMxRijt3iAkLzfGV4EMO_Bdv9Qboqz0CA0Y9Tjj-zQfUFPjlf4gBAaE8edxzzLeNhfz9iRMYTFs7L8cUpx74o5HbqV7I5mX9Zk14YI2KqbvugLKN_4w3AKIA3fw__WrQ8UWDy5wmcA4fzDx1NbSMX365JCEsJiTYweNQ4kghILXKelAmm_Kh60wtLbTcD0BXW13WSmUWjRv4BpBXnU1UGOkA2sE0L9T6g7saxRQlTmhjW8ZzGnJzHjkovr6Kpr__lLVtQkZa9npStevY-KZqjMBQC9akuyN7TzDv0dhz1uMbYM8VmS8uQ49t8I2xN9hkiCymenQSb-a3UfXDN3SWfZannrugAeT09C3gej2LXrmwh-q-EaAqGEQB18omdgiPEODfvB7aB12U__mBb0Q5Ep0wwpNlUxbmEKzUCZgiliEWm8h8CGQ5U3kR_mftqrKolajM4Qp41i5hm4nwAkqUlAGMEE05PRJEQc6yDfrpNPXaqA0XT13aJ2_-N6hsKZUQno2Rfn918LGMv16mrDbryQHoaXgQoxrSJ22Plbl6usJQ1QU1Sa56g0o3u2FQFGD5btNwaAEbzWQ7zb6cIDIfeXO5RMRuLDY899CwahelLMWEudQ9ixIQiiwnSeVTvlY2jxhK2eDNPP-j_bTr4h5H6URJ3oJTCfxzCbvDa-l2Z-7D-pY6kqKSizBlbvDGb6CDY5umRzOMUIqQZIaqYqnQG- -tN6OPgjypQltUg9xxScRajyAM1JhNYlzGhMc-Q2H7o8vcxvFPpqIlRVFpOhdgtNxt_GzNV4NY7YmfMKrgAin-gZNNL6J5QP4p20WlTpTKNfWlGAdQejdLJdTaYhCynwqikh3BMLZBPnprYr2-FWC3aIlXZV1ftWBWCmzw1cu-KxkpujJV0tvkX6_6ZOsQSSj5pIks3J_JunFzVk7FpMKbA5dZYV6tFzvGVrQKqaxwd8yKV4hHCEI0JD0KYWhahTnkoHePpDx0U3w1nJp-oCylUhGkOxW9BiEIKu9MpMeAtie113clQVtsicjzG9JeYq-2Ahg7NE_WfReMdMUmdROFRi1708rBEi95EDF2e1KUPlDaSHQMZmfJMQCTNhF6Mkkoqmd6eDhadXmH-eHjSNfLhqf5g2aCvIZPyKaiBB6cyqHHfueYdBQklac3BpEvsL2ngJVMXN2KYyYaZE0rqjrnkdpLbdBXz0ejiYuKMZ-0y247gHXRr48sVTDCCcV9TU1k0R7cQfsSrJsjhmZ5mhd0jB6j4TcELAmpyNoFITQ9qZp-K-0x7_csW7ZyUXglY1k5fclhL6Z-sn1wG_ELG-9IPbZGLLaJE6-n4EC_]--></g></svg>