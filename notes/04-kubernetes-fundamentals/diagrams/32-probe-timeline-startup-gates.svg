<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="615px" preserveAspectRatio="none" style="width:1352px;height:615px;background:#FFFFFF;" version="1.1" viewBox="0 0 1352 615" width="1352px" zoomAndPan="magnify"><title>One container's life, and which probe is running when</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="462.3311" x="437.3345" y="30.8838">One container's life, and which probe is running when</text></g><!--cluster p1--><g class="cluster" data-entity="p1" data-source-line="4" data-uid="ent0002" id="cluster_p1"><rect fill="#F8FAFC" height="510" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="466" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="248.4854" x="122.7573" y="71.8921">Phase 1 &#183; the startup probe runs ALONE</text></g><!--cluster p2--><g class="cluster" data-entity="p2" data-source-line="14" data-uid="ent0010" id="cluster_p2"><rect fill="#F0FDF4" height="240" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="858" x="488" y="205.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="447.897" x="693.0515" y="223.8921">Phase 2 &#183; the app is up &#183; liveness and readiness run for the rest of its life</text></g><!--entity sp--><g class="entity" data-entity="sp" data-source-line="5" data-uid="ent0003" id="entity_sp"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="416.1313" x="22" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.9009" x="36" y="112.8921">startupProbe</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="388.1313" x="36" y="125.9648">failureThreshold: 30 &#183; periodSeconds: 10 &#8594; up to 300 seconds to come up</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="315.4443" x="36" y="138.6138">polled every 10s until ONE success, then it never runs again</text></g><!--entity lv1--><g class="entity" data-entity="lv1" data-source-line="6" data-uid="ent0004" id="entity_lv1"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="317.8403" x="75" y="251.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.5972" x="89" y="277.8921">livenessProbe &#8212; NOT RUNNING</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="289.8403" x="89" y="290.9648">&#8220;Kubernetes does not execute liveness or readiness probes</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="159.5913" x="89" y="303.6138">until the startup probe succeeds&#8221;</text></g><!--entity rd1--><g class="entity" data-entity="rd1" data-source-line="7" data-uid="ent0005" id="entity_rd1"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="279.915" x="95" y="375.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.998" x="109" y="401.8921">readinessProbe &#8212; NOT RUNNING</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="251.915" x="109" y="414.9648">the Pod is 0/1 and receives no traffic the whole time</text></g><!--entity why--><g class="entity" data-entity="why" data-source-line="8" data-uid="ent0006" id="entity_why"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="427.2334" x="22.5" y="474.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.167" x="36.5" y="500.8921">This is the point of a startup probe.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="399.2334" x="36.5" y="513.9648">Without one, a slow JVM or a cache warm-up gets killed by its own liveness probe</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="368.7363" x="36.5" y="526.6138">before it ever finishes booting &#8212; and restarted, and killed again: a boot loop</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="324.645" x="36.5" y="539.2627">that looks exactly like a crash but is really a misconfigured timeout.</text></g><!--entity lv2--><g class="entity" data-entity="lv2" data-source-line="15" data-uid="ent0011" id="entity_lv2"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="356.2275" x="530" y="238.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.1563" x="544" y="264.8921">livenessProbe</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="215.123" x="544" y="277.9648">&#8220;should this container be RESTARTED?&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="328.2275" x="544" y="290.6138">fails failureThreshold times &#8594; the kubelet KILLS the container,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="296.4897" x="544" y="303.2627">and the restartPolicy takes over. RESTARTS increments.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="242.0376" x="544" y="315.9116">initialDelaySeconds only starts counting NOW</text></g><!--entity rd2--><g class="entity" data-entity="rd2" data-source-line="16" data-uid="ent0012" id="entity_rd2"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="433.2544" x="904.5" y="238.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.5444" x="918.5" y="264.8921">readinessProbe</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.2969" x="918.5" y="277.9648">&#8220;should this Pod receive TRAFFIC?&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="359.4282" x="918.5" y="290.6138">fails &#8594; the Pod is marked not Ready, READY goes 1/1 &#8594; 0/1, and the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="361.2866" x="918.5" y="303.2627">EndpointSlice controller removes its IP from every matching Service.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="405.2544" x="918.5" y="315.9116">The container KEEPS RUNNING and keeps being probed &#8212; it can come back.</text></g><!--entity indep--><g class="entity" data-entity="indep" data-source-line="17" data-uid="ent0013" id="entity_indep"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="383.8887" x="516" y="369.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.606" x="530" y="395.8921">They are scheduled INDEPENDENTLY and run concurrently.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="355.8887" x="530" y="408.9648">A Pod can be live but not ready (healthy, but a backend it needs is down)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="300.8242" x="530" y="421.6138">and that is the correct state: keep the process, stop the traffic.</text></g><g class="link" data-entity-1="lv2" data-entity-2="rd2" data-uid="lnk14" id="link_lv2_rd2"><polygon fill="#475569" points="904.1476,285.6982,895.1476,281.6982,899.1476,285.6982,895.1476,289.6982,904.1476,285.6982" style="stroke:#475569;stroke-width:1;"/><path d="M886.2676,285.6982 C892.2276,285.6982 892.1876,285.6982 898.1476,285.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="p1" data-entity-2="p2" data-uid="lnk16" id="link_p1_p2"><polygon fill="#475569" points="487.9382,219.2463,489.678,209.5524,486.7465,214.3904,481.9085,211.459,487.9382,219.2463" style="stroke:#475569;stroke-width:1;"/><path d="M480.0267,187.0072 C480.0789,187.2196 480.131,187.4321 480.1832,187.6447 C480.6007,189.346 481.0205,191.0566 481.4418,192.7736 C482.2845,196.2074 483.1333,199.6664 483.9821,203.1255 C484.831,206.5846 485.6799,210.0439 486.5228,213.4785 C486.9442,215.1957 487.3641,216.9068 487.7817,218.6086 C487.8339,218.8213 486.4561,213.2068 486.5082,213.4192" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.7598" x="488" y="189.9541">the startup probe succeeds ONCE</text></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1219.4355" x="58.7822" y="583.8301">The gating is the exam point: while a startup probe is failing, the other two are not merely tolerant of failure &#8212; they are not running at all. It is also why an over-tight startup probe is worse than none:</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="890.709" x="223.1455" y="599.9287">if it exhausts failureThreshold &#215; periodSeconds the kubelet kills the container just as a liveness probe would, and the app never gets to phase 2.</text></g><!--SRC=[XLRDZYCr4BxdAOgz0D8acOHR50MDThAhC4CccWHMA-3Wj2jf4xVTijsJ3GXfJZm0Gk82py4TtcIUX2gxaytV35BKKjnskUghx_kgFr4cqvL4QBNQwHUirRujbLWwKVZsAZEY6N8ii5LMXMu45JJ2dK78h0b26NIVUj1gWHSWZ8Hrhh8SIcVd2Cg3gunHPadBQ1eDXraGPaa1NarouH4wyC_VGD711-52LTO7wPI7gzkxyV0LzFjBPwjoC03XeUp0pms0lJZrmGcV-zxqlVe9UvtEO26KhXpESeS-jrhsu8jBlgj4fwoS8YKlVGywb_3qwsz05mTBEox1fpVyDxC5qfj-csCEzcANLckKW0_eDXJ1GsM2qa3PWg-o3Bs_u9eCg026TwLwn9BGggDnMOAscf3gykLXLLezeA50iInuUlmTndSpkFzcF1wDt-wbylJuvqqrHsSme0TfwM5i0Fo0MHKGjc70KWuef8f_8iR-jAvKncatOb4e_TFZNtlf5tI1JDdhXyvX-hkx_Yz_lcnY9JFbijs91A8mI6bp8H2SM2nK5dDQKniHWYhmV19E7YKnooag_VXmQPK9O1SW3cjhxUNoJeNSLhJBC9N1Qxk6hxxzch4Ja8cCSn2kQDBP9GOFAnLfCDzGdmdXjVa8Tunz2l0S5zOXqoAoOg6CyZbLEhSsi4WOfmH1J19babHzKUHFZtBXxQ2jFKFDa8luQkM90o8BUaD9hP0BSCBdCAVwM9KeDBqIK2XFV5-e9Mb5Hd09WTOUmAMcInF0wtn30FiIcj_bIaeqFqWgkZcesq_FapTrJ-Jf6mxsonb3w6uDGPGbPqfWqy8Es8JEbiWaAo14utx6Z1lClM0tsXd7MsjhXfJTO_CuaDcXhCWrAasGC8bsJWT4vllXT7PrFnjUV_bH3qV6u-7OVYAqFdeD9xiYpMeCS3EwlPt6bTqL5wSXkUXjYKIBYTKgsq0GAufeYKYjRKvJ83TtPDKc-DPf7A9RK49VenQRsW69xCI369RBP0SW7exltkrHOBa3K3zqNzBvym2on6jTm-p-wisRqUkNqDl2L3j38ToAsCd6TayNRYwetglhzx1ak-kGRV1-ie-a5Zfu6dTePBI0AK6Nm7PiukoAXMMpOTgC9h1mjgYDlH0XoncDARe7EdK6qDb-u-1cE9nCjnwNX8jOahgHeqHBa57YfFzCc3HVvY9RjSw2xMJtsC-G94l-uScAPCMMC1fV3oT3Uendj- -JE2eERBBAEMA1tkmRt