<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="404px" preserveAspectRatio="none" style="width:1382px;height:404px;background:#FFFFFF;" version="1.1" viewBox="0 0 1382 404" width="1382px" zoomAndPan="magnify"><title>What DNS answers &#8212; ClusterIP versus headless</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="416.1533" x="475.4233" y="30.8838">What DNS answers &#8212; ClusterIP versus headless</text></g><!--cluster normal--><g class="cluster" data-entity="normal" data-source-line="4" data-uid="ent0002" id="cluster_normal"><rect fill="#F0FDF4" height="259" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="352" x="14" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="261.5044" x="59.2478" y="71.8921">nslookup nginx &#183; normal ClusterIP Service</text></g><!--cluster headless--><g class="cluster" data-entity="headless" data-source-line="10" data-uid="ent0006" id="cluster_headless"><rect fill="#F8FAFC" height="259" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="440" x="374" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="363.3589" x="412.3206" y="71.8921">nslookup nginx &#183; headless, clusterIP: None, with a selector</text></g><!--cluster stable--><g class="cluster" data-entity="stable" data-source-line="16" data-uid="ent0010" id="cluster_stable"><rect fill="#F0FDF4" height="202" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="554" x="822" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="312.1206" x="942.9397" y="168.8921">The reason headless exists: stable per-Pod names</text></g><!--entity n1--><g class="entity" data-entity="n1" data-source-line="5" data-uid="ent0003" id="entity_n1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="181.2007" x="137.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.2007" x="151.5" y="112.8921">ONE answer: 10.43.22.69</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="116.9502" x="151.5" y="125.9648">the Service's virtual IP</text></g><!--entity n2--><g class="entity" data-entity="n2" data-source-line="6" data-uid="ent0004" id="entity_n2"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="336.2095" x="22" y="223.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.3633" x="36" y="249.8921">The client always connects to the same address.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="261.6851" x="36" y="262.9648">kube-proxy rewrites it to a real Pod IP per connection,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="308.2095" x="36" y="275.6138">so load balancing happens BELOW the client, in the dataplane.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="291.6128" x="36" y="288.2627">A cached DNS answer is harmless &#8212; the VIP never moves.</text></g><!--entity h1--><g class="entity" data-entity="h1" data-source-line="11" data-uid="ent0007" id="entity_h1"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="321.395" x="433.5" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="293.395" x="447.5" y="112.8921">THREE answers: 10.42.0.3 &#183; 10.42.1.3 &#183; 10.42.2.3</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="203.5161" x="447.5" y="125.9648">A records pointing straight at the Pods</text></g><!--entity h2--><g class="entity" data-entity="h2" data-source-line="12" data-uid="ent0008" id="entity_h2"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="422.9902" x="382.5" y="223.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.9014" x="396.5" y="249.8921">No VIP, no kube-proxy rules, no platform load balancing.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="344.8457" x="396.5" y="262.9648">curl nginx still reaches different Pods on different runs &#8212; but that is the</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="379.0757" x="396.5" y="275.6138">RESOLVER picking from a multi-answer response, not Kubernetes balancing.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="394.9902" x="396.5" y="288.2627">A long-lived client that resolves once pins itself to one Pod until its cache expires.</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="17" data-uid="ent0011" id="entity_s1"><rect fill="#DCFCE7" height="161.3887" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="503.9326" x="864" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="300.5615" x="878" y="209.8921">web-0.nginx.default.svc.cluster.local &#8594; 10.42.0.3</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="287.3213" x="878" y="222.9648">web-1.nginx&#8230; &#8594; 10.42.1.3    web-2.nginx&#8230; &#8594; 10.42.2.3</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="878" y="237.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="353.3481" x="878" y="250.5625">Addressing ONE specific Pod by a name that survives reschedules.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="475.9326" x="878" y="263.2114">A StatefulSet gives every Pod hostname + subdomain automatically via spec.serviceName;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="428.0278" x="878" y="275.8604">with a plain Deployment you only get the flat list above, which is why the lecture's</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="229.8184" x="878" y="288.5093">headless demo still looked like round-robin.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="878" y="303.0342">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="383.2813" x="878" y="316.1069">This is the shape behind database replicas, brokers, quorum members &#8212;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="428.4575" x="878" y="328.7559">and any client that must reach a named partition owner rather than &#8220;one of them&#8221;.</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1344.0068" x="11.4966" y="372.8301">Same question, different answers. A normal Service hides the Pods behind one address; a headless Service publishes them and gets out of the way. Choose headless when the client needs to know who it is talking to,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="977.4229" x="194.7886" y="388.9287">or when something else &#8212; a StatefulSet, a database driver, a service mesh, your own discovery code &#8212; is doing the balancing and wants the real addresses.</text></g><!--SRC=[XLPDRkCs5Dxx5A-pwQAs4Zj5WMO20zEPe1rqa0HnCBDekw14sY9CaHgIikCf2cJL0nHTjjjUeViU9IVfzoZPKMmN3RA89FBnu_VpNZxJjZ2DL9Hb9-rlTCw44wd5meigd2mBAqQnL9NAwgOoWwYZKVIX597UNCr8sB1MFj3Zm-_qsZGXAl_sXbPurGGgbP16XJ0OU5L4OHVO-S86uzoogSakjBsdV_ucwtmbJ6_xJFcLBjGBkhXOUDVKtpedfrCIORlqvm5Hh-JrrMK7v9p6fzcNPzbaadtrzO_s8kXFwdmydk82swgV1rff7nkKUNjpSS8hfkcafqF6pylVONDXjBAHX5cBJQ32MOllWQ8ZBXr4fKX8wN7Ph7ViiidLgFRkVeDwQw-Z2gGZxn9u0GGtJW85rSflQsfdXnsgNg7Wo3WXAHT6s4BR1PMYhfKDzCtbk-iF2KGBSKZQfaSfegYnMcM7vLvH8OfIoPw4fA6Ny1NhbTJa6k-1pIgeIPLRgP3rw49fRJk-9k3BZcdqGwcbLFOdwTPsDENtl_oFz5k7386-K_-ShfnLGrhhM8Ace0mAEBypGtlcTkE-5Uw-kxtScY6qRfXafzaP7zO-ZFiFa-pi6IsevBmCL3jj8zCSeXTwKKBvc1Y1OA77WYWASDv1shFDbMF-Xl0izNtG07Pw2GRZ77xUKxRldwBnfYChH6qCcmQw1P9wFbUU7Sc0oDdU6z_OLi6yOSm03cc1_T06jvUpwtVlBs-friMIRplthWBdLMEY7dM-WAThPuDYp96-nqsyLMpa9yJ736QSNOoCNi5aNNOI55Hp1bO2v4BXNCk1WCPp3WLqJubemBtXzwrDITtNsl-d_KgsNtbeltBVVfnZ41Z0riu-wbw72AE4A7AiGH17ZC0YqE58_-cMxPbkhVBHQPPqogIQ2z2NXLMHTPxEZ2kGzSTVVtloOuyhtZrkTpy-_DLRnax53t-V7FiEy-wOxtFVzY7ManjZg5MXvxf8pEORoCkNQzK83LeYgu4Dt0_OcqVLd4KHrRmnCnLfaNPmL