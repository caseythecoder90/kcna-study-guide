<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="452px" preserveAspectRatio="none" style="width:1500px;height:452px;background:#FFFFFF;" version="1.1" viewBox="0 0 1500 452" width="1500px" zoomAndPan="magnify"><title>Three probes, three consequences</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="298.0986" x="593.4507" y="30.8838">Three probes, three consequences</text></g><!--cluster lv--><g class="cluster" data-entity="lv" data-source-line="6" data-uid="ent0003" id="cluster_lv"><rect fill="#FEF2F2" height="162" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="492" x="14" y="144.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.8125" x="129.5938" y="162.3921">livenessProbe fails failureThreshold times</text></g><!--cluster rd--><g class="cluster" data-entity="rd" data-source-line="10" data-uid="ent0005" id="cluster_rd"><rect fill="#F8FAFC" height="175" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="482" x="514" y="137.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="270.2007" x="619.8997" y="155.8921">readinessProbe fails failureThreshold times</text></g><!--cluster sp--><g class="cluster" data-entity="sp" data-source-line="14" data-uid="ent0007" id="cluster_sp"><rect fill="#FEF2F2" height="162" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="490" x="1004" y="144.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="253.5571" x="1122.2214" y="162.3921">startupProbe fails failureThreshold times</text></g><!--entity res--><g class="entity" data-entity="res" data-source-line="4" data-uid="ent0002" id="entity_res"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="649.0435" x="205.5" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="348.1689" x="219.5" y="87.8921">The kubelet runs the probe and gets one of three results</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="571.5273" x="219.5" y="100.9648">Success &#8212; passed &#183; Failure &#8212; failed &#183; Unknown &#8212; the diagnostic itself failed, take no action and check again</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="621.0435" x="219.5" y="113.6138">A probe you did NOT configure always counts as Success. Readiness alone counts as FAILURE before its initial delay.</text></g><!--entity sum--><g class="entity" data-entity="sum" data-source-line="22" data-uid="ent0012" id="entity_sum"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="972.4585" x="44" y="340.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="160.3799" x="58" y="366.8921">The one-sentence version</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="805.6157" x="58" y="379.9648">LIVENESS asks &#8220;should this container be restarted?&#8221; &#183; READINESS asks &#8220;should this Pod receive traffic?&#8221; &#183; STARTUP asks &#8220;has it finished booting yet?&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="944.4585" x="58" y="392.6138">Only readiness changes the READY column. Only readiness leaves the process alone. successThreshold MUST be 1 for liveness and startup &#8212; a container cannot be half-restarted.</text></g><!--entity lvb--><g class="entity" data-entity="lvb" data-source-line="7" data-uid="ent0004" id="entity_lvb"><rect fill="#FEE2E2" height="121.1421" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="440.6074" x="56.5" y="177.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="195.0254" x="70.5" y="203.3921">the kubelet KILLS the container</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="365.7285" x="70.5" y="216.4648">then the Pod's restartPolicy decides &#8212; Always or OnFailure restarts it</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="412.6074" x="70.5" y="229.1138">RESTARTS increments &#183; repeated failures give CrashLoopBackOff (chapter 03)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="270.8052" x="70.5" y="241.7627">the Pod object survives; it keeps its name and its IP</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="70.5" y="256.2876">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="367.9575" x="70.5" y="269.3604">Use for: a deadlock &#8212; the process is running but making no progress.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="397.9014" x="70.5" y="282.0093">If your app crashes on its own when unhealthy, you may not need one at all.</text></g><!--entity rdb--><g class="entity" data-entity="rdb" data-source-line="11" data-uid="ent0006" id="entity_rdb"><rect fill="#326CE5" height="133.791" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="430.8105" x="556.5" y="170.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.1499" x="570.5" y="196.8921">the Pod is marked NOT READY</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.2729" x="570.5" y="209.9648">READY goes 1/1 &#8594; 0/1 in kubectl get pods</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="386.3267" x="570.5" y="222.6138">the EndpointSlice controller removes its IP from EVERY matching Service</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="396.6499" x="570.5" y="235.2627">NOTHING IS RESTARTED &#8212; the container runs on and keeps being probed,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="224.9629" x="570.5" y="247.9116">so it rejoins automatically when it recovers</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="570.5" y="262.4365">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="402.8105" x="570.5" y="275.5093">Use for: warm-up, a temporary overload, a backend dependency being down,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="311.0669" x="570.5" y="288.1582">or taking a Pod out of rotation for maintenance on purpose.</text></g><!--entity spb--><g class="entity" data-entity="spb" data-source-line="15" data-uid="ent0008" id="entity_spb"><rect fill="#FEE2E2" height="121.1421" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="438.7759" x="1046.5" y="177.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="321.4961" x="1060.5" y="203.3921">the kubelet KILLS the container &#8212; same as liveness</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="359.3853" x="1060.5" y="216.4648">subject to the restart policy, and then the startup probe begins again</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="380.4883" x="1060.5" y="229.1138">the budget is failureThreshold &#215; periodSeconds; exceed it and the app is</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.7861" x="1060.5" y="241.7627">killed for being slow, not for being broken</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="1060.5" y="256.2876">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.1177" x="1060.5" y="269.3604">Use for: anything that takes longer to boot than</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="410.7759" x="1060.5" y="282.0093">initialDelaySeconds + failureThreshold &#215; periodSeconds of the liveness probe.</text></g><g class="link" data-entity-1="res" data-entity-2="lv" data-uid="lnk9" id="link_res_lv"><polygon fill="#475569" points="41.2316,143.9887,49.9028,139.3185,44.2914,140.0342,43.5757,134.4228,41.2316,143.9887" style="stroke:#475569;stroke-width:1;"/><path d="M205.2458,109.6274 C126.7484,115.7536 61.1614,124.6971 47,137.6982 C45.4584,139.1135 44.0241,140.6136 42.6902,142.1875 C42.3567,142.581 42.0295,142.9791 41.7085,143.3816 C41.548,143.5828 45.0608,139.0399 44.9034,139.2433" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="res" data-entity-2="rd" data-uid="lnk10" id="link_res_rd"><polygon fill="#475569" points="530,137.3428,534,128.3428,530,132.3428,526,128.3428,530,137.3428" style="stroke:#475569;stroke-width:1;"/><path d="M530,129.8763 C530,131.8068 530,133.7895 530,135.8155 C530,136.3219 530,130.8311 530,131.3428" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="res" data-entity-2="sp" data-uid="lnk11" id="link_res_sp"><polygon fill="#475569" points="1005.9034,143.9408,1003.3939,134.4171,1002.7755,140.04,997.1526,139.4217,1005.9034,143.9408" style="stroke:#475569;stroke-width:1;"/><path d="M854.5194,111.0086 C926.9966,117.1195 986.5822,125.7089 1000,137.6982 C1001.569,139.1002 1003.0349,140.5883 1004.4039,142.1514 C1004.7461,142.5421 1005.0823,142.9376 1005.4125,143.3375 C1005.5776,143.5375 1001.9878,139.0576 1002.1499,139.2599" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="26"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1351.7314" x="66.6343" y="420.8301">The distinction that matters in production: a liveness failure is destructive and a readiness failure is reversible. Putting a database dependency in a liveness probe turns one database blip into a cluster-wide restart storm;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="999.9814" x="242.5093" y="436.9287">putting it in a readiness probe simply stops traffic until the database is back. Liveness should test the process, readiness should test whether it can usefully serve.</text></g><!--SRC=[dLR1RXn54BtxAufS0E5Tn-AMM8iCsS0A9xQyTgG8EFHCr-vqjgTxwEwnMH1IJdm0Gk82ty4T_YHVmgkUsVNOtWG5oR8zCztLh-gzUjKV65VQLZEDnmVTJ_BUnWDjr3AeEXwiIgT6gUAQnqrRsxraacMwg08pDS4N7FSfvQVIkyZVj-nAZdjxWSkat19h7rnKJAksOCk9GkiYrlTxIJbDIqwHl6FoYpvIuDZQ5BzrHz7yo8yE3oVpjaJKI6zU_qQDYf4r_VqNFLN6je7psmN-xzvUkfNprow_bPCa5UTZCYMP5Dak-hN0hLPCpfCga_4kWoahBbUabiguemCvVJ90SToZNliMKJKzFxsGh1TcAIYKlLRhY1UjGq8gKWzwJEUij762Nrb9z6R9q-FPoUNvb0fUU8G0FZBE9ACiQRPgFUv1FA2Z8uLeBaqciY_SAR4rLom7d6Lyab_Clu5Bg8gLjvgIgJbAf6NmRVEvqbqiUqK_xH4DegK1OL_FJaxckOx8DA4i70OLmNkNFvvv_M66bLH8PzwQSeqCIgEv8-suAuuFTEesjFMhaNAwN-lpwVpY-FnYZdgK0UgJWe7Sm0sh1ABxx28jaJfz4LIiJhn7LkNgTB6WZyfADOa3FVpqu_l1UyJaYrV8cc8RhX0bFWOIMZ4tCJFXLDqfL1vcPzimWq2N4TNsuH4fPAkqzH3FHdVGIjQiYQ9wPzoIYZPHhLRoBsI71SiW0haFSBOGaGLIJKEbvCRI8Xc8IFjQojwwYfLDrNe_2x9MQmHDv1ZL4PMf1BdPeOAA6ygBlPzl2IXi9FeU2kgbg7V9HwgBn6iLLjmroldq-CdBMmJZcPOUcHqU7DARNtwbX_XhN9PUcQmO0pLUnztyJPrkl75f3grruWpUMZ0EjNYGsRD6Y-1hchwOdhy4cbHMKlmvW_2IxmS6qAzcpx-asPnw0KwVR0dTDa3dOhrZT7efME9cUz3xz-D6Bz8A_0g8qVXjyi1YIl2pxiZCNqlW3l6TEhjMeHwrpJu4bxXkV51XJRBDUgNbRO46OC3IQ1IdOSRh7fk6S7OWGqUcJf6gQmb854OSV5BP574gweOwirDmTicwQKFZ8x_Lc_HTSUKsRvl_OqwnUKzpocp5tBdGUM-BGoRQhkUJp_jw3uBEnBBsCwDRK-jnzwvVy3AJjtisoFgYrQ9PioEzVtwdXeFnUWwMdORLy0-bT2g8xy_CpMvsg7rbh8msOQAZCbf_lP-R_UPT4JnuVxT7kNNAyayLl4667ohatH95GpKAZtZuiYEtVYGzaOdKuwTF_Zl7Rg3pbeMkZZiDAJQzPYADHAYZ2JpgrcFGjnvZS- -A0SyRHHQXGgRII93l88cJsOlfy-byZkDMCfF-0EXMX5UPE91FiTK4wy_UlFvJXevOrUojUwLh08Lb3gMW5WjJRZPc1xaysswhbDWIBL1GMBhEDHT2rfnao_tAdpeOnDQRSJj1ljnTe3h_BBrjQpUcEmijgokEjyPGldgCCUlofUI6jMUNyml9-Z2BQSkLY7AZVsafDQXHgPo83vigPHUZRRs6r2wztt3Rrk1Aq-YRocWuqdSR2kLzYIajDdDa9XVvhePxckkkOrcbi4bCSRaLIIAwpPzat6w1zZAKhiDb8mLPSjNDRJMeo61PuAoEmg8SPsrAdVbfbLIXq2i3vyIfwevyARN1TVVLxOx26dIkGnEXIhQDG3ownjLdwoun-L0_FZemmgsPDFsXa48-uGPbTqGqTGCwiGkJfPSKndqojhlGRiv5BcBtOph