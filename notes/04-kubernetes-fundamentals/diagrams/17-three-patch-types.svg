<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="411px" preserveAspectRatio="none" style="width:1422px;height:411px;background:#FFFFFF;" version="1.1" viewBox="0 0 1422 411" width="1422px" zoomAndPan="magnify"><title>Three patch types, one intention, three outcomes</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="421.0664" x="496.5483" y="30.8838">Three patch types, one intention, three outcomes</text></g><!--entity before--><g class="entity" data-entity="before" data-source-line="4" data-uid="ent0002" id="entity_before"><rect fill="#326CE5" height="95.8442" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="458.3589" x="481.5815" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="327.2725" x="495.5815" y="87.8921">The live Deployment &#183; spec.template.spec.containers</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="186.4253" x="495.5815" y="100.9648">[0] name: nginx    image: nginx:1.26</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="180.3345" x="495.5815" y="113.6138">[1] name: sidecar  image: busybox</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="495.5815" y="128.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="430.3589" x="495.5815" y="141.2114">The intention in every case below: move nginx to 1.27 and leave the sidecar alone.</text></g><!--entity strategic--><g class="entity" data-entity="strategic" data-source-line="6" data-uid="ent0003" id="entity_strategic"><rect fill="#DCFCE7" height="148.7397" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="343.4175" x="189.0815" y="206.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="198.9927" x="203.0815" y="232.3921">--type=strategic &#183; THE DEFAULT</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="179.8618" x="203.0815" y="245.4648">Kubernetes' own extension. Body:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.1606" x="203.0815" y="258.1138">containers: [ {name: nginx, image: nginx:1.27} ]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="203.0815" y="272.6387">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="315.4175" x="203.0815" y="285.7114">The API knows containers has patchMergeKey &#8220;name&#8221;, so it</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.3291" x="203.0815" y="298.3604">matches the entry by NAME and merges into it.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="203.0815" y="312.8853">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="240.2061" x="203.0815" y="325.958">RESULT: nginx &#8594; 1.27 &#183; sidecar UNTOUCHED</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="232.8584" x="203.0815" y="338.6069">Not supported on custom resources (CRDs).</text></g><!--entity merge--><g class="entity" data-entity="merge" data-source-line="8" data-uid="ent0004" id="entity_merge"><rect fill="#FEE2E2" height="148.7397" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="320.209" x="550.5815" y="206.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="272.7271" x="564.5815" y="232.3921">--type=merge &#183; RFC 7386 JSON Merge Patch</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="77.6177" x="564.5815" y="245.4648">Identical body:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.1606" x="564.5815" y="258.1138">containers: [ {name: nginx, image: nginx:1.27} ]</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="564.5815" y="272.6387">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="292.209" x="564.5815" y="285.7114">Plain JSON semantics: an array is a VALUE, not a set of</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="275.0752" x="564.5815" y="298.3604">records. The whole list is replaced by what you sent.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="564.5815" y="312.8853">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="288.4707" x="564.5815" y="325.958">RESULT: nginx &#8594; 1.27 &#183; SIDECAR SILENTLY DELETED</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="270.8052" x="564.5815" y="338.6069">Same text, same command, different flag, data loss.</text></g><!--entity jsonp--><g class="entity" data-entity="jsonp" data-source-line="10" data-uid="ent0005" id="entity_jsonp"><rect fill="#DCFCE7" height="174.0376" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="342.8159" x="889.0815" y="193.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="218.5308" x="903.0815" y="219.8921">--type=json &#183; RFC 6902 JSON Patch</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.8984" x="903.0815" y="232.9648">A LIST of operations, not a shape of the object:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="65.4038" x="903.0815" y="245.6138">- op: replace</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="237.1929" x="909.1938" y="258.2627">path: /spec/template/spec/containers/0/image</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="89.2515" x="909.1938" y="270.9116">value: nginx:1.27</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="903.0815" y="285.4365">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="314.8159" x="903.0815" y="298.5093">Addresses by POSITION. Precise, and the only type that can</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.1875" x="903.0815" y="311.1582">remove a field or append to a list &#8212; but index 0 is a guess</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="297.8164" x="903.0815" y="323.8071">about today's order, and &#8220;test&#8221; ops are how you guard it.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="903.0815" y="338.332">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="240.2061" x="903.0815" y="351.4048">RESULT: nginx &#8594; 1.27 &#183; sidecar UNTOUCHED</text></g><g class="link" data-entity-1="before" data-entity-2="strategic" data-uid="lnk6" id="link_before_strategic"><polygon fill="#475569" points="512.9413,206.1302,522.7853,205.8189,517.4439,203.9561,519.3067,198.6148,512.9413,206.1302" style="stroke:#475569;stroke-width:1;"/><path d="M613.087,157.7742 C582.0386,172.7661 552.3143,187.1187 518.3444,203.5213" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="before" data-entity-2="merge" data-uid="lnk7" id="link_before_merge"><polygon fill="#475569" points="710.5815,205.9699,714.5815,196.9699,710.5815,200.9699,706.5815,196.9699,710.5815,205.9699" style="stroke:#475569;stroke-width:1;"/><path d="M710.5815,157.7742 C710.5815,172.7173 710.5815,183.6172 710.5815,199.9699" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="before" data-entity-2="jsonp" data-uid="lnk8" id="link_before_jsonp"><polygon fill="#475569" points="888.8798,196.7908,882.5145,189.2754,884.3773,194.6167,879.0359,196.4795,888.8798,196.7908" style="stroke:#475569;stroke-width:1;"/><path d="M808.0761,157.7742 C833.2587,169.9338 855.7215,180.7801 883.4767,194.1819" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="16"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1404.1631" x="5" y="379.8301">Strategic merge is the default because it does what you meant on Kubernetes' own types. JSON merge patch is the one that silently eats list entries &#8212; reach for it only on custom resources, where strategic merge is unavailable.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="879.3135" x="267.4248" y="395.9287">JSON Patch is the scalpel: positional, explicit, and the only way to say &#8220;delete this field&#8221; (op: remove) or &#8220;append to this list&#8221; (path ending in /-).</text></g><!--SRC=[jLNDRXit4BxxAQQv90QabPq2TYku0bHBGPGeic791OeqXz5oj6B29HSar_AsQE1J7w3eiNsEtlieVf8EkVgpf1uAj8O0QxMSuSptVVFD5rAdgXG4ITAgFzuOvLf2OcOnTwrFgSQcdrDEIL7cwiXBhmWcSqi41Vfq3hugo3N0Q0AfFMalZMw0ZoTCwLEJapiwifHwr1d7FflC2PIy8-XHeKoLSmZyzIUuWjB4Kruez9J4fzHeZrAJTJ_e2oT_fFRfQUVzoGVGc5CRT2RrFV2Vp35RFRTFavTd5wrmkhCTTRgASb9GYdOTDIrTDJNtwv2je53fkYV-1dH7je8K7S6Kb5cq8JVSI5s8Dy1tdmDg0OgGVsVSrjUXOeIIvItFuE82qvGJTpg0ZfFDZAKdA7rkVcu6QBzntZ8WcKm3I9FNVUZrNtLlXvEjEj-MKxAQFBddO1PSvZtNxBZc1Burechlmx51jWtluQSjF1jxQ9x_31_-2PtkzG0-QRDmiCa8S-ueQkCTsOpUKWMF3x-7AnuV_cY0Co3zVaLv220NCMDS6EPf1QFkktx4Cm-PN20ZH2U7ohdfZncLbIeUV_crPYCeQqd1xMXoTNlvkj_RltraFBYoA8pr95ZBa9REcnmiELFQbAz-SNdJSyVR16R6Y9g-DKM76Op5Xq9kNbt2-PTVdS6RyTK88Zfm7VhUgcGWWjnIL33z_wYxLfoXhi9HZk52peOQq5giG3f0-AuxlEqtG3CooASycDb-CTokiS8b4CImc1iLHjlvaC7oT6FAQ3AFYpbwg4p9UVI_PMyywFKlkpVyVzWVJORVi_w7_SaX4iSC1NWMFuiiV6NhuTv40uISpSW6dvafpFWPFO8opctJESKbcv6kmqn-T2oD9P5dNv-yh27SfR0Bmy5umdY1AOYLmOFera3EiQ3mAkZSJ3_o9GSuRd9aUuNW_ci8upLlGokuP6lbcVNJHXwjarRKmw7uErJb4w4SugGh1ElViVYPmkkhyM0ok1ebSCt8I4U