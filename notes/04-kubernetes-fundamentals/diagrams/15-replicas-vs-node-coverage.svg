<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="516px" preserveAspectRatio="none" style="width:1354px;height:516px;background:#FFFFFF;" version="1.1" viewBox="0 0 1354 516" width="1354px" zoomAndPan="magnify"><title>Replica count is not node coverage</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="303.0645" x="521.9028" y="30.8838">Replica count is not node coverage</text></g><!--cluster dep--><g class="cluster" data-entity="dep" data-source-line="4" data-uid="ent0002" id="cluster_dep"><rect fill="#FEF2F2" height="411" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="476" x="209.9351" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="150.2681" x="372.801" y="71.8921">Deployment &#183; replicas: 3</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.27" x="385.3" y="84.9648">you control HOW MANY</text></g><!--cluster ds--><g class="cluster" data-entity="ds" data-source-line="14" data-uid="ent0010" id="cluster_ds"><rect fill="#F0FDF4" height="404.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="466" x="693.9351" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.2808" x="819.2947" y="71.8921">DaemonSet &#183; no replicas field at all</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="254.8477" x="799.5112" y="84.9648">you control WHERE &#8212; one Pod per eligible node</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="5" data-uid="ent0003" id="entity_d1"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="78.0908" x="575.9351" y="99.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6118" x="589.9351" y="125.8921">node-1</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="50.0908" x="589.9351" y="138.9648">pod &#183; pod</text></g><!--entity d2--><g class="entity" data-entity="d2" data-source-line="6" data-uid="ent0004" id="entity_d2"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="70.6118" x="484.4351" y="191.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6118" x="498.4351" y="217.8921">node-2</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="20.1577" x="498.4351" y="230.9648">pod</text></g><!--entity d3--><g class="entity" data-entity="d3" data-source-line="7" data-uid="ent0005" id="entity_d3"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="70.6118" x="436.4351" y="283.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6118" x="450.4351" y="309.8921">node-3</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="40.3154" x="450.4351" y="322.9648">nothing</text></g><!--entity dnote--><g class="entity" data-entity="dnote" data-source-line="8" data-uid="ent0006" id="entity_dnote"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="458.6885" x="218.4351" y="375.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="430.6885" x="232.4351" y="401.8921">The scheduler spreads Pods, but spreading is a preference, not a promise.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="368.0811" x="232.4351" y="414.9648">Three replicas can land 2 + 1 + 0. Raise it to six and you will probably cover</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="399.9155" x="232.4351" y="427.6138">every node &#8212; probably. Add a node tomorrow and nothing new is scheduled on it.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="308.1987" x="232.4351" y="440.2627">If you need a Pod on every node, hoping is not the mechanism.</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="15" data-uid="ent0011" id="entity_s1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="70.6118" x="891.4351" y="99.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6118" x="905.4351" y="125.8921">node-1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="20.1577" x="905.4351" y="138.9648">pod</text></g><!--entity s2--><g class="entity" data-entity="s2" data-source-line="16" data-uid="ent0012" id="entity_s2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="70.6118" x="891.4351" y="191.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6118" x="905.4351" y="217.8921">node-2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="20.1577" x="905.4351" y="230.9648">pod</text></g><!--entity s3--><g class="entity" data-entity="s3" data-source-line="17" data-uid="ent0013" id="entity_s3"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="70.6118" x="891.4351" y="283.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6118" x="905.4351" y="309.8921">node-3</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="20.1577" x="905.4351" y="322.9648">pod</text></g><!--entity snote--><g class="entity" data-entity="snote" data-source-line="18" data-uid="ent0014" id="entity_snote"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="449.9585" x="701.9351" y="382.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.1357" x="715.9351" y="408.3921">The controller creates one Pod per eligible node and keeps it that way.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="421.9585" x="715.9351" y="421.4648">Add a node and a Pod appears on it. Remove a node and its Pod is garbage collected.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="383.4155" x="715.9351" y="434.1138">Delete the DaemonSet and all of them go. The count is an output, not an input.</text></g><g class="caption" data-source-line="26"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1336.8701" x="5" y="484.8301">The question changes from &#8220;how many?&#8221; to &#8220;everywhere?&#8221;. Use a Deployment for stateless services where scaling and rolling out matter more than which host a Pod runs on. Use a DaemonSet when a copy must run</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1127.6289" x="109.6206" y="500.9287">on all or certain hosts because it provides node-level functionality that lets the other Pods on that node work at all &#8212; a CNI agent, a log shipper, a metrics exporter, a CSI node plugin.</text></g><!--SRC=[bPN1RXit48RlUeffhhLMbNqB11Lf4ZG-D2sS147Hv42Hert2N79BSgseHO4yH8xjS_JUHycJz1_kMbvNCje2MaXBpWmv_tmp-i9wxNh3L5MBuPD3S6bXhAgZQjFYMdirpmstN7LzwsRPPiTqnPspMf4ElSza4_cGyI2E3ZSSLSspMMITbQzX_UWPpCE-PTZ-zIV5mJazfejtVfNiB_nukLplGmzddsDmzEBxj_JTavS_hXQoktv4grKTGzzzeynwJIgHuOv-dH5Dpf3Jvyj9m2uOEGrVap2RGuJb2VVp- -ud_SvF-4tpW1ADzVL9tulxlgyRfgGRDhtZIAcBh4oY7u99PxJfyxY2OAAm8hnjERBNV5RqbfNGsiJLvFZNJMG-I4nQUNBA6pgdBsc9vwkAhXHyo6RAWPBzGB8jwk-iSn9oepPkFnHop68Idx6w7qhz-UEdWtb5Jup1ZSf63cs8CUnAv54FyhoJD6xpDHGyxb0Tdt2vBRVnp18GQeZbtR5dr8Hkr4HK09lKicwKjwcj9h9tJba_2Wz3XlPcIVEV6ciC-_ScxFnyFTJJd1-lIwtCnV5w2VNRVRmLjy6_uaAt3tVgRoqx985IEVS0wczVFBzwNgGCdaks7LXWPskxGMp9-9zTy6q8jq2b_z85K_-3Q_f__4yS_wq17dGyGV-eWk2lmNhczB0CXQPhvYuLTXl8kbFxAViJ1CLsW4Tr7QkOHjmmkLg0FJMpkVISy5IhkC7imhLm9PtPdC3p6JlENB2xgtiv3jqJjhBHKXqg6l8RvoFQCFIvw_FOkhYCnzi3lAQHrtJCQv4_7VDQr4t7lAPRNcLa7ZQZhPiiDAVPJAikMwYpickvyiyzf_8kBLMZ85iC6G3wUuE6RfNVV_tvunyoEh1KkdBNO2Z9OaLlaYWxcVRRWBcMKLV72MbnlB4Q8OiBHe5oqiWYda0Wlo4I3iaPnSSC4PaXrQwnka7RfppMDFPU2deuy5071FOaVqlTdjeUzh1SBQpKpwwHKwaHMEEO8NO9cMZ3MlN3HCGukx66Kw5Zxf2VestljGY2o-Rzm1q8I8K0p3RSL2Qsy5Ns2bUx4A_7lY-zhUZfoqi2MXu0A7AXfjHOa1dbjUKShKx47xeGyx3szDNb4AfpVMrz9Ldy3G00]--></g></svg>