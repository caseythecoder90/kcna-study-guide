<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="638px" preserveAspectRatio="none" style="width:1378px;height:638px;background:#FFFFFF;" version="1.1" viewBox="0 0 1378 638" width="1378px" zoomAndPan="magnify"><title>Why your DaemonSet skipped the control-plane node</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="458.0508" x="455.9829" y="30.8838">Why your DaemonSet skipped the control-plane node</text></g><!--cluster tol--><g class="cluster" data-entity="tol" data-source-line="6" data-uid="ent0003" id="cluster_tol"><rect fill="#F8FAFC" height="469" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="496" x="113.7583" y="117.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="399.4771" x="162.0198" y="135.8921">Tolerations the controller adds to every DaemonSet Pod, for free</text></g><!--entity ctrl--><g class="entity" data-entity="ctrl" data-source-line="4" data-uid="ent0002" id="entity_ctrl"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="427.126" x="380.2583" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.0845" x="394.2583" y="79.8921">DaemonSet controller</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.126" x="394.2583" y="92.9648">creates one Pod for each ELIGIBLE node &#8212; eligible is the load-bearing word</text></g><!--entity w1--><g class="entity" data-entity="w1" data-source-line="16" data-uid="ent0011" id="entity_w1"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="115.3877" x="618.2583" y="285.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="77.2954" x="632.2583" y="311.8921">worker node</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="87.3877" x="632.2583" y="324.9648">no taint &#183; eligible</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="78.2354" x="632.2583" y="337.6138">Pod scheduled</text></g><!--entity cp--><g class="entity" data-entity="cp" data-source-line="17" data-uid="ent0012" id="entity_cp"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="318.9199" x="751.2583" y="285.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117" x="765.2583" y="311.8921">control-plane node</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="290.9199" x="765.2583" y="324.9648">taint node-role.kubernetes.io/control-plane:NoSchedule</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.6685" x="765.2583" y="337.6138">nothing tolerates it &#8594; NOT eligible &#8594; no Pod</text></g><!--entity fix--><g class="entity" data-entity="fix" data-source-line="23" data-uid="ent0016" id="entity_fix"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="661.4399" x="618.2583" y="405.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.728" x="632.2583" y="431.8921">Two ways it works anyway</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="592.2651" x="632.2583" y="444.9648">1 &#183; the workload declares the toleration itself &#8212; this is why kube-proxy and Calico DO run on control-plane nodes</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="496.9229" x="647.5391" y="457.6138">tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="633.4399" x="632.2583" y="470.2627">2 &#183; the node was never tainted &#8212; k3s does not taint its server node by default, which is why the course's lab shows 3 of 3</text></g><!--entity t1--><g class="entity" data-entity="t1" data-source-line="7" data-uid="ent0004" id="entity_t1"><rect fill="#FFFFFF" height="83.1953" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="445.6616" x="121.7583" y="150.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2578" x="135.7583" y="176.8921">node.kubernetes.io/not-ready &#183; NoExecute</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.895" x="135.7583" y="191.8408">node.kubernetes.io/unreachable &#183; NoExecute</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="287.998" x="135.7583" y="204.9136">so a CNI agent can start on a node that is not Ready yet &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="417.6616" x="135.7583" y="217.5625">otherwise: node not Ready because no network, no network because node not Ready</text></g><!--entity t2--><g class="entity" data-entity="t2" data-source-line="8" data-uid="ent0005" id="entity_t2"><rect fill="#FFFFFF" height="100.4438" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="326.4287" x="181.7583" y="269.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.5996" x="195.7583" y="295.8921">node.kubernetes.io/disk-pressure &#183; NoSchedule</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.4287" x="195.7583" y="310.8408">node.kubernetes.io/memory-pressure &#183; NoSchedule</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.8296" x="195.7583" y="325.7896">node.kubernetes.io/pid-pressure &#183; NoSchedule</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.4204" x="195.7583" y="340.7383">node.kubernetes.io/unschedulable &#183; NoSchedule</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="232.9712" x="195.7583" y="353.811">cordon a node and its DaemonSet Pods still run</text></g><!--entity t3--><g class="entity" data-entity="t3" data-source-line="9" data-uid="ent0006" id="entity_t3"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="340.1968" x="174.7583" y="418.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.1968" x="188.7583" y="444.3921">node.kubernetes.io/network-unavailable &#183; NoSchedule</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="176.0752" x="188.7583" y="457.4648">only for Pods with hostNetwork: true</text></g><!--entity t4--><g class="entity" data-entity="t4" data-source-line="10" data-uid="ent0007" id="entity_t4"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="365.3018" x="162.2583" y="522.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="337.3018" x="176.2583" y="548.8921">NOT on this list: node-role.kubernetes.io/control-plane</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="331.8853" x="176.2583" y="561.9648">which is exactly the taint kubeadm puts on control-plane nodes</text></g><g class="link" data-entity-1="ctrl" data-entity-2="tol" data-uid="lnk13" id="link_ctrl_tol"><polygon fill="#475569" points="593.7583,117.5297,597.7583,108.5297,593.7583,112.5297,589.7583,108.5297,593.7583,117.5297" style="stroke:#475569;stroke-width:1;"/><path d="M593.7583,109.7975 C593.7583,111.2176 593.7583,112.6712 593.7583,114.1524 C593.7583,114.8931 593.7583,115.6406 593.7583,116.3944 C593.7583,116.7713 593.7583,111.1497 593.7583,111.5297" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="tol" data-entity-2="w1" data-uid="lnk14" id="link_tol_w1"><polygon fill="#475569" points="654.1576,285.6387,652.5834,275.9165,651.4227,281.453,645.8862,280.2923,654.1576,285.6387" style="stroke:#475569;stroke-width:1;"/><path d="M609.9266,217.9437 C610.0519,218.1354 610.1777,218.3279 610.3039,218.5211 C610.8089,219.294 611.3217,220.0788 611.8418,220.8748 C616.0022,227.2422 620.6263,234.3194 625.4309,241.6728 C635.0402,256.3797 642.0894,267.1684 650.8758,280.6158" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="tol" data-entity-2="cp" data-uid="lnk15" id="link_tol_cp"><polygon fill="#475569" points="827.2476,285.6365,820.352,278.6044,822.5987,283.7959,817.4072,286.0427,827.2476,285.6365" style="stroke:#475569;stroke-width:1;"/><path d="M610.1684,199.695 C610.3355,199.7611 610.5038,199.8278 610.6731,199.8948 C611.3507,200.163 612.0462,200.4384 612.7592,200.7207 C614.1852,201.2852 615.6813,201.8775 617.244,202.4962 C623.4946,204.9708 630.8098,207.8669 638.963,211.0948 C655.2694,217.5504 674.9276,225.3331 696.1239,233.7247 C738.5163,250.5078 781.4822,267.5179 821.6689,283.4278" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="27"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1245.918" x="62.0493" y="606.8301">A DaemonSet does not override scheduling rules, it works within them: the controller sets node affinity for the target node and the default scheduler still has to agree. Taints, node pressure and resource</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1360.0166" x="5" y="622.9287">availability all still apply. Check with kubectl describe node NAME | grep -A3 Taints, and remove one with kubectl taint nodes NAME node-role.kubernetes.io/control-plane:NoSchedule- if you actually want app Pods there.</text></g><!--SRC=[bLRDZjis4BxxAQQvz6BPy3edOs5Wkp6A1LAdQ1Re8Sc19aSMOPeKI6fbDGtGKn-WwBlqtaV9asH6r5foxFoiuODDaJFVVFpc6_sWhJILGfXCfkaRdJDXghJOUh4Fqvsq8ei5xd5ILdipYZeQXD-B1XfNUNWXSE_iQumGTheiKG7j1UbizCvafH4MmJg5ev576ONTqk5d_Q5keq7_rbu7_GSkPhEbz2WY1d1qzbUd87SUKCW2LY_lVhxxwUMgZGWV__eNqEYjtb1C7Th4nWcLRL1uRRTGEw-kfnnr-GokhuMKQEDo2IA0ZDwSGBftX454xMmOLa2B89IYDGVuWBuP54pGnYsst2DoWgrtLPdYHsVW_GXWa84nJtRL1hr5gcwYtTIwc56jge7__uErMnrGLX7VsWjRA-kP0i6rdcu-qXOS2BXTtu7OKfqWXOKGXO_48preAOk5Y4mL9ORVsiGD5K94TZGDeZbYmTSwu28TxOziK8egy0eGF29vDnxy7ZmUdXhS0ub2suwcsJSvKZhiij9Z29NlIdyj2rILkKpKdgx7DqyvKMhrbEsL3UbnVnVz_bx3fBsUTs4Lw1XEnHFeUhGnu2lx1NQklgsWH7fMMV4WzDSXEMkQLgzjxbh70WeNuZg5M43q5Nu1oFmKoFhLFOig5YGbeqDC4iceNpx7Ts840onreQcVwJWUX8o4YtikKi88742eFPHLP0kuu2LXW78ZL8VnEM6CCyZU55efjE-KgsssJ2J6g_DrhYdEpzUVZpwSE0EJGox0YGS5aE0JN6BxqOJEcuZTgrCB3grew