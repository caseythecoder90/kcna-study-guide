<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="594px" preserveAspectRatio="none" style="width:1362px;height:594px;background:#FFFFFF;" version="1.1" viewBox="0 0 1362 594" width="1362px" zoomAndPan="magnify"><title>Who is reading your labels &#8212; the control plane, mostly</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="470.0742" x="438.4629" y="30.8838">Who is reading your labels &#8212; the control plane, mostly</text></g><!--cluster ctrl--><g class="cluster" data-entity="ctrl" data-source-line="6" data-uid="ent0003" id="cluster_ctrl"><rect fill="#F0FDF4" height="482.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="374" x="14" y="60.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="201.5508" x="100.2246" y="78.3921">Controllers &#8212; &#8220;are these mine?&#8221;</text></g><!--cluster pol--><g class="cluster" data-entity="pol" data-source-line="16" data-uid="ent0011" id="cluster_pol"><rect fill="#F8FAFC" height="390" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="420" x="936" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="296.1816" x="997.9092" y="71.8921">Policy and placement &#8212; &#8220;does this rule apply?&#8221;</text></g><!--entity pod--><g class="entity" data-entity="pod" data-source-line="4" data-uid="ent0002" id="entity_pod"><rect fill="#326CE5" height="108.4932" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="532.2383" x="396" y="228.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8545" x="410" y="254.8921">Pod web-77b4fdf86c-qrfpm</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="86.2007" x="410" y="267.9648">metadata.labels:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="358.1284" x="416.1123" y="280.6138">app: web &#183; tier: frontend &#183; env: prod &#183; pod-template-hash: 77b4fdf86c</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="410" y="295.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="504.2383" x="410" y="308.2114">The Pod does nothing with these. They are not configuration and the container never sees them.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="269.543" x="410" y="320.8604">They exist so that OTHER objects can find this one.</text></g><!--entity human--><g class="entity" data-entity="human" data-source-line="24" data-uid="ent0017" id="entity_human"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="379.1836" x="472.5" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.0635" x="486.5" y="112.8921">Humans &#8212; &#8220;show me a subset&#8221;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="351.1836" x="486.5" y="125.9648">kubectl get all --selector run=nginx &#183; kubectl get pods -l 'env in (prod,qa)'</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="321.6104" x="486.5" y="138.6138">kubectl logs -l app=web --prefix &#183; kubectl delete pods -l colour=red</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="349.728" x="486.5" y="151.2627">the same selector grammar the control plane uses, at the command line</text></g><!--entity svc--><g class="entity" data-entity="svc" data-source-line="7" data-uid="ent0004" id="entity_svc"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="317.7383" x="28" y="93.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.918" x="42" y="119.3921">Service &#183; spec.selector</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="281.3003" x="42" y="132.4648">app: web &#8594; this Pod's IP goes into the EndpointSlice,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="289.7383" x="42" y="145.1138">and kube-proxy sends traffic here. Equality-based only.</text></g><!--entity rs--><g class="entity" data-entity="rs" data-source-line="8" data-uid="ent0005" id="entity_rs"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="343.9814" x="25" y="248.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="244.2134" x="39" y="274.8921">ReplicaSet &#183; spec.selector.matchLabels</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="315.9814" x="39" y="287.9648">the Deployment adds pod-template-hash so two generations</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="277.0679" x="39" y="300.6138">never steal each other's Pods during a rolling update</text></g><!--entity other--><g class="entity" data-entity="other" data-source-line="9" data-uid="ent0006" id="entity_other"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="356.8721" x="22.5" y="373.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="185.6372" x="36.5" y="399.8921">DaemonSet &#183; StatefulSet &#183; Job</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="328.8721" x="36.5" y="412.9648">same mechanism: a selector that must match the pod template</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="160.7729" x="36.5" y="425.6138">and is immutable once created</text></g><!--entity pdb--><g class="entity" data-entity="pdb" data-source-line="10" data-uid="ent0007" id="entity_pdb"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="338.5298" x="31.5" y="478.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="228.9727" x="45.5" y="504.8921">PodDisruptionBudget &#183; spec.selector</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="310.5298" x="45.5" y="517.9648">which Pods this availability guarantee covers during drains</text></g><!--entity np--><g class="entity" data-entity="np" data-source-line="17" data-uid="ent0012" id="entity_np"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="369.709" x="978" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="313.1997" x="992" y="112.8921">NetworkPolicy &#183; podSelector + namespaceSelector</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="330.0752" x="992" y="125.9648">which Pods the rule protects, and which Pods may reach them.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="341.709" x="992" y="138.6138">A podSelector alone means THIS namespace &#8212; reaching another</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="220.7197" x="992" y="151.2627">one requires a namespaceSelector as well</text></g><!--entity sched--><g class="entity" data-entity="sched" data-source-line="18" data-uid="ent0013" id="entity_sched"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="374.645" x="972.5" y="248.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.7178" x="986.5" y="274.8921">Scheduler &#183; nodeSelector and node affinity</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="343.9326" x="986.5" y="287.9648">labels on NODES this time: disktype=ssd, topology.kubernetes.io/zone</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="346.645" x="986.5" y="300.6138">plus podAffinity/antiAffinity, which select PODS to sit near or away from</text></g><!--entity eps--><g class="entity" data-entity="eps" data-source-line="19" data-uid="ent0014" id="entity_eps"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="278.7388" x="1020.5" y="379.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7388" x="1034.5" y="405.8921">EndpointSlice &#183; kubernetes.io/service-name</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="247.0059" x="1034.5" y="418.9648">a label on the slice itself, tying it back to its Service</text></g><g class="link" data-entity-1="ctrl" data-entity-2="pod" data-uid="lnk18" id="link_ctrl_pod"><polygon fill="#475569" points="561.721,228.6195,555.6378,220.8738,557.3018,226.2804,551.8953,227.9444,561.721,228.6195" style="stroke:#475569;stroke-width:1;"/><path d="M388.091,136.7154 C388.3712,136.8637 388.6547,137.0137 388.9413,137.1655 C390.0879,137.7724 391.2854,138.4062 392.5316,139.0658 C397.5164,141.7043 403.2798,144.755 409.6763,148.1407 C422.4693,154.9121 437.7943,163.0239 454.4863,171.8591 C487.8704,189.5296 521.4193,207.2874 556.418,225.8126" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="532" y="202.9541">select</text></g><g class="link" data-entity-1="pol" data-entity-2="pod" data-uid="lnk19" id="link_pol_pod"><polygon fill="#475569" points="762.279,228.6195,772.1047,227.9444,766.6982,226.2804,768.3622,220.8738,762.279,228.6195" style="stroke:#475569;stroke-width:1;"/><path d="M935.909,136.7154 C935.6288,136.8637 935.3453,137.0137 935.0587,137.1655 C933.9121,137.7724 932.7146,138.4062 931.4684,139.0658 C926.4836,141.7043 920.7202,144.755 914.3237,148.1407 C901.5307,154.9121 886.2057,163.0239 869.5137,171.8591 C836.1296,189.5296 802.5807,207.2874 767.582,225.8126" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="848" y="202.9541">select</text></g><g class="link" data-entity-1="human" data-entity-2="pod" data-uid="lnk20" id="link_human_pod"><polygon fill="#475569" points="662,228.4153,666,219.4153,662,223.4153,658,219.4153,662,228.4153" style="stroke:#475569;stroke-width:1;"/><path d="M662,167.7283 C662,186.2049 662,202.4788 662,222.4153" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="668" y="202.9541">select</text></g><g class="caption" data-source-line="30"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1301.8564" x="22.5718" y="562.8301">This is the point of labels: they are not decoration and not configuration. Nearly every relationship in Kubernetes that is not direct ownership is expressed as one object's selector matching another object's labels.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1067.999" x="139.5005" y="578.9287">Change a Pod's labels and it silently leaves its Service, its ReplicaSet replaces it, and the NetworkPolicy protecting it may stop applying &#8212; all without touching the Pod itself.</text></g><!--SRC=[XLRDRYD54BxxAOgz18J7qKg8HLPYj6mYie2IQ1s90t1eJvTdclHqJ_h7pYnYbHCFW3Z2St3dKV8aLFNCEEEC4LAKn9wUwlg- -kgh-aYPN4U9C9iTjp_1MksFfHA54vK_lisDo4A95SxgMEb9K44ZV5zQK1uS2gbC0OsD3hHOeVRm-F07q7d8hGdEQgYrC3Y5olgWcyd4OHw4AIZ6YsihOOkhxDMhrMThkVxYypoxS-kw-j6SUFKUvozVBYeCGeeWPctm-SanFraCJW28kfvp7FZdRmWAtHpMZkv68_aRD9ivrCwc3xMLMS2AKWgObSANStYwV1Tx4Fs6W72Qqg87OqF9QBSgb0pHumpeG0F28Jzao6jLH2U2iWO49T0J8PH11mOtzDiZnM96PsCqAHpUAn_0Mpea0bpTN9o_0xlwcOZpa0i3QvKY4__MO1_a1PoSY3n74nOB49wXxf7zfYs7HjUMwF7XJquxmO2AqlloyU4l3b8u6-klhPLjd3mu3RzC00QnbkWsAaTcrDUOppngUcZT0CYkA8-__TxcIZGUUNXx3GLpgKomYPrp8sjBdvQQ8ax7Z32Bjt656TNmlY7oZ2Jsd5YlLGubEgh1-LqKMeKcMmcFaaZHpP2LOeV5R_9z8E-mfcl54iC8owmI8I-_Ix8RfCCfdz5Rjgc8QX1I-h6gKkss5WgagYSn-36mJWm1XGOKUGcaBdH7YIWFCZgMcW2k6VyNQ-e3F0ZB-NrKPm8hQpfGoq