<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="483px" preserveAspectRatio="none" style="width:1320px;height:483px;background:#FFFFFF;" version="1.1" viewBox="0 0 1320 483" width="1320px" zoomAndPan="magnify"><title>CronJob to Job to Pod &#8212; three objects, and what deleting one takes with it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="641.0479" x="335.7905" y="30.8838">CronJob to Job to Pod &#8212; three objects, and what deleting one takes with it</text></g><!--entity cj--><g class="entity" data-entity="cj" data-source-line="4" data-uid="ent0002" id="entity_cj"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="321.4121" x="210.0645" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.5063" x="224.0645" y="87.8921">CronJob &#183; backup</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="241.436" x="224.0645" y="100.9648">schedule: &#8220;*/5 * * * *&#8221; &#183; timeZone &#183; jobTemplate</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="284.2705" x="224.0645" y="113.6138">concurrencyPolicy: Allow | Forbid | Replace &#183; suspend</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="293.4121" x="224.0645" y="126.2627">successfulJobsHistoryLimit 3 &#183; failedJobsHistoryLimit 1</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="255.4653" x="224.0645" y="138.9116">answers WHEN and HOW OFTEN &#8212; nothing else</text></g><!--entity job--><g class="entity" data-entity="job" data-source-line="6" data-uid="ent0003" id="entity_job"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="377.0405" x="182.0645" y="223.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="142.3462" x="196.0645" y="249.3921">Job &#183; backup-29388420</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="315.396" x="196.0645" y="262.4648">one per scheduled time &#8212; a ONE-TIME execution of the task</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="349.0405" x="196.0645" y="275.1138">completions &#183; parallelism &#183; backoffLimit 6 &#183; activeDeadlineSeconds</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="301.3398" x="196.0645" y="287.7627">answers HOW MANY must succeed and how hard to retry</text></g><!--entity pod--><g class="entity" data-entity="pod" data-source-line="8" data-uid="ent0004" id="entity_pod"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="317.1421" x="212.0645" y="371.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7915" x="226.0645" y="397.8921">Pod &#183; backup-29388420-x7k2p</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="289.1421" x="226.0645" y="410.9648">restartPolicy MUST be Never or OnFailure &#8212; never Always</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="206.6904" x="226.0645" y="423.6138">runs on a node and actually does the work</text></g><!--entity hist--><g class="entity" data-entity="hist" data-source-line="10" data-uid="ent0005" id="entity_hist"><rect fill="#F1F5F9" height="93.5444" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="338.938" x="577.0645" y="216.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0635" x="591.0645" y="242.8921">History, not garbage</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="306.3511" x="591.0645" y="255.9648">finished Jobs and their Pods are KEPT on purpose, so you can</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="190.1689" x="591.0645" y="268.6138">read the logs and the status afterwards</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="310.938" x="591.0645" y="281.2627">the CronJob prunes to 3 successful + 1 failed; a bare Job keeps</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="286.1558" x="591.0645" y="293.9116">everything until you delete it or set ttlSecondsAfterFinished</text></g><!--entity del--><g class="entity" data-entity="del" data-source-line="12" data-uid="ent0006" id="entity_del"><rect fill="#FEE2E2" height="93.5444" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="588.479" x="549.5645" y="61.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="218.8926" x="563.5645" y="87.8921">Deletion cascades DOWN the chain</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="464.5728" x="563.5645" y="100.9648">each object carries an ownerReference to the one above, so garbage collection follows it</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="262.1899" x="563.5645" y="113.6138">delete the CronJob &#8594; its Jobs go &#8594; their Pods go</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="560.479" x="563.5645" y="126.2627">delete a Job &#8594; its Pods go (&#8220;when you delete the job using kubectl, all the pods it created are deleted too&#8221;)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="500.0381" x="563.5645" y="138.9116">the same rule as deleting a namespace, or a Deployment taking its ReplicaSets and Pods with it</text></g><g class="link" data-entity-1="cj" data-entity-2="job" data-uid="lnk7" id="link_cj_job"><polygon fill="#475569" points="370.5645,222.9976,374.5645,213.9976,370.5645,217.9976,366.5645,213.9976,370.5645,222.9976" style="stroke:#475569;stroke-width:1;"/><path d="M370.5645,156.0185 C370.5645,177.391 370.5645,196.5064 370.5645,216.9976" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.4297" x="376.5645" y="190.9541">at each scheduled time, creates</text></g><g class="link" data-entity-1="job" data-entity-2="pod" data-uid="lnk8" id="link_job_pod"><polygon fill="#475569" points="370.5645,371.4814,374.5645,362.4814,370.5645,366.4814,366.5645,362.4814,370.5645,371.4814" style="stroke:#475569;stroke-width:1;"/><path d="M370.5645,304.4421 C370.5645,325.6222 370.5645,345.3785 370.5645,365.4814" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="107.3848" x="376.5645" y="345.9541">creates one or more</text></g><g class="link" data-entity-1="job" data-entity-2="hist" data-uid="lnk9" id="link_job_hist"><polygon fill="#475569" points="576.855,263.6982,567.855,259.6982,571.855,263.6982,567.855,267.6982,576.855,263.6982" style="stroke:#475569;stroke-width:1;"/><path d="M559.2988,263.6982 C565.1509,263.6982 565.0029,263.6982 570.855,263.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="cj" data-entity-2="del" data-uid="lnk10" id="link_cj_del"><polygon fill="#475569" points="549.3017,108.6982,540.3017,104.6982,544.3017,108.6982,540.3017,112.6982,549.3017,108.6982" style="stroke:#475569;stroke-width:1;"/><path d="M531.3105,108.6982 C537.3076,108.6982 537.3047,108.6982 543.3017,108.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1302.6289" x="5" y="451.8301">Three objects means three places to look when something is wrong: kubectl get cronjob for LAST SCHEDULE, kubectl get jobs for COMPLETIONS, and kubectl logs job/NAME for what the code actually printed.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="985.9951" x="163.3169" y="467.9287">A CronJob creates a Job approximately once per scheduled time &#8212; two Jobs, or none, are both possible &#8212; so the work a CronJob does should be idempotent.</text></g><!--SRC=[TLRDRkD63BxxATWzjLidRhBzsQQ60IDnaDqcTh3n8cZHoqYYfOb7Gs5c5CT53tlg0nGzji_HUnybJr9o9AKouY01OicS8Vbz7p_cCsrJKsS8XuUZvZSG6J_AjCgTAlredLfr40eiyR2gIpC8EXY4KqVsFIKG2De_rvJ1uwS_8HGE4IYvmpJu8IYRmQPG0J8q6BJDWIn2K6lqiD6X01q60yUnokPyxwlkud__WKIbwxhwnOwz_XLFZeucFYqmgmsUSAA_Ne- -WTVDp-EdloK-w19_bjlvynqbIomhemAEHt9-qhid9PlMpg5DjzTaTBezWQanj87Vu9nSeZF-y07vS1hlyhMlq6RFx_5rcgBtgzfmnVv2-