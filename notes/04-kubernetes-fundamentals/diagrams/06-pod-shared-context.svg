<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="597px" preserveAspectRatio="none" style="width:1091px;height:597px;background:#FFFFFF;" version="1.1" viewBox="0 0 1091 597" width="1091px" zoomAndPan="magnify"><title>A Pod is a shared context, not a container</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="359.0771" x="362.4585" y="30.8838">A Pod is a shared context, not a container</text></g><!--cluster node--><g class="cluster" data-entity="node" data-source-line="4" data-uid="ent0002" id="cluster_node"><rect fill="#F8FAFC" height="492" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="555" x="275.9971" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="90.3018" x="508.3462" y="71.8921">Node worker-2</text></g><!--cluster pod--><g class="cluster" data-entity="pod" data-source-line="5" data-uid="ent0003" id="cluster_pod"><rect fill="#F0FDF4" height="451" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="539" x="283.9971" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="266.5698" x="420.2122" y="104.8921">Pod mypod &#183; one cluster-wide IP &#183; 10.42.2.7</text></g><!--entity web--><g class="entity" data-entity="web" data-source-line="6" data-uid="ent0004" id="entity_web"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="172.2515" x="291.9971" y="119.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="130.7744" x="305.9971" y="145.8921">container: webserver</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="144.2515" x="305.9971" y="158.9648">image nginx &#183; listens on :80</text></g><!--entity side--><g class="entity" data-entity="side" data-source-line="7" data-uid="ent0005" id="entity_side"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="274.3291" x="540.9971" y="119.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.9854" x="554.9971" y="145.8921">container: sidecar</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.3291" x="554.9971" y="158.9648">image ubuntu &#183; curl localhost:80 reaches nginx</text></g><!--entity shared--><g class="entity" data-entity="shared" data-source-line="9" data-uid="ent0006" id="entity_shared"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="508.4121" x="298.9971" y="212.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="239.8335" x="312.9971" y="238.8921">SHARED by every container in the Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="393.0405" x="312.9971" y="251.9648">network namespace &#8212; one IP, one port space, and localhost between them</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="270.832" x="312.9971" y="264.6138">IPC namespace &#8212; shared memory and semaphores</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="437.0513" x="312.9971" y="277.2627">volumes declared in the Pod spec, mounted into whichever containers ask for them</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="480.4121" x="312.9971" y="289.9116">lifecycle &#8212; co-located and co-scheduled on one node; scheduled together, deleted together</text></g><!--entity notshared--><g class="entity" data-entity="notshared" data-source-line="11" data-uid="ent0007" id="entity_notshared"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="464.2402" x="320.9971" y="343.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.8018" x="334.9971" y="369.8921">NOT shared</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="436.2402" x="334.9971" y="382.9648">each container keeps its own image, filesystem and process tree (mnt + pid namespaces)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="353.4448" x="334.9971" y="395.6138">so two containers in one Pod cannot both bind :80 &#8212; it is one port space</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="337.5088" x="334.9971" y="408.2627">a crashed container is restarted on its own; the Pod and its IP survive</text></g><!--entity pause--><g class="entity" data-entity="pause" data-source-line="13" data-uid="ent0008" id="entity_pause"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="364.311" x="370.9971" y="461.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="35.4199" x="384.9971" y="487.8921">pause</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="317.9312" x="384.9971" y="500.9648">the tiny infrastructure container the kubelet starts first: it holds the</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="336.311" x="384.9971" y="513.6138">namespaces open so app containers can restart without losing the IP</text></g><g class="link" data-entity-1="web" data-entity-2="side" data-uid="lnk9" id="link_web_side"><polygon fill="#475569" points="540.7977,147.6982,531.7977,143.6982,535.7977,147.6982,531.7977,151.6982,540.7977,147.6982" style="stroke:#475569;stroke-width:1;"/><path d="M464.367,147.6982 C488.2545,147.6982 508.7847,147.6982 534.7977,147.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="47.3613" x="478.9971" y="136.9541">localhost</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1073.9941" x="5" y="565.8301">A container is not a Kubernetes object. The smallest thing you can create, schedule, name and delete is the Pod, and everything inside it lives on one node with one address.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1038.1602" x="22.917" y="581.9287">Most Pods hold exactly one container; a second one belongs there only when it must share that address and those volumes &#8212; a log shipper, a proxy, a config reloader.</text></g><!--SRC=[VLNRZYCr47tFLnJx12ANdH4IQ2QAD0848yGImRu13uwxqctYjbksUp9Pj18ViV-oxtmANy8fEqdtJ3GhZJ9gkowdJfqgVsQSjdt5D9ylob_otiP5PLGTL1iNE-tKB3NSyhphMpj99bccErhxYamaHR5HWIlItYL-J5DoFk5KFfLn72QJm3efLyFhrHkFJ7iVTXncrwzekQo3xxlLYbI47-x-dX2Dx2L9U-Zm- -z7yeu9M6E2yzx0-7ujnrUlvrzTpw_dNv_Z_U1zLMAAfuHy4lGCxORsl8aS7ZZyuPRHlEERgwkLQLNDv6hZ7YMyDKZe8hBJpJUlbminMqagfJM