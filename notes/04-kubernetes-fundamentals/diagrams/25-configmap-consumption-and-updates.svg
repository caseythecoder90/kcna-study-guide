<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="537px" preserveAspectRatio="none" style="width:1303px;height:537px;background:#FFFFFF;" version="1.1" viewBox="0 0 1303 537" width="1303px" zoomAndPan="magnify"><title>Four ways a Pod reads a ConfigMap &#8212; and which ones notice a change</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="613.1162" x="341.2251" y="30.8838">Four ways a Pod reads a ConfigMap &#8212; and which ones notice a change</text></g><!--cluster envs--><g class="cluster" data-entity="envs" data-source-line="6" data-uid="ent0003" id="cluster_envs"><rect fill="#FEF2F2" height="349.5" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="518" x="182.2832" y="136.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="273.0889" x="304.7388" y="154.3921">Environment variables &#8212; need a Pod restart</text></g><!--cluster vols--><g class="cluster" data-entity="vols" data-source-line="14" data-uid="ent0009" id="cluster_vols"><rect fill="#F0FDF4" height="356" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="428" x="708.2832" y="129.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8735" x="838.8464" y="147.8921">Files on disk &#8212; update live</text></g><!--entity cm--><g class="entity" data-entity="cm" data-source-line="4" data-uid="ent0002" id="entity_cm"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="314.0376" x="304.2832" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="105.4346" x="318.2832" y="79.8921">ConfigMap demo</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286.0376" x="318.2832" y="92.9648">colour: blue &#183; size: large &#183; app.properties: (a whole file)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="241.4199" x="318.2832" y="105.6138">must be in the SAME NAMESPACE as the Pod</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="7" data-uid="ent0004" id="entity_e1"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="467.4683" x="224.7832" y="169.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.7881" x="238.7832" y="195.3921">1 &#183; env + configMapKeyRef</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="321.1216" x="238.7832" y="208.4648">ONE key &#8594; one variable, and you choose the variable's name</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="439.4683" x="238.7832" y="221.1138">env: [{name: COLOUR, valueFrom: {configMapKeyRef: {name: demo, key: colour}}}]</text></g><!--entity e2--><g class="entity" data-entity="e2" data-source-line="8" data-uid="ent0005" id="entity_e2"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="372.8027" x="271.7832" y="279.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.4399" x="285.7832" y="305.8921">2 &#183; envFrom + configMapRef</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.2144" x="285.7832" y="318.9648">ALL keys &#8594; variables named after the keys</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.853" x="285.7832" y="331.6138">envFrom: [{configMapRef: {name: demo}}]</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="344.8027" x="285.7832" y="344.2627">keys that are not valid variable names are SKIPPED, with an event</text></g><!--entity enote--><g class="entity" data-entity="enote" data-source-line="9" data-uid="ent0006" id="entity_enote"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="349.6265" x="283.2832" y="396.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.4033" x="297.2832" y="422.8921">Values are injected ONCE, at container start.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="300.8457" x="297.2832" y="435.9648">Edit the ConfigMap and the running container never sees it &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="321.6265" x="297.2832" y="448.6138">&#8220;ConfigMaps consumed as environment variables are not updated</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="194.4336" x="297.2832" y="461.2627">automatically and require a pod restart.&#8221;</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="15" data-uid="ent0010" id="entity_v1"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="352.543" x="750.7832" y="162.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.6182" x="764.7832" y="188.8921">3 &#183; volume mount</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="254.8853" x="764.7832" y="201.9648">EACH KEY becomes a file in the mount directory</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="324.543" x="764.7832" y="214.6138">/etc/config/colour &#183; /etc/config/size &#183; /etc/config/app.properties</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="312.3667" x="764.7832" y="227.2627">items: lets you project only some keys, under chosen paths</text></g><!--entity v2--><g class="entity" data-entity="v2" data-source-line="16" data-uid="ent0011" id="entity_v2"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="356.4209" x="746.2832" y="286.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.1182" x="760.2832" y="312.3921">4 &#183; volume mount with subPath</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="328.4209" x="760.2832" y="325.4648">ONE key mounted as a single file, next to the image's own files</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="282.3691" x="760.2832" y="338.1138">the only way to drop one file into an existing directory</text></g><!--entity vnote--><g class="entity" data-entity="vnote" data-source-line="17" data-uid="ent0012" id="entity_vnote"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="411.6968" x="716.2832" y="396.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="383.6968" x="730.2832" y="422.8921">A plain volume mount IS refreshed: the kubelet re-checks on every</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="338.1426" x="730.2832" y="435.9648">periodic sync, so the delay is the sync period plus cache propagation.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="336.2896" x="730.2832" y="448.6138">BUT a subPath mount NEVER updates &#8212; that is the trade for putting</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="232.9604" x="730.2832" y="461.2627">one file into a directory the image already owns.</text></g><g class="link" data-entity-1="cm" data-entity-2="envs" data-uid="lnk15" id="link_cm_envs"><polygon fill="#475569" points="209.771,136.023,218.2599,131.0293,212.6795,131.956,211.7527,126.3756,209.771,136.023" style="stroke:#475569;stroke-width:1;"/><path d="M304.0287,101.1038 C264.7063,107.2051 229.6204,116.2663 215.2832,129.6982 C214.2218,130.6926 213.2209,131.7396 212.2771,132.8327 C211.8053,133.3792 211.3477,133.9373 210.904,134.506 C210.6822,134.7904 210.4638,135.0774 210.2488,135.3671 C210.1414,135.5119 210.0347,135.6573 209.929,135.8034 C209.8761,135.8764 213.3137,131.0693 213.2612,131.1426" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="cm" data-entity-2="vols" data-uid="lnk16" id="link_cm_vols"><polygon fill="#475569" points="708.1093,133.6275,705.2779,124.1944,704.8508,129.8351,699.2101,129.408,708.1093,133.6275" style="stroke:#475569;stroke-width:1;"/><path d="M618.5533,101.9892 C656.476,108.0969 690.1519,116.9397 704.2832,129.6982 C705.3735,130.6826 706.4066,131.7205 707.3854,132.8052 C707.6301,133.0764 703.9612,128.7997 704.1991,129.0766" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1285.5664" x="5" y="505.8301">Even a live-updating file only helps if the application re-reads it &#8212; most do not, which is why kubectl rollout restart deployment/x exists. The blunt rule: if the value can change, mount it as a volume and reload;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="982.0371" x="156.7646" y="521.9287">if it is fixed for the life of the Pod, an environment variable is simpler. A missing ConfigMap stops the Pod starting unless the reference is marked optional: true.</text></g><!--SRC=[RLRDRkCs4BxdAQPxQOlQCfBsv1e6lAdIBf9DWcHtWIBT0osDBJOKgPAK4ZK8a5CVeEYnVOxU-oXvaiwGiYt_08PXayEP-RwPRyWlfCvKdICaoIX-l37AZN8fbbQKRdIVQJ7q1PQOL7MfZhpq2k7Cr1OUHEj0mBN9mQB8-VUfqGkvV2ygU7tv2uJEuQ6GMG56emDjlCoGhB92w2KU7LdCFFqYVsys1tCipIzwukJlE3u-dcP6KQmnp5MDyD-_4DP12RiCVqLL9PKr5LelqOtXAq4H3NbSI8LVJqPiFksvAsldOOuWDH0ek9szJ-6IlcwlPwSf21TM2L5tyWrC9YBBKFlfb7UpSYlhL3VI6btIFZJ2IZ5NX9EXQyHypOtpmdfsjRIchjwAF3f3tJXuEWBeUJncKBG1tq2sekGSsnjSz41SNQPmZosy_l4dCxiEFGYCjwOcXern6C2iDh-a0eWIzocXQ6EuU-BDCPnUNLnzl1dGAUBxp9fo34yxYT1AjELA3JYHCSGgFJy_V-uHDry3FTu6UTA1PFzzeDiePnSNxDm5c1jsEJPHk_1e0pusEGWgPd_tr7U_bVicszx14D4NmeEmo2tBLCXydK28xyBcxVcxw-lqXm4yI5yGzO0DDS910aws2VZ4x4OdKlzAwuJewl8qfG9wfiCBgGbUw9kabroQInz0R-J25USLMsijzR9tMbCwv0Cf49sYfjm7-_hozzgJuwEk3kI6tZpGsIjAwYeNbFE-Gr5xKmgIkL2g3RbP_AsMbbLVRRIGlBxyq-EfKfJnIXF68v65np2yAsIUe_wScmSzd4OIyMH_FHnvtXBccUHqZOPSkliWo9WoADdWMea_6jCLgA6Pjol5RxbBQOCeWTBKslSBCJlz2SxJdscKP2RqGnWugx4Ip2asUpEstUTfX3uRnSOSHUrmiFugM-wkRG-xVQ_IOqapKA5tOGgGBJSNyK35S9Hd4Ci0QfrJPz2CSAYX4hvmlM8iDwJioFQxNK9YuxjwVaq-3iodO1JxIT3W3bwOfW7rvYCriWbaoL8iUJfHDSFk0M1i5a3GbSF7SY8XJBwET5fY-JrAvra3kyHlQR7PqU8CGljj0tjtIoOBwjO2yt4