<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="459px" preserveAspectRatio="none" style="width:1230px;height:459px;background:#FFFFFF;" version="1.1" viewBox="0 0 1230 459" width="1230px" zoomAndPan="magnify"><title>Annotations are how you talk to a controller the API never heard of</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="572.0889" x="325.1392" y="30.8838">Annotations are how you talk to a controller the API never heard of</text></g><!--entity why--><g class="entity" data-entity="why" data-source-line="4" data-uid="ent0002" id="entity_why"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="594.6396" x="254.6836" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.2026" x="268.6836" y="87.8921">The problem they solve</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="558.7065" x="268.6836" y="100.9648">An Ingress object has a fixed spec: rules, hosts, paths, a TLS secret name. That is all the API knows about.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="566.6396" x="268.6836" y="113.6138">But an ingress controller may support rewrites, rate limits, timeouts, auth, canary weights, session affinity&#8230;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="527.6777" x="268.6836" y="126.2627">None of that can go in the spec &#8212; adding a field for every controller's every feature would never end.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="564.7974" x="268.6836" y="138.9116">So the extras go in ANNOTATIONS: a free-form channel the API server stores faithfully and never interprets.</text></g><!--entity ing--><g class="entity" data-entity="ing" data-source-line="6" data-uid="ent0003" id="entity_ing"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="301.813" x="83.1836" y="191.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8081" x="97.1836" y="217.8921">Ingress controller</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="229.2222" x="97.1836" y="230.9648">nginx.ingress.kubernetes.io/rewrite-target: /</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.9575" x="97.1836" y="243.6138">nginx.ingress.kubernetes.io/ssl-redirect: &#8220;true&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="253.0698" x="97.1836" y="256.2627">nginx.ingress.kubernetes.io/canary-weight: &#8220;20&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="273.813" x="97.1836" y="268.9116">tweaks routing WITHOUT changing the Ingress spec</text></g><!--entity cm--><g class="entity" data-entity="cm" data-source-line="8" data-uid="ent0004" id="entity_cm"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="296.9575" x="403.6836" y="198.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="82.3672" x="417.6836" y="224.3921">cert-manager</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="251.2383" x="417.6836" y="237.4648">cert-manager.io/cluster-issuer: letsencrypt-prod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="265.2729" x="417.6836" y="250.1138">put this on an Ingress and a certificate is obtained,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="268.9575" x="417.6836" y="262.7627">renewed, and written into a kubernetes.io/tls Secret</text></g><!--entity dns--><g class="entity" data-entity="dns" data-source-line="10" data-uid="ent0005" id="entity_dns"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="353.8159" x="724.1836" y="204.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="77.3018" x="738.1836" y="230.8921">external-dns</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="325.8159" x="738.1836" y="243.9648">external-dns.alpha.kubernetes.io/hostname: app.example.com</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="245.7275" x="738.1836" y="256.6138">a DNS record appears in Route53 or Cloudflare</text></g><!--entity mesh--><g class="entity" data-entity="mesh" data-source-line="12" data-uid="ent0006" id="entity_mesh"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="274.9575" x="96.6836" y="328.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.8335" x="110.6836" y="354.3921">Service mesh</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="147.313" x="110.6836" y="367.4648">sidecar.istio.io/inject: &#8220;true&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.9575" x="110.6836" y="380.1138">an admission webhook adds the Envoy sidecar</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="233.6909" x="110.6836" y="392.7627">at Pod creation &#8212; chapter 02-02's data plane</text></g><!--entity prom--><g class="entity" data-entity="prom" data-source-line="14" data-uid="ent0007" id="entity_prom"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="223.6313" x="434.1836" y="328.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75.1309" x="448.1836" y="354.3921">Prometheus</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.813" x="448.1836" y="367.4648">prometheus.io/scrape: &#8220;true&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="142.4146" x="448.1836" y="380.1138">prometheus.io/port: &#8220;9090&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="195.6313" x="448.1836" y="392.7627">the scraper discovers the target itself</text></g><!--entity core--><g class="entity" data-entity="core" data-source-line="16" data-uid="ent0008" id="entity_core"><rect fill="#F1F5F9" height="93.5444" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="470.0679" x="676.1836" y="321.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.8335" x="690.1836" y="347.8921">Kubernetes itself</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="363.1665" x="690.1836" y="360.9648">kubernetes.io/change-cause &#8212; the CHANGE-CAUSE column (chapter 05)</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="361.3618" x="690.1836" y="373.6138">deployment.kubernetes.io/revision &#8212; the revision number on a ReplicaSet</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="442.0679" x="690.1836" y="386.2627">kubectl.kubernetes.io/last-applied-configuration &#8212; how apply computes a three-way merge</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="391.3003" x="690.1836" y="398.9116">kubectl.kubernetes.io/restartedAt &#8212; what rollout restart stamps into the template</text></g><g class="link" data-entity-1="why" data-entity-2="ing" data-uid="lnk9" id="link_why_ing"><polygon fill="#475569" points="348.5931,191.6466,358.4358,191.9967,353.2315,189.7796,355.4485,184.5753,348.5931,191.6466" style="stroke:#475569;stroke-width:1;"/><path d="M437.8276,155.7283 C408.8035,167.411 383.1858,177.7225 354.1591,189.4062" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="why" data-entity-2="cm" data-uid="lnk10" id="link_why_cm"><polygon fill="#475569" points="552.1836,197.8999,556.1836,188.8999,552.1836,192.8999,548.1836,188.8999,552.1836,197.8999" style="stroke:#475569;stroke-width:1;"/><path d="M552.1836,155.9092 C552.1836,169.6582 552.1836,178.597 552.1836,191.8999" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="why" data-entity-2="dns" data-uid="lnk11" id="link_why_dns"><polygon fill="#475569" points="810.9542,204.6055,803.8819,197.7511,806.26,202.8839,801.1273,205.2619,810.9542,204.6055" style="stroke:#475569;stroke-width:1;"/><path d="M677.6875,155.7283 C721.7547,171.8905 764.7252,187.6504 805.3211,202.5395" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1212.3672" x="5" y="427.8301">The pattern every one of these follows: you annotate an object, a controller that is WATCHING for its own prefix sees it, and acts. The API server stores the string and has no idea what it means &#8212;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="776.624" x="222.8716" y="443.9287">which is why a typo in an annotation key fails silently. Nothing validates it, nothing rejects it, the feature simply never turns on.</text></g><!--SRC=[bLR1RXit4BtxAwQvj0MyafCYXmY60DKD4gE574GAScXxeBaZBICkkI2vNgkdV4IFxRKVbY_f6wwih2mrRG43XhZap9jvCs_cA-EqRKkcqMZS_oNlRHoNHgs3gkDuevqgKiKrZvgsjcV99CiqSyudbOntaLHWgdn7MzzIKdP3oPCYxLqAtbeEXDSqUtDDZk_mgs8LIlAhixF0EYctXhadIrnfWh-rNClrBKLlx_WNTndDRpnv-dGwStJjre5Z97_x0G-fKd1DAtFF9SM6zOH2QpcU0qjC-DUeLE6VekLF2ugi0oTo2c7GibA935vRkyUsSRx3oQrlq-XoB5wd0-_VjucK8xD3C8YjLi3QDeqFYG9tmII145HYigOs0YIPcc5MiBIfEYUjd0fRwjYiApcDC8b4abgjZ3Df- -dZNyS8vjunaWQym0uBjFQ0a-5ByFJfu- -aoX88SrBObhJoWIJZsm7Uh-FkQCKgjI2kyoskziomAq_4ll3P2z-dW8ptRcVp-Srojho-cIycuYym5t1NawwKS_mvhP63M8x98t6qKYPLgzRQBRBvuDMunA41E_71-HEwl5HQiqlJAS5dLsqFYkNwY8O1NBSsxdwqOsgqQMyvE0Of8-F7EuAAfCAQquJ6nz5-wNcCjWXS6e4oGSR_IA7bJn___7zMUlgBdlvivjd5IIEfOxM9550xGklxw-NhctVBdEAr74YE7r8XDJ38tjhxiiyTBXxaJdD8HGq8wuEi3OypIDj6q5AO65iE4xAWXvqEsoOLwDFo66s35aaLkaeg-NEp2iyG0vWtAwEbBUJARLB6SNb-R2QmumvVyaDXAx7qNPQKmpmc6scHs_fauBe-Y1lbYxVA5gMB0tV3uv6