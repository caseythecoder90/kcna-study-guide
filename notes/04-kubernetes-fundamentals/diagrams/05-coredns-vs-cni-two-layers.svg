<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="486px" preserveAspectRatio="none" style="width:1407px;height:486px;background:#FFFFFF;" version="1.1" viewBox="0 0 1407 486" width="1407px" zoomAndPan="magnify"><title>"How do I find you?" and "How do I reach you?" &#8212; two layers of one problem</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="664.1719" x="367.4624" y="30.8838">"How do I find you?" and "How do I reach you?" &#8212; two layers of one problem</text></g><!--cluster find--><g class="cluster" data-entity="find" data-source-line="6" data-uid="ent0003" id="cluster_find"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="757" x="270.0483" y="160.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.1963" x="569.4502" y="178.8921">Layer 1 &#183; find &#8212; CoreDNS</text></g><!--cluster reach--><g class="cluster" data-entity="reach" data-source-line="12" data-uid="ent0007" id="cluster_reach"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="1000" x="211.0483" y="325.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="295.1406" x="563.478" y="343.8921">Layer 2 &#183; reach &#8212; CNI + Service implementation</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="4" data-uid="ent0002" id="entity_api"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="167.9814" x="743.0483" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.1226" x="757.0483" y="79.8921">Pod api (node 1)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="139.9814" x="757.0483" y="92.9648">calls http://my-service/orders</text></g><!--entity resolv--><g class="entity" data-entity="resolv" data-source-line="7" data-uid="ent0004" id="entity_resolv"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="315.9121" x="669.0483" y="193.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.5825" x="683.0483" y="219.8921">/etc/resolv.conf in the Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="226.8428" x="683.0483" y="232.9648">nameserver 10.96.0.10 (the kube-dns Service)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="244.5352" x="683.0483" y="245.6138">search default.svc.cluster.local svc.cluster.local &#8230;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="287.9121" x="683.0483" y="258.2627">&#8594; my-service becomes my-service.default.svc.cluster.local</text></g><!--entity dns--><g class="entity" data-entity="dns" data-source-line="8" data-uid="ent0005" id="entity_dns"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="302.5488" x="278.5483" y="200.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.46" x="292.5483" y="226.3921">CoreDNS Pods</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="242.6553" x="292.5483" y="239.4648">Deployment in kube-system; watch the API for</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="274.5488" x="292.5483" y="252.1138">Services; answer: my-service &#8594; ClusterIP 10.96.45.3</text></g><!--entity kp--><g class="entity" data-entity="kp" data-source-line="13" data-uid="ent0008" id="entity_kp"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="278.0298" x="219.0483" y="358.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="175.519" x="233.0483" y="384.8921">kube-proxy (or Cilium eBPF)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="250.0298" x="233.0483" y="397.9648">ClusterIP 10.96.45.3 is virtual: rules on the node</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="208.4575" x="233.0483" y="410.6138">rewrite it to one backing Pod, 10.244.2.7</text></g><!--entity cni--><g class="entity" data-entity="cni" data-source-line="14" data-uid="ent0009" id="entity_cni"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="309.1445" x="634.5483" y="358.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129.2827" x="648.5483" y="384.8921">CNI plugin dataplane</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="229.2598" x="648.5483" y="397.9648">node 1 knows 10.244.2.0/24 lives on node 2:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="281.1445" x="648.5483" y="410.6138">routed (Calico BGP) or encapsulated (Flannel VXLAN)</text></g><!--entity orders--><g class="entity" data-entity="orders" data-source-line="15" data-uid="ent0010" id="entity_orders"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="206.5083" x="961.5483" y="358.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="122.7891" x="975.5483" y="384.8921">Pod orders (node 2)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="178.5083" x="975.5483" y="397.9648">eth0 10.244.2.7 &#8212; the veth the CNI</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="147.2915" x="975.5483" y="410.6138">plugin wired at Pod creation</text></g><g class="link" data-entity-1="resolv" data-entity-2="dns" data-uid="lnk6" id="link_resolv_dns"><polygon fill="#475569" points="581.5529,234.1982,590.5529,238.1982,586.5529,234.1982,590.5529,230.1982,581.5529,234.1982" style="stroke:#475569;stroke-width:1;"/><path d="M668.8731,234.1982 C640.0938,234.1982 616.1338,234.1982 587.5529,234.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="58.6875" x="596.2983" y="223.4541">DNS query</text></g><g class="link" data-entity-1="kp" data-entity-2="cni" data-uid="lnk11" id="link_kp_cni"><polygon fill="#475569" points="634.3214,392.6982,625.3214,388.6982,629.3214,392.6982,625.3214,396.6982,634.3214,392.6982" style="stroke:#475569;stroke-width:1;"/><path d="M497.0891,392.6982 C540.8796,392.6982 583.5096,392.6982 628.3214,392.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.75" x="511.7983" y="381.9541">packet to 10.244.2.7</text></g><g class="link" data-entity-1="cni" data-entity-2="orders" data-uid="lnk12" id="link_cni_orders"><polygon fill="#475569" points="961.2893,392.6982,952.2893,388.6982,956.2893,392.6982,952.2893,396.6982,961.2893,392.6982" style="stroke:#475569;stroke-width:1;"/><path d="M943.7593,392.6982 C949.6026,392.6982 949.446,392.6982 955.2893,392.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="api" data-entity-2="resolv" data-uid="lnk13" id="link_api_resolv"><polygon fill="#475569" points="827.0483,193.6838,831.0483,184.6838,827.0483,188.6838,823.0483,184.6838,827.0483,193.6838" style="stroke:#475569;stroke-width:1;"/><path d="M827.0483,109.9527 C827.0483,133.3318 827.0483,161.319 827.0483,187.6838" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="54.0293" x="833.0483" y="144.9541">1 &#183; name?</text></g><g class="link" data-entity-1="dns" data-entity-2="kp" data-uid="lnk14" id="link_dns_kp"><polygon fill="#475569" points="373.2957,358.5565,380.6911,352.0521,375.3854,354.0141,373.4234,348.7084,373.2957,358.5565" style="stroke:#475569;stroke-width:1;"/><path d="M414.779,268.3879 C402.5603,294.9464 388.0162,326.5597 375.8034,353.1056" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.7734" x="409.0483" y="309.9541">2 &#183; IP in hand &#8212; send the packet</text></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1135.6406" x="131.728" y="454.8301">CoreDNS answers with an address and steps aside; every packet after that is CNI and kube-proxy's job. Neither substitutes for the other &#8212; a cluster with a broken CNI resolves names</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1389.0967" x="5" y="470.9287">fine and delivers nothing; one with a broken CoreDNS delivers packets fine to anyone who already knows an IP. On one node, a Linux bridge alone would carry Pod-to-Pod traffic; CNI is what makes many nodes one network.</text></g><!--SRC=[TLL1ZXit4Bph5PszP1UnPYHbuo2I8CDUmyu2Yuq00uQ190Tgs98OSSW9oP4y2GBub0S4UKE-a7kUiYznDpcIPbSAe0Cn9AkhgekjBvGfT2qHiYnFls2jzhbKOkL4wVDDOKG_hB74hAfBtGigQ8IBx-qEf8LRM2eZeR7rYmiGj3fkE1J5kjrv-FGtX9q5BHfq7kmIh46ed5reB7izXqKGPiMuSoj1L0ekZILImwkVpDIhtt0y7CuAeRM7TGZLEC_Bfk_HRLM1kNMIGASvdvjTm7HQQQ7CR0R2CzGZ-3ic04Fuxzz4d8dTM8Ulxz_npPMpTPLknktVUm2Tspc68dVehTvcXJLBK0R86Y3I7Pv6bCZSkD0W- -vvDiY60xZaWvjwWNrfFBnBtAzQrftR7eKZtoGkHQr3vhT5HWto0LscBLa0fryUFlrpYlFmvrzmD0aMM5YYrVcK_M-9yrOctOyDQQrZ0todzckij6rAD84TYg9zG_Zb17OYa3hsukMSmcFTAVFM6p-XGFaTkd5N1ykwIMHlvws_rzzaNtSuYwAWoeaqUHqPCtNeExLQX_wCly8OcFYlDRgczyUPZ8mu8od3CIJtj_3LlcsWoeg2IrL4KDOSalFMMhatYoy-YKyqWaB_iO5Bw-16QLMNWA_cRxenFwSEb8UjSg4MUWokrjH8cwB7p-JKGeSxfmBn311iV6iBKMoKMN6ddZ7mwFew6sNVTcnR7SXlgYTT9ksLhbVKIoc2e4mOxEOzlbJO6BlpH-X1Fhe6hRQ9QZmp6fzXQkk04YvlX5Q5XLTlvrT0tg0fHELhBUBc6wfeKCFx3tSlxw_ESYwCUaoQ1qcQ3Eqi6NLDnh0UT6n80uhitD96N93cKxAj2JlbY9K8R2OKr6eEmLbMYG0HsrJ7z15LIbz53S7OdYCDEiYRXvFjTOedZyI-j3j3NziqZzCOusdpeiU9tkzJhN6ABsM8wAv5E-WyqeB5fTgzEEBwFwwLb6X-Fg1JSdizifzLmLJDzeyylKPFyiaZOK18ILHy7FkKs8fMNacS0DBeQ_O2nPB2J5N9BWenHudF7v_2bnv-iOiCxf5WwQIl5vx-OoWLdiT3v6lZ3aiGq4wgbWKidDsWYRZ95xeM1_0qLzmwDIEL66jAv3YI04Duz1OcyM4ymMcr7iuc5V7l0BbPmZJnrfgMchoIJHjyCkHsdi4F9g9oufuHx9qozKS2Lt9597IyQcjDiH6EFA80zOFjSuw24ykbAYPH2ZcrOyTAiU6PJKKZea_OI7-bRfEnmiy0]--></g></svg>