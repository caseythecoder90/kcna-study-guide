<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="734px" preserveAspectRatio="none" style="width:930px;height:734px;background:#FFFFFF;" version="1.1" viewBox="0 0 930 734" width="930px" zoomAndPan="magnify"><title>How a kubeadm control plane starts &#8212; static pods before there is an API server to ask</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="738.2197" x="91.895" y="30.8838">How a kubeadm control plane starts &#8212; static pods before there is an API server to ask</text></g><!--cluster sp--><g class="cluster" data-entity="sp" data-source-line="8" data-uid="ent0006" id="cluster_sp"><rect fill="#F0FDF4" height="84" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="586" x="270.7549" y="598.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.7954" x="528.3572" y="616.8921">Static Pods</text></g><!--entity dir--><g class="entity" data-entity="dir" data-source-line="4" data-uid="ent0002" id="entity_dir"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="304.9175" x="276.2549" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.2871" x="290.2549" y="79.8921">/etc/kubernetes/manifests/</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="166.9121" x="290.2549" y="92.9648">etcd.yaml &#183; kube-apiserver.yaml</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="276.9175" x="290.2549" y="105.6138">kube-controller-manager.yaml &#183; kube-scheduler.yaml</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.6792" x="290.2549" y="118.2627">written by kubeadm init &#8212; plain Pod YAML</text></g><!--entity kubelet--><g class="entity" data-entity="kubelet" data-source-line="5" data-uid="ent0003" id="entity_kubelet"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="298.7944" x="279.2549" y="195.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="293.2549" y="221.8921">kubelet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="270.7944" x="293.2549" y="234.9648">systemd service on the host &#8212; the only Kubernetes</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="253.6445" x="293.2549" y="247.6138">component that is NOT a container. Watches the</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="187.0752" x="293.2549" y="260.2627">directory (staticPodPath) every 20 s</text></g><!--entity containerd--><g class="entity" data-entity="containerd" data-source-line="6" data-uid="ent0004" id="entity_containerd"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="218.7007" x="206.2549" y="337.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4536" x="220.2549" y="363.8921">containerd</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="190.7007" x="220.2549" y="376.9648">high-level runtime: pulls the images,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="111.2515" x="220.2549" y="389.6138">prepares the bundles</text></g><!--entity runc--><g class="entity" data-entity="runc" data-source-line="7" data-uid="ent0005" id="entity_runc"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="246.5444" x="72.2549" y="479.1982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1709" x="86.2549" y="505.3921">runc</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.5444" x="86.2549" y="518.4648">low-level runtime: namespaces + cgroups</text></g><!--entity mirror--><g class="entity" data-entity="mirror" data-source-line="17" data-uid="ent0014" id="entity_mirror"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="330.0381" x="337.7549" y="466.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.1563" x="351.7549" y="492.8921">Mirror Pods in the API</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="302.0381" x="351.7549" y="505.9648">kubectl get pods -n kube-system shows them (name-&lt;node&gt;),</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="242.1558" x="351.7549" y="518.6138">read-only: delete one and the kubelet recreates it;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="135.126" x="351.7549" y="531.2627">the file is the source of truth</text></g><!--entity etcd--><g class="entity" data-entity="etcd" data-source-line="9" data-uid="ent0007" id="entity_etcd"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="54.73" x="313.2549" y="631.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="26.73" x="327.2549" y="657.8921">etcd</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="10" data-uid="ent0008" id="entity_api"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="120.4917" x="386.7549" y="631.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4917" x="400.7549" y="657.8921">kube-apiserver</text></g><!--entity cm--><g class="entity" data-entity="cm" data-source-line="11" data-uid="ent0009" id="entity_cm"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="181.1436" x="525.2549" y="631.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.1436" x="539.2549" y="657.8921">kube-controller-manager</text></g><!--entity sched--><g class="entity" data-entity="sched" data-source-line="12" data-uid="ent0010" id="entity_sched"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="124.0845" x="724.7549" y="631.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.0845" x="738.7549" y="657.8921">kube-scheduler</text></g><g class="link" data-entity-1="dir" data-entity-2="kubelet" data-uid="lnk15" id="link_dir_kubelet"><polygon fill="#475569" points="428.7549,195.355,432.7549,186.355,428.7549,190.355,424.7549,186.355,428.7549,195.355" style="stroke:#475569;stroke-width:1;"/><path d="M428.7549,134.9421 C428.7549,153.8587 428.7549,170.4256 428.7549,189.355" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="70.0371" x="434.7549" y="169.9541">sees the files</text></g><g class="link" data-entity-1="kubelet" data-entity-2="containerd" data-uid="lnk16" id="link_kubelet_containerd"><polygon fill="#475569" points="343.7033,337.6795,352.5711,333.3943,346.9337,333.8631,346.4649,328.2257,343.7033,337.6795" style="stroke:#475569;stroke-width:1;"/><path d="M395.1571,276.8912 C378.7627,296.2598 363.1479,314.7074 347.5798,333.0998" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="20.666" x="384.7549" y="311.9541">CRI</text></g><g class="link" data-entity-1="containerd" data-entity-2="runc" data-uid="lnk17" id="link_containerd_runc"><polygon fill="#475569" points="220.2331,478.9662,229.2245,474.9469,223.5756,475.2477,223.2748,469.5988,220.2331,478.9662" style="stroke:#475569;stroke-width:1;"/><path d="M286.092,405.6983 C265.8257,428.2445 243.3039,453.2999 224.2441,474.504" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="21.334" x="272.7549" y="440.9541">OCI</text></g><g class="link" data-entity-1="runc" data-entity-2="sp" data-uid="lnk18" id="link_runc_sp"><polygon fill="#475569" points="270.5477,626.5517,269.1212,616.8067,267.8766,622.3249,262.3584,621.0804,270.5477,626.5517" style="stroke:#475569;stroke-width:1;"/><path d="M212.8713,535.2835 C222.9109,551.1704 236.0203,571.9149 248.4048,591.5124 C254.5971,601.3112 260.6081,610.8232 265.9637,619.2978 C267.3025,621.4165 268.6005,623.4703 269.85,625.4476 C270.0062,625.6948 270.1616,625.9408 270.3163,626.1855 C270.3936,626.3079 267.2655,621.3578 267.3424,621.4796" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="39.3516" x="252.7549" y="582.9541">creates</text></g><g class="link" data-entity-1="kubelet" data-entity-2="mirror" data-uid="lnk19" id="link_kubelet_mirror"><polygon fill="#475569" points="491.7911,466.3435,493.2607,456.6049,490.4649,461.5226,485.5472,458.7268,491.7911,466.3435" style="stroke:#475569;stroke-width:1;"/><path d="M439.6738,276.8901 C453.6648,327.749 476.1872,409.6211 490.1997,460.5584" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.084" x="479.7549" y="376.4541">reports, once the API server is up</text></g><g class="link" data-entity-1="mirror" data-entity-2="api" data-uid="lnk21" id="link_mirror_api"><polygon fill="#475569" points="487.3044,547.9281,480.3144,554.8663,485.4922,552.5881,487.7704,557.7659,487.3044,547.9281" style="stroke:#475569;stroke-width:1;"/><path d="M485.1297,553.5201 C474.5757,580.659 463.197,609.9185 454.7425,631.6586" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="26"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="912.0098" x="5" y="702.8301">Chicken and egg, solved: the API server is itself a Pod, so something must start Pods without an API server. That is the kubelet reading a directory.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="838.0586" x="41.9756" y="718.9287">Everything else the cluster runs &#8212; kube-proxy, CoreDNS, your apps &#8212; comes the normal way, as API objects the kubelet is told about.</text></g><!--SRC=[TLNRZjCm47tFLmpx1A9fWCTILK8BWXMt5Ok44F3WsjF4h2-HFQ4KXCH7y2-yyoby2MCdxIRRHOgYn3u-CtFcublQITCfXFcywX_otiHAQL47OMDrAPqeg