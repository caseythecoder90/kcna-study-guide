<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="440px" preserveAspectRatio="none" style="width:1358px;height:440px;background:#FFFFFF;" version="1.1" viewBox="0 0 1358 440" width="1358px" zoomAndPan="magnify"><title>A rolling update of 12 replicas, and the two numbers that bound it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="562.0342" x="394.0039" y="30.8838">A rolling update of 12 replicas, and the two numbers that bound it</text></g><!--cluster rule--><g class="cluster" data-entity="rule" data-source-line="4" data-uid="ent0002" id="cluster_rule"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="604" x="503.771" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="220.3335" x="695.6042" y="79.8921">The defaults, applied to replicas: 12</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="10" data-uid="ent0006" id="entity_s1"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="132.5698" x="453.271" y="205.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.6436" x="467.271" y="231.3921">1 &#183; before</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="86.2222" x="467.271" y="244.4648">old ReplicaSet 12</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="85.6045" x="467.271" y="257.1138">new ReplicaSet 0</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="104.5698" x="467.271" y="269.7627">total 12 &#183; available 12</text></g><!--entity s2--><g class="entity" data-entity="s2" data-source-line="11" data-uid="ent0007" id="entity_s2"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="369.0591" x="604.271" y="198.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.2173" x="618.271" y="224.8921">2 &#183; during</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="184.6152" x="618.271" y="237.9648">old ReplicaSet 9 &#183; new ReplicaSet 6</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="195.5776" x="618.271" y="250.6138">total 15 &#8212; sitting on the surge ceiling</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="209.0591" x="618.271" y="263.2627">available never dips below 9 &#8212; the floor</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="341.0591" x="618.271" y="275.9116">the controller scales one down, the other up, and waits for Ready</text></g><!--entity s3--><g class="entity" data-entity="s3" data-source-line="12" data-uid="ent0008" id="entity_s3"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="138.0537" x="991.771" y="205.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.96" x="1005.771" y="231.3921">3 &#183; after</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="84.9707" x="1005.771" y="244.4648">old ReplicaSet 0</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="95.9868" x="1005.771" y="257.1138">new ReplicaSet 12</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="110.0537" x="1005.771" y="269.7627">total 12 &#183; available 12</text></g><!--entity recreate--><g class="entity" data-entity="recreate" data-source-line="18" data-uid="ent0012" id="entity_recreate"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="584.8374" x="227.271" y="328.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="262.939" x="241.271" y="354.8921">strategy.type: Recreate &#8212; the other option</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="504.958" x="241.271" y="367.9648">every old Pod is killed first, then the new ones are created: a moment where 0 Pods are available</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="556.8374" x="241.271" y="380.6138">for applications that cannot have two versions running at once, such as a single-writer database migration</text></g><!--entity mu--><g class="entity" data-entity="mu" data-source-line="5" data-uid="ent0003" id="entity_mu"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="283.7344" x="545.771" y="94.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="255.7344" x="559.771" y="120.8921">maxUnavailable 25% &#8594; 3 &#183; rounds DOWN</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.126" x="559.771" y="133.9648">so never fewer than 9 available &#8212; the floor</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="217.0137" x="559.771" y="146.6138">docs: at least 75% of desired Pods are up</text></g><!--entity ms--><g class="entity" data-entity="ms" data-source-line="6" data-uid="ent0004" id="entity_ms"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="252.3398" x="847.771" y="94.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="197.2217" x="861.771" y="120.8921">maxSurge 25% &#8594; 3 &#183; rounds UP</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.5537" x="861.771" y="133.9648">so never more than 15 total &#8212; the ceiling</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="224.3398" x="861.771" y="146.6138">docs: at most 125% of desired Pods are up</text></g><g class="link" data-entity-1="mu" data-entity-2="ms" data-uid="lnk5" id="link_mu_ms"><polygon fill="#475569" points="847.6319,128.6982,838.6319,124.6982,842.6319,128.6982,838.6319,132.6982,847.6319,128.6982" style="stroke:#475569;stroke-width:1;"/><path d="M829.9331,128.6982 C835.8327,128.6982 835.7323,128.6982 841.6319,128.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s1" data-entity-2="s2" data-uid="lnk10" id="link_s1_s2"><polygon fill="#475569" points="603.8786,245.6982,594.8786,241.6982,598.8786,245.6982,594.8786,249.6982,603.8786,245.6982" style="stroke:#475569;stroke-width:1;"/><path d="M586.4956,245.6982 C592.29,245.6982 592.0843,245.6982 597.8786,245.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s2" data-entity-2="s3" data-uid="lnk11" id="link_s2_s3"><polygon fill="#475569" points="991.473,245.6982,982.473,241.6982,986.473,245.6982,982.473,249.6982,991.473,245.6982" style="stroke:#475569;stroke-width:1;"/><path d="M973.3804,245.6982 C979.4112,245.6982 979.4421,245.6982 985.473,245.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1340.042" x="5" y="408.8301">Both values may be given as a percentage or an absolute count, and neither may be 0 if the other is 0. Lower maxUnavailable for availability, raise maxSurge for speed &#8212; and remember maxSurge costs real capacity,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1295.7109" x="27.1655" y="424.9287">because 15 Pods must actually fit on the cluster. minReadySeconds makes the controller pause after each Pod turns Ready; progressDeadlineSeconds (600 by default) is when a stuck rollout is declared failed.</text></g><!--SRC=[bLNRRYD547ttLnGh8O6KEBQZBDfWMGBj8u8LOSK3y53kAJkjz7IF-kB1e9LuuWCG_y8xdx9VmgaU9vxSM90iIpFJLNNgd5FL7rblN6c4fjEpuPT3SEciiRoDtAQp6-FvD5zBAzEkj6wIRNP2Nr0Cpbc_fT8rd8N2XkOBYj8vQpYT4Fk644Mv3-HBkvQOyCoPrg7WaysJIHIJsM-HxSLtEDd8XelB6jiXYo0-t2MyHFONj5nkOoZTQaMSA1P4_ZeX6kLf-UUtddTi7Q_nlBZucDx__WUTqzz_0J0A9thzpVTV_-YNoVuYb_FvAW6Ux2JIHdhy0wAdLtHCyVwtFsiV6nT2N9vfs6eKtWG3R6ZB2QTCdw4Wc6WasOW6tWGKv2WWwH1QUmYX6LfeooFuLoLkdmR-zirJiDk0z1Nr_0A4PNPta8rOLUXVGBS1cEUB_maw0NHRw3JQxNK-NUcBT_VKd2lgjMm0RLGrk8Q-7UIy4Ytx69YNVdnazlZ4q26SXWf7aUvoATBEiVK3r3GVmwf1JOdWv7bOh_JG0nmldyLnKSbEDcSTXU0hxwbA-2pxHzY3Wetj4jXoeKVn3zYjoXfyrk53Q3Bi9A4kfYVq_gI61ln5Y3VCOCys9u8KQ8YR_OWdDaPyFX2r61DLNSURBF5vdcOVLEyfWV-3V4UZfNEuIeVyz8ThspJYVz8cOJZ8ckP7_m5yMemUp- -PCUM8_RJTJ_E-a