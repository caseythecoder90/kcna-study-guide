<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="817px" preserveAspectRatio="none" style="width:1555px;height:817px;background:#FFFFFF;" version="1.1" viewBox="0 0 1555 817" width="1555px" zoomAndPan="magnify"><title>Walking the object to build a JSON Pointer path</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="408.0234" x="569.7544" y="30.8838">Walking the object to build a JSON Pointer path</text></g><!--cluster walk--><g class="cluster" data-entity="walk" data-source-line="4" data-uid="ent0002" id="cluster_walk"><rect fill="#F8FAFC" height="699.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="367" x="401.7661" y="66.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="343.1099" x="413.7112" y="84.3921">Read the YAML downwards, write the path with slashes</text></g><!--cluster rules--><g class="cluster" data-entity="rules" data-source-line="20" data-uid="ent0016" id="cluster_rules"><rect fill="#F8FAFC" height="252" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="392" x="776.7661" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="300.5107" x="822.5107" y="71.8921">Two pieces of syntax that are not path segments</text></g><!--entity r0--><g class="entity" data-entity="r0" data-source-line="5" data-uid="ent0003" id="entity_r0"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="198.5913" x="554.2661" y="99.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.439" x="568.2661" y="125.3921">kind: Deployment</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="170.5913" x="568.2661" y="138.4648">the root &#8212; the path starts here, at /</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="6" data-uid="ent0004" id="entity_r1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="68.3477" x="606.7661" y="222.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.0718" x="620.7661" y="248.8921">spec:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="40.3477" x="620.7661" y="261.9648">&#8594; /spec</text></g><!--entity r2--><g class="entity" data-entity="r2" data-source-line="7" data-uid="ent0005" id="entity_r2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="233.6597" x="497.7661" y="333.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.4727" x="518.9897" y="359.8921">template:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="108.8452" x="608.5806" y="360.3159">the PodTemplateSpec</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="85.5938" x="511.7661" y="372.9648">&#8594; /spec/template</text></g><!--entity r3--><g class="entity" data-entity="r3" data-source-line="8" data-uid="ent0006" id="entity_r3"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="303.603" x="456.7661" y="425.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.0718" x="485.2134" y="451.8921">spec:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="186.7422" x="559.627" y="452.3159">the Pod's own spec &#8212; yes, spec twice</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="111.8853" x="470.7661" y="464.9648">&#8594; /spec/template/spec</text></g><!--entity r4--><g class="entity" data-entity="r4" data-source-line="9" data-uid="ent0007" id="entity_r4"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="299.5303" x="458.7661" y="517.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.5908" x="494.437" y="543.8921">containers:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="171.8213" x="572.4751" y="544.3159">a LIST, so the next step is an index</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="165.6929" x="472.7661" y="556.9648">&#8594; /spec/template/spec/containers</text></g><!--entity r5--><g class="entity" data-entity="r5" data-source-line="10" data-uid="ent0008" id="entity_r5"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="264.6646" x="476.2661" y="609.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.7617" x="511.937" y="635.8921">- name: nginx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="129.0083" x="597.9224" y="636.3159">the first element is 0, not 1</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="174.8667" x="490.2661" y="648.9648">&#8594; /spec/template/spec/containers/0</text></g><!--entity r6--><g class="entity" data-entity="r6" data-source-line="11" data-uid="ent0009" id="entity_r6"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="249.3105" x="484.2661" y="701.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8081" x="527.1606" y="727.8921">image: nginx:1.26</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.3105" x="498.2661" y="740.9648">&#8594; /spec/template/spec/containers/0/image</text></g><!--entity dash--><g class="entity" data-entity="dash" data-source-line="21" data-uid="ent0017" id="entity_dash"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="341.5161" x="818.7661" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.0444" x="832.7661" y="112.8921">the dash means APPEND</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="199.8906" x="832.7661" y="125.9648">path: /spec/template/spec/containers/-</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="313.5161" x="832.7661" y="138.6138">with op: add, this puts a new container at the END of the list</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="292.7676" x="832.7661" y="151.2627">a number there would insert BEFORE that index instead</text></g><!--entity tilde--><g class="entity" data-entity="tilde" data-source-line="22" data-uid="ent0018" id="entity_tilde"><rect fill="#FEE2E2" height="93.5444" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="356.2651" x="804.7661" y="203.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.0425" x="818.7661" y="229.8921">~1 and ~0 are escapes</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="319.4727" x="818.7661" y="242.9648">a literal / inside a key becomes ~1, and a literal ~ becomes ~0</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="328.2651" x="818.7661" y="255.6138">so the annotation kubernetes.io/change-cause is addressed as</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="277.2236" x="818.7661" y="268.2627">/metadata/annotations/kubernetes.io~1change-cause</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="298.8584" x="818.7661" y="280.9116">forget this and the path silently points at the wrong place</text></g><g class="link" data-entity-1="r0" data-entity-2="r1" data-uid="lnk10" id="link_r0_r1"><polygon fill="#475569" points="643.6738,222.5223,648.6086,213.9989,644.2058,217.5507,640.654,213.1478,643.6738,222.5223" style="stroke:#475569;stroke-width:1;"/><path d="M650.8487,155.4652 C648.7077,175.4753 646.4509,196.5677 644.3122,216.5563" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r1" data-entity-2="r2" data-uid="lnk11" id="link_r1_r2"><polygon fill="#475569" points="621.2673,333.4434,627.2463,325.6171,622.4274,328.5798,619.4646,323.7609,621.2673,333.4434" style="stroke:#475569;stroke-width:1;"/><path d="M634.2723,278.9224 C630.3014,295.5693 626.6316,310.9545 622.6594,327.6071" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r2" data-entity-2="r3" data-uid="lnk12" id="link_r2_r3"><polygon fill="#475569" points="610.5858,425.4033,615.1756,416.6893,610.9184,420.4143,607.1933,416.1571,610.5858,425.4033" style="stroke:#475569;stroke-width:1;"/><path d="M612.9659,389.7012 C612.2134,400.9887 611.7395,408.0982 610.9849,419.4166" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r3" data-entity-2="r4" data-uid="lnk13" id="link_r3_r4"><polygon fill="#475569" points="608.7661,517.4033,612.7661,508.4033,608.7661,512.4033,604.7661,508.4033,608.7661,517.4033" style="stroke:#475569;stroke-width:1;"/><path d="M608.7661,481.7012 C608.7661,492.9887 608.7661,500.0849 608.7661,511.4033" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r4" data-entity-2="r5" data-uid="lnk14" id="link_r4_r5"><polygon fill="#475569" points="608.7661,609.4033,612.7661,600.4033,608.7661,604.4033,604.7661,600.4033,608.7661,609.4033" style="stroke:#475569;stroke-width:1;"/><path d="M608.7661,573.7012 C608.7661,584.9887 608.7661,592.0849 608.7661,603.4033" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r5" data-entity-2="r6" data-uid="lnk15" id="link_r5_r6"><polygon fill="#475569" points="608.7661,701.4033,612.7661,692.4033,608.7661,696.4033,604.7661,692.4033,608.7661,701.4033" style="stroke:#475569;stroke-width:1;"/><path d="M608.7661,665.7012 C608.7661,676.9887 608.7661,684.0849 608.7661,695.4033" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1537.5322" x="5" y="785.8301">Two specs in a row catches everyone: /spec is the Deployment's, /spec/template/spec is the Pod's. On a bare Pod the same field is just /spec/containers/0/image &#8212; which is exactly why a patch written for a Deployment fails on a Pod and vice versa.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1333.0693" x="107.2314" y="801.9287">Build the path by reading the object you are about to patch, not from memory: kubectl get deploy web -o yaml is the reference, and kubectl explain deployment.spec.template.spec.containers confirms the field names.</text></g><!--SRC=[dLRDZjis4BxxAQQvv69RzYRPWs4OI90jq2BDBh8B54MRmrWSIynAf41IaTMYHazzWA9Fc2Vf36Ml_BFEJmt3C4NEpCTllfdHTzgaHQq8nkEa-mPh2vyeZPd3qYVtgS5HoAcaSLMNnI3eK13yZCMzDXdm1jZb1qe310lBMXSA47wylNuBDrQRG0ug3FbWuFW8cenDdxmZLD7mbvS_lG5b6zEWKtu8ZTE1uexOGAFvnnVeS_9FO3xFdAshnGBGGyFXuOy1m9vRngDcy9ggmhObcV2RcNlzEyscquMuTDO6-FJNlxr_7z053pav6W86IEQ962maLba7KbqiDpcCuojAPtlEF_tz3oJoSC-yAb2RhVdqq1mWKCdxWMRmy3b0UcFLtVR8RU_siOZ9pjMPq1V7eG4YUe3pePzwu8p4Sv6kbZWpSHKQdTBNeFaS6yzE8G6arWG-GixF3Y0XlFdXzex3svWrG-l0MQCAj0Sqm0cdzLS3IleePx0zVmpR20oMd2kJQRC-eckbdGz01OdU1DHa28PbDlq_e9B96LWl7eC5e4lCThXcq_75vJT6IwA3lPYPjJl9Nqh82OoaE4UBhOQd_JeAww9Vnwm-wzUHoUVzEbxXHR- -7Fnvq1Bk6WkLffHOV2lmBQDSSygvAD5HfBIhMCg4wUDkuEg23O_QWUH7SU-0aj1uU7bpS_NszHv5ud3s9P96fucCNSbMCq2bXeoHirxLt4QGvTdqIfQ68X0ug5n9_XRQXrD_R5UNIpO8qeYWiJMtK6qykG2lhhw_VdVL4H75BXk1s-TUrZ1DcPAE2Bdl8GkRAHUAWiqa4aa-nOhyGVI2Uwx30XBnhNaG8DnJ2qjARSciRgR3wA4_kEdt9gVNsPOg6auQ1cqDtDTyEqE1_5ZR9CqP6OrIh3t5CbRAaVV44VofjwIaW0e39hr37adx7ZVJVPUdBbRMPHIwHCb5-lQl2oQkQA6IGULt2MkSvRd6SaZtQsE9sz88FE68EOxI6lsQQwN8lD_gkjjaQSVvzB3hT9O7aRteT33W74HYvdeXkXVDUIQVANQM5OGXvO47z95SQmrjDIfS2Rn-lZtbllo8V7S7OoiVmxNuNKho-K7SyDpEk7EHoCp3XvexsBdc40T0a-iqbwEqnbJuQlAMVLQ2CuxiG0QOPNxMWuCLweABMQ9BO67-8uyFu5jv7CyJBJdIYrVnZU4X9ykMnOlgwCsYjNMKBovj7TypOkokrQwSBRd4I-lQMPGQGmH9k8fOeA4bZ2oqM1OxPXojkD9CIfsoTqQqZartQoYN60ijunsxtQedIMgT1q3PEUq8bL7Xu-t-0m00]--></g></svg>