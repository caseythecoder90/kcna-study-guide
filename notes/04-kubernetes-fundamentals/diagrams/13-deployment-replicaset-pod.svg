<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="470px" preserveAspectRatio="none" style="width:1232px;height:470px;background:#FFFFFF;" version="1.1" viewBox="0 0 1232 470" width="1232px" zoomAndPan="magnify"><title>Deployment owns ReplicaSet owns Pod &#8212; and the hash that ties them together</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="679.0957" x="272.4561" y="30.8838">Deployment owns ReplicaSet owns Pod &#8212; and the hash that ties them together</text></g><!--entity dep--><g class="entity" data-entity="dep" data-source-line="4" data-uid="ent0002" id="entity_dep"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="449.126" x="183.5039" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6182" x="197.5039" y="87.8921">Deployment &#183; nginx</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286.1128" x="197.5039" y="100.9648">what you declare: replicas, selector, strategy, template</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="349.0083" x="197.5039" y="113.6138">managed by the Deployment controller in kube-controller-manager</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="421.126" x="197.5039" y="126.2627">its job: keep the right ReplicaSet scaled up, and the old ones around for rollback</text></g><!--entity rs--><g class="entity" data-entity="rs" data-source-line="6" data-uid="ent0003" id="entity_rs"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="437.5352" x="189.0039" y="203.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="184.939" x="203.0039" y="229.8921">ReplicaSet &#183; nginx-77b4fdf86c</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="409.5352" x="203.0039" y="242.9648">77b4fdf86c is the pod-template-hash &#8212; a hash of .spec.template, added by the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="395.4844" x="203.0039" y="255.6138">Deployment controller to the ReplicaSet, its selector, and every Pod it owns</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="301.9575" x="203.0039" y="268.2627">one distinct pod template = one ReplicaSet = one revision</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="386.9551" x="203.0039" y="280.9116">managed by the ReplicaSet controller &#8212; its job: keep exactly N Pods alive</text></g><!--entity pod1--><g class="entity" data-entity="pod1" data-source-line="8" data-uid="ent0004" id="entity_pod1"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="272.6211" x="17.5039" y="358.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.9834" x="31.5039" y="384.8921">Pod &#183; nginx-77b4fdf86c-qrfpm</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="211.5566" x="31.5039" y="397.9648">name = ReplicaSet name + a random suffix</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="244.6211" x="31.5039" y="410.6138">labels: app=nginx, pod-template-hash=77b4fdf86c</text></g><!--entity pod2--><g class="entity" data-entity="pod2" data-source-line="9" data-uid="ent0005" id="entity_pod2"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="199.2598" x="308.5039" y="371.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.2598" x="322.5039" y="397.3921">Pod &#183; nginx-77b4fdf86c-lh9rm</text></g><!--entity pod3--><g class="entity" data-entity="pod3" data-source-line="10" data-uid="ent0006" id="entity_pod3"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="205.0425" x="525.5039" y="371.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.0425" x="539.5039" y="397.3921">Pod &#183; nginx-77b4fdf86c-z7m9s</text></g><!--entity oldrs--><g class="entity" data-entity="oldrs" data-source-line="12" data-uid="ent0007" id="entity_oldrs"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="455.4263" x="758.5039" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.9814" x="772.5039" y="87.8921">ReplicaSet &#183; nginx-f57fcc886 &#183; the previous revision</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="326.5142" x="772.5039" y="100.9648">scaled to 0 but not deleted &#8212; this is what a rollback scales back up</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="291.0166" x="772.5039" y="113.6138">revisionHistoryLimit (default 10) decides how many are kept</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="427.4263" x="772.5039" y="126.2627">change .spec.template and a NEW ReplicaSet appears; change replicas and it does not</text></g><g class="link" data-entity-1="dep" data-entity-2="rs" data-uid="lnk8" id="link_dep_rs"><polygon fill="#475569" points="408.0039,203.5309,412.0039,194.5309,408.0039,198.5309,404.0039,194.5309,408.0039,203.5309" style="stroke:#475569;stroke-width:1;"/><path d="M408.0039,142.8433 C408.0039,161.5707 408.0039,178.0396 408.0039,197.5309" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.0547" x="414.0039" y="177.9541">creates and scales</text></g><g class="link" data-entity-1="dep" data-entity-2="oldrs" data-uid="lnk9" id="link_dep_oldrs"><polygon fill="#475569" points="758.3295,102.1982,749.3295,98.1982,753.3295,102.1982,749.3295,106.1982,758.3295,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M632.7149,102.1982 C673.9448,102.1982 711.0136,102.1982 752.3295,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="96.7266" x="647.5039" y="91.4541">keeps, scaled to 0</text></g><g class="link" data-entity-1="rs" data-entity-2="pod1" data-uid="lnk10" id="link_rs_pod1"><polygon fill="#475569" points="214.2392,358.4977,224.0521,357.6564,218.6181,356.0841,220.1904,350.6501,214.2392,358.4977" style="stroke:#475569;stroke-width:1;"/><path d="M324.483,297.7334 C288.4795,317.5778 252.4289,337.4483 219.4939,355.6014" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="94.0488" x="295.0039" y="332.9541">ownerReferences</text></g><g class="link" data-entity-1="rs" data-entity-2="pod2" data-uid="lnk11" id="link_rs_pod2"><polygon fill="#475569" points="408.0039,370.9572,412.0039,361.9572,408.0039,365.9572,404.0039,361.9572,408.0039,370.9572" style="stroke:#475569;stroke-width:1;"/><path d="M408.0039,297.9275 C408.0039,322.6178 408.0039,345.7854 408.0039,364.9572" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="rs" data-entity-2="pod3" data-uid="lnk12" id="link_rs_pod3"><polygon fill="#475569" points="595.6091,371.0834,590.1637,362.8769,591.3908,368.399,585.8687,369.6261,595.6091,371.0834" style="stroke:#475569;stroke-width:1;"/><path d="M480.3448,297.7334 C519.2937,322.519 560.3443,348.6421 590.5472,367.8621" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1206.2695" x="8.8691" y="438.8301">Three objects, two controllers, one chain of ownership: delete a Pod and the ReplicaSet replaces it; delete the ReplicaSet and the Deployment replaces it; delete the Deployment and all of it goes.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1214.0078" x="5" y="454.9287">The hash in the middle of every Pod name is not decoration &#8212; it says which pod template that Pod was built from, which is how a rolling update keeps two generations apart while both are running.</text></g><!--SRC=[ZLNBZjis5DtFLzncrQAMdKdRpCJnUDK2NHH1aHRefXkAl9AOeKYLfCRZhFeH_PVk-odvaXnIVj2Z50dW1KdVvpddNdsbhJIZObekLzClEcV2IcdHUj67rRsqeeeTzxmSnjvSHHqDquyy6BVlsKPoEnleBUvQYj_uSF_LAVhmzpyah28uKoT2XuE853M7zDHJT2tZuA-kFCieR8kupuh0__rBjjNsyK-x2Vezhw-ljxiKOUz6KYoDyBmcFoKE2mfi4CPvdA8NaTlzWYBtWy5viqeHjaMaNbZHig9wd-ihqafdetV6i2TjwNwikJe_LPEVdmVKCT0xLw_fddd8CRrkkrWY4wGmI3aEYnCkpYXo5eW8xqQyDSvJobGBUN_8yOms6o4bIjjkIGIqFbmWLYGu8bRTtDJVDwgvVIcB2i-Ff3C5D3XL7I6gCaMPiuajrz0o32oNHmjKhTG9iZa2dyOmkfpgNEM24bHdjX8K