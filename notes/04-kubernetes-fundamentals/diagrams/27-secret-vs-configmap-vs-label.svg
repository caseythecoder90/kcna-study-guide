<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="443px" preserveAspectRatio="none" style="width:1421px;height:443px;background:#FFFFFF;" version="1.1" viewBox="0 0 1421 443" width="1421px" zoomAndPan="magnify"><title>Secret, ConfigMap, Label &#8212; three key-value things that are not interchangeable</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="679.1484" x="367.4258" y="30.8838">Secret, ConfigMap, Label &#8212; three key-value things that are not interchangeable</text></g><!--cluster sec--><g class="cluster" data-entity="sec" data-source-line="4" data-uid="ent0002" id="cluster_sec"><rect fill="#F0FDF4" height="190" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="364" x="675" y="67.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.749" x="837.1255" y="85.8921">Secret</text></g><!--cluster cm--><g class="cluster" data-entity="cm" data-source-line="8" data-uid="ent0004" id="cluster_cm"><rect fill="#F8FAFC" height="190" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="348" x="319" y="67.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.1519" x="459.4241" y="85.8921">ConfigMap</text></g><!--cluster lbl--><g class="cluster" data-entity="lbl" data-source-line="12" data-uid="ent0006" id="cluster_lbl"><rect fill="#FEF2F2" height="202" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="368" x="1047" y="61.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="33.9536" x="1214.0232" y="79.8921">Label</text></g><!--entity why--><g class="entity" data-entity="why" data-source-line="19" data-uid="ent0010" id="entity_why"><rect fill="#F1F5F9" height="108.4932" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="658.3354" x="6" y="291.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.8613" x="20" y="317.8921">Why two nearly identical objects?  The author of both features:</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="630.3354" x="20" y="330.9648">&#8220;Use Secrets for things which are actually secret like API keys, credentials, etc. Use ConfigMaps for not-secret configuration data.</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="530.7393" x="20" y="343.6138">In general, we like intent-based APIs, and the intent is definitely different for secret data vs. plain old configs.&#8221;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="20" y="358.1387">&#160;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="606.4932" x="20" y="371.2114">The intent is not cosmetic: it decides what RBAC rule covers it, whether encryption at rest applies, whether it is held in tmpfs,</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="400.501" x="20" y="383.8604">whether it is redacted in output, and whether a reviewer notices it in a pull request.</text></g><!--entity s--><g class="entity" data-entity="s" data-source-line="5" data-uid="ent0003" id="entity_s"><rect fill="#DCFCE7" height="148.7397" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="314.0698" x="717" y="100.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="233.3398" x="731" y="126.8921">An OBJECT that stores sensitive data</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="204.8052" x="731" y="139.9648">passwords &#183; tokens &#183; keys &#183; certificates</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="731" y="154.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="235.9307" x="731" y="167.5625">data (base64) or stringData (plain, write-only)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="271.3853" x="731" y="180.2114">has a TYPE: Opaque by default, plus seven built-ins</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.9067" x="731" y="192.8604">1 MiB &#183; same namespace as the Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="731" y="207.3853">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286.0698" x="731" y="220.458">READ BY: the container, via env, envFrom or a volume</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="205.4282" x="731" y="233.1069">values are redacted in kubectl describe</text></g><!--entity c--><g class="entity" data-entity="c" data-source-line="9" data-uid="ent0005" id="entity_c"><rect fill="#FFFFFF" height="148.7397" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="297.0059" x="361.5" y="100.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.6143" x="375.5" y="126.8921">An OBJECT that stores non-sensitive config</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="191.3613" x="375.5" y="139.9648">URLs &#183; feature flags &#183; whole config files</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="375.5" y="154.4897">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="178.5137" x="375.5" y="167.5625">data (UTF-8) or binaryData (base64)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.583" x="375.5" y="180.2114">NO type field</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="180.3667" x="375.5" y="192.8604">1 MiB &#183; same namespace as the Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="375.5" y="207.3853">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="269.0059" x="375.5" y="220.458">READ BY: the container, via env, envFrom or a volume</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="211.5566" x="375.5" y="233.1069">values are shown in full by kubectl describe</text></g><!--entity l--><g class="entity" data-entity="l" data-source-line="13" data-uid="ent0007" id="entity_l"><rect fill="#FEE2E2" height="161.3887" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="317.0669" x="1089.5" y="94.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="272.3398" x="1103.5" y="120.8921">NOT storage at all &#8212; metadata ON an object</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="192.8223" x="1103.5" y="133.9648">app=nginx &#183; tier=frontend &#183; env=prod</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="1103.5" y="148.4897">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.7891" x="1103.5" y="161.5625">lives in metadata.labels of any object</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="162.6475" x="1103.5" y="174.2114">values capped at 63 characters</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="1103.5" y="188.7363">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="289.0669" x="1103.5" y="201.8091">READ BY: the CONTROL PLANE, to SELECT objects &#8212;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="262.6304" x="1103.5" y="214.458">a Service's selector, a Deployment's matchLabels,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.1187" x="1103.5" y="227.1069">a DaemonSet's nodeSelector, kubectl get -l</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="279.979" x="1103.5" y="239.7559">the container never sees them unless you inject them</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1396.1514" x="8.9243" y="411.8301">The exam contrast: Secret and ConfigMap are both key-value OBJECTS a Pod consumes, differing in intent and handling. A Label is neither &#8212; it is metadata used to find and group objects, never to feed data to an application.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="853.6924" x="280.1538" y="427.9287">If a question asks where to put a database password, it is a Secret; a log level, a ConfigMap; &#8220;which Pods belong to this Service&#8221;, a Label.</text></g><!--SRC=[pLRRRYD547ttLnJx0YlPZYBG2cMJeDmM1MNZA764LYmFxPaQJvEUxg6xnzu18UKZU5o-WtS-PR-4KprZnrc7XKSaovTsTLtEELKrdscRcIPd6eztkbTqpeITNAkvLrNOkSki6iMIAnxNJMK6KKV3TCEPvpYa4sSBFN-jwY5Tg1aR-d3_EyNICzCTjwE5CWtZjxRpW0yLINacwo9f6zbdfR9pLZF3Wu7dBE8NV3_hd3-Z_VsvTqtzhNFvuI6fG84p-dL0j65xP6bo_DtPoRHp7wBpB8OswAWNJBcAwgtT3_eNtjlTFQnL24ldyq1__KdHtS5ElY7Nz9cnZxhGcOeSzdVaqk5Rkt5TlD4NCnNunLVFoNd4ywZjD1tNHcaxfANNaKVEclRvsiNQGOag54tVN9tjqQHMFmETMKiv5wenWBCsZII_O4kpHfiuqZPiEzcbr_fOqWsg0ffu2xNAM102KNJbygTolpuxEgNZDtl99dCs8blsGrfeHMmNGtbxvLqbPIbQEDDKl1qxCHeIZPvpbKNEmINTDJDmOb19oBoUhIuc3X_e6_psYEUrUDPKTtPPzTzOjiwE7fZEahUDL6-lBnAf1QlO8D_2g7awM9REhEofqEPJNDzENus-JbJFj5M-FTrKm3OybnEAROrOcat-lsKkb6vfXRQYCKO4-0dwagfxNZxYBtNychjZrTDiPkPZ_YudqqIQcgDM307J3OgAeqemJov9MNApdt1b8sLLrmTshksxrAsQ_K7XKJxRN0vGzK7jduRCG151Abo561j9Df0h4AdjG_qZI1aYGzX8zSMNX2dbHUW-_2iv9vFBwVNaWgukZYxFXXWmT7Ds8RBjuWMfUZkemZZr2vtnvzBy1eOEx2ewvTgujc8RyKUbObOcnCFmAHUdYYjdRrXihSlvPkreHUwS8utCzjr7gYABwOEvnfmaML5ZqH-1MjS0JYaY7My8PBRcNUGX8thqGwdpdEsFNi_BE3f4Gm_Gqrl74CeZFNrVjXIN3YaeRrhIi8sOnMQ5tZT4K-IgcbX2wM1ovcAvQk-mjr7IX_ltjs6rfG8LCE-NqBBKMPcQ09Gs468hMmLMPFGTqz7LULe6Gy9PYg-0Dt7CnYGUroEhSufDDkglT-EayIfgPzFQ6Mz3VMx10b1M1dk2kv2o2MqSoKZ99Jx2AGXSMEd-8X