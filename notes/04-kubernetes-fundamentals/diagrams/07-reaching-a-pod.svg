<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="330px" preserveAspectRatio="none" style="width:1365px;height:330px;background:#FFFFFF;" version="1.1" viewBox="0 0 1365 330" width="1365px" zoomAndPan="magnify"><title>Reaching a Pod depends on where kubectl is running</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="458.0684" x="449.4971" y="30.8838">Reaching a Pod depends on where kubectl is running</text></g><!--cluster inside--><g class="cluster" data-entity="inside" data-source-line="4" data-uid="ent0002" id="cluster_inside"><rect fill="#F0FDF4" height="97" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="879" x="43.5313" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="188.5635" x="388.7495" y="71.8921">Case 1 &#183; you are on the cluster</text></g><!--cluster outside--><g class="cluster" data-entity="outside" data-source-line="12" data-uid="ent0008" id="cluster_outside"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="1293" x="43.5313" y="169.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="326.5615" x="526.7505" y="187.8921">Case 2 &#183; you are on a laptop, the cluster is elsewhere</text></g><!--entity u1--><g class="entity" data-entity="u1" data-source-line="5" data-uid="ent0003" id="entity_u1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="273.2065" x="86.0313" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.7539" x="100.0313" y="112.8921">root@control-plane</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="245.2065" x="100.0313" y="125.9648">kubectl and the Pod network are on the same host</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="6" data-uid="ent0004" id="entity_c1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="304.2622" x="377.5313" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.7617" x="391.5313" y="112.8921">curl http://10.42.2.7</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="276.2622" x="391.5313" y="125.9648">the Pod IP is routable here &#8212; the CNI wired the route</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="7" data-uid="ent0005" id="entity_p1"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="90.8291" x="823.0313" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.8291" x="837.0313" y="112.8921">Pod nginx</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="61.7729" x="837.0313" y="125.9648">10.42.2.7:80</text></g><!--entity u2--><g class="entity" data-entity="u2" data-source-line="13" data-uid="ent0009" id="entity_u2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="371.6694" x="85.5313" y="208.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.3208" x="99.5313" y="234.8921">your laptop</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="343.6694" x="99.5313" y="247.9648">10.42.0.0/16 means nothing on your LAN &#8212; the Pod IP is unreachable</text></g><!--entity pf--><g class="entity" data-entity="pf" data-source-line="14" data-uid="ent0010" id="entity_pf"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="377.0137" x="594.0313" y="202.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="243.4263" x="608.0313" y="228.8921">kubectl port-forward pod/nginx 8080:80</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="297.7144" x="608.0313" y="241.9648">opens a listener on 127.0.0.1:8080 and tunnels it over the</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="349.0137" x="608.0313" y="254.6138">authenticated HTTPS session to the API server, then to the kubelet</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="15" data-uid="ent0011" id="entity_p2"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="90.8291" x="1237.0313" y="208.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.8291" x="1251.0313" y="234.8921">Pod nginx</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="61.7729" x="1251.0313" y="247.9648">10.42.2.7:80</text></g><g class="link" data-entity-1="u1" data-entity-2="c1" data-uid="lnk6" id="link_u1_c1"><polygon fill="#475569" points="377.2024,114.6982,368.2024,110.6982,372.2024,114.6982,368.2024,118.6982,377.2024,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M359.2422,114.6982 C365.2289,114.6982 365.2156,114.6982 371.2024,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="c1" data-entity-2="p1" data-uid="lnk7" id="link_c1_p1"><polygon fill="#475569" points="822.7744,114.6982,813.7744,110.6982,817.7744,114.6982,813.7744,118.6982,822.7744,114.6982" style="stroke:#475569;stroke-width:1;"/><path d="M681.678,114.6982 C732.8987,114.6982 780.2555,114.6982 816.7744,114.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.0664" x="696.2813" y="103.9541">straight to the Pod IP</text></g><g class="link" data-entity-1="u2" data-entity-2="pf" data-uid="lnk12" id="link_u2_pf"><polygon fill="#475569" points="593.9935,236.6982,584.9935,232.6982,588.9935,236.6982,584.9935,240.6982,593.9935,236.6982" style="stroke:#475569;stroke-width:1;"/><path d="M457.8212,236.6982 C502.1755,236.6982 543.5393,236.6982 587.9935,236.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="107.4082" x="472.2813" y="225.9541">http://localhost:8080</text></g><g class="link" data-entity-1="pf" data-entity-2="p2" data-uid="lnk13" id="link_pf_p2"><polygon fill="#475569" points="1236.8046,236.6982,1227.8046,232.6982,1231.8046,236.6982,1227.8046,240.6982,1236.8046,236.6982" style="stroke:#475569;stroke-width:1;"/><path d="M971.2035,236.6982 C1067.4902,236.6982 1170.7129,236.6982 1230.8046,236.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.7773" x="986.0313" y="225.9541">TCP only, one client, dies with the command</text></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="980.4922" x="188.2852" y="298.8301">port-forward is a debugging tunnel, not a way to publish an application: it is TCP only, it serves whoever runs the command, and it stops when you press ctrl-c.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1347.0625" x="5" y="314.9287">Publishing to real users is a Service, and then an Ingress or the Gateway API. The same difference explains why a Pod IP you read out of kubectl get pods -o wide works over ssh to a node and not from your own shell.</text></g><!--SRC=[hLJBRjim4BpxAxOvMv9b54rW64Q37583HM0qkRKzqEHQ8aAH0adLSOi2_OZ-I-_zb7v9Toa_bAIv5GW2Y5xkpCxCyfMsqdGA8S-B_YywPqAXjAYyQ49nBwt8OeqDvctNc57KqI1yG25hRIiGi78A5BPeLG1dOLkZHxZlrYYZ0Ht0TzPIvMZawKJOYcwVNOc0KCBlNx1p7GYwG3S918XBYEZFO3wllElQQ-VKOW4YWBP14yrl8u118-zSV2kTZTwPh3N2uYSx3_ehpifoSI0Xh4hDcQd5k7N-VeWPH8DGkn3d1TzSC3YrqhO7xih7aBBp1keOsrbHb9FyzJIVvkS3r0FISfMcTrqKQxgNPFdpusU2lBfPmbPxx7bn3Gx0g-FGyWbscg3Izc60T-GmkvWCcWWfqSQ-JSjjkX8ohwiwPek-hnmSj2NC84Gl-1kYWzCKe-_FhPi-iKw04MrqxNXe8e-F9c1AnD7HdX5D_2yxgQNVjtesuIIV5EKRQ53O0DR553_2JdVUNzuSnJs9trdFEMNzN_1s-XZ_a9ZM-PXjdDyAh-X35Kbqk9XSJ4Zb0JL7kGyylgQ9BSrCXChfEPFDondNz-cZ7I0fG4TmNwYAQEu93Ng9Zevjr5942iQxkxlLBGGCGNDEUqSkLqiwyjGYANqyPzu6uqlsR_vFYbYiRZe8pOP2izy4uwGml4HfQ2ga7q-5KogykrgHEcOtfl-S4KsDnw0q1bg5MFV9SKr3Ud7azlkUVQorKcW_AxUrr6eVdD58KafOcRbUF79BinqArrrLSK1wvSSS63hVYXrBrdPhCgmcQq2qhM75gTMCxQ7h9wBqdTGcXhL3DeuUip1aEaxsSXr5biim1H9QJyQ1ZDvaCfyNcdtMYrMFctWvSaGOw0WWzAHl2KfB71_UAylybhPAhLmA3LnJDdW82a8ETuV7I-dDXdRCIWHyIF5cAhlzuqoxm9G8Jh5yu3R7vxd2oF4Ea3aoWUJcjp7q6Gqa4B4K91tzm9nOmurtJRzov0U46er9y_q5]--></g></svg>