<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="506px" preserveAspectRatio="none" style="width:1271px;height:506px;background:#FFFFFF;" version="1.1" viewBox="0 0 1271 506" width="1271px" zoomAndPan="magnify"><title>ENTRYPOINT + CMD &#8212; what actually becomes PID 1</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="451.6084" x="405.959" y="30.8838">ENTRYPOINT + CMD &#8212; what actually becomes PID 1</text></g><!--cluster forms--><g class="cluster" data-entity="forms" data-source-line="21" data-uid="ent0015" id="cluster_forms"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="684" x="401.7632" y="332.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="146.6689" x="670.4287" y="350.8921">Shell form vs exec form</text></g><!--entity img--><g class="entity" data-entity="img" data-source-line="4" data-uid="ent0002" id="entity_img"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="321.96" x="256.7632" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="293.96" x="270.7632" y="79.8921">Image: ENTRYPOINT [&#8220;./cmatrix&#8221;]  &#183;  CMD [&#8220;-b&#8221;]</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="6" data-uid="ent0003" id="entity_r1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="134.9199" x="186.2632" y="139.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.9199" x="200.2632" y="165.8921">docker run cmatrix</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="67.2622" x="200.2632" y="178.9648">no arguments</text></g><!--entity r2--><g class="entity" data-entity="r2" data-source-line="7" data-uid="ent0004" id="entity_r2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="157.3208" x="339.2632" y="139.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.3208" x="353.2632" y="165.8921">docker run cmatrix -ab</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="119.2114" x="353.2632" y="178.9648">arguments replace CMD</text></g><!--entity r3--><g class="entity" data-entity="r3" data-source-line="8" data-uid="ent0005" id="entity_r3"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="221.6226" x="514.7632" y="133.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6226" x="528.7632" y="159.8921">docker run --entrypoint sh cmatrix</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.2729" x="528.7632" y="172.9648">--entrypoint replaces ENTRYPOINT;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.8237" x="528.7632" y="185.6138">CMD is dropped too</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="10" data-uid="ent0006" id="entity_p1"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="137.8081" x="184.7632" y="262.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8081" x="198.7632" y="288.8921">PID 1: ./cmatrix -b</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="11" data-uid="ent0007" id="entity_p2"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="145.0381" x="345.2632" y="262.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.0381" x="359.2632" y="288.8921">PID 1: ./cmatrix -ab</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="12" data-uid="ent0008" id="entity_p3"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="83.6245" x="583.7632" y="262.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6245" x="597.7632" y="288.8921">PID 1: sh</text></g><!--entity shell--><g class="entity" data-entity="shell" data-source-line="22" data-uid="ent0016" id="entity_shell"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="298.166" x="443.7632" y="365.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="168.3081" x="457.7632" y="391.8921">CMD ./cmatrix   (shell form)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.2783" x="457.7632" y="404.9648">runs /bin/sh -c &#8220;./cmatrix&#8221; &#8212; sh is PID 1,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="270.166" x="457.7632" y="417.6138">cmatrix its child; SIGTERM reaches sh, not the app;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="78.2461" x="457.7632" y="430.2627">$VARS expand</text></g><!--entity exec--><g class="entity" data-entity="exec" data-source-line="23" data-uid="ent0017" id="entity_exec"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="317.688" x="759.7632" y="365.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="289.688" x="773.7632" y="391.8921">CMD [&#8220;./cmatrix&#8221;]   (exec form &#8212; best practice)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.8159" x="773.7632" y="404.9648">runs the binary directly as PID 1; signals arrive;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.8052" x="773.7632" y="417.6138">no shell, so no variable expansion; JSON array,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="100.8315" x="773.7632" y="430.2627">double quotes only</text></g><g class="link" data-entity-1="img" data-entity-2="r1" data-uid="lnk9" id="link_img_r1"><polygon fill="#475569" points="302.9634,139.5481,312.7758,138.702,307.3411,137.1324,308.9106,131.6976,302.9634,139.5481" style="stroke:#475569;stroke-width:1;"/><path d="M380.549,96.7341 C357.5842,109.4068 333.1122,122.9111 308.2166,136.6492" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="img" data-entity-2="r2" data-uid="lnk10" id="link_img_r2"><polygon fill="#475569" points="417.7632,139.3784,421.7632,130.3784,417.7632,134.3784,413.7632,130.3784,417.7632,139.3784" style="stroke:#475569;stroke-width:1;"/><path d="M417.7632,96.7341 C417.7632,109.3546 417.7632,119.6751 417.7632,133.3784" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="img" data-entity-2="r3" data-uid="lnk11" id="link_img_r3"><polygon fill="#475569" points="549.7898,133.6425,543.133,126.3839,545.205,131.6477,539.9412,133.7197,549.7898,133.6425" style="stroke:#475569;stroke-width:1;"/><path d="M464.9616,96.7341 C490.0125,107.6336 515.9042,118.899 544.288,131.2487" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r1" data-entity-2="p1" data-uid="lnk12" id="link_r1_p1"><polygon fill="#475569" points="253.7632,262.3428,257.7632,253.3428,253.7632,257.3428,249.7632,253.3428,253.7632,262.3428" style="stroke:#475569;stroke-width:1;"/><path d="M253.7632,195.8331 C253.7632,216.2016 253.7632,237.6797 253.7632,256.3428" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="118.3418" x="259.7632" y="236.9541">ENTRYPOINT + CMD</text></g><g class="link" data-entity-1="r2" data-entity-2="p2" data-uid="lnk13" id="link_r2_p2"><polygon fill="#475569" points="417.7632,262.3428,421.7632,253.3428,417.7632,257.3428,413.7632,253.3428,417.7632,262.3428" style="stroke:#475569;stroke-width:1;"/><path d="M417.7632,195.8331 C417.7632,216.2016 417.7632,237.6797 417.7632,256.3428" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.3574" x="423.7632" y="236.9541">ENTRYPOINT + args</text></g><g class="link" data-entity-1="r3" data-entity-2="p3" data-uid="lnk14" id="link_r3_p3"><polygon fill="#475569" points="625.7632,262.4051,629.7632,253.4051,625.7632,257.4051,621.7632,253.4051,625.7632,262.4051" style="stroke:#475569;stroke-width:1;"/><path d="M625.7632,201.8164 C625.7632,221.3664 625.7632,239.5118 625.7632,256.4051" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1253.5264" x="5" y="474.8301">ENTRYPOINT = the executable the container exists to run; CMD = its default arguments, or the whole default command when there is no ENTRYPOINT. Only the last CMD and last ENTRYPOINT count.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="680.0254" x="291.7505" y="490.9287">A shell-form ENTRYPOINT ignores CMD entirely. Neither instruction creates a layer &#8212; both are image config.</text></g><!--SRC=[VLNBJXin5DtFLzoYBgYQoIXXbuH8gA0gbGWeGPKgokAEnynOUEofxG7IgeYFwBBzZkxxANn9hvsGJ1uWPUFnlSVdddFil16AoJhZq6udyv_JMjea4vWRB6romnJ6hk0bRrTrAICddEHmChwOV3a_6uqlu3ryE3s6fyTVS5UW0sIkHYbda7AcIsxXV7GCdIWod3bKEVNkZKhCUQ-9SVdq-BkTi1AT4VTFZt-k0FxzXG3ij-BKVzk3mG0PuyeDXu0MH9clmMQQtN03fbQmGFgg1bPyvxrEPwWqeCdhahhj8F5VXnwlaYZK7CvqNWU36DC6u18D32SKnZtR5v2xBo0_n0ynGPXPfOLoO8iTn3Tg5eVPXdhznQcD9Y-Si90PNLKy0xBq1MO7Qme6gtgmT0BYr3VaMcVp-ghpUZbkrdTtrDjYeuX8a9SGP_fEnKDlnDgokxuyY4ndkQewqDiAOsIwguBkPW4PPoDpiAfOrs1QS2dXMfiIRYtmUyx28b0skgxcdFqd2pyYW4QhLtqb1i2-NMAzQvX3pbj8Kg4ICZnci97zS9LeHookJclRtkSZ1AMF5K9cVPYEFbwSJ4w93hA2uc6B5YZjW6ukO5NjoCZRpqUJAGrOeSeQwKXnOKiWlptWZgiA-qkP0lcKMmULePT0CBurkMT4mwEPGIOyEBqLk9Yr3rRa2gKbbuouvJjeqqKEp5fWDKq8jsW4fiGkJ6A5LdtuD3qRUmISxH0lqxKl_rPhHpff9MUDwLUfz2FHz7CBuyj2P1bNLqRaXQFGXDsV4QLhkRM8KqX6536i7761WHWsqdSOflVDjGka_P9fvUX6qfl0xuKbIvtshqC_F7-7mUICNsCjtUe9Qu4seVckq0Jpl4ylRabsqbUk_BRXFaQaqef36yvevD0haNpoX_YMi6XGPRfMhZr8XDTE38_cIiJ1v4OPsQKDwUXXY1WPAcTj67FXJmUXh3Cr2qemYgPN7Ece6Us5f6XNq534qlybU2MkHHuE_Gy0]--></g></svg>