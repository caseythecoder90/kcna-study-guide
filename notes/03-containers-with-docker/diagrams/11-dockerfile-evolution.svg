<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="614px" preserveAspectRatio="none" style="width:941px;height:614px;background:#FFFFFF;" version="1.1" viewBox="0 0 941 614" width="941px" zoomAndPan="magnify"><title>The cmatrix Dockerfile in five versions &#8212; what changed and what it fixed</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="623.1621" x="155.2651" y="30.8838">The cmatrix Dockerfile in five versions &#8212; what changed and what it fixed</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="4" data-uid="ent0002" id="entity_v1"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="326.2461" x="134.5962" y="61.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152.439" x="148.5962" y="87.8921">v1 &#183; history &#8594; Dockerfile</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="192.5537" x="148.5962" y="100.9648">FROM alpine &#183; 12 separate RUN lines</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="298.2461" x="148.5962" y="113.6138">RUN git clone &#8230; &#183; RUN cd cmatrix/ &#183; RUN autoreconf -i &#8230;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.3022" x="148.5962" y="126.2627">CMD ./cmatrix (shell form)</text></g><!--entity v2--><g class="entity" data-entity="v2" data-source-line="5" data-uid="ent0003" id="entity_v2"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="219.8931" x="187.5962" y="181.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.1118" x="201.5962" y="207.3921">v2 &#183; WORKDIR</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="191.8931" x="201.5962" y="220.4648">RUN cd cmatrix/ &#8594; WORKDIR cmatrix/</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="141.7754" x="201.5962" y="233.1138">CMD [&#8220;./cmatrix&#8221;] (exec form)</text></g><!--entity v3--><g class="entity" data-entity="v3" data-source-line="6" data-uid="ent0004" id="entity_v3"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="286.543" x="154.0962" y="287.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.1426" x="168.0962" y="313.8921">v3 &#183; multi-stage + one RUN</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="258.543" x="168.0962" y="326.9648">FROM alpine AS cmatrixbuilder &#183; WORKDIR /cmatrix</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="226.7998" x="168.0962" y="339.6138">RUN a &amp;&amp; b &amp;&amp; c &#8230; (one layer) &#183; git clone &#8230; .</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="157.7007" x="168.0962" y="352.2627">FROM alpine &#183; LABEL &#8230; &#183; CMD</text></g><!--entity v4--><g class="entity" data-entity="v4" data-source-line="7" data-uid="ent0005" id="entity_v4"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="288.0576" x="153.5962" y="407.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.186" x="167.5962" y="433.3921">v4 &#183; copy the artifact, add only runtime deps</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="260.0576" x="167.5962" y="446.4648">COPY --from=cmatrixbuilder /cmatrix/cmatrix /cmatrix</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="234.1528" x="167.5962" y="459.1138">RUN apk add --no-cache ncurses-terminfo-base</text></g><!--entity v5--><g class="entity" data-entity="v5" data-source-line="8" data-uid="ent0006" id="entity_v5"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="343.3584" x="126.0962" y="516.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="211.25" x="140.0962" y="542.3921">v5 &#183; non-root + ENTRYPOINT/CMD</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="315.3584" x="140.0962" y="555.4648">adduser &#8230; -s /usr/sbin/nologin -D -H thomas &#183; USER thomas</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="204.1123" x="140.0962" y="568.1138">ENTRYPOINT [&#8220;./cmatrix&#8221;] &#183; CMD [&#8220;-b&#8221;]</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="10" data-uid="ent0007" id="entity_p1"><rect fill="#FEE2E2" height="72.8462" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="336.4834" x="478.5962" y="65.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="294.0234" x="492.5962" y="91.8921">Fails at autoreconf: each RUN is a fresh shell in</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="308.4834" x="492.5962" y="106.8408">a new layer &#8212; the cd never persisted, so the build</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.0972" x="492.5962" y="121.7896">ran in / instead of /cmatrix</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="11" data-uid="ent0008" id="entity_p2"><rect fill="#FFFFFF" height="72.8462" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="285.2578" x="426.0962" y="178.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.2578" x="440.0962" y="204.8921">Builds and runs, but ships gcc, git, autotools,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5278" x="440.0962" y="219.8408">headers and the source tree: a compiler in</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.6797" x="440.0962" y="234.7896">production, hundreds of MB, 14 layers</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="12" data-uid="ent0009" id="entity_p3"><rect fill="#FFFFFF" height="72.8462" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="312.7051" x="459.0962" y="291.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.376" x="473.0962" y="317.8921">Build tools confined to a stage that is thrown</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.7051" x="473.0962" y="332.8408">away; but the runtime stage is an empty alpine &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.4961" x="473.0962" y="347.7896">nothing to run (v3 forgot the COPY)</text></g><!--entity p4--><g class="entity" data-entity="p4" data-source-line="13" data-uid="ent0010" id="entity_p4"><rect fill="#FFFFFF" height="72.8462" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="308.0205" x="459.5962" y="404.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.9824" x="473.5962" y="430.8921">Static binary + the terminfo files ncurses reads</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.0205" x="473.5962" y="445.8408">at runtime; no apk index cached. Image ~10 MB,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="183.5679" x="473.5962" y="460.7896">a handful of layers, no toolchain</text></g><!--entity p5--><g class="entity" data-entity="p5" data-source-line="14" data-uid="ent0011" id="entity_p5"><rect fill="#DCFCE7" height="72.8462" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="318.3862" x="487.5962" y="513.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="290.3862" x="501.5962" y="539.8921">Runs as an unprivileged user with no shell and</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="284.6353" x="501.5962" y="554.8408">no home; the executable is fixed, the flags are</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="264.3799" x="501.5962" y="569.7896">the overridable default: docker run img -ab</text></g><g class="link" data-entity-1="v1" data-entity-2="v2" data-uid="lnk12" id="link_v1_v2"><polygon fill="#475569" points="297.5962,180.9369,301.5962,171.9369,297.5962,175.9369,293.5962,171.9369,297.5962,180.9369" style="stroke:#475569;stroke-width:1;"/><path d="M297.5962,142.9583 C297.5962,155.3998 297.5962,162.9917 297.5962,174.9369" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v2" data-entity-2="v3" data-uid="lnk13" id="link_v2_v3"><polygon fill="#475569" points="297.5962,287.4602,301.5962,278.4602,297.5962,282.4602,293.5962,278.4602,297.5962,287.4602" style="stroke:#475569;stroke-width:1;"/><path d="M297.5962,249.2014 C297.5962,261.2157 297.5962,268.923 297.5962,281.4602" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v3" data-entity-2="v4" data-uid="lnk14" id="link_v3_v4"><polygon fill="#475569" points="297.5962,406.9369,301.5962,397.9369,297.5962,401.9369,293.5962,397.9369,297.5962,406.9369" style="stroke:#475569;stroke-width:1;"/><path d="M297.5962,368.9583 C297.5962,381.3998 297.5962,388.9917 297.5962,400.9369" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v4" data-entity-2="v5" data-uid="lnk15" id="link_v4_v5"><polygon fill="#475569" points="297.5962,515.9499,301.5962,506.9499,297.5962,510.9499,293.5962,506.9499,297.5962,515.9499" style="stroke:#475569;stroke-width:1;"/><path d="M297.5962,475.4672 C297.5962,488.3502 297.5962,497.0688 297.5962,509.9499" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v1" data-entity-2="p1" data-uid="lnk16" id="link_v1_p1"><polygon fill="#475569" points="478.2629,102.1982,469.2629,98.1982,473.2629,102.1982,469.2629,106.1982,478.2629,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M460.8491,102.1982 C466.6537,102.1982 466.4583,102.1982 472.2629,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v2" data-entity-2="p2" data-uid="lnk17" id="link_v2_p2"><polygon fill="#475569" points="425.9176,215.1982,416.9176,211.1982,420.9176,215.1982,416.9176,219.1982,425.9176,215.1982" style="stroke:#475569;stroke-width:1;"/><path d="M407.6899,215.1982 C413.7658,215.1982 413.8417,215.1982 419.9176,215.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v3" data-entity-2="p3" data-uid="lnk18" id="link_v3_p3"><polygon fill="#475569" points="459.0733,328.1982,450.0733,324.1982,454.0733,328.1982,450.0733,332.1982,459.0733,328.1982" style="stroke:#475569;stroke-width:1;"/><path d="M441.3794,328.1982 C447.2774,328.1982 447.1753,328.1982 453.0733,328.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v4" data-entity-2="p4" data-uid="lnk19" id="link_v4_p4"><polygon fill="#475569" points="459.5024,441.1982,450.5024,437.1982,454.5024,441.1982,450.5024,445.1982,459.5024,441.1982" style="stroke:#475569;stroke-width:1;"/><path d="M441.7095,441.1982 C447.6405,441.1982 447.5714,441.1982 453.5024,441.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v5" data-entity-2="p5" data-uid="lnk20" id="link_v5_p5"><polygon fill="#475569" points="487.3692,550.1982,478.3692,546.1982,482.3692,550.1982,478.3692,554.1982,487.3692,550.1982" style="stroke:#475569;stroke-width:1;"/><path d="M469.3696,550.1982 C475.3695,550.1982 475.3693,550.1982 481.3692,550.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="26"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="923.6924" x="5" y="598.8301">Left: the Dockerfile. Right: what each version got wrong or right. The transcript of an interactive session is the starting point, never the finished image.</text></g><!--SRC=[XLRDJYD74Bxp59Kzh43hiMD-BYonj0HMGU5dPLX5gv13kwTdfiLCzwYx1-CS4ASyGBJ7pJMla7iUXIV9LpqUOnjG96JKFrNrrLVrLSztsiYoIHNr-uFsBrXR-a6gHUv4vGStqeWa5AfI_RgfoesWGwdegb0aAn6SlgCZAs-KopIsjQ5CtogwLSvhQpmzFdobQI42oKAONAKaJDfkw82