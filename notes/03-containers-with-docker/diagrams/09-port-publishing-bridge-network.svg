<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="575px" preserveAspectRatio="none" style="width:1143px;height:575px;background:#FFFFFF;" version="1.1" viewBox="0 0 1143 575" width="1143px" zoomAndPan="magnify"><title>docker run -p 12345:80 nginx &#8212; how a request reaches a container's port</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="626.4756" x="254.3564" y="30.8838">docker run -p 12345:80 nginx &#8212; how a request reaches a container's port</text></g><!--cluster host--><g class="cluster" data-entity="host" data-source-line="6" data-uid="ent0003" id="cluster_host"><rect fill="#F8FAFC" height="363" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="637" x="260.5942" y="160.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="313.479" x="422.3547" y="178.8921">Docker host (the Desktop VM on Windows/macOS)</text></g><!--cluster ctr--><g class="cluster" data-entity="ctr" data-source-line="9" data-uid="ent0006" id="cluster_ctr"><rect fill="#F0FDF4" height="122" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="419" x="470.5942" y="393.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="273.0508" x="543.5688" y="411.8921">Container nginx &#8212; own network namespace</text></g><!--entity browser--><g class="entity" data-entity="browser" data-source-line="4" data-uid="ent0002" id="entity_browser"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="132.5752" x="435.0942" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.3081" x="449.0942" y="79.8921">Your browser</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="104.5752" x="449.0942" y="92.9648">http://localhost:12345</text></g><!--entity hostns--><g class="entity" data-entity="hostns" data-source-line="7" data-uid="ent0004" id="entity_hostns"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="368.5327" x="317.0942" y="193.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.7744" x="331.0942" y="219.8921">Host network namespace</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.8906" x="331.0942" y="232.9648">eth0 &#183; port 12345 listening on 0.0.0.0</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="340.5327" x="331.0942" y="245.6138">iptables DNAT: :12345 &#8594; 172.17.0.2:80 (docker-proxy as fallback)</text></g><!--entity bridge--><g class="entity" data-entity="bridge" data-source-line="8" data-uid="ent0005" id="entity_bridge"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="325.0537" x="339.0942" y="298.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="275.9326" x="353.0942" y="324.8921">docker0 bridge &#8212; the default bridge network</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="293.439" x="353.0942" y="337.9648">172.17.0.0/16 &#183; gateway 172.17.0.1 &#183; NAT out to the world</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="297.0537" x="353.0942" y="350.6138">no DNS by container name (user-defined bridges have it)</text></g><!--entity other--><g class="entity" data-entity="other" data-source-line="14" data-uid="ent0010" id="entity_other"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="191.3379" x="269.0942" y="433.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3379" x="283.0942" y="459.3921">Container app &#8212; 172.17.0.3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="159.6021" x="283.0942" y="472.4648">can reach 172.17.0.2:80 directly,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="104.5913" x="283.0942" y="485.1138">no publishing needed</text></g><!--entity veth--><g class="entity" data-entity="veth" data-source-line="10" data-uid="ent0007" id="entity_veth"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="143.5107" x="478.5942" y="439.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="91.7871" x="492.5942" y="465.3921">eth0 172.17.0.2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="115.5107" x="492.5942" y="478.4648">veth pair to the bridge</text></g><!--entity nginx--><g class="entity" data-entity="nginx" data-source-line="11" data-uid="ent0008" id="entity_nginx"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="213.2168" x="668.0942" y="426.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133.6182" x="682.0942" y="452.8921">nginx listening on :80</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="131.4307" x="682.0942" y="465.9648">EXPOSE 80 in the image;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="185.2168" x="682.0942" y="478.6138">reachable from the bridge, invisible</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="147.8823" x="682.0942" y="491.2627">from outside until published</text></g><g class="link" data-entity-1="hostns" data-entity-2="bridge" data-uid="lnk11" id="link_hostns_bridge"><polygon fill="#475569" points="501.5942,298.6036,505.5942,289.6036,501.5942,293.6036,497.5942,289.6036,501.5942,298.6036" style="stroke:#475569;stroke-width:1;"/><path d="M501.5942,261.855 C501.5942,273.6168 501.5942,280.847 501.5942,292.6036" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="bridge" data-entity-2="veth" data-uid="lnk12" id="link_bridge_veth"><polygon fill="#475569" points="540.4902,438.876,541.1202,429.0473,538.7559,434.1864,533.6168,431.8221,540.4902,438.876" style="stroke:#475569;stroke-width:1;"/><path d="M513.8326,366.7918 C522.0531,389.0207 530.6739,412.3321 538.409,433.2485" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="bridge" data-entity-2="other" data-uid="lnk13" id="link_bridge_other"><polygon fill="#475569" points="398.8503,433.0674,408.1005,429.6858,402.4444,429.5913,402.5388,423.9353,398.8503,433.0674" style="stroke:#475569;stroke-width:1;"/><path d="M467.3768,366.7918 C446.4535,387.0278 424.0935,408.6533 403.1632,428.8961" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="browser" data-entity-2="hostns" data-uid="lnk14" id="link_browser_hostns"><polygon fill="#475569" points="501.5942,193.6674,505.5942,184.6674,501.5942,188.6674,497.5942,184.6674,501.5942,193.6674" style="stroke:#475569;stroke-width:1;"/><path d="M501.5942,109.7835 C501.5942,133.5731 501.5942,162.255 501.5942,187.6674" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.0605" x="507.5942" y="144.9541">TCP to host:12345</text></g><g class="link" data-entity-1="veth" data-entity-2="nginx" data-uid="lnk15" id="link_veth_nginx"><polygon fill="#475569" points="667.9629,467.1982,658.9629,463.1982,662.9629,467.1982,658.9629,471.1982,667.9629,467.1982" style="stroke:#475569;stroke-width:1;"/><path d="M622.7022,467.1982 C637.1544,467.1982 646.6259,467.1982 661.9629,467.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="16.6816" x="637.3442" y="456.4541">:80</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1125.1885" x="5" y="543.8301">-p HOST:CONTAINER publishes one port (add 127.0.0.1: to keep it local; /udp for UDP). -P publishes every EXPOSEd port to a random high host port &#8212; docker port C shows which.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1004.6367" x="65.2759" y="559.9287">Container-to-container traffic on the same network never needs -p. The host driver drops the namespace entirely (Linux only); the none driver gives loopback only.</text></g><!--SRC=[TLJ1RXit4BtlLqnogGnaToMxZGDP413OHXoWjOrOIHkaFL0ajKk88XcIAra90kIK3oZwBxttK_mb6PBhrSfE8KE2EPp7z-RDp1EXg6mOXw8eqv_NMhgI2L9PidBbaYgI-vglU66QbSoyy983qtJ9BTX6GMvWT7Zqyo_Z5qDGbL2tSFVr7wZr1WXO_h7XpkCleJLtU4AryaGeRdzoOBJrMMOvzKHL2FhqlMuipAtUE6x_L1CdFl7nQ3IjlJVZi