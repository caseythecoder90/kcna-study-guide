<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="768px" preserveAspectRatio="none" style="width:1134px;height:768px;background:#FFFFFF;" version="1.1" viewBox="0 0 1134 768" width="1134px" zoomAndPan="magnify"><title>OverlayFS &#8212; how the layers become one filesystem the process can write to</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="656.2354" x="235.2383" y="30.8838">OverlayFS &#8212; how the layers become one filesystem the process can write to</text></g><!--cluster upper--><g class="cluster" data-entity="upper" data-source-line="6" data-uid="ent0003" id="cluster_upper"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="722" x="295.606" y="160.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="251.6021" x="530.8049" y="178.8921">upperdir &#8212; the container's writable layer</text></g><!--cluster lower--><g class="cluster" data-entity="lower" data-source-line="14" data-uid="ent0009" id="cluster_lower"><rect fill="#F8FAFC" height="404" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="432" x="259.606" y="312.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="408.2114" x="271.5002" y="330.8921">lowerdir &#8212; the image layers, read-only (overlay2 stacks up to 128)</text></g><!--entity merged--><g class="entity" data-entity="merged" data-source-line="4" data-uid="ent0002" id="entity_merged"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="391.1128" x="116.106" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="239.8589" x="130.106" y="79.8921">merged &#8212; what the container sees as /</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="363.1128" x="130.106" y="92.9648">the union view: every file from every layer, top layer wins on conflicts</text></g><!--entity u1--><g class="entity" data-entity="u1" data-source-line="7" data-uid="ent0004" id="entity_u1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="151.4868" x="338.106" y="199.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.7637" x="352.106" y="225.8921">/tmp/out.txt</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="123.4868" x="352.106" y="238.9648">new file: lives only here</text></g><!--entity u2--><g class="entity" data-entity="u2" data-source-line="8" data-uid="ent0005" id="entity_u2"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="240.6792" x="507.106" y="193.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.7827" x="521.106" y="219.8921">/etc/motd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.4814" x="521.106" y="232.9648">copied up from a lower layer on first</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="212.6792" x="521.106" y="245.6138">write, then modified here (copy-on-write)</text></g><!--entity u3--><g class="entity" data-entity="u3" data-source-line="9" data-uid="ent0006" id="entity_u3"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="242.543" x="766.106" y="193.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="84.5381" x="780.106" y="219.8921">.wh.examples</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.543" x="780.106" y="232.9648">whiteout: hides /examples from the view;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="160.311" x="780.106" y="245.6138">the image's copy is untouched</text></g><!--entity d5--><g class="entity" data-entity="d5" data-source-line="15" data-uid="ent0010" id="entity_d5"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="132.0444" x="409.606" y="345.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0444" x="423.606" y="371.8921">layer 5 &#183; /menu.sh</text></g><!--entity d4--><g class="entity" data-entity="d4" data-source-line="16" data-uid="ent0011" id="entity_d4"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="146.4917" x="402.606" y="425.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.4917" x="416.606" y="451.8921">layer 4 &#183; /examples/*</text></g><!--entity d3--><g class="entity" data-entity="d3" data-source-line="17" data-uid="ent0012" id="entity_d3"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="201.4243" x="375.106" y="505.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.4243" x="389.106" y="531.8921">layer 3 &#183; /usr/local/bin/youtube</text></g><!--entity d2--><g class="entity" data-entity="d2" data-source-line="18" data-uid="ent0013" id="entity_d2"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="278.0405" x="336.606" y="585.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.0405" x="350.606" y="611.8921">layer 2 &#183; apt-get update output, /var/lib/apt/*</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="19" data-uid="ent0014" id="entity_d1"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="343.7451" x="303.606" y="665.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.7451" x="317.606" y="691.8921">layer 1 &#183; debian: /bin /etc /lib /usr &#8230; (/etc/motd original)</text></g><g class="link" data-entity-1="merged" data-entity-2="upper" data-uid="lnk19" id="link_merged_upper"><polygon fill="#475569" points="311.606,160.4753,315.606,151.4753,311.606,155.4753,307.606,151.4753,311.606,160.4753" style="stroke:#475569;stroke-width:1;"/><path d="M311.606,109.7835 C311.606,117.727 311.606,126.8848 311.606,136.5065 C311.606,141.3173 311.606,146.2441 311.606,151.1931 C311.606,153.6675 311.606,156.1475 311.606,158.6213 C311.606,159.2398 311.606,153.8578 311.606,154.4753" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.7539" x="317.606" y="144.9541">writes and deletes go here</text></g><g class="link" data-entity-1="upper" data-entity-2="lower" data-uid="lnk20" id="link_upper_lower"><polygon fill="#475569" points="311.606,312.4711,315.606,303.4711,311.606,307.4711,307.606,303.4711,311.606,312.4711" style="stroke:#475569;stroke-width:1;"/><path d="M311.606,270.0472 C311.606,270.3706 311.606,270.6949 311.606,271.0202 C311.606,271.6708 311.606,272.3251 311.606,272.9828 C311.606,275.6137 311.606,278.2996 311.606,281.022 C311.606,286.4667 311.606,292.0575 311.606,297.6465 C311.606,300.441 311.606,303.2351 311.606,306.0102 C311.606,307.3978 311.606,308.7807 311.606,310.1565 C311.606,310.8444 311.606,311.5306 311.606,312.2147 C311.606,312.3002 311.606,306.3857 311.606,306.4711" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.1758" x="317.606" y="296.9541">reads fall through when the upper layer has no copy</text></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1116.7119" x="5" y="736.8301">Read: check upperdir, else the highest lower layer that has the file. Write to an existing file: copy_up into upperdir, then modify &#8212; the image never changes. Delete: write a whiteout.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="867.6445" x="129.5337" y="752.9287">A union filesystem merges directories into a single view; OverlayFS is the one in the Linux kernel that Docker (overlay2) and containerd use.</text></g><!--SRC=[RLNDYkD64BxxAIfxsPbWIzYUWU0OGs3PN0A1v9339eHsTragfjKjrAtHE26GXyWpx2liFO-I9qbLjpmZ_u0FSglhgw-gllhq5JbjUuDG56N-HUzjA0sfgbDDA9-qKujOOuD5spTs5YbQX1-ViRFg-F5d-E_lVw3s0_0Lu1Fi0knH-mR1EuG3MGp74B595zhEQmm1j78mT1GHef_DEjHHkOfXtpNOLMWIw52hc8AqTr6Hmmu2OW0LeFpLRGFzWPlbSYStUaVUmJFXi05aPiUK5mwTRyR_YTcSixNv4GPoWHaA-C6IZc5R2kBk7MotIcjqSRUJL9dG6SU-RR4pr2MMPmJVXrILsjkn5u9MTRvll_VUPC0K3N_E02QGPMpQqlUnY2znKfl38LMo0KlFA7pj4MhiS4AsUaDUNe1Yr6NZevaWQjyIzxTlStCKM3ymdTmJRiU1kX17z4bOcjLSYdNGU4C70H4YSCU8nuLtYtJb_ZQnrJcnOgWBV55DozgO9gaPWPkmWPeCLrkUxcIkqcaPyRVNzEGLDQf27e3m0UAaBlfUrsWcbFRgn6ZDZFebB3vnAeFkjuwgEYvscMg_kl5YFVlhJ0MfSLCL90BZ2iov