<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="578px" preserveAspectRatio="none" style="width:1127px;height:578px;background:#FFFFFF;" version="1.1" viewBox="0 0 1127 578" width="1127px" zoomAndPan="magnify"><title>What a digest points at &#8212; the content-addressable tree behind spurin/funbox:latest</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="713.0742" x="203.2949" y="30.8838">What a digest points at &#8212; the content-addressable tree behind spurin/funbox:latest</text></g><!--entity tag--><g class="entity" data-entity="tag" data-source-line="4" data-uid="ent0002" id="entity_tag"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="381.4019" x="405.082" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.3589" x="419.082" y="87.8921">Tag: spurin/funbox:latest</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="353.4019" x="419.082" y="100.9648">a mutable label in the registry &#8212; can be moved to new content tomorrow</text></g><!--entity index--><g class="entity" data-entity="index" data-source-line="6" data-uid="ent0003" id="entity_index"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="292.7036" x="449.082" y="178.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.2617" x="463.082" y="204.8921">Image index (manifest list)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="264.7036" x="463.082" y="217.9648">sha256:8a01842&#8230; &#8212; THE digest docker pull prints</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.5845" x="463.082" y="230.6138">application/vnd.oci.image.index.v1+json</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.416" x="463.082" y="243.2627">lists one manifest per platform + attestations</text></g><!--entity m_arm--><g class="entity" data-entity="m_arm" data-source-line="8" data-uid="ent0004" id="entity_m_arm"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="156.5972" x="241.082" y="328.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.5972" x="255.082" y="354.3921">Manifest linux/arm64</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="92.3398" x="255.082" y="367.4648">sha256:e5ca9f9&#8230;</text></g><!--entity m_amd--><g class="entity" data-entity="m_amd" data-source-line="9" data-uid="ent0005" id="entity_m_amd"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="150.8398" x="416.082" y="328.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.8398" x="430.082" y="354.3921">Manifest linux/amd64</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="92.3506" x="430.082" y="367.4648">sha256:ad1c719&#8230;</text></g><!--entity m_other--><g class="entity" data-entity="m_other" data-source-line="10" data-uid="ent0006" id="entity_m_other"><rect fill="#FFFFFF" height="70.5464" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="230.2998" x="585.582" y="320.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.2998" x="599.582" y="346.8921">Manifest linux/386, arm/v6, arm/v7,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0635" x="599.582" y="361.8408">ppc64le, s390x &#8230;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="80.0991" x="599.582" y="374.9136">one per platform</text></g><!--entity att--><g class="entity" data-entity="att" data-source-line="11" data-uid="ent0007" id="entity_att"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="188.7944" x="834.082" y="322.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6689" x="848.082" y="348.3921">Attestation manifests</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.7944" x="848.082" y="361.4648">SBOM / provenance per platform</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="139.4175" x="848.082" y="374.1138">os: unknown, arch: unknown</text></g><!--entity cfg--><g class="entity" data-entity="cfg" data-source-line="13" data-uid="ent0008" id="entity_cfg"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="210.1768" x="103.582" y="441.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.1982" x="117.582" y="467.3921">Config blob</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="182.1768" x="117.582" y="480.4648">sha256:e4475d4&#8230; &#8212; the IMAGE ID</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.2114" x="117.582" y="493.1138">(classic store): ENV, CMD, USER,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="154.0537" x="117.582" y="505.7627">history, ordered layer digests</text></g><!--entity layers--><g class="entity" data-entity="layers" data-source-line="14" data-uid="ent0009" id="entity_layers"><rect fill="#DCFCE7" height="106.1934" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="199.1714" x="332.082" y="428.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.4399" x="346.082" y="454.8921">Layer blobs (tar+gzip)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="165.0645" x="346.082" y="467.9648">sha256:82312fc&#8230; debian rootfs</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.1714" x="346.082" y="480.6138">sha256:816f929&#8230; apt-get update</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140.626" x="346.082" y="493.2627">sha256:5001ce9&#8230; youtube</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="148.5967" x="346.082" y="505.9116">sha256:4ab2772&#8230; examples</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140.626" x="346.082" y="518.5605">sha256:16e40fe&#8230; menu.sh</text></g><g class="link" data-entity-1="tag" data-entity-2="index" data-uid="lnk10" id="link_tag_index"><polygon fill="#475569" points="595.582,178.6098,599.582,169.6098,595.582,173.6098,591.582,169.6098,595.582,178.6098" style="stroke:#475569;stroke-width:1;"/><path d="M595.582,117.7377 C595.582,135.4276 595.582,152.8383 595.582,172.6098" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.707" x="601.582" y="152.9541">resolves to (today)</text></g><g class="link" data-entity-1="index" data-entity-2="m_arm" data-uid="lnk11" id="link_index_m_arm"><polygon fill="#475569" points="360.7065,328.064,370.4485,326.6171,364.9276,325.3841,366.1606,319.8632,360.7065,328.064" style="stroke:#475569;stroke-width:1;"/><path d="M488.2817,259.7336 C474.7657,265.4234 461.2472,271.4718 448.582,277.6982 C418.2188,292.6255 390.6297,309.0665 365.7719,324.8481" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="70.0254" x="454.582" y="294.9541">your platform</text></g><g class="link" data-entity-1="index" data-entity-2="m_amd" data-uid="lnk12" id="link_index_m_amd"><polygon fill="#475569" points="512.4638,328.0921,521.1251,323.4035,515.5152,324.1311,514.7876,318.5213,512.4638,328.0921" style="stroke:#475569;stroke-width:1;"/><path d="M564.9411,259.9725 C548.0445,281.9056 531.1681,303.8125 516.1255,323.3389" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="index" data-entity-2="m_other" data-uid="lnk13" id="link_index_m_other"><polygon fill="#475569" points="673.431,320.2898,671.0629,310.7298,670.3613,316.343,664.7481,315.6414,673.431,320.2898" style="stroke:#475569;stroke-width:1;"/><path d="M626.5176,259.9725 C641.3989,279.1056 655.3943,297.0997 669.7473,315.5536" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="index" data-entity-2="att" data-uid="lnk14" id="link_index_att"><polygon fill="#475569" points="846.94,322.1001,840.1021,315.0118,842.3063,320.2216,837.0965,322.4257,846.94,322.1001" style="stroke:#475569;stroke-width:1;"/><path d="M693.243,259.7905 C742.0845,279.5911 794.9575,301.0262 841.3795,319.8459" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="m_arm" data-entity-2="cfg" data-uid="lnk15" id="link_m_arm_cfg"><polygon fill="#475569" points="244.2651,440.9968,253.2563,436.977,247.6074,437.2781,247.3063,431.6293,244.2651,440.9968" style="stroke:#475569;stroke-width:1;"/><path d="M295.2226,384.3008 C280.2893,400.9159 264.9195,418.0165 248.2759,436.5343" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="m_arm" data-entity-2="layers" data-uid="lnk16" id="link_m_arm_layers"><polygon fill="#475569" points="384.0522,428.2882,380.9693,418.9343,380.6934,424.5844,375.0432,424.3085,384.0522,428.2882" style="stroke:#475569;stroke-width:1;"/><path d="M344.1609,384.3008 C355.8804,397.2236 366.2837,408.6952 380.0216,423.8436" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1100.7979" x="9.4331" y="546.8301">Every arrow is a digest = sha256 of the exact bytes of the thing it points to. Hash the raw index JSON and you get 8a01842&#8230; back; hash a layer file and you get its own filename.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1109.6641" x="5" y="562.9287">docker save (containerd store) writes exactly this tree as an OCI Image Layout: index.json &#8594; blobs/sha256/DIGEST for the index, the platform manifest, the config, and each layer.</text></g><!--SRC=[VLNTRXf75BxdAKvpXUM51Op1fXGfjL52LSTIxBGtaQgpCxFBrBipgvbPVdALgpv0rMV8W_b9UcQNnKl0aInXXlFpVT_v-qagbXPSGBSRLdzEwzI6N69YCBFX4r