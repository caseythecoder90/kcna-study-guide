<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="581px" preserveAspectRatio="none" style="width:1280px;height:581px;background:#FFFFFF;" version="1.1" viewBox="0 0 1280 581" width="1280px" zoomAndPan="magnify"><title>One kernel, two containers &#8212; namespaces decide what each process can SEE, cgroups decide how much it can USE</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="1002.3223" x="131.3389" y="30.8838">One kernel, two containers &#8212; namespaces decide what each process can SEE, cgroups decide how much it can USE</text></g><!--cluster a--><g class="cluster" data-entity="a" data-source-line="4" data-uid="ent0002" id="cluster_a"><rect fill="#F0FDF4" height="476" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="282" x="14" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="182.0317" x="63.9841" y="71.8921">Container A &#8212; process nginx</text></g><!--cluster b--><g class="cluster" data-entity="b" data-source-line="16" data-uid="ent0012" id="cluster_b"><rect fill="#F0FDF4" height="476" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="336" x="938" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="172.6689" x="1019.6655" y="71.8921">Container B &#8212; process java</text></g><!--entity kernel--><g class="entity" data-entity="kernel" data-source-line="29" data-uid="ent0023" id="entity_kernel"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="552.498" x="341" y="178.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="254.9854" x="355" y="204.8921">The ONE shared Linux kernel on the host</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="524.498" x="355" y="217.9648">schedules both processes, owns the real hardware, enforces the namespaces and the cgroup limits.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="353.9336" x="355" y="230.6138">Both containers report the same kernel: uname -r &#8594; 5.15.49-linuxkit</text></g><!--entity host--><g class="entity" data-entity="host" data-source-line="30" data-uid="ent0024" id="entity_host"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="624.8574" x="304.5" y="289.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="596.8574" x="318.5" y="315.3921">Host view: ps shows nginx as PID 41230 and java as PID 41305 &#8212; ordinary processes with extra labels</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="5" data-uid="ent0003" id="entity_a1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="231.3013" x="22.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.5044" x="36.5" y="112.8921">pid: sees itself as PID 1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="203.3013" x="36.5" y="125.9648">cannot see the host's or B's processes</text></g><!--entity a2--><g class="entity" data-entity="a2" data-source-line="6" data-uid="ent0004" id="entity_a2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="216.5571" x="30.5" y="184.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="188.5571" x="44.5" y="210.8921">net: eth0 10.244.1.5, own ports</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="179.2495" x="44.5" y="223.9648">its port 80 is not the host's port 80</text></g><!--entity a3--><g class="entity" data-entity="a3" data-source-line="7" data-uid="ent0005" id="entity_a3"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="237.0591" x="25.5" y="282.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.8931" x="39.5" y="308.8921">mnt: / is the image's rootfs</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="209.0591" x="39.5" y="321.9648">own /usr, /etc, /lib from the image layers</text></g><!--entity a4--><g class="entity" data-entity="a4" data-source-line="8" data-uid="ent0006" id="entity_a4"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="249.7671" x="22" y="374.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.1362" x="36" y="400.8921">uts: hostname = a3f9c2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="184.6045" x="36" y="413.9648">ipc: own message queues and shm</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.7671" x="36" y="426.6138">user: UID 0 inside &#8800; root outside (optional)</text></g><!--entity a5--><g class="entity" data-entity="a5" data-source-line="9" data-uid="ent0007" id="entity_a5"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="241.8398" x="26" y="478.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="213.8398" x="40" y="504.8921">cgroup: cpu 500m &#183; memory 256Mi</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="17" data-uid="ent0013" id="entity_b1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="285.3398" x="980.5" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.5718" x="994.5" y="112.8921">pid: also PID 1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="257.3398" x="994.5" y="125.9648">same number, different namespace &#8212; no conflict</text></g><!--entity b2--><g class="entity" data-entity="b2" data-source-line="18" data-uid="ent0014" id="entity_b2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="216.5571" x="1014.5" y="184.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="188.5571" x="1028.5" y="210.8921">net: eth0 10.244.1.6, own ports</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="107.5938" x="1028.5" y="223.9648">can also listen on 80</text></g><!--entity b3--><g class="entity" data-entity="b3" data-source-line="19" data-uid="ent0015" id="entity_b3"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="236.2349" x="1005" y="282.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.2349" x="1019" y="308.8921">mnt: / is a different image's rootfs</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="158.9307" x="1019" y="321.9648">a different glibc, JDK, libraries</text></g><!--entity b4--><g class="entity" data-entity="b4" data-source-line="20" data-uid="ent0016" id="entity_b4"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="176.459" x="1035" y="380.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="148.459" x="1049" y="406.8921">uts: hostname = 7be1d0</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.7783" x="1049" y="419.9648">ipc, user: likewise isolated</text></g><!--entity b5--><g class="entity" data-entity="b5" data-source-line="21" data-uid="ent0017" id="entity_b5"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="200.6436" x="1022.5" y="478.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="172.6436" x="1036.5" y="504.8921">cgroup: cpu 2 &#183; memory 2Gi</text></g><g class="link" data-entity-1="a" data-entity-2="kernel" data-uid="lnk25" id="link_a_kernel"><polygon fill="#475569" points="500.9353,178.6353,493.3755,172.3226,496.1266,177.2655,491.1837,180.0165,500.9353,178.6353" style="stroke:#475569;stroke-width:1;"/><path d="M296.4647,120.3885 C297.0887,120.5662 297.7285,120.7485 298.3837,120.9351 C299.6941,121.3084 301.0663,121.6993 302.4973,122.107 C308.2217,123.7377 314.8893,125.637 322.3241,127.755 C337.1936,131.9908 355.1314,137.1007 374.728,142.6831 C413.9212,153.8479 453.9789,165.259 495.1648,176.9915" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="b" data-entity-2="kernel" data-uid="lnk26" id="link_b_kernel"><polygon fill="#475569" points="733.0647,178.6353,742.8163,180.0165,737.8734,177.2655,740.6245,172.3226,733.0647,178.6353" style="stroke:#475569;stroke-width:1;"/><path d="M937.5353,120.3885 C936.9113,120.5662 936.2715,120.7485 935.6163,120.9351 C934.3059,121.3084 932.9337,121.6993 931.5027,122.107 C925.7783,123.7377 919.1107,125.637 911.6759,127.755 C896.8064,131.9908 878.8686,137.1007 859.272,142.6831 C820.0788,153.8479 780.0211,165.259 738.8352,176.9915" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="kernel" data-entity-2="host" data-uid="lnk27" id="link_kernel_host"><polygon fill="#475569" points="617,288.9176,621,279.9176,617,283.9176,613,279.9176,617,288.9176" style="stroke:#475569;stroke-width:1;"/><path d="M617,246.736 C617,260.7292 617,270.6073 617,282.9176" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="36"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="882.7725" x="191.1138" y="549.8301">Namespaces = isolation of visibility (each process gets its own copy of a global resource: PIDs, network stack, mounts, hostname, IPC, users).</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="771.4902" x="246.7549" y="565.9287">cgroups = limits, prioritisation, accounting and control of resources (CPU, memory, I/O, PIDs). Together they are a container.</text></g><!--SRC=[XLRDRkCs4BxxAQPxQGB8ikNOswxW66YomUxsPnDWDwUs1ueQMwmfKYMfTToYG4y5UYtw07sBtlieUP8EAJcMAxiB10am8kVxPhvlXlb4A2xh726EHysFqrhQKIxOoh3IZjPSiQ4hiCIugaivSC99X5k5i4QZK4RWDXguLeu9XSR2uwz_Wc8bsefnj90Z5vH-Kp07o7W1bT4Kjy2PWdStDn7mbT5rzNIoq1ieQpeeN3Xp_-vcC3387LChGdvslOE2BmBMBfzQ2VNm3ERpaEwLrlbY0Sm2Wv