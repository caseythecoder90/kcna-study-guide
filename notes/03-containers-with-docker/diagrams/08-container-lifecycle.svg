<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="668px" preserveAspectRatio="none" style="width:977px;height:668px;background:#FFFFFF;" version="1.1" viewBox="0 0 977 668" width="977px" zoomAndPan="magnify"><title>Container lifecycle &#8212; the states docker ps reports and the commands that move between them</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="813.2168" x="16.2554" y="30.8838">Container lifecycle &#8212; the states docker ps reports and the commands that move between them</text></g><!--entity img--><g class="entity" data-entity="img" data-source-line="4" data-uid="ent0002" id="entity_img"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="72.0654" x="318.3638" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0654" x="332.3638" y="87.8921">(image)</text></g><!--entity created--><g class="entity" data-entity="created" data-source-line="5" data-uid="ent0003" id="entity_created"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="249.9443" x="118.3638" y="165.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.3608" x="132.3638" y="191.8921">created</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="221.9443" x="132.3638" y="204.9648">writable layer and config exist, no process yet</text></g><!--entity running--><g class="entity" data-entity="running" data-source-line="6" data-uid="ent0004" id="entity_running"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="83.0322" x="314.8638" y="288.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="48.3755" x="328.8638" y="314.8921">running</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="55.0322" x="328.8638" y="327.9648">PID 1 alive</text></g><!--entity paused--><g class="entity" data-entity="paused" data-source-line="7" data-uid="ent0005" id="entity_paused"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="221.8213" x="512.3638" y="282.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="42.6499" x="526.3638" y="308.8921">paused</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="193.8213" x="526.3638" y="321.9648">processes frozen by the cgroup freezer;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.5723" x="526.3638" y="334.6138">memory kept</text></g><!--entity exited--><g class="entity" data-entity="exited" data-source-line="8" data-uid="ent0006" id="entity_exited"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="255.3799" x="417.8638" y="439.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="37.5718" x="431.8638" y="465.8921">exited</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="227.3799" x="431.8638" y="478.9648">PID 1 ended; writable layer, logs and config</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.4868" x="431.8638" y="491.6138">still on disk &#8212; docker ps -a shows it</text></g><!--entity gone--><g class="entity" data-entity="gone" data-source-line="9" data-uid="ent0007" id="entity_gone"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="253.6074" x="196.3638" y="568.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.2363" x="210.3638" y="594.8921">(removed)</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.6074" x="210.3638" y="607.9648">writable layer deleted; named volumes survive</text></g><g class="link" data-entity-1="img" data-entity-2="created" data-uid="lnk8" id="link_img_created"><polygon fill="#475569" points="266.0293,165.4928,274.9462,161.3107,269.3037,161.7141,268.9003,156.0717,266.0293,165.4928" style="stroke:#475569;stroke-width:1;"/><path d="M327.0591,104.8391 C320.1205,110.4214 312.809,116.6091 306.3638,122.6982 C292.2209,136.0597 281.5427,147.5904 269.9586,160.9584" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.7031" x="312.3638" y="139.9541">docker create</text></g><g class="link" data-entity-1="created" data-entity-2="running" data-uid="lnk9" id="link_created_running"><polygon fill="#475569" points="331.089,288.6341,327.8696,279.3263,327.6763,284.9798,322.0228,284.7866,331.089,288.6341" style="stroke:#475569;stroke-width:1;"/><path d="M268.7232,221.853 C287.3334,241.7807 308.4035,264.3426 326.9938,284.249" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="62.6895" x="313.3638" y="256.9541">docker start</text></g><g class="link" data-entity-1="img" data-entity-2="running" data-uid="lnk10" id="link_img_running"><polygon fill="#475569" points="374.9958,288.4366,382.8964,282.556,377.4485,284.0795,375.925,278.6317,374.9958,288.4366" style="stroke:#475569;stroke-width:1;"/><path d="M378.9422,104.9388 C383.6003,110.208 387.8105,116.2292 390.3638,122.6982 C399.5128,145.8781 421.0793,140.4332 385.3638,264.6982 C383.0285,272.8233 382.1023,275.8122 377.9391,283.2081" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.7363" x="411.3638" y="198.4541">docker run = create + start</text></g><g class="link" data-entity-1="running" data-entity-2="paused" data-uid="lnk11" id="link_running_paused"><polygon fill="#475569" points="512.1546,346.4426,502.6799,343.7537,507.2047,347.1487,503.8097,351.6735,512.1546,346.4426" style="stroke:#475569;stroke-width:1;"/><path d="M398.0226,339.8679 C402.9902,341.8391 408.0852,343.5252 413.1138,344.6982 C444.9406,352.1225 474.0294,351.8813 506.2147,347.2899" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="72.0469" x="419.1138" y="336.9541">docker pause</text></g><g class="link" data-entity-1="running" data-entity-2="paused" data-uid="lnk13" id="link_running_paused"><polygon fill="#475569" points="398.0825,316.6982,407.0825,320.6982,403.0825,316.6982,407.0825,312.6982,398.0825,316.6982" style="stroke:#475569;stroke-width:1;"/><path d="M404.0825,316.6982 C434.736,316.6982 471.9024,316.6982 512.2582,316.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="85.3945" x="412.6138" y="305.9541">docker unpause</text></g><g class="link" data-entity-1="running" data-entity-2="exited" data-uid="lnk14" id="link_running_exited"><polygon fill="#475569" points="654.6206,439.6102,664.1473,437.1117,658.5251,436.4869,659.1499,430.8646,654.6206,439.6102" style="stroke:#475569;stroke-width:1;"/><path d="M397.935,328.3618 C427.2383,335.5508 467.4935,344.7702 503.3638,350.6982 C540.4083,356.8203 646.2681,340.7701 671.3638,368.6982 C687.1079,386.2193 684.5297,402.1656 671.3638,421.6982 C666.7472,428.5473 665.7231,430.7287 659.3059,435.8622" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.7852" x="687.3638" y="385.9541">docker stop &#8212; SIGTERM, 10 s grace, then SIGKILL</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.7285" x="733.3921" y="399.7529">docker kill &#8212; SIGKILL immediately</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.0391" x="767.7368" y="413.5518">or PID 1 exits by itself</text></g><g class="link" data-entity-1="running" data-entity-2="exited" data-uid="lnk16" id="link_running_exited"><polygon fill="#475569" points="346.872,344.9217,340.6853,352.5849,345.5819,349.7524,348.4144,354.6491,346.872,344.9217" style="stroke:#475569;stroke-width:1;"/><path d="M345.3239,350.7186 C339.2196,373.576 336.7362,400.0774 353.3638,421.6982 C355.9065,425.0046 383.9508,433.0962 417.8579,441.8838" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0508" x="437.73" y="392.9541">docker start / docker restart</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.7832" x="359.3638" y="406.7529">(or --restart policy: always, unless-stopped, on-failure[:n])</text></g><g class="link" data-entity-1="exited" data-entity-2="gone" data-uid="lnk17" id="link_exited_gone"><polygon fill="#475569" points="373.0985,568.5906,382.9152,567.7956,377.4887,566.1977,379.0866,560.7712,373.0985,568.5906" style="stroke:#475569;stroke-width:1;"/><path d="M484.7013,507.762 C449.6538,526.8645 411.3803,547.7253 378.3668,565.7191" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="53.3438" x="454.3638" y="542.9541">docker rm</text></g><g class="link" data-entity-1="running" data-entity-2="gone" data-uid="lnk18" id="link_running_gone"><polygon fill="#475569" points="322.6257,568.4401,326.5,559.3852,322.5561,563.4405,318.5008,559.4966,322.6257,568.4401" style="stroke:#475569;stroke-width:1;"/><path d="M345.3388,344.8547 C342.6496,352.4578 340.0613,360.8038 338.3638,368.6982 C323.1282,439.5533 321.9437,519.4637 322.5421,562.4406" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.0078" x="334.3638" y="478.4541">docker rm -f</text></g><g class="link" data-entity-1="created" data-entity-2="gone" data-uid="lnk19" id="link_created_gone"><polygon fill="#475569" points="311.1906,568.6244,311.2942,558.7761,309.2081,564.0343,303.9499,561.9482,311.1906,568.6244" style="stroke:#475569;stroke-width:1;"/><path d="M243.2263,221.9362 C243.5213,264.8857 246.1907,350.7589 261.3638,421.6982 C272.8334,475.3229 294.2646,529.4359 308.8116,563.1163" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="53.3438" x="267.3638" y="399.9541">docker rm</text></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="835.7275" x="5" y="636.8301">docker ps shows running containers only; docker ps -a shows every state. --rm on docker run deletes the container the moment it exits.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="734.6104" x="55.5586" y="652.9287">Stopping is graceful by default so the process can flush and close; kill is for when it will not. Neither touches the image.</text></g><!--SRC=[TLJBRjD05DtxAovTjI9Eo3O9sG125GKXoewmc8wldL7cOSqZnbtn4NmXNy8TpxXnI2jLIZrp7-UUS-wy4fhBK27CvulqvusHRb49rbYctEB0DIlz7XNEsw1auOMN2E-Czanej215ZRpdTFRtzn-WG72UUNHG6NwW-zQ1nTPOxu3fQWZWHYdwtz47yw3C4U41VOUeuxKg2elSCzrGpQjheLY3DrUmsQZWiTfkWJaGgfa6SOlKijhfZHEFk5ekjvqLdZtGdMGzWOYTkT6rQ01_2UTde0sqrd1q3dhqcqLCtCOkhQIvKfTSTjh91gs5RYQTljw-XoKmAOuugT8Oaw7cZ6cHbWLtXZOZ8T9gQnw9XeS-4TLO4rewH7n4kyxr9uaAbR4z7B1zOOJKQjgSvZ-dAWs0ki9g3UUypK2QnatOkqJWl90IZ8PAkCDWWPFk9GEtDnt9DKN7E4Vj4xm4vanlYz4GrStBObOeqKUmcYciu6XaK4IT2_PuBiB4C8tHM1Ha6oWhq-boEueBgn5mEYZ6yp4kwtUA8tjRVrRg8eGEu6qk2AzpnXXLMj7iFQKbRKvPmtUHJqk9jN-kTj0fxgbS1f6edC8qxQ37_Ut7xn- -VPx1yWqG4PPnd4LtwNZpwVRkRgTpoY5AcLFY1QqP4Ine2DdljB6GhKATNBGe_Q2iYzov3EsBTC7YYHeS3dRwckgLPVw4raZ1-nNjKSTwDwCf9Ir46OTeiPgHmSgQ2Hai_bZfdpTFFVFmKTu9_Ug2dVy3eAmlbBueKd3MUa7UteZjoTN9qcC3FZw4ZZ3AVlsS_V68jAJ3ipYFCwjXNqvMIOPs-MqS7zRufOoYNI6Y4-dppKB4vHFR-qXCx2-of7MGKP8AQnQa1sU6_F69uqn3BOFRfrsMnk4woKtvDIdHHJzGcowUQUFdy0K5LI0O9l1z1ZUynGE8Vm00]--></g></svg>