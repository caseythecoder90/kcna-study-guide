<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="476px" preserveAspectRatio="none" style="width:1064px;height:476px;background:#FFFFFF;" version="1.1" viewBox="0 0 1064 476" width="1064px" zoomAndPan="magnify"><title>Traditional, virtual machine, and container deployments &#8212; what sits between the app and the hardware</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="883.1777" x="86.7466" y="30.8838">Traditional, virtual machine, and container deployments &#8212; what sits between the app and the hardware</text></g><!--cluster trad--><g class="cluster" data-entity="trad" data-source-line="4" data-uid="ent0002" id="cluster_trad"><rect fill="#F8FAFC" height="292" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="256" x="71.3354" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4473" x="166.1118" y="71.8921">Traditional</text></g><!--cluster vm--><g class="cluster" data-entity="vm" data-source-line="12" data-uid="ent0008" id="cluster_vm"><rect fill="#F8FAFC" height="286" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="335" x="335.3354" y="59.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.0381" x="450.8164" y="77.8921">Virtual machines</text></g><!--cluster ctr--><g class="cluster" data-entity="ctr" data-source-line="22" data-uid="ent0016" id="cluster_ctr"><rect fill="#F0FDF4" height="371" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="330" x="678.3354" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9009" x="809.385" y="71.8921">Containers</text></g><!--entity t1--><g class="entity" data-entity="t1" data-source-line="5" data-uid="ent0003" id="entity_t1"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="205.9229" x="113.3354" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.1816" x="127.3354" y="112.8921">App &#183; App &#183; App &#183; App</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.9229" x="127.3354" y="125.9648">share one OS, one set of libraries &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="158.9844" x="127.3354" y="138.6138">the dependency-conflict problem</text></g><!--entity t2--><g class="entity" data-entity="t2" data-source-line="6" data-uid="ent0004" id="entity_t2"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="129.8735" x="151.3354" y="203.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8735" x="165.3354" y="229.3921">Operating system</text></g><!--entity t3--><g class="entity" data-entity="t3" data-source-line="7" data-uid="ent0005" id="entity_t3"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="84.3545" x="174.3354" y="294.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.3545" x="188.3354" y="320.8921">Hardware</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="13" data-uid="ent0009" id="entity_v1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="133.4722" x="377.8354" y="92.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3799" x="391.8354" y="118.8921">VM 1: App &#183; App</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="105.4722" x="391.8354" y="131.9648">guest OS + full kernel</text></g><!--entity v2--><g class="entity" data-entity="v2" data-source-line="14" data-uid="ent0010" id="entity_v2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="133.4722" x="528.8354" y="92.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3799" x="542.8354" y="118.8921">VM 2: App &#183; App</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="105.4722" x="542.8354" y="131.9648">guest OS + full kernel</text></g><!--entity v3--><g class="entity" data-entity="v3" data-source-line="15" data-uid="ent0011" id="entity_v3"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="248.6821" x="343.8354" y="190.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.229" x="357.8354" y="216.8921">Hypervisor (+ host OS)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="220.6821" x="357.8354" y="229.9648">ESXi, KVM, Hyper-V &#8212; emulates hardware</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="164.4038" x="357.8354" y="242.6138">for each guest; strong isolation</text></g><!--entity v4--><g class="entity" data-entity="v4" data-source-line="16" data-uid="ent0012" id="entity_v4"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="84.3545" x="426.3354" y="294.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.3545" x="440.3354" y="320.8921">Hardware</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="23" data-uid="ent0017" id="entity_c1"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="241.9468" x="722.3354" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.7383" x="736.3354" y="112.8921">App &#183; App &#183; App &#183; App</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="213.9468" x="736.3354" y="125.9648">each in its own namespaces and cgroup,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="187.0376" x="736.3354" y="138.6138">with its own libraries from its image</text></g><!--entity c2--><g class="entity" data-entity="c2" data-source-line="24" data-uid="ent0018" id="entity_c2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="171.6445" x="757.3354" y="196.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.9536" x="771.3354" y="222.8921">Container runtime</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="143.6445" x="771.3354" y="235.9648">Docker / containerd &#8594; runc</text></g><!--entity c3--><g class="entity" data-entity="c3" data-source-line="25" data-uid="ent0019" id="entity_c3"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="312.6416" x="686.8354" y="294.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="284.6416" x="700.8354" y="320.8921">Operating system &#8212; ONE shared Linux kernel</text></g><!--entity c4--><g class="entity" data-entity="c4" data-source-line="26" data-uid="ent0020" id="entity_c4"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="84.3545" x="801.3354" y="373.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.3545" x="815.3354" y="399.8921">Hardware</text></g><g class="caption" data-source-line="35"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1046.6709" x="5" y="444.8301">A VM boots a whole operating system per workload (gigabytes, minutes, its own kernel to patch). A container is a process on the host kernel that has been told it is alone</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="871.0762" x="92.7974" y="460.9287">(megabytes, milliseconds, one kernel). The price: every container must run the host kernel's OS family &#8212; Linux containers on a Linux kernel.</text></g><!--SRC=[hLNBRjD05DtxAoxTqAfEeYHTXIXI1HL8KBfe5I41YydunXvr7jRCs24W95Py0E9VsFCf_HBkJ9B6iIjK8QH8VkG-ZiyvzyuJeRciCeH-Vx3vUMEa6sI2vPOfDxZbclLyWGhxPQLaueMN23UMPS8BevbCeHRMLqo2OhmG6bDWEWDkj6VqP273KfgrGkqTt7tx2Qk2UN22dXReLuWQg3omienvuRvWDbinYqbYaNkcS-fur6Xv1DDfRarLpcR077Zw1xua08teSoht-nTqBX_qr8dFE1aEPuxQ81YDS7MTngj33sO9KYmiim8ZtEaWnCyQUG4XVHFg33LVz-X3br9m3wKr2ubgcn0mbf8Os68S7kAxAj4oBtGERkqygdRuw33yrPQH4AOgZzasR4nXVWYzzuN82Cx7pAnqRxP9zwFk-t7ozO3K-Q5qhiLihTgypYzXE7cOpxn2vubBE8Lb9INSejKe7wQZ7dRAZlv7sJPjQwAv5ivOE3w5miH29utY5zVlH0glvvSfnDZUF5eKLIMP9mFidDXrmP9g8h464TypSDuQKfDwKIQvj06GSKxcto8SFqhO-ep2weQmLkI59mNZ5zPTnMFTUjnzVzPI_FbkBlTQlpHcsvPx-m-356aG6i98KrVGJA4h6IV-uYQ8JT8kXIlXY_ka_T0jhL7