<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="416px" preserveAspectRatio="none" style="width:1120px;height:416px;background:#FFFFFF;" version="1.1" viewBox="0 0 1120 416" width="1120px" zoomAndPan="magnify"><title>Where a container's files can live &#8212; and which survive the container</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="584.4639" x="263.9019" y="30.8838">Where a container's files can live &#8212; and which survive the container</text></g><!--cluster view--><g class="cluster" data-entity="view" data-source-line="4" data-uid="ent0002" id="cluster_view"><rect fill="#F0FDF4" height="97" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="971" x="105.3838" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="169.0444" x="506.3616" y="71.8921">Container process view of /</text></g><!--cluster surv--><g class="cluster" data-entity="surv" data-source-line="24" data-uid="ent0018" id="cluster_surv"><rect fill="#F8FAFC" height="84" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="813" x="94.3838" y="280.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.6162" x="436.5757" y="298.8921">Survives docker rm?</text></g><!--entity bind--><g class="entity" data-entity="bind" data-source-line="14" data-uid="ent0010" id="entity_bind"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="269.377" x="42.8838" y="178.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.2046" x="56.8838" y="204.8921">Bind mount</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="156.4438" x="56.8838" y="217.9648">-v /abs/host/path:/ctr/path[:ro]</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="170.2153" x="56.8838" y="230.6138">--mount type=bind,src=&#8230;,dst=&#8230;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="241.377" x="56.8838" y="243.2627">Any host path; host and container both edit it;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201.8672" x="56.8838" y="255.9116">depends on the host's directory layout</text></g><!--entity volume--><g class="entity" data-entity="volume" data-source-line="15" data-uid="ent0011" id="entity_volume"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="336.9561" x="329.8838" y="178.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.9536" x="343.8838" y="204.8921">Volume</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="308.9561" x="343.8838" y="217.9648">-v NAME:/ctr/path &#183; --mount type=volume,src=NAME,dst=&#8230;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="204.7783" x="343.8838" y="230.6138">Created and managed by Docker under</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.1929" x="343.8838" y="243.2627">/var/lib/docker/volumes/NAME/_data; portable, backed up,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="273.2329" x="343.8838" y="255.9116">driver-pluggable &#8212; the preferred way to persist data</text></g><!--entity tmpfs--><g class="entity" data-entity="tmpfs" data-source-line="16" data-uid="ent0012" id="entity_tmpfs"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="160.6768" x="684.8838" y="185.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.7827" x="698.8838" y="211.3921">tmpfs</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="130.2168" x="698.8838" y="224.4648">--mount type=tmpfs,dst=&#8230;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="132.6768" x="698.8838" y="237.1138">Memory only, gone at stop;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="111.2676" x="698.8838" y="249.7627">for secrets and scratch</text></g><!--entity upper--><g class="entity" data-entity="upper" data-source-line="17" data-uid="ent0013" id="entity_upper"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="153.3613" x="863.8838" y="191.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4663" x="877.8838" y="217.8921">Writable layer</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.7168" x="877.8838" y="230.9648">the OverlayFS upperdir</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="125.3613" x="877.8838" y="243.6138">deleted with the container</text></g><!--entity bm--><g class="entity" data-entity="bm" data-source-line="5" data-uid="ent0003" id="entity_bm"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="234.54" x="113.8838" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.0908" x="127.8838" y="112.8921">/usr/share/nginx/html/index.html</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="206.54" x="127.8838" y="125.9648">&#8592; bind mount: the file from your laptop</text></g><!--entity vol--><g class="entity" data-entity="vol" data-source-line="6" data-uid="ent0004" id="entity_vol"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="265.1768" x="366.8838" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.249" x="380.8838" y="112.8921">/var/lib/data</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="237.1768" x="380.8838" y="125.9648">&#8592; named volume: Docker-managed directory</text></g><!--entity tmp--><g class="entity" data-entity="tmp" data-source-line="7" data-uid="ent0005" id="entity_tmp"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="142.1436" x="650.3838" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1436" x="664.3838" y="112.8921">/run/secrets-scratch</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="94.7407" x="664.3838" y="125.9648">&#8592; tmpfs: RAM only</text></g><!--entity rest--><g class="entity" data-entity="rest" data-source-line="8" data-uid="ent0006" id="entity_rest"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="257.8345" x="810.3838" y="86.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0825" x="824.3838" y="112.8921">everything else &#8212; /bin /etc /usr &#8230;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="229.8345" x="824.3838" y="125.9648">&#8592; image layers + this container's writable layer</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="25" data-uid="ent0019" id="entity_s1"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="253.7544" x="102.3838" y="313.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="225.7544" x="116.3838" y="339.8921">bind mount: yes &#8212; it's the host's file</text></g><!--entity s2--><g class="entity" data-entity="s2" data-source-line="26" data-uid="ent0020" id="entity_s2"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="266.3989" x="374.3838" y="313.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238.3989" x="388.3838" y="339.8921">volume: yes &#8212; until docker volume rm</text></g><!--entity s3--><g class="entity" data-entity="s3" data-source-line="27" data-uid="ent0021" id="entity_s3"><rect fill="#FEE2E2" height="42.9487" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="87.2109" x="658.8838" y="313.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.2109" x="672.8838" y="339.8921">tmpfs: no</text></g><!--entity s4--><g class="entity" data-entity="s4" data-source-line="28" data-uid="ent0022" id="entity_s4"><rect fill="#FEE2E2" height="42.9487" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="134.9199" x="763.8838" y="313.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.9199" x="777.8838" y="339.8921">writable layer: no</text></g><g class="link" data-entity-1="bm" data-entity-2="bind" data-uid="lnk14" id="link_bm_bind"><polygon fill="#475569" points="200.355,178.3304,207.9346,172.0415,202.5746,173.8501,200.766,168.4902,200.355,178.3304" style="stroke:#475569;stroke-width:1;"/><path d="M217.8966,142.9224 C212.586,153.642 208.9991,160.8821 203.0185,172.954" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="vol" data-entity-2="volume" data-uid="lnk15" id="link_vol_volume"><polygon fill="#475569" points="498.8092,178.3304,502.8916,169.3675,498.8551,173.3306,494.8919,169.2941,498.8092,178.3304" style="stroke:#475569;stroke-width:1;"/><path d="M499.134,142.9224 C499.0357,153.642 498.975,160.2588 498.8642,172.3307" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="tmp" data-entity-2="tmpfs" data-uid="lnk16" id="link_tmp_tmpfs"><polygon fill="#475569" points="749.3884,185.0734,749.7287,175.2304,747.5168,180.4369,742.3103,178.225,749.3884,185.0734" style="stroke:#475569;stroke-width:1;"/><path d="M732.3733,142.9224 C737.5151,155.6598 741.492,165.5117 747.1425,179.5096" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="rest" data-entity-2="upper" data-uid="lnk17" id="link_rest_upper"><polygon fill="#475569" points="940.0802,191.6028,943.9974,182.5665,940.0343,186.603,935.9978,182.6399,940.0802,191.6028" style="stroke:#475569;stroke-width:1;"/><path d="M939.6336,142.9224 C939.7689,157.6776 939.8822,170.0271 940.0251,185.6031" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="bind" data-entity-2="s1" data-uid="lnk26" id="link_bind_s1"><polygon fill="#475569" points="219.4461,313.6539,219.1279,303.8102,217.2688,309.1529,211.9262,307.2938,219.4461,313.6539" style="stroke:#475569;stroke-width:1;"/><path d="M199.7383,272.9118 C206.62,287.1384 211.2366,296.6824 216.8334,308.2526" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="volume" data-entity-2="s2" data-uid="lnk27" id="link_volume_s2"><polygon fill="#475569" points="505.6638,313.6539,508.899,304.3516,505.2467,308.6714,500.9269,305.019,505.6638,313.6539" style="stroke:#475569;stroke-width:1;"/><path d="M502.2528,272.9118 C503.4439,287.1384 504.1946,296.1046 505.1632,307.6748" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="tmpfs" data-entity-2="s3" data-uid="lnk28" id="link_tmpfs_s3"><polygon fill="#475569" points="714.4481,313.6123,722.4497,307.8699,716.9762,309.2985,715.5477,303.825,714.4481,313.6123" style="stroke:#475569;stroke-width:1;"/><path d="M742.1039,266.4218 C732.7101,282.4509 725.3014,295.0929 717.4818,308.4357" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="upper" data-entity-2="s4" data-uid="lnk29" id="link_upper_s4"><polygon fill="#475569" points="852.3577,313.5129,861.5744,310.0412,855.9177,310.002,855.9569,304.3453,852.3577,313.5129" style="stroke:#475569;stroke-width:1;"/><path d="M906.7908,259.829 C889.0259,277.3493 872.0398,294.1017 856.6297,309.2998" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="38"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1102.2676" x="5" y="384.8301">A mount overlays a path in the merged view: the container sees the mounted content instead of whatever the image had there. An empty new volume is first filled with the image's</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1009.9824" x="51.1426" y="400.9287">files at that path; a bind mount just hides them. Kubernetes equivalents: hostPath (bind), PersistentVolumeClaim (volume), emptyDir with medium: Memory (tmpfs).</text></g><!--SRC=[TLRDZjis4BxxAQQvP8FQ9lRdv7LSk9ksXsBJ806QGneKb3Iss8YaIb9srA90JZttq6VeA_JUHycJT8QKRSa_mC8ha9nlPhxvPiWlbCchfa2OJaNw2zPMNXHAhftKNdp8ZPo44ZLEwqPNew12XV2sH8SW8RScI6NGFVMmKXLwoAM1IcqGFd_w6wGfO5kgl0JVk0sl4jB1Q3Hoc0TfreJuv66t2hMpENeF6uLRi2iGJs0-NplRrDzPMomM8BkztqS0FGJHU2TyAHqAirRceoY3heGo1NwSykTFPkxLRpYxlbvy_lClo6W7j6rCcCMmE7vOEQkXjOs3IjR1rdF19eiOmTvvfeySRwGJbSf48OCyycAanW8sjceqpk25pJ-WcsXfv9gM2yKerhLdtP3HaH_N6E4nTnZynETEXhmySXTqlV8pUBry16kgFcvT4Ri9c0uDWN63hWsbCcl0ogVQ2U8718OSc5TQ-kV8bTAK0z7KelFm9L6e_40FMwU2pAhkI2yItGJiKdJe0uMIQPYyArLHe7dlrBeCaqMNFVsURgNuwVTqAmB-CH3Mr_iwznAOR438p8lI-Y1g6SgPo8EBN-zcphxlmkrRJ286XBR6vwoTiNVvSw9bNFZ0_qzDbgO5TW0CUvy-kINsB45cGmbOg00gt9y255YZAJoLCYgK0OZOlMgOMTk47hKopz64JgKKOv-77wC6XnoyN3v-SyWS_liN1cacsSP4-UJbJ1ySIYfgp6udxgpjv0uDjQ0xDJgqJJmcaZSls9NucNlf7chheeZ6a4awL41JZy_mv6Ysk4bTDUjrb1mBc1ch7QxGERBRoXQ2XPh4ggWCZ7w1jnH6dxdOL9Ua43SlC_E8cYl5pJY6jJKqDGDucYndohso3hhsZansBNwnYLU-7-NRGR_rO9c87uWVMl_s3H587924pgcjGYxYLf4K1eFwVFD6fD68cxUmMqFT5oKNMxPRwBYChTejxUAc8koMEg1UBc_ITK5QJmfo-glz9P2SyuLoV07q9tfBngm2nHtJQnwUyiCnww-7ABjPlKCWE5Nj0acR5CyHniqGenl3nlAnJEvEtGvF3IVawV4xEkwlJuTSzEPlpcom0tzxPkEEXcAaPySvPTtbib-v6SMm3mkterYPmyBTQ9JJjQXe7itLOfcu1fkqHPgDWmvKcbOQ7Oy1lgbdGpcHo34L9G9WceZKW6Jg0yg2R_rjIHE5aEEvTDUKj1FuvJ65fG7KTMZ1q3kWIqHnTHtfYcfSzNKShP_wkL0iTxL8BnNgmq0-kk4iU-y1-AKX5A8mHQcdy7sJeJFK7HxmrqPjP4NHKe5PLAyuvoksVZQ6Lsc-q6uQjm_Ki1gkKeIq7uD-eLmAZfu6gj4pw8R4LUJ_sPG3_Hy0]--></g></svg>