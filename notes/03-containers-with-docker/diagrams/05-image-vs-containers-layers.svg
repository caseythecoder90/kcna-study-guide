<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="786px" preserveAspectRatio="none" style="width:1110px;height:786px;background:#FFFFFF;" version="1.1" viewBox="0 0 1110 786" width="1110px" zoomAndPan="magnify"><title>One image, many containers &#8212; read-only layers shared, one thin writable layer each</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="721.2568" x="190.4639" y="30.8838">One image, many containers &#8212; read-only layers shared, one thin writable layer each</text></g><!--cluster img--><g class="cluster" data-entity="img" data-source-line="4" data-uid="ent0002" id="cluster_img"><rect fill="#F8FAFC" height="562" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="392" x="453.8423" y="172.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="368.3926" x="465.646" y="190.8921">Image spurin/funbox:latest &#8212; read-only, content-addressed</text></g><!--entity ca--><g class="entity" data-entity="ca" data-source-line="18" data-uid="ent0014" id="entity_ca"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="164.9092" x="263.3423" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.6709" x="277.3423" y="79.8921">Container A</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.9092" x="277.3423" y="92.9648">writable layer: /tmp/out.txt</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="107.2607" x="277.3423" y="105.6138">+ modified /etc/motd</text></g><!--entity cb--><g class="entity" data-entity="cb" data-source-line="19" data-uid="ent0015" id="entity_cb"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="137.4307" x="446.3423" y="59.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.6709" x="460.3423" y="85.8921">Container B</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="109.4307" x="460.3423" y="98.9648">writable layer: empty</text></g><!--entity cc--><g class="entity" data-entity="cc" data-source-line="20" data-uid="ent0016" id="entity_cc"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="167.9653" x="601.8423" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.6709" x="615.8423" y="79.8921">Container C</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="139.9653" x="615.8423" y="92.9648">writable layer: whiteout for</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="102.0938" x="615.8423" y="105.6138">/examples (deleted)</text></g><!--entity l5--><g class="entity" data-entity="l5" data-source-line="5" data-uid="ent0003" id="entity_l5"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="171.0571" x="564.3423" y="205.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.0571" x="578.3423" y="231.8921">Layer 5 &#183; ADD menu.sh /</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.8213" x="578.3423" y="244.9648">1.08 KB &#183; sha256:16e40fe&#8230;</text></g><!--entity l4--><g class="entity" data-entity="l4" data-source-line="6" data-uid="ent0004" id="entity_l4"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="232.4707" x="533.8423" y="298.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.4707" x="547.8423" y="324.8921">Layer 4 &#183; ADD examples /examples</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.8267" x="547.8423" y="337.9648">824 KB &#183; sha256:4ab2772&#8230;</text></g><!--entity l3--><g class="entity" data-entity="l3" data-source-line="7" data-uid="ent0005" id="entity_l3"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="236.8252" x="531.3423" y="391.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.8252" x="545.3423" y="417.8921">Layer 3 &#183; ADD youtube /usr/local/bin</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="130.8721" x="545.3423" y="430.9648">251 B &#183; sha256:5001ce9&#8230;</text></g><!--entity l2--><g class="entity" data-entity="l2" data-source-line="8" data-uid="ent0006" id="entity_l2"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="215.1479" x="542.3423" y="484.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1479" x="556.3423" y="510.8921">Layer 2 &#183; RUN apt-get update &#8230;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="137.5913" x="556.3423" y="523.9648">429 MB &#183; sha256:816f929&#8230;</text></g><!--entity l1--><g class="entity" data-entity="l1" data-source-line="9" data-uid="ent0007" id="entity_l1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="189.8779" x="554.8423" y="577.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.8779" x="568.8423" y="603.8921">Layer 1 &#183; debian base rootfs</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="130.856" x="568.8423" y="616.9648">46 MB &#183; sha256:82312fc&#8230;</text></g><!--entity cfg--><g class="entity" data-entity="cfg" data-source-line="10" data-uid="ent0008" id="entity_cfg"><rect fill="#F1F5F9" height="55.5977" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="333.6367" x="482.8423" y="670.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.0024" x="496.8423" y="696.8921">Config &#183; sha256:e4475d4&#8230;</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="305.6367" x="496.8423" y="709.9648">ENV, USER, CMD, MAINTAINER &#8212; metadata only, 0 B layers</text></g><g class="link" data-entity-1="ca" data-entity-2="img" data-uid="lnk17" id="link_ca_img"><polygon fill="#475569" points="453.7366,188.0828,449.0733,179.4079,449.7846,185.0199,444.1726,185.7312,453.7366,188.0828" style="stroke:#475569;stroke-width:1;"/><path d="M378.4649,121.7752 C392.3999,135.4536 409.0639,151.2307 424.8423,164.6982 C432.0665,170.8644 439.7838,177.1349 447.5479,183.2488 C449.489,184.7773 451.433,186.296 453.3729,187.8008 C453.4941,187.8949 448.8729,184.3134 448.9942,184.4073" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.0508" x="430.8423" y="156.9541">reads through</text></g><g class="link" data-entity-1="cb" data-entity-2="img" data-uid="lnk18" id="link_cb_img"><polygon fill="#475569" points="514.8423,172.4715,518.8423,163.4715,514.8423,167.4715,510.8423,163.4715,514.8423,172.4715" style="stroke:#475569;stroke-width:1;"/><path d="M514.8423,115.7835 C514.8423,131.6704 514.8423,152.4149 514.8423,172.0124 C514.8423,172.1655 514.8423,166.3185 514.8423,166.4715" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.0508" x="520.8423" y="156.9541">reads through</text></g><g class="link" data-entity-1="cc" data-entity-2="img" data-uid="lnk19" id="link_cc_img"><polygon fill="#475569" points="555.0638,172.557,564.8074,171.1209,559.288,169.8818,560.5271,164.3623,555.0638,172.557" style="stroke:#475569;stroke-width:1;"/><path d="M658.778,122.0155 C644.3946,137.4583 625.4436,154.591 604.8423,164.6982 C594.7401,169.6545 586.9747,168.6149 579.3675,167.8561 C575.5639,167.4767 571.7998,167.1675 567.8031,167.713 C565.8047,167.9857 563.7481,168.4722 561.5993,169.2704 C560.5249,169.6695 559.4275,170.1465 558.3027,170.7137 C557.7404,170.9973 557.1712,171.3035 556.5946,171.6337 C556.3063,171.7989 556.0162,171.97 555.7242,172.1474 C555.5781,172.236 555.4317,172.3263 555.2847,172.4181 C555.2112,172.464 560.2065,169.3 560.1328,169.3467" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="74.0508" x="645.8423" y="156.9541">reads through</text></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="940.8506" x="80.667" y="754.8301">Image = bundle of software; container = a running instance of it. Every container gets its own thin writable layer on top of the same shared image layers,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1092.1846" x="5" y="770.9287">so 100 containers from one 500 MB image cost ~500 MB once, plus only what each one writes. The writable layer is deleted with the container &#8212; hence volumes (next chapter).</text></g><!--SRC=[VPNTRjCm5CVl-nG7ha2qIPEb-oYbqjXsCS66D3vkW0l7Faai73kodRK5WNW8de5Nu9v7uKcmavQbDAlKIDMnVNxdm-Vl1rnIKJE480ZRdrLAc91nacjIcl0JbMHa2omngEfI32ot0k6LHE0boN489P4he4fQmYLg0t- -_m2DX8sK52iGPEMDfY0QsH2KEsSBBc6XkIMfyzHi02Iq60mqKajaxgmFBxrpC5MjkGopMgPgEHN4eh7RW663Hcb7X36DnY1x2BDPhbLTpUT0Z0ipXoy3W8xpbmrp0hz_mUdvEPGewy0K47wGCyC_upIAvb4mFeONp_qM5tiyEPn6XvYCC_pp_USizBlcdbC9btNB4PC-IBA1u9AKbK03uUPVXtOS9zkmXAJnqL5yFopfWnriO2jLspf526kZGw4e4M7APGSOJoBeyYRZSKJnv7xUGHylzXvktbu3gUmeHmjrnLoFN8T-TbX9V09NNTXnT9YTn7jWSHyiyXuOffn8I8b1q4hPh5l5vF0_JdmGnHczdnDjSywKp7ZUSO19SZHXoNOw5zVlXl3szSND4CwkpeTmTNfv_SPz5pVDpIpH4bS40ktj7BiojpFGYQ6iBR8s1fhbBWWnWT7xWZE6yYDJ2pcQjnqMoQxTTq8SxDfzqKIyQ_T9YcZ7xi5VjqRkR3F3SDf9TtjGfn3QiWhTzGhiqgvJwkn-0gLYFEF8t3stD2oLPPt4SwKsUPD-zFCzQ2mhk-htblPxEzlZRL5mYouHo9JUJUJVbC8ZXW9Tlnxta-bWG0cCrbNrOZDjrCaudNCYb1S3ckvVflkNoLthDCyBwtkNDavtp4qibULAmepFMmbz1cajcKjRPM1KPXTEY9_UwRLR9w1hARdCWKlZQaYRlTm6S76BkgFju4RSwQdxNBYzCkx0LbN-k7inm90IryhVFXRhIHZEGkvhpUT6GJGUTr-FJAkoUIMS8lbfRizHvNJ_szgaN8H3g4HjcXbpZIIsUK2QSpuYD06yAV3_wBY1TIzXmMtHn7YNd1_U0dtsjqhKfU-ynAK5MhYIeduS-AZ_0W00]--></g></svg>