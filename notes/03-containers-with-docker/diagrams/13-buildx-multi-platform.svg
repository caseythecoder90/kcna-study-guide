<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="628px" preserveAspectRatio="none" style="width:1004px;height:628px;background:#FFFFFF;" version="1.1" viewBox="0 0 1004 628" width="1004px" zoomAndPan="magnify"><title>docker buildx build ~-~-platform linux/amd64,linux/arm64 -t user/cmatrix ~-~-push .</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="667.125" x="164.5444" y="30.8838">docker buildx build --platform linux/amd64,linux/arm64 -t user/cmatrix --push .</text></g><!--cluster bk--><g class="cluster" data-entity="bk" data-source-line="6" data-uid="ent0003" id="cluster_bk"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="468" x="280.8569" y="144.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="444.2407" x="292.7366" y="162.8921">BuildKit builder (docker-container driver, or the containerd image store)</text></g><!--cluster reg--><g class="cluster" data-entity="reg" data-source-line="12" data-uid="ent0007" id="cluster_reg"><rect fill="#F0FDF4" height="190" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="352" x="336.8569" y="309.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="236.9771" x="394.3684" y="327.8921">Registry: docker.io/user/cmatrix:latest</text></g><!--entity src--><g class="entity" data-entity="src" data-source-line="4" data-uid="ent0002" id="entity_src"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="376.4121" x="318.8569" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="187.459" x="332.8569" y="87.8921">One Dockerfile + build context</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="348.4121" x="332.8569" y="100.9648">FROM alpine resolves to the alpine variant for each target platform</text></g><!--entity mac--><g class="entity" data-entity="mac" data-source-line="20" data-uid="ent0013" id="entity_mac"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="271.4707" x="533.3569" y="528.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.4707" x="547.3569" y="554.8921">docker pull user/cmatrix on a Mac (arm64)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="189.5244" x="547.3569" y="567.9648">picks the arm64 manifest automatically</text></g><!--entity pc--><g class="entity" data-entity="pc" data-source-line="21" data-uid="ent0014" id="entity_pc"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="315.5742" x="198.8569" y="528.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="287.5742" x="212.8569" y="554.8921">docker pull user/cmatrix on the ThinkPad (amd64)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.7275" x="212.8569" y="567.9648">picks the amd64 manifest</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="7" data-uid="ent0004" id="entity_b1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="141.7544" x="299.8569" y="190.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.1753" x="313.8569" y="216.3921">linux/amd64 build</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.7544" x="313.8569" y="229.4648">native on an x86 laptop</text></g><!--entity b2--><g class="entity" data-entity="b2" data-source-line="8" data-uid="ent0005" id="entity_b2"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="268.8184" x="460.3569" y="177.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.2744" x="474.3569" y="203.8921">linux/arm64 build</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="232.8853" x="474.3569" y="216.9648">via QEMU emulation (binfmt_misc) &#8212; slower &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="208.4844" x="474.3569" y="229.6138">or a native arm64 node, or cross-compiling</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="240.8184" x="474.3569" y="242.2627">with $BUILDPLATFORM / $TARGETPLATFORM</text></g><!--entity idx--><g class="entity" data-entity="idx" data-source-line="13" data-uid="ent0008" id="entity_idx"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="191.2617" x="385.3569" y="342.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.2617" x="399.3569" y="368.8921">Image index (manifest list)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="100.23" x="399.3569" y="381.9648">one tag, one digest</text></g><!--entity m1--><g class="entity" data-entity="m1" data-source-line="14" data-uid="ent0009" id="entity_m1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="160.209" x="344.8569" y="435.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.209" x="358.8569" y="461.8921">manifest linux/amd64</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="77.3384" x="358.8569" y="474.9648">config + layers</text></g><!--entity m2--><g class="entity" data-entity="m2" data-source-line="15" data-uid="ent0010" id="entity_m2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="157.3271" x="523.3569" y="435.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129.3271" x="537.3569" y="461.8921">manifest linux/arm64</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="77.3384" x="537.3569" y="474.9648">config + layers</text></g><g class="link" data-entity-1="idx" data-entity-2="m1" data-uid="lnk11" id="link_idx_m1"><polygon fill="#475569" points="441.6469,435.4145,449.7704,429.846,444.2674,431.1562,442.9572,425.6532,441.6469,435.4145" style="stroke:#475569;stroke-width:1;"/><path d="M464.0551,399.0012 C456.9673,410.5189 451.878,418.789 444.7915,430.3046" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="idx" data-entity-2="m2" data-uid="lnk12" id="link_idx_m2"><polygon fill="#475569" points="565.8102,435.5887,561.0216,426.9824,561.8142,432.5835,556.2131,433.3761,565.8102,435.5887" style="stroke:#475569;stroke-width:1;"/><path d="M516.8333,398.7549 C532.2985,410.3857 545.542,420.3457 561.015,431.9824" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="src" data-entity-2="b1" data-uid="lnk15" id="link_src_b1"><polygon fill="#475569" points="399.9841,190.1057,409.2983,186.9049,403.6452,186.7003,403.8498,181.0472,399.9841,190.1057" style="stroke:#475569;stroke-width:1;"/><path d="M477.6815,117.8357 C454.735,139.1793 427.3115,164.6872 404.3774,186.0193" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="src" data-entity-2="b2" data-uid="lnk16" id="link_src_b2"><polygon fill="#475569" points="567.3224,177.6174,565.4665,167.945,564.4671,173.5129,558.8992,172.5135,567.3224,177.6174" style="stroke:#475569;stroke-width:1;"/><path d="M525.7351,117.8357 C537.8557,135.259 550.3748,153.2552 563.8961,172.692" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="b1" data-entity-2="idx" data-uid="lnk17" id="link_b1_idx"><polygon fill="#475569" points="461.085,342.6466,459.0036,333.0202,458.1345,338.6099,452.5448,337.7408,461.085,342.6466" style="stroke:#475569;stroke-width:1;"/><path d="M390.7771,246.4527 C410.7128,273.7283 437.6613,310.5987 457.5445,337.8025" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="34.0137" x="434.8569" y="293.9541">--push</text></g><g class="link" data-entity-1="b2" data-entity-2="idx" data-uid="lnk18" id="link_b2_idx"><polygon fill="#475569" points="501.6213,342.2856,510.2441,337.5267,504.6404,338.3,503.8671,332.6962,501.6213,342.2856" style="stroke:#475569;stroke-width:1;"/><path d="M564.9048,258.7403 C544.9821,285.0418 522.9432,314.137 505.2442,337.5028" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="34.0137" x="553.8569" y="293.9541">--push</text></g><g class="link" data-entity-1="m2" data-entity-2="mac" data-uid="lnk19" id="link_m2_mac"><polygon fill="#475569" points="648.7689,528.4145,646.654,518.7954,645.8044,524.3881,640.2117,523.5386,648.7689,528.4145" style="stroke:#475569;stroke-width:1;"/><path d="M621.9591,492.0012 C630.4391,503.5189 636.7331,512.0673 645.2115,523.5828" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="m1" data-entity-2="pc" data-uid="lnk20" id="link_m1_pc"><polygon fill="#475569" points="377.2448,528.4145,385.8363,523.5994,380.2377,524.4092,379.4279,518.8107,377.2448,528.4145" style="stroke:#475569;stroke-width:1;"/><path d="M404.4547,492.0012 C395.8481,503.5189 389.4413,512.0926 380.8363,523.6082" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="30"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="986.2139" x="5" y="596.8301">--push is required: a multi-platform result is an index, which the classic image store cannot hold locally. Without --platform, buildx builds only the host's platform;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="937.4805" x="29.3667" y="612.9287">on Apple silicon that means an arm64-only image that fails on amd64 servers with "exec format error" &#8212; the reason the lecture cross-compiles for both.</text></g><!--SRC=[bLL_Qnj74FrVds9g3BMfJuTCC44L0fl49ZJ6YR797sqfeztLtQ3zSTtTi-MMc7o8VC9yaipkdUMJQvSM1DhRlPttvitCkn_82jrA1UDnsVsYSpgKah3oQ4Av4XQBM2kZnarhz2XIr0ga4olbOT6Ibklk3-wB-wBH69VE6z1astM9HXwzEkZNtXozWY926vGlXS7eQTrTQaCDuz78An7HLXn-vy8gU9CnbiJFF_KGmjcerl4tEmlqbvfE9lFJoujpGDqGN_0gE7sZ0aG7pFXX-mOzeOt0l42Xg26YhrI41wwpCWMRxy1iXa8e6-Tpm031YorA9ud1BnGxAfpyNYT2aKWX0tcGdcwKFm06IlYR0mbai58GelDgFm5LthLDXxDOmTyZW07IGBiER92lnSWOu2oWXVNh8z3OHDSCSk2qoFQX9yy6peLu6lY643w-FRy6PLeMXXXXRq5sQU8VXeBOXszVlaBGxfRpv6KFE0Z0IIFqz3e8wwJAOWZlGc2TJ4DCeVhdtLkADUoUNBzx_-R3- -EhqulBSoXXz-huykpjrSFE2paUSewB2HI_rYIbihzxgkfOpDF1vwq2NggAGlHtqxvxn-JAOIzEEMqLugOyPyx93iEhwccDtkM2afLg3Ni6BItvAdTz