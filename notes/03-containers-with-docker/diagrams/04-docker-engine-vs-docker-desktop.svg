<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="527px" preserveAspectRatio="none" style="width:1119px;height:527px;background:#FFFFFF;" version="1.1" viewBox="0 0 1119 527" width="1119px" zoomAndPan="magnify"><title>Traditional Docker on Linux vs Docker Desktop &#8212; where the Linux kernel comes from</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="735.1875" x="188.311" y="30.8838">Traditional Docker on Linux vs Docker Desktop &#8212; where the Linux kernel comes from</text></g><!--cluster eng--><g class="cluster" data-entity="eng" data-source-line="4" data-uid="ent0002" id="cluster_eng"><rect fill="#F8FAFC" height="416" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="342" x="143.4048" y="59.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="275.2026" x="176.8035" y="77.8921">Traditional Docker (Docker Engine on Linux)</text></g><!--cluster dd--><g class="cluster" data-entity="dd" data-source-line="14" data-uid="ent0010" id="cluster_dd"><rect fill="#F0FDF4" height="409.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="498" x="493.4048" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="322.8862" x="580.9617" y="71.8921">Docker Desktop (Windows / macOS / Linux desktop)</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="5" data-uid="ent0003" id="entity_e1"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="142.8555" x="302.9048" y="92.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9009" x="316.9048" y="118.8921">Containers</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="114.8555" x="316.9048" y="131.9648">App &#183; App &#183; App &#183; App</text></g><!--entity e2--><g class="entity" data-entity="e2" data-source-line="6" data-uid="ent0004" id="entity_e2"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="266.4175" x="196.4048" y="203.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.0972" x="210.4048" y="229.3921">Docker Engine &#8594; containerd &#8594; runc</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.4175" x="210.4048" y="242.4648">the Docker CLI talks to dockerd over a socket</text></g><!--entity e3--><g class="entity" data-entity="e3" data-source-line="7" data-uid="ent0005" id="entity_e3"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="325.7251" x="151.4048" y="307.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.0181" x="165.4048" y="333.8921">Linux &#8212; the host's own kernel</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="297.7251" x="165.4048" y="346.9648">Docker's docs: kernel 3.10+ (the course slide says 3.1, 2011)</text></g><!--entity e4--><g class="entity" data-entity="e4" data-source-line="8" data-uid="ent0006" id="entity_e4"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="211.4121" x="208.9048" y="399.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="56.3545" x="222.9048" y="425.8921">Hardware</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="183.4121" x="222.9048" y="438.9648">rarely a concern; on a VM, make sure</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.3452" x="222.9048" y="451.6138">virtualisation is enabled</text></g><!--entity d0--><g class="entity" data-entity="d0" data-source-line="15" data-uid="ent0011" id="entity_d0"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="318.3506" x="583.4048" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.7026" x="597.4048" y="112.8921">Docker Desktop app</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="290.3506" x="597.4048" y="125.9648">GUI &#183; Settings &#8594; Resources (CPU, memory, swap, disk)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="257.3506" x="597.4048" y="138.6138">&#183; Kubernetes (enable a local cluster) &#183; Extensions</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="16" data-uid="ent0012" id="entity_d1"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="447.939" x="518.4048" y="190.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.165" x="532.4048" y="216.8921">Hidden Linux VM &#8212; the isolated instance Docker runs in</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="183.3906" x="532.4048" y="229.9648">Windows: WSL 2 (default) or Hyper-V</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="419.939" x="532.4048" y="242.6138">macOS: Apple Virtualization framework or Docker VMM (HyperKit / QEMU historically)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="101.7822" x="532.4048" y="255.2627">Linux: KVM + QEMU</text></g><!--entity d2--><g class="entity" data-entity="d2" data-source-line="17" data-uid="ent0013" id="entity_d2"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="481.6099" x="501.4048" y="307.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="453.6099" x="515.4048" y="333.8921">Inside the VM: Linux kernel (LinuxKit) &#8594; containerd &#8594; runc &#8594; containers</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="337.6807" x="515.4048" y="346.9648">+ optional single-node Kubernetes (node name: docker-desktop)</text></g><!--entity d3--><g class="entity" data-entity="d3" data-source-line="18" data-uid="ent0014" id="entity_d3"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="241.1226" x="621.9048" y="412.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.1226" x="635.9048" y="438.3921">Host OS: Windows, macOS, or Linux</text></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1101.8096" x="5" y="495.8301">On Linux, containers use the host kernel directly. Everywhere else Docker Desktop supplies a Linux kernel by running a small VM &#8212; which is why resource limits are VM settings,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1004.6572" x="53.5762" y="511.9287">why uname inside a container shows a linuxkit kernel, and why Docker Desktop is the easy path on a laptop: one install gives you Docker, a GUI, and Kubernetes.</text></g><!--SRC=[TLLBRXj74Dtp51LlGaByY99N344Wa0LBa0WxKKGlaYnQqoLEWytkGLUFw75W8AiS8F1TlCzHV99KpJIf8Ia310RzgthrwjNZ3yPbjjG8m-6e-KNlBOsqKSkWrZHQPKuDOevh71RbsdQYYHRXjw2qYSOxPU6DprOOm3kuDQxy24-qtNg3j8g-W6z_Vu5DZW610wLRVExGGkRNIF0O_BhJ2PX5vPOS_jKByRlfU-cMnk4kNUyLJAVBuCjYDWD5W6u9VtK0Mi4kl8kAtmJwmqt9VCB9U3pxkIZWlwzmz9cEvCQiZkgzJa77-n7teNpxvr-k8-NGzJAKBcibaxBJculRQuZAhWYY1rtlQV1FVAA0P1bR25IMeOi9mza-XeP6eLQYvvxYZmH-unAphUnDPZxbT3JPCdy-79-UG5SUPxuCX43Mi118LII7VJWx7OzxBJI5vGeJcFDzC5Sgw8qAsCeQU6ahhegfoJZbJz8o1Ojv7zPgnNdAW2buwzMJ2R5Krf2IxeEHXge7Yxg5Orr6t3RcDUF0CGn-putMwFxKpC1Wrf25PyVxWXlFZ_TVTpxl2V10mTqFnl5LWX63pzxTyRVXNpSNdbNuTYSQhG-5U11K5KMhyhVtroB1EupHk2NLCleLYLkJyOHqBzxVCt6uzg7g0srKqGTjQDKxff23t9GFqkGe3nl-c7dhCvucddQA67gIw_9ZH4VCCtr7S_hqeCqrQQdqnNodFaFUAcuA64TyDzkfdUU0UBE5BX4vWGztjt06NOsFghIn1px0LLLW62oEIwevdyXuCef5aiYdHYAFR5EuyM4b4LBQnNmEtJhQZOdSgrykv_UG6ue-62R1LY_GLXSrWHikwwH-yBBozO4LN3E1kZ6snNooRsxTUiKGUj_pYFtzjZ-TW2-I0PAHL0FdEK-xi_M6u-edoKW6MpM-Q6Bwm42ks390Q4qjwJVIxWkFDV23MTCoE_hqQ7PgHlJn3DRvzF4CSfpF7R7ftK4moppAYUvqCbMN3LCpUvUKrcyn12NXpl2sF6iZPTbg29Tif5NpLuEMyF2FY4fMa67kr7wZ7YhfXcEUnONNh92jkZUvoNAneKtETz8uWZLh4pbAaAO3fP7jJqT656LcShcKpiX0Y3pKSmb0kHW9pwCWM9bj5NrGJjTf3a1pSYaO5LLGg9WtFcgP9rzCU87Dr37cfNdYsYfVfX0S4jXMciZFoXaAply1]--></g></svg>