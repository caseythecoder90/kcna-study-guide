<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="287px" preserveAspectRatio="none" style="width:1414px;height:287px;background:#FFFFFF;" version="1.1" viewBox="0 0 1414 287" width="1414px" zoomAndPan="magnify"><title>Sixty years of isolating workloads &#8212; from the mainframe to Docker</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="574.1543" x="416.6729" y="30.8838">Sixty years of isolating workloads &#8212; from the mainframe to Docker</text></g><!--entity cpcms--><g class="entity" data-entity="cpcms" data-source-line="4" data-uid="ent0002" id="entity_cpcms"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="219.9575" x="6" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.8208" x="20" y="87.8921">1960s-70s &#183; CP/CMS</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="191.9575" x="20" y="100.9648">IBM mainframe OS: time sharing plus a</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="183.4282" x="20" y="113.6138">virtual machine per user &#8212; one of the</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="156.5137" x="20" y="126.2627">earliest uses of virtual machines</text></g><!--entity chroot--><g class="entity" data-entity="chroot" data-source-line="5" data-uid="ent0003" id="entity_chroot"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="225.4575" x="244.5" y="68.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.6035" x="258.5" y="94.3921">1979 &#183; chroot</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="172.0791" x="258.5" y="107.4648">Version 7 Unix: change a process's</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="197.4575" x="258.5" y="120.1138">root directory &#8212; filesystem-only isolation</text></g><!--entity jails--><g class="entity" data-entity="jails" data-source-line="6" data-uid="ent0004" id="entity_jails"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="229.749" x="488" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5508" x="502" y="87.8921">2000 &#183; FreeBSD Jails</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="201.749" x="502" y="100.9648">FreeBSD 4.0: own users, processes, files</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="186.4951" x="502" y="113.6138">and network per jail; powerful but hard</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="161.4014" x="502" y="126.2627">to use &#8212; never went mainstream</text></g><!--entity vms--><g class="entity" data-entity="vms" data-source-line="7" data-uid="ent0005" id="entity_vms"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="259.9434" x="736" y="68.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.9434" x="750" y="94.3921">2001-05 &#183; Hypervisors and OS partitions</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="164.4575" x="750" y="107.4648">VMware ESX (2001): VMs on x86</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="177.2783" x="750" y="120.1138">HP-UX vPars &#183; Solaris Zones (2005)</text></g><!--entity ns--><g class="entity" data-entity="ns" data-source-line="8" data-uid="ent0006" id="entity_ns"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="216.8477" x="382.5" y="185.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.7998" x="396.5" y="211.3921">2002 &#183; Linux namespaces</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.1475" x="396.5" y="224.4648">kernel 2.4.19 starts the series:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="188.8477" x="396.5" y="237.1138">mount, then UTS, IPC, PID, net, user</text></g><!--entity cg--><g class="entity" data-entity="cg" data-source-line="9" data-uid="ent0007" id="entity_cg"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="262.8081" x="617.5" y="185.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.5444" x="631.5" y="211.3921">2006-08 &#183; cgroups</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="199.4609" x="631.5" y="224.4648">Google's &#8220;process containers&#8221; (2006),</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.8081" x="631.5" y="237.1138">released 2007, merged in kernel 2.6.24 (2008)</text></g><!--entity docker--><g class="entity" data-entity="docker" data-source-line="10" data-uid="ent0008" id="entity_docker"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="257.1899" x="898.5" y="178.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="84.5508" x="912.5" y="204.8921">2013 &#183; Docker</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="229.1899" x="912.5" y="217.9648">dotCloud (2010) open-sources its tooling as</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.9136" x="912.5" y="230.6138">Docker: namespaces + cgroups + images +</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.8398" x="912.5" y="243.2627">a simple CLI &#8212; containers go mainstream</text></g><!--entity k8s--><g class="entity" data-entity="k8s" data-source-line="11" data-uid="ent0009" id="entity_k8s"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="235.3398" x="1173.5" y="185.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="207.3398" x="1187.5" y="211.3921">2014-15 &#183; Kubernetes and the OCI</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="206.5776" x="1187.5" y="224.4648">orchestration open-sourced by Google;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="201.6899" x="1187.5" y="237.1138">runc and the specs donated to the OCI</text></g><g class="link" data-entity-1="cpcms" data-entity-2="chroot" data-uid="lnk10" id="link_cpcms_chroot"><polygon fill="#475569" points="244.2905,102.1982,235.2905,98.1982,239.2905,102.1982,235.2905,106.1982,244.2905,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M226.1445,102.1982 C232.1932,102.1982 232.2418,102.1982 238.2905,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="chroot" data-entity-2="jails" data-uid="lnk11" id="link_chroot_jails"><polygon fill="#475569" points="487.8461,102.1982,478.8461,98.1982,482.8461,102.1982,478.8461,106.1982,487.8461,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M469.9102,102.1982 C475.8888,102.1982 475.8674,102.1982 481.8461,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="jails" data-entity-2="vms" data-uid="lnk12" id="link_jails_vms"><polygon fill="#475569" points="735.9768,102.1982,726.9768,98.1982,730.9768,102.1982,726.9768,106.1982,735.9768,102.1982" style="stroke:#475569;stroke-width:1;"/><path d="M718.0625,102.1982 C724.0339,102.1982 724.0054,102.1982 729.9768,102.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="vms" data-entity-2="ns" data-uid="lnk13" id="link_vms_ns"><polygon fill="#475569" points="588.7811,185.1543,598.5757,186.1867,593.5378,183.6137,596.1107,178.5759,588.7811,185.1543" style="stroke:#475569;stroke-width:1;"/><path d="M750.2619,136.2044 C705.9615,149.0984 655.0297,164.2385 609,178.6982 C602.4047,180.7701 601.3225,181.0925 594.4891,183.3056" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ns" data-entity-2="cg" data-uid="lnk14" id="link_ns_cg"><polygon fill="#475569" points="617.3924,219.1982,608.3924,215.1982,612.3924,219.1982,608.3924,223.1982,617.3924,219.1982" style="stroke:#475569;stroke-width:1;"/><path d="M599.5918,219.1982 C605.5253,219.1982 605.4589,219.1982 611.3924,219.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="cg" data-entity-2="docker" data-uid="lnk15" id="link_cg_docker"><polygon fill="#475569" points="898.3896,219.1982,889.3896,215.1982,893.3896,219.1982,889.3896,223.1982,898.3896,219.1982" style="stroke:#475569;stroke-width:1;"/><path d="M880.6699,219.1982 C886.5765,219.1982 886.483,219.1982 892.3896,219.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="docker" data-entity-2="k8s" data-uid="lnk16" id="link_docker_k8s"><polygon fill="#475569" points="1173.3605,219.1982,1164.3605,215.1982,1168.3605,219.1982,1164.3605,223.1982,1173.3605,219.1982" style="stroke:#475569;stroke-width:1;"/><path d="M1155.6484,219.1982 C1161.5524,219.1982 1161.4565,219.1982 1167.3605,219.1982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="951.7539" x="227.873" y="271.8301">The ingredients existed long before Docker. What Docker added was not isolation &#8212; the kernel already had it &#8212; but packaging (images) and ease of use.</text></g><!--SRC=[TLNDSXf74Bxp51rVR2hiiYWoaZ35mIYnIQmILLYAAp-7qMwpJ9YTsPgPvISdFqIEoNFadaVnawHx5iHAu2eLx8wckx_lww-RRwHELPKXn76t_lF6ADVDfCYjA5ntcMeH-GKM69TLeLfUUeKmank_XIqAwy3CGJgZX9SwXxMnIsL4vk3BvxzWRaq150o5a7fE-H2yWMkJBj6sMXPJBtHEwLxqhlg9YouI1__z2-DfTtmp-qqFdVmJ1xtUQFBsff7XTZO0B-d1BOJbcgMg78XXbw-F6c4hQNqb58Mc2waHIhHGEVfWQ8OE23c1EmuaMagYytmxy7kMoUr2Ni1mM5GUiz48X8EqJ0ltbDN55HDA5zOOtoXmZzP9e-42xhJS3EW2HI08AAr9qRcNxXWKfu1CSdfZjxMyKg7REez5PBJQxjjWz5Vm1HXDW6T9aZ307opYszar_2YaSesQ-_FpE1c0MUiWd-liOI8z1Wp7Q8NEGADdEmJT_w3CRw0qQxJpIi53vO6wbnq7aZ-eIA2dSKMHQzG-TDzvYw9eK2iLdTRKEBrxngmN9Q-PtFij0LYHDkHLXdKxWr9OyZ49rIHxVxCM5k7xsITunU7j0TpVKFirR2xxnq3VJwExJx2QyWXGbHb9RwM3NyXOBYHutJwDTLKyHth62Jv8NMr0ayDTAKZTHYcQ5eqApkBpk7S5pXDw5yQAka4-7Ho3AqobVOVlQBZxEEl0P3hkm7HotU6kT