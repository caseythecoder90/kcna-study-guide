<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="797px" preserveAspectRatio="none" style="width:535px;height:797px;background:#FFFFFF;" version="1.1" viewBox="0 0 535 797" width="535px" zoomAndPan="magnify"><title>The Argo project: four tools, one family (CNCF Graduated)</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="499.0166" x="14" y="30.8838">The Argo project: four tools, one family (CNCF Graduated)</text></g><!--entity ev--><g class="entity" data-qualified-name="ev" data-source-line="4" id="ent0002"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="246.8828" x="143.5083" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.8145" x="157.5083" y="87.8921">Argo Events</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="139.3799" x="157.5083" y="100.9648">EVENT-DRIVEN automation</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="218.8828" x="157.5083" y="113.6138">EventSource (webhook, Kafka, S3, cron, Git)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.2007" x="157.5083" y="126.2627">&#8594; Sensor &#8594; trigger</text></g><!--entity wf--><g class="entity" data-qualified-name="wf" data-source-line="5" id="ent0003"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="301.2061" x="116.5083" y="217.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="99.6646" x="130.5083" y="243.8921">Argo Workflows</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="273.2061" x="130.5083" y="256.9648">WORKFLOW ENGINE: parallel jobs, each step a Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="209.0215" x="130.5083" y="269.6138">Workflow CRD &#183; steps or DAG &#183; artifacts</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132.0161" x="130.5083" y="282.2627">CI, data and ML pipelines</text></g><!--entity cd--><g class="entity" data-qualified-name="cd" data-source-line="6" id="ent0004"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="221.1392" x="156.5083" y="477.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="52.7173" x="170.5083" y="503.8921">Argo CD</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="171.7354" x="170.5083" y="516.9648">GitOps CONTINUOUS DELIVERY</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="193.1392" x="170.5083" y="529.6138">Application CRD &#183; sync Git &#8594; cluster</text></g><!--entity ro--><g class="entity" data-qualified-name="ro" data-source-line="7" id="ent0005"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="251.0991" x="141.5083" y="606.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.9346" x="155.5083" y="632.8921">Argo Rollouts</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="138.1445" x="155.5083" y="645.9648">PROGRESSIVE DELIVERY</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="176.0161" x="155.5083" y="658.6138">Rollout CRD &#183; canary &#183; blue-green</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.0991" x="155.5083" y="671.2627">analysis (Prometheus) &#8594; promote or abort</text></g><!--entity git--><g class="entity" data-qualified-name="git" data-source-line="8" id="ent0006"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="121.2026" x="206.5083" y="373.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.2026" x="220.5083" y="399.8921">Git (config repo)</text></g><!--entity traffic--><g class="entity" data-qualified-name="traffic" data-source-line="9" id="ent0007"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="168.8862" x="182.5083" y="748.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.8862" x="196.5083" y="774.8921">Users / production traffic</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="267.0083,217.6738,271.0083,208.6738,267.0083,212.6738,263.0083,208.6738,267.0083,217.6738" style="stroke:#475569;stroke-width:1;"/><path d="M267.0083,142.8571 C267.0083,165.8499 267.0083,188.7039 267.0083,211.6738" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="40.0137" x="298.0278" y="177.954