<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="135px" preserveAspectRatio="none" style="width:1281px;height:135px;background:#FFFFFF;" version="1.1" viewBox="0 0 1281 135" width="1281px" zoomAndPan="magnify"><title>The four OpenGitOps principles as one loop</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="378.0352" x="447.9824" y="30.8838">The four OpenGitOps principles as one loop</text></g><!--entity d--><g class="entity" data-qualified-name="d" data-source-line="5" id="ent0002"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="179.6045" x="6" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.8335" x="20" y="87.8921">1. Declarative</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="151.6045" x="20" y="100.9648">desired state written as data:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.9038" x="20" y="113.6138">YAML, Helm, Kustomize</text></g><!--entity v--><g class="entity" data-qualified-name="v" data-source-line="6" id="ent0003"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="236.4521" x="320" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="172.6563" x="334" y="87.8921">2. Versioned and immutable</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="208.4521" x="334" y="100.9648">stored in Git: every change is a commit,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.1206" x="334" y="113.6138">reviewed, auditable, revertible</text></g><!--entity p--><g class="entity" data-qualified-name="p" data-source-line="7" id="ent0004"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="205.2783" x="593" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.1563" x="607" y="87.8921">3. Pulled automatically</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="177.2783" x="607" y="100.9648">an agent fetches the desired state</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="111.8584" x="607" y="113.6138">from the source itself</text></g><!--entity r--><g class="entity" data-qualified-name="r" data-source-line="8" id="ent0005"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="194.1372" x="835" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.1372" x="849" y="87.8921">4. Continuously reconciled</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="161.4014" x="849" y="100.9648">observe actual state &#183; compare</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="153.4253" x="849" y="113.6138">&#183; apply the difference &#183; repeat</text></g><!--entity c--><g class="entity" data-qualified-name="c" data-source-line="9" id="ent0006"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="118.3271" x="1157" y="74.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.3271" x="1171" y="100.3921">Running cluster</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="319.7942,95.6982,310.7942,91.6982,314.7942,95.6982,310.7942,99.6982,319.7942,95.6982" style="stroke:#475569;stroke-width:1;"/><path d="M186.331,95.6982 C227.1567,95.6982 270.0628,95.6982 313.7942,95.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="86.3555" x="210" y="87.9541">commit + merge</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="592.8171,95.6982,583.8171,91.6982,587.8171,95.6982,583.8171,99.6982,592.8171,95.6982" style="stroke:#475569;stroke-width:1;"/><path d="M556.281,95.6982 C568.4812,95.6982 574.8096,95.6982 586.8171,95.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="834.8124,95.6982,825.8124,91.6982,829.8124,95.6982,825.8124,99.6982,834.8124,95.6982" style="stroke:#475569;stroke-width:1;"/><path d="M798.332,95.6982 C810.4452,95.6982 816.7817,95.6982 828.8124,95.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="1156.9109,94.0124,1147.9979,89.8221,1151.912,93.9061,1147.8279,97.8203,1156.9109,94.0124" style="stroke:#475569;stroke-width:1;"/><path d="M1029.1588,93.8544 C1063.7851,93.431 1103.1481,93.2266 1139,93.6982 C1144.8071,93.7746 1144.8644,93.7564 1150.9122,93.8849" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="28.6875" x="1079" y="85.9541">apply</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="1029.141,120.2971,1037.3709,125.7071,1034.0745,121.11,1038.6716,117.8136,1029.141,120.2971" style="stroke:#475569;stroke-width:1;"/><path d="M1161.6363,117.2021 C1154.1408,119.4701 1146.4514,121.414 1139,122.6982 C1103.2766,128.8553 1069.7736,126.9925 1035.0612,121.2726" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="80.6953" x="1053" y="114.9541">observe (drift?)</text></g><?plantuml-src RPBVgjH03CRl-nJnN2dkTbdrQbageg2WSaJaWE1DpapQ1kSVCvaUrXVptYSpxQvGEGk5wJJ9bz-Nz0a7uwebQDlT-P4ONTbPnY6ZBxkV9k1MHlBKfkfTuwWNa0YPXr70SYOZ74CZB8xWsqZGnvhXDb5uptAR2gIiFJWvAe05OY1mCQQccIin35fris_X7Hc76OKd-X6EXN_HOR_lB1NjOA482i53PX4Aiun5mSDnD-Trg_plRpv_si07Sdu37skHw3LmIRk1ut68qNRT8h3k_wA5Eyf5VMWl31RO-ofuxzOigZQZS00rTW2QA9_0Z2f1mEeDJFIUPVEOAjF4z41s0rWjBxeRoBE0iBvVvPlMV2zR-5ATc-6gUj8f6NJkj6g1EfM1Wa1FOaOTjQuC_flUOwm-Hx_a5TsOKHDIoFLNQTAQvbKBRsCG3ZNMuaxgn4JTiEAjnEDzeJmHe96AxhB0Fx_d8INCLsWqXYcft4BEVK-PWbbgCYL2MO6XCUhrZ9RNQ5zh21m6q7-w2EKvLnT95nUcQInijnrCSBXi2vw3fpnGCos1rAJbLD7bD9guK3Nc_5tl_vmzjPbxUVtiBm00?></g></svg>