<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="420px" preserveAspectRatio="none" style="width:793px;height:420px;background:#FFFFFF;" version="1.1" viewBox="0 0 793 420" width="793px" zoomAndPan="magnify"><title>Two separate questions Argo CD answers about every Application</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="569.127" x="108.3691" y="30.8838">Two separate questions Argo CD answers about every Application</text></g><!--cluster sync--><g class="cluster" data-qualified-name="sync" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="457" x="50.9326" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="270.8735" x="143.9958" y="71.8921">SYNC STATUS: does the cluster match Git?</text></g><!--cluster health--><g class="cluster" data-qualified-name="health" data-source-line="10" id="ent0006"><rect fill="#F8FAFC" height="97" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="658" x="50.9326" y="170.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="284.0322" x="237.9165" y="188.8921">HEALTH STATUS: is what's running working?</text></g><!--cluster pol--><g class="cluster" data-qualified-name="pol" data-source-line="20" id="ent0014"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="707" x="50.9326" y="275.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="253.519" x="277.6731" y="293.8921">Sync policy: what to do when OutOfSync</text></g><!--entity s1--><g class="entity" data-qualified-name="sync.s1" data-source-line="5" id="ent0003"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="185.1206" x="93.4326" y="92.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.2427" x="107.4326" y="118.8921">Synced</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.1206" x="107.4326" y="131.9648">live == rendered Git manifests</text></g><!--entity s2--><g class="entity" data-qualified-name="sync.s2" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="202.8022" x="296.4326" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.8945" x="310.4326" y="112.8921">OutOfSync</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.8022" x="310.4326" y="125.9648">something differs: a new commit,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="159.543" x="310.4326" y="138.6138">a manual edit, a deleted object</text></g><!--entity h1--><g class="entity" data-qualified-name="health.h1" data-source-line="11" id="ent0007"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="74.96" x="93.4326" y="210.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.96" x="107.4326" y="236.3921">Healthy</text></g><!--entity h2--><g class="entity" data-qualified-name="health.h2" data-source-line="12" id="ent0008"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="119.6738" x="186.9326" y="203.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75.8545" x="200.9326" y="229.8921">Progressing</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="91.6738" x="200.9326" y="242.9648">rollout under way</text></g><!--entity h3--><g class="entity" data-qualified-name="health.h3" data-source-line="13" id="ent0009"><rect fill="#FEE2E2" height="55.5977" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="142.2808" x="324.9326" y="203.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.96" x="338.9326" y="229.8921">Degraded</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="114.2808" x="338.9326" y="242.9648">failing / crash-looping</text></g><!--entity h4--><g class="entity" data-qualified-name="health.h4" data-source-line="14" id="ent0010"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="215.1479" x="485.4326" y="210.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1479" x="499.4326" y="236.3921">Suspended &#183; Missing &#183; Unknown</text></g><!--entity m--><g class="entity" data-qualified-name="pol.m" data-source-line="21" id="ent0015"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="141.0991" x="93.4326" y="308.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.939" x="107.4326" y="334.8921">Manual (default)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="103.3237" x="107.4326" y="347.9648">show the diff, wait for</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="113.0991" x="107.4326" y="360.6138">a human to click SYNC</text></g><!--entity a--><g class="entity" data-qualified-name="pol.a" data-source-line="22" id="ent0016"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="147.8022" x="252.9326" y="308.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.73" x="266.9326" y="334.8921">automated</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="119.8022" x="266.9326" y="347.9648">apply new Git commits</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="70.3022" x="266.9326" y="360.6138">automatically</text></g><!--entity sh--><g class="entity" data-qualified-name="pol.sh" data-source-line="23" id="ent0017"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="158.8345" x="419.4326" y="308.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.5645" x="433.4326" y="334.8921">+ selfHeal: true</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="130.8345" x="433.4326" y="347.9648">also revert LIVE changes</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="122.8477" x="433.4326" y="360.6138">(kubectl edit, deletions)</text></g><!--entity pr--><g class="entity" data-qualified-name="pol.pr" data-source-line="24" id="ent0018"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="152.7061" x="596.4326" y="308.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.8154" x="610.4326" y="334.8921">+ prune: true</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.7061" x="610.4326" y="347.9648">delete objects that were</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="91.6846" x="610.4326" y="360.6138">removed from Git</text></g><g class="caption" data-source-line="33"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="775.8652" x="5" y="404.8301">An app can be Synced but Degraded (Git describes a broken image), or OutOfSync but Healthy (someone scaled it by hand).</text></g><?plantuml-src RLHTRzD047pFhrZwGYAQH2bzYjAWgArQf9OYDKL2mCFPjyuTET-P-wXb4B-BTtuPUquQRCTIf2I-szdnxCo-aZfLWIDC9jFTnnkZt9HBjh4iTzDjgjdO2ynnKeHS3Rpq2c5T6d1OCCiyme-0pakZ7Qpini3b5J3jIhGEM6A21tn6My6gA9HCMRmu65XCFTCRGZfv_FpX4XxNg_NJunouGGVK3OYKysWXPpuLS2FzknDOB3RMX6Av1ER0LJg5NmE09XGzG_vLBvpyYVFPRAdaCyB51TtH72to24IGMcR4s2scyTwo1ZQ6xt5dRSo7u1-o2Do0TIP7BwJU09TPHYyw1mOQIqXDdaj_kWTkLB3ODJ05oEcSRdDKw8cGIRvJhmQJXBqGEICYRWRZBq9oZlgRbHlXnyjuyBkbuEtrwcvzUz1GEYW5ywyTsA1rP5aQkwNlheG2cVAYA-9j_RHggo8wgdoqPcFHEK9jlAKrIiM1XwWsbAmwl5U4E6j3N24PZBV6bJ6f8jyff9OvCLR65FI_JntnjZFwu8euP0v__y2zh9d5dqzwgqsfOsqUIF1zzJbLYnvjQvBYhESWzXDlUmxEEzE8Ne72aDUhUJq8y8PyJJzHmy5DXr7S73IcckuixdUc6NBCM51-rFIWC6MTb6Z1KnARd9qPssSz4SXyaKLAfBOG0zUGj51CwXs3lDsT1MyeVwqHCKfnLNizHcddTzVJT5TAULUgwiqPQ_TwG-j4PT5xS_0sO1DBEKDNQObuk7l_wHfIGKNOqtMu3Gb1lgIipbZSIwF-f8ikXO82WqVzTr7T9pLk9nefRJSyxcynDyzamSoQFEhJsxQmr