<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="493px" preserveAspectRatio="none" style="width:856px;height:493px;background:#FFFFFF;" version="1.1" viewBox="0 0 856 493" width="856px" zoomAndPan="magnify"><title>Push-based CI/CD vs pull-based GitOps</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="341.0596" x="249.9702" y="30.8838">Push-based CI/CD vs pull-based GitOps</text></g><!--cluster push--><g class="cluster" data-qualified-name="push" data-source-line="4" id="ent0002"><rect fill="#FEF2F2" height="421.5" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="406" x="14" y="66.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.6899" x="134.655" y="84.3921">Push: the pipeline deploys</text></g><!--cluster pull--><g class="cluster" data-qualified-name="pull" data-source-line="14" id="ent0010"><rect fill="#F0FDF4" height="355" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="422" x="428" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="278.0908" x="499.9546" y="71.8921">Pull: an agent in the cluster deploys (GitOps)</text></g><!--entity p1--><g class="entity" data-qualified-name="push.p1" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="73.5317" x="335" y="99.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="45.5317" x="349" y="125.3921">git push</text></g><!--entity p2--><g class="entity" data-qualified-name="push.p2" data-source-line="6" id="ent0004"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="244.9707" x="131.5" y="215.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.1182" x="145.5" y="241.8921">CI/CD pipeline</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="216.9707" x="145.5" y="254.9648">build &#183; test &#183; kubectl apply / helm upgrade</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="165.6123" x="145.5" y="267.6138">holds CLUSTER CREDENTIALS</text></g><!--entity p3--><g class="entity" data-qualified-name="push.p3" data-source-line="7" id="ent0005"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="69.1772" x="189.5" y="358.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1772" x="203.5" y="384.8921">Cluster</text></g><!--entity pl--><g class="entity" data-qualified-name="push.pl" data-source-line="10" id="ent0008"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="361.3672" x="36.5" y="463.0161">Nothing notices later drift: a manual kubectl edit stays until the next deploy</text></g><!--entity g1--><g class="entity" data-qualified-name="pull.g1" data-source-line="15" id="ent0011"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="156.7021" x="684.5" y="92.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8862" x="698.5" y="118.8921">git push / merge PR</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="128.7021" x="698.5" y="131.9648">Git = single source of truth</text></g><!--entity g2--><g class="entity" data-qualified-name="pull.g2" data-source-line="16" id="ent0012"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="144.7891" x="647.5" y="221.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.2427" x="661.5" y="247.8921">Git repo</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="116.7891" x="661.5" y="260.9648">desired state, versioned</text></g><!--entity g3--><g class="entity" data-qualified-name="pull.g3" data-source-line="17" id="ent0013"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="195.5845" x="470" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.5845" x="484" y="112.8921">GitOps agent IN the cluster</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="76.9946" x="484" y="125.9648">Argo CD &#183; Flux</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="127.7676" x="484" y="138.6138">pulls, compares, applies</text></g><!--entity g4--><g class="entity" data-qualified-name="pull.g4" data-source-line="18" id="ent0014"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="69.1772" x="495.5" y="228.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1772" x="509.5" y="254.3921">Cluster</text></g><!--entity gl--><g class="entity" data-qualified-name="pull.gl" data-source-line="22" id="ent0018"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="298.9927" x="450.5" y="384.0161">No credentials leave the cluster; drift is detected and reverted</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk6"><polygon fill="#475569" points="284.7419,215.6116,293.7983,211.741,288.1453,211.9486,287.9376,206.2956,284.7419,215.6116" style="stroke:#475569;stroke-width:1;"/><path d="M352.7786,142.3856 C334.3623,162.2066 310.3513,188.049 288.826,211.216" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="228.7925,358.6705,234.7339,350.8156,229.9292,353.8014,226.9434,348.9968,228.7925,358.6705" style="stroke:#475569;stroke-width:1;"/><path d="M246.2743,283.7902 C240.7535,307.4375 234.8622,332.6719 230.1566,352.8276" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7324" x="260.3281" y="318.9541">pushes changes IN</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.3887" x="248" y="332.7529">(one-shot, from outside)</text></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0012" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="776.0099,221.5263,785.5636,219.1331,779.9486,218.4462,780.6354,212.8312,776.0099,221.5263" style="stroke:#475569;stroke-width:1;"/><path d="M787.5613,148.8845 C797.7692,163.5836 805.4812,181.9081 797,197.6982 C791.9925,207.0212 789.1754,211.2308 780.7363,217.8302" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0013" data-entity-2="ent0012" data-link-type="dependency" id="lnk16"><polygon fill="#475569" points="691.5025,221.565,687.9686,212.372,687.9676,218.0288,682.3107,218.0278,691.5025,221.565" style="stroke:#475569;stroke-width:1;"/><path d="M627.235,154.8702 C635.2301,160.3809 643.0585,166.377 650,172.6982 C660.3185,182.0947 659.8226,187.1844 669,197.6982 C675.9992,205.7166 679.731,209.7894 687.2606,217.3216" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.7227" x="675" y="189.9541">pulls (poll / webhook)</text></g><g class="link" data-entity-1="ent0013" data-entity-2="ent0014" data-link-type="dependency" id="lnk17"><polygon fill="#475569" points="519.0789,228.0248,519.1983,218.1766,517.1037,223.4314,511.849,221.3368,519.0789,228.0248" style="stroke:#475569;stroke-width:1;"/><path d="M525.343,154.9036 C520.7526,160.3375 516.7564,166.3036 514,172.6982 C506.3142,190.5288 509.9673,206.8348 516.7087,222.5127" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.0664" x="520" y="189.9541">reconciles continuously</text></g><?plantuml-src ZPBFJjj04CRlUOef9v08LWYdD8r40qMHK5e5UYezRBoJzOhnxch_06d5S_NU9-ki7Imt5AcI9Q_iRsQ-_URtJfkIaaGuEIdQ9rfBeP1QA2_gKDoNHWnZXJMUk5JJ8Ef825zIg8Ph4L32V57CB-0XW4j4kszNEdvsOJ3mM4PX51SSv8e9S2DmsY5fWo3HaTs60vXEbRV9VHHoDWEHEuKAVWu0UlLAn-PxLZiIskoaexzbhPkN4NTc6lGFd8n6itNI9E7tBuWOOdxVfpMN4GZdQ0i5L4Wr9CUtbZWjSjciLrvPaW7crrzlRYzNC5zTNbmkRnVdrpSxQRQrxloVxfcY52BwhAbJn1VLc5Lk1CFXhArmf-rv39FcgXYWhBW5lnVBEtDe3Gv3PUCnRBojmQOOjCGZhYInHeA3pktInaeR1SP6NN8v2HuFqkjDd820MfWag4i09MSRejW6I2PgQhPay2dkDjHTCPkcR7GCms-LbXBDTsaVJJPDW-UzVHFnB0D2eOcWJTErR9DuMJqSjgGSTGnSMTj1GFGM1Bok6hrY3bUz7N4l-011DzfWaoyHx0QYJx7ghQb7ZzgZ9tVmw6olgSIWFIFD-KGyXWVqGVCYv1iDJryrvEljCbWi-ndqPfnxPO6nPIe_KNfwJL_E8Xn3QMidFF8fGwinz4oeBZWr_X_wr1chL4jVurgDT-U6Ffu7Xyxo2Wfun7LbxVrHJtJ68XvXJQafOsgP6vDi2hJz9uvGSeQSWHRSbr0yO3-AzosQe0E34TavvosCv0aST-nbdNrd07d-Fe2g0R21e_lbjQfYXfElymS0?></g></svg>