<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="315px" preserveAspectRatio="none" style="width:849px;height:315px;background:#FFFFFF;" version="1.1" viewBox="0 0 849 315" width="849px" zoomAndPan="magnify"><title>Centralized vs decentralized: the usual way each tool is deployed</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="559.1602" x="140.9766" y="30.8838">Centralized vs decentralized: the usual way each tool is deployed</text></g><!--cluster argo--><g class="cluster" data-qualified-name="argo" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="219.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="352" x="48.0566" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="232.5718" x="107.7708" y="71.8921">Argo CD: hub and spoke (centralized)</text></g><!--cluster flux--><g class="cluster" data-qualified-name="flux" data-source-line="14" id="ent0010"><rect fill="#F0FDF4" height="220" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="408" x="408.0566" y="59.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="279.5698" x="472.2717" y="77.8921">Flux: one instance per cluster (decentralized)</text></g><!--entity hub--><g class="entity" data-qualified-name="argo.hub" data-source-line="5" id="ent0003"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="202.8452" x="163.5566" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.7026" x="177.5566" y="112.8921"