<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="341px" preserveAspectRatio="none" style="width:799px;height:341px;background:#FFFFFF;" version="1.1" viewBox="0 0 799 341" width="799px" zoomAndPan="magnify"><title>ApplicationSet: one template &#215; a generator = many Applications</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="547.1191" x="122.4404" y="30.8838">ApplicationSet: one template &#215; a generator = many Applications</text></g><!--cluster out--><g class="cluster" data-qualified-name="out" data-source-line="8" id="ent0005"><rect fill="#F0FDF4" height="97" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="470" x="323" y="208.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="430.5234" x="342.7383" y="226.8921">Generated Applications (kept in sync by the applicationset-controller)</text></g><!--entity aps--><g class="entity" data-qualified-name="aps" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="164.5" x="256.5" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.5" x="270.5" y="79.8921">ApplicationSet  billing</text></g><!--entity gen--><g class="entity" data-qualified-name="gen" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="355.958" x="6" y="138.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.958" x="20" y="164.8921">Generator (list &#183; cluster &#183; git &#183; matrix &#183; SCM &#183; pull request)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="206.6743" x="20" y="177.9648">list: [acme, globex, initech]   &#8594;   {{.tenant}}</text></g><!--entity tpl--><g class="entity" data-qualified-name="tpl" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="229.8242" x="380" y="132.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.1899" x="394" y="158.8921">Template</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="179.1689" x="394" y="171.9648">source: config repo, path apps/billing</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="201.8242" x="394" y="184.6138">destination namespace: tenant-{{.tenant}}</text></g><!--entity a1--><g class="entity" data-qualified-name="out.a1" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="122.7461" x="365.5" y="241.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75.8481" x="379.5" y="267.8921">billing-acme</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="94.7461" x="379.5" y="280.9648">&#8594; ns tenant-acme</text></g><!--entity a2--><g class="entity" data-qualified-name="out.a2" data-source-line="10" id="ent0007"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="130.0615" x="507" y="241.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" te