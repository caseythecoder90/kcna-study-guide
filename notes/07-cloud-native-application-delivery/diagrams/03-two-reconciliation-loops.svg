<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="598px" preserveAspectRatio="none" style="width:1171px;height:598px;background:#FFFFFF;" version="1.1" viewBox="0 0 1171 598" width="1171px" zoomAndPan="magnify"><title>Why Argo CD brought back a deleted namespace: two loops, two sources of truth</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="699.0732" x="232.1157" y="30.8838">Why Argo CD brought back a deleted namespace: two loops, two sources of truth</text></g><!--cluster outer--><g class="cluster" data-qualified-name="outer" data-source-line="6" id="ent0003"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="300" x="443.1523" y="144.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="196.4282" x="494.9382" y="162.8921">Loop 2: GitOps (Argo CD / Flux)</text></g><!--cluster inner--><g class="cluster" data-qualified-name="inner" data-source-line="12" id="ent0006"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="258" x="464.1523" y="389.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.8608" x="496.7219" y="407.8921">Loop 1: Kubernetes controllers</text></g><!--entity git--><g class="entity" data-qualified-name="git" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="226.0269" x="480.1523" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.2363" x="494.1523" y="87.8921">Git repository</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="198.0269" x="494.1523" y="100.9648">the desired state of the APPLICATION</text></g><!--entity etcd--><g class="entity" data-qualified-name="etcd" data-source-line="10" id="ent0005"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="194.9175" x="495.6523" y="306.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.4644" x="509.6523" y="332.8921">Kubernetes API / etcd</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="166.9175" x="509.6523" y="345.9648">the desired state of each OBJECT</text></g><!--entity run--><g class="entity" data-qualified-name="run" data-source-line="16" id="ent0008"><rect fill="#F1F5F9" height="42.9487" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="140.0171" x="523.1523" y="527.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.0171" x="537.1523" y="553.8921">Running containers</text></g><!--entity o1--><g class="entity" data-qualified-name="outer.o1" data-source-line="7" id="ent0004"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="283.5459" x="451.1523" y="177.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="212.3799" x="465.1523" y="203.8921">Compares Git with the live objects</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="255.5459" x="465.1523" y="216.9648">Namespace, Deployment, Service, PVC missing?</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="232.2515" x="465.1523" y="229.6138">&#8594; OutOfSync &#8594; re-apply from Git (self-heal)</text></g><!--entity i1--><g class="entity" data-qualified-name="inner.i1" data-source-line="13" id="ent0007"><rect fill="#EFF6FF" height="68.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="241.1035" x="472.6523" y="422.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="213.1035" x="486.6523" y="448.8921">Deployment &#8594; ReplicaSet &#8594; Pods</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.7061" x="486.6523" y="461.9648">Pod deleted? recreate it</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="117.9707" x="486.6523" y="474.6138">Node lost? reschedule</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="593.1523,177.5901,597.1523,168.5901,593.1523,172.5901,589.1523,168.5901,593.1523,177.5901" style="stroke:#475569;stroke-width:1;"/><path d="M593.1523,117.9281 C593.1523,135.6306 593.1523,152.8232 593.1523,171.5901" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="593.1523,306.3926,597.1523,297.3926,593.1523,301.3926,589.1523,297.3926,593.1523,306.3926" style="stroke:#475569;stroke-width:1;"/><path d="M593.1523,245.762 C593.1523,264.7945 593.1523,282.4229 593.1523,300.3926" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.0859" x="599.1523" y="280.9541">kubectl apply equivalent</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="593.1523,422.5901,597.1523,413.5901,593.1523,417.5901,589.1523,413.5901,593.1523,422.5901" style="stroke:#475569;stroke-width:1;"/><path d="M593.1523,362.9281 C593.1523,380.6306 593.1523,397.8232 593.1523,416.5901" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="593.1523,527.6447,597.1523,518.6447,593.1523,522.6447,589.1523,518.6447,593.1523,527.6447" style="stroke:#475569;stroke-width:1;"/><path d="M593.1523,490.8832 C593.1523,503.1922 593.1523,510.7861 593.1523,521.6447" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1153.3047" x="5" y="582.8301">Delete a Pod: loop 1 fixes it. Delete the Deployment or the whole namespace: its desired state is gone from etcd, so loop 1 has nothing to restore. Only loop 2, reading Git, can recreate it.</text></g><?plantuml-src XPFFJXin4CRl-nHJJY3bZy8nYXQbeKMqY4I0sailZdUow-BrRErP8AsuzW7wY7sIZhq9B72ej8UrFPxvlfzdtXcdRLiWZ4RZxcCY6yQ5KQLNTHZVQgU6N66DewQjRSQ6BSBNQWjpNn8iJc7jgIqhXhNIjw2WG8kC1JXLOsYKnYdmFO4bQi8W_GPglSO0j07sBLTPvb6pSgKaFZWp31uR2eR9Rx-vMJ0_SJgPvA91SWVZ9NTWnPZko-PyjReuNynlpfUNit6CpWzWDbDQe-Cy1nMWDFoYneLeWUCfIArb4-1mxsGC7stxS1IlbsAgEICgkWpKCdhubG7qqYoeRfGN8r7plU4goR7cJgIjlqjSwCc_tECOm2asbhQro1l0DVex4pTNNnPGcn2CAqzsDdgt__x-0ykMbvlhhTCGLnw7gcdi5ZQUwgJWCA3T32jKzgZ7eNpsCCaUNs3utAxHEtci80pFnJsoBlv779MkOFd-quV5JQzAOvLnNPcOv2tjoHHwvJGvzcGj-l04kxjjd7iB-XbOidubIwFLDNRB5HLzqBBSz-19JE8nAZVy5kebITzR2XpZWgwmQ2q-cOfYNXExQfsJ1qhwnV1EVYtDiMFiMvTbqcum7EOHE4tINsG2KxWL0fejT0-7Frfpfwouoj9v39IAfhkICcdLi247CvEV9aioN-9lcgO99h0n3qBJy0Xsn_79UhJ8fvtxYaHzRo0DXrSlQsHAo67NJL7EGCPqNwOIPuw