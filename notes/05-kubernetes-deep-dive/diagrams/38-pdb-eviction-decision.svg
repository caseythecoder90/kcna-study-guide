<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="612px" preserveAspectRatio="none" style="width:1177px;height:612px;background:#FFFFFF;" version="1.1" viewBox="0 0 1177 612" width="1177px" zoomAndPan="magnify"><title>How a PodDisruptionBudget says no &#8212; the lecture's numbers</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="530.3584" x="319.6689" y="30.8838">How a PodDisruptionBudget says no &#8212; the lecture's numbers</text></g><!--cluster b--><g class="cluster" data-entity="b" data-source-line="4" data-uid="ent0002" id="cluster_b"><rect fill="#F8FAFC" height="162" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="582" x="225.3481" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0464" x="481.325" y="71.8921">The budget</text></g><!--cluster e--><g class="cluster" data-entity="e" data-source-line="8" data-uid="ent0004" id="cluster_e"><rect fill="#F8FAFC" height="162" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="598" x="225.3481" y="223.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="435.6206" x="306.5378" y="241.8921">kubectl drain control-plane worker-1 worker-2 &#8212; five eviction requests</text></g><!--cluster w--><g class="cluster" data-entity="w" data-source-line="12" data-uid="ent0006" id="cluster_w"><rect fill="#F0FDF4" height="167" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="742" x="225.3481" y="393.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="402.2954" x="395.2004" y="411.8921">Why it never finishes in the lab &#8212; and why it would in production</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="5" data-uid="ent0003" id="entity_b1"><rect fill="#326CE5" height="121.1421" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="530.6323" x="267.8481" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="397.6934" x="281.8481" y="112.8921">kubectl create pdb nginx --selector=app=nginx --min-available=2</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="262.7969" x="281.8481" y="125.9648">apiVersion: policy/v1 &#183; kind: PodDisruptionBudget</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="322.7651" x="281.8481" y="138.6138">spec: {selector: {matchLabels: {app: nginx}}, minAvailable: 2}</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="281.8481" y="153.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="291.5483" x="281.8481" y="166.2114">The disruption controller keeps the arithmetic in status:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="496.52" x="287.9604" y="178.8604">expectedPods 5   (from the Deployment's replicas)      currentHealthy 5   (Pods that are READY)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="166.2783" x="287.9604" y="191.5093">desiredHealthy 2 (minAvailable)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="111.23" x="533.6987" y="191.5093">disruptionsAllowed 3</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="32.0977" x="651.041" y="191.5093">(5 &#8722; 2)</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="9" data-uid="ent0005" id="entity_e1"><rect fill="#FFFFFF" height="121.1421" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="547.895" x="267.3481" y="256.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="347.5151" x="281.3481" y="282.8921">POST /api/v1/namespaces/default/pods/&lt;name&gt;/eviction</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.4453" x="636.0869" y="282.8921">&#8212; one per Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="281.3481" y="297.8408">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="464.6802" x="281.3481" y="310.9136">Eviction 1  &#8594;  200 OK      allowed: 5 healthy, 3 disruptions left &#8594; 2 left       pod/...-z28qz evicted</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="408.9819" x="281.3481" y="323.5625">Eviction 2  &#8594;  200 OK      &#8594; 1 left                                               pod/...-xnhzs evicted</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="404.0889" x="281.3481" y="336.2114">Eviction 3  &#8594;  200 OK      &#8594; 0 left                                               pod/...-bpzrj evicted</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.8022" x="281.3481" y="348.8604">Eviction 4  &#8594;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.313" x="352.2627" y="348.8604">429 Too Many Requests</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="314.499" x="486.7441" y="348.8604">'Cannot evict pod as it would violate the pod's disruption budget.'</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.8022" x="281.3481" y="361.5093">Eviction 5  &#8594;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="18.353" x="352.2627" y="361.5093">429</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="234.7544" x="434.7949" y="361.5093">drain prints  (will retry after 5s)  and keeps trying</text></g><!--entity w1--><g class="entity" data-entity="w1" data-source-line="13" data-uid="ent0007" id="entity_w1"><rect fill="#DCFCE7" height="125.7417" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="691.8315" x="267.3481" y="426.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="362.6606" x="281.3481" y="452.8921">Every node is cordoned, so the three replacement Pods sit</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2764" x="647.6206" y="452.8921">Pending</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="193.6353" x="698.897" y="452.8921">. They never become Ready, so</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="509.3105" x="281.3481" y="467.8408">currentHealthy stays at 2, disruptionsAllowed stays at 0, and the last two Pods are</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.1035" x="794.2705" y="467.8408">never evicted</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="877.374" y="467.8408">.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="329.418" x="281.3481" y="482.7896">The application keeps 2 Pods serving the whole time.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="330.8018" x="614.3779" y="482.7896">Without the PDB the same drain took it to READY 0/5.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="281.3481" y="497.7383">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="554.4741" x="281.3481" y="510.811">In a real node repave, new nodes join and replacements start elsewhere. Each one that turns Ready raises</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="536.0942" x="281.3481" y="523.46">currentHealthy, which re-opens the budget, and the next retry succeeds. The drain proceeds at exactly</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="372.2114" x="281.3481" y="536.1089">the pace the application can absorb &#8212; that is the whole point of a PDB.</text></g><g class="link" data-entity-1="b" data-entity-2="e" data-uid="lnk8" id="link_b_e"><polygon fill="#475569" points="241.3481,223.6564,245.3481,214.6564,241.3481,218.6564,237.3481,214.6564,241.3481,223.6564" style="stroke:#475569;stroke-width:1;"/><path d="M241.3481,215.8494 C241.3481,217.6183 241.3481,219.3973 241.3481,221.1831 C241.3481,221.6295 241.3481,222.0764 241.3481,222.5236 C241.3481,222.7472 241.3481,222.9709 241.3481,223.1947 C241.3481,223.3066 241.3481,223.4185 241.3481,223.5304 C241.3481,223.5584 241.3481,223.5864 241.3481,223.6144 C241.3481,223.6284 241.3481,217.6424 241.3481,217.6564" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="e" data-entity-2="w" data-uid="lnk9" id="link_e_w"><polygon fill="#475569" points="241.3481,393.6607,245.3481,384.6607,241.3481,388.6607,237.3481,384.6607,241.3481,393.6607" style="stroke:#475569;stroke-width:1;"/><path d="M241.3481,385.841 C241.3481,386.2909 241.3481,386.7416 241.3481,387.1929 C241.3481,388.998 241.3481,390.8133 241.3481,392.6352 C241.3481,392.8629 241.3481,393.0908 241.3481,393.3187 C241.3481,393.4327 241.3481,387.5467 241.3481,387.6607" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1159.6963" x="5" y="580.8301">"Healthy" means the Pod's Ready condition is True (chapter 04-14) &#8212; the PDB counts readiness, not existence. A Pod that is Running but not Ready does not count towards minAvailable.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="746.6826" x="211.5068" y="596.9287">200 = evicted &#183; 429 = budget says not now, try later &#183; 500 = misconfiguration, such as two PDBs selecting the same Pod.</text></g><!--SRC=[fLRBRjj65DthAswzYGFeOIasq0go0Biscg8jOgH6WmBP3CahSM9oX