<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="945px" preserveAspectRatio="none" style="width:962px;height:945px;background:#FFFFFF;" version="1.1" viewBox="0 0 962 945" width="962px" zoomAndPan="magnify"><title>Three words the exam deliberately confuses &#8212; operator, Equal/Exists, and effect</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="692.209" x="130.9033" y="30.8838">Three words the exam deliberately confuses &#8212; operator, Equal/Exists, and effect</text></g><!--cluster n--><g class="cluster" data-entity="n" data-source-line="4" data-uid="ent0002" id="cluster_n"><rect fill="#FEF2F2" height="177" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="474" x="213.5078" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="335.499" x="282.7583" y="71.8921">ON THE NODE &#8212; a taint, written KEY=VALUE:EFFECT</text></g><!--cluster p--><g class="cluster" data-entity="p" data-source-line="8" data-uid="ent0004" id="cluster_p"><rect fill="#F0FDF4" height="175" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="482" x="213.5078" y="273.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="374.188" x="267.4138" y="291.8921">ON THE POD &#8212; a toleration, written as FOUR separate fields</text></g><!--cluster m--><g class="cluster" data-entity="m" data-source-line="12" data-uid="ent0006" id="cluster_m"><rect fill="#F8FAFC" height="187" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="486" x="213.5078" y="467.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="294.6455" x="309.1851" y="485.8921">WHEN DOES A TOLERATION MATCH A TAINT?</text></g><!--cluster e--><g class="cluster" data-entity="e" data-source-line="16" data-uid="ent0008" id="cluster_e"><rect fill="#F8FAFC" height="220" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="550" x="213.5078" y="673.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="436.2427" x="270.3865" y="691.8921">THE THREE EFFECTS &#8212; and the one distinction the study tips call out</text></g><!--entity n1--><g class="entity" data-entity="n1" data-source-line="5" data-uid="ent0003" id="entity_n1"><rect fill="#FEE2E2" height="136.0908" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="423.4146" x="256.0078" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="376.0034" x="270.0078" y="112.8921">kubectl taint nodes worker-2 custom-taint2=strict:NoExecute</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="270.0078" y="127.8408">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="123.46" x="276.1201" y="140.9136">custom-taint2   the KEY</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="316.6099" x="276.1201" y="153.5625">strict          the VALUE   (optional &#8212; key:NoSchedule is legal)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="389.3022" x="276.1201" y="166.2114">NoExecute       the EFFECT  (what happens to Pods that do NOT tolerate it)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="270.0078" y="180.7363">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="322.7061" x="270.0078" y="193.8091">Remove it by repeating the command with a TRAILING DASH:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="321.8198" x="270.0078" y="206.458">kubectl taint nodes worker-2 custom-taint2=strict:NoExecute-</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="9" data-uid="ent0005" id="entity_p1"><rect fill="#DCFCE7" height="133.791" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="430.8267" x="256.0078" y="306.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.7827" x="270.0078" y="332.8921">tolerations:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="282.5679" x="270.0078" y="345.9648">- key:      custom-taint2     &#8592; must equal the taint's key</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="391.8105" x="276.1201" y="358.6138">operator: Equal             &#8592; the FIELD NAME. Its values are Equal and Exists.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="297.0645" x="276.1201" y="371.2627">value:    strict            &#8592; only used when operator is Equal</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="285.6187" x="276.1201" y="383.9116">effect:   NoExecute         &#8592; must equal the taint's effect</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="270.0078" y="398.4365">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="402.8267" x="270.0078" y="411.5093">operator is NOT an effect, and Equal/Exists are NOT effects. They are the two</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="374.0591" x="270.0078" y="424.1582">VALUES of the operator field. The effect field is a different field entirely.</text></g><!--entity m1--><g class="entity" data-entity="m1" data-source-line="13" data-uid="ent0007" id="entity_m1"><rect fill="#326CE5" height="146.4399" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="435.1343" x="256.0078" y="500.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="358.3633" x="270.0078" y="526.8921">The keys are the same AND the effects are the same AND:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="374.1128" x="276.1201" y="539.9648">&#183; operator is Exists  &#8212; no value should be specified; any value matches</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="378.9575" x="276.1201" y="552.6138">&#183; operator is Equal   &#8212; the values must be equal.  Equal is the DEFAULT.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="270.0078" y="567.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="99.6606" x="270.0078" y="580.2114">Two special cases:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="401.022" x="276.1201" y="592.8604">&#183; an EMPTY KEY requires operator Exists, and matches ALL keys and values</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="143.0215" x="282.2324" y="605.5093">(the effect must still match)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="279.3291" x="276.1201" y="618.1582">&#183; an EMPTY EFFECT matches ALL effects for that key</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="370.7935" x="276.1201" y="630.8071">&#183; empty key + Exists + empty effect = tolerate every taint on every node</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="17" data-uid="ent0009" id="entity_e1"><rect fill="#FFFFFF" height="178.6372" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="499.8594" x="255.5078" y="706.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="448.7412" x="269.5078" y="732.8921">NoSchedule        No NEW Pods scheduled here without a matching toleration.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="281.2305" x="324.5186" y="745.9648">Pods ALREADY RUNNING on the node are NOT evicted.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="269.5078" y="760.4897">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="471.8594" x="269.5078" y="775.4385">PreferNoSchedule  The soft version. The control plane will TRY to avoid the node,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.9683" x="324.5186" y="788.5112">but it is not guaranteed.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="269.5078" y="803.0361">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.2031" x="269.5078" y="817.9849">NoExecute         Blocks scheduling AND affects Pods already running:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="282.4443" x="324.5186" y="831.0576">&#183; Pods that do not tolerate it are EVICTED IMMEDIATELY</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="291.0435" x="324.5186" y="843.7065">&#183; Pods that tolerate it with no tolerationSeconds stay forever</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="295.3135" x="324.5186" y="856.3555">&#183; Pods that tolerate it WITH tolerationSeconds stay that long,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="146.7383" x="330.6309" y="869.0044">then the controller evicts them</text></g><g class="link" data-entity-1="n" data-entity-2="p" data-uid="lnk10" id="link_n_p"><polygon fill="#475569" points="229.5078,273.4518,233.5078,264.4518,229.5078,268.4518,225.5078,264.4518,229.5078,273.4518" style="stroke:#475569;stroke-width:1;"/><path d="M229.5078,231.4201 C229.5078,232.6007 229.5078,233.7871 229.5078,234.9785 C229.5078,244.5096 229.5078,254.3659 229.5078,264.2218 C229.5078,266.6858 229.5078,269.1498 229.5078,271.6087 C229.5078,272.2234 229.5078,266.8378 229.5078,267.4518" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7383" x="235.5078" y="257.9541">repels unless tolerated</text></g><g class="link" data-entity-1="p" data-entity-2="m" data-uid="lnk11" id="link_p_m"><polygon fill="#475569" points="229.5078,467.6845,233.5078,458.6845,229.5078,462.6845,225.5078,458.6845,229.5078,467.6845" style="stroke:#475569;stroke-width:1;"/><path d="M229.5078,449.2761 C229.5078,449.8114 229.5078,450.3478 229.5078,450.8851 C229.5078,451.9597 229.5078,453.0381 229.5078,454.1198 C229.5078,456.2831 229.5078,458.4594 229.5078,460.6444 C229.5078,462.8294 229.5078,465.0229 229.5078,467.2208 C229.5078,467.3582 229.5078,467.4956 229.5078,467.633 C229.5078,467.6501 229.5078,461.6673 229.5078,461.6845" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="m" data-entity-2="e" data-uid="lnk12" id="link_m_e"><polygon fill="#475569" points="229.5078,673.6059,233.5078,664.6059,229.5078,668.6059,225.5078,664.6059,229.5078,673.6059" style="stroke:#475569;stroke-width:1;"/><path d="M229.5078,655.2572 C229.5078,660.0996 229.5078,665.0247 229.5078,669.9909 C229.5078,670.6117 229.5078,671.2331 229.5078,671.8551 C229.5078,672.1661 229.5078,672.4773 229.5078,672.7885 C229.5078,672.9442 229.5078,673.0998 229.5078,673.2555 C229.5078,673.3334 229.5078,673.4112 229.5078,673.4891 C229.5078,673.528 229.5078,667.567 229.5078,667.6059" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="944.0156" x="5" y="913.8301">Tolerations allow scheduling; they do not guarantee it. A toleration removes one objection &#8212; it is not an attraction, and it does not send a Pod anywhere.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="867.5078" x="43.2539" y="929.9287">To steer a Pod TOWARDS a node you still need nodeSelector or node affinity. Taints and tolerations only answer "is this Pod allowed here".</text></g><!--SRC=[fLR1RkCs4BtxAwQvj8kD7MIFtiI5DbOsHXqxi9KD0ko5bcYR3KLgHIgEMnJegUSU-Y-zzrFsIpf3qhBiE6c15O909gd7npTlPlYTKAciCWwTped_irfBSv89jYXPRauUKiNQTibptYcgNBQii993iYmvXvKkCmCu2Vo9vP1nAMQyP9RBDQHQpIl33Npz_I_G1GthyXZYBnMJ9_6JCDOS0rCPyFcSfxRLAl4_Kmi4FngF8BcAOJJkn-vp1fO9POzXLGfhkOAVullpJz7mDkx6bvVnHN84PsUBKbV51vRrUi0CAFYr1T30VAXc-4Dw950wGsh8_u6NxNUGLiRglEtctfqRMuhKTaSwVk9fPVbdzLcT6V4BxvwUzc1tCO0xFn8wEw4blPsb7WdgXvOwtlZ-Wowiq8f9TyG7liODf-cIPnNI5GOaNp3vvX1gJQo1wdL0rDMIMLYoek0AGwFXHhiGuM2cKT44nwIB4GYxHM_WJtYk7saMPciKiE3C2hLmcwGwpobaAs6N69Ha4Ws6Wz57w4VJg-vpfjyWUJkWKM1dTKnFMxyTyidDkB-nYJyRohhr2dvuERwTWE45S-UU2oupKrlcezO1lzZtp1RET1ldQhjeUUttpG3mzOy_8STHu6HrfvkR_TxGPuVYkScEhiyEQ3w4HX2NWtZOXr5q7NTWO0qyCbcXdApauIEAYq-hpg4zt7h7UT-JVW-jC6SnNp6uInHjGucCwF0FOVhC9T1zHxwgWl_iaFMQkv9LcGgBVQLerWvtSbhZ5vWEbYI-TgDkhvL-pjXbtXJqt2sfDtD-SDy7C3z291Xa0eTAhZQ3-2PAh6-TXa4NMmVjE_JkAXv1VuoxHf2CX_4aIWReskiekRYYeMWmIdwihUX1ydqR4ZEqZgbFPrZE8HhrVUdr0ZoRxEx4wf-_TsFgHNHfexHt1vYbhl28CtmhU2hmmDbx57uTfdDciJoPGqxOHmys9dIY5Cpg_83epX8T2Ck4xo3z-3Aw7IQTGxv8LjfJmkKfmwRIVO446YQ-ladkgHwZWbygZ9NPKcksdN0QY8R382uEUgA7mB6oRiNs9p5MIEbntlmNdr2UcvjkuZP7Ogu-lr0T48RdXLtJFBpTHEvj60o4phTbdJ_oSXrghbRX9nNVXcDPcgAHWztsFKibDRcQn75WFVN55ULnQQCu9WMUNQLK6BtbR9NXbg8m61xKH5TspzDytzEDNXUU4RQd-CxtAnFcCbXYyhb-WvYOZav0ruxgqjpPYzFku-2YuIIE-lSmkHsDg5y5sYJAjeuyObNaMTD_DoN7t6yofKmqUcu1HJMqjnl1guujjOH2CaLaKO5aSa_DbprgaTLx7R_AT8O7nAQBwQ2qXKM5pKfPlileUPtz87NwK0j6ob1TOC5RxlHCbfnXVCfAALpGVPK5kctdna1S6ZS6tt0-3IwIk0-3w-kuFuYIU7X_E6LUWMvYkki4Lg5jJASSDIKVMBQc124JVzCMTuFawYLyjrXgjJZ-FrkuwvOAro4NTmJrxd65B6-a6Hf2g900BiiKj3EzKkqUtZMwxd8b3LHAScDgkbchg5VbhRn-vwrMojoL4Sv4BzbUJJ30KgyQ5dXFFDQRwDLEGXqws7EsAY01kkePbzDwzZFt6KtPlZKYbZ1cRSbIVwkYCY386TnF6uu3Z5IdJh6YT4N32jAGIAB27ENn2vBnNJJfJ_6Noxorha8DLMXpDp