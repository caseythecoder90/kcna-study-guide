<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="737px" preserveAspectRatio="none" style="width:1369px;height:737px;background:#FFFFFF;" version="1.1" viewBox="0 0 1369 737" width="1369px" zoomAndPan="magnify"><title>A kubeconfig is three lists and a pointer</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="342.0615" x="509.7803" y="30.8838">A kubeconfig is three lists and a pointer</text></g><!--entity cl--><g class="entity" data-entity="cl" data-source-line="4" data-uid="ent0002" id="entity_cl"><rect fill="#326CE5" height="95.8442" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="360.6963" x="287.561" y="67.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.4727" x="301.561" y="93.8921">clusters &#8212; WHERE</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="240.249" x="301.561" y="106.9648">server: https://api.prod-east.example.net:6443</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="332.6963" x="301.561" y="119.6138">certificate-authority-data: base64 of the CA's PUBLIC certificate</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="301.561" y="134.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="185.2275" x="301.561" y="147.2114">one entry per API server you talk to</text></g><!--entity us--><g class="entity" data-entity="us" data-source-line="6" data-uid="ent0003" id="entity_us"><rect fill="#326CE5" height="108.4932" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="414.0098" x="667.061" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="244.8672" x="681.061" y="87.8921">users &#8212; WHO (credentials, not identity)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="334.6621" x="681.061" y="100.9648">client-certificate-data + client-key-data   &#8592; mTLS, the lab default</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="386.0098" x="681.061" y="113.6138">OR auth-provider / exec  &#8592; OIDC id-token + refresh-token, enterprise SSO</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="230.4629" x="681.061" y="126.2627">OR token  &#8592; a ServiceAccount bearer token</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="681.061" y="140.7876">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="213.3237" x="681.061" y="153.8604">one entry per credential, NOT per human</text></g><!--entity ctx--><g class="entity" data-entity="ctx" data-source-line="8" data-uid="ent0004" id="entity_ctx"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="309.1499" x="516.561" y="205.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="214.5" x="530.561" y="231.8921">contexts &#8212; WHICH COMBINATION</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="243.8584" x="530.561" y="244.9648">a context is a POINTER TRIPLE, nothing more:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="39.7354" x="536.6733" y="257.6138">cluster:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="99.0107" x="579.4648" y="257.6138">which of the above</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="26.8984" x="536.6733" y="270.2627">user:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="99.0107" x="566.6279" y="270.2627">which of the above</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="63.5884" x="536.6733" y="282.9116">namespace:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="208.3931" x="603.3179" y="282.9116">the default for kubectl when you omit -n</text></g><!--entity cur--><g class="entity" data-entity="cur" data-source-line="10" data-uid="ent0005" id="entity_cur"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="427.7598" x="457.061" y="335.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.249" x="471.061" y="361.8921">current-context &#8212; the one in effect</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.7598" x="471.061" y="374.9648">kubectl config use-context prod-east   &#8592; this is all switching clusters means</text></g><!--entity names--><g class="entity" data-entity="names" data-source-line="12" data-uid="ent0006" id="entity_names"><rect fill="#FFFFFF" height="148.7397" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="529.3325" x="406.561" y="427.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.2642" x="420.561" y="453.8921">Every name here is an ARBITRARY LABEL you choose</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="496.4556" x="420.561" y="466.9648">Rename every instance of &#8220;default&#8221; to &#8220;k8s&#8221; and the file still works &#8212; nothing resolves by name except</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="501.3325" x="420.561" y="479.6138">the cross-references between these four blocks. That is why a real multi-cluster setup renames them to</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="111.8853" x="420.561" y="492.2627">something memorable:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="420.561" y="506.7876">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="298.3374" x="420.561" y="519.8604">contexts: prod-east &#183; prod-west &#183; dr-east &#183; dr-west   instead of</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="288.7393" x="451.1226" y="532.5093">api.mt-d1.na-nw-s01.example.net/user@corp.example.com</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="420.561" y="547.0342">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="432.8994" x="420.561" y="560.1069">kubectl config rename-context &lt;ugly&gt; &lt;friendly&gt;     &#8592; one command, and it is permanent</text></g><!--entity ha--><g class="entity" data-entity="ha" data-source-line="14" data-uid="ent0007" id="entity_ha"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="418.0703" x="462.061" y="612.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6416" x="476.061" y="638.8921">One app across four clusters for HA</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="374.1396" x="476.061" y="651.9648">4 cluster entries &#183; 1 user entry (the SAME SSO credential works everywhere)</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="222.5728" x="476.061" y="664.6138">&#183; 4 contexts, each pinning its own namespace</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="390.0703" x="476.061" y="677.2627">kubectl config use-context dr-west, and every later command targets that cluster</text></g><g class="link" data-entity-1="cl" data-entity-2="ctx" data-uid="lnk8" id="link_cl_ctx"><polygon fill="#475569" points="601.627,205.5229,596.3479,197.2084,597.4636,202.7541,591.9178,203.8698,601.627,205.5229" style="stroke:#475569;stroke-width:1;"/><path d="M538.7756,163.7252 C559.1433,177.2702 576.3416,188.7075 596.6309,202.2004" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="us" data-entity-2="ctx" data-uid="lnk9" id="link_us_ctx"><polygon fill="#475569" points="740.4075,205.5811,750.1167,203.9281,744.5709,202.8123,745.6866,197.2666,740.4075,205.5811" style="stroke:#475569;stroke-width:1;"/><path d="M794.1215,169.86 C776.3693,181.6657 762.6906,190.7623 745.4036,202.2586" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ctx" data-entity-2="cur" data-uid="lnk10" id="link_ctx_cur"><polygon fill="#475569" points="671.061,335.6603,675.061,326.6603,671.061,330.6603,667.061,326.6603,671.061,335.6603" style="stroke:#475569;stroke-width:1;"/><path d="M671.061,299.9241 C671.061,312.109 671.061,318.8588 671.061,329.6603" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="cur" data-entity-2="names" data-uid="lnk11" id="link_cur_names"><polygon fill="#475569" points="671.061,427.5655,675.061,418.5655,671.061,422.5655,667.061,418.5655,671.061,427.5655" style="stroke:#475569;stroke-width:1;"/><path d="M671.061,391.993 C671.061,402.4183 671.061,408.8669 671.061,421.5655" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="names" data-entity-2="ha" data-uid="lnk12" id="link_names_ha"><polygon fill="#475569" points="671.061,612.5258,675.061,603.5258,671.061,607.5258,667.061,603.5258,671.061,612.5258" style="stroke:#475569;stroke-width:1;"/><path d="M671.061,576.8252 C671.061,589.1426 671.061,595.4918 671.061,606.5258" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1351.6221" x="5" y="705.8301">kubectl config view redacts the secrets; kubectl config view --raw shows them, which is how you find the base64 blobs worth decoding. The file merges: set $KUBECONFIG to a colon-separated (semicolon on Windows)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="905.0508" x="228.2856" y="721.9287">list and kubectl treats them as one, which is how you keep a work cluster and a lab cluster in separate files without either one clobbering the other.</text></g><!--SRC=[bLR1RkCs4BtdAwQB0arGosxGO56uXb77THkZsJXml5WKw8McHXPXYXH8AefxMEJKynxss7v7x_sKV4c75EN86xT5WnWsXvpXp9itJ_fCA2wh5A7V7pJ_Jcjf1wbW6yCAEzXonHANOu7ziYhaYHDE8anWMwsHQvM93GWBBZU888Lr5fXAWK6fXN9eJauCSiVKXfnUqKsMR1QU7Z_2kwlPSlQB6bdnAmxFpySMpJsQ8UJEbNOu6B1Iz4kZqmIPTNryO4KfiQ_G3LzVN7mz6dY_SSUVet4Y4vmvJ5ZbScs4soKfSsm8QsRnzGNeZ195c4w-i73xzl9wFeMErpva9wXM2AYSsK691YQtSsZIX9skm36v1QUZtoiOZHZdT7ey1cQ1ouFQA_jS-09EkS6KZWecRG-KTY32qktEkYL9GSQaMvcl1xw4kBF5fa80UFhj0nIhwxjUA56oDQIOiKgwbqWjbk01IWZTUxhMm03m0NaJOp7_Vah994vlKT5D1ZE3Dc_MFGy6cj88Yt1tjpWQk_4CmHZS4Lo2uuHpNIa7QsI6BWn7_XllPv1wSBDO1LjU5Kpz0-ILFQIRfcGVN8lwV7e5qyMRo_dDP3LVt7HkPH2FUYepk5tCRrQp9QoMyzlhMMXFBjG62crm-B9aWCZh8Op4kCu5prkciRM-9rw9yJ4lpuZ_wQ9OWRPa78EVFnwR39aspKWw2NLE-7k2wa8uI5GdcaTietKQAUeU3W6hZ0c4YsXutFmblYj20MOPdUqar5uOTO0Ashlk9pTIan2q0LqfmTR2yO3eNX0APCeUpx4wr90PJTyk004v6Wmn5KoMb_FLShBy6QudbxFhK3tFjRROINU9mGr31A4iXUJeSNzw_3tY-FJu1v7J6xRVMB_mOkOXo0HTRfsWz6jjjWsdMcBGW6XvZnRMCJDyu5WUcJmVYHjjRK9ZHTdJ_UI4haRg66tIL6MwCh2Mcczj7rOv2voiyntnqY2JK52M8ed0aHgvggIDG0mVeNWMfAwswW8ZXv5OpDQoG-IkuCI96NRwzzUVpQB6Pf6QlPr-1Yi4D96b1EOnshP_Nj8BbwJdVNgcg3gnNvrtXNtW9-8xhasvjt9T7Clp4-8rzU-vDwesSZU6KMP895F_4o8BFP4f92b8sWkj5G5UqXKo4VCx32mb4wgXO03tW8GBYiFA4bXePjEpFPVzA5vDEjbUj7j1sWGrYh0x3_CVnUxK4-DkycRcHRKZUv5hWR6rf_lPItWfraMhN_GiGKPQKWgbVBS5YP-krRDkl7J_bncExMsGQgP6Cbz6X90UW6Q3plEEQ1fhx41OL0xZ5EViv8HBI5BA9Xa7uQdimP8-pskQUVhirqq36ewtjX2HbKvevRNmapBk1TP4YvJna1wDBXAgpduBnmw-JzudXjLWSrqtKzI3HfI976GBSfA9A0NnPO9cT6rzWrnEAinrIe3xYOrQKI1XGuD44mgV__JsSZPTtFmm_z6hYt_SIAqIYoKp16WAfnOB4On4KNX7Dr4YPrwtgLDYxD-hGXFQv1r9WOlpJkWIhOyal4KaXWOAxGdOl9lvjuFMGhhUvX4Ifv84lJnL3f2-wK2O6QfrZSPJAZmF_4RVf_St]--></g></svg>