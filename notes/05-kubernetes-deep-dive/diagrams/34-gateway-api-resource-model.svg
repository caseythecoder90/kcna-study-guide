<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="820px" preserveAspectRatio="none" style="width:1136px;height:820px;background:#FFFFFF;" version="1.1" viewBox="0 0 1136 820" width="1136px" zoomAndPan="magnify"><title>One Ingress object, split into layers &#8212; each owned by the team that actually makes that decision</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="827.2354" x="150.7124" y="30.8838">One Ingress object, split into layers &#8212; each owned by the team that actually makes that decision</text></g><!--cluster l1--><g class="cluster" data-entity="l1" data-source-line="4" data-uid="ent0002" id="cluster_l1"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="536" x="79.8301" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="314.8818" x="190.3892" y="71.8921">INFRASTRUCTURE PROVIDER / PLATFORM TEAM</text></g><!--cluster l2--><g class="cluster" data-entity="l2" data-source-line="8" data-uid="ent0004" id="cluster_l2"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="572" x="61.8301" y="218.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="280.2173" x="207.7214" y="236.8921">CLUSTER OPERATOR / NETWORKING TEAM</text></g><!--cluster l3--><g class="cluster" data-entity="l3" data-source-line="12" data-uid="ent0006" id="cluster_l3"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="612" x="41.8301" y="397.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="473.1353" x="111.2625" y="415.8921">APPLICATION TEAMS &#8212; in their own namespaces, no cluster-admin needed</text></g><!--cluster l4--><g class="cluster" data-entity="l4" data-source-line="18" data-uid="ent0009" id="cluster_l4"><rect fill="#F8FAFC" height="126" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="778" x="331.8301" y="642.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="201.5317" x="620.0642" y="660.8921">OPTIONAL &#8212; filters and policies</text></g><!--entity svc--><g class="entity" data-entity="svc" data-source-line="16" data-uid="ent0008" id="entity_svc"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="128.4263" x="283.8301" y="572.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.4263" x="297.8301" y="598.8921">Service  &#8594;  Pods</text></g><!--entity gc--><g class="entity" data-entity="gc" data-source-line="5" data-uid="ent0003" id="entity_gc"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="518.8374" x="88.3301" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.1626" x="102.3301" y="112.8921">GatewayClass</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4727" x="201.3281" y="112.8921">cluster-scoped</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="473.1128" x="102.3301" y="125.9648">Which CONTROLLER implements Gateways of this class. The Ingress-world IngressClass.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="459.6475" x="108.4424" y="138.6138">controllerName: gateway.nginx.org/nginx-gateway-controller     (NGINX Gateway Fabric)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="490.8374" x="102.3301" y="151.2627">Installed with the controller. One cluster can hold many, each backed by a different controller.</text></g><!--entity gw--><g class="entity" data-entity="gw" data-source-line="9" data-uid="ent0005" id="entity_gw"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="555.5596" x="69.8301" y="251.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.4727" x="83.8301" y="277.8921">Gateway</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.8716" x="148.1382" y="277.8921">namespaced (here: gateway-system)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="527.5596" x="83.8301" y="290.9648">A network ENTRY POINT &#8212; usually one load balancer and one address. References a GatewayClass.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="466.9736" x="83.8301" y="303.6138">Defines LISTENERS:   http &#183; HTTP &#183; 80     https &#183; HTTPS &#183; 443 &#183; tls.certificateRefs &#8594; Secret</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="519.5674" x="83.8301" y="316.2627">Decides WHO may attach:   allowedRoutes.namespaces.from:  Same (default) &#183; All &#183; Selector &#183; None</text></g><!--entity hr--><g class="entity" data-entity="hr" data-source-line="13" data-uid="ent0007" id="entity_hr"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="596.4712" x="49.8301" y="430.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.77" x="63.8301" y="456.8921">HTTPRoute</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="169.0444" x="145.4355" y="456.8921">namespaced (here: default)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="568.4712" x="63.8301" y="469.9648">The ROUTING RULES: hostnames, path/header/query/method matches, filters, and backendRefs to Services.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="563.5728" x="63.8301" y="482.6138">Attaches UPWARDS with  parentRefs: [{name: edge-gw, namespace: gateway-system, sectionName: https}]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="409.46" x="63.8301" y="495.2627">Siblings: GRPCRoute (GA) &#183; TLSRoute, TCPRoute, UDPRoute (GA in v1.5/v1.6)</text></g><!--entity pol--><g class="entity" data-entity="pol" data-source-line="19" data-uid="ent0010" id="entity_pol"><rect fill="#FFFFFF" height="85.4951" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="728.0957" x="373.8301" y="675.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.96" x="387.8301" y="701.8921">Inline filters</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="623.5239" x="464.4019" y="701.8921">on a route rule: RequestRedirect &#183; URLRewrite &#183; Request/ResponseHeaderModifier &#183; RequestMirror &#183; CORS</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.4854" x="387.8301" y="716.8408">Policy attachments</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="531.7813" x="506.3154" y="716.8408">: separate CRDs targeting a Gateway, route or Service (auth, rate limits, BackendTLSPolicy)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.5381" x="387.8301" y="731.7896">ReferenceGrant</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="571.5239" x="485.3682" y="731.7896">: lives in the TARGET namespace and permits a cross-namespace reference to a Service or Secret</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="508.0679" x="387.8301" y="744.8623">Owned by a security/policy team where one exists &#8212; alongside OPA/Gatekeeper-style admission policy.</text></g><g class="link" data-entity-1="gc" data-entity-2="gw" data-uid="lnk11" id="link_gc_gw"><polygon fill="#475569" points="347.8301,251.4535,351.8301,242.4535,347.8301,246.4535,343.8301,242.4535,347.8301,251.4535" style="stroke:#475569;stroke-width:1;"/><path d="M347.8301,168.0725 C347.8301,193.4257 347.8301,220.1253 347.8301,245.4535" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.7109" x="353.8301" y="202.9541">gatewayClassName</text></g><g class="link" data-entity-1="gw" data-entity-2="hr" data-uid="lnk12" id="link_gw_hr"><polygon fill="#475569" points="347.8301,430.6086,351.8301,421.6086,347.8301,425.6086,343.8301,421.6086,347.8301,430.6086" style="stroke:#475569;stroke-width:1;"/><path d="M347.8301,332.9205 C347.8301,362.071 347.8301,395.4893 347.8301,424.6086" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.1133" x="396.1406" y="367.9541">attachment needs BOTH sides to agree:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.7344" x="353.8301" y="381.7529">the route's parentRefs AND the listener's allowedRoutes</text></g><g class="link" data-entity-1="hr" data-entity-2="svc" data-uid="lnk13" id="link_hr_svc"><polygon fill="#475569" points="347.8301,572.5222,351.8301,563.5222,347.8301,567.5222,343.8301,563.5222,347.8301,572.5222" style="stroke:#475569;stroke-width:1;"/><path d="M347.8301,511.8182 C347.8301,532.0816 347.8301,549.907 347.8301,566.5222" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.4043" x="353.8301" y="546.9541">backendRefs (weighted)</text></g><g class="link" data-entity-1="svc" data-entity-2="l4" data-uid="lnk14" id="link_svc_l4"><polygon fill="#475569" points="347.8301,642.6201,351.8301,633.6201,347.8301,637.6201,343.8301,633.6201,347.8301,642.6201" style="stroke:#475569;stroke-width:1;"/><path d="M347.8301,615.8939 C347.8301,622.3862 347.8301,629.9811 347.8301,638.0413 C347.8301,639.0489 347.8301,640.0637 347.8301,641.0845 C347.8301,641.5949 347.8301,636.1068 347.8301,636.6201" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="27"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1118.6602" x="5" y="788.8301">Ingress put the class, the entry point, the TLS settings and every team's routes into one object &#8212; so whoever could edit it could change everything, and features lived in annotations.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="760.252" x="184.2041" y="804.9287">Gateway API gives each decision its own resource, so RBAC can give each team exactly the layer it owns (chapter 05-03).</text></g><!--SRC=[TLRRRXit47tNLqppKXlG9MwSeZ040HjPiONAMc6rgbiqVQ1sHxkiAL8bkLRK842V-W55_wNl_PH-IMUuMabn74EmLbnoBkUS6SvNKcUgoX6wtLxzySOerykbAAnOkzv3faN7bxZ6xgPQgvQNNY746c6i2ulEWLd-YfblWziewK5gRq297Le7__tnDw38IZ1RZJaiTq26mADOquFm839V2QLsi1OFwEgr73FffD6jbYMhGXVaxSLu-ZQ9vcco6AQBP0Ip9FvXV3rAe0UpIPI-ZPCxI4VHtGlezmjhgirW0CA1ke0FBO0JE_tbu4Put8hTK0dd-htb00080EVHTbncDfY_qtqdVyUhYul1VIaf-64yJPDuCY5_ShrHX8Js3lPsAFqL1IuTMI6BNKZB0pAThR4gRtu5Zzr-ZuqFJfoGVwEzDKgXdOerNa5Hc-xgGkhtNMEBNdZgxDSxn_t0VsVJc_7qnoOWU2kMLcRddpiQQ-S9RI9YAtqPg3XQwWPAzqX09ZIKXc9V2xrhrnmkHVPGaoWWbwiLMiBXrCBU8vCWienUrYmKMUlZ9sGE9ujvIc36ir4IfJ6pE1sbzt7o_NXwyooFttoPnps5ce1p6v5HW6SbHNO0iUDsbD7w_0I723HwekO1HaJiJp2BnzCqQBLojHmDGQ6Ce6I54ZeZG8JEmwh8S-Qo2ma603AIhO1JJJt3y3MkfAQDap7bFHqbyokAkFH-0__-0xTfEkFlxru6CddPDUjpVhYyVCLVNhakHUBbIcRaZlnJVVtv5ymni-YVSvh9d9pUtyR48f7cFR78dYb5iyKyCPL7rpqWvxehQzQqOKuhS9RZIbJAdxFlI2d-cgCY2epbvocXSK9uOKo-ftlxXEveDfkCXr4wZgU1t7c0MceMeBJS6exikJPeSwX7aQzfcqRCCNygYLVFI88X2rbzKHHDKYSuSRqcyI9bxIMBoOZ8AOtpuMmRDiANlH95ZhRtMuLsrrkZBmqNXizAth6IYcAb1vP8g16T1tAe3SxHFaf6zdDwea07yREOtKV9zRokIVB7LSNdh-3d3pgq0ymBx1JRzZ6Vf-gctaj0KDEi-qVGqCTVFdSwbqibTK6sRvBPC405PpTHu3YTpCD26zBXRF-qk9uTDZ5ZZnVTrptwz-tvizINzWdr-_mX21Lc9dTyOAE4rFK9zvXzSY2UiKoYIP387ja0xCOecKbqJsLm-OmCnfgInEPuq8BHLAKsf68hHH0bI6mw0ZgNV9W1M2IJ1BTMqXxwjT_GImXnentU1WtS6Ufy4kt9ZZjfRLqImpYP4zZBmOo3RIekt1OSn1MHHFGISJ1ChaaVmXReYOvZ0sdlOoHx3NHdel8bhVCn9TVIazBUr2eZncfFvy7heIFTMA5zxL79Hv9ONMkGHidDA3sgg0OMBHkb639hwCewlhMDFLQoE0GKOkEMSwAhkBdU1Gkn8WntlKqDGhZijrnzeN_YU-byFHW8PKYArAFe8eXwZC03ueQlORzJt6dNql4WK7E_ExrUJXH4BrbqHGQTd5f9Pq0D20xr4Jeo5qMBLfiDfQKDHt92Wt7m9avlmOMMoVdIbOrNxpJZ5ZZvsftK9aJJwm2fecnGewMtdtJL5l