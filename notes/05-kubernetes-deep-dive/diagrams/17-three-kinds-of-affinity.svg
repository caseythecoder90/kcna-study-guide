<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="957px" preserveAspectRatio="none" style="width:1334px;height:957px;background:#FFFFFF;" version="1.1" viewBox="0 0 1334 957" width="1334px" zoomAndPan="magnify"><title>Three rules, and the only question that separates them: whose labels am I reading?</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="713.1709" x="306.7358" y="30.8838">Three rules, and the only question that separates them: whose labels am I reading?</text></g><!--cluster na--><g class="cluster" data-entity="na" data-source-line="4" data-uid="ent0002" id="cluster_na"><rect fill="#F0FDF4" height="202" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="528" x="364.8213" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="212.3735" x="522.6345" y="71.8921">nodeAffinity &#8212; reads NODE labels</text></g><!--cluster pa--><g class="cluster" data-entity="pa" data-source-line="8" data-uid="ent0004" id="cluster_pa"><rect fill="#F0FDF4" height="230" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="620" x="364.8213" y="263.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="405.6343" x="472.0042" y="281.8921">podAffinity &#8212; reads POD labels, and answers 'put me WITH them'</text></g><!--cluster pan--><g class="cluster" data-entity="pan" data-source-line="12" data-uid="ent0006" id="cluster_pan"><rect fill="#FEF2F2" height="220" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="594" x="364.8213" y="501.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="479.3306" x="422.156" y="519.8921">podAntiAffinity &#8212; reads POD labels, and answers 'keep me AWAY from them'</text></g><!--cluster sh--><g class="cluster" data-entity="sh" data-source-line="16" data-uid="ent0008" id="cluster_sh"><rect fill="#F8FAFC" height="192" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="616" x="364.8213" y="729.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="100.4136" x="622.6145" y="747.8921">What they share</text></g><!--entity na1--><g class="entity" data-entity="na1" data-source-line="5" data-uid="ent0003" id="entity_na1"><rect fill="#DCFCE7" height="161.3887" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="477.2554" x="407.3213" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="449.2554" x="421.3213" y="112.8921">Which nodes should my Pod be scheduled to, based on NODE LABELS?</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="309.9229" x="421.3213" y="125.9648">spec.affinity.nodeAffinity &#183; a more expressive nodeSelector</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="421.3213" y="140.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="217.9375" x="421.3213" y="153.5625">kubectl label node/worker-1 disktype=ssd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="346.5967" x="421.3213" y="166.2114">&#8594; the Pod lands on worker-1 because the NODE carries that label.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="421.3213" y="180.7363">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="350.2168" x="421.3213" y="193.8091">Needs: matchExpressions. No topologyKey &#8212; the node IS the unit.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="272.5723" x="421.3213" y="206.458">Operators: In &#183; NotIn &#183; Exists &#183; DoesNotExist &#183; Gt &#183; Lt</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.7275" x="421.3213" y="219.1069">NotIn and DoesNotExist are how you express node ANTI-affinity. There is no</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="426.6475" x="421.3213" y="231.7559">separate nodeAntiAffinity field &#8212; taints are the other way to repel (chapter 05-06).</text></g><!--entity pa1--><g class="entity" data-entity="pa1" data-source-line="9" data-uid="ent0005" id="entity_pa1"><rect fill="#DCFCE7" height="188.9863" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="569.6963" x="406.8213" y="296.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="473.1416" x="420.8213" y="322.8921">Constrains which nodes my Pod can be scheduled on based on the labels of</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="252.7764" x="420.8213" y="337.8408">PODS ALREADY RUNNING on that node.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="281.6963" x="680.8213" y="337.8408">Co-location. The best friend you want nearby.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="420.8213" y="352.7896">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.2808" x="420.8213" y="365.8623">spec.affinity.podAffinity</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="270.73" x="426.9336" y="378.5112">requiredDuringSchedulingIgnoredDuringExecution:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="307.4575" x="426.9336" y="391.1602">- labelSelector:              &#8592; selects OTHER PODS, not nodes</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="101.4814" x="439.1582" y="403.8091">matchExpressions:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.7837" x="439.1582" y="416.458">- {key: role, operator: In, values: [backend]}</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="367.6675" x="433.0459" y="429.1069">topologyKey: kubernetes.io/hostname    &#8592; REQUIRED. 'Same WHAT?'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="420.8213" y="443.6318">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="467.9297" x="420.8213" y="456.7046">Reads: place me in a topology domain that already contains a Pod labelled role=backend.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="432.1421" x="420.8213" y="469.3535">Typical use: a frontend that talks to its backend constantly, kept on the same host.</text></g><!--entity pan1--><g class="entity" data-entity="pan1" data-source-line="13" data-uid="ent0007" id="entity_pan1"><rect fill="#FEE2E2" height="178.6372" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="544.439" x="406.8213" y="534.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="516.439" x="420.8213" y="560.8921">Certain Pods MUST NOT (required) or SHOULD NOT (preferred) be scheduled into a</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="323.5845" x="420.8213" y="575.8408">topology domain that already holds a matching Pod.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.7954" x="751.6294" y="575.8408">Separation.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="420.8213" y="590.7896">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="355.0991" x="420.8213" y="603.8623">spec.affinity.podAntiAffinity &#8212; identical structure, opposite answer.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="420.8213" y="618.3872">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="421.7813" x="420.8213" y="631.46">Distribute replicas across nodes &#183; remove a single point of failure &#183; balance load.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="426.814" x="420.8213" y="644.1089">The classic use: a Deployment's own Pods anti-affine to their OWN label, so three</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="341.0591" x="420.8213" y="656.7578">replicas land on three different nodes instead of stacking on one.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="420.8213" y="671.2827">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="447.3101" x="420.8213" y="684.3555">With REQUIRED anti-affinity, the LimitPodHardAntiAffinityTopology admission plugin</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="405.8721" x="420.8213" y="697.0044">restricts topologyKey to kubernetes.io/hostname unless an admin changes it.</text></g><!--entity sh1--><g class="entity" data-entity="sh1" data-source-line="17" data-uid="ent0009" id="entity_sh1"><rect fill="#326CE5" height="151.0396" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="564.5669" x="407.3213" y="762.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.6436" x="421.3213" y="788.8921">All three take</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="52.0127" x="506.5767" y="788.8921">required</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.3945" x="562.2012" y="788.8921">(a filter) and</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0781" x="640.2075" y="788.8921">preferred</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.7427" x="700.8975" y="788.8921">(a weighted score boost),</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="99.709" x="421.3213" y="803.8408">and all three are</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="151.6709" x="524.6421" y="803.8408">IgnoredDuringExecution</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="267.9854" x="679.9248" y="803.8408">&#8212; none of them ever moves a running Pod.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="421.3213" y="818.7896">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="478.6128" x="421.3213" y="831.8623">Pod affinity and anti-affinity are evaluated against the CURRENT cluster state, which makes</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="503.8193" x="421.3213" y="844.5112">them expensive: 'require substantial amounts of processing which can slow down scheduling in</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="484.1343" x="421.3213" y="857.1602">large clusters significantly. We do not recommend using them in clusters larger than several</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="459.2124" x="421.3213" y="869.8091">hundred nodes.' Node affinity carries no such warning &#8212; node labels are cheap to read.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="421.3213" y="884.334">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="536.5669" x="421.3213" y="897.4067">Pod affinity/anti-affinity support In &#183; NotIn &#183; Exists &#183; DoesNotExist only. Gt and Lt are nodeAffinity-only.</text></g><g class="link" data-entity-1="na" data-entity-2="pa" data-uid="lnk10" id="link_na_pa"><polygon fill="#475569" points="380.8213,263.6817,384.8213,254.6817,380.8213,258.6817,376.8213,254.6817,380.8213,263.6817" style="stroke:#475569;stroke-width:1;"/><path d="M380.8213,256.4798 C380.8213,257.7221 380.8213,258.9684 380.8213,260.2179 C380.8213,260.8427 380.8213,261.4683 380.8213,262.0947 C380.8213,262.4079 380.8213,262.7212 380.8213,263.0348 C380.8213,263.1915 380.8213,263.3483 380.8213,263.5052 C380.8213,263.5444 380.8213,263.5836 380.8213,263.6228 C380.8213,263.6425 380.8213,257.6621 380.8213,257.6817" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pa" data-entity-2="pan" data-uid="lnk11" id="link_pa_pan"><polygon fill="#475569" points="380.8213,501.6972,384.8213,492.6972,380.8213,496.6972,376.8213,492.6972,380.8213,501.6972" style="stroke:#475569;stroke-width:1;"/><path d="M380.8213,493.9199 C380.8213,494.579 380.8213,495.2387 380.8213,495.8989 C380.8213,497.2193 380.8213,498.5418 380.8213,499.8657 C380.8213,500.1967 380.8213,500.5277 380.8213,500.8588 C380.8213,501.0244 380.8213,501.19 380.8213,501.3556 C380.8213,501.4384 380.8213,501.5212 380.8213,501.604 C380.8213,501.6247 380.8213,501.6454 380.8213,501.6661 C380.8213,501.6765 380.8213,495.6868 380.8213,495.6972" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pan" data-entity-2="sh" data-uid="lnk12" id="link_pan_sh"><polygon fill="#475569" points="380.8213,729.6733,384.8213,720.6733,380.8213,724.6733,376.8213,720.6733,380.8213,729.6733" style="stroke:#475569;stroke-width:1;"/><path d="M380.8213,722.0911 C380.8213,722.6868 380.8213,723.2829 380.8213,723.8793 C380.8213,725.0721 380.8213,726.2661 380.8213,727.4607 C380.8213,728.0581 380.8213,728.6556 380.8213,729.2531 C380.8213,729.3278 380.8213,729.4025 380.8213,729.4772 C380.8213,729.5146 380.8213,729.5519 380.8213,729.5893 C380.8213,729.6079 380.8213,729.6266 380.8213,729.6453 C380.8213,729.6546 380.8213,723.664 380.8213,723.6733" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1316.6426" x="5" y="941.8301">nodeAffinity asks a question about the node. podAffinity and podAntiAffinity ask a question about the Pods already there &#8212; which is why they, and only they, need a topologyKey to say what "already there" means.</text></g><!--SRC=[ZLVBRXit5DthAswpSG98Sh9e5uAZG8c4sAWhfvOC8sYwe6Oe3I4EEI4vKTGWG5TP5qN_fVj-Ihwavt8UaUn96y4mva5UtiSvvzxvJfb4bwcauV2q-WlMQd-QAh5n8lUdsyI8GSXaBeT5cUjUK45BMcPEIdAbbhvFmgI45MIDtjFRKlgWhC4J4SZBGZWHfES5-OXscVMIj5X9xKdaT45EYbIPpRDUpyaa2BE1zGV6fdAoNYkZmfu-__vNNELfVZMTrPiVqDdPnjcoU6bjEXwJy6G4VUWH7PWvMurlCvLanFOy-SoMEgLyJwziIYj9FibaYXZWlktJIdXSmVDupENa-UnoyUpiT3L-Oywy-asEdZmP-q8cGr5xDZnoyv-_IL1kdIJvld3IU_LEneCNKiCbwyvEsGgi7TZRbYkyqrLGSVNfphgjT8Cdb2g_3Vj2FlK-RVUsEpz_-ZCcdKFHg81dpzkzi2fAP9fNn70IuPoAPK1Lucd3Bd_cKgP-HBa8IJQhmx363sbkaQF2QhlP_oYhch1jzfWk5l6wH1g6znszAYGGO1tCNXZEqjo6wcBsNldW-MfgfSVZ-83lNyR_b-6-jMep8-veZq3QCxkZlIsRz5U-JURBYq5RCE1MOgN