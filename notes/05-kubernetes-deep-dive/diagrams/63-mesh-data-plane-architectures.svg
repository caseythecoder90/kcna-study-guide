<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="409px" preserveAspectRatio="none" style="width:1244px;height:409px;background:#FFFFFF;" version="1.1" viewBox="0 0 1244 409" width="1244px" zoomAndPan="magnify"><title>Service mesh: one control plane, two ways to build the data plane</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="563.1152" x="332.9424" y="30.8838">Service mesh: one control plane, two ways to build the data plane</text></g><!--cluster side--><g class="cluster" data-qualified-name="side" data-source-line="6" id="ent0003"><rect fill="#F0FDF4" height="231" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="636" x="14" y="172.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="272.3589" x="195.8206" y="190.8921">Sidecar data plane &#8212; a proxy in EVERY Pod</text></g><!--cluster n1--><g class="cluster" data-qualified-name="side.n1" data-source-line="7" id="ent0004"><rect fill="#F8FAFC" height="190" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="232" x="48" y="205.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="43.3418" x="142.3291" y="223.8921">Node 1</text></g><!--cluster host--><g class="cluster" data-qualified-name="host" data-source-line="16" id="ent0010"><rect fill="#F8FAFC" height="231" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="580" x="658" y="172.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="350.3335" x="772.8333" y="190.8921">Per-node (host) proxy data plane &#8212; one proxy per NODE</text></g><!--cluster n2--><g class="cluster" data-qualified-name="host.n2" data-source-line="17" id="ent0011"><rect fill="#F8FAFC" height="190" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="212" x="690" y="205.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="43.3418" x="774.3291" y="223.8921">Node 1</text></g><!--entity cp--><g class="entity" data-qualified-name="cp" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="506.6235" x="165.5" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.8945" x="179.5" y="79.8921">Control plane &#8212; the brain</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="478.6235" x="179.5" y="92.9648">config, certificates for mTLS, policy &#183; pushes config to every proxy, never touches requests</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="311.0884" x="179.5" y="105.6138">Istio: istiod &#183; Linkerd: destination + identity + proxy-injector</text></g><!--entity sl--><g class="entity" data-qualified-name="side.sl" data-source-line="12" id="ent0008"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="279.3882" x="302.5" y="357.5161">Istio (classic), Linkerd &#183; finest control, full L7 per workload</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="324.9243" x="302.5" y="370.165">cost: one proxy's CPU/memory per Pod, injected into the Pod spec</text></g><!--entity p1--><g class="entity" data-qualified-name="side.n1.p1" data-source-line="8" id="ent0005"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="180.8506" x="56.5" y="238.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="70.5" y="264.8921">Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.8506" x="70.5" y="277.9648">app container | sidecar proxy</text></g><!--entity p2--><g class="entity" data-qualified-name="side.n1.p2" data-source-line="9" id="ent0006"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="180.8506" x="56.5" y="331.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="24.5527" x="70.5" y="357.8921">Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.8506" x="70.5" y="370.9648">app container | sidecar proxy</text></g><!--entity hl--><g class="entity" data-qualified-name="host.hl" data-source-line="22" id="ent0015"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="221.896" x="926" y="357.5161">Traefik Mesh &#183; Istio ambient (ztunnel) &#183; Cilium</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="290.3882" x="926" y="370.165">simpler to run, fewer moving parts; may offer fewer features</text></g><!--entity np--><g class="entity" data-qualified-name="host.n2.np" data-source-line="18" id="ent0012"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="98.0654" x="747" y="238.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0654" x="761" y="264.8921">node proxy</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="60.5161" x="761" y="277.9648">DaemonSet</text></g><!--entity ap--><g class="entity" data-qualified-name="host.n2.ap" data-source-line="19" id="ent0013"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="196.4033" x="698" y="331.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.4033" x="712" y="357.8921">app Pod &#183; app Pod &#183; app Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="56.2515" x="712" y="370.9648">no sidecars</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk18"><polygon fill="#475569" points="44.2372,172.4453,53.3246,168.6479,47.67,168.81,47.508,163.1554,44.2372,172.4453" style="stroke:#475569;stroke-width:1;"/><path d="M173.3061,121.7778 C144.2271,128.0839 116.9311,135.4133 94.3896,143.8666 C83.1188,148.0932 73.0367,152.6008 64.5146,157.4018 C60.2536,159.8024 56.3825,162.2763 52.948,164.8252 C51.2307,166.0996 49.6225,167.3928 48.1292,168.7049 C47.3826,169.361 46.6647,170.0218 45.9763,170.6873 C45.632,171.0201 45.2952,171.354 44.9658,171.6892 C44.8011,171.8568 44.6382,172.0246 44.4773,172.1928 C44.3968,172.2769 48.4361,167.9987 48.3566,168.0829" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="66.0176" x="112" y="156.9541">config (xDS)</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" data-link-type="dependency" id="lnk19"><polygon fill="#475569" points="657.8891,254.5154,652.7765,246.0975,653.7816,251.6643,648.2148,252.6694,657.8891,254.5154" style=