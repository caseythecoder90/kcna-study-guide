<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="780px" preserveAspectRatio="none" style="width:888px;height:780px;background:#FFFFFF;" version="1.1" viewBox="0 0 888 780" width="888px" zoomAndPan="magnify"><title>Who is allowed &#8212; four peer kinds, and one dash that changes AND into OR</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="644.0625" x="114.4688" y="30.8838">Who is allowed &#8212; four peer kinds, and one dash that changes AND into OR</text></g><!--cluster k--><g class="cluster" data-entity="k" data-source-line="4" data-uid="ent0002" id="cluster_k"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="868" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.9409" x="340.0295" y="71.8921">The four kinds of peer in from: / to:</text></g><!--cluster and--><g class="cluster" data-entity="and" data-source-line="14" data-uid="ent0010" id="cluster_and"><rect fill="#F0FDF4" height="194" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="492" x="14" y="170.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129.2954" x="195.3523" y="188.8921">ONE list item &#8212; AND</text></g><!--cluster or--><g class="cluster" data-entity="or" data-source-line="18" data-uid="ent0012" id="cluster_or"><rect fill="#FEF2F2" height="194" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="646" x="14" y="372.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="130.0127" x="271.9937" y="390.8921">TWO list items &#8212; OR</text></g><!--cluster up--><g class="cluster" data-entity="up" data-source-line="22" data-uid="ent0014" id="cluster_up"><rect fill="#F8FAFC" height="154" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="610" x="14" y="574.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.1689" x="235.9155" y="592.8921">The same rule one level up</text></g><!--entity k1--><g class="entity" data-entity="k1" data-source-line="5" data-uid="ent0003" id="entity_k1"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="170.4736" x="56" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75.1245" x="70" y="112.8921">podSelector</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="142.4736" x="70" y="125.9648">Pods with these labels, in the</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="139.6484" x="70" y="138.6138">POLICY'S OWN namespace</text></g><!--entity k2--><g class="entity" data-entity="k2" data-source-line="6" data-uid="ent0004" id="entity_k2"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="152.7437" x="244.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="122.1226" x="258.5" y="112.8921">namespaceSelector</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.7437" x="258.5" y="125.9648">ALL Pods in namespaces</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="81.3237" x="258.5" y="138.6138">with these labels</text></g><!--entity k3--><g class="entity" data-entity="k3" data-source-line="7" data-uid="ent0005" id="entity_k3"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="240.0625" x="416" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="212.0625" x="430" y="112.8921">namespaceSelector + podSelector</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="132.0269" x="430" y="125.9648">in ONE entry: these Pods</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="133.2622" x="430" y="138.6138">within those namespaces</text></g><!--entity k4--><g class="entity" data-entity="k4" data-source-line="8" data-uid="ent0006" id="entity_k4"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="199.166" x="674.5" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.9536" x="688.5" y="112.8921">ipBlock</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="141.8452" x="688.5" y="125.9648">a CIDR, with optional except.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="171.166" x="688.5" y="138.6138">Meant for IPs OUTSIDE the cluster</text></g><!--entity and1--><g class="entity" data-entity="and1" data-source-line="15" data-uid="ent0011" id="entity_and1"><rect fill="#DCFCE7" height="153.3394" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="441.8696" x="56" y="203.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="50.5718" x="70" y="229.8921">ingress:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41.1582" x="70" y="244.8408">- from:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="6.668" x="70" y="258.8516">&#160;&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="124.0547" x="76.668" y="258.8516">- namespaceSelector:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="149.3965" x="90.0039" y="272.6504">matchLabels: {user: alice}</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="13.3359" x="70" y="286.4492">&#160;&#160;&#160;&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="73.3418" x="83.3359" y="286.4492">podSelector:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="151.377" x="183.3496" y="286.4492">&#8592; NO dash: same list item</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="150.709" x="90.0039" y="300.248">matchLabels: {role: client}</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="70" y="314.9849">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="413.8696" x="70" y="328.0576">Allows Pods labelled role=client THAT ARE IN namespaces labelled user=alice.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="227.9546" x="70" y="340.7065">Both conditions on the SAME peer. Narrow.</text></g><!--entity or1--><g class="entity" data-entity="or1" data-source-line="19" data-uid="ent0013" id="entity_or1"><rect fill="#FEE2E2" height="153.3394" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="594.8491" x="56.5" y="405.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="50.5718" x="70.5" y="431.8921">ingress:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41.1582" x="70.5" y="446.8408">- from:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="6.668" x="70.5" y="460.8516">&#160;&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="124.0547" x="77.168" y="460.8516">- namespaceSelector:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="149.3965" x="90.5039" y="474.6504">matchLabels: {user: alice}</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="6.668" x="70.5" y="488.4492">&#160;&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="80.6719" x="77.168" y="488.4492">- podSelector:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="167.373" x="184.5117" y="488.4492">&#8592; a DASH: a second list item</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="150.709" x="90.5039" y="502.248">matchLabels: {role: client}</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="70.5" y="516.9849">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="566.8491" x="70.5" y="530.0576">Allows ANY Pod in ANY namespace labelled user=alice, OR role=client Pods in the policy's own namespace.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="488.0767" x="70.5" y="542.7065">Much wider than it looks. 'When in doubt, use kubectl describe' to see how it was interpreted.</text></g><!--entity up1--><g class="entity" data-entity="up1" data-source-line="23" data-uid="ent0015" id="entity_up1"><rect fill="#FFFFFF" height="113.0928" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="559.373" x="56.5" y="607.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.2109" x="70.5" y="633.8921">Within one rule:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.1841" x="179.5464" y="633.8921">the peers in from/to are ORed together &#8212; then ANDed with ports.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4727" x="70.5" y="648.8408">Between rules:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.8696" x="184.6436" y="648.8408">separate entries under ingress: (or egress:) are ORed.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8081" x="70.5" y="663.7896">Between policies:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.4731" x="191.1436" y="663.7896">ORed as well &#8212; the union of everything that selects the Pod.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="70.5" y="678.7383">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="476.8994" x="70.5" y="691.811">Namespaces cannot be named directly. Select by label &#8212; every namespace carries an immutable</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="531.373" x="70.5" y="704.46">kubernetes.io/metadata.name label set by the control plane, so  {kubernetes.io/metadata.name: prod}  works.</text></g><g class="link" data-entity-1="k" data-entity-2="and" data-uid="lnk16" id="link_k_and"><polygon fill="#475569" points="30,170.6842,34,161.6842,30,165.6842,26,161.6842,30,170.6842" style="stroke:#475569;stroke-width:1;"/><path d="M30,163.0794 C30,163.4495 30,163.8211 30,164.1941 C30,164.9401 30,165.6916 30,166.4482 C30,167.2049 30,167.9668 30,168.7335 C30,169.1168 30,169.5014 30,169.8871 C30,170.0799 30,170.2731 30,170.4665 C30,170.5149 30,170.5632 30,170.6116 C30,170.6358 30,164.66 30,164.6842" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="and" data-entity-2="or" data-uid="lnk17" id="link_and_or"><polygon fill="#475569" points="30,372.6832,34,363.6832,30,367.6832,26,363.6832,30,372.6832" style="stroke:#475569;stroke-width:1;"/><path d="M30,365.1594 C30,365.4349 30,365.7105 30,365.9863 C30,366.5379 30,367.0901 30,367.6429 C30,368.7484 30,369.8562 30,370.9657 C30,371.5204 30,372.0756 30,372.6311 C30,372.6485 30,366.6658 30,366.6832" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="or" data-entity-2="up" data-uid="lnk18" id="link_or_up"><polygon fill="#475569" points="30,574.669,34,565.669,30,569.669,26,565.669,30,574.669" style="stroke:#475569;stroke-width:1;"/><path d="M30,567.3391 C30,569.2911 30,571.2467 30,573.2024 C30,573.6913 30,568.1802 30,568.669" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="30"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="713.501" x="79.7495" y="748.8301">The only AND anywhere in a NetworkPolicy peer list is two selectors inside a single list item. Everything else is OR.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="642.0039" x="115.498" y="764.9287">That makes one stray dash the most common way to accidentally open a policy far wider than intended.</text></g><!--SRC=[pLPDRzj64BthLqnpSOjO5Epa92W2vDXe33YIORimWgQ79JaM5rpk4BlBigfXeAUUS-Wlp2_fp5AVbfpsKg223XAvE_FslJSp-vsscMboX2GPTDz0PFmWrshkLEK7PMPLFnHOOL8tbUa57Gp2VK6WFIXZgCKSllxn5pnGuw16T51gc_jZK3O7iWYvyWM4GWN82cNdw64oFGTj0y7ifjTpc0L-p45VtHNOXOaHW1wwUDh2WwDg20C8D7m5ez7SKLEFnw0ybF3O0zWACah7DUMtQFWHkT4W7N-s8wz_n-79oVYQE6whWm12Zs1KYeQnSWf-C1h8kftriwlBzv-ERc5sFmMhAlIrobRh14bjbBPB92TxGDOxNe0pkRg228dphzVwVHXxY5z0SFhF2E0rl4mFmvXDBm1jS8lXCg7WEumeaaQyP0-wu59Pnd6MmDxi0TFrcQ6iV0P0mVlByvlZJYAgWoQh3E1l6TOXsKVn4PKDR1a7bzSUPZ_TtLwUNmXkO5FxWEu5djuodF84-ZyNEi_H_kBql0ZzSKTWUNhWXHoWV7FWnTlUquw7XJ-ZVG0Ti8g5mMvVU_P7ehp38DNnpBdQpXrwF_ni-vtXroSz7GCmPttOatCe13udHfRBfr8XAwwYOORms7XqGovPdU7JuHsxfHD3m_BpzSylC9t5MXw2PnIRG_wxx8uC3baMpQROfD-k1UablYk7Q7B3ZKLslUismTs7oHrCRYxWSgiKjzRA-Tx5unrmoXcneJAokHPFSM-91G-tauyNiSaaC5NEKPjiEMQ-BTR9CvtlxcSR2dmKUdQprlbCBNUoDVzVAiS4tr9PmVdazWE708z2s7ybz6JwISIMrYS_rsS-9EWnSxlZXLNJ50rhuYMB8-QwtUgYXxf5anNSMN8UAJoEB9y9357f4pYwBz1Al9oQD1nBPYY