<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="309px" preserveAspectRatio="none" style="width:1076px;height:309px;background:#FFFFFF;" version="1.1" viewBox="0 0 1076 309" width="1076px" zoomAndPan="magnify"><title>kubectl delete deployment web &#8212; three propagation policies</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="519.0996" x="270.9502" y="30.8838">kubectl delete deployment web &#8212; three propagation policies</text></g><!--cluster bg--><g class="cluster" data-entity="bg" data-source-line="4" data-uid="ent0002" id="cluster_bg"><rect fill="#F0FDF4" height="199" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="324" x="14" y="56.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="181.2764" x="85.3618" y="74.3921">BACKGROUND &#8212; the default</text></g><!--cluster fg--><g class="cluster" data-entity="fg" data-source-line="8" data-uid="ent0004" id="cluster_fg"><rect fill="#F8FAFC" height="204" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="340" x="346" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.8882" x="469.0559" y="71.8921">FOREGROUND</text></g><!--cluster or--><g class="cluster" data-entity="or" data-source-line="12" data-uid="ent0006" id="cluster_or"><rect fill="#FEF2F2" height="199" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="376" x="694" y="56.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56.3354" x="853.8323" y="74.3921">ORPHAN</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="5" data-uid="ent0003" id="entity_b1"><rect fill="#DCFCE7" height="157.939" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="274.3398" x="56" y="89.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.9653" x="70" y="115.3921">--cascade=background</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="197.1836" x="70" y="130.3408">propagationPolicy: Background</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="70" y="145.2896">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.1563" x="70" y="160.2383">1. The Deployment is deleted</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.5127" x="252.7681" y="160.2383">at once</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="298.2808" y="160.2383">.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238.3735" x="70" y="175.187">2. The garbage collector then finds the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="235.5044" x="80.8354" y="190.1357">ReplicaSets whose owner is gone and</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="184.9263" x="80.8354" y="205.0845">deletes them, then their Pods.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.5537" x="70" y="218.1572">kubectl returns immediately; dependents</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.3237" x="70" y="230.8062">disappear a moment later.</text></g><!--entity f1--><g class="entity" data-entity="f1" data-source-line="9" data-uid="ent0005" id="entity_f1"><rect fill="#FFFFFF" height="162.5386" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="290.2979" x="388" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.8936" x="402" y="112.8921">--cascade=foreground</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7788" x="402" y="127.8408">propagationPolicy: Foreground</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="402" y="142.7896">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.2979" x="402" y="157.7383">1. The Deployment gets a deletionTimestamp</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="43.3735" x="412.8354" y="172.687">and the</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6055" x="459.8208" y="172.687">foregroundDeletion</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="61.4072" x="584.0381" y="172.687">finalizer &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.77" x="412.8354" y="187.6357">still visible, 'deletion in progress'.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2515" x="402" y="202.5845">2. Dependents are deleted first (those with</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.2725" x="412.8354" y="217.5332">blockOwnerDeletion: true hold it up).</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.8418" x="402" y="232.4819">3.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.0527" x="416.4536" y="232.4819">Then</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8062" x="451.1182" y="232.4819">the Deployment itself goes.</text></g><!--entity o1--><g class="entity" data-entity="o1" data-source-line="13" data-uid="ent0007" id="entity_o1"><rect fill="#FEE2E2" height="157.939" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="326.3779" x="736" y="89.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.6235" x="750" y="115.3921">--cascade=orphan</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.5654" x="750" y="130.3408">propagationPolicy: Orphan</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="750" y="145.2896">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="37.5654" x="750" y="160.2383">1. The</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.0527" x="791.1772" y="160.2383">orphan</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.0845" x="838.8418" y="160.2383">finalizer is added.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="242.709" x="750" y="175.187">2. The ownerReferences pointing at the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.5317" x="760.8354" y="190.1357">Deployment are</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1899" x="861.979" y="190.1357">removed</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.5972" x="919.7808" y="190.1357">from its ReplicaSets.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="182.7681" x="750" y="205.0845">3. The Deployment is deleted.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="212.7114" x="750" y="218.1572">The ReplicaSets and Pods keep running,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="102.0454" x="750" y="230.8062">now with no owner.</text></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="680.8252" x="190.0874" y="277.8301">Orphans are not lost: a new controller whose selector matches them ADOPTS them (writes itself in as owner).</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="609.6836" x="225.6582" y="293.9287">That is the use of --cascade=orphan &#8212; replace or re-create a controller without restarting its Pods.</text></g><!--SRC=[XLJRRjD047tFLmnzQP6QH8Mt42ArX1O9gOdIyaHuMDjZUvNrhZMxRbGG5H_15_8bpApTnFH2fIYnuhcSEUVClD8sDKs6C1gDsqzmplXnfbL1glBZJMhLC9HOuQXkAZC8EXY4JPDW6WnaQ30W_zJ6tLPe0smnWJ-_VaCe2H5gShKgLD3EGksCJZNwmO0uLzc2wnoSdNxuVB5QVBcSTrbIB5UD2GSmdHRaclh2kMms0-KXAU370A2NFarcTyExOQfygZ9ydwXq8pascuwJsThssY-b- -q4pdOXQxks9oEuvfRpFNxjkw4ouE8gWBCfIhNHshvfemj5YIeGKcSCGt4ai2tascPU7jSM05PSKgVg2eE7RUayWjjQ9AbVE8kW1037jSrYNdNS5k8lJR1qcUUUKw-_u-JaP7PFEM5eo7hGLOMiKa1p-qu4G9inVZyTIyAibvXfh-eQ5O62oiKX3QVHg0kDHEyvFXdy_4UXyyNgOwlGJf4sCdz9ZTmHlg36-IxaQJKAeK-r977QjQxG1rNLaJgcC1g6s-vRpRjGQIcIACCpafWhvlYWZO4RxNLYy1WExok3jcBMWj3xmrRg-OvJK8GxL-IQV82Z43NTwb36kebnwMOX2jy3c42W1g5q9WCTeAbVSzct8q7BGxRumWFl1OycPt-W7mdPjL7QTcG_b6MnMduwlTn9SgOw_TYD_rV5KLqg-wmYY_YwfmQdxrDwZBAHLPPXjj-BQF0LvaZ8E-DvuRKDsXR0MtI_5hrfXLGkJbYv6ypQwkGgOQ6_FIrhpsvfVqKagBztOX1P8zWWra2DjOpc-F66MBUDIe9rxH3zrKXsp4O9-0ODlvQQ9xVVI1Tb63BiOf0_yRUZmI1LTRJNLCzQPbipMSTBw7oOiBajRlcKs41oJgWx5co4zhHKAgHbTn_WTBvONb-rpqTRqd8uEjEmVmMZe7_DyBNCfvaH5SaIepLoWt9ux8LuUObvKocAVmY7AI6V20RN1yOCkIRmQrv1YiAALF5EISE_]--></g></svg>