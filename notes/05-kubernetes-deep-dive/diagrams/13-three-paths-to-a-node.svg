<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="806px" preserveAspectRatio="none" style="width:951px;height:806px;background:#FFFFFF;" version="1.1" viewBox="0 0 951 806" width="951px" zoomAndPan="magnify"><title>Two fields in the Pod spec decide who places it &#8212; and one of them skips the whole system</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="779.1592" x="82.3457" y="30.8838">Two fields in the Pod spec decide who places it &#8212; and one of them skips the whole system</text></g><!--cluster a--><g class="cluster" data-entity="a" data-source-line="4" data-uid="ent0002" id="cluster_a"><rect fill="#F0FDF4" height="215" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="564" x="189.4253" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="268.6899" x="337.0803" y="71.8921">PATH A &#183; the default &#8212; you set neither field</text></g><!--cluster b--><g class="cluster" data-entity="b" data-source-line="8" data-uid="ent0004" id="cluster_b"><rect fill="#F8FAFC" height="255" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="526" x="189.4253" y="276.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="348.9116" x="277.9695" y="294.8921">PATH B &#183; your own scheduler &#8212; you set schedulerName</text></g><!--cluster c--><g class="cluster" data-entity="c" data-source-line="12" data-uid="ent0006" id="cluster_c"><rect fill="#FEF2F2" height="215" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="588" x="189.4253" y="539.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="309.8926" x="328.479" y="557.8921">PATH C &#183; no scheduler at all &#8212; you set nodeName</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="5" data-uid="ent0003" id="entity_a1"><rect fill="#DCFCE7" height="174.0376" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="514.1987" x="231.4253" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="199.3989" x="245.4253" y="112.8921">spec.schedulerName defaults to</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.3545" x="448.436" y="112.8921">default-scheduler</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.6099" x="564.0142" y="112.8921">&#183;  spec.nodeName is empty</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="308.0752" x="245.4253" y="125.9648">kube-scheduler picks the Pod up, filters, scores and binds.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="245.4253" y="140.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="447.9761" x="245.4253" y="153.5625">STEER IT WITHOUT REPLACING IT &#8212; all of these are INPUTS to filtering and scoring:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="431.5352" x="251.5376" y="166.2114">nodeSelector               match node LABELS, e.g. kubernetes.io/hostname: worker-1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="382.6313" x="251.5376" y="178.8604">nodeAffinity               the same idea with required/preferred and operators</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="331.2622" x="251.5376" y="191.5093">podAffinity / antiAffinity place near, or away from, OTHER Pods</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="309.2944" x="251.5376" y="204.1582">tolerations                accept nodes carrying a matching taint</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="360.0244" x="251.5376" y="216.8071">topologySpreadConstraints  balance across zones, regions or nodes</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="245.4253" y="231.332">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="411.3936" x="245.4253" y="244.4048">The scheduler still makes the decision. You are narrowing what it may choose.</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="9" data-uid="ent0005" id="entity_b1"><rect fill="#326CE5" height="214.2842" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="476.0137" x="231.4253" y="309.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="134.3926" x="245.4253" y="335.8921">spec.schedulerName:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="84.5317" x="383.4297" y="335.8921">my-scheduler</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="412.5859" x="245.4253" y="348.9648">kube-scheduler sees a name that is not its own and LEAVES THE POD ALONE.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="327.5991" x="245.4253" y="361.6138">The Pod sits Pending until something claiming that name acts.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="245.4253" y="376.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="349.6528" x="245.4253" y="389.2114">A scheduler is just an API client. The entire contract is three steps:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="429.1343" x="251.5376" y="401.8604">1. watch for Pods where spec.schedulerName is mine AND spec.nodeName is null</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="222.5244" x="251.5376" y="414.5093">2. decide a node, by whatever rule you like</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="296.3984" x="251.5376" y="427.1582">3. POST a Binding object naming that Pod and that Node</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="245.4253" y="441.6831">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="445.6235" x="245.4253" y="454.7559">spurin/simple-kubernetes-scheduler-example does all three in about 40 lines of bash,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="448.0137" x="245.4253" y="467.4048">picking a node at RANDOM. It uses kubectl CREATE, not apply &#8212; Binding is a special</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="234.1099" x="245.4253" y="480.0537">resource that is written once, not reconciled.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="245.4253" y="494.5786">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="362.4199" x="245.4253" y="507.6514">If nothing is running under that name, the Pod stays Pending forever.</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="13" data-uid="ent0007" id="entity_c1"><rect fill="#FEE2E2" height="174.0376" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="538.3613" x="231.4253" y="572.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.0317" x="245.4253" y="598.8921">spec.nodeName:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1899" x="353.0688" y="598.8921">worker-1</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="492.0029" x="245.4253" y="611.9648">If nodeName is not empty, the SCHEDULER IGNORES THE POD and the kubelet on the named</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="454.7329" x="245.4253" y="624.6138">node tries to place it. nodeName OVERRULES nodeSelector, affinity and anti-affinity &#8212;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.6846" x="245.4253" y="637.2627">none of them are consulted.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="245.4253" y="651.7876">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="265.8691" x="245.4253" y="664.8604">Which means nothing checks the decision for you:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="471.8506" x="251.5376" y="677.5093">&#183; the named node does not exist  &#8594; the Pod will not run, and may be deleted automatically</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="504.249" x="251.5376" y="690.1582">&#183; the named node lacks resources &#8594; the Pod FAILS, with a reason of OutOfcpu or OutOfmemory</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="380.8213" x="251.5376" y="702.8071">&#183; node names in cloud environments are not always predictable or stable</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="245.4253" y="717.332">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="463.9551" x="245.4253" y="730.4048">Intended for custom schedulers and advanced cases. For targeting, prefer nodeSelector.</text></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="933.8506" x="5" y="774.8301">The scheduler is a replaceable component, not a fixed part of the cluster: it is opt-in per Pod via schedulerName, and skippable entirely via nodeName.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="737.7754" x="103.0376" y="790.9287">Every path ends the same way &#8212; a Pod with spec.nodeName set, and the kubelet on that node starting the containers.</text></g><!--SRC=[ZLRDRjj64BxxAQOvIrJTzcGO0cH7YGMubc4f2OgcXzLo96rDxhAxooXAKQ2dFa3HT-czZv8dwJTBYP9Y6gtX0qdjpiyttpSpNnchYpfdoh91yn-TAy8WDshbLHa6ZzggVbnpoLbLbyLPDB5WccySBGqNUI1Z2J_JlSifLAmfPsrWRxDsL1LACqv4-lpxNwHiJiuokQLSA2aycYgakpWBcs4R8fTdPvvrL7Q5Bo_kH_CR6j4_VwTZEIzLNJJ6jgwcm94i6_pacs1UqENbohkwUkrSFXoI2gJerpEY8vCIOnRqclEwO7-dojOkOd5qkHZkNlljeSl1OaWIH4emioxdTCy4uhAAs_VsCfXFV75-Fdoi5touI9NHZw65fwvwYBE8x4EFWdOUs0We2sFpa5qEnCZmlJqoDvkFnmyqcTExoVnc-cPE3-Fxsz7rvEwrV4oW5iKEqC2aFDFaxlxDV2QfDAwCNIKduW_F5wsRrWcHP3JZ0Y0vJwT_fOfwdGxGxUXgV3lh4MUhZ2HHRpboo8mRh5s85f1SqCRvH_Rzy-VSZ9PBOqtSVk5680e9qvmLRL1JrEoNsdZE1vNd9NiyDGogs2l46ReyL2vl7GnmF9hsDN4HT56-HyXIRTIMbjwLFPhERm0o2jHfCeAQS6YS3L_4J4fhhc9AAv1MtcyJs0rcyXYLiR7RQEKAjzhEa9lAhs4xUZaB5mjLA8j8bVOk1Fe4nO0jdbSf0aIUt7MHPIuOjjGBqO0QfNhai1EFDW4sCle1qX6cM4JiDXBdPgsYgBG49dhjNE0z6vEY3c8wF_ljgJwlH1hGeoUtiKSH7ClqH72jJ1khY_-Mw8NeijoUIl9vsGKMPP4m4hbBRW6mIOeXnIWykXsFtevdXDhJ_VGbZMwdT-FiQQtc-zOcT-_Pve9N3M8L55p9CTLP5ygKgU3YBBbLEdPBUdI44CBwkGuHyT3eVW8pXctCI7pY0UGdxIoOeLC6SUqP5OvSXKuLdsUqIMfTWYL2PzILOQEZuy4QucKQtRrysjDiNHHTzh_9zhrT9HBsQB5DrE4FoCN3U2ftOHwvw_gt6O2UpN7voZGmkiNFABhWrM8dK4jrqiiTd7H16AeQhGm_b5N1_KCdEZ2Wpn-L_4Yv4oP020ruc5LguUf8ttsDEA4iwPqB5TQzfn5BxsxqdBeVuda0NDFlCvf4gWFkYcST2xf-68_curwYcAggOfkely_I21K5PACwOCKCW7BqWQSRRs9aYqcfkJ49PU3559nt4cgob5FhdIjVMzjGD4THMZxs3ZCwgks1oQ2ALEzOxjBLRDn9irFmro9uwuw832y2yibWtZ6g5VkLsdKHtQdt_VaazSCKEP5vIlM8g00d3U0ckzdrpVZbcriPcA