<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="803px" preserveAspectRatio="none" style="width:825px;height:803px;background:#FFFFFF;" version="1.1" viewBox="0 0 825 803" width="825px" zoomAndPan="magnify"><title>Reclaim policy &#8212; what happens to the storage when the CLAIM is deleted</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="631.1074" x="93.3374" y="30.8838">Reclaim policy &#8212; what happens to the storage when the CLAIM is deleted</text></g><!--cluster t--><g class="cluster" data-entity="t" data-source-line="4" data-uid="ent0002" id="cluster_t"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="612" x="114.3911" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="159.6563" x="340.563" y="71.8921">The trigger is never a Pod</text></g><!--cluster r--><g class="cluster" data-entity="r" data-source-line="8" data-uid="ent0004" id="cluster_r"><rect fill="#F0FDF4" height="164" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="586" x="114.3911" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="280.2998" x="267.2412" y="201.8921">RETAIN &#8212; keep everything, a human decides</text></g><!--cluster d--><g class="cluster" data-entity="d" data-source-line="12" data-uid="ent0006" id="cluster_d"><rect fill="#FEF2F2" height="149" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="578" x="114.3911" y="355.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="319.998" x="243.3921" y="373.8921">DELETE &#8212; remove the PV and the storage behind it</text></g><!--cluster rc--><g class="cluster" data-entity="rc" data-source-line="16" data-uid="ent0008" id="cluster_rc"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="604" x="114.3911" y="512.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.9072" x="330.4375" y="530.8921">RECYCLE &#8212; DEPRECATED</text></g><!--cluster ph--><g class="cluster" data-entity="ph" data-source-line="20" data-uid="ent0010" id="cluster_ph"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="600" x="114.3911" y="629.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="366.2407" x="231.2708" y="647.8921">PV PHASES &#8212; where the policy shows up in kubectl get pv</text></g><!--entity t1--><g class="entity" data-entity="t1" data-source-line="5" data-uid="ent0003" id="entity_t1"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="561.5806" x="156.3911" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.7471" x="170.3911" y="112.8921">kubectl delete pvc &lt;claim&gt;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="533.5806" x="170.3911" y="125.9648">Deleting the Pod does nothing to a PV. Only releasing the CLAIM asks the question this field answers:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="417.2051" x="170.3911" y="138.6138">'the user is done with this storage &#8212; now what?'  The answer lives on the PV as</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="412.0596" x="170.3911" y="151.2627">spec.persistentVolumeReclaimPolicy, and on a StorageClass as reclaimPolicy.</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="9" data-uid="ent0005" id="entity_r1"><rect fill="#DCFCE7" height="123.4419" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="535.3052" x="156.8911" y="216.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="379.9961" x="170.8911" y="242.8921">The PV still exists, in phase Released. The data is untouched.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="504.1953" x="170.8911" y="255.9648">But it is NOT available for another claim &#8212; 'the previous claimant's data remains on the volume'.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="170.8911" y="270.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="488.415" x="170.8911" y="283.5625">An administrator reclaims it by hand:  delete the PV (the storage asset still exists) &#8594; clean up</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="377.749" x="170.8911" y="296.2114">the data &#8594; delete the asset, or create a NEW PV pointing at it to reuse it.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="170.8911" y="310.7363">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.5483" x="170.8911" y="323.8091">The DEFAULT for a manually created PV.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286.6445" x="391.5518" y="323.8091">The safe choice for anything you cannot afford to lose.</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="13" data-uid="ent0007" id="entity_d1"><rect fill="#FEE2E2" height="108.4932" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="526.792" x="156.8911" y="388.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="497.0342" x="170.8911" y="414.8921">Both the PersistentVolume object AND the associated storage asset are deleted.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="366.0991" x="170.8911" y="427.9648">The disk, the cloud volume, the directory &#8212; gone, along with the data.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="170.8911" y="442.4897">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.1953" x="170.8911" y="455.5625">The DEFAULT for a StorageClass</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="321.5405" x="348.1426" y="455.5625">when reclaimPolicy is omitted, so it is what most dynamically</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="355.1743" x="170.8911" y="468.2114">provisioned PVs get. A StorageClass may only say Delete or Retain.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="477.5601" x="170.8911" y="480.8604">An existing PV's policy can be changed afterwards with kubectl patch pv or kubectl edit pv.</text></g><!--entity rc1--><g class="entity" data-entity="rc1" data-source-line="17" data-uid="ent0009" id="entity_rc1"><rect fill="#F1F5F9" height="68.2466" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="553.9224" x="156.3911" y="545.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="525.9224" x="170.3911" y="571.8921">A basic scrub &#8212; rm -rf /thevolume/* &#8212; then the PV is Available again for a new claim.</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="422.5117" x="170.3911" y="584.9648">Deprecated in favour of dynamic provisioning. Only nfs and hostPath ever supported it.</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="409.0088" x="170.3911" y="597.6138">Still in the enum, which is why the lecture lists three values. Expect it as a distractor.</text></g><!--entity ph1--><g class="entity" data-entity="ph1" data-source-line="21" data-uid="ent0011" id="entity_ph1"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="548.937" x="156.8911" y="662.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6797" x="170.8911" y="688.8921">Available  &#8594;  Bound  &#8594;  Released  &#8594;  (Failed)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="354.6426" x="170.8911" y="701.9648">Available &#8212; free, not yet bound to a claim       Bound &#8212; bound to a claim</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="520.937" x="170.8911" y="714.6138">Released &#8212; the claim was deleted, the storage not yet reclaimed     Failed &#8212; automated reclamation failed</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="459.7764" x="170.8911" y="727.2627">A Retain PV sits in Released until an admin acts. A Delete PV disappears from the list entirely.</text></g><g class="link" data-entity-1="t" data-entity-2="r" data-uid="lnk12" id="link_t_r"><polygon fill="#475569" points="130.3911,183.6872,134.3911,174.6872,130.3911,178.6872,126.3911,174.6872,130.3911,183.6872" style="stroke:#475569;stroke-width:1;"/><path d="M130.3911,175.9207 C130.3911,176.1021 130.3911,176.2837 130.3911,176.4656 C130.3911,176.8294 130.3911,177.1942 130.3911,177.5599 C130.3911,178.2912 130.3911,179.0262 130.3911,179.7646 C130.3911,180.5029 130.3911,181.2446 130.3911,181.9892 C130.3911,182.3616 130.3911,182.7346 130.3911,183.1084 C130.3911,183.2953 130.3911,183.4824 130.3911,183.6696 C130.3911,183.6755 130.3911,177.6813 130.3911,177.6872" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r" data-entity-2="d" data-uid="lnk13" id="link_r_d"><polygon fill="#475569" points="130.3911,355.6903,134.3911,346.6903,130.3911,350.6903,126.3911,346.6903,130.3911,355.6903" style="stroke:#475569;stroke-width:1;"/><path d="M130.3911,348.1327 C130.3911,348.346 130.3911,348.5595 130.3911,348.773 C130.3911,349.2001 130.3911,349.6276 130.3911,350.0555 C130.3911,351.7672 130.3911,353.4851 130.3911,355.2062 C130.3911,355.3137 130.3911,355.4213 130.3911,355.5289 C130.3911,355.5827 130.3911,349.6365 130.3911,349.6903" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="d" data-entity-2="rc" data-uid="lnk14" id="link_d_rc"><polygon fill="#475569" points="130.3911,512.6025,134.3911,503.6025,130.3911,507.6025,126.3911,503.6025,130.3911,512.6025" style="stroke:#475569;stroke-width:1;"/><path d="M130.3911,504.9322 C130.3911,505.6121 130.3911,506.2928 130.3911,506.9742 C130.3911,508.3369 130.3911,509.7019 130.3911,511.0669 C130.3911,511.4082 130.3911,511.7495 130.3911,512.0907 C130.3911,512.2613 130.3911,506.4319 130.3911,506.6025" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="rc" data-entity-2="ph" data-uid="lnk15" id="link_rc_ph"><polygon fill="#475569" points="130.3911,629.6856,134.3911,620.6856,130.3911,624.6856,126.3911,620.6856,130.3911,629.6856" style="stroke:#475569;stroke-width:1;"/><path d="M130.3911,621.7616 C130.3911,621.9028 130.3911,622.0442 130.3911,622.1858 C130.3911,622.7519 130.3911,623.3205 130.3911,623.8914 C130.3911,625.0332 130.3911,626.184 130.3911,627.3421 C130.3911,627.9211 130.3911,628.502 130.3911,629.0844 C130.3911,629.23 130.3911,629.3757 130.3911,629.5215 C130.3911,629.558 130.3911,629.5945 130.3911,629.6309 C130.3911,629.6491 130.3911,623.6674 130.3911,623.6856" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="754.8311" x="31.4756" y="771.8301">Manual PV: Retain by default. Dynamic PV: whatever the StorageClass says, which is Delete unless someone changed it.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="807.7822" x="5" y="787.9287">That asymmetry is the one the slide warns about &#8212; the convenient path is also the one that destroys data when a claim is deleted.</text></g><!--SRC=[ZLR1RkCs4BtxAwPxoMxXsDXhOBXmOc-xG3Ph96wA0hsCHTfYGv4gITdh5WLwwWSK_SBzaZwIaYCxETJmGQB8cU5xRnxvZJA5ReIaqMYS_y5QxST2yTPnvSTFXU7BKCfAZkgcqeEWWfPqBmlDggBQQbKSwEjV_zA-v40brxKqde8bh24VhEEjn3Tfqi3DxUpZ9rAUXDGoI34OE5a4Dbl4VBF2XE3KTYjTd6Ba3WzCIolUq6IoTRQffrDYHAS_1aIzbK_D6Y-wZKhrhg19Ad3wYvbu