<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="906px" preserveAspectRatio="none" style="width:964px;height:906px;background:#FFFFFF;" version="1.1" viewBox="0 0 964 906" width="964px" zoomAndPan="magnify"><title>pathType &#8212; the request path is cut at every "/" and compared PIECE by PIECE, never character by character</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="928.3887" x="14" y="30.8838">pathType &#8212; the request path is cut at every "/" and compared PIECE by PIECE, never character by character</text></g><!--cluster how--><g class="cluster" data-entity="how" data-source-line="4" data-uid="ent0002" id="cluster_how"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="612" x="122.6943" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.6099" x="357.8894" y="71.8921">How Prefix sees a path</text></g><!--cluster pre--><g class="cluster" data-entity="pre" data-source-line="8" data-uid="ent0004" id="cluster_pre"><rect fill="#F0FDF4" height="159" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="510" x="122.6943" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="104.7427" x="325.323" y="201.8921">Prefix   path: /api</text></g><!--cluster ex--><g class="cluster" data-entity="ex" data-source-line="12" data-uid="ent0006" id="cluster_ex"><rect fill="#FEF2F2" height="129" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="460" x="122.6943" y="350.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="103.3018" x="301.0435" y="368.8921">Exact   path: /api</text></g><!--cluster is--><g class="cluster" data-entity="is" data-source-line="16" data-uid="ent0008" id="cluster_is"><rect fill="#F8FAFC" height="169" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="712" x="122.6943" y="487.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="388.6797" x="284.3545" y="505.8921">ImplementationSpecific &#8212; and the spec versus real controllers</text></g><!--cluster prec--><g class="cluster" data-entity="prec" data-source-line="20" data-uid="ent0010" id="cluster_prec"><rect fill="#F8FAFC" height="190" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="734" x="122.6943" y="664.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="400.9497" x="289.2195" y="682.8921">When several paths match: longest wins, then Exact beats Prefix</text></g><!--entity h1--><g class="entity" data-entity="h1" data-source-line="5" data-uid="ent0003" id="entity_h1"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="561.0059" x="165.1943" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="243.4644" x="179.1943" y="112.8921">/api/v1/users    &#8594;    [ api ] [ v1 ] [ users ]</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="314.7837" x="179.1943" y="125.9648">A rule  path: /api/v1  pathType: Prefix   is the list  [ api ] [ v1 ]</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="533.0059" x="179.1943" y="138.6138">It matches when those elements are the FIRST elements of the request, each one WHOLE and EXACT.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="359.4175" x="179.1943" y="151.2627">A trailing slash on either side adds an empty element and is ignored.</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="9" data-uid="ent0005" id="entity_p1"><rect fill="#DCFCE7" height="117.6924" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="459.2598" x="165.1943" y="216.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="169.0063" x="179.1943" y="242.8921">/api               MATCH     [api]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="273.0317" x="179.1943" y="257.8408">/api/              MATCH     trailing slash ignored</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="431.2598" x="179.1943" y="272.7896">/api/v1/users      MATCH     [api] is the first element &#8212; subpaths match</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="387.1816" x="179.1943" y="287.7383">/apiary            NO        [apiary] is not [api] &#8212; NOT a string prefix</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="216.7471" x="179.1943" y="302.687">/API               NO        case-sensitive</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="267.2681" x="179.1943" y="317.6357">/v1/api            NO        must be at the START</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="13" data-uid="ent0007" id="entity_e1"><rect fill="#FEE2E2" height="87.7949" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="409.418" x="165.1943" y="383.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="283.1943" x="179.1943" y="409.8921">/api               MATCH     character for character</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="381.418" x="179.1943" y="424.8408">/api/              NO        the trailing slash makes it a different path</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="209.479" x="179.1943" y="439.7896">/api/v1            NO        no subpaths</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="216.7471" x="179.1943" y="454.7383">/API               NO        case-sensitive</text></g><!--entity i1--><g class="entity" data-entity="i1" data-source-line="17" data-uid="ent0009" id="entity_i1"><rect fill="#FFFFFF" height="128.0415" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="660.8359" x="165.1943" y="520.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="562.8467" x="179.1943" y="546.8921">Matching is up to the IngressClass. A controller may treat it as Prefix, as Exact, or as its own thing</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.8589" x="179.1943" y="561.8408">(regular expressions, for example).</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="175.5635" x="383.665" y="561.8408">F5 NGINX treats it like Prefix</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7578" x="559.2285" y="561.8408">, and lets the path be omitted (defaults to /).</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="529.4717" x="179.1943" y="574.9136">Portable manifests use Prefix or Exact. Every path MUST state a pathType &#8212; an omitted one fails validation.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="179.1943" y="589.4385">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="311.3145" x="179.1943" y="604.3872">Controllers do not all follow the element-wise rule.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.9097" x="494.1206" y="604.3872">F5 NGINX turns Prefix /api into an NGINX location /api,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="580.5249" x="179.1943" y="619.3359">which is a plain STRING prefix &#8212; so on the lecture's controller /apiary DOES reach the /api backend.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="544.1885" x="179.1943" y="632.4087">The exam answer is the Kubernetes definition above. In real clusters, test the edge case on your own controller.</text></g><!--entity pr1--><g class="entity" data-entity="pr1" data-source-line="21" data-uid="ent0011" id="entity_pr1"><rect fill="#FFFFFF" height="148.7397" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="683.0854" x="165.1943" y="697.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="565.6968" x="179.1943" y="723.8921">rules for one host:   /  (Prefix)  &#8594;  frontend     /api  (Prefix)  &#8594;  api     /api/admin  (Prefix)  &#8594;  admin</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.4917" x="262.2661" y="738.8408">/api  (Exact)   &#8594;  api-root</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="179.1943" y="753.7896">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="189.519" x="179.1943" y="766.8623">/              &#8594;  frontend     only / matches</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="320.3535" x="179.1943" y="779.5112">/cart          &#8594;  frontend     / is a prefix of everything &#8212; the catch-all</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="406.5811" x="179.1943" y="792.1602">/api           &#8594;  api-root     /api Exact and /api Prefix tie on length; EXACT wins the tie</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="237.832" x="179.1943" y="804.8091">/api/v1        &#8594;  api          /api is the longest match</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="280.6396" x="179.1943" y="817.458">/api/admin/x   &#8594;  admin        /api/admin is longer than /api</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="655.0854" x="179.1943" y="830.1069">Order in the YAML is irrelevant. Remove the / rule and /cart matches nothing &#8212; the controller's default backend answers (usually 404).</text></g><g class="link" data-entity-1="how" data-entity-2="pre" data-uid="lnk12" id="link_how_pre"><polygon fill="#475569" points="138.6943,183.6377,142.6943,174.6377,138.6943,178.6377,134.6943,174.6377,138.6943,183.6377" style="stroke:#475569;stroke-width:1;"/><path d="M138.6943,176.193 C138.6943,176.3723 138.6943,176.5519 138.6943,176.7317 C138.6943,177.4507 138.6943,178.1734 138.6943,178.8993 C138.6943,180.3512 138.6943,181.8162 138.6943,183.2917 C138.6943,183.3839 138.6943,183.4762 138.6943,183.5685 C138.6943,183.5916 138.6943,177.6146 138.6943,177.6377" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pre" data-entity-2="ex" data-uid="lnk13" id="link_pre_ex"><polygon fill="#475569" points="138.6943,350.6892,142.6943,341.6892,138.6943,345.6892,134.6943,341.6892,138.6943,350.6892" style="stroke:#475569;stroke-width:1;"/><path d="M138.6943,342.8588 C138.6943,343.0518 138.6943,343.2449 138.6943,343.4381 C138.6943,343.8245 138.6943,344.2112 138.6943,344.5981 C138.6943,345.372 138.6943,346.1469 138.6943,346.9225 C138.6943,347.6981 138.6943,348.4743 138.6943,349.251 C138.6943,349.6393 138.6943,350.0277 138.6943,350.4161 C138.6943,350.4646 138.6943,350.5132 138.6943,350.5618 C138.6943,350.586 138.6943,350.6103 138.6943,350.6346 C138.6943,350.6467 138.6943,350.6589 138.6943,350.671 C138.6943,350.6771 138.6943,344.6832 138.6943,344.6892" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ex" data-entity-2="is" data-uid="lnk14" id="link_ex_is"><polygon fill="#475569" points="138.6943,487.6658,142.6943,478.6658,138.6943,482.6658,134.6943,478.6658,138.6943,487.6658" style="stroke:#475569;stroke-width:1;"/><path d="M138.6943,479.8842 C138.6943,480.6555 138.6943,481.4307 138.6943,482.2096 C138.6943,483.7672 138.6943,485.3393 138.6943,486.9227 C138.6943,487.1207 138.6943,487.3188 138.6943,487.5171 C138.6943,487.5667 138.6943,481.6162 138.6943,481.6658" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="is" data-entity-2="prec" data-uid="lnk15" id="link_is_prec"><polygon fill="#475569" points="138.6943,664.6831,142.6943,655.6831,138.6943,659.6831,134.6943,655.6831,138.6943,664.6831" style="stroke:#475569;stroke-width:1;"/><path d="M138.6943,657.0856 C138.6943,658.0784 138.6943,659.0747 138.6943,660.0739 C138.6943,661.0731 138.6943,662.0753 138.6943,663.0799 C138.6943,663.5822 138.6943,664.0852 138.6943,664.5887 C138.6943,664.6202 138.6943,658.6516 138.6943,658.6831" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="805.3486" x="75.52" y="874.8301">The two traps: Prefix /api does NOT match /apiary (whole elements only), and Exact /api does NOT match /api/ (the slash counts).</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="879.7441" x="38.3223" y="890.9287">kubectl create ingress encodes it in the rule string: --rule="host/api*=svc:80" gives Prefix, --rule="host/api=svc:80" without the star gives Exact.</text></g><!--SRC=[bLRRZjis47ttLqpt9Rk5RMM152XSnu2xTHAZsGjsNIJ5RXveYRQ9bKYLfEnrYmPzwWSK_S9yIMU6aYNBtW8n35WMoRcSCtE6toWTfqKYeT-FmjSRaxeeKM9fHUQYnrYBdb_9JFRp8aixNlbKGYxyQhRD9Npvwr_0LR3ojq8wpmkW7CI51-51hgNTmabq0a8d49ii5rOcS3ETN4nWlWqFNT2q3-ALi2Bs-8Ghkp-TZfMn5tg9Ra_UcGtSMBbGJ-2aT23OuGaCXqjhYdmq0k5WXPl-w00qpaKYLz7wF2gSj0xmy-NlV-Zd7d01Fk7l-fn_mePF3therEzoS7u-6eCjq0Gx6a1f27O83AfuWD8cA5A5EBGi3oCoDsgOdNh8X8zNcCHc9JMUD4w2J15exJ4nAzdOc-djtQn-RHPDjBiWHRm2eoLyU7VzVi8WJpwEBsRzGuTZy5QeLEabk5GuEWPIeJKBJc41Y2H1j_Wko_ssyiWMCI-rr0Q9gymIu2AESKE9-7ddppsUTfZKgEr8UcjC4exbcEGHec3_SpcUNRpZftjSH6gOW-Vsj98i0oyFDIlWm735tq9P9B02W0hS5NFAmmN6WYs1TTtuN5rNJ_TXaSrfuqlRPERgUeO5wxoby79626sDRwQjX6jRiN2ovwHsogkrnCsOG0kWUdDMODXpIMr7QTpDnhSp1ht6kqtJv0bRx3XBFuhoa7pwAexg9bwOHaiVPQsEdG9kCPU9H-mDXIK8YLeif2KsAD0TbyTDQRFZwwlGfSpdkwJRI4spF1I4yChekrp6Qg5YffLQXE9t-19GnrpX42sHejnfRqsQugkMGc5fj32z