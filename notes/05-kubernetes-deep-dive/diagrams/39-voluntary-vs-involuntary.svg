<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="589px" preserveAspectRatio="none" style="width:1044px;height:589px;background:#FFFFFF;" version="1.1" viewBox="0 0 1044 589" width="1044px" zoomAndPan="magnify"><title>What a PodDisruptionBudget covers &#8212; voluntary disruptions, and only the ones that ask</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="761.0889" x="137.6636" y="30.8838">What a PodDisruptionBudget covers &#8212; voluntary disruptions, and only the ones that ask</text></g><!--cluster inv--><g class="cluster" data-entity="inv" data-source-line="4" data-uid="ent0002" id="cluster_inv"><rect fill="#FEF2F2" height="152" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="718" x="163.208" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="375.6099" x="334.4031" y="71.8921">INVOLUNTARY &#8212; unavoidable. A PDB cannot prevent these.</text></g><!--cluster vol--><g class="cluster" data-entity="vol" data-source-line="8" data-uid="ent0004" id="cluster_vol"><rect fill="#F8FAFC" height="147" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="733" x="163.208" y="213.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="418.2153" x="320.6003" y="231.8921">VOLUNTARY &#8212; initiated by someone. Split by WHO asks and HOW.</text></g><!--cluster ch--><g class="cluster" data-entity="ch" data-source-line="14" data-uid="ent0008" id="cluster_ch"><rect fill="#F0FDF4" height="169" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="698" x="163.208" y="368.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="336.0513" x="344.1824" y="386.8921">Choosing the number &#8212; the documentation's patterns</text></g><!--entity inv1--><g class="entity" data-entity="inv1" data-source-line="5" data-uid="ent0003" id="entity_inv1"><rect fill="#FEE2E2" height="110.793" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="666.5869" x="205.708" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="638.5869" x="219.708" y="112.8921">Hardware failure of the machine behind the node &#183; a VM deleted by mistake &#183; cloud or hypervisor failure</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="609.6543" x="219.708" y="127.8408">Kernel panic &#183; the node lost to a network partition &#183; eviction because the node ran out of resources</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="219.708" y="142.7896">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="535.439" x="219.708" y="155.8623">They still COUNT against the budget: a Pod lost to a crash leaves fewer allowed voluntary disruptions.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="474.3589" x="219.708" y="168.5112">Defences here are different: replicas, resource requests, and spreading with anti-affinity or</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="232.2729" x="219.708" y="181.1602">topology spread constraints (chapter 05-07).</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="9" data-uid="ent0005" id="entity_v1"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="317.0723" x="205.708" y="252.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="279.5063" x="219.708" y="278.8921">Through the Eviction API &#8212; PDB ENFORCED</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="260.4014" x="219.708" y="291.9648">kubectl drain for repair, upgrade or a node repave</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256.7222" x="219.708" y="304.6138">Cluster autoscaler draining a node to scale down</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="289.0723" x="219.708" y="317.2627">Managed node-pool upgrades and maintenance tooling</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.5938" x="219.708" y="329.9116">Anything that POSTs pods/&lt;name&gt;/eviction</text></g><!--entity v2--><g class="entity" data-entity="v2" data-source-line="10" data-uid="ent0006" id="entity_v2"><rect fill="#FEE2E2" height="106.1934" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="346.5444" x="540.708" y="246.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="318.5444" x="554.708" y="272.8921">Direct deletes and rollouts &#8212; PDB NOT ENFORCED</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="202.3184" x="554.708" y="285.9648">kubectl delete pod / delete deployment</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="120.4092" x="554.708" y="298.6138">drain --disable-eviction</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="290.9199" x="554.708" y="311.2627">A Deployment or StatefulSet rolling update &#8212; governed</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256.1367" x="554.708" y="323.9116">by maxUnavailable / maxSurge / partition instead</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="216.9385" x="554.708" y="336.5605">(those Pods do count against the budget)</text></g><!--entity ch1--><g class="entity" data-entity="ch1" data-source-line="15" data-uid="ent0009" id="entity_ch1"><rect fill="#DCFCE7" height="128.0415" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="648.4961" x="205.208" y="401.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="117.0254" x="219.208" y="427.8921">Stateless front end</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="439.8608" x="365.1279" y="427.8921">minAvailable: 90%      'don't reduce serving capacity by more than 10%'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.9727" x="219.208" y="442.8408">Quorum system</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="441.3716" x="321.7925" y="442.8408">(etcd, ZooKeeper)  maxUnavailable: 1  or  minAvailable: quorum (3 of 5)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9199" x="219.208" y="457.7896">Single-instance stateful</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="467.3525" x="372.3516" y="457.7896">no PDB and accept downtime, OR maxUnavailable: 0 and agree out-of-band</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.8145" x="219.208" y="472.7383">Restartable batch Job</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="289.6689" x="373.0815" y="472.7383">no PDB &#8212; the Job controller recreates the Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="219.208" y="487.687">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="514.7227" x="219.208" y="500.7598">maxUnavailable is recommended: it follows replica changes automatically. Percentages round UP.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="547.771" x="219.208" y="513.4087">maxUnavailable: 0 or minAvailable: 100% means ZERO voluntary evictions &#8212; every drain blocks forever.</text></g><g class="link" data-entity-1="inv" data-entity-2="vol" data-uid="lnk10" id="link_inv_vol"><polygon fill="#475569" points="179.208,213.6955,183.208,204.6955,179.208,208.6955,175.208,204.6955,179.208,213.6955" style="stroke:#475569;stroke-width:1;"/><path d="M179.208,205.8051 C179.208,206.0059 179.208,206.2069 179.208,206.4079 C179.208,208.0166 179.208,209.634 179.208,211.257 C179.208,212.0685 179.208,206.8815 179.208,207.6955" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="vol" data-entity-2="ch" data-uid="lnk11" id="link_vol_ch"><polygon fill="#475569" points="179.208,368.6648,183.208,359.6648,179.208,363.6648,175.208,359.6648,179.208,368.6648" style="stroke:#475569;stroke-width:1;"/><path d="M179.208,360.9869 C179.208,361.198 179.208,361.4093 179.208,361.6208 C179.208,363.3128 179.208,365.0176 179.208,366.7321 C179.208,367.1607 179.208,367.5899 179.208,368.0197 C179.208,368.2346 179.208,362.4496 179.208,362.6648" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="21"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1026.416" x="5" y="557.8301">A PDB is a promise between two roles: the application owner says how much disruption is tolerable, and cluster tooling that uses the Eviction API agrees to respect it.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="944.166" x="46.125" y="573.9287">It is not a replica count ("pdb != replicas"): replicas say how many Pods should exist, the budget says how many may be taken away on purpose at once.</text></g><!--SRC=[XLPjRXit4FslKqmD1B41Ix9Q14KDLO1ZkqsQnd9j9q7Jz0TtETebl4jkIAuKjMZGG_Gk_T-Zz2HzmvLasJ9Gmu2uNEvyl7dpXbyOcrUjPXeCXjr_TAuAGsrKuLKTXhUvLVrOSis3fgshNZInOdfNgaYABfq-Cy6tJJJEFczrmP5oDsSVwDy__wAvgreRbL-ItfmAXwIi9cUh9S4i5Xom47FXjjVpd4Tb2xZOUtdnTlhZcukRawkVaxNMghapMcKL3-Y4Bi-UKwwiTP4QptEsKUm57kpHU5nurpRFbPvCO9QCdTFlFQ8juo-KrmlbcMRAL2r-tIo5KwkyD9OfO_pej6KTuFddRwJxzZLfhZYofcn9jGbHtQPNUULQvEIfN3RivoPWkJBymRvYRxcYHbcJo-6DpSe5nEnWs79SE7-BCnxu0YKvntEJftN6kMe3tttebINNHedPSt2jppbyi1_iE9ZV-7WqcjoKlAGGJLNHwHGGaYgKiI4XH5cgqt5NlgqWSgz2IHMhEIeoumLxKbNb5iZsqK8EnaFnDzdoUyOpjWY6IWQa0gysindM5luyDvN95GYm3XgBZos7kE94G1sLDhQWXOabjgBfgzdCM1EN07VNNNIDgronN7q9wY57ZqnZeFsyL4r43aVF-aTV7wo35N9aMxmOzVwuHxhxb1F