<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="962px" preserveAspectRatio="none" style="width:1092px;height:962px;background:#FFFFFF;" version="1.1" viewBox="0 0 1092 962" width="1092px" zoomAndPan="magnify"><title>A Pod always has an identity &#8212; the only question is which one</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="537.0908" x="273.7524" y="30.8838">A Pod always has an identity &#8212; the only question is which one</text></g><!--cluster top--><g class="cluster" data-entity="top" data-source-line="4" data-uid="ent0002" id="cluster_top"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="438" x="227.7979" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.5127" x="398.0415" y="71.8921">You write a Pod</text></g><!--cluster sas--><g class="cluster" data-entity="sas" data-source-line="10" data-uid="ent0006" id="cluster_sas"><rect fill="#F8FAFC" height="99" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="466" x="227.7979" y="183.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.4644" x="352.0657" y="201.8921">Kubernetes assigns one either way</text></g><!--cluster mount--><g class="cluster" data-entity="mount" data-source-line="16" data-uid="ent0010" id="cluster_mount"><rect fill="#F8FAFC" height="149" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="514" x="227.7979" y="290.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="424.0107" x="272.7925" y="308.8921">The kubelet mounts a projected, auto-rotating token (v1.22 and later)</text></g><!--cluster id--><g class="cluster" data-entity="id" data-source-line="20" data-uid="ent0012" id="cluster_id"><rect fill="#F8FAFC" height="156" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="520" x="217.7979" y="447.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="496.2407" x="229.6775" y="465.8921">Authentication turns that token into the same three things a certificate produces</text></g><!--cluster dflt--><g class="cluster" data-entity="dflt" data-source-line="24" data-uid="ent0014" id="cluster_dflt"><rect fill="#FEF2F2" height="152" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="552" x="227.7979" y="611.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.04" x="416.7778" y="629.8921">DEFAULT &#8212; almost nothing</text></g><!--cluster cust--><g class="cluster" data-entity="cust" data-source-line="28" data-uid="ent0016" id="cluster_cust"><rect fill="#F0FDF4" height="139" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="662" x="227.7979" y="771.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="218.1182" x="449.7388" y="789.8921">CUSTOM &#8212; whatever you bind to it</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="5" data-uid="ent0003" id="entity_p1"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="173.939" x="269.7979" y="93.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.939" x="283.7979" y="119.3921">NO serviceAccountName</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="26.2915" x="283.7979" y="132.4648">spec:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="72.1445" x="289.9102" y="145.1138">containers: [...]</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="6" data-uid="ent0004" id="entity_p2"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="196.1313" x="461.7979" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.6499" x="475.7979" y="112.8921">WITH serviceAccountName</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="26.2915" x="475.7979" y="125.9648">spec:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="162.019" x="481.9102" y="138.6138">serviceAccountName: build-robot</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="72.1445" x="481.9102" y="151.2627">containers: [...]</text></g><!--entity sa1--><g class="entity" data-entity="sa1" data-source-line="11" data-uid="ent0007" id="entity_sa1"><rect fill="#DCFCE7" height="57.8975" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="201.7798" x="269.7979" y="216.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="173.7798" x="283.7979" y="242.8921">the 'default' ServiceAccount</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.9727" x="283.7979" y="257.8408">of THAT namespace</text></g><!--entity sa2--><g class="entity" data-entity="sa2" data-source-line="12" data-uid="ent0008" id="entity_sa2"><rect fill="#326CE5" height="57.8975" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="194.8862" x="490.2979" y="216.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8862" x="504.2979" y="242.8921">the named ServiceAccount</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.9727" x="504.2979" y="257.8408">of THAT namespace</text></g><!--entity m--><g class="entity" data-entity="m" data-source-line="17" data-uid="ent0011" id="entity_m"><rect fill="#FFFFFF" height="108.4932" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="463.3594" x="270.2979" y="323.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1797" x="284.2979" y="349.8921">/var/run/secrets/kubernetes.io/serviceaccount/</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="379.6826" x="284.2979" y="362.9648">token       &#8212; a signed JWT, short-lived, rotated by the kubelet before it expires</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="309.9551" x="284.2979" y="375.6138">ca.crt      &#8212; the cluster CA, so the Pod can verify the API server</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="233.562" x="284.2979" y="388.2627">namespace   &#8212; which namespace this Pod is in</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="284.2979" y="402.7876">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="435.3594" x="284.2979" y="415.8604">Opt out with automountServiceAccountToken: false on the Pod or on the ServiceAccount.</text></g><!--entity i--><g class="entity" data-entity="i" data-source-line="21" data-uid="ent0013" id="entity_i"><rect fill="#326CE5" height="115.3926" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="387.9868" x="310.7979" y="480.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="217.4897" x="324.7979" y="506.8921">username: system:serviceaccount:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.0654" x="542.2876" y="506.8921">NAMESPACE</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="4.3291" x="625.353" y="506.8921">:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.2764" x="629.6821" y="506.8921">NAME</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="210.2471" x="324.7979" y="521.8408">groups:   system:serviceaccounts</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="155.3589" x="360.916" y="536.7896">system:serviceaccounts:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.0654" x="516.2749" y="536.7896">NAMESPACE</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133.6499" x="360.916" y="551.7383">system:authenticated</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="324.7979" y="566.687">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="359.9868" x="324.7979" y="579.7598">A string and a set of strings. RBAC cannot tell it apart from a human.</text></g><!--entity db--><g class="entity" data-entity="db" data-source-line="25" data-uid="ent0015" id="entity_db"><rect fill="#FEE2E2" height="110.793" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="501.5859" x="269.7979" y="644.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="473.5859" x="283.7979" y="670.8921">The 'default' ServiceAccount gets NO permissions beyond the API discovery</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="383.5762" x="283.7979" y="685.8408">endpoints Kubernetes grants to every authenticated principal.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="283.7979" y="700.7896">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="388.7329" x="283.7979" y="713.8623">A Pod that says nothing can reach the API server, be told who it is, and do</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="300.1421" x="283.7979" y="726.5112">essentially nothing else. That is least privilege by default.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="305.0298" x="283.7979" y="739.1602">Delete the object and the control plane simply recreates it.</text></g><!--entity cb--><g class="entity" data-entity="cb" data-source-line="29" data-uid="ent0017" id="entity_cb"><rect fill="#DCFCE7" height="98.144" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="612.3716" x="269.7979" y="804.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="257.9053" x="283.7979" y="830.8921">kubectl create serviceaccount build-robot</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="584.3716" x="283.7979" y="845.8408">kubectl create rolebinding robot-reader --role=pod-reader --serviceaccount=default:build-robot</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="283.7979" y="860.7896">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="361.8882" x="283.7979" y="873.8623">Only now can the Pod create a Pod, read a Secret, list Deployments...</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="525.1318" x="283.7979" y="886.5112">Unlike User and Group, a ServiceAccount subject MUST already exist and MUST carry a namespace.</text></g><g class="link" data-entity-1="top" data-entity-2="sas" data-uid="lnk18" id="link_top_sas"><polygon fill="#475569" points="243.7979,183.6845,247.7979,174.6845,243.7979,178.6845,239.7979,174.6845,243.7979,183.6845" style="stroke:#475569;stroke-width:1;"/><path d="M243.7979,175.8789 C243.7979,176.017 243.7979,176.1552 243.7979,176.2934 C243.7979,177.3993 243.7979,178.5102 243.7979,179.6245 C243.7979,180.7388 243.7979,181.8565 243.7979,182.9759 C243.7979,183.1158 243.7979,183.2558 243.7979,183.3958 C243.7979,183.4657 243.7979,183.5357 243.7979,183.6057 C243.7979,183.6232 243.7979,183.6407 243.7979,183.6582 C243.7979,183.667 243.7979,177.6757 243.7979,177.6845" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="sas" data-entity-2="mount" data-uid="lnk19" id="link_sas_mount"><polygon fill="#475569" points="243.7979,290.6764,247.7979,281.6764,243.7979,285.6764,239.7979,281.6764,243.7979,290.6764" style="stroke:#475569;stroke-width:1;"/><path d="M243.7979,282.8678 C243.7979,283.0154 243.7979,283.1632 243.7979,283.3113 C243.7979,283.9035 243.7979,284.4996 243.7979,285.0995 C243.7979,286.2991 243.7979,287.5133 243.7979,288.74 C243.7979,289.3534 243.7979,289.9699 243.7979,290.5892 C243.7979,290.6086 243.7979,290.6279 243.7979,290.6473 C243.7979,290.657 243.7979,284.6667 243.7979,284.6764" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="mount" data-entity-2="id" data-uid="lnk20" id="link_mount_id"><polygon fill="#475569" points="243.7979,447.6936,247.7979,438.6936,243.7979,442.6936,239.7979,438.6936,243.7979,447.6936" style="stroke:#475569;stroke-width:1;"/><path d="M243.7979,439.7516 C243.7979,439.9553 243.7979,440.1592 243.7979,440.3633 C243.7979,441.1797 243.7979,441.9987 243.7979,442.8199 C243.7979,443.6411 243.7979,444.4646 243.7979,445.29 C243.7979,445.7026 243.7979,446.1158 243.7979,446.5294 C243.7979,446.7361 243.7979,446.943 243.7979,447.15 C243.7979,447.2535 243.7979,447.357 243.7979,447.4606 C243.7979,447.5124 243.7979,447.5641 243.7979,447.6159 C243.7979,447.6418 243.7979,441.6677 243.7979,441.6936" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="id" data-entity-2="dflt" data-uid="lnk21" id="link_id_dflt"><polygon fill="#475569" points="243.7979,611.6748,247.7979,602.6748,243.7979,606.6748,239.7979,602.6748,243.7979,611.6748" style="stroke:#475569;stroke-width:1;"/><path d="M243.7979,604.2407 C243.7979,605.9079 243.7979,607.5841 243.7979,609.2662 C243.7979,609.6867 243.7979,610.1076 243.7979,610.5289 C243.7979,610.7395 243.7979,610.9502 243.7979,611.1609 C243.7979,611.2663 243.7979,611.3717 243.7979,611.4772 C243.7979,611.5299 243.7979,611.5826 243.7979,611.6353 C243.7979,611.6485 243.7979,605.6617 243.7979,605.6748" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="38"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1074.5957" x="5" y="930.8301">The one KCNA fact: if a Pod does not name a ServiceAccount, it is assigned the 'default' ServiceAccount of its own namespace &#8212; and that account is deliberately powerless.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="962.6436" x="60.9761" y="946.9287">Everything else is the RBAC of chapters 05-03 and 05-04. ServiceAccount is simply the third subject kind, and the only one that is a real Kubernetes object.</text></g><!--SRC=[fLPVRnj547_tfnZwKf3iSrFWnN8jkMbeIsbQ4KSLQlgmlXlRIzQxn-vUZ45KV0W-8P-4t-oTdRjpGGYYHB5tRsTsVdzcxZDjSrCLJ5ashd-ZSoQC2wtMNct3-3QtQXGtlEMihBPc47KqJ7DwwmfIPgVsWJOgaBAa2xROtTEVl_z1E47EcZtzL768sc4xq6wZymsMUJ3md4TbrmZru0TNqSxhoAGawWEQJjVULULiHWWSNKc_3eXQ1oxVK61_ftEUvxchRBnKMxwnqw1_uSdPsIoKd4-cO_awQoqJvSv6fItxCA7tMPPzQ1wIbAN1JfsoFElcU_ToyU8_PZmzDQ5bfKqnycxful-vv6DSiZoZqVkDBe3y1w_NcpYQoSPl7NnVLKlsbYE3fH3qsWQXW5Y38qzWi8Tum5yFSM7pOS4hLPduaAuwHTrOjwB5Y_c2BCeBfSev1NIkECGxEuqcpnR_BfBASmZh44lAHiJJkcMhM_W2UMvHlE58Mqa00AZqxaSymiMGL1KTU8WgQhk6q6xPqkTtPzdZnv1pGKP5zb_qm4bn-l2CxvGV-ygE0-UU8qnpX3pJRjo8GDLLZbjirpdh7t6D8k47m7pxRZ6ai74-Zeo-aykcUs9dkK_UEjIrv9NpJ3eI_rngp-5KKhdASX_layXnU3wWEZgV8urBIsBe73Q-OwzNTPBvsvT9mUnFenufQgBMthvVZHiONcBYdxR7ywq8Ryf8hegqWn0J5mdRhYGM0j24Lie4wIV7Ypf_-DPzFlkqMROzPSmh74MpobLgJR7oC4NSgDYeGDjOWn9G3pvuJWNPjIWePn_rIiwogAceSWuzbUYYBv4AEDfa_x07yjj9LnIJwN9sENzzSVLsVdun7IzdXmNvV6DJQFG3-lJfS7CGqTy-SPBW4qVKFIfSTAYQKuXUJ2A-W4WXF5YrNWiPVVzqVYxQiGu0iZ4YHrKgY6xbtHO7DjLMsJOtRK_h7ZdFBhwPNt-tg0rXjYv4Gc11_uZoKzNqbc9bJjou-8TcHMlOap10IlPRZMxeGFoIzmvr7HHVw90xQ7v_OzaMfTFIE5fD57DHLg0GbgUe0niKWOcgIsMo7e8YsoIn83EpgIWvpeEbJSzmGzmAAKm1Opd1KuTXGhzmfrxa4EG2oc3U7