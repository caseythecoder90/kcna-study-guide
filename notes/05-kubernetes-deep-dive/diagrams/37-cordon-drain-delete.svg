<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="614px" preserveAspectRatio="none" style="width:1087px;height:614px;background:#FFFFFF;" version="1.1" viewBox="0 0 1087 614" width="1087px" zoomAndPan="magnify"><title>Three ways to get Pods off a node &#8212; and only one of them asks permission</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="647.1211" x="216.2832" y="30.8838">Three ways to get Pods off a node &#8212; and only one of them asks permission</text></g><!--cluster c--><g class="cluster" data-entity="c" data-source-line="4" data-uid="ent0002" id="cluster_c"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="660" x="161.3438" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="325.0571" x="328.8152" y="71.8921">kubectl cordon worker-1 &#8212; mark only, move nothing</text></g><!--cluster d--><g class="cluster" data-entity="d" data-source-line="8" data-uid="ent0004" id="cluster_d"><rect fill="#F0FDF4" height="192" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="728" x="161.3438" y="218.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="412.458" x="319.1147" y="236.8921">kubectl drain worker-1 &#8212; cordon, then EVICT everything, then wait</text></g><!--cluster x--><g class="cluster" data-entity="x" data-source-line="12" data-uid="ent0006" id="cluster_x"><rect fill="#FEF2F2" height="109" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="780" x="161.3438" y="453.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="340.9136" x="380.887" y="471.8921">kubectl delete pod &#8212; straight to DELETE, no questions</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="5" data-uid="ent0003" id="entity_c1"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="610.1299" x="203.3438" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="187.8335" x="217.3438" y="112.8921">Sets spec.unschedulable: true</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.6377" x="408.7891" y="112.8921">on the Node. STATUS becomes  Ready,SchedulingDisabled.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="582.1299" x="217.3438" y="125.9648">The scheduler stops placing NEW Pods there (the node.kubernetes.io/unschedulable:NoSchedule taint, chapter 05-06).</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="194.3638" x="217.3438" y="138.6138">Pods already running are untouched.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="362.5703" x="414.7637" y="138.6138">Nothing is evicted, nothing restarts. Undo with  kubectl uncordon worker-1.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="496.5522" x="217.3438" y="151.2627">The lecture: cordon, then delete Pods by hand, and watch the replacements avoid the cordoned node.</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="9" data-uid="ent0005" id="entity_d1"><rect fill="#DCFCE7" height="151.0396" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="677.4033" x="203.8438" y="251.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8418" x="217.8438" y="277.8921">1.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="366.9263" x="232.2974" y="277.8921">Cordons the node (so evicted Pods cannot land back on it).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8418" x="217.8438" y="292.8408">2.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="228.6855" y="292.8408">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.3018" x="232.2974" y="292.8408">Evicts</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="137.96" x="274.2109" y="292.8408">every Pod through the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75.8481" x="415.7827" y="292.8408">Eviction API</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="249.9199" x="495.2427" y="292.8408">&#8212; which checks PodDisruptionBudgets.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8418" x="217.8438" y="307.7896">3.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="634.9497" x="232.2974" y="307.7896">Waits for graceful termination, and RETRIES refused evictions every 5 seconds until done or --timeout.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="217.8438" y="322.7383">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="231.0107" x="217.8438" y="335.811">Refuses to start without a flag when it finds:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="602.0835" x="223.9561" y="348.46">DaemonSet Pods      &#8594; --ignore-daemonsets    (they are skipped, never deleted: the controller would recreate them)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="403.4175" x="223.9561" y="361.1089">emptyDir data       &#8594; --delete-emptydir-data (that data is lost &#8212; chapter 05-08)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="504.2705" x="223.9561" y="373.7578">unmanaged Pods      &#8594; --force                (no controller will recreate them &#8212; they are simply gone)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="500.5967" x="217.8438" y="386.4067">Mirror (static) Pods are never touched. When maintenance is done:  kubectl uncordon worker-1.</text></g><!--entity x1--><g class="entity" data-entity="x1" data-source-line="13" data-uid="ent0007" id="entity_x1"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="730.1333" x="203.3438" y="486.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="259.3335" x="217.3438" y="512.8921">Bypasses PodDisruptionBudgets entirely.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="439.188" x="480.2891" y="512.8921">So do  kubectl delete deployment  and  kubectl drain --disable-eviction.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="585.7017" x="217.3438" y="525.9648">'Not all voluntary disruptions are constrained by Pod Disruption Budgets. For example, deleting deployments or</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="575.2979" x="217.3438" y="538.6138">pods bypasses Pod Disruption Budgets.'  A PDB is only consulted by callers that go through the Eviction API.</text></g><g class="link" data-entity-1="c" data-entity-2="d" data-uid="lnk8" id="link_c_d"><polygon fill="#475569" points="177.3438,218.6617,181.3438,209.6617,177.3438,213.6617,173.3438,209.6617,177.3438,218.6617" style="stroke:#475569;stroke-width:1;"/><path d="M177.3438,175.9689 C177.3438,176.2084 177.3438,176.4484 177.3438,176.6889 C177.3438,184.3868 177.3438,192.6412 177.3438,201.1731 C177.3438,205.4391 177.3438,209.7745 177.3438,214.1444 C177.3438,215.2369 177.3438,216.3315 177.3438,217.4278 C177.3438,217.7018 177.3438,217.976 177.3438,218.2502 C177.3438,218.3874 177.3438,212.5245 177.3438,212.6617" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.4004" x="183.3438" y="202.9541">drain = cordon + evict</text></g><g class="link" data-entity-1="d" data-entity-2="x" data-uid="lnk9" id="link_d_x"><polygon fill="#475569" points="177.3438,453.6143,181.3438,444.6143,177.3438,448.6143,173.3438,444.6143,177.3438,453.6143" style="stroke:#475569;stroke-width:1;"/><path d="M177.3438,411.2612 C177.3438,415.4579 177.3438,419.6877 177.3438,423.9176 C177.3438,432.3773 177.3438,440.8373 177.3438,449.0335 C177.3438,450.0581 177.3438,451.0785 177.3438,452.0942 C177.3438,452.6021 177.3438,447.1088 177.3438,447.6143" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.7422" x="183.3438" y="437.9541">what a PDB cannot stop</text></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1069.6875" x="5" y="582.8301">cordon answers "no new Pods here"; drain answers "empty this node, politely". The politeness is the Eviction API &#8212; and that is the only door a PodDisruptionBudget guards.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="821.7617" x="128.9629" y="598.9287">Node repaves, cluster upgrades and autoscaler scale-downs are drains under the hood, which is why a PDB protects you from them.</text></g><!--SRC=[ZLRRRcCr57tlLspwCgt8PGeQX4g8D9q6L6cegYP3NtXnZfqJApxsmPUc0J7YYGz0VE5y2MlR9sdI2H9HrJR9zhwilTRo-KBRoYIfQ30Obf_ed0b3gKNjHHE6gygAVbogHWtQr9YJgADHD5jwfMWjDe6Yerf5kdCoa5iiI91roFVfptz8M4dEcWr-ANn7d8P4M0LgbMzq2DhPanElgYXiZQodgpJ76qELyz9PMZk_Khv_aPCrmgzojXurxb6XIbngMv_IQ5Hxbzhn6AcfejzFYFPIZkRZgOg1GgkgGRAXMYgPZ9WRTKdH9pKQpiT8oxtHBHeVq7JsTlPXIkZ4DIeGtIiXDxrfEOYArphmSJdunOw2_arTNboCPpZTfLQUGdGjPZIYGZZTJXuAEYZX5Prn9OPemDDwgw8A0-s6XxtTkgwWeYYqZJsgbgADIFxwJV_rD-U3qP1hZ_TwmAIvZ32UEoQVhENw0aMJZIvnma6UzxPWHpgGUjHLLBAtnHFOXIXy30FwOAMZjOvBekrYadsncYDzC1O6qSa3uXBUuzajIMKmRG5Zlg4b-D7B95cBM2tp2hnYsC0sYvs9HwTb_hYaKR80rzNarIDQssxr5oT_76MJz8Wv9DD1MvEVRzxD08Jocmn1z_5QwBXZru_EoL967c7OHO7rNSwQ5rr4S1RS5k0oTIKiS2R3Gyz5nOGc7S-PIlFnLoKB_flmcP3VvRRuCBAYaRh0j8s1WEZjtKsEvBdMImqWiUWA8iCXSDMdbiEkaeHCGwdqTQdqW0a3BPmdQBrIYsGeiZ2ju1DbDVUJsVtDP8g15obW3DML3LrdRoX0A1QpWMCQO6UjU_hO_zYFkb4kHTJSeyTzJfHz8nCjCmnHC8w54JL6K8m9BJIINdvEBw9heHfdfrl