<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1021px" preserveAspectRatio="none" style="width:1376px;height:1021px;background:#FFFFFF;" version="1.1" viewBox="0 0 1376 1021" width="1376px" zoomAndPan="magnify"><title>Every request to Kubernetes, and the three gates it must pass</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="530.1563" x="419.1338" y="30.8838">Every request to Kubernetes, and the three gates it must pass</text></g><!--cluster authn--><g class="cluster" data-entity="authn" data-source-line="8" data-uid="ent0004" id="cluster_authn"><rect fill="#F8FAFC" height="177" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="498" x="537.7119" y="229.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238.3418" x="667.541" y="247.8921">1 &#183; AUTHENTICATION &#8212; who are you?</text></g><!--cluster authz--><g class="cluster" data-entity="authz" data-source-line="12" data-uid="ent0006" id="cluster_authz"><rect fill="#F8FAFC" height="177" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="518" x="537.7119" y="414.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="253.5063" x="669.9587" y="432.8921">2 &#183; AUTHORIZATION &#8212; may you do this?</text></g><!--cluster adm--><g class="cluster" data-entity="adm" data-source-line="16" data-uid="ent0008" id="cluster_adm"><rect fill="#FEF2F2" height="190" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="492" x="537.7119" y="599.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="444.9263" x="561.2488" y="617.8921">3 &#183; ADMISSION CONTROL &#8212; should this be allowed, and is it complete?</text></g><!--entity clients--><g class="entity" data-entity="clients" data-source-line="4" data-uid="ent0002" id="entity_clients"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="379.5542" x="363.7119" y="61.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6924" x="377.7119" y="87.8921">Everything that touches the cluster arrives here</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="295.8452" x="377.7119" y="100.9648">kubectl &#183; Helm &#183; client libraries &#183; Prometheus &#183; metrics-server</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="351.5542" x="377.7119" y="113.6138">every controller in the controller-manager &#183; the scheduler &#183; every kubelet</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="300.2065" x="377.7119" y="126.2627">HTTPS to the API server on :6443 &#8212; there is no other door in</text></g><!--entity tls--><g class="entity" data-entity="tls" data-source-line="6" data-uid="ent0003" id="entity_tls"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="134.2217" x="486.7119" y="178.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.2217" x="500.7119" y="204.8921">TLS is established</text></g><!--entity store--><g class="entity" data-entity="store" data-source-line="20" data-uid="ent0010" id="entity_store"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="401.479" x="353.2119" y="817.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.9727" x="367.2119" y="843.8921">4 &#183; Validation, then the object store</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="358.311" x="367.2119" y="856.9648">the API object's own validation routines run, then it is written to etcd</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="373.479" x="367.2119" y="869.6138">the API server is the ONLY component that talks to etcd (chapter 04-01)</text></g><!--entity resp--><g class="entity" data-entity="resp" data-source-line="22" data-uid="ent0011" id="entity_resp"><rect fill="#DCFCE7" height="55.5977" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="468.145" x="319.7119" y="921.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="195.0508" x="333.7119" y="947.8921">Response returned to the caller</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="440.145" x="333.7119" y="960.9648">and every watcher &#8212; the scheduler, the controllers, the kubelets &#8212; sees the change</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="9" data-uid="ent0005" id="entity_a1"><rect fill="#326CE5" height="136.0908" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="447.9497" x="579.7119" y="262.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="350.3335" x="593.7119" y="288.8921">Modules are tried IN SEQUENCE UNTIL ONE SUCCEEDS</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="419.9497" x="593.7119" y="301.9648">client certificates &#183; bearer tokens &#183; bootstrap tokens &#183; JWTs for ServiceAccounts</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.5938" x="593.7119" y="314.6138">output: a username, and sometimes groups</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="593.7119" y="329.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="400.4043" x="593.7119" y="342.2114">Kubernetes has NO User object &#8212; it never stores users. Identity comes from</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="213.9844" x="593.7119" y="354.8604">a certificate or a token issued elsewhere.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="593.7119" y="369.3853">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="172.3477" x="593.7119" y="382.458">FAILS &#8594; HTTP 401 Unauthorized</text></g><!--entity a2--><g class="entity" data-entity="a2" data-source-line="13" data-uid="ent0007" id="entity_a2"><rect fill="#326CE5" height="136.0908" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="467.4468" x="580.2119" y="447.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="365.4346" x="594.2119" y="473.8921">Set by --authorization-mode: an ORDERED LIST of plug-ins</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="321.4707" x="594.2119" y="486.9648">Node &#183; RBAC &#183; ABAC &#183; Webhook &#183; AlwaysAllow &#183; AlwaysDeny</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="439.4468" x="594.2119" y="499.6138">DEFAULTS TO AlwaysAllow if not set &#8212; a cluster with no flag authorizes everything</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="594.2119" y="514.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="330.1235" x="594.2119" y="527.2114">Asks: this username, this verb, this resource, this namespace?</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="257.9146" x="594.2119" y="539.8604">IF ANY MODULE ALLOWS, the request proceeds.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="594.2119" y="554.3853">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="222.4653" x="594.2119" y="567.458">ALL modules deny &#8594; HTTP 403 Forbidden</text></g><!--entity a3--><g class="entity" data-entity="a3" data-source-line="17" data-uid="ent0009" id="entity_a3"><rect fill="#FEE2E2" height="148.7397" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="440.5698" x="580.2119" y="632.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="297.6035" x="594.2119" y="658.8921">Called IN ORDER &#8212; and the logic INVERTS here</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="358.8052" x="594.2119" y="671.9648">IF ANY CONTROLLER REJECTS, the request is immediately rejected</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="369.7676" x="594.2119" y="684.6138">(authentication and authorization needed only ONE module to say yes)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="594.2119" y="699.1387">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="412.5698" x="594.2119" y="712.2114">MUTATING controllers run first and can CHANGE the object &#8212; inject a sidecar,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="290.3452" x="594.2119" y="724.8604">apply LimitRange defaults, add a ServiceAccount token</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="407.0913" x="594.2119" y="737.5093">VALIDATING controllers then accept or reject &#8212; ResourceQuota, PodSecurity</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="594.2119" y="752.0342">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="345.3613" x="594.2119" y="765.1069">Acts only on create, modify, delete and connect. NEVER on reads.</text></g><g class="link" data-entity-1="clients" data-entity-2="tls" data-uid="lnk12" id="link_clients_tls"><polygon fill="#475569" points="553.7119,178.5909,557.7119,169.5909,553.7119,173.5909,549.7119,169.5909,553.7119,178.5909" style="stroke:#475569;stroke-width:1;"/><path d="M553.7119,142.7994 C553.7119,155.0918 553.7119,162.1428 553.7119,172.5909" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="tls" data-entity-2="authn" data-uid="lnk13" id="link_tls_authn"><polygon fill="#475569" points="553.7119,229.3592,557.7119,220.3592,553.7119,224.3592,549.7119,220.3592,553.7119,229.3592" style="stroke:#475569;stroke-width:1;"/><path d="M553.7119,221.844 C553.7119,223.5644 553.7119,225.3638 553.7119,227.2308 C553.7119,227.6976 553.7119,228.1686 553.7119,228.6436 C553.7119,228.8812 553.7119,223.1197 553.7119,223.3592" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="authn" data-entity-2="authz" data-uid="lnk14" id="link_authn_authz"><polygon fill="#475569" points="553.7119,414.6708,557.7119,405.6708,553.7119,409.6708,549.7119,405.6708,553.7119,414.6708" style="stroke:#475569;stroke-width:1;"/><path d="M553.7119,406.9003 C553.7119,407.3937 553.7119,407.8878 553.7119,408.3825 C553.7119,409.3719 553.7119,410.3637 553.7119,411.3574 C553.7119,412.3511 553.7119,413.3466 553.7119,414.3436 C553.7119,414.4059 553.7119,414.4682 553.7119,414.5306 C553.7119,414.5617 553.7119,414.5929 553.7119,414.624 C553.7119,414.6396 553.7119,408.6552 553.7119,408.6708" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="authz" data-entity-2="adm" data-uid="lnk15" id="link_authz_adm"><polygon fill="#475569" points="553.7119,599.6728,557.7119,590.6728,553.7119,594.6728,549.7119,590.6728,553.7119,599.6728" style="stroke:#475569;stroke-width:1;"/><path d="M553.7119,591.9227 C553.7119,592.1793 553.7119,592.4361 553.7119,592.6931 C553.7119,594.7491 553.7119,596.8173 553.7119,598.8937 C553.7119,599.1533 553.7119,593.413 553.7119,593.6728" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="adm" data-entity-2="store" data-uid="lnk16" id="link_adm_store"><polygon fill="#475569" points="553.7119,817.412,557.7119,808.412,553.7119,812.412,549.7119,808.412,553.7119,817.412" style="stroke:#475569;stroke-width:1;"/><path d="M553.7119,790.0146 C553.7119,790.5816 553.7119,791.1476 553.7119,791.7126 C553.7119,800.7526 553.7119,803.5211 553.7119,811.412" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="store" data-entity-2="resp" data-uid="lnk17" id="link_store_resp"><polygon fill="#475569" points="553.7119,921.6454,557.7119,912.6454,553.7119,916.6454,549.7119,912.6454,553.7119,921.6454" style="stroke:#475569;stroke-width:1;"/><path d="M553.7119,885.736 C553.7119,897.4512 553.7119,904.4876 553.7119,915.6454" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="31"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1358.4238" x="5" y="989.8301">The study tips ask for &#8220;the main three stages&#8221;: AUTHENTICATION, AUTHORIZATION, ADMISSION CONTROL. The asymmetry between them is the detail worth carrying &#8212; the first two pass if any one module says yes,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="834.2236" x="267.1001" y="1005.9287">while admission fails if any one module says no. A read request stops after stage 2, because admission controllers never run on reads.</text></g><!--SRC=[TLRDRXit4BxhAQQvD04aEKwC7Wn3WIAlOwMovEWdGOfUAEv8OhrBRabk1ALea5CVeEYnVOxU-oX-aiwGAtajAO1bQRday9jllldvJccPbIb2ktqI_xmncJj9bLXQaRkJEwb5owymntPHvbd3AvyX99_GRi3YhoKw3zx0Z-KShKQFhWb2fq0dw6CHOIbe4PI7lAIjXN2kqR0elT1BClGaMF8hfPUqNx2jKgxe01iWPCwZ1M6j-aHhAxJuixvmwZEUdvvsxkXEwJFuxr-unYpdRvafr1uoDRV2AZf2QxVMv4Zcol14FwsIhkNGqiqN9soiKpEAmJDfjBSco-XofIEMtKeh5reiwGrPupUEyAPb5XVYSKQMeJ-qVZsTtawOBpxOlUr3X056m_aFPsSluVxhN_pE8YW7se3X1qYDOI2LlITmSP6N7jDE1uIhV7xCwdGmOGCK737Fb2E0VAZ8XDBnaCyU7pXbyDtPz3ePJlkzxhG_6WOiwvKX-X4sfdp59fRMb4Kq8Kg_ql1R0w1cvyOm5IwS8Q8nXVuG9i