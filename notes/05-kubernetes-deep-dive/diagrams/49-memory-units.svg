<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="844px" preserveAspectRatio="none" style="width:1024px;height:844px;background:#FFFFFF;" version="1.1" viewBox="0 0 1024 844" width="1024px" zoomAndPan="magnify"><title>Memory is counted in BYTES &#8212; and there are two ladders of suffixes, 1000 apart from 1024</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="780.2314" x="118.0879" y="30.8838">Memory is counted in BYTES &#8212; and there are two ladders of suffixes, 1000 apart from 1024</text></g><!--cluster dec--><g class="cluster" data-entity="dec" data-source-line="4" data-uid="ent0002" id="cluster_dec"><rect fill="#F8FAFC" height="144" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="437" x="99.2036" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="413.1943" x="111.1064" y="71.8921">DECIMAL (SI) &#8212; powers of 1000 &#183; how disks and networks are sold</text></g><!--cluster bin--><g class="cluster" data-entity="bin" data-source-line="8" data-uid="ent0004" id="cluster_bin"><rect fill="#F0FDF4" height="171" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="593" x="93.2036" y="205.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="569.2261" x="105.0906" y="223.8921">BINARY (IEC) &#8212; powers of 1024 &#183; how RAM actually comes &#183; the usual choice in Kubernetes</text></g><!--cluster diff--><g class="cluster" data-entity="diff" data-source-line="12" data-uid="ent0006" id="cluster_diff"><rect fill="#F8FAFC" height="154" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="566" x="114.2036" y="384.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="380.6499" x="206.8787" y="402.8921">WHY THE DIFFERENCE MATTERS &#8212; it grows with every step</text></g><!--cluster trap--><g class="cluster" data-entity="trap" data-source-line="16" data-uid="ent0008" id="cluster_trap"><rect fill="#FEF2F2" height="109" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="704" x="114.2036" y="546.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="214.5317" x="358.9377" y="564.8921">THE TRAP &#8212; the case of the suffix</text></g><!--cluster enf--><g class="cluster" data-entity="enf" data-source-line="20" data-uid="ent0010" id="cluster_enf"><rect fill="#F8FAFC" height="129" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="832" x="114.2036" y="663.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="304.1226" x="378.1423" y="681.8921">ENFORCEMENT &#8212; memory is NOT compressible</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="5" data-uid="ent0003" id="entity_d1"><rect fill="#FFFFFF" height="102.7437" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="327.8696" x="185.2036" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.1416" x="199.2036" y="112.8921">k   kilobyte    1,000 bytes                       = 10^3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.937" x="199.2036" y="127.8408">M   megabyte    1,000,000                          = 10^6</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1333" x="199.2036" y="142.7896">G   gigabyte    1,000,000,000                      = 10^9</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.8696" x="199.2036" y="157.7383">T   terabyte    1,000,000,000,000                  = 10^12</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.8589" x="199.2036" y="172.687">P   petabyte    10^15          E   exabyte   10^18</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="9" data-uid="ent0005" id="entity_b1"><rect fill="#DCFCE7" height="130.3413" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="409.5088" x="222.2036" y="238.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="277.4561" x="236.2036" y="264.8921">Ki  kibibyte    1,024 bytes                       = 2^10</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="307.0933" x="236.2036" y="279.8408">Mi  mebibyte    1,048,576  (1024 Ki)               = 2^20</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="311.4351" x="236.2036" y="294.7896">Gi  gibibyte    1,073,741,824  (1024 Mi)           = 2^30</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="319.4077" x="236.2036" y="309.7383">Ti  tebibyte    1,099,511,627,776  (1024 Gi)       = 2^40</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="265.1733" x="236.2036" y="324.687">Pi  pebibyte    2^50           Ei  exbibyte  2^60</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="236.2036" y="339.6357">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="381.5088" x="236.2036" y="352.7085">The 'i' means binary: kibi = KIlo BInary. Each step up is x1024, not x1000.</text></g><!--entity df1--><g class="entity" data-entity="df1" data-source-line="13" data-uid="ent0007" id="entity_df1"><rect fill="#FFFFFF" height="113.0928" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="515.8457" x="156.2036" y="417.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.0278" x="170.2036" y="443.8921">1Ki  vs 1k   &#8594;  1,024 vs 1,000                     2.4% larger</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.2241" x="170.2036" y="458.8408">1Mi  vs 1M   &#8594;  1,048,576 vs 1,000,000             4.9% larger</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.4985" x="170.2036" y="473.7896">1Gi  vs 1G   &#8594;  1,073,741,824 vs 1,000,000,000     7.4% larger</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.2471" x="170.2036" y="488.7383">1Ti  vs 1T   &#8594;                                     10.0% larger</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="481.2285" x="170.2036" y="501.811">Roughly the same amount, five ways:   128974848  &#183;  129e6  &#183;  129M  &#183;  128974848000m  &#183;  123Mi</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="487.8457" x="170.2036" y="514.46">A '500GB' disk shows up as about 465Gi &#8212; nothing is missing, the two ladders just count differently.</text></g><!--entity t1--><g class="entity" data-entity="t1" data-source-line="17" data-uid="ent0009" id="entity_t1"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="653.958" x="156.2036" y="579.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8291" x="170.2036" y="605.8921">M</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="82.7354" x="184.6445" y="605.8921">= megabytes.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.5591" x="274.6035" y="605.8921">m</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="394.8306" x="289.7744" y="605.8921">= MILLIbytes (1/1000 of a byte).   memory: 400m  is a request for</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6436" x="688.2168" y="605.8921">0.4 bytes</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="743.8604" y="605.8921">.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="625.958" x="170.2036" y="618.9648">The API accepts it &#8212; m is a valid quantity suffix because the same format is shared with CPU &#8212; and the Pod is useless.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="569.0942" x="170.2036" y="631.6138">For memory, write Mi or Gi. For CPU, m means millicores and is exactly right. Same letter, opposite meaning.</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="21" data-uid="ent0011" id="entity_e1"><rect fill="#326CE5" height="87.7949" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="782.4761" x="156.2036" y="696.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2891" x="170.2036" y="722.8921">Request</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="678.2788" x="225.1045" y="722.8921">&#8212; used for scheduling; on cgroup v2 a hint for memory.min/low. Exceeding it is allowed, but makes the Pod a</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="312.749" x="170.2036" y="737.8408">candidate for EVICTION when the node runs short.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.0527" x="170.2036" y="752.7896">Limit</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="493.0923" x="204.8682" y="752.7896">&#8212; the cgroup's ceiling. Exceed it and the kernel's OOM killer stops the process:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="66.4473" x="701.5723" y="752.7896">OOMKilled</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="63.5781" x="768.0195" y="752.7896">, exit code</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="21.6899" x="835.2095" y="752.7896">137</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="754.4761" x="170.2036" y="767.7383">(128 + SIGKILL 9), and the container restarts. You cannot throttle memory the way you throttle CPU &#8212; it is held, not spent.</text></g><g class="link" data-entity-1="dec" data-entity-2="bin" data-uid="lnk12" id="link_dec_bin"><polygon fill="#475569" points="130.2036,205.6671,134.2036,196.6671,130.2036,200.6671,126.2036,196.6671,130.2036,205.6671" style="stroke:#475569;stroke-width:1;"/><path d="M130.2036,197.742 C130.2036,198.5776 130.2036,199.4167 130.2036,200.259 C130.2036,201.9435 130.2036,203.6405 130.2036,205.347 C130.2036,205.4537 130.2036,199.5604 130.2036,199.6671" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="bin" data-entity-2="diff" data-uid="lnk13" id="link_bin_diff"><polygon fill="#475569" points="130.2036,384.6843,134.2036,375.6843,130.2036,379.6843,126.2036,375.6843,130.2036,384.6843" style="stroke:#475569;stroke-width:1;"/><path d="M130.2036,377.229 C130.2036,377.4526 130.2036,377.6764 130.2036,377.9003 C130.2036,379.6913 130.2036,381.4892 130.2036,383.2905 C130.2036,383.7408 130.2036,384.1913 130.2036,384.642 C130.2036,384.6561 130.2036,378.6702 130.2036,378.6843" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="diff" data-entity-2="trap" data-uid="lnk14" id="link_diff_trap"><polygon fill="#475569" points="130.2036,546.5039,134.2036,537.5039,130.2036,541.5039,126.2036,537.5039,130.2036,546.5039" style="stroke:#475569;stroke-width:1;"/><path d="M130.2036,538.9108 C130.2036,539.2593 130.2036,539.6079 130.2036,539.9567 C130.2036,541.3519 130.2036,542.7493 130.2036,544.1465 C130.2036,544.8451 130.2036,545.5437 130.2036,546.242 C130.2036,546.3293 130.2036,540.4166 130.2036,540.5039" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="trap" data-entity-2="enf" data-uid="lnk15" id="link_trap_enf"><polygon fill="#475569" points="130.2036,663.6951,134.2036,654.6951,130.2036,658.6951,126.2036,654.6951,130.2036,663.6951" style="stroke:#475569;stroke-width:1;"/><path d="M130.2036,655.7294 C130.2036,655.8752 130.2036,656.0211 130.2036,656.1673 C130.2036,656.4595 130.2036,656.7525 130.2036,657.0461 C130.2036,657.6333 130.2036,658.2232 130.2036,658.8154 C130.2036,660 130.2036,661.1943 130.2036,662.3963 C130.2036,662.6968 130.2036,662.9978 130.2036,663.2992 C130.2036,663.3746 130.2036,663.45 130.2036,663.5254 C130.2036,663.5631 130.2036,663.6008 130.2036,663.6385 C130.2036,663.6574 130.2036,657.6763 130.2036,657.6951" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="722.7979" x="146.8047" y="812.8301">CPU over its limit is SLOWED; memory over its limit is KILLED. That one sentence explains most resource incidents.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1006.4072" x="5" y="828.9287">Memory-backed emptyDir volumes (chapter 05-08) count against the container's memory limit too &#8212; a full tmpfs can OOM-kill a container that never called malloc.</text></g><!--SRC=[ZLRhJkj64FwVfvWUgG9KO-8G2A5f92uc9u802ccFa2AaZRs9jzYxFjur8QqgzLSVeEgxz7yVvJn9PzPsRd2gHY2jT_URcPrlRjy86SHvoC5r3ue_erIi3qB1PXbBzC5p8Dc-YNZ2tJHFufeH9kOmu8dA5Y0q12gNXeSW99m_Zlm7-FBxNy1a28Z9E33yDtC5CGj3dcbGKz3vT2fUkNR0gzVhm5AM6PXcAi7lHhDMotXWc9oXbW-N_aL_S7O3km_zFIiuLVDIYiN-ypT4QWwXqC_QAfKSbMNqWNgrYiCFqEdCCfMdtIum3I4FuDSQm9gEPm1u5h6QB0p79NWEIQOl3U__Va3bJuTZES1rmcTi0sdHN_rPwF5Ozd0z4-z0lmwtqFPOZd1jUFO-z7suXNgDiRp7ZvIR5HQtZrRtVFpdhzKf7PwG_zAO2Ldwpwlzji7GUV_sRFW8ktt_uYr3ZMR5qF1i02mmEOlZ1OPCWhx54mmHo3LkGX0f4N0AekjymZEaaUibTJsbmaBz12ziqNSjYBw9M7C7glrl-XfFNXtf4qJV1h9vuXorZW5shUtNOkyTQ0EXFK7qRK1RXqwhwJadY2lXWmquGGyHEX94tmQqtNQEFCyvRhISrafxRmadQ1EXzuBOMq4RJqVhPFk2sAkE6q_721dBZXQ_y5FFwuxGsJjY1v_CfFKaonQdrdMeuBeVApZlqvuBF