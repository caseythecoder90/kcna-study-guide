<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="344px" preserveAspectRatio="none" style="width:1366px;height:344px;background:#FFFFFF;" version="1.1" viewBox="0 0 1366 344" width="1366px" zoomAndPan="magnify"><title>Hub, repository, chart, release &#8212; four words, four different things</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="561.0762" x="394.9619" y="30.8838">Hub, repository, chart, release &#8212; four words, four different things</text></g><!--cluster hub--><g class="cluster" data-entity="hub" data-source-line="5" data-uid="ent0002" id="cluster_hub"><rect fill="#F8FAFC" height="167" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="222" x="14" y="89.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="194.981" x="27.5095" y="107.8921">ARTIFACT HUB  (artifacthub.io)</text></g><!--cluster repo--><g class="cluster" data-entity="repo" data-source-line="9" data-uid="ent0004" id="cluster_repo"><rect fill="#F8FAFC" height="239" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="265" x="287" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.2363" x="376.8818" y="71.8921">REPOSITORY</text></g><!--cluster chart--><g class="cluster" data-entity="chart" data-source-line="13" data-uid="ent0006" id="cluster_chart"><rect fill="#F0FDF4" height="155" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="299" x="643" y="95.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.4937" x="769.7532" y="113.8921">CHART</text></g><!--cluster rel--><g class="cluster" data-entity="rel" data-source-line="17" data-uid="ent0008" id="cluster_rel"><rect fill="#F0FDF4" height="169" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="315" x="1045" y="88.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="61.4009" x="1171.7996" y="106.8921">RELEASE</text></g><!--entity h1--><g class="entity" data-entity="h1" data-source-line="6" data-uid="ent0003" id="entity_h1"><rect fill="#FFFFFF" height="125.7417" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="205.7661" x="22" y="122.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.6709" x="36" y="148.8921">A</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.4854" x="48.2827" y="148.8921">search index</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.7617" x="131.3799" y="148.8921">and web UI</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.7661" x="36" y="163.8408">over thousands of repositories.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3145" x="36" y="178.7896">It stores NO charts itself &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.7534" x="36" y="193.7383">it points you at the repo.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.6768" x="36" y="206.811">helm search hub nginx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="120.4414" x="36" y="219.46">CNCF Incubating project</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="144.8853" x="36" y="232.1089">(was Helm Hub, hub.helm.sh)</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="10" data-uid="ent0005" id="entity_r1"><rect fill="#FFFFFF" height="198.1855" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="249.0889" x="295" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="221.0889" x="309" y="112.8921">Where charts are stored and served</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="309" y="127.8408">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.6626" x="309" y="142.7896">Classic: an HTTP server with an</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.1963" x="309" y="157.7383">index.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.4517" x="379.8081" y="157.7383">listing every chart and</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.6626" x="309" y="172.687">version, plus the</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="22.3818" x="407.2744" y="172.687">.tgz</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.2617" x="433.2681" y="172.687">packages.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="154.709" x="309" y="185.7598">helm repo add podinfo https://...</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="191.979" x="309" y="198.4087">helm repo update   (refresh index.yaml)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="114.3398" x="309" y="211.0576">helm search repo nginx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="309" y="225.5825">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.7617" x="309" y="240.5313">Modern: an</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.4136" x="378.3735" y="240.5313">OCI registry</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.0845" x="456.3989" y="240.5313">&#8212; the same</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4434" x="309" y="255.48">registries that hold container images.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="205.4497" x="309" y="268.5527">oci://ghcr.io/org/charts/app &#8212; no repo add</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="14" data-uid="ent0007" id="entity_c1"><rect fill="#DCFCE7" height="113.0928" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="283.3979" x="651" y="129.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.0317" x="665" y="155.3921">A package</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="186.7544" x="733.6436" y="155.3921">&#8212; 'the apt .deb of Kubernetes'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="251.4307" x="665" y="170.3408">Templates + default values + Chart.yaml.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="76.5591" x="665" y="185.2896">Identified by</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="95.0181" x="745.1709" y="185.2896">name + version</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="194.3208" x="665" y="200.2383">(e.g. podinfo 6.15.0) &#8212; SemVer.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.8345" x="665" y="213.311">On disk: a directory (helm create)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="231.6875" x="665" y="225.96">Packaged: name-version.tgz (helm package)</text></g><!--entity l1--><g class="entity" data-entity="l1" data-source-line="18" data-uid="ent0009" id="entity_l1"><rect fill="#DCFCE7" height="128.0415" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="298.9434" x="1053" y="121.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.1563" x="1067" y="147.8921">An installed instance of a chart</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="191.4263" x="1067" y="162.8408">in a cluster, with its own name.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="270.9434" x="1067" y="177.7896">Install the same chart twice &#8594; two releases.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="229.7534" x="1067" y="192.7383">Every install/upgrade/rollback adds a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8545" x="1067" y="207.687">revision</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.8545" x="1120.4663" y="207.687">(1, 2, 3 ...).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="232.9497" x="1067" y="220.7598">Stored as Secrets in the release namespace:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="206.6851" x="1067" y="233.4087">sh.helm.release.v1.&lt;name&gt;.v&lt;revision&gt;</text></g><g class="link" data-entity-1="h1" data-entity-2="r1" data-uid="lnk10" id="link_h1_r1"><polygon fill="#475569" points="294.8809,185.6982,285.8809,181.6982,289.8809,185.6982,285.8809,189.6982,294.8809,185.6982" style="stroke:#475569;stroke-width:1;"/><path d="M228.3023,185.6982 C249.8013,185.6982 266.6971,185.6982 288.8809,185.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="19.3477" x="252" y="177.9541">find</text></g><g class="link" data-entity-1="r1" data-entity-2="c1" data-uid="lnk11" id="link_r1_c1"><polygon fill="#475569" points="650.8792,185.6982,641.8792,181.6982,645.8792,185.6982,641.8792,189.6982,650.8792,185.6982" style="stroke:#475569;stroke-width:1;"/><path d="M544.0376,185.6982 C578.2909,185.6982 609.7287,185.6982 644.8792,185.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="59.3613" x="568" y="177.9541">pull / install</text></g><g class="link" data-entity-1="c1" data-entity-2="l1" data-uid="lnk12" id="link_c1_l1"><polygon fill="#475569" points="1052.675,185.6982,1043.675,181.6982,1047.675,185.6982,1043.675,189.6982,1052.675,185.6982" style="stroke:#475569;stroke-width:1;"/><path d="M934.196,185.6982 C972.4459,185.6982 1007.9915,185.6982 1046.675,185.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="60.0234" x="963.8418" y="163.9541">helm install</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="71.707" x="958" y="177.7529">+ your values</text></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="576.9531" x="387.0234" y="312.8301">Helm docs: 'Helm installs charts into Kubernetes, creating a new release for each installation,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="385.5264" x="482.7368" y="328.9287">and you find new charts by searching Helm chart repositories.'</text></g><!--SRC=[TLNDRkCs4BxhAQPxYODrfBh5zc0O0b8ZMnjjrq7YRL505qeSIMneKY0fkzwYG4_x04MVS9-aGr9sdDW5V93vCpFVpmo_4ggIFKT8qop-dDRIPbomnh2DpPugnMvSYnjCktuZ4ucr0wV1YAPrm8N1oWcj4YUSH5ZqvHWCTjeAfyr-35NBZFDB4fb5-FBtlr3hti1E6sx7yPkBkaQ3YkAsGZKsINnGfXeA-ERsORryVpjVm-BZzm0ZYYPgLhcsBrEXhz_0RDOOtNTv3im2hSAV2S3fVPYLkKLcgXQ4ulZ7B2lfhEAmmn8-BWkbjsWei-ujhLhGzJC0WJOjrDA1fJzeuSCg0h8Wd4LPUpo54WuwBHIjxdKFpCF048FkpgpuXDF996zHRc2emv