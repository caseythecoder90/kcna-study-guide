<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="551px" preserveAspectRatio="none" style="width:914px;height:551px;background:#FFFFFF;" version="1.1" viewBox="0 0 914 551" width="914px" zoomAndPan="magnify"><title>Three independent checks per request &#8212; each mode compares the Pod against ITS OWN level</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="808.2246" x="49.3286" y="30.8838">Three independent checks per request &#8212; each mode compares the Pod against ITS OWN level</text></g><!--cluster alg--><g class="cluster" data-entity="alg" data-source-line="4" data-uid="ent0002" id="cluster_alg"><rect fill="#F8FAFC" height="139" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="774" x="52.9409" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="569.1753" x="155.3533" y="71.8921">What the admission plugin does, in order (pod-security-admission/admission/admission.go)</text></g><!--cluster r--><g class="cluster" data-entity="r" data-source-line="8" data-uid="ent0004" id="cluster_r"><rect fill="#FEF2F2" height="124" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="824" x="52.9409" y="200.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="410.3569" x="259.7625" y="218.8921">NAMESPACE psa-restricted:   enforce=restricted &#183; warn=restricted</text></g><!--cluster w--><g class="cluster" data-entity="w" data-source-line="12" data-uid="ent0006" id="cluster_w"><rect fill="#F0FDF4" height="167" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="750" x="52.9409" y="332.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="519.0542" x="168.4138" y="350.8921">NAMESPACE psa-warn-audit:   enforce=baseline &#183; warn=restricted &#183; audit=restricted</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="5" data-uid="ent0003" id="entity_a1"><rect fill="#326CE5" height="98.144" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="722.8589" x="95.4409" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.7427" x="109.4409" y="112.8921">1 &#183; enforce</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="556.9688" x="178.7954" y="112.8921">&#8212; check against the enforce level.  Violation &#8594; the request is REJECTED (403 Forbidden).</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.8354" x="109.4409" y="127.8408">2 &#183; audit</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="301.2407" x="166.5" y="127.8408">&#8212; check against the audit level.    Violation &#8594; an</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.0591" x="471.3525" y="127.8408">audit-violations</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="233.2764" x="571.0234" y="127.8408">annotation on the API audit log event.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.1245" x="109.4409" y="142.7896">3 &#183; warn</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="296.2007" x="169.4009" y="142.7896">&#8212; check against the warn level.     Violation &#8594; a</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56.3228" x="469.2134" y="142.7896">Warning:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.3481" x="529.1479" y="142.7896">returned to kubectl.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="606.8906" x="109.4409" y="155.8623">Step 3 is SKIPPED if step 1 rejected: 'avoid adding warnings to a request we're already going to reject with an error'.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="642.3774" x="109.4409" y="168.5112">And for Deployments, Jobs, StatefulSets... step 1 never runs &#8212; enforce applies to Pods only; audit and warn apply to both.</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="9" data-uid="ent0005" id="entity_r1"><rect fill="#FEE2E2" height="83.1953" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="773.4624" x="95.4409" y="233.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.8799" x="109.4409" y="259.8921">A Pod that violates restricted</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="551.1353" x="303.7681" y="259.8921">&#8594; REJECTED. Only the Forbidden error &#8212; no extra warning, it would say the same thing.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="229.728" x="109.4409" y="274.8408">A Deployment that violates restricted</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.1772" x="342.7808" y="274.8408">&#8594; ACCEPTED, with a</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.9937" x="478.5698" y="274.8408">Warning</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="231.3911" x="534.1753" y="274.8408">at kubectl apply time. Its ReplicaSet's</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="338.6636" x="109.4409" y="287.9136">Pods are then each REJECTED by enforce (FailedCreate events).</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="285.7583" x="451.1606" y="287.9136">That warning is the whole value of warn=enforce-level:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="520.1528" x="109.4409" y="300.5625">without it, the Deployment is accepted SILENTLY and you discover the problem only as 0/3 READY.</text></g><!--entity w1--><g class="entity" data-entity="w1" data-source-line="13" data-uid="ent0007" id="entity_w1"><rect fill="#DCFCE7" height="125.7417" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="700.439" x="94.9409" y="365.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.9199" x="108.9409" y="391.8921">Pod violates BASELINE</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="522.9072" x="258.4727" y="391.8921">(privileged, hostPID...)       &#8594; REJECTED. Audit annotation recorded too; no warning.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="270.2007" x="108.9409" y="406.8408">Pod passes baseline, violates RESTRICTED</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="205.1182" x="382.7534" y="406.8408">(plain nginx) &#8594; CREATED, plus a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.9937" x="591.4834" y="406.8408">Warning</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41.8945" x="647.0889" y="406.8408">and an</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.0527" x="692.5952" y="406.8408">audit</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.0718" x="727.2598" y="406.8408">record.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.1162" x="108.9409" y="421.7896">Pod passes restricted</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="196.4282" x="356.0234" y="421.7896">&#8594; CREATED. Nothing to report.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="108.9409" y="436.7383">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="626.5703" x="108.9409" y="449.811">The lecture's plain nginx Pod: 'Warning: would violate PodSecurity restricted:latest: allowPrivilegeEscalation != false ...,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="550.9131" x="108.9409" y="462.46">unrestricted capabilities ..., runAsNonRoot != true ..., seccompProfile ...'  followed by  'pod/nginx created'.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="640.8735" x="108.9409" y="475.1089">A hard floor at baseline, and visibility of everything still short of restricted &#8212; the migration path toward enforce=restricted.</text></g><g class="link" data-entity-1="alg" data-entity-2="r" data-uid="lnk8" id="link_alg_r"><polygon fill="#475569" points="68.9409,200.6722,72.9409,191.6722,68.9409,195.6722,64.9409,191.6722,68.9409,200.6722" style="stroke:#475569;stroke-width:1;"/><path d="M68.9409,193.1306 C68.9409,194.5077 68.9409,195.8917 68.9409,197.2802 C68.9409,197.9744 68.9409,198.6697 68.9409,199.3659 C68.9409,199.714 68.9409,200.0623 68.9409,200.4108 C68.9409,200.4979 68.9409,194.5851 68.9409,194.6722" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r" data-entity-2="w" data-uid="lnk9" id="link_r_w"><polygon fill="#475569" points="68.9409,332.687,72.9409,323.687,68.9409,327.687,64.9409,323.687,68.9409,332.687" style="stroke:#475569;stroke-width:1;"/><path d="M68.9409,324.9412 C68.9409,325.1268 68.9409,325.3126 68.9409,325.4986 C68.9409,325.8707 68.9409,326.2438 68.9409,326.6178 C68.9409,327.3659 68.9409,328.1176 68.9409,328.8728 C68.9409,329.6279 68.9409,330.3864 68.9409,331.148 C68.9409,331.5287 68.9409,331.9103 68.9409,332.2925 C68.9409,332.3881 68.9409,332.4837 68.9409,332.5794 C68.9409,332.6033 68.9409,332.6272 68.9409,332.6511 C68.9409,332.6631 68.9409,326.675 68.9409,326.687" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="880.9473" x="12.9673" y="519.8301">The modes do not combine into one verdict; they are three separate questions against possibly three different levels. Only enforce can say no.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="896.8818" x="5" y="535.9287">Audit annotations land in the API server's audit log, so they are only visible where audit logging is configured &#8212; k3s does not enable it by default.</text></g><!--SRC=[VLRDRXit4BxhAIQvo0QaLLptP2i255ifb3gEO0ar0lJ2NL8hrXHdItAjg4M1dle0HT-bzpvAdgGpt1zjR2M2O0lIxCp7RxxvE2-qpKmf5IJ9g7e7HED7KelSYQqVFMHM3CD6RLLIb5lJ2peO1QkDKmgqbQfGzCS6o3OgU_1GA0TE_Leg7-3pd_-04ja6jaW5CjmMmYaFb0mMA47aGbiAcw-MyE7-5enwLARNSoeBmkPKvENzHeGOBkHMUw_HGc7AN5kGgFo0wWCwIHLF2fH3hxBIwR0Vjj6Z8v-I74zVmdYSEooBoGI41s5o-Bq7qAayJYTdyD-_eEmQNQR6etGIZnDFsI9dQ7L4XJu1-4cZ4O6XVlxhxnZHqA4ztCtUpQvMisiu-VxLERn5bsf9x9qcFrkg-1rN5ANK8TRxIi4Oq9PxMb1Oe4mnPlZO_E9ZFc4jXYgItfngkfWtwJ07ocX3XUISaUo4inMGho3XW0wGfqWOo3s5Q9jVn3nEXT9P9I4WF9GfiMsudDU_gOkpiyaog0BEcQRbZ_F5WbZIQ_3yvHaz-Wk5Ata1VV68ciGZ9UMD4EY_vvIYPNgd-ew8Cau9kOSSEP82gYImqs73F2ddqFMJyOW1J3f0fbO2DHMkLM5mloLMI6llCAM_Io9GhKkpLC4dITB0iqG2wRwqlX9zhGbH54Qh28u4xubsix-i6HTK91B8GNiEIJ5i6ZIiK95bLBgMw5dlZoz6utRwVhPSJAzcK7WnfB4AJbS4GLF-zU7RffsThzePU2DaLSCT6O9fdDJ0SrYfYKvpo56h8xQxaNO27ooVX_JHwhkYEb9Z4TIdu4JJEHfYwWYMHe8NrMDUR1Lze1yhCKuxZVWs5COnlRgQBGZ7eEvpHuNL58H6UmtpcgmDve6cayheJ51l-xuZXzWwSYu6Poj3Q-SutRVDFdahj57oYaGNL3LC_ZJXyYl6N9-NvHrdPuD4yQCmfG9SLysfCmtZICMHUQvDFXIMP2PX4FDqgA7CB9c2-xsStynkLpSVeypsM8BKFaCMAJzKE4oDsaOzSkTVZSxfIDFhZrtvfQqklgqzXZwCckvgBnLU6MtL4UMrBdTCZJyWrcLtH-J8OcoR_sQwdDtCRsUnhIU5qu_4Vwxa03Rems9-JGDw2jNhIuLEwmbi_P2gy4N2peINhD6wMvK0kMeXlAUQpR461nXti-NgRiw9Qo26718itLAVJcFTAw8s2fBkBdz4aDIXZc