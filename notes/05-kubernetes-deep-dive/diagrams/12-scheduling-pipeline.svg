<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="836px" preserveAspectRatio="none" style="width:1090px;height:836px;background:#FFFFFF;" version="1.1" viewBox="0 0 1090 836" width="1090px" zoomAndPan="magnify"><title>What actually happens between "kubectl run" and a container starting</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="600.1787" x="241.9106" y="30.8838">What actually happens between "kubectl run" and a container starting</text></g><!--entity created--><g class="entity" data-entity="created" data-source-line="4" data-uid="ent0002" id="entity_created"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="329.9644" x="109.5" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="301.9644" x="123.5" y="87.8921">1 &#183; A Pod is created with spec.nodeName EMPTY</text></g><!--entity watch--><g class="entity" data-entity="watch" data-source-line="6" data-uid="ent0003" id="entity_watch"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="389.958" x="79.5" y="141.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.6943" x="93.5" y="167.8921">2 &#183; The scheduler is WATCHING for exactly that</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="359.5464" x="93.5" y="180.9648">A scheduler watches for newly created Pods that have no Node assigned.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="361.958" x="93.5" y="193.6138">Nothing pushed this to it &#8212; it is a watch on the API server (chapter 05-01).</text></g><!--entity filt--><g class="entity" data-entity="filt" data-source-line="8" data-uid="ent0004" id="entity_filt"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="508.2295" x="20.5" y="247.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="34.5" y="273.8921">3 &#183; FILTERING &#8212; which nodes COULD run this?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="480.2295" x="34.5" y="286.9648">Every node is tested against the Pod's requirements. What survives is the set of FEASIBLE nodes.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="472.0171" x="34.5" y="299.6138">A node with less allocatable memory than the Pod REQUESTS is filtered out. So is a node with a</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="432.9531" x="34.5" y="312.2627">taint the Pod does not tolerate, an unsatisfiable node affinity, or a node that is not Ready.</text></g><!--entity pending--><g class="entity" data-entity="pending" data-source-line="10" data-uid="ent0005" id="entity_pending"><rect fill="#FEE2E2" height="83.1953" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="438.7437" x="646" y="246.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="343.8462" x="660" y="272.8921">If the feasible list is EMPTY, the Pod is not schedulable.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.8018" x="660" y="287.8408">It stays</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2764" x="708.4136" y="287.8408">Pending</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.7363" x="763.3018" y="287.8408">until something changes.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="410.7437" x="660" y="300.9136">kubectl describe pod &#8594; Events &#8594; FailedScheduling, with the reason per node.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="305.019" x="660" y="313.5625">The single most common cause of a Pod that never starts.</text></g><!--entity score--><g class="entity" data-entity="score" data-source-line="12" data-uid="ent0006" id="entity_score"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="458.4341" x="45.5" y="366.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6606" x="59.5" y="392.8921">4 &#183; SCORING &#8212; which feasible node is BEST?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="430.4341" x="59.5" y="405.9648">Each surviving node is given a score by the active scoring rules. The highest score wins,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="412.6826" x="59.5" y="418.6138">and ties are broken AT RANDOM. Filtering is a yes/no question; scoring is a ranking.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="334.9199" x="59.5" y="431.2627">'Can run it' and 'is the best place to run it' are two different questions.</text></g><!--entity bind--><g class="entity" data-entity="bind" data-source-line="14" data-uid="ent0007" id="entity_bind"><rect fill="#DCFCE7" height="148.7397" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="420.9922" x="64" y="484.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="324.3525" x="78" y="510.8921">5 &#183; BINDING &#8212; record the decision on the API server</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="392.9922" x="78" y="523.9648">The scheduler writes a Binding object naming the Pod and the target Node.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="304.3906" x="78" y="536.6138">That is the whole of what a scheduler does to place a Pod.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="78" y="551.1387">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="155.2354" x="78" y="564.2114">apiVersion: v1 &#183; kind: Binding</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.6152" x="78" y="576.8604">metadata: name: nginx, namespace: default</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="268.9521" x="78" y="589.5093">target:   apiVersion: v1, kind: Node, name: worker-1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="78" y="604.0342">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="365.8843" x="78" y="617.1069">The Pod's spec.nodeName is now set, and the scheduler's job is over.</text></g><!--entity kubelet--><g class="entity" data-entity="kubelet" data-source-line="16" data-uid="ent0008" id="entity_kubelet"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="306.7891" x="121" y="670.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="278.7891" x="135" y="696.8921">6 &#183; The KUBELET on that node starts the Pod</text></g><!--entity note--><g class="entity" data-entity="note" data-source-line="18" data-uid="ent0009" id="entity_note"><rect fill="#F1F5F9" height="57.8975" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="537.4629" x="6" y="750.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="509.4629" x="20" y="776.8921">The scheduler never contacts a node, never pulls an image and never starts a container.</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.4985" x="20" y="791.8408">It makes one decision and records it. Everything after that is the kubelet.</text></g><g class="link" data-entity-1="created" data-entity-2="watch" data-uid="lnk10" id="link_created_watch"><polygon fill="#475569" points="274.5,141.4652,278.5,132.4652,274.5,136.4652,270.5,132.4652,274.5,141.4652" style="stroke:#475569;stroke-width:1;"/><path d="M274.5,104.7341 C274.5,115.5815 274.5,123.1622 274.5,135.4652" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="watch" data-entity-2="filt" data-uid="lnk11" id="link_watch_filt"><polygon fill="#475569" points="274.5,247.4394,278.5,238.4394,274.5,242.4394,270.5,238.4394,274.5,247.4394" style="stroke:#475569;stroke-width:1;"/><path d="M274.5,209.8519 C274.5,221.6761 274.5,229.117 274.5,241.4394" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="filt" data-entity-2="pending" data-uid="lnk12" id="link_filt_pending"><polygon fill="#DC2626" points="645.5778,288.1982,636.5778,284.1982,640.5778,288.1982,636.5778,292.1982,645.5778,288.1982" style="stroke:#DC2626;stroke-width:1;"/><path d="M528.5671,288.1982 C567.5174,288.1982 601.4475,288.1982 639.5778,288.1982" fill="none" style="stroke:#DC2626;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="88.0723" x="543.25" y="277.4541">no feasible node</text></g><g class="link" data-entity-1="filt" data-entity-2="score" data-uid="lnk13" id="link_filt_score"><polygon fill="#475569" points="274.5,366.6282,278.5,357.6282,274.5,361.6282,270.5,357.6282,274.5,366.6282" style="stroke:#475569;stroke-width:1;"/><path d="M274.5,328.8091 C274.5,341.0072 274.5,348.4328 274.5,360.6282" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="score" data-entity-2="bind" data-uid="lnk14" id="link_score_bind"><polygon fill="#475569" points="274.5,484.5492,278.5,475.5492,274.5,479.5492,270.5,475.5492,274.5,484.5492" style="stroke:#475569;stroke-width:1;"/><path d="M274.5,448.0017 C274.5,459.2848 274.5,465.9424 274.5,478.5492" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="bind" data-entity-2="kubelet" data-uid="lnk15" id="link_bind_kubelet"><polygon fill="#475569" points="274.5,670.5809,278.5,661.5809,274.5,665.5809,270.5,661.5809,274.5,670.5809" style="stroke:#475569;stroke-width:1;"/><path d="M274.5,633.7397 C274.5,647.2706 274.5,654.3366 274.5,664.5809" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="kubelet" data-entity-2="note" data-uid="lnk16" id="link_kubelet_note"><polygon fill="#475569" points="274.5,750.4394,278.5,741.4394,274.5,745.4394,270.5,741.4394,274.5,750.4394" style="stroke:#475569;stroke-width:1;"/><path d="M274.5,713.8954 C274.5,724.867 274.5,732.5074 274.5,744.4394" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1031.7207" x="26.1396" y="820.8301">Two steps of decision &#8212; filtering, then scoring &#8212; and one step of recording it: binding. "Scheduling" in Kubernetes means ASSIGNING a Pod to a Node, not starting it.</text></g><!--SRC=[TLPBSkCs4Dtx51rbuQHAbiPEnWj5fPHionFLU6J7aZELocG1ag244Gbm2D0QPPLL3f3ANRBFKUOaUGsGjEHFbKicGQ0_hr-_nbTAnrcLIEhr-k7F6PFPVgB4iXIvxQzZBOxSIkQoLrHvTk2KooIzNmb78dQLoB8jhKHHI6qfacuZfQREkefax38gAzqXeHCI51ljXDAo9Ej4wPHU7XoKs2Jq4lOwn_JVlpIc6vEGiXINKZYPq4Qv5Tb2nZrj4ZaJkQJ9kvl5hnqQ3aKSI-r68nBj_ZsB9snniP9auvLCgWoUOVdzU77-qtJsXb9JaloC512_GpOVzD2gF-JW-7WqtZco4GxFrc_NSeFDJMm8rVgJIFzUaZOqGuo8nggbbabls6TxensxC-DMo9kAoi8ypY8UPqWv-lBdF_mFxo9u9AFnNTBuPafMblU8v9iOC3iyl7fzzEhusyO-Gr5aG3OWuK_luV0Tut0vlLfCRZblThLPARXWI2sTNzzTNN2XV3m_xeGxWTUjtyM1EMavQx64A-jyS43Wq58fFrMg13-qixr035kLz-eUnlaSLq0wCYbTJiRpwTdL97X-1g1nyEQhdaaBDBBCnCA928daCZUbhvLklDFjvEUxoNmnPqUfoe0EGZILwz7S13GV38gd_fYGRIgK64Ii3HOCAeyQTq5TghGLJjbK-I2yEP6cIYktxH98KRlmH53X_AqKoVQ5-d2KU-MPfZw0L0ghs4Ech3VaUTvjWwjDryJaM7eVzDHnCsqj3QFHZTG9o3NiHoF4x5H6rkGo40xCqKiWlfDwqw4eH5ogI5819r_- -fjGTHJIFruAbSba7bp2JZS0oI6X1omeMe2EdFupjVITftoEkK5AiSbpd8X5PIMJGVYqF6nQtZUoO7TXYqGIG2j2RdkuVS-qdfzVFo9rYsF3spFmOu_L0hi2GHcQPjiIVDK8oiQcb1HjVPPG1opxDTvRGX50SSvifPPG1LTltw0bkayXOE5p2gGIRB8qQtWOB-XsFBkuVjUZIqzODkoPkfMs3n7vLC6kClg7rgt_MWgzniipG1-UWwNSlyeTUgqzhBikuW11lLYoohGx48lR64fKcg9TmF_6ets1iZx7FUnVC_Pdqzb5Wps-cJBnNXCPAmjhJnNiCJaUDBPKZb6YC-NhJ2Rw26UaHSvlJGjuEF4CdYmXABENU1SQaNTkLkXa9jl6ZwiTbxxNWKg0ntFnmTPk2GlrYomvdm7T-nc5AYI39jAdxj5o8e5Y3JXwYT-bqf-x_iKMy3K0GAceClUS6d5U0oBQzzgjVNB2tThinfHhMHuTFnVpefNc_Sdf9MJ3OjnjiMmHmUwF9k8z1gNQPSBIcBeD8uInnuFJPiI-lJkRN4qMeURSqTnLeQ6RyZqUsIn0cTpNmdrQ15dmzuRODL