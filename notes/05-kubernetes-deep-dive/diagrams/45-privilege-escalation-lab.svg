<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="694px" preserveAspectRatio="none" style="width:1061px;height:694px;background:#FFFFFF;" version="1.1" viewBox="0 0 1061 694" width="1061px" zoomAndPan="magnify"><title>spurin/rootshell &#8212; three manifests, one setuid binary, and the flag that finally stops it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="731.1094" x="160.9624" y="30.8838">spurin/rootshell &#8212; three manifests, one setuid binary, and the flag that finally stops it</text></g><!--cluster img--><g class="cluster" data-entity="img" data-source-line="4" data-uid="ent0002" id="cluster_img"><rect fill="#F8FAFC" height="126" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="756" x="160.0171" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.2954" x="505.8694" y="71.8921">The image</text></g><!--cluster s1--><g class="cluster" data-entity="s1" data-source-line="8" data-uid="ent0004" id="cluster_s1"><rect fill="#FEF2F2" height="112" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="576" x="160.0171" y="198.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="182.749" x="356.6426" y="216.8921">STATE 1 &#183; no securityContext</text></g><!--cluster s2--><g class="cluster" data-entity="s2" data-source-line="12" data-uid="ent0006" id="cluster_s2"><rect fill="#FEF2F2" height="124" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="696" x="160.0171" y="353.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="288.9707" x="363.5317" y="371.8921">STATE 2 &#183; runAsUser: 1000, runAsGroup: 1000</text></g><!--cluster s3--><g class="cluster" data-entity="s3" data-source-line="16" data-uid="ent0008" id="cluster_s3"><rect fill="#F0FDF4" height="122" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="726" x="160.0171" y="520.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="265.5098" x="390.2622" y="538.8921">STATE 3 &#183; + allowPrivilegeEscalation: false</text></g><!--entity i1--><g class="entity" data-entity="i1" data-source-line="5" data-uid="ent0003" id="entity_i1"><rect fill="#FFFFFF" height="85.4951" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="705.0664" x="202.5171" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4727" x="216.5171" y="112.8921">Ubuntu + a user 'nonpriv' (UID 1000) +</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.5063" x="442.6016" y="112.8921">/rootshell</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.1543" x="501.1079" y="112.8921">: a tiny C program &#8212;  setuid(0); system(/bin/bash);</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2871" x="216.5171" y="127.8408">compiled and marked</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="68.9863" x="344.416" y="127.8408">chmod u+s</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="455.1523" x="417.0142" y="127.8408">&#8212; the SETUID bit. A setuid binary runs with the privileges of its OWNER (root),</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="677.0664" x="216.5171" y="142.7896">whoever starts it. That is how  passwd  lets ordinary users edit /etc/shadow &#8212; and how a rogue binary hands out root.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="349.1211" x="216.5171" y="155.8623">No USER line in the Dockerfile, so by default the container runs as root.</text></g><!--entity s1a--><g class="entity" data-entity="s1a" data-source-line="9" data-uid="ent0005" id="entity_s1a"><rect fill="#FEE2E2" height="70.5464" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="524.7041" x="202.5171" y="231.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="187.7954" x="216.5171" y="257.8921">kubectl exec -it ubuntu -- bash</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.1509" x="216.5171" y="272.8408">root@ubuntu:/#</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="377.8823" x="335.3389" y="272.8408">&#8592; '#' prompt and 'root' &#8212; the container already runs as UID 0</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="223.6792" x="216.5171" y="285.9136">Nothing to escalate to: it started at the top.</text></g><!--entity s2a--><g class="entity" data-entity="s2a" data-source-line="13" data-uid="ent0007" id="entity_s2a"><rect fill="#FEE2E2" height="83.1953" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="645.52" x="202.0171" y="386.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.5454" x="216.0171" y="412.8921">nonpriv@ubuntu:/$</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="377.0698" x="342.7861" y="412.8921">id  &#8594;  uid=1000(nonpriv) gid=1000(nonpriv)       &#8592; looks fixed</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.5063" x="216.0171" y="427.8408">/rootshell</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="13" x="281.7471" y="427.8408">&#8594;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.1509" x="301.9707" y="427.8408">root@ubuntu:/#</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="327.9136" x="406.3452" y="427.8408">id  &#8594;  uid=0(root) gid=1000(nonpriv)       &#8592; root again</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="551.9229" x="216.0171" y="440.9136">runAsUser controls who the container STARTS as. It says nothing about what the process may BECOME:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="617.52" x="216.0171" y="453.5625">the kernel honours the setuid bit, and the process gains its owner's power. allowPrivilegeEscalation defaults to TRUE.</text></g><!--entity s3a--><g class="entity" data-entity="s3a" data-source-line="17" data-uid="ent0009" id="entity_s3a"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="674.8706" x="202.5171" y="553.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.5454" x="216.5171" y="579.8921">nonpriv@ubuntu:/$</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.73" x="343.2861" y="579.8921">/rootshell  &#8594;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.5454" x="429.2397" y="579.8921">nonpriv@ubuntu:/$</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="307.3789" x="556.0088" y="579.8921">id  &#8594;  uid=1000(nonpriv)       &#8592; escalation refused</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="149.9502" x="216.5171" y="592.9648">The kubelet sets the kernel's</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="73.3584" x="369.5234" y="592.9648">no_new_privs</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="365.5029" x="445.938" y="592.9648">flag on the container process (the setting is inverted: false &#8594; flag on).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="580.7012" x="216.5171" y="605.6138">With no_new_privs, exec IGNORES setuid and setgid bits and file capabilities, for that process and every child.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="563.605" x="216.5171" y="618.2627">/rootshell runs, its setuid(0) call fails, and bash starts as UID 1000. The flag can never be switched off again.</text></g><g class="link" data-entity-1="img" data-entity-2="s1" data-uid="lnk10" id="link_img_s1"><polygon fill="#475569" points="176.0171,198.5816,180.0171,189.5816,176.0171,193.5816,172.0171,189.5816,176.0171,198.5816" style="stroke:#475569;stroke-width:1;"/><path d="M176.0171,179.7105 C176.0171,180.375 176.0171,181.042 176.0171,181.7113 C176.0171,187.0657 176.0171,192.5653 176.0171,198.0659 C176.0171,198.2378 176.0171,192.4097 176.0171,192.5816" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s1" data-entity-2="s2" data-uid="lnk11" id="link_s1_s2"><polygon fill="#475569" points="176.0171,353.4773,180.0171,344.4773,176.0171,348.4773,172.0171,344.4773,176.0171,353.4773" style="stroke:#475569;stroke-width:1;"/><path d="M176.0171,311.0988 C176.0171,311.8519 176.0171,312.6105 176.0171,313.3744 C176.0171,314.9022 176.0171,316.4509 176.0171,318.0176 C176.0171,321.151 176.0171,324.3561 176.0171,327.6093 C176.0171,334.1157 176.0171,340.8142 176.0171,347.5145 C176.0171,349.1895 176.0171,350.8647 176.0171,352.537 C176.0171,352.746 176.0171,352.955 176.0171,353.164 C176.0171,353.2684 176.0171,347.3729 176.0171,347.4773" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.3711" x="182.0171" y="337.9541">who you START as</text></g><g class="link" data-entity-1="s2" data-entity-2="s3" data-uid="lnk12" id="link_s2_s3"><polygon fill="#475569" points="176.0171,520.6315,180.0171,511.6315,176.0171,515.6315,172.0171,511.6315,176.0171,520.6315" style="stroke:#475569;stroke-width:1;"/><path d="M176.0171,477.7212 C176.0171,478.5252 176.0171,479.3344 176.0171,480.1484 C176.0171,483.4043 176.0171,486.7369 176.0171,490.1208 C176.0171,496.8886 176.0171,503.862 176.0171,510.8388 C176.0171,512.583 176.0171,514.3275 176.0171,516.0689 C176.0171,516.9397 176.0171,517.8097 176.0171,518.6786 C176.0171,519.113 176.0171,519.5472 176.0171,519.981 C176.0171,520.1979 176.0171,514.4147 176.0171,514.6315" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.0703" x="182.0171" y="504.9541">whether you can BECOME more</text></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1043.0342" x="5" y="662.8301">The study tips' memory hook: runAsUser is about WHO the container runs as; allowPrivilegeEscalation is about WHETHER it can gain more power later. You need both.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="797.624" x="127.7051" y="678.9287">allowPrivilegeEscalation: false cannot be combined with privileged: true or CAP_SYS_ADMIN &#8212; either already IS the escalation.</text></g><!--SRC=[bLPBRnit4BxhLqoJ0f9WFIpx9gj27Lj8V8WTM3AC00OCxYwb9RnBBfRSo4hHeAUUYwB_fVV-bFoIVaEk7dRaFWmVLilXSFWzPlOxfUEiIYJrUltmxup9R3zHOb6AtFOVOYswBfMvx1LLdZMSSfaaMrIbqltI66TJcMNqzPS_oAMbb9GBhURIEjiXen4fNQKIYfGMvQf3GYU8apJFn08Fmj4SArcs8kjCOKcvHgEKiHDwWMDUpH2gSh6GhsWqMfIcAiPZ4WZB5_HJWsWdz2QgjAleW0HLLfRKr4ONfVhKfDRDnJaD3WyFsrWTHUDjsQD-D1vYWrDwHMTKb8OlxIzJ5zuwR9-GNLadyrOVb-X7mgRjapiTcxnGcKpyZN9HFk0HkUCqDmbL1vPJrwX8cavcN4EaN8zEdq92PQKjBPLBVIHNZBGBQSdCWOQbgzlBoJMrkEPsvqulKoC_uNhMYT8nNZsQCOpAKcgMH8MmTfaGPHAhfap28Oo89PaeHttfuhvDHO9ehe_hvvs2SFjAhijAyHu9AaTySkzEZwpwB8U3mVZIqCqK9MKAz2hjoputyOCivwYyGzPGjA94paMLERyQ6-q4eijmMV3dSuxwd7BCr1OPrcjg1usVdsXWEZkTJMX0V_r9sW2y6D9pgpFab8zkeuit8WdxxU2vCXwg23yoaeyofYuWg89KldI_T8dvnEMYCPVqOrWPzbzx-lpVrrz_e-Rh9eiZBvo7gycnpGsxs-k9h9GYMMskoQGVFe7EfKf3-8QaZKKcdCJp42m6FbbE0JAOOHUVQ7ixiHUU8uO7nvxQ6r0zz7BlX1Tl6PxmPWzQHy_H0XIrSpPeV1_GW6Q1nkz4KEyFdAvL1xPfySsRBNYPCGyMDd-KYGVwgVtgb2yGyEJ8ms22VpoC8qWiGCSEx1jSF5Kb-Xl1Hi-u0uxNioamwT45w10h2xa5kaJ4FbYcDJTGGYojXUjNz6PoTlL-CgofsZcJ0s49BJEuIviAzkDN6- -xRIzSv-EghVUyMQAYfgN2B6NPWwmoi_omxWoJe1nbzDfabW