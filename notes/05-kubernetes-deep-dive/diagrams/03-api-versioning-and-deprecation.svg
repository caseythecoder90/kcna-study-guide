<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="921px" preserveAspectRatio="none" style="width:1263px;height:921px;background:#FFFFFF;" version="1.1" viewBox="0 0 1263 921" width="1263px" zoomAndPan="magnify"><title>The life of an API version, and what each stage promises you</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="523.1338" x="366.3887" y="30.8838">The life of an API version, and what each stage promises you</text></g><!--cluster alpha--><g class="cluster" data-entity="alpha" data-source-line="4" data-uid="ent0002" id="cluster_alpha"><rect fill="#FEF2F2" height="177" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="502" x="182.4556" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.9727" x="377.4692" y="71.8921">ALPHA &#183; v1alpha1</text></g><!--cluster beta--><g class="cluster" data-entity="beta" data-source-line="8" data-uid="ent0004" id="cluster_beta"><rect fill="#F8FAFC" height="258" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="492" x="182.4556" y="273.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="95.3608" x="380.7751" y="291.8921">BETA &#183; v2beta3</text></g><!--cluster ga--><g class="cluster" data-entity="ga" data-source-line="12" data-uid="ent0006" id="cluster_ga"><rect fill="#F0FDF4" height="190" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="482" x="182.4556" y="574.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="168.3145" x="339.2983" y="592.8921">STABLE / GA &#183; v1 &#183; apps/v1</text></g><!--cluster rules--><g class="cluster" data-entity="rules" data-source-line="19" data-uid="ent0010" id="cluster_rules"><rect fill="#F8FAFC" height="534.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="414" x="682.4556" y="335.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.0444" x="785.4333" y="353.3921">The two numbers the exam wants</text></g><!--entity a--><g class="entity" data-entity="a" data-source-line="5" data-uid="ent0003" id="entity_a"><rect fill="#FEE2E2" height="136.0908" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="452.0425" x="224.4556" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="424.0425" x="238.4556" y="112.8921">DISABLED by default &#8212; must be explicitly enabled on the API server</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="420.4653" x="238.4556" y="125.9648">&#8220;May contain bugs. Support may be DROPPED AT ANY TIME WITHOUT NOTICE.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="396.7197" x="238.4556" y="138.6138">The API may change in incompatible ways in a later release without notice.&#8221;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.4556" y="153.1387">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="336.8428" x="238.4556" y="166.2114">Removal notice required: NONE &#8212; Rule #4a says alpha versions</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="336.8159" x="238.4556" y="178.8604">may be removed in any release without prior deprecation notice.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.4556" y="193.3853">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="315.9707" x="238.4556" y="206.458">Recommended for SHORT-LIVED TESTING CLUSTERS only.</text></g><!--entity b--><g class="entity" data-entity="b" data-source-line="9" data-uid="ent0005" id="entity_b"><rect fill="#326CE5" height="216.584" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="442.4175" x="224.4556" y="306.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="197.2217" x="238.4556" y="332.8921">DISABLED by default since 1.22</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="367.356" x="238.4556" y="345.9648">(betas introduced BEFORE 1.22 were enabled by default &#8212; that is why</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="312.3613" x="238.4556" y="358.6138">older clusters served things like batch/v1beta1 with no flag)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.4556" y="373.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="377.126" x="238.4556" y="386.2114">&#8220;The software is WELL TESTED. Enabling a feature is considered SAFE.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="388.6953" x="238.4556" y="398.8604">Support for a feature will not be dropped, though the details may change.&#8221;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.4556" y="413.3853">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="414.4175" x="238.4556" y="426.458">BUT: &#8220;the schema and/or semantics may change IN INCOMPATIBLE WAYS in a</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="407.1074" x="238.4556" y="439.1069">subsequent beta or stable version&#8221; &#8212; upgrades can need edits or re-creation.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.4556" y="453.6318">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="403.4067" x="238.4556" y="466.7046">Lifetime: max 9 months or 3 minor releases from introduction to deprecation,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="357.5859" x="238.4556" y="479.3535">then ANOTHER 9 months or 3 releases from deprecation to removal.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.4556" y="493.8784">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="182.73" x="238.4556" y="506.9512">NOT recommended for production.</text></g><!--entity g--><g class="entity" data-entity="g" data-source-line="13" data-uid="ent0007" id="entity_g"><rect fill="#DCFCE7" height="148.7397" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="430.8589" x="224.9556" y="607.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.0718" x="238.9556" y="633.8921">ENABLED and widely supported</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="393.0352" x="238.9556" y="646.9648">&#8220;Stable API versions remain available for ALL FUTURE RELEASES within a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="369.8159" x="238.9556" y="659.6138">Kubernetes MAJOR version, and there are no current plans for a major</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.8213" x="238.9556" y="672.2627">version revision of Kubernetes that removes stable APIs.&#8221;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.9556" y="686.7876">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="388.7329" x="238.9556" y="699.8604">May still be DEPRECATED &#8212; but Rule #4a: must NOT be removed within a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="402.8589" x="238.9556" y="712.5093">major version, and at minimum 12 months or 3 releases, whichever is longer.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="238.9556" y="727.0342">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="194.9331" x="238.9556" y="740.1069">This is what you build production on.</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="20" data-uid="ent0011" id="entity_r1"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="362.9844" x="724.9556" y="368.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152.4517" x="738.9556" y="394.3921">Rule #4a &#8212; API versions</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="299.5029" x="738.9556" y="407.4648">GA: deprecated, but NOT removed within a major version</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="286.1021" x="754.2363" y="420.1138">minimum 12 months or 3 releases, whichever is longer</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="334.9844" x="738.9556" y="432.7627">Beta: 9 months or 3 minor releases from deprecation to removal</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="259.1875" x="738.9556" y="445.4116">Alpha: may be removed in ANY release, no notice</text></g><!--entity r2--><g class="entity" data-entity="r2" data-source-line="21" data-uid="ent0012" id="entity_r2"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="369.666" x="714.4556" y="641.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="216.7344" x="728.4556" y="667.8921">Rule #7 &#8212; features and behaviours</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="341.666" x="728.4556" y="680.9648">&#8220;Deprecated behaviors must function for NO LESS THAN 1 YEAR</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="186.4199" x="728.4556" y="693.6138">after their announced deprecation.&#8221;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="229.8076" x="728.4556" y="706.2627">This is the one the study tips quote directly.</text></g><!--entity r3--><g class="entity" data-entity="r3" data-source-line="22" data-uid="ent0013" id="entity_r3"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="383.8726" x="704.4556" y="793.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.7788" x="718.4556" y="819.8921">Rule #3 / Rule #8 &#8212; never downhill</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="355.8726" x="718.4556" y="832.9648">An API version may not be deprecated in favour of a LESS STABLE one.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.0273" x="718.4556" y="845.6138">GA can replace beta; beta cannot replace GA.</text></g><g class="link" data-entity-1="alpha" data-entity-2="beta" data-uid="lnk8" id="link_alpha_beta"><polygon fill="#475569" points="198.4556,273.6449,202.4556,264.6449,198.4556,268.6449,194.4556,264.6449,198.4556,273.6449" style="stroke:#475569;stroke-width:1;"/><path d="M198.4556,230.8412 C198.4556,231.1888 198.4556,231.537 198.4556,231.8859 C198.4556,237.4676 198.4556,243.209 198.4556,249.0569 C198.4556,254.9048 198.4556,260.8592 198.4556,266.8668 C198.4556,268.3686 198.4556,269.8739 198.4556,271.3816 C198.4556,272.1354 198.4556,266.8899 198.4556,267.6449" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="50.6953" x="204.4556" y="257.9541">promoted</text></g><g class="link" data-entity-1="beta" data-entity-2="ga" data-uid="lnk9" id="link_beta_ga"><polygon fill="#475569" points="198.4556,574.2448,202.4556,565.2448,198.4556,569.2448,194.4556,565.2448,198.4556,574.2448" style="stroke:#475569;stroke-width:1;"/><path d="M198.4556,532.2985 C198.4556,533.0733 198.4556,533.8488 198.4556,534.625 C198.4556,536.1774 198.4556,537.7324 198.4556,539.2892 C198.4556,542.4027 198.4556,545.5231 198.4556,548.6437 C198.4556,554.8847 198.4556,561.1258 198.4556,567.3118 C198.4556,568.8583 198.4556,570.4013 198.4556,571.94 C198.4556,572.7094 198.4556,567.4777 198.4556,568.2448" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="50.6953" x="204.4556" y="558.9541">promoted</text></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1245.9111" x="5" y="889.8301">The name tells you the contract. v1alpha1 can vanish next release; v2beta3 is safe to use but its shape may change and it has a removal clock running; v1 is a promise for the lifetime of Kubernetes 1.x.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="803.8857" x="226.0127" y="905.9287">Read an apiVersion in a manifest as a risk statement, not just a path &#8212; that is the habit the CKAD and the KCNA are both testing.</text></g><!--SRC=[dLV1Rjj64BthAwRffGLi6R8Bj5KC0xJDs4faoP3e147RmufSYHkJkmntALij2kGZUao_e_T-IhwaRvQKGbaA4DGGR9dapiw