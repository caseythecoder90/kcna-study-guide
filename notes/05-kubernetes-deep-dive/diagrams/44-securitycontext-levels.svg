<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="595px" preserveAspectRatio="none" style="width:1233px;height:595px;background:#FFFFFF;" version="1.1" viewBox="0 0 1233 595" width="1233px" zoomAndPan="magnify"><title>Two places to write a securityContext &#8212; the container wins where they overlap</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="676.1777" x="274.4346" y="30.8838">Two places to write a securityContext &#8212; the container wins where they overlap</text></g><!--cluster pod--><g class="cluster" data-entity="pod" data-source-line="4" data-uid="ent0002" id="cluster_pod"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="542" x="281.0234" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="344.5952" x="379.7258" y="71.8921">spec.securityContext &#8212; POD level: PodSecurityContext</text></g><!--cluster ctr--><g class="cluster" data-entity="ctr" data-source-line="8" data-uid="ent0004" id="cluster_ctr"><rect fill="#F0FDF4" height="122" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="686" x="281.0234" y="218.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="447.1606" x="400.4431" y="236.8921">spec.containers[].securityContext &#8212; CONTAINER level: SecurityContext</text></g><!--cluster ex--><g class="cluster" data-entity="ex" data-source-line="12" data-uid="ent0006" id="cluster_ex"><rect fill="#F8FAFC" height="184" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="642" x="281.0234" y="359.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="115.8003" x="544.1233" y="377.8921">The docs' example</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="5" data-uid="ent0003" id="entity_p1"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="490.7896" x="323.5234" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="228.9917" x="337.5234" y="112.8921">Applies to every container in the Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.4063" x="566.5151" y="112.8921">, and to the Pod's volumes.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="462.7896" x="337.5234" y="125.9648">runAsUser &#183; runAsGroup &#183; runAsNonRoot &#183; seccompProfile &#183; appArmorProfile &#183; seLinuxOptions</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="50.7139" x="337.5234" y="138.6138">Pod-only:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="371.7173" x="394.3496" y="138.6138">fsGroup (group that owns mounted volumes) &#183; supplementalGroups &#183; sysctls</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="442.0088" x="337.5234" y="151.2627">Pod spec siblings, not securityContext fields:  hostNetwork &#183; hostPID &#183; hostIPC &#183; hostUsers</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="9" data-uid="ent0005" id="entity_c1"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="636.1475" x="323.0234" y="251.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="499.8652" x="337.0234" y="277.8921">Applies to that one container, and OVERRIDES the Pod value where both are set.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="608.1475" x="337.0234" y="290.9648">runAsUser &#183; runAsGroup &#183; runAsNonRoot &#183; seccompProfile &#183; appArmorProfile &#183; seLinuxOptions  (same as Pod level)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="81.2754" x="337.0234" y="303.6138">Container-only:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="465.7759" x="424.4111" y="303.6138">allowPrivilegeEscalation &#183; privileged &#183; capabilities &#183; readOnlyRootFilesystem &#183; procMount</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="274.5972" x="337.0234" y="316.2627">Container settings do NOT affect the Pod's volumes.</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="13" data-uid="ent0007" id="entity_e1"><rect fill="#326CE5" height="142.9902" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="592.1904" x="323.0234" y="392.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="33.96" x="337.0234" y="418.8921">spec:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="369.2051" x="344.2471" y="433.8408">securityContext:   {runAsUser: 1000}          &#8592; Pod says 1000</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0718" x="344.2471" y="448.7896">containers:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.9536" x="344.2471" y="463.7383">- name: app</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="422.665" x="351.4707" y="478.687">securityContext: {runAsUser: 2000}          &#8592; this container says 2000</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="337.0234" y="493.6357">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="564.1904" x="337.0234" y="506.7085">ps aux inside the container shows USER 2000. A second container without its own value would run as 1000.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="438.8667" x="337.0234" y="519.3574">Neither set? The image decides &#8212; its Dockerfile USER, or root (UID 0) if it has none.</text></g><g class="link" data-entity-1="pod" data-entity-2="ctr" data-uid="lnk8" id="link_pod_ctr"><polygon fill="#475569" points="297.0234,218.6894,301.0234,209.6894,297.0234,213.6894,293.0234,209.6894,297.0234,218.6894" style="stroke:#475569;stroke-width:1;"/><path d="M297.0234,176.1621 C297.0234,176.3612 297.0234,176.5605 297.0234,176.7602 C297.0234,177.5589 297.0234,178.3626 297.0234,179.1711 C297.0234,182.4048 297.0234,185.7135 297.0234,189.0722 C297.0234,195.7897 297.0234,202.7072 297.0234,209.6255 C297.0234,211.3551 297.0234,213.0847 297.0234,214.8112 C297.0234,215.6745 297.0234,216.537 297.0234,217.3983 C297.0234,217.829 297.0234,212.2594 297.0234,212.6894" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.4082" x="303.0234" y="202.9541">container overrides pod</text></g><g class="link" data-entity-1="ctr" data-entity-2="ex" data-uid="lnk9" id="link_ctr_ex"><polygon fill="#475569" points="297.0234,359.6456,301.0234,350.6456,297.0234,354.6456,293.0234,350.6456,297.0234,359.6456" style="stroke:#475569;stroke-width:1;"/><path d="M297.0234,340.8778 C297.0234,342.5328 297.0234,344.2114 297.0234,345.9102 C297.0234,349.3078 297.0234,352.7862 297.0234,356.3188 C297.0234,357.2019 297.0234,358.0884 297.0234,358.9779 C297.0234,359.2003 297.0234,353.4228 297.0234,353.6456" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1215.0469" x="5" y="563.8301">Settings about the WHOLE Pod (its volumes, its groups, kernel parameters) live only at Pod level; settings about a PROCESS's power (privileged, capabilities, escalation) live only on the container.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="812.4375" x="206.3047" y="579.9287">A common pattern: user and seccomp at Pod level for every container, then capabilities and allowPrivilegeEscalation per container.</text></g><!--SRC=[lLNDZXf74Bxp51LVbfNusVLnWiP2B75MSW31RdomVMXw2cXjJ_UekuUVM9Pooja7lqlkUHG_IQeQXXrOd6CGX_whgg_g-whc9sMaBZE4JgUx_mThjUzcIYoTo7ttIHhH3YlCiLEKkMu45JJ2myP2eOL43y72ngc08C2ZB6cv6rWJS1lW-v_VW4n1qbueWmusodZOhD0XN-p0hj5fKJGQ3cKGPackN_a2PUUIgydu3ZIkKISmiTdizCKhwFMMpfP5ceBmKDWCFZS0QdvxyxHV55hjCPCVjwiXKoP29SUzxZnjWJ0PFpkSNNbOMrtcw3iVJS-hFp2vlKrTQVh-qPFrFtz3tBnb1CVTo9gfjO7tb8-qUJ5nTg4839s8ekYxtBhQaSTtofJRSH6KDRxNvJXfBHvbG5ZQrkXTmYW15eU8pPWweHK1x8PgdDkIof9LgA-Z-vBI9o8fPHtDV3pTUHdqXMWK2fWBy6gkbLdw5XXAvfoPXKAT-GHWPNqOOTXOzyH-UJkvlwkMzvD1jUIALV6ODXAICWVQRXjVNehXo9B_yE