<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="483px" preserveAspectRatio="none" style="width:902px;height:483px;background:#FFFFFF;" version="1.1" viewBox="0 0 902 483" width="902px" zoomAndPan="magnify"><title>Why the old Pod is stuck in Terminating &#8212; and the four ways out</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="556.04" x="165.48" y="30.8838">Why the old Pod is stuck in Terminating &#8212; and the four ways out</text></g><!--cluster h--><g class="cluster" data-entity="h" data-source-line="4" data-uid="ent0002" id="cluster_h"><rect fill="#F8FAFC" height="126" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="864" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.0635" x="315.9683" y="71.8921">Graceful deletion is a two-step handshake</text></g><!--cluster w--><g class="cluster" data-entity="w" data-source-line="8" data-uid="ent0004" id="cluster_w"><rect fill="#F8FAFC" height="126" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="716" x="14" y="187.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="362.6035" x="190.6982" y="205.8921">What each workload does while the old Pod is Terminating</text></g><!--cluster o--><g class="cluster" data-entity="o" data-source-line="13" data-uid="ent0007" id="cluster_o"><rect fill="#F0FDF4" height="156" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="882" x="14" y="321.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.7827" x="426.1086" y="339.8921">Ways out</text></g><!--entity h1--><g class="entity" data-entity="h1" data-source-line="5" data-uid="ent0003" id="entity_h1"><rect fill="#FFFFFF" height="85.4951" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="814.0273" x="56" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8271" x="70" y="112.8921">1 &#183; The API server</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="427.7622" x="183.439" y="112.8921">sets metadata.deletionTimestamp. The object stays in etcd; kubectl shows</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.3945" x="614.813" y="112.8921">Terminating</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="689.2075" y="112.8921">.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="172.6182" x="70" y="127.8408">2 &#183; The kubelet on that node</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="459.5513" x="246.23" y="127.8408">runs preStop, sends SIGTERM, waits for the grace period, stops the containers,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.5806" x="88.0591" y="142.7896">then tells the API server the Pod is gone &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.7764" x="340.2515" y="142.7896">only then</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.1753" x="401.6396" y="142.7896">is the object removed.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="786.0273" x="70" y="155.8623">With the kubelet unreachable, step 2 never happens. Nothing in the control plane talks to containerd directly &#8212; the kubelet is the only path to a node's containers.</text></g><!--entity w1--><g class="entity" data-entity="w1" data-source-line="9" data-uid="ent0005" id="entity_w1"><rect fill="#DCFCE7" height="85.4951" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="324.1372" x="56" y="220.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="151.709" x="70" y="246.8921">Deployment / ReplicaSet</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="296.1372" x="70" y="261.8408">Does not count Pods with a deletionTimestamp.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.7407" x="70" y="276.7896">Creates a replacement</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75.1436" x="212.3525" y="276.7896">immediately</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="287.4961" y="276.7896">.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="166.2568" x="70" y="289.8623">Two copies may run for a while.</text></g><!--entity w2--><g class="entity" data-entity="w2" data-source-line="10" data-uid="ent0006" id="entity_w2"><rect fill="#FEE2E2" height="85.4951" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="322.7661" x="398.5" y="220.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9009" x="412.5" y="246.8921">StatefulSet</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="167.6099" x="412.5" y="261.8408">The replacement needs the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.8208" x="583.7217" y="261.8408">same name</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.1118" x="658.1543" y="261.8408">(web-0),</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="191.4263" x="412.5" y="276.7896">and the old web-0 still exists. It</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="32.5127" x="607.5381" y="276.7896">waits</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="640.0508" y="276.7896">.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="244.4653" x="412.5" y="289.8623">At most one web-0, by design &#8212; no split brain.</text></g><!--entity o1--><g class="entity" data-entity="o1" data-source-line="14" data-uid="ent0008" id="entity_o1"><rect fill="#DCFCE7" height="115.3926" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="831.2578" x="56.5" y="354.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="139.4199" x="70.5" y="380.8921">1 &#183; The kubelet returns</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="295.4326" x="213.5317" y="380.8921">&#8212; it confirms the deletion itself. The clean path.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.9199" x="70.5" y="395.8408">2 &#183; Delete the Node object</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="640.7261" x="233.0317" y="395.8408">&#8212; the Pod garbage collector force-deletes Pods bound to a node that no longer exists (after a 40s wait).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.3608" x="70.5" y="410.7896">3 &#183; Force-delete the Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="613.6406" x="221.4727" y="410.7896">&#8212; kubectl delete pod &lt;name&gt; --grace-period=0 --force. Removes the object WITHOUT confirmation.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="197.1836" x="70.5" y="425.7383">4 &#183; Taint the node out-of-service</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="487.2271" x="271.2954" y="425.7383">&#8212; node.kubernetes.io/out-of-service=nodeshutdown:NoExecute (stable v1.28):</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="668.9731" x="88.5591" y="440.687">force-deletes the Pods and detaches their volumes immediately, so a StatefulSet Pod and its PVC can move.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="661.1011" x="70.5" y="453.7598">3 and 4 are only safe once the node is really powered off &#8212; otherwise the 'deleted' containers are still running and still writing.</text></g><g class="link" data-entity-1="h" data-entity-2="w" data-uid="lnk9" id="link_h_w"><polygon fill="#475569" points="30,187.6931,34,178.6931,30,182.6931,26,178.6931,30,187.6931" style="stroke:#475569;stroke-width:1;"/><path d="M30,180.0134 C30,180.1741 30,180.335 30,180.496 C30,181.784 30,183.0804 30,184.3832 C30,185.0346 30,185.6876 30,186.3419 C30,186.669 30,186.9965 30,187.3243 C30,187.4062 30,187.4882 30,187.5702 C30,187.6112 30,181.6521 30,181.6931" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="w" data-entity-2="o" data-uid="lnk11" id="link_w_o"><polygon fill="#475569" points="30,321.6382,34,312.6382,30,316.6382,26,312.6382,30,321.6382" style="stroke:#475569;stroke-width:1;"/><path d="M30,313.9823 C30,314.3448 30,314.7082 30,315.0724 C30,316.5292 30,317.9992 30,319.4798 C30,319.8499 30,320.2207 30,320.5921 C30,320.7778 30,320.9636 30,321.1496 C30,321.2426 30,321.3357 30,321.4288 C30,321.4753 30,321.5218 30,321.5684 C30,321.5917 30,315.615 30,315.6382" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><!--SRC=[VLN1Rjj64BthAwQvs0PCob9yA5n5G12dhWzrZLYj3tKFA-w8t6gvG-mkpQX5Wtv4_wNtVag_f3DBKQQTe88WIClPcJTltZnzPLnXMusGvzF-7Obic6gZIg_gCDqMJcMnmXhpfgtj99fe4Uwh7V0XaDLmInfCW13ROWl6mGfzRPoAnfNmxvz_WN8wnMwezT2fNG1gusJYiOZAbPpirPLN1MvQ2nejHaDEyYc87MKXOWCLfmYLsk8hM2nAJsspN88AKC7l4u1HeiLwEOD__eOLbtjxUmq1_IFwnNIzvAynG8rHQHLLFXHQcHf3L7MJfpkq_fMJSIk2abl1MEXlODkk-TH2gAWBm3L67Khk_C7nuNmeBE6S7RYDMAa8ZZGc2Bvr0HgFTv6QKmR4JS7TzTNg_OVlJvaOmm0tv1DNfJ023Nf3caFvGaZd1RceZ4CVJXySo8jFkGvQsmSyTPr-xcTJaiCq2yP9pgRPkOJ9zDVsZNkiwH6rD1JCRtWncotlJQnIoD1Mwpogeb9hYuACnpC7XrAmKas3BkHmGx6IwHjt0Et9GcCLmuZARhaeFVMYGHiP8kCIZEDY0pp1t2X1GYmCOVGeZCZ85rF1knHzS1NZzlgOJVvu9hHxcOUWXuxyrfBYqeG1kihmunU27atvXUwwB-Zk4XjBknfTX2byu1-cK7SOXUG7Tob574M6t7805