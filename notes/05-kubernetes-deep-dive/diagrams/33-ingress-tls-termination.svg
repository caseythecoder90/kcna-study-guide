<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="775px" preserveAspectRatio="none" style="width:1208px;height:775px;background:#FFFFFF;" version="1.1" viewBox="0 0 1208 775" width="1208px" zoomAndPan="magnify"><title>TLS at the Ingress &#8212; encrypted to the front door, plain HTTP behind it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="599.0186" x="300.9487" y="30.8838">TLS at the Ingress &#8212; encrypted to the front door, plain HTTP behind it</text></g><!--cluster setup--><g class="cluster" data-entity="setup" data-source-line="4" data-uid="ent0002" id="cluster_setup"><rect fill="#F8FAFC" height="220" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="626" x="253.958" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="313.498" x="410.209" y="71.8921">BEFORE ANY REQUEST &#8212; three steps, done once</text></g><!--cluster http--><g class="cluster" data-entity="http" data-source-line="8" data-uid="ent0004" id="cluster_http"><rect fill="#FEF2F2" height="135" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="658" x="253.958" y="281.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="244.8481" x="460.5339" y="299.8921">PLAIN HTTP &#8212; port 80 &#8212; REDIRECTED</text></g><!--cluster hs--><g class="cluster" data-entity="hs" data-source-line="12" data-uid="ent0006" id="cluster_hs"><rect fill="#F0FDF4" height="154" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="716" x="253.958" y="424.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="224.6563" x="499.6299" y="442.8921">HTTPS &#8212; port 443 &#8212; the handshake</text></g><!--cluster term--><g class="cluster" data-entity="term" data-source-line="16" data-uid="ent0008" id="cluster_term"><rect fill="#F8FAFC" height="137" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="660" x="253.958" y="586.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="279.5254" x="444.1953" y="604.8921">TERMINATION &#8212; where the encryption stops</text></g><!--entity su1--><g class="entity" data-entity="su1" data-source-line="5" data-uid="ent0003" id="entity_su1"><rect fill="#326CE5" height="178.6372" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="574.5571" x="296.458" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.9307" x="310.458" y="112.8921">1 &#183; make a certificate and key</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="215.2427" x="497.6123" y="112.8921">(self-signed: you are your own CA)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="285.5273" x="310.458" y="125.9648">openssl req -x509 -nodes -days 365 -newkey rsa:2048 \</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="326.4282" x="316.5703" y="138.6138">-keyout myingress-app.local.key -out myingress-app.local.crt \</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="429.1128" x="316.5703" y="151.2627">-subj /CN=myingress-app.local -addext subjectAltName=DNS:myingress-app.local</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="310.458" y="165.7876">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="154.6099" x="310.458" y="180.7363">2 &#183; store them in a Secret</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="295.4961" x="472.2915" y="180.7363">of type kubernetes.io/tls, keys tls.crt and tls.key</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="546.5571" x="310.458" y="193.8091">kubectl create secret tls myingress-app-tls --cert=myingress-app.local.crt --key=myingress-app.local.key</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="310.458" y="208.334">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="194.3398" x="310.458" y="223.2827">3 &#183; reference it from the Ingress</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="383.2759" x="310.458" y="236.3555">spec.tls:  - hosts: [myingress-app.local]    secretName: myingress-app-tls</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="466.979" x="310.458" y="249.0044">The tls hosts must match a host in rules &#8212; TLS cannot work on a host-less catch-all rule.</text></g><!--entity h1--><g class="entity" data-entity="h1" data-source-line="9" data-uid="ent0005" id="entity_h1"><rect fill="#FEE2E2" height="93.5444" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="608.0405" x="295.958" y="314.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="223.2026" x="309.958" y="340.8921">curl -i http://myingress-app.local/api</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="175.4521" x="309.958" y="353.9648">HTTP/1.1 301 Moved Permanently</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="214.5269" x="309.958" y="366.6138">Location: https://myingress-app.local/api</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="580.0405" x="309.958" y="379.2627">F5 NGINX does this AUTOMATICALLY once an Ingress has a tls section: nginx.org/ssl-redirect defaults to true.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="518.9336" x="309.958" y="391.9116">Status code from nginx.org/http-redirect-code (301 default; 302, 307, 308 allowed). curl -L follows it.</text></g><!--entity hs1--><g class="entity" data-entity="hs1" data-source-line="13" data-uid="ent0007" id="entity_hs1"><rect fill="#DCFCE7" height="113.0928" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="666.0728" x="295.958" y="457.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.2217" x="309.958" y="483.8921">a &#183; ClientHello carries SNI</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="180.2798" x="468.1797" y="483.8921">: 'I want myingress-app.local'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="522.645" x="309.958" y="496.9648">One IP and one port 443 serve many hostnames; SNI tells the controller which certificate to present.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="199.3735" x="309.958" y="511.4897">b &#183; the controller presents tls.crt</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.2681" x="512.9434" y="511.4897">and proves it holds tls.key</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.5444" x="309.958" y="526.4385">c &#183; the client verifies it</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="501.5283" x="446.5024" y="526.4385">: is the hostname in the certificate's subjectAltName? is it signed by a CA I trust?</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="594.1611" x="309.958" y="539.5112">Self-signed fails step c &#8212; hence curl -k (skip verification) or curl --cacert myingress-app.local.crt (trust THIS cert).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94.6563" x="309.958" y="554.0361">d &#183; keys agreed</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="369.8716" x="404.6143" y="554.0361">, and the HTTP request travels inside the encrypted channel</text></g><!--entity t1--><g class="entity" data-entity="t1" data-source-line="17" data-uid="ent0009" id="entity_t1"><rect fill="#FFFFFF" height="95.8442" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="610.0923" x="295.958" y="619.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="148.0908" x="309.958" y="645.8921">The controller decrypts.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.1904" x="461.6606" y="645.8921">It reads Host and path, routes as before, and forwards PLAIN HTTP</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.5806" x="309.958" y="660.8408">to Service nginx-api:80 and the Pod.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="533.4355" x="309.958" y="673.9136">'The Ingress resource only supports a single TLS port, 443, and assumes TLS termination at the ingress point</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="475.9702" x="309.958" y="686.5625">(traffic to the Service and its Pods is in plaintext).'  The Pods need no certificates and no changes.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="582.0923" x="309.958" y="699.2114">Encrypting the hop behind the controller too needs backend TLS configuration or a service mesh with mTLS (section 7).</text></g><g class="link" data-entity-1="setup" data-entity-2="http" data-uid="lnk10" id="link_setup_http"><polygon fill="#475569" points="269.958,281.667,273.958,272.667,269.958,276.667,265.958,272.667,269.958,281.667" style="stroke:#475569;stroke-width:1;"/><path d="M269.958,274.3597 C269.958,274.6103 269.958,274.8609 269.958,275.1113 C269.958,277.1151 269.958,279.1149 269.958,281.1069 C269.958,281.2314 269.958,281.3559 269.958,281.4804 C269.958,281.5426 269.958,275.6048 269.958,275.667" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="http" data-entity-2="hs" data-uid="lnk11" id="link_http_hs"><polygon fill="#475569" points="269.958,424.6731,273.958,415.6731,269.958,419.6731,265.958,415.6731,269.958,424.6731" style="stroke:#475569;stroke-width:1;"/><path d="M269.958,416.7184 C269.958,416.9072 269.958,417.0961 269.958,417.2853 C269.958,418.0418 269.958,418.8013 269.958,419.5636 C269.958,421.088 269.958,422.6232 269.958,424.1664 C269.958,424.2629 269.958,424.3594 269.958,424.4559 C269.958,424.5041 269.958,424.5524 269.958,424.6007 C269.958,424.6248 269.958,418.6489 269.958,418.6731" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="hs" data-entity-2="term" data-uid="lnk12" id="link_hs_term"><polygon fill="#475569" points="269.958,586.6918,273.958,577.6918,269.958,581.6918,265.958,577.6918,269.958,586.6918" style="stroke:#475569;stroke-width:1;"/><path d="M269.958,578.8257 C269.958,579.0206 269.958,579.2156 269.958,579.4107 C269.958,580.1911 269.958,580.9732 269.958,581.7566 C269.958,583.3235 269.958,584.8956 269.958,586.4704 C269.958,586.5196 269.958,586.5688 269.958,586.618 C269.958,586.6426 269.958,580.6672 269.958,580.6918" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1190.916" x="5" y="743.8301">Why the SAN matters: modern clients ignore the CN for hostname checks and look only at subjectAltName &#8212; a certificate with only CN=myingress-app.local fails verification even when trusted.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="928.6348" x="136.1406" y="759.9287">In production, cert-manager (CNCF Graduated) obtains real certificates from a CA such as Let's Encrypt and writes them into the same kind of Secret.</text></g><!--SRC=[TLPTSXf747xd51s_IAfYGRBisC485y7OeWeZHU1AN54UXjs6dR3CR6PcXKaghXmYTybxZfAJf7jcGGi2bGgXtPd- -Vhhh_iRgUAiI10QZMRuTLfdjfb8CJTYQPkBM8d8fRZ4HbuiivgJBaEO3CSW7D1p6AYvGMlXlx_-1bInMUSE4t3QlvmPhHmaMfiwv9cG2gudarkOOYfL0jBLQWPZ9zISR3xxll_-vguFtT5dkEl_yAa_ddYZBZM8O1tcjawc589MCJw3TdjkT95tEY0iM7H53d_K02e6szFE1Vpx3op50a50ZCR9cOo5e__8_GBNxUQq0t1gCPj5LiuL9YrOwmA4GVvhGAyKzBfdzwfjvU_OkhZew1oLjHdv-GsYBo_FluD8wGGjH8bOMxZyzYKzm1KP1sD5w_dvYzTmVzzkylrEnGv0H6TquM2vbW73IEHv8zEno1fyFJhsCZRkc4bRJ7-5PczqTU0UH299y8i3FaGeTJCt4akyUZSQjmuStzed3zFESmRIEat0C1k0IYbWZB515q3KCt3h765HJD4eT6WRKZTTHaMZP2pGDnyu8y_VwM4bTBuLkmp87fV7UiDyRXU0Y9zyZRv6NCkhOzZm0J9_TGJOtSGkEJ63CpJ4NYHECccNLMfpVfLGROvnW-9e4ToGQklesyy7NFq2z1CIOPXRJpDvMi49UUKKlLbO5fO885oS4jRyY54tHOQXsxW9Ow6KTh3IPa5jKHwBCcx8c2z68ilybKRfZFj6n34gLpPESL7xSwSDRuVTmIZqANl9DI7w-jn_l-k_6zprUvF-kstxVI-IO2Xrxaa3neKXrad_hjLi7W2fAN9PoP-zDYyQ5t1vVW4VzGCfoIsQfL0KRxP-YjUGR3YfLSkxiCTzFBtw_YMCFWn6Fv6a49ukbHQwdoOt7xkJGQyx77xsAaDitGfSIaaANnqgQd2gvb9zQMWpRv8YH0OJoSb3WZDHP5H0La5JRB6lU1yxuGgg4Ib7uDkZASvaQolo9quPZjBg6yBcUPq-Nl77Qw02wnKcPmq8Q0zXflcH9IfNYpxT5cg_u0pw-B7MBrvSbhgBbBDAR4hokQtt1wqtTkm1lHNSJRrCKhskaS8W5XeZ2U3nQC1zr8AJ0Qo4EYXi9nM0RaZd1xTUBLZojv5PD0z8JQ7MdkgAEik-OUlWo9_rKSSqT0o1W0PMgQJkgIe_rIGdjnHWfIpJpfG3txjSdjjgbnSwZYWtH4q6c6B84blHisadtXhoAC036dBjJmS0P0Xo4pttj3_-6EE9tPFejto9l8KH1TCr4R7NXG6poxgtLLuzJZAO2SbafS49iQzewXKkq6H1KsyXypAyq4Lde4ruxILMS4X71z2fzmsJwy7Ontws0sV2A7ZTfpq2CU7Kwq7xALSlBZH02oGBpeW7f42biZBnqwMoHyJ4G8MPfr-5UViKdlJlFWv6rBet8v_fAaMpOugou-cLsxszmP6w7A3nP9S82NeZjk4PC71qMb3PhrcIFH-4I-j0LcdgiTKfpcXGXdpfsqeOElseg_UAI3Wc8aigXszymbQsI6Gt0Dtgf56fwicaicZH1sqcCQz1sPg8adDli3HPwUFdiS2Fwjml8GPXRK5zubznnbBvUczMkBB0T4igzrIhgD9YHXpPB7MRo8LVuIm7Qpr1LTZn7EqOPuqJW4d8n88Y1e3ILOvRVvsVKONdQ0zePByidPgN3PDl5iUzFgMLrRiWu4MyG3hWHwDMCpalJ4YLc2syU73aX4KAA-bIMFB9qrBGuTLPLJ5zCYLDFE72aXabj1H67JznQdxgRP_OMcgt_p7GjLei0ldQilDZkWxuTKSyrUazRGvBqdUZIh4W3EUgNB6WDsBkFEf4d6Ay2B1bMYz2-SN-DkVflxlh-aJzwIDxOH2AgX80Fg3YBb91OZ0XO2GNHtO6YlKlAJnaTUyf8ZqMSwh4QM_KUmyVZ4WAyfoGe4mTWSYa9JyxvVTJpykOBNZ1iJ14HyfNLjtdkJBI-U7i5ywIVfQpN30DQEKC6wWFxdy0]--></g></svg>