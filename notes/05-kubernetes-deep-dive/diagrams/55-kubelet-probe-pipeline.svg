<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="623px" preserveAspectRatio="none" style="width:1397px;height:623px;background:#FFFFFF;" version="1.1" viewBox="0 0 1397 623" width="1397px" zoomAndPan="magnify"><title>The kubelet runs every probe &#8212; liveness acts on the node, readiness acts through the control plane</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="856.2129" x="262.8936" y="30.8838">The kubelet runs every probe &#8212; liveness acts on the node, readiness acts through the control plane</text></g><!--cluster node--><g class="cluster" data-entity="node" data-source-line="4" data-uid="ent0002" id="cluster_node"><rect fill="#F8FAFC" height="264.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="1009" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.1309" x="428.9346" y="71.8921">ON THE NODE &#8212; the kubelet</text></g><!--cluster cp--><g class="cluster" data-entity="cp" data-source-line="10" data-uid="ent0006" id="cluster_cp"><rect fill="#F0FDF4" height="365.5" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="360" x="1031" y="205.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.1646" x="1131.9177" y="223.8921">IN THE CONTROL PLANE</text></g><!--entity w--><g class="entity" data-entity="w" data-source-line="5" data-uid="ent0003" id="entity_w"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="696.6636" x="209.5" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="335.1689" x="223.5" y="112.8921">One probe worker per container, per configured probe</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.8271" x="558.6689" y="112.8921">, firing every periodSeconds</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="668.6636" x="223.5" y="125.9648">httpGet / tcpSocket / grpc &#8212; sent by the kubelet process itself, from the node to the POD IP (User-Agent: kube-probe/&lt;version&gt;)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="492.6528" x="223.5" y="138.6138">exec &#8212; the kubelet asks the container runtime (CRI) to run the command INSIDE the container</text></g><!--entity kill--><g class="entity" data-entity="kill" data-source-line="6" data-uid="ent0004" id="entity_kill"><rect fill="#FEE2E2" height="83.1953" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="491.0679" x="22.5" y="226.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="143.7744" x="36.5" y="252.3921">startup / liveness failed</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.979" x="183.8862" y="252.3921">(failureThreshold reached)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.2363" x="36.5" y="267.3408">The kubelet</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.4854" x="112.3481" y="267.3408">kills the container itself</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="239.1226" x="260.4453" y="267.3408">&#8594; restartPolicy &#8594; restart with backoff.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="312.3613" x="36.5" y="280.4136">Event: Container app failed liveness probe, will be restarted</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="353.3643" x="36.5" y="293.0625">Purely local &#8212; keeps working even if the API server is unreachable.</text></g><!--entity notready--><g class="entity" data-entity="notready" data-source-line="7" data-uid="ent0005" id="entity_notready"><rect fill="#FFFFFF" height="85.4951" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="482.8032" x="531.5" y="225.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.2681" x="545.5" y="251.3921">readiness failed</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.8896" x="545.5" y="266.3408">The kubelet marks the container ready=false</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.5645" x="545.5" y="281.2896">and writes the Pod's status:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.9199" x="707.6763" y="281.2896">ContainersReady</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6899" x="818.208" y="281.2896">and</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.019" x="843.5098" y="281.2896">Ready</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1626" x="886.1406" y="281.2896">conditions &#8594; False.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="311.2119" x="545.5" y="294.3623">Nothing is restarted. Probing continues; it flips back on success.</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="11" data-uid="ent0007" id="entity_api"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="193.4961" x="1103.5" y="238.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.3208" x="1117.5" y="264.8921">API server</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4961" x="1117.5" y="279.8408">stores the Pod status update</text></g><!--entity eps--><g class="entity" data-entity="eps" data-source-line="12" data-uid="ent0008" id="entity_eps"><rect fill="#DCFCE7" height="72.8462" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="343.6499" x="1039" y="371.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="150.2363" x="1053" y="397.3921">EndpointSlice controller</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.8018" x="1206.8481" y="397.3921">(kube-controller-manager)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="294.0298" x="1053" y="412.3408">watches Pods; marks this endpoint ready: false</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="268.2456" x="1053" y="427.2896">in every matching Service's EndpointSlices</text></g><!--entity kp--><g class="entity" data-entity="kp" data-source-line="13" data-uid="ent0009" id="entity_kp"><rect fill="#DCFCE7" height="57.8975" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="317.6753" x="1052" y="505.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="194.3145" x="1066" y="531.3921">kube-proxy / the CNI data plane</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="95.3608" x="1260.3145" y="531.3921">, on every node</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.7744" x="1066" y="546.3408">stops sending Service traffic to the Pod IP</text></g><g class="link" data-entity-1="w" data-entity-2="kill" data-uid="lnk10" id="link_w_kill"><polygon fill="#475569" points="349.1483,226.1241,358.987,225.6769,353.6205,223.888,355.4093,218.5214,349.1483,226.1241" style="stroke:#475569;stroke-width:1;"/><path d="M491.8316,154.7824 C449.4543,175.9711 399.5367,200.9299 354.5149,223.4408" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="90.041" x="462" y="189.9541">liveness / startup</text></g><g class="link" data-entity-1="w" data-entity-2="notready" data-uid="lnk11" id="link_w_notready"><polygon fill="#475569" points="711.4515,225.1888,706.2264,216.8402,707.3061,222.3931,701.7533,223.4728,711.4515,225.1888" style="stroke:#475569;stroke-width:1;"/><path d="M607.0559,154.7824 C638.0398,175.6786 673.3557,199.4963 706.477,221.8339" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="52.0313" x="672" y="189.9541">readiness</text></g><g class="link" data-entity-1="notready" data-entity-2="api" data-uid="lnk13" id="link_notready_api"><polygon fill="#475569" points="1103.326,267.6982,1094.326,263.6982,1098.326,267.6982,1094.326,271.6982,1103.326,267.6982" style="stroke:#475569;stroke-width:1;"/><path d="M1014.5745,267.6982 C1045.8991,267.6982 1070.4031,267.6982 1097.326,267.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="56.7012" x="1031" y="287.9541">Pod status</text></g><g class="link" data-entity-1="api" data-entity-2="eps" data-uid="lnk14" id="link_api_eps"><polygon fill="#475569" points="1208.1628,371.1038,1211.435,361.8144,1207.7655,366.1196,1203.4603,362.45,1208.1628,371.1038" style="stroke:#475569;stroke-width:1;"/><path d="M1202.2526,296.9576 C1203.9622,318.4061 1205.8474,342.0563 1207.686,365.1227" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="1212" y="345.4541">watch</text></g><g class="link" data-entity-1="eps" data-entity-2="kp" data-uid="lnk15" id="link_eps_kp"><polygon fill="#475569" points="1211,505.0275,1215,496.0275,1211,500.0275,1207,496.0275,1211,505.0275" style="stroke:#475569;stroke-width:1;"/><path d="M1211,444.3749 C1211,463.632 1211,481.0657 1211,499.0275" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="31.3477" x="1217" y="479.4541">watch</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="774.1973" x="303.9014" y="591.3301">A correction to the write-up: the kubelet does not 'tell the API server to remove the Pod from endpoints'. It reports a condition;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="867.7334" x="257.1333" y="607.4287">the EndpointSlice controller does the removal. (In chapter 05-18, with the kubelet gone, the node controller flips the same condition instead.)</text></g><!--SRC=[TPNDRkCs4CVlVehfNk80_cWE1GglQo38kbi32zk8iwUc1reQIOGfaY2fUDsYG4zzWA9Fk4-oCvGioNOB981CSMR-yviFVITregeKOJAPrd_16EMdgHIv4wMV7X8jng704YUsAjKWoA0GNWg4GxL7XG5SfJtW6xeJM6Vs25__-XUKV4EDteD8WWUZWLo0DYcEmA58PVSk5CvKUH4l94O7PnHO9JGE1WwJ87HEyTvjrl3oonBMcm_Bw3zq0jx1V9wJ3xjOWF0n2Fmn0EXPp_UBZSP6tj6u0pgmzC_n16bne_FFJEQLmxI-Ef_k5oF8f9CwFsU8JffqXtGrzQzwxkNlE7juM1GXs8y4OmeXiJkJ7E9pxcmIvNhK0VQdlcmEaJ056JogZE8uKxQO89ZulDryWDKMXfyzkl5ZJcvcqS4u2fpEIPINHY_kvrEMikX9mY-ONBCYG0VVeewfS_s2B166Jy-hUuvB1ysLiXGwXTLwjoBi5rPDE6OlaeHarV2FDznz42vKbc2qBP49gJ1bk33aPmB-KZZqXL4fTqTIO7h_glizHeuEKgbhwJMwwEdht_-GROosDKecf_u976KeO2-IWycoIO_HyYqIVMez2ciRVPtUY7f4FfG2wf_69sTmZNnBgQWJA9C85T4V4AsF7TUqa0QPnIGUjolg2lV6MNYeTCnRx1LEUcZt8gsvSl8tQBj1weXUOYk5koqtMPr-oeJo-Agvl4Sd0zQtjYQzyq3fXShF67eBnZ-pMIJDDlIgE-1Pa86wq4VcFxFhFkIr2GMdJtcsx2Qm9Qfyoigahj2_ft92fYG1uqhnql1LmYFIHqAhGUhpf8UOpE3FYrMngbV5qsRzyhpv1DjFZ-jbkoC-6jCWJUn_R8ckAZLC7uphs3HaeBAf27YbHbXvuswfKska3Zjgo7QxgTev3ECSTuTZ6ZQHewFMFuf0G-0v9c4vLv7uOUEmhk8CcZ9AtQodaWsPwewIe9XKpGiDFe9e6L1ptcW-RvSl9rvcbFZJUWMKhwYtShqJpJaWxwg8YQf6IoxjnORWH9R9f5rb172rlHHmi5oy8unJSzJZHUnpc7MZDuLcV_JkdCjEzze964J3yQ-5J5FKlpcP5w5tTT3QZC-lg5pae2lgW0_E8NXePn2hCE3dLfvjZmU9iDppC9UBHogjOuhykyasJjMuihEBzPiQZ7qBTm59yDKYuDsBfNd3bbVy9foBxkyciEBIM-FemocwmNi_dqhUGtB1Xl_NTNLqlX6Z23M1uKe3hHqRwEttFumVVXpLgxAlEJUQjb_xOUhvguULttXHOYS797K4uPxSiwvl]--></g></svg>