<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="593px" preserveAspectRatio="none" style="width:1127px;height:593px;background:#FFFFFF;" version="1.1" viewBox="0 0 1127 593" width="1127px" zoomAndPan="magnify"><title>Three gatekeepers for the same numbers &#8212; at three different moments</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="607.1748" x="256.4087" y="30.8838">Three gatekeepers for the same numbers &#8212; at three different moments</text></g><!--cluster q--><g class="cluster" data-entity="q" data-source-line="4" data-uid="ent0002" id="cluster_q"><rect fill="#F0FDF4" height="139" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="790" x="176.4961" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="473.8843" x="334.554" y="71.8921">1 &#183; ADMISSION &#8212; the ResourceQuota admission controller, in the API server</text></g><!--cluster s--><g class="cluster" data-entity="s" data-source-line="8" data-uid="ent0004" id="cluster_s"><rect fill="#F8FAFC" height="124" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="774" x="176.4961" y="235.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="317.1289" x="404.9316" y="253.8921">2 &#183; SCHEDULING &#8212; kube-scheduler (chapter 05-05)</text></g><!--cluster k--><g class="cluster" data-entity="k" data-source-line="12" data-uid="ent0006" id="cluster_k"><rect fill="#FEF2F2" height="139" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="698" x="176.4961" y="402.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="360.4263" x="345.283" y="420.8921">3 &#183; RUNTIME &#8212; the kubelet and the Linux kernel (cgroups)</text></g><!--entity q1--><g class="entity" data-entity="q1" data-source-line="5" data-uid="ent0003" id="entity_q1"><rect fill="#DCFCE7" height="98.144" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="738.8486" x="218.9961" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="442.0381" x="232.9961" y="112.8921">Question: would this object push the NAMESPACE over its hard limits?</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="710.8486" x="232.9961" y="127.8408">Sums the requests/limits (and object counts) of everything already in the namespace, adds the new Pod, compares</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.4854" x="232.9961" y="142.7896">with spec.hard. Over &#8594;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.8481" x="381.0933" y="142.7896">403 Forbidden</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="328.7324" x="469.9414" y="142.7896">, the Pod is never stored, the scheduler never sees it.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="650.7617" x="232.9961" y="155.8623">exceeded quota: limited, requested: requests.memory=300Mi, used: requests.memory=768Mi, limited: requests.memory=1Gi</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="550.0913" x="232.9961" y="168.5112">Enforced by the CONTROL PLANE &#8212; not the kubelet. Looks at DECLARED numbers, never at real usage.</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="9" data-uid="ent0005" id="entity_s1"><rect fill="#FFFFFF" height="83.1953" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="723.4365" x="218.9961" y="268.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="373.623" x="232.9961" y="294.8921">Question: which NODE has room for this Pod's REQUESTS?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="636.9365" x="232.9961" y="309.8408">Compares requests with each node's allocatable capacity minus requests already placed there. No node fits &#8594;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2764" x="873.5444" y="309.8408">Pending</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="924.8208" y="309.8408">.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="573.5845" x="232.9961" y="322.9136">Knows nothing about quotas. A Pod can be well inside its namespace quota and still Pending &#8212; quota is not capacity.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="117.3906" x="232.9961" y="335.5625">Limits play no part here.</text></g><!--entity k1--><g class="entity" data-entity="k1" data-source-line="13" data-uid="ent0007" id="entity_k1"><rect fill="#FEE2E2" height="98.144" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="647.0488" x="218.9961" y="435.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="397.2427" x="232.9961" y="461.8921">Question: is this RUNNING container using more than its LIMIT?</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="441.3398" x="232.9961" y="476.8408">CPU over its limit &#8594; THROTTLED.   Memory over its limit &#8594; OOMKilled.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="619.0488" x="232.9961" y="491.7896">Node short of memory &#8594; the kubelet EVICTS Pods, BestEffort first, then Burstable, Guaranteed last.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="593.6831" x="232.9961" y="504.8623">'The kubelet enforces running container CPU and memory limits, while ResourceQuota blocks over-quota objects</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="133.4287" x="232.9961" y="517.5112">before they are admitted.'</text></g><g class="link" data-entity-1="q" data-entity-2="s" data-uid="lnk8" id="link_q_s"><polygon fill="#475569" points="192.4961,235.6916,196.4961,226.6916,192.4961,230.6916,188.4961,226.6916,192.4961,235.6916" style="stroke:#475569;stroke-width:1;"/><path d="M192.4961,192.7009 C192.4961,193.5786 192.4961,194.461 192.4961,195.3477 C192.4961,197.1213 192.4961,198.9122 192.4961,200.7171 C192.4961,207.9366 192.4961,215.3791 192.4961,222.8229 C192.4961,226.5448 192.4961,230.267 192.4961,233.9618 C192.4961,234.4236 192.4961,234.885 192.4961,235.346 C192.4961,235.4612 192.4961,229.5764 192.4961,229.6916" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.0664" x="198.4961" y="219.9541">admitted and stored</text></g><g class="link" data-entity-1="s" data-entity-2="k" data-uid="lnk9" id="link_s_k"><polygon fill="#475569" points="192.4961,402.5541,196.4961,393.5541,192.4961,397.5541,188.4961,393.5541,192.4961,402.5541" style="stroke:#475569;stroke-width:1;"/><path d="M192.4961,360.078 C192.4961,360.29 192.4961,360.5024 192.4961,360.7152 C192.4961,361.1407 192.4961,361.5676 192.4961,361.996 C192.4961,362.8528 192.4961,363.7152 192.4961,364.5828 C192.4961,368.0533 192.4961,371.6073 192.4961,375.2171 C192.4961,382.4366 192.4961,389.8791 192.4961,397.3229 C192.4961,398.2534 192.4961,399.1838 192.4961,400.1139 C192.4961,400.579 192.4961,401.0439 192.4961,401.5087 C192.4961,401.7411 192.4961,401.9734 192.4961,402.2057 C192.4961,402.3219 192.4961,396.438 192.4961,396.5541" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.123" x="198.4961" y="386.9541">bound to a node and started</text></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1109.9922" x="5" y="561.8301">A correction to the lecture's comparison table: quota does not affect SCHEDULING &#8212; it decides whether a Pod is CREATED at all. Scheduling is purely requests vs node capacity.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="821.7959" x="149.0981" y="577.9287">And quotas never act retroactively: lowering a quota below current usage evicts nothing; it only blocks new objects until usage drops.</text></g><!--SRC=[VLRRRY9747tdAohxubq91ZlE9X4XH1WcNhJS33XFVkcPBg33J3VkxZ5BeaXvoWT4-PUyvrFsIrBLCrpMNgs4n0nLNRTpwZHVAPrcXKI8ecRvySPahYcLM5cHk-OcrQBXrvXZj2tohEQLpn0MQui8A-5nWxX5ws1fB90RE94Zw29F-CUFV_u3mjFlx2tLSeaMjOVSvFJbQZMBgHTwHG5VNS5__qAtFnhCvuF9E9paS3Dqfh0ftXN62n0oLyufeo4rsbkJPMZhe7HmxKu7uD0-eNq5