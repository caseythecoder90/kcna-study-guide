<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="489px" preserveAspectRatio="none" style="width:1209px;height:489px;background:#FFFFFF;" version="1.1" viewBox="0 0 1209 489" width="1209px" zoomAndPan="magnify"><title>What helm create generates &#8212; and how values become manifests</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="563.1855" x="315.4072" y="30.8838">What helm create generates &#8212; and how values become manifests</text></g><!--cluster files--><g class="cluster" data-entity="files" data-source-line="5" data-uid="ent0002" id="cluster_files"><rect fill="#F8FAFC" height="247" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="451" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.5972" x="168.7014" y="71.8921">helm create flappy-app</text></g><!--cluster vals--><g class="cluster" data-entity="vals" data-source-line="9" data-uid="ent0004" id="cluster_vals"><rect fill="#F8FAFC" height="129" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="276" x="101.5" y="308.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="203.7026" x="137.6487" y="326.8921">Values, lowest to highest priority</text></g><!--cluster render--><g class="cluster" data-entity="render" data-source-line="13" data-uid="ent0006" id="cluster_render"><rect fill="#F0FDF4" height="187" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="356" x="486" y="177.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="197.9136" x="565.0432" y="195.8921">Rendering &#8212; on YOUR machine</text></g><!--entity api--><g class="entity" data-entity="api" data-source-line="17" data-uid="ent0008" id="entity_api"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="167.4517" x="1036" y="262.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="139.4517" x="1050" y="288.3921">Kubernetes API server</text></g><!--entity f1--><g class="entity" data-entity="f1" data-source-line="6" data-uid="ent0003" id="entity_f1"><rect fill="#FFFFFF" height="205.085" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="435.2256" x="22" y="87.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.1899" x="36" y="113.3921">Chart.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.3262" x="106.8018" y="113.3921">&#8212; the chart's identity: apiVersion v2, name,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.2427" x="36" y="128.3408">version</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.2744" x="85.8545" y="128.3408">(chart, SemVer, required),</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.7954" x="239.7407" y="128.3408">appVersion</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.6099" x="314.1479" y="128.3408">(the app inside)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.7153" x="36" y="143.2896">values.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.7915" x="113.3271" y="143.2896">&#8212; the DEFAULT values every template can read</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6309" x="36" y="158.2383">charts/</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.7261" x="82.2427" y="158.2383">&#8212; dependency charts (subcharts), empty at first</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.6772" x="36" y="173.187">.helmignore</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.0806" x="113.2891" y="173.187">&#8212; like .gitignore for helm package (hidden file)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.3018" x="36" y="188.1357">templates/</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9287" x="103.9136" y="188.1357">&#8212; Kubernetes YAML with Go-template placeholders:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.3779" x="46.8354" y="203.0845">deployment.yaml &#183; service.yaml &#183; serviceaccount.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.6416" x="46.8354" y="218.0332">ingress.yaml &#183; hpa.yaml &#183; httproute.yaml (Helm 4)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.8354" x="36" y="232.9819">&#160;&#160;&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.9663" x="46.8354" y="232.9819">_helpers.tpl</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.4351" x="123.4136" y="232.9819">&#8212; named snippets (names, labels); renders nothing</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.8354" x="36" y="247.9307">&#160;&#160;&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.2827" x="46.8354" y="247.9307">NOTES.txt</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4307" x="114.73" y="247.9307">&#8212; usage text printed after install</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.8354" x="36" y="262.8794">&#160;&#160;&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.9854" x="46.8354" y="262.8794">tests/test-connection.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.6816" x="214.4326" y="262.8794">&#8212; a Pod run by helm test</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="407.2256" x="36" y="275.9521">A working nginx app out of the box: you edit values, not templates, to make it yours.</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="10" data-uid="ent0005" id="entity_v1"><rect fill="#FFFFFF" height="87.7949" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="260.3306" x="109.5" y="341.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.02" x="123.5" y="367.8921">1  the chart's</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.7153" x="201.1318" y="367.8921">values.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.8999" x="123.5" y="382.8408">2  a parent chart's values.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="123.5" y="397.7896">3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="68.6245" x="137.9536" y="397.7896">-f / --values</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.5381" x="210.1899" y="397.7896">files (last one wins)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.23" x="123.5" y="412.7383">4</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.5835" x="137.9536" y="412.7383">--set key=value</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.6816" x="235.1489" y="412.7383">on the command line</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="14" data-uid="ent0007" id="entity_r1"><rect fill="#DCFCE7" height="145.29" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="339.5811" x="494" y="211.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.8271" x="508" y="237.3921">templates/deployment.yaml:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41.9009" x="508" y="252.3408">image:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="188.7729" x="553.5127" y="252.3408">'{{ .Values.image.repository }}:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="311.5811" x="508" y="267.2896">{{ .Values.image.tag | default .Chart.AppVersion }}'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="508" y="282.2383">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="245.2988" x="508" y="297.187">+ .Values  .Chart  .Release  .Capabilities</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="508" y="312.1357">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="162.519" x="508" y="327.0845">&#8594; plain Kubernetes YAML</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="220.6284" x="508" y="340.1572">helm template . shows it without installing</text></g><g class="link" data-entity-1="f1" data-entity-2="r1" data-uid="lnk9" id="link_f1_r1"><polygon fill="#475569" points="493.8837,246.0724,485.9673,240.2133,489.0031,244.9865,484.2299,248.0223,493.8837,246.0724" style="stroke:#475569;stroke-width:1;"/><path d="M457.0101,237.8685 C469.382,240.6211 475.8731,242.0653 488.027,244.7693" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v1" data-entity-2="r1" data-uid="lnk10" id="link_v1_r1"><polygon fill="#475569" points="493.8297,324.5393,484.1424,322.7632,488.9694,325.7127,486.0198,330.5397,493.8297,324.5393" style="stroke:#475569;stroke-width:1;"/><path d="M369.5597,354.5406 C408.7516,345.0789 446.5827,335.9457 487.9973,325.9474" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r1" data-entity-2="api" data-uid="lnk11" id="link_r1_api"><polygon fill="#475569" points="1035.7118,283.6982,1026.7118,279.6982,1030.7118,283.6982,1026.7118,287.6982,1035.7118,283.6982" style="stroke:#475569;stroke-width:1;"/><path d="M834.1891,283.6982 C903.0306,283.6982 973.4522,283.6982 1029.7118,283.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.7578" x="858" y="261.9541">apply the rendered manifests</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.7422" x="866.5078" y="275.7529">+ store the release Secret</text></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="715.4902" x="239.2549" y="457.8301">Note the default: image.tag is empty, so the image tag falls back to Chart.yaml's appVersion (1.16.0 in the scaffold).</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="499.625" x="347.1875" y="473.9287">Change the repository without setting a tag and Helm pulls &lt;your-image&gt;:1.16.0.</text></g><!--SRC=[PLNTRjis5BxtKvpr9WvgotDNxCBp31XRrmthsY9fCnGmCD3IaKI48ZcISgAbANQr1nZsBhlVe_H9TWufouu310v5dT_lVEVJ5rBdgYqGicoM_e8noiyAAIed6Z-xphMOXXeRp6pRg972Ca0mu6HL1oYampn8eqT11eNmQoq2rAWQo1sAW52XHaS73v___0U4Bg0sDx0JggMhBUQcGMY4bYNwu4SZZYPqHP6U74SfbR2sczBF4rWkAsTQkrg1y51AHN7kHW17diljwhjQk91reb7BsNOLSrCFaFFrcGTPeAQ2kmK8Aw_