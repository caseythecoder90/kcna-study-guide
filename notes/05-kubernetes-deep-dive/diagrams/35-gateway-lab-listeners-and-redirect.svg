<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="545px" preserveAspectRatio="none" style="width:1087px;height:545px;background:#FFFFFF;" version="1.1" viewBox="0 0 1087 545" width="1087px" zoomAndPan="magnify"><title>The lab's final state &#8212; two listeners, two routes, and why each route names a sectionName</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="777.4893" x="151.2427" y="30.8838">The lab's final state &#8212; two listeners, two routes, and why each route names a sectionName</text></g><!--cluster gw--><g class="cluster" data-entity="gw" data-source-line="4" data-uid="ent0002" id="cluster_gw"><rect fill="#F8FAFC" height="135" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="536" x="103.4873" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="512.2051" x="115.3848" y="71.8921">Gateway  edge-gw   (gateway-system)   ADDRESS 172.18.0.4   PROGRAMMED True</text></g><!--cluster rr--><g class="cluster" data-entity="rr" data-source-line="10" data-uid="ent0006" id="cluster_rr"><rect fill="#FEF2F2" height="122" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="462" x="84.4873" y="196.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="249.1582" x="190.9082" y="214.8921">HTTPRoute  http-filter-redirect   (default)</text></g><!--cluster mr--><g class="cluster" data-entity="mr" data-source-line="14" data-uid="ent0008" id="cluster_mr"><rect fill="#F0FDF4" height="122" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="464" x="554.4873" y="196.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="237.6309" x="667.6719" y="214.8921">HTTPRoute  mygateway-app   (default)</text></g><!--cluster why--><g class="cluster" data-entity="why" data-source-line="18" data-uid="ent0010" id="cluster_why"><rect fill="#F8FAFC" height="167" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="736" x="134.4873" y="326.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="185.6626" x="409.656" y="344.8921">Why the sectionNames matter</text></g><!--entity lh--><g class="entity" data-entity="lh" data-source-line="5" data-uid="ent0003" id="entity_lh"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="193.6606" x="136.4873" y="93.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.0063" x="150.4873" y="119.3921">listener  http</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="122.2192" x="150.4873" y="132.4648">protocol HTTP &#183; port 80</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="165.6606" x="150.4873" y="145.1138">hostname mygateway-app.local</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="125.8984" x="150.4873" y="157.7627">allowedRoutes: from All</text></g><!--entity ls--><g class="entity" data-entity="ls" data-source-line="6" data-uid="ent0004" id="entity_ls"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="256.6421" x="360.9873" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.2363" x="374.9873" y="112.8921">listener  https</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="135.6738" x="374.9873" y="125.9648">protocol HTTPS &#183; port 443</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="165.6606" x="374.9873" y="138.6138">hostname mygateway-app.local</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="104.5215" x="374.9873" y="151.2627">tls.mode: Terminate</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.6421" x="374.9873" y="163.9116">certificateRefs &#8594; Secret mygateway-app-tls</text></g><!--entity rr1--><g class="entity" data-entity="rr1" data-source-line="11" data-uid="ent0007" id="entity_rr1"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="411.2813" x="126.9873" y="229.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.5718" x="140.9873" y="255.8921">parentRefs: edge-gw</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.4009" x="276.7827" y="255.8921">sectionName: http</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="383.2813" x="140.9873" y="268.9648">rules: one rule, NO matches  &#8594;  defaults to PathPrefix /  &#8594;  every request</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="307.4736" x="140.9873" y="281.6138">filters: RequestRedirect { scheme: https, statusCode: 301 }</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="300.7705" x="140.9873" y="294.2627">No backendRefs at all: a redirect answers the client itself.</text></g><!--entity mr1--><g class="entity" data-entity="mr1" data-source-line="15" data-uid="ent0009" id="entity_mr1"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="413.3975" x="596.9873" y="229.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.5718" x="610.9873" y="255.8921">parentRefs: edge-gw</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6309" x="746.7827" y="255.8921">sectionName: https</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="189.4653" x="610.9873" y="268.9648">/       PathPrefix &#8594; nginx-frontend:80</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="385.3975" x="610.9873" y="281.6138">/api    PathPrefix &#8594; nginx-api:80  weight 50   +   nginx-api-v2:80  weight 50</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="194.3691" x="610.9873" y="294.2627">/admin  PathPrefix &#8594; nginx-admin:80</text></g><!--entity why1--><g class="entity" data-entity="why1" data-source-line="19" data-uid="ent0011" id="entity_why1"><rect fill="#326CE5" height="125.7417" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="685.3442" x="176.9873" y="359.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="657.3442" x="190.9873" y="385.8921">Without sectionName, a route attaches to EVERY listener that will accept it. If the main route stayed on the</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="635.6035" x="190.9873" y="400.8408">http listener too, then on port 80 /api, /admin and even / would match the MAIN route &#8212; /api and /admin</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="545.4287" x="190.9873" y="415.7896">because a longer PathPrefix wins, and / because on an exact tie the OLDEST route wins.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="634.4175" x="190.9873" y="428.8623">Pinning the redirect to http and the app to https makes port 80 answer only with redirects, and port 443 only with the app.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="190.9873" y="443.3872">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="325.1982" x="190.9873" y="456.46">curl http://mygateway-app.local       &#8594; 301 Moved Permanently</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="501.1929" x="190.9873" y="469.1089">curl -L http://mygateway-app.local/api &#8594; 301 &#8594; https &#8594; nginx-api or nginx-api-v2, roughly 50/50</text></g><g class="link" data-entity-1="lh" data-entity-2="rr" data-uid="lnk12" id="link_lh_rr"><polygon fill="#475569" points="117.5632,196.5996,126.2246,191.9114,120.6147,192.6388,119.8873,187.0289,117.5632,196.5996" style="stroke:#475569;stroke-width:1;"/><path d="M140.5764,174.3878 C136.2397,177.6297 132.0848,181.1023 128.2053,184.817 C126.2656,186.6743 124.3948,188.5921 122.6045,190.5719 C121.7094,191.5617 120.8344,192.5671 119.9811,193.5881 C119.5544,194.0986 119.1331,194.613 118.7174,195.1314 C118.5096,195.3905 118.3031,195.6507 118.0981,195.9118 C117.9956,196.0424 117.8934,196.1732 117.7916,196.3043 C117.7407,196.3698 117.6899,196.4354 117.6392,196.5011 C117.6138,196.5339 121.2503,191.8138 121.225,191.8466" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ls" data-entity-2="mr" data-uid="lnk13" id="link_ls_mr"><polygon fill="#475569" points="554.4815,204.4039,554.2983,194.5567,552.3662,199.8734,547.0495,197.9412,554.4815,204.4039" style="stroke:#475569;stroke-width:1;"/><path d="M539.457,180.7227 C543.5473,185.8448 547.3184,191.2046 550.4873,196.6982 C551.9145,199.1723 550.7054,196.3164 551.9431,198.9673" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="rr" data-entity-2="why" data-uid="lnk14" id="link_rr_why"><polygon fill="#475569" points="134.4648,373.4705,135.4233,363.6684,132.8884,368.7255,127.8313,366.1907,134.4648,373.4705" style="stroke:#475569;stroke-width:1;"/><path d="M116.3906,319.0672 C117.3678,322.0086 118.3665,325.0147 119.3794,328.0636 C121.4053,334.1614 123.4882,340.4309 125.5703,346.698 C127.6524,352.9651 129.7337,359.2299 131.7565,365.3185 C132.2622,366.8407 132.7642,368.3518 133.2617,369.8492 C133.5105,370.5979 133.7581,371.3432 134.0044,372.0847 C134.1276,372.4555 134.2504,372.8253 134.373,373.1941 C134.4036,373.2863 132.5425,367.6845 132.5731,367.7765" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="mr" data-entity-2="why" data-uid="lnk15" id="link_mr_why"><polygon fill="#475569" points="167.6921,326.5376,177.3282,324.5016,171.7426,323.6062,172.638,318.0207,167.6921,326.5376" style="stroke:#475569;stroke-width:1;"/><path d="M554.4146,315.4992 C554.3336,315.5772 554.2522,315.6549 554.1703,315.732 C554.0067,315.8864 553.8414,316.039 553.6744,316.1898 C553.3405,316.4915 553,316.7859 552.6527,317.0727 C551.9582,317.6462 551.2368,318.1893 550.4873,318.6982 C541.6842,324.6766 449.9785,323.2194 358.4514,321.9962 C312.6879,321.3845 266.969,320.8314 231.6799,321.2955 C214.0354,321.5276 198.9983,322.014 187.8668,322.8745 C182.3011,323.3047 177.7117,323.8285 174.2611,324.4608 C172.5357,324.777 171.095,325.1202 169.9593,325.4925 C169.3915,325.6787 168.8998,325.8721 168.487,326.0729 C168.2806,326.1734 168.0938,326.2757 167.9271,326.3799 C167.8438,326.432 172.6261,322.9669 172.5528,323.02" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="27"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1069.9746" x="5" y="513.8301">The redirect is a first-class field of the API &#8212; RequestRedirect, with a scheme and a status code &#8212; where Ingress needed a controller-specific annotation for the same thing.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1011.2402" x="34.3672" y="529.9287">Status codes allowed: 301, 302 (the default), 303, 307, 308. The lecture's curl https worked without -k because the self-signed cert was added to the OS trust store.</text></g><!--SRC=[fLRRRkCs47ttLqptfRke9SUR11iOXe6q2T80cyImZIwAfW-qD9A8KAHBKb7SnG9zwWSK_PU-zrFsIpgZM-J4sG9ja3WMEPpBcNE6-ahgI1KnGXYEwbzlZ7AZM8hKYjoDxY8j0fzXZk6coDN0IwyGLXc24kkl7IHI2mNE2u_m-RS_mPS6b7GUDLeth1wjAJpITw5ZABCje8YoUX6qoD6108UHbqPVq-DWOEb1w9J2lBeWjwNO0c2SOf2M0F0whTS2jwKe-HjQEZqxMvmlbp1-zpOSduG7uH4jpXSt5ulJgwlpCrZP0b_1T9fIqCri1i81kVeu0EY5cgvdRTu0cVURwMWzkzLJ9t_5oNWysrZZJMGKVBzQpU7lls1Zh8UJW-c8BVgMcN6U2uDys-OgDfjGcKYevzP2ALDYlAX0ca1YJGwdgZNajDSYhfDMsR-axBwKyx9B-kZeyFzcxPKBSnFZ15PeS-A0n-T64Lel4ndHvW8J1vz__mEM65dqkq42yjQhDpMcBTXHmIg3uATCnZ7gdwrCCn_CUEFJ3b6um0h26eWWaSgZ3Ip6agsODp4ceb3-JSU4RrjShNrAXesmg3qdFNca7i7Tu-ba7qbieRY9HYF