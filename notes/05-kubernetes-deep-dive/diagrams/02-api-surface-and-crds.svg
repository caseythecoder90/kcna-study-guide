<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="862px" preserveAspectRatio="none" style="width:1468px;height:862px;background:#FFFFFF;" version="1.1" viewBox="0 0 1468 862" width="1468px" zoomAndPan="magnify"><title>kubectl is an HTTP client &#8212; and the API it calls can be extended</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="547.1367" x="452.9316" y="30.8838">kubectl is an HTTP client &#8212; and the API it calls can be extended</text></g><!--cluster parts--><g class="cluster" data-entity="parts" data-source-line="6" data-uid="ent0003" id="cluster_parts"><rect fill="#F8FAFC" height="453.5" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="496" x="14" y="129.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="162.5635" x="180.7183" y="147.8921">The same line, taken apart</text></g><!--cluster groups--><g class="cluster" data-entity="groups" data-source-line="16" data-uid="ent0011" id="cluster_groups"><rect fill="#F0FDF4" height="135" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="875" x="587" y="226.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="261.4917" x="893.7542" y="244.8921">Two shapes of path, and that is all there is</text></g><!--cluster crd--><g class="cluster" data-entity="crd" data-source-line="26" data-uid="ent0017" id="cluster_crd"><rect fill="#F0FDF4" height="215" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="532" x="737" y="595.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="299.0317" x="853.4841" y="613.8921">CRDs extend the API &#8212; the fourth study-tip area</text></g><!--entity cmd--><g class="entity" data-entity="cmd" data-source-line="4" data-uid="ent0002" id="entity_cmd"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="624.981" x="181.5" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.8408" x="195.5" y="79.8921">kubectl get nodes --v=6</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="377.7383" x="195.5" y="92.9648">I0722 16:51:26  loader.go:373] Config loaded from file: /root/.kube/config</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="596.981" x="195.5" y="105.6138">I0722 16:51:26  round_trippers.go:553] GET https://127.0.0.1:6443/api/v1/nodes?limit=500 200 OK in 3 milliseconds</text></g><!--entity why--><g class="entity" data-entity="why" data-source-line="22" data-uid="ent0015" id="entity_why"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="308.0327" x="558" y="389.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.5488" x="572" y="415.8921">This is why apiVersion looks inconsistent</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="272.0781" x="572" y="428.9648">kind: Pod &#8594; apiVersion: v1          (core group, no name)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="280.0327" x="572" y="441.6138">kind: Deployment &#8594; apiVersion: apps/v1   (named group)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="272.0674" x="572" y="454.2627">Not a quirk &#8212; it is the REST path written into the object.</text></g><!--entity list--><g class="entity" data-entity="list" data-source-line="24" data-uid="ent0016" id="entity_list"><rect fill="#F1F5F9" height="80.8955" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="468.6982" x="518.5" y="506.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.9834" x="532.5" y="532.8921">Listing what a cluster actually serves</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="440.6982" x="532.5" y="545.9648">kubectl api-resources &#8212; NAME &#183; SHORTNAMES &#183; APIVERSION &#183; NAMESPACED &#183; KIND</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="293.4604" x="532.5" y="558.6138">kubectl api-versions &#8212; every group/version the server offers</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="335.0864" x="532.5" y="571.2627">Both read the LIVE server, so they include anything added by a CRD</text></g><!--entity m--><g class="entity" data-entity="m" data-source-line="7" data-uid="ent0004" id="entity_m"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="444.9097" x="22.5" y="162.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.2764" x="36.5" y="188.8921">METHOD  GET</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="416.9097" x="36.5" y="201.9648">get&#8594;GET &#183; create&#8594;POST &#183; apply/replace&#8594;PUT &#183; patch&#8594;PATCH &#183; delete&#8594;DELETE</text></g><!--entity h--><g class="entity" data-entity="h" data-source-line="8" data-uid="ent0005" id="entity_h"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="332.7451" x="78.5" y="278.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.1016" x="92.5" y="304.8921">HOST  https://127.0.0.1:6443</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="304.7451" x="92.5" y="317.9648">read from /.kube/config &#8212; the context's cluster (chapter 04-04)</text></g><!--entity p--><g class="entity" data-entity="p" data-source-line="9" data-uid="ent0006" id="entity_p"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="159.4629" x="165.5" y="402.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.228" x="179.5" y="428.3921">PATH  /api/v1/nodes</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.4629" x="179.5" y="441.4648">group + version + resource</text></g><!--entity q--><g class="entity" data-entity="q" data-source-line="10" data-uid="ent0007" id="entity_q"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="282.6807" x="103.5" y="519.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.6807" x="117.5" y="545.3921">QUERY  ?limit=500     RESPONSE  200 OK</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="122.2998" x="117.5" y="558.4648">kubectl paginates for you</text></g><!--entity core--><g class="entity" data-entity="core" data-source-line="17" data-uid="ent0012" id="entity_core"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="418.5967" x="629.5" y="266.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="222.479" x="643.5" y="292.3921">CORE group &#8212; also called LEGACY</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="105.1338" x="643.5" y="305.4648">REST path /api/v1/...</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="220.0376" x="643.5" y="318.1138">apiVersion: v1 &#8212; the group is NOT named</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="390.5967" x="643.5" y="330.7627">Pod &#183; Service &#183; Node &#183; Namespace &#183; ConfigMap &#183; Secret &#183; PersistentVolume</text></g><!--entity named--><g class="entity" data-entity="named" data-source-line="18" data-uid="ent0013" id="entity_named"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="386.832" x="1066.5" y="259.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="95.3291" x="1080.5" y="285.8921">NAMED groups</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.9199" x="1080.5" y="298.9648">REST path /apis/GROUP/VERSION/...</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="155.8638" x="1080.5" y="311.6138">apiVersion: GROUP/VERSION</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="344.1528" x="1080.5" y="324.2627">apps/v1 Deployment &#183; batch/v1 Job &#183; networking.k8s.io/v1 Ingress</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="358.832" x="1080.5" y="336.9116">rbac.authorization.k8s.io/v1 Role &#183; discovery.k8s.io/v1 EndpointSlice</text></g><!--entity crdb--><g class="entity" data-entity="crdb" data-source-line="27" data-uid="ent0018" id="entity_crdb"><rect fill="#DCFCE7" height="174.0376" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="481.6543" x="779" y="628.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="453.6543" x="793" y="654.8921">Install a CustomResourceDefinition and the API server grows a new path.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="287.2891" x="793" y="667.9648">apiVersion: mysql.oracle.com/v2 &#183; kind: InnoDBCluster</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="283.6636" x="793" y="680.6138">&#8594; served at /apis/mysql.oracle.com/v2/innodbclusters</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="793" y="695.1387">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="404.6367" x="793" y="708.2114">From that moment it is a first-class citizen: kubectl get innodbclusters works,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="377.1636" x="793" y="720.8604">RBAC covers it, it is stored in etcd, it appears in api-resources, it can be</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="437.6099" x="793" y="733.5093">watched. An OPERATOR is a controller watching that new kind and reconciling it &#8212;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="366.6953" x="793" y="746.1582">the same control loop the built-in controllers use, for your own object.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="793" y="760.6831">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="397.8477" x="793" y="773.7559">Note what a CRD does NOT bring: no behaviour. A CRD adds the NOUN; the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="148.5269" x="793" y="786.4048">operator supplies the VERB.</text></g><g class="link" data-entity-1="core" data-entity-2="named" data-uid="lnk14" id="link_core_named"><polygon fill="#475569" points="1066.4255,306.6982,1057.4255,302.6982,1061.4255,306.6982,1057.4255,310.6982,1066.4255,306.6982" style="stroke:#475569;stroke-width:1;"/><path d="M1048.6777,306.6982 C1054.5937,306.6982 1054.5096,306.6982 1060.4255,306.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="cmd" data-entity-2="parts" data-uid="lnk19" id="link_cmd_parts"><polygon fill="#475569" points="494,129.5023,498,120.5023,494,124.5023,490,120.5023,494,129.5023" style="stroke:#475569;stroke-width:1;"/><path d="M494,121.7694 C494,124.2145 494,126.7217 494,129.2638 C494,129.3433 494,123.4228 494,123.5023" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="parts" data-entity-2="groups" data-uid="lnk20" id="link_parts_groups"><polygon fill="#475569" points="586.9962,288.9603,583.6676,279.6909,583.5408,285.3464,577.8853,285.2196,586.9962,288.9603" style="stroke:#475569;stroke-width:1;"/><path d="M510.1902,208.6311 C510.2941,208.7398 510.3984,208.8488 510.503,208.9583 C510.7123,209.1771 510.923,209.3975 511.1352,209.6195 C514.5305,213.1705 518.2989,217.1117 522.3162,221.3133 C530.3509,229.7166 539.3815,239.1614 548.4152,248.6095 C557.4489,258.0576 566.4857,267.509 574.5328,275.9252 C578.5564,280.1333 582.3325,284.0827 585.7371,287.6435 C586.1627,288.0886 582.436,284.1909 582.8497,284.6236" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="groups" data-entity-2="why" data-uid="lnk21" id="link_groups_why"><polygon fill="#475569" points="646.8306,389.6405,642.4356,380.8267,642.9744,386.4578,637.3433,386.9966,646.8306,389.6405" style="stroke:#475569;stroke-width:1;"/><path d="M620,361.6982 C627.3811,372.0066 632.1942,377.5603 642.2032,385.8213" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="why" data-entity-2="list" data-uid="lnk22" id="link_why_list"><polygon fill="#475569" points="738.8641,506.5488,739.6095,496.7282,737.185,501.8392,732.0741,499.4147,738.8641,506.5488" style="stroke:#475569;stroke-width:1;"/><path d="M726.1099,470.7747 C730.233,482.3396 732.7245,489.3278 736.8492,500.8973" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="list" data-entity-2="crd" data-uid="lnk23" id="link_list_crd"><polygon fill="#475569" points="753,595.3697,757,586.3697,753,590.3697,749,586.3697,753,595.3697" style="stroke:#475569;stroke-width:1;"/><path d="M753,588.0791 C753,590.4482 753,586.8823 753,589.3697" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="36"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1398.3525" x="27.3237" y="830.8301">Everything in this repository so far has been an HTTP call to one server. kubectl --v=6 shows the URL, --v=8 adds the request and response bodies &#8212; which is how you crib a JSON payload before writing it into your own client.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1245.1797" x="103.9102" y="846.9287">kubectl proxy publishes the same API, unauthenticated, on localhost:8001, so curl localhost:8001/openapi/v2 fetches the OpenAPI spec that Swagger UI and every generated client library are built from.</text></g><!--SRC=[XLVRSkCs4dttLtJoagHM8YtFjHJ7AO-j7JlnI5f9dgfKDfM2I4Z4cWHe0BIYsSfKdlO3jlPVzdq_9L-Iqo0fIvPcOyioqIGQZTEd3vgVAPtaLIefYkBwuut9NPmgiRIYSF5TeaNNPxAGKLaL-P5NFfTqLyrbudDIZeIcgzbiJ4ckfFRq-s__WIabJA7pyJKfJud8SuTlJND9yXSlTIhJeoCB3q8luUtprjrIUj8cbOu-TZzs7xvv-NTzwjG7sU_rpgwFNvsSKEzb_qMlV_AIA3SYbJPQclwpLyz-eWkZ5sfPMrDQM5FGGkMoJx4rniSHBn4duQ7Jc7sU_H_VrbGw_TbRLPRIEbxZnGkiyNOmeypxqlNZk7VoAZh6Rw__yldpPx4eLVpGYqFmt-QgKFwR5yV7T8A_qVUaD3sZGkMvSX8nfAu9uNCwFHL90jpEpaW0es8Nbnb0TAAGb2ijE-J5dTGaIc4zprmYpBAUo2P7_pn2w8-ptmrcLwDBuh2tzWgCV__Nltah__il9LOABp4UZwR18CeoNyTMbhb8Wlqsc4lXauo7vxEBApQaCfTXukNWPZ0RREq7CvMkeofsuxdYDJu1u5Q02Ab9uCUTj0LgCQqmzA3H5y0hhvoNbhvCCb7onV7pxl7phmv7a-r6WwrS4UqaRXibnfR-GW_8lp8QLrOwKzb47dPUxZh_s-rWyWFH5XFuPpAOZaV3wO0QNcojrrP0APPA8oME5iRIsbI7bxl7SWLrVynKcahzKsfMkdiMTfZjMJcqSizwV_JhBjLMXXnGnCfcmVdEEaqT2n_AFCyPV2ins93lhJ5f7L0OxZ7mOZGPrBTgNSYT2Mg02hqPl3s_-64B0O0p2-jkSX95qNwfujxxEYTzUkXjE54lWZY7enbfb4owFtLiKgRkLDe7bKY-72BhuJyck5BKnbf9tecoVXWbulbgpAk2RTg_DtbLRFDWkO4XCLRkGZ0yVpUuRE3vv6vT_7OokXt7xmUJwVLe-ESxttdyqAEb0u9qYJeswu9r6JkOSn6p-Jipvx6MVcNidTBBwEwrYvJXUzTw2QQxVPzsBf98L3upLdqG7c5ipPgOF62NAfSOrCnwwzv0fwLHsazpbHn6BUGBi35wrBLgcNamjBO-OMc65EEpojRqY0TKtzp1hg4CJOwsIqlfj4-SVCWLFU7FvkVBi7Z8KmTdK5ZzgtqKQcTRk3xrsK8FZs43jSi3deR6aw3xIjcxm68Loeov_CYDbLKUky7El0ctpFmV02CwB0e0PGUi6q21vC8kUAbMB4NYAzJWcXmAOKVqMX72VhgjtBaG7BCubCFLQ3BZmPH7EDyR2eOYOlFu_09qn-Zxw-7b0VYsLcYajLv0CcbghE9MStd38KOBILh0kE_lZG5AuS3WXsyGJZEZGouWjgQsmH5wxJE6GwJS8Sn18BgON6v1MLHUDep4GUrtiCIJhkbTDgrDgpqB0