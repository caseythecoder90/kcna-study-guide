<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="703px" preserveAspectRatio="none" style="width:1706px;height:703px;background:#FFFFFF;" version="1.1" viewBox="0 0 1706 703" width="1706px" zoomAndPan="magnify"><title>Garbage collection is not one thing &#8212; who cleans up what, and when</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="592.0576" x="549.4712" y="30.8838">Garbage collection is not one thing &#8212; who cleans up what, and when</text></g><!--cluster cp--><g class="cluster" data-entity="cp" data-source-line="4" data-uid="ent0002" id="cluster_cp"><rect fill="#F8FAFC" height="614" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="770" x="14" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="567.728" x="115.136" y="71.8921">CONTROL PLANE &#8212; controllers in kube-controller-manager (and cloud-controller-manager)</text></g><!--cluster nd--><g class="cluster" data-entity="nd" data-source-line="13" data-uid="ent0009" id="cluster_nd"><rect fill="#F0FDF4" height="220" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="908" x="792" y="165.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8545" x="1162.5728" y="183.8921">EACH NODE &#8212; the kubelet</text></g><!--entity g1--><g class="entity" data-entity="g1" data-source-line="5" data-uid="ent0003" id="entity_g1"><rect fill="#326CE5" height="70.5464" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="584.2769" x="107" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.5381" x="121" y="112.8921">Garbage collector</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.749" x="235.1499" y="112.8921">&#8212; objects whose OWNER is gone</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="556.2769" x="121" y="127.8408">Follows metadata.ownerReferences. Delete a Deployment &#8594; its ReplicaSets &#8594; their Pods.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="492.7065" x="121" y="140.9136">Also Node Leases: each Lease is owned by its Node, so deleting the Node removes the Lease.</text></g><!--entity g2--><g class="entity" data-entity="g2" data-source-line="6" data-uid="ent0004" id="entity_g2"><rect fill="#FFFFFF" height="72.8462" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="661.0708" x="68.5" y="197.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.8545" x="82.5" y="223.8921">Pod garbage collector (PodGC)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2744" x="278.9663" y="223.8921">&#8212; terminated Pods</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.9014" x="82.5" y="238.8408">Succeeded/Failed Pods once there are more than</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.7617" x="373.0132" y="238.8408">12,500</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2344" x="416.3867" y="238.8408">(--terminated-pod-gc-threshold),</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="633.0708" x="82.5" y="253.7896">plus orphans on deleted nodes, unscheduled terminating Pods, and terminating Pods on out-of-service nodes.</text></g><!--entity g3--><g class="entity" data-entity="g3" data-source-line="7" data-uid="ent0005" id="entity_g3"><rect fill="#FFFFFF" height="70.5464" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="694.5039" x="51.5" y="306.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.0591" x="65.5" y="332.8921">TTL-after-finished controller</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.4917" x="243.1709" y="332.8921">&#8212; finished Jobs</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.9033" x="65.5" y="347.8408">Deletes a Job (and, by cascade, its Pods)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="150.2363" x="309.0151" y="347.8408">ttlSecondsAfterFinished</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.1406" x="462.8633" y="347.8408">after it completes or fails. Unset = kept forever.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="462.7788" x="65.5" y="360.9136">CronJobs trim their own history instead: successfulJobsHistoryLimit 3, failedJobsHistoryLimit 1.</text></g><!--entity g4--><g class="entity" data-entity="g4" data-source-line="8" data-uid="ent0006" id="entity_g4"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="753.4736" x="22.5" y="413.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="173.3799" x="36.5" y="439.8921">PersistentVolume controller</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.498" x="213.4917" y="439.8921">&#8212; released volumes</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.1836" x="36.5" y="454.8408">reclaimPolicy:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.019" x="120.2954" y="454.8408">Delete</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="599.0474" x="162.9263" y="454.8408">(the StorageClass default) removes the PV and its backing storage when the PVC goes (chapter 05-08).</text></g><!--entity g5--><g class="entity" data-entity="g5" data-source-line="9" data-uid="ent0007" id="entity_g5"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="455.7939" x="171" y="507.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="76.5908" x="185" y="533.8921">CSR cleaner</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.4897" x="265.2026" y="533.8921">&#8212; stale CertificateSigningRequests</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2705" x="185" y="548.8408">Approved, denied or failed: deleted after</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.7236" x="419.8823" y="548.8408">1 hour</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.7808" x="459.606" y="548.8408">.  Pending: after</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1836" x="554.9985" y="548.8408">24 hours</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="609.1821" y="548.8408">.</text></g><!--entity g6--><g class="entity" data-entity="g6" data-source-line="10" data-uid="ent0008" id="entity_g6"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="597.7402" x="100" y="601.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="189.979" x="114" y="627.8921">Cloud node lifecycle controller</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.6797" x="307.5908" y="627.8921">(cloud-controller-manager) &#8212; vanished machines</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="569.7402" x="114" y="642.8408">Asks the cloud provider whether an unhealthy node's VM still exists; if not, deletes the Node object.</text></g><!--entity k1--><g class="entity" data-entity="k1" data-source-line="14" data-uid="ent0010" id="entity_k1"><rect fill="#DCFCE7" height="70.5464" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="856.6167" x="834.5" y="198.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.0845" x="848.5" y="224.8921">Unused images</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.2344" x="948.1963" y="224.8921">&#8212; checked every</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="60.6836" x="1058.0425" y="224.8921">5 minutes</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="68.6436" x="848.5" y="239.8408">Disk above</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.1099" x="920.7554" y="239.8408">imageGCHighThresholdPercent 85%</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="296.1943" x="1150.4771" y="239.8408">&#8594; delete least-recently-used images until below</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="223.2217" x="1450.2832" y="239.8408">imageGCLowThresholdPercent 80%</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="1673.5049" y="239.8408">.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="754.8857" x="848.5" y="252.9136">Never images younger than imageMinimumGCAge (2m). imageMaximumGCAge removes long-unused images regardless of disk (off by default).</text></g><!--entity k2--><g class="entity" data-entity="k2" data-source-line="15" data-uid="ent0011" id="entity_k2"><rect fill="#DCFCE7" height="70.5464" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="774.2559" x="876" y="306.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.1436" x="890" y="332.8921">Dead containers</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.2344" x="994.7554" y="332.8921">&#8212; checked every</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.6118" x="1104.6016" y="332.8921">minute</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="746.2559" x="890" y="347.8408">Keeps the last exited instance of each container (so kubectl logs --previous works); removes containers of deleted Pods.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="555.0381" x="890" y="360.9136">Do not run external image/container cleanup tools &#8212; they can remove containers the kubelet still expects.</text></g><g class="caption" data-source-line="26"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="774.915" x="458.0425" y="687.8301">Glossary: 'Garbage collection is a collective term for the various mechanisms Kubernetes uses to clean up cluster resources.'</text></g><!--SRC=[VLRRRXit47tNLqm35940hUIRWi1H1GXoOgDnRCDsqeUw3zGkjMB59RSaruvQDEXJFw3e5-PBUeQhMxH90HlGyZANCsVEy3jbKbrbadgzVlqNhDM-docHEr7u_Y8r8WbpMSXUMHMw5LJGaiw5cufSKcgrbcbGrf3oP6mWQoI5kJ8vVVxhNtgQMqgr5CPJLU9BX2u9a-6NDAsMmrLXSjXxDhc-kh-zlgIRo_7LwtWrjIOuDkyyAKEBQYgJxLfI28C07BNPNAfjbNrbj_ECXiFSsQeSZKXuIalweqMqutSu7UtbOjsmFnt54EpqLonupi9BklxfwlKjfvaZnmVp1iVjawT21f6987hsoKXtAsVIIPDAtwCpgMMG9F2Zr7PPI1Feyz__a8B9MoofLDn9_EOr8AmStTZCznxCqAlVvUdXuMYilQKhY_9SIk6bFoKfqddzmP6mouocosYIptK95pBsonM0qVgsauLzb3uknCkzOPzzZ1WVaQQ8h0OeFsp0WvWetuU8sbW-dtGsK0Nf2cL4G3YSn8Evgs1MPZBhln5AhvR1ZfJf0OX8uB-mZZ-58JWwFEeE3WwYnNQIR0qcfSsIF0K9dVHpgxDEzy6Kke8rLywPMc1Vp1bU3DBrNQgCJ-SogzZnsX8Zma7K3DnVPIEs2ecT9LwwHuKuewqUGrHgeSmAeQC6GlVtbucOmM0oKqPv-DqXxmQXpTwFTWfyQd9ui0FVaSLTBcGgV2guZbnHZgl3q8IWxoHiPdxCVjwiJ4NRqJEEmsTHrZPHdnb01mNV6oy