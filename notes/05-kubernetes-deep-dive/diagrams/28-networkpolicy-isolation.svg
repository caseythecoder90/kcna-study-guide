<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="806px" preserveAspectRatio="none" style="width:747px;height:806px;background:#FFFFFF;" version="1.1" viewBox="0 0 747 806" width="747px" zoomAndPan="magnify"><title>A NetworkPolicy only ever ALLOWS &#8212; the deny comes from being selected at all</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="694.1777" x="22.7964" y="30.8838">A NetworkPolicy only ever ALLOWS &#8212; the deny comes from being selected at all</text></g><!--cluster s0--><g class="cluster" data-entity="s0" data-source-line="4" data-uid="ent0002" id="cluster_s0"><rect fill="#FEF2F2" height="109" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="606" x="55.3853" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="299.7808" x="208.4949" y="71.8921">STEP 0 &#183; No policy selects the Pod &#8212; the default</text></g><!--cluster s1--><g class="cluster" data-entity="s1" data-source-line="8" data-uid="ent0004" id="cluster_s1"><rect fill="#F8FAFC" height="152" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="640" x="55.3853" y="170.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="486.8462" x="131.9622" y="188.8921">STEP 1 &#183; A policy SELECTS the Pod (podSelector) for a direction (policyTypes)</text></g><!--cluster s2--><g class="cluster" data-entity="s2" data-source-line="12" data-uid="ent0006" id="cluster_s2"><rect fill="#F0FDF4" height="149" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="628" x="55.3853" y="330.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="429.8379" x="154.4663" y="348.8921">STEP 2 &#183; ingress.from / egress.to rules ALLOW specific traffic back in</text></g><!--cluster s3--><g class="cluster" data-entity="s3" data-source-line="16" data-uid="ent0008" id="cluster_s3"><rect fill="#F8FAFC" height="137" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="600" x="55.3853" y="487.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="308.4453" x="201.1626" y="505.8921">STEP 3 &#183; A connection needs BOTH ends to agree</text></g><!--cluster cni--><g class="cluster" data-entity="cni" data-source-line="20" data-uid="ent0010" id="cluster_cni"><rect fill="#FEF2F2" height="122" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="652" x="55.3853" y="632.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="294.6646" x="234.053" y="650.8921">...and none of it works without an enforcing CNI</text></g><!--entity s0a--><g class="entity" data-entity="s0a" data-source-line="5" data-uid="ent0003" id="entity_s0a"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="556.4458" x="97.3853" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="331.6587" x="111.3853" y="112.8921">Every Pod can talk to every Pod, in every namespace.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="528.4458" x="111.3853" y="125.9648">'Networking has been open in our Kubernetes cluster.' Fine in a lab, and in some work environments.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="483.5166" x="111.3853" y="138.6138">A problem for multi-tenancy: one compromised Pod can reach every database in the cluster.</text></g><!--entity s1a--><g class="entity" data-entity="s1a" data-source-line="9" data-uid="ent0005" id="entity_s1a"><rect fill="#326CE5" height="110.793" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="589.9517" x="97.3853" y="203.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="281.6963" x="111.3853" y="229.8921">The Pod becomes ISOLATED in that direction</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="276.6436" x="396.6934" y="229.8921">&#8212; everything in that direction is now denied,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41.1899" x="111.3853" y="244.8408">except</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="214.5698" x="156.187" y="244.8408">what some policy explicitly allows.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="111.3853" y="259.7896">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="492.0566" x="111.3853" y="272.8623">Ingress isolation and egress isolation are INDEPENDENT. A policy with policyTypes: [Ingress]</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="280.4946" x="111.3853" y="285.5112">locks down inbound only; outbound stays wide open.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="374.9023" x="111.3853" y="298.1602">An empty podSelector {} selects EVERY Pod in the policy's namespace.</text></g><!--entity s2a--><g class="entity" data-entity="s2a" data-source-line="13" data-uid="ent0007" id="entity_s2a"><rect fill="#DCFCE7" height="108.4932" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="577.522" x="97.3853" y="363.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="273.4761" x="111.3853" y="389.8921">Rules are allow-only. There is no 'deny' rule.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="463.9443" x="111.3853" y="402.9648">Several policies selecting the same Pod do not conflict &#8212; the allowed set is their UNION.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="549.522" x="111.3853" y="415.6138">Order of evaluation never matters. Adding a policy can only ever allow MORE (or isolate a new direction).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="454.1689" x="111.3853" y="428.2627">Reply traffic for an allowed connection is allowed automatically &#8212; policies are stateful.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="111.3853" y="442.7876">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="378.9468" x="111.3853" y="455.8604">Each rule allows traffic matching BOTH its peers (from/to) AND its ports.</text></g><!--entity s3a--><g class="entity" data-entity="s3a" data-source-line="17" data-uid="ent0009" id="entity_s3a"><rect fill="#FFFFFF" height="95.8442" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="549.7856" x="97.3853" y="520.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.3315" x="111.3853" y="546.8921">curl Pod  &#8212; egress &#8594; ingress &#8212;  nginx Pod</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="111.3853" y="561.8408">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="490.209" x="111.3853" y="574.9136">The SOURCE Pod's egress policies must allow it out, AND the DESTINATION Pod's ingress policies</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="385.8433" x="111.3853" y="587.5625">must allow it in. If either side does not allow the connection, it does not happen.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="521.7856" x="111.3853" y="600.2114">Two exceptions that can never be blocked: a Pod reaching ITSELF, and traffic from the Pod's OWN NODE.</text></g><!--entity cnia--><g class="entity" data-entity="cnia" data-source-line="21" data-uid="ent0011" id="entity_cnia"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="602.1323" x="97.3853" y="665.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="437.0298" x="111.3853" y="691.8921">NetworkPolicy is an API object. The network plugin is what enforces it.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="490.5581" x="111.3853" y="704.9648">'Creating a NetworkPolicy resource without a controller that implements it will have no effect.'</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="568.498" x="111.3853" y="717.6138">Calico and Cilium enforce. Flannel alone does NOT &#8212; and the API server accepts the policy anyway, silently.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="574.1323" x="111.3853" y="730.2627">k3s pairs Flannel with an embedded policy controller (kube-router's netpol library), so policies DO work there.</text></g><g class="link" data-entity-1="s0" data-entity-2="s1" data-uid="lnk12" id="link_s0_s1"><polygon fill="#475569" points="71.3853,170.6745,75.3853,161.6745,71.3853,165.6745,67.3853,161.6745,71.3853,170.6745" style="stroke:#475569;stroke-width:1;"/><path d="M71.3853,163.0495 C71.3853,163.2096 71.3853,163.3698 71.3853,163.5303 C71.3853,164.1722 71.3853,164.8179 71.3853,165.4669 C71.3853,166.765 71.3853,168.0767 71.3853,169.3997 C71.3853,169.7305 71.3853,170.062 71.3853,170.3941 C71.3853,170.4772 71.3853,170.5602 71.3853,170.6434 C71.3853,170.6537 71.3853,164.6641 71.3853,164.6745" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s1" data-entity-2="s2" data-uid="lnk13" id="link_s1_s2"><polygon fill="#475569" points="71.3853,330.6881,75.3853,321.6881,71.3853,325.6881,67.3853,321.6881,71.3853,330.6881" style="stroke:#475569;stroke-width:1;"/><path d="M71.3853,323.2077 C71.3853,323.4098 71.3853,323.6121 71.3853,323.8144 C71.3853,325.4335 71.3853,327.0612 71.3853,328.6947 C71.3853,329.103 71.3853,329.5118 71.3853,329.9208 C71.3853,330.1253 71.3853,330.3299 71.3853,330.5346 C71.3853,330.5858 71.3853,324.6369 71.3853,324.6881" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s2" data-entity-2="s3" data-uid="lnk14" id="link_s2_s3"><polygon fill="#475569" points="71.3853,487.6962,75.3853,478.6962,71.3853,482.6962,67.3853,478.6962,71.3853,487.6962" style="stroke:#475569;stroke-width:1;"/><path d="M71.3853,479.8333 C71.3853,480.0235 71.3853,480.2138 71.3853,480.4042 C71.3853,480.785 71.3853,481.1663 71.3853,481.5479 C71.3853,482.3113 71.3853,483.0763 71.3853,483.8427 C71.3853,484.609 71.3853,485.3768 71.3853,486.1455 C71.3853,486.5298 71.3853,486.9144 71.3853,487.2993 C71.3853,487.3955 71.3853,487.4917 71.3853,487.5879 C71.3853,487.612 71.3853,487.636 71.3853,487.6601 C71.3853,487.6721 71.3853,481.6842 71.3853,481.6962" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s3" data-entity-2="cni" data-uid="lnk15" id="link_s3_cni"><polygon fill="#475569" points="71.3853,632.6958,75.3853,623.6958,71.3853,627.6958,67.3853,623.6958,71.3853,632.6958" style="stroke:#475569;stroke-width:1;"/><path d="M71.3853,625.0479 C71.3853,626.3974 71.3853,627.7537 71.3853,629.1145 C71.3853,629.795 71.3853,630.4765 71.3853,631.159 C71.3853,631.5002 71.3853,631.8416 71.3853,632.1832 C71.3853,632.354 71.3853,626.5249 71.3853,626.6958" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="716.707" x="11.5317" y="774.8301">Default-allow until selected, then default-deny plus explicit allows &#8212; per Pod, per direction. That is the whole model.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="729.7705" x="5" y="790.9287">It is why "deny everything" is a policy with an empty podSelector and no rules: it selects everyone, and allows nothing.</text></g><!--SRC=[RLRDRjj64BxhAQQ-s0OaEevlhY50iPHMg2iPbjAWQ7fOaYDxg-KkmLr6KO80FVK1YhvBxtsKF4bdPabAjWGOiaZjpj_tpJVpdRQPgNE49Bc8Vy4vuozohHuhLVYBTMRL83nXWKbP5wONT3088vXXsBXgVU-CphRWhDa2ViGAHdTty_SB-FRdFq2t84UxXSmLw65LkG9IrFOHF1hC0kQW0YXZUhsA7fLz9CidY-Na7bx1V__2p44PpSVpNYpUktpF-ahL9fp0pSrZvU