<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="431px" preserveAspectRatio="none" style="width:1370px;height:431px;background:#FFFFFF;" version="1.1" viewBox="0 0 1370 431" width="1370px" zoomAndPan="magnify"><title>Semantic Versioning 2.0.0 &#8212; MAJOR.MINOR.PATCH-PRERELEASE+BUILD</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="641.6104" x="356.6948" y="30.8838">Semantic Versioning 2.0.0 &#8212; MAJOR.MINOR.PATCH-PRERELEASE+BUILD</text></g><!--cluster ma--><g class="cluster" data-entity="ma" data-source-line="6" data-uid="ent0003" id="cluster_ma"><rect fill="#FEF2F2" height="126" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="260" x="14" y="118.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.4009" x="106.7996" y="136.8921">MAJOR &#8212; 2</text></g><!--cluster mi--><g class="cluster" data-entity="mi" data-source-line="9" data-uid="ent0005" id="cluster_mi"><rect fill="#F8FAFC" height="126" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="204" x="282" y="118.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.7827" x="348.6086" y="136.8921">MINOR &#8212; 4</text></g><!--cluster pa--><g class="cluster" data-entity="pa" data-source-line="12" data-uid="ent0007" id="cluster_pa"><rect fill="#F0FDF4" height="126" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="212" x="494" y="118.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.23" x="563.885" y="136.8921">PATCH &#8212; 1</text></g><!--cluster pr--><g class="cluster" data-entity="pr" data-source-line="15" data-uid="ent0009" id="cluster_pr"><rect fill="#F8FAFC" height="154" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="258" x="714" y="104.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="201.5381" x="742.231" y="122.8921">PRE-RELEASE &#8212; after a hyphen</text></g><!--cluster bm--><g class="cluster" data-entity="bm" data-source-line="18" data-uid="ent0011" id="cluster_bm"><rect fill="#F8FAFC" height="144" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="244" x="980" y="109.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="205.8418" x="999.0791" y="127.8921">BUILD METADATA &#8212; after a plus</text></g><!--cluster rules--><g class="cluster" data-entity="rules" data-source-line="32" data-uid="ent0022" id="cluster_rules"><rect fill="#F8FAFC" height="129" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="870" x="494" y="266.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.3672" x="874.8164" y="284.8921">Order and ranges</text></g><!--entity v--><g class="entity" data-entity="v" data-source-line="4" data-uid="ent0002" id="entity_v"><rect fill="#326CE5" height="42.9487" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="202.4971" x="409" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="160.0498" x="430.2236" y="79.8921">2  .  4  .  1  -rc.1  +git.ef365</text></g><!--entity ma1--><g class="entity" data-entity="ma1" data-source-line="7" data-uid="ent0004" id="entity_ma1"><rect fill="#FEE2E2" height="85.4951" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="210.1929" x="56" y="151.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="146.6309" x="70" y="177.8921">Incompatible (breaking)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.6372" x="70" y="192.8408">API changes.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.9663" x="70" y="207.7896">Bump &#8594; 3.0.0</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="182.1929" x="70" y="220.8623">Users must read the release notes.</text></g><!--entity mi1--><g class="entity" data-entity="mi1" data-source-line="10" data-uid="ent0006" id="entity_mi1"><rect fill="#FFFFFF" height="85.4951" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="153.728" x="324" y="151.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8799" x="338" y="177.8921">New functionality,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.728" x="338" y="192.8408">backward compatible.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.0972" x="338" y="207.7896">Bump &#8594; 2.5.0</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="94.7515" x="338" y="220.8623">PATCH resets to 0.</text></g><!--entity pa1--><g class="entity" data-entity="pa1" data-source-line="13" data-uid="ent0008" id="entity_pa1"><rect fill="#DCFCE7" height="85.4951" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="162.3735" x="536" y="151.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="134.3735" x="550" y="177.8921">Backward-compatible</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="91.0127" x="550" y="192.8408">bug fixes only.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="85.9663" x="550" y="207.7896">Bump &#8594; 2.4.2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.8022" x="550" y="220.8623">Safe to take.</text></g><!--entity pr1--><g class="entity" data-entity="pr1" data-source-line="16" data-uid="ent0010" id="entity_pr1"><rect fill="#FFFFFF" height="113.0928" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="207.7705" x="756" y="137.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0571" x="770" y="163.8921">-alpha, -beta.2, -rc.1</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.0635" x="770" y="178.8408">Not yet stable; ranks BELOW</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.5508" x="770" y="193.7896">the normal version:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.6426" x="770" y="208.7383">2.4.1-rc.1 &lt; 2.4.1</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="140.6152" x="770" y="221.811">Helm ignores pre-releases in</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="179.7705" x="770" y="234.46">ranges unless asked (the devel flag).</text></g><!--entity bm1--><g class="entity" data-entity="bm1" data-source-line="19" data-uid="ent0012" id="entity_bm1"><rect fill="#F1F5F9" height="102.7437" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="193.5088" x="1022" y="142.6982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.1206" x="1036" y="168.8921">+git.ef365, +20260110</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.4053" x="1036" y="183.8408">Identifies the build.</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="47.6646" x="1036" y="198.7896">Ignored</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3862" x="1087.2764" y="198.7896">when comparing</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.5088" x="1036" y="213.7383">versions: 1.0.0+a == 1.0.0+b</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2808" x="1036" y="228.687">in precedence.</text></g><!--entity ru1--><g class="entity" data-entity="ru1" data-source-line="33" data-uid="ent0023" id="entity_ru1"><rect fill="#FFFFFF" height="87.7949" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="819.3496" x="536.5" y="299.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="211.6436" x="550.5" y="325.8921">Compare numerically, left to right:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.894" x="765.7554" y="325.8921">1.9.0 &lt; 1.10.0 &lt; 2.0.0  (10 &gt; 9 &#8212; not alphabetical).</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.2808" x="550.5" y="340.8408">Pre-release order:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="518.21" x="665.3926" y="340.8408">1.0.0-alpha &lt; 1.0.0-alpha.1 &lt; 1.0.0-beta &lt; 1.0.0-beta.2 &lt; 1.0.0-beta.11 &lt; 1.0.0-rc.1 &lt; 1.0.0</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.1836" x="550.5" y="355.7896">0.y.z</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.4932" x="582.2954" y="355.7896">= initial development &#8212; anything may change at any time;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.9136" x="919.4004" y="355.7896">1.0.0</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="129.3589" x="951.9258" y="355.7896">defines the public API.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.0317" x="550.5" y="370.7383">Helm ranges</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.7197" x="632.1436" y="370.7383">(dependencies, kubeVersion):</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.5054" x="812.0869" y="370.7383">~1.2.3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.2197" x="852.2041" y="370.7383">= &gt;=1.2.3 &lt;1.3.0 (patches)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.5054" x="1016.2593" y="370.7383">^1.2.3</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.6943" x="1056.3765" y="370.7383">= &gt;=1.2.3 &lt;2.0.0 (minors)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.9136" x="1213.9063" y="370.7383">1.2.x</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.418" x="1246.4316" y="370.7383">= &gt;=1.2.0 &lt;1.3.0</text></g><g class="link" data-entity-1="v" data-entity-2="ma" data-uid="lnk13" id="link_v_ma"><polygon fill="#475569" points="36.1899,118.6695,43.9234,112.5709,38.5202,114.2457,36.8453,108.8425,36.1899,118.6695" style="stroke:#475569;stroke-width:1;"/><path d="M408.771,75.9619 C280.695,76.6438 73.4977,81.3994 47,104.6982 C44.2242,107.139 41.8159,109.8829 39.731,112.8533 C38.6886,114.3385 37.7269,115.8804 36.8406,117.4692 C36.6191,117.8664 39.1985,112.958 38.9862,113.361" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v" data-entity-2="mi" data-uid="lnk14" id="link_v_mi"><polygon fill="#475569" points="304.7556,118.6815,312.4183,112.4942,307.0347,114.2312,305.2978,108.8476,304.7556,118.6815" style="stroke:#475569;stroke-width:1;"/><path d="M408.7824,80.4102 C368.7771,84.1878 329.0016,91.3083 315,104.6982 C312.3428,107.2394 310.0302,110.0597 308.0213,113.0866 C307.0169,114.6001 306.0883,116.1651 305.2306,117.7728 C305.1234,117.9737 305.0173,118.1754 304.9123,118.3776 C304.8598,118.4788 307.5425,113.2396 307.4906,113.3411" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="v" data-entity-2="pa" data-uid="lnk15" id="link_v_pa"><polygon fill="#475569" points="510,118.5626,514,109.5626,510,113.5626,506,109.5626,510,118.5626" style="stroke:#475569;stroke-width:1;"/><path d="M510,96.8462 C510,103