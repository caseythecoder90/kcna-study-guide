<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="807px" preserveAspectRatio="none" style="width:1282px;height:807px;background:#FFFFFF;" version="1.1" viewBox="0 0 1282 807" width="1282px" zoomAndPan="magnify"><title>Order is a guarantee, not an accident &#8212; create up, terminate down, update down</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="689.1328" x="292.8228" y="30.8838">Order is a guarantee, not an accident &#8212; create up, terminate down, update down</text></g><!--cluster up--><g class="cluster" data-entity="up" data-source-line="4" data-uid="ent0002" id="cluster_up"><rect fill="#F0FDF4" height="122" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="550" x="299.8892" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="320.7217" x="414.5283" y="71.8921">CREATE and SCALE UP &#8212; ascending, one at a time</text></g><!--cluster down--><g class="cluster" data-entity="down" data-source-line="8" data-uid="ent0004" id="cluster_down"><rect fill="#FEF2F2" height="122" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="598" x="299.8892" y="183.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="349.5972" x="424.0906" y="201.8921">DELETE and SCALE DOWN &#8212; descending, one at a time</text></g><!--cluster pm--><g class="cluster" data-entity="pm" data-source-line="12" data-uid="ent0006" id="cluster_pm"><rect fill="#F8FAFC" height="112" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="598" x="299.8892" y="313.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="507.8062" x="344.9861" y="331.8921">podManagementPolicy &#8212; the switch for all of the above (immutable after creation)</text></g><!--cluster part--><g class="cluster" data-entity="part" data-source-line="16" data-uid="ent0008" id="cluster_part"><rect fill="#F0FDF4" height="190" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="622" x="299.8892" y="433.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="301.1899" x="460.2942" y="451.8921">ROLLING UPDATE with partition: 2 &#8212; the canary</text></g><!--cluster us--><g class="cluster" data-entity="us" data-source-line="20" data-uid="ent0010" id="cluster_us"><rect fill="#F8FAFC" height="124" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="698" x="299.8892" y="631.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="124.9727" x="586.4028" y="649.8921">updateStrategy.type</text></g><!--entity u1--><g class="entity" data-entity="u1" data-source-line="5" data-uid="ent0003" id="entity_u1"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="500.4736" x="341.8892" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.4199" x="355.8892" y="112.8921">web-0  &#8594;  web-1  &#8594;  web-2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="181.543" x="355.8892" y="125.9648">Created sequentially from 0 to N-1.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="287.8745" x="540.4883" y="125.9648">web-1 is not created until web-0 is Running and Ready.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="437.6313" x="355.8892" y="138.6138">If web-0 fails after web-1 is up, web-2 waits until web-0 is Running and Ready again.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="364.9336" x="355.8892" y="151.2627">A database primary at ordinal 0 is up before any replica tries to join it.</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="9" data-uid="ent0005" id="entity_d1"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="547.5674" x="341.8892" y="216.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.4199" x="355.8892" y="242.8921">web-2  &#8594;  web-1  &#8594;  web-0</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.3345" x="355.8892" y="255.9648">Terminated in reverse, from N-1 to 0.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="295.8721" x="550.2798" y="255.9648">Before a Pod is terminated, all of its successors must be</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="118.5669" x="355.8892" y="268.6138">completely shut down.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="369.8052" x="477.5122" y="268.6138">Scale 3 &#8594; 1 and web-2 goes first; web-1 waits until web-2 is fully gone.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="519.5674" x="355.8892" y="281.2627">Deleting the StatefulSet object itself gives NO ordering guarantee &#8212; scale to 0 first if order matters.</text></g><!--entity pm1--><g class="entity" data-entity="pm1" data-source-line="13" data-uid="ent0007" id="entity_pm1"><rect fill="#FFFFFF" height="70.5464" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="546.8511" x="342.3892" y="346.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.5908" x="356.3892" y="372.8921">OrderedReady</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.7388" x="449.5918" y="372.8921">(default)   the sequencing above</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.2554" x="356.3892" y="387.8408">Parallel</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.583" x="467.6572" y="387.8408">create or terminate all Pods at once, no waiting on Running and Ready</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="401.0273" x="356.3892" y="400.9136">Parallel relaxes ORDERING only. Names, DNS and storage stay exactly as sticky.</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="17" data-uid="ent0009" id="entity_p1"><rect fill="#DCFCE7" height="148.7397" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="571.2261" x="342.3892" y="466.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="543.2261" x="356.3892" y="492.8921">replicas: 3     updateStrategy.rollingUpdate.partition: 2     image nginx:1.27 &#8594; nginx:1.29</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="356.3892" y="507.8408">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.6201" x="362.5015" y="520.9136">web-2   ordinal 2 &#8805; 2   &#8594;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="53.1685" x="493.2339" y="520.9136">UPDATED</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="276.2407" x="549.4585" y="520.9136">to 1.29     &#8592; rolling updates go highest ordinal FIRST</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="398.2612" x="362.5015" y="533.5625">web-1   ordinal 1 &lt; 2   &#8594;  stays on 1.27, and if deleted is RECREATED at 1.27</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="200.2129" x="362.5015" y="546.2114">web-0   ordinal 0 &lt; 2   &#8594;  stays on 1.27</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="356.3892" y="560.7363">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="514.5938" x="356.3892" y="573.8091">Watch web-2. Happy?  Lower the partition to 1, then 0, and the rollout continues one Pod at a time.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="452.3535" x="356.3892" y="586.458">Partition greater than replicas  &#8594;  template changes reach NO Pods at all: a full pause.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="346.5806" x="356.3892" y="599.1069">Uses: stage an update, roll out a canary, perform a phased rollout.</text></g><!--entity us1--><g class="entity" data-entity="us1" data-source-line="21" data-uid="ent0011" id="entity_us1"><rect fill="#FFFFFF" height="83.1953" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="646.5347" x="342.3892" y="664.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.1055" x="356.3892" y="690.8921">RollingUpdate</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="526.8174" x="448.1064" y="690.8921">(default)  delete and recreate each Pod, highest ordinal first, waiting for Running and Ready</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0718" x="356.3892" y="705.8408">OnDelete</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.2666" x="482.0854" y="705.8408">change nothing automatically; a Pod is updated only when YOU delete it</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="477.5278" x="356.3892" y="718.9136">Recreate (delete all, then recreate) exists only as an ALPHA feature gate &#8212; not the exam answer.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="419.4556" x="356.3892" y="731.5625">maxUnavailable (beta, v1.35) lets RollingUpdate replace more than one Pod at a time.</text></g><g class="link" data-entity-1="up" data-entity-2="down" data-uid="lnk12" id="link_up_down"><polygon fill="#475569" points="315.8892,183.6494,319.8892,174.6494,315.8892,178.6494,311.8892,174.6494,315.8892,183.6494" style="stroke:#475569;stroke-width:1;"/><path d="M315.8892,175.8756 C315.8892,176.0296 315.8892,176.1837 315.8892,176.3379 C315.8892,176.6464 315.8892,176.9554 315.8892,177.2649 C315.8892,178.503 315.8892,179.7489 315.8892,181.0007 C315.8892,181.6266 315.8892,182.254 315.8892,182.8827 C315.8892,183.0398 315.8892,183.197 315.8892,183.3543 C315.8892,183.433 315.8892,183.5117 315.8892,183.5903 C315.8892,183.61 315.8892,177.6297 315.8892,177.6494" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="down" data-entity-2="pm" data-uid="lnk13" id="link_down_pm"><polygon fill="#475569" points="315.8892,313.6742,319.8892,304.6742,315.8892,308.6742,311.8892,304.6742,315.8892,313.6742" style="stroke:#475569;stroke-width:1;"/><path d="M315.8892,305.8579 C315.8892,306.0047 315.8892,306.1516 315.8892,306.2986 C315.8892,306.5926 315.8892,306.887 315.8892,307.1818 C315.8892,307.7714 315.8892,308.3626 315.8892,308.9552 C315.8892,310.1404 315.8892,311.3311 315.8892,312.5255 C315.8892,312.824 315.8892,313.1229 315.8892,313.4219 C315.8892,313.4966 315.8892,313.5714 315.8892,313.6462 C315.8892,313.6555 315.8892,307.6649 315.8892,307.6742" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pm" data-entity-2="part" data-uid="lnk14" id="link_pm_part"><polygon fill="#475569" points="315.8892,433.6937,319.8892,424.6937,315.8892,428.6937,311.8892,424.6937,315.8892,433.6937" style="stroke:#475569;stroke-width:1;"/><path d="M315.8892,425.8847 C315.8892,426.6282 315.8892,427.3771 315.8892,428.1311 C315.8892,429.6391 315.8892,431.1674 315.8892,432.7132 C315.8892,432.9064 315.8892,433.0999 315.8892,433.2937 C315.8892,433.3906 315.8892,433.4875 315.8892,433.5846 C315.8892,433.6088 315.8892,433.6331 315.8892,433.6573 C315.8892,433.6695 315.8892,427.6816 315.8892,427.6937" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="part" data-entity-2="us" data-uid="lnk15" id="link_part_us"><polygon fill="#475569" points="315.8892,631.6809,319.8892,622.6809,315.8892,626.6809,311.8892,622.6809,315.8892,631.6809" style="stroke:#475569;stroke-width:1;"/><path d="M315.8892,624.2741 C315.8892,624.4903 315.8892,624.7065 315.8892,624.9226 C315.8892,625.355 315.8892,625.7873 315.8892,626.2195 C315.8892,627.0839 315.8892,627.9479 315.8892,628.8112 C315.8892,629.6745 315.8892,630.537 315.8892,631.3983 C315.8892,631.4521 315.8892,631.506 315.8892,631.5598 C315.8892,631.5867 315.8892,631.6136 315.8892,631.6405 C315.8892,631.654 315.8892,625.6674 315.8892,625.6809" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1264.7783" x="5" y="775.8301">Deployments create, update and delete Pods in parallel because their Pods are interchangeable. A StatefulSet's ordinals mean something to the application &#8212; "0 is the primary" &#8212; so the order is enforced.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="578.2246" x="348.2769" y="791.9287">partition is that ordering turned into a control: update from the top, stop wherever you choose.</text></g><!--SRC=[XLRRRjj647tNLqpzKXkGPSb1KTGHL3YHcWHmRK6E4HJ8oufSKPkGkontQPij2lGfGD-Aeh_G7ykNzCpmOaQM4S6mBN9tBkVCd9blZ8tICjOq6ftKFy6vr9_4HYM5olp9nyYgux3LcHxbPPOEWWcffgiYrWKPJugIKXNA1gs7P5qWPKb5aOcr3VJvptyfAhGAcifyI44NcR7yBNPtTeXdSVjbC2Xq59HDOFlWvMfn_dO1Ip5Tlpo_MD3DKamf7saR6viCoLbD2iuec4mVq7IQ5AxCNpaNpsOu1zFq-u2eP_HEhu_7H9y__KF4_qzw_v- -jrDlVjDdaydifSGRazU_biZ1g3IjQ5EuZCOK75qUJqOqNSzg4m20SuwQEoNEfrHxmgjLQIsYbKHMMiNLQ7godarFsDMiv_BDfhcpKIO5f1i0HPq3Haw2f3jbWl-g4rA9CdRqsCqv0MwrLbvJNfXC5HL3w0eWgb8QrxvehJUk0BYs0dfvQY9WN1ZjEVaFpbWoeRKjk3z0FXdyyGMDyyN5uWiQvrVlBeN8M7-DoHUgiSh5iO_AqoUe7FSIVjlMMqo8kz2tkl2eKY4JF796Oo7pHPCpBLtCC7I56Wy9_9FR42FlooZIthl2KrRw0AZsymcBaSloL0UDsl7RCaWQmZvTHme