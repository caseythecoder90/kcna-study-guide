<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="721px" preserveAspectRatio="none" style="width:1136px;height:721px;background:#FFFFFF;" version="1.1" viewBox="0 0 1136 721" width="1136px" zoomAndPan="magnify"><title>Five release patterns, two mechanisms &#8212; WEIGHTS split traffic, MATCHES select it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="714.1904" x="207.0332" y="30.8838">Five release patterns, two mechanisms &#8212; WEIGHTS split traffic, MATCHES select it</text></g><!--cluster w--><g class="cluster" data-entity="w" data-source-line="4" data-uid="ent0002" id="cluster_w"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="594" x="277.6284" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.5718" x="503.8425" y="71.8921">WEIGHTS &#183; Blue/Green</text></g><!--cluster w2--><g class="cluster" data-entity="w2" data-source-line="7" data-uid="ent0004" id="cluster_w2"><rect fill="#F0FDF4" height="122" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="552" x="277.6284" y="170.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="332.6426" x="387.3071" y="188.8921">WEIGHTS &#183; Canary &#8212; share = weight / sum of weights</text></g><!--cluster m--><g class="cluster" data-entity="m" data-source-line="11" data-uid="ent0006" id="cluster_m"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="554" x="277.6284" y="300.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="404.5107" x="352.373" y="318.8921">MATCHES &#183; A/B testing &#8212; the request itself chooses the backend</text></g><!--cluster m2--><g class="cluster" data-entity="m2" data-source-line="14" data-uid="ent0008" id="cluster_m2"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="552" x="277.6284" y="417.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="173.3481" x="466.9543" y="435.8921">MATCHES &#183; Preview routing</text></g><!--cluster f--><g class="cluster" data-entity="f" data-source-line="18" data-uid="ent0010" id="cluster_f"><rect fill="#FEF2F2" height="135" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="596" x="277.6284" y="534.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="317.8525" x="416.7021" y="552.8921">FILTER &#8212; copy the traffic, keep the answer from v1</text></g><!--entity bg--><g class="entity" data-entity="bg" data-source-line="5" data-uid="ent0003" id="entity_bg"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="543.9097" x="319.6284" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="69.3545" x="333.6284" y="112.8921">Blue/Green</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="199.3862" x="413.8184" y="112.8921">instant switch between versions</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="367.3667" x="333.6284" y="125.9648">backendRefs: [{name: app-v1, weight: 100}, {name: app-v2, weight: 0}]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="515.9097" x="333.6284" y="138.6138">Flip to 0 / 100 and every new request goes to v2. Flip back to roll back. Both versions stay running.</text></g><!--entity can--><g class="entity" data-entity="can" data-source-line="8" data-uid="ent0005" id="entity_can"><rect fill="#DCFCE7" height="80.8955" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="502.3643" x="319.6284" y="203.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="44.0781" x="333.6284" y="229.8921">Canary</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="227.5508" x="388.542" y="229.8921">gradual rollout to a small percentage</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="361.249" x="333.6284" y="242.9648">backendRefs: [{name: app-v1, weight: 95}, {name: app-v2, weight: 5}]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="474.3643" x="333.6284" y="255.6138">Then 90/10, 50/50, 0/100 as confidence grows. Weights are proportions, not percentages &#8212;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="435.2036" x="333.6284" y="268.2627">1 and 1 is 50/50; they need not add to 100. Omitted weight = 1. Weight 0 = no traffic.</text></g><!--entity ab--><g class="entity" data-entity="ab" data-source-line="12" data-uid="ent0007" id="entity_ab"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="504.1797" x="319.6284" y="333.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="68.6118" x="333.6284" y="359.8921">A/B testing</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="207.3335" x="413.0757" y="359.8921">route a user SEGMENT by header</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="476.1797" x="333.6284" y="372.9648">- matches: [{headers: [{name: X-Experiment, value: B}]}]   backendRefs: [{name: variant-b}]</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="357.6182" x="333.6284" y="385.6138">- backendRefs: [{name: variant-a}]                              &#8592; everyone else</text></g><!--entity pv--><g class="entity" data-entity="pv" data-source-line="15" data-uid="ent0009" id="entity_pv"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="501.7788" x="319.6284" y="450.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.519" x="333.6284" y="476.8921">Preview routing</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="224.6816" x="441.9829" y="476.8921">reach a new version only on request</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="464.9219" x="333.6284" y="489.9648">- matches: [{headers: [{name: X-Preview, value: 'true'}]}]   backendRefs: [{name: app-v2}]</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="473.7788" x="333.6284" y="502.6138">Production traffic never sees v2; testers add one header. More header matches beat fewer.</text></g><!--entity mir--><g class="entity" data-entity="mir" data-source-line="19" data-uid="ent0011" id="entity_mir"><rect fill="#FEE2E2" height="93.5444" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="545.0859" x="320.1284" y="567.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.7891" x="334.1284" y="593.8921">Traffic mirroring (shadow)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="252.8398" x="506.7529" y="593.8921">test v2 on real traffic with no user impact</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="161.9868" x="334.1284" y="606.9648">backendRefs: [{name: app-v1}]</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="444.979" x="334.1284" y="619.6138">filters: [{type: RequestMirror, requestMirror: {backendRef: {name: app-v2, port: 80}}}]</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="476.894" x="334.1284" y="632.2627">100% is served by v1. v2 receives a COPY of each request and its responses are IGNORED.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="517.0859" x="334.1284" y="644.9116">RequestMirror is an EXTENDED feature &#8212; supported by many implementations, not required of all.</text></g><g class="caption" data-source-line="27"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1118.2568" x="5" y="689.8301">All five are plain HTTPRoute fields. With Ingress, each needed controller annotations, a service mesh, or a second Ingress object &#8212; and none of it was portable between controllers.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="732.2656" x="197.9956" y="705.9287">Weights move a percentage of everyone; matches move a chosen someone; a mirror moves no one and just watches.</text></g><!--SRC=[bLRRRjj647tNLqm356a1NGqOQ6HPW2_o1OWlS0GaHUg75JaKDoPtsTqbLTKGaASyzw7_qlT-IhwaCqjIPcpQQ8p0pjxcSiwS6VuWLP3a8KA_FoZ_EQqJEmYbM1gHsi5Te4JFnPXYFylJfEEaIn1EP85WC45X4JBX71fbk-1M6b8COg6aJIry_Vmtl9-TdvxDtu7D4kd06H55CkZ2nS7yw6n6ssGZS21TfsFeFq8joVgh-j6__y1XakFWr22gLp2PB8tEirEjm-aKX8KLt7S06WydY-d3WybWCGK0gImTEx0hwO8O5kXMT0W56Ykrih-fYPL_udWqcYv4S8SglC78Zk7ZlH8fZa5aMQyOTM65SXcxCOo6mqqNceSx3uV3pUramEQc3RCdYSp0QHZ2W5-3K24WkL-3mXL5_tkEri5Ie-LRnKuV_0kEXZUCJXA_wCEXTl4sSA2qrc1ofQHQzYkt7gGjFejbP_CChaT22Og0ARAnC0ZxLH8KfCrJq56rjcsuxxG0NrgiGAVY2NEH-E1rxZWF0JOLb4g69a3bn1A_5_etkyyZlzk6_3mcejyC1wDX5tQ7WrtwmuiXvn1e5SaGLO0Kh5xPFhmlymL68pCwqyOnpbrGsZMYzdNzrDV8ype2QKjNUq2gOOenz0P4638AvBqFLwaaoOGrulimghrJaUpJzLeexRG6GX6lJM9hEH6n1uD3S5HGL1IUNOfYMsFIaTuY26AjBLSR7LN0RqakFQGj_3OCLoJJVOV4QsxHmBlPwSNiSWwBDSGeGZGDR7gG2j8UUcxBqmRD7tgpFmXUcHA-NIW42NWCXvlRpItvQ2sCGXX9akujsaZllVn6UBCl_7pzybSfJwqGCB7Ou404N0GbHcBnhRWQ75mRB2Hhcm0Yk1w3swQUHqzgX55GonA-KLIw1wsIDVsgIVqEc2iVMunVEvFZwvU0BbNMXlArqM4Ui43gMgKWAKJgw5HPnSwUhnKAm1S-Gra6r8SBRUf57IyrPU4WmXMTFuDsLZmg-PFpj_FPZI_nG6ThNypRyNA7cFaTeImPXSZe58hHbeX3KKafQg5YNkMJIcEqOHtzH2qorAkVArOuCqgn986QN0q03PYOnUlr8DDC1Ex_jRWsW2EPk8e_jyxewat9zuMFgblJNox7SFzWVlouHt8d6yClmyscpH5rf1-vQr7G1VKaqcz1xOZI8rIGvZmn24TNrx_oIF3bM7SJxdVKKMXjC-gJM7REyzFBgvlPSV-fesyIO8z2mUp3V7PvF3icyeNBwRaVI7d68PV1f4Aj6Sm4kJ-8HalcEAIXMnGO3PPcvIngVeb3hfiLz3x6CgHsVqiygjwKHbY7fjZZtRIJFjtRwQHFRqQTJY0oN_yJEJsWkHRnDv6V7OcG2ixcy-iRto0ZYKd8yuNBurmj2I_Am4F9qu4Ie5daU59IsGX5gTLP2a-Af16LeesxGB3n5bqFQqEW5v_u2ufnOq8KIuq0eO-j5Sk6S1GBAkpwi-V1bIN09FCZf_NaIpMdq9XrdlEg5-vjrLfTep5YoQBLAVfZKId6driM0iV2GNtABOVZNtkl_m40]--></g></svg>