<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="666px" preserveAspectRatio="none" style="width:1369px;height:666px;background:#FFFFFF;" version="1.1" viewBox="0 0 1369 666" width="1369px" zoomAndPan="magnify"><title>Two objects, two questions &#8212; WHAT may be done, and WHO may do it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="607.0342" x="377.4829" y="30.8838">Two objects, two questions &#8212; WHAT may be done, and WHO may do it</text></g><!--cluster role--><g class="cluster" data-entity="role" data-source-line="4" data-uid="ent0002" id="cluster_role"><rect fill="#F0FDF4" height="215" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="528" x="835" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.1709" x="1032.9146" y="71.8921">ClusterRole &#8212; WHAT</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="323.2915" x="937.3542" y="84.9648">a set of RULES &#183; non-namespaced &#183; grants nothing on its own</text></g><!--cluster bind--><g class="cluster" data-entity="bind" data-source-line="8" data-uid="ent0004" id="cluster_bind"><rect fill="#F0FDF4" height="215" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="528" x="299" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="173.3291" x="476.3354" y="71.8921">ClusterRoleBinding &#8212; WHO</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="276.2783" x="424.8608" y="84.9648">a roleRef plus a list of SUBJECTS &#183; non-namespaced</text></g><!--cluster test--><g class="cluster" data-entity="test" data-source-line="14" data-uid="ent0007" id="cluster_test"><rect fill="#F8FAFC" height="202" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="544" x="299" y="412.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="242.6646" x="449.6677" y="430.8921">Proving it without logging in as anyone</text></g><!--entity build--><g class="entity" data-entity="build" data-source-line="12" data-uid="ent0006" id="entity_build"><rect fill="#326CE5" height="108.4932" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="617.8804" x="6" y="296.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="297.6035" x="20" y="322.8921">Building a superuser, the two-command version</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="352.2095" x="20" y="335.9648">kubectl create clusterrole cluster-superhero --verb='*' --resource='*'</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="589.8804" x="20" y="348.6138">kubectl create clusterrolebinding cluster-superhero --clusterrole=cluster-superhero --group=cluster-superheroes</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="20" y="363.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="454.7866" x="20" y="376.2114">That is a functional equivalent of the built-in cluster-admin: every verb, every resource,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="283.6152" x="20" y="388.8604">granted to everyone in the group cluster-superheroes.</text></g><!--entity r--><g class="entity" data-entity="r" data-source-line="5" data-uid="ent0003" id="entity_r"><rect fill="#DCFCE7" height="161.3887" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="477.249" x="877.5" y="99.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="35.4009" x="891.5" y="125.8921">rules:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="449.249" x="891.5" y="138.9648">- apiGroups: [ ]           &#8592; an EMPTY string is the CORE group (Pods, Services, Secrets)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="383.8774" x="897.6123" y="151.6138">resources: [pods, pods/log]   &#8592; plural names, as in kubectl api-resources</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="119.1899" x="897.6123" y="164.2627">verbs: [get, list, watch]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="891.5" y="178.7876">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="389.3452" x="891.5" y="191.8604">VERBS: get &#183; list &#183; watch &#183; create &#183; update &#183; patch &#183; delete &#183; deletecollection</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="415.6743" x="891.5" y="204.5093">Also available: resourceNames (specific objects) &#183; nonResourceURLs (/healthz)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="891.5" y="219.0342">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="349.0244" x="891.5" y="232.1069">PERMISSIONS ARE PURELY ADDITIVE &#8212; there are NO deny rules.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="289.0723" x="891.5" y="244.7559">You cannot subtract; you can only choose not to grant.</text></g><!--entity b--><g class="entity" data-entity="b" data-source-line="9" data-uid="ent0005" id="entity_b"><rect fill="#DCFCE7" height="161.3887" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="477.335" x="341.5" y="99.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.1182" x="355.5" y="125.8921">roleRef:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="396.0698" x="361.6123" y="138.9648">kind: ClusterRole &#183; name: cluster-superhero     &#8592; IMMUTABLE once created</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="355.5" y="153.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="210.2676" x="355.5" y="166.5625">subjects:      three kinds, and only three:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="174.813" x="355.5" y="179.2114">- kind: User             name: batman</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.936" x="355.5" y="191.8604">- kind: Group            name: cluster-superheroes</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="288.5298" x="355.5" y="204.5093">- kind: ServiceAccount   name: builder    namespace: ci</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="355.5" y="219.0342">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="431.5459" x="355.5" y="232.1069">Users and Groups are just STRINGS &#8212; they need not exist anywhere (they cannot,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="449.335" x="355.5" y="244.7559">chapter 05-02). A ServiceAccount subject must name a real object and its namespace.</text></g><!--entity t--><g class="entity" data-entity="t" data-source-line="15" data-uid="ent0008" id="entity_t"><rect fill="#326CE5" height="161.3887" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="493.126" x="341.5" y="445.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="441.4541" x="355.5" y="471.8921">kubectl auth can-i '*' '*'                                                &#8594; yes   (that is YOU)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="413.2949" x="355.5" y="484.9648">kubectl auth can-i '*' '*' --as-group=cluster-superheroes --as=batman        &#8594; yes</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="420.6372" x="355.5" y="497.6138">kubectl auth can-i '*' '*' --as-group=cluster-superheroes --as=superman      &#8594; yes</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="436.5088" x="355.5" y="510.2627">kubectl auth can-i '*' '*' --as-group=cluster-superheroes --as=wonder-woman  &#8594; yes</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="355.5" y="524.7876">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="405.2813" x="355.5" y="537.8604">Three different usernames, all yes &#8212; because the binding names the GROUP.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="363.6553" x="355.5" y="550.5093">THE USERNAME DOES NOT MATTER as long as it carries that group.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="355.5" y="565.0342">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="465.126" x="355.5" y="578.1069">--as / --as-group is IMPERSONATION: you ask the API server &#8220;what would this identity be</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="446.7729" x="355.5" y="590.7559">allowed to do?&#8221; without needing their credentials. It is itself an RBAC-gated privilege.</text></g><g class="link" data-entity-1="bind" data-entity-2="build" data-uid="lnk10" id="link_bind_build"><polygon fill="#475569" points="315,296.6006,319,287.6006,315,291.6006,311,287.6006,315,296.6006" style="stroke:#475569;stroke-width:1;"/><path d="M315,268.9866 C315,269.141 315,269.2955 315,269.4499 C315,270.0675 315,270.6849 315,271.3018 C315,272.5357 315,273.7679 315,274.9974 C315,277.4563 315,279.9042 315,282.3326 C315,287.1894 315,285.9681 315,290.6006" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="build" data-entity-2="test" data-uid="lnk11" id="link_build_test"><polygon fill="#475569" points="315,412.4871,319,403.4871,315,407.4871,311,403.4871,315,412.4871" style="stroke:#475569;stroke-width:1;"/><path d="M315,405.1697 C315,407.5717 315,404.0139 315,406.4871" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1240.415" x="60.7925" y="634.8301">A ClusterRole is inert &#8212; it is a named list of permissions that nobody holds until a binding attaches subjects to it. That separation is what makes roles reusable: one &#8220;cluster-superhero&#8221; definition, bound</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1087.1807" x="137.4097" y="650.9287">to as many groups, users and ServiceAccounts as you like. And because roleRef is immutable, changing which role a binding grants means deleting and recreating the binding.</text></g><!--SRC=[jLVDRY974Bxp59Mzx3fYO3TIBiGcmZRo4faV3R2HjV6XcMcONlTqizqz9coKrPxs74Kv9i-HUnx5JvAgdX-36I95KP2DXwQwVh_wglo5K97COWwjLZl_SLfBsuu5MncMslPTf5ZW4fxorZfBPSC99pdCDXhquXsFd6s2mm_lCswTqCh2mwVVuFlNlHcaR0iB3h5Ml0bCnNWwzeUn1k4Q3OEtcLgXjcSNChEEcr3ZX_B-3-hKYW-yy-fLbu7b3lGImlbrVmf__GbAgq2nbDirYtXC9-YjSXQ_S8bGAz0ARLZG6tNQ9ZNTPt1wkZ8wMrzf7NUxm2mOClTJ0s374vD9RZixjWDWQt555sq7ti8jFBuUFl-2SK5_E9dTW7M6x0eBc2ou68TzyERWnKJ7cAGfD_SYulufCjpPayAn7LlaYTMPGJ6qjVRtwBqjzUgsCBYMcM4IVF1DYa8ekCiM684aJuDAGvtwUsuMf7h5NHEaiFY-OIvARYlX7V4t_V1ysW6KfVoIDFtrylI0GJ37wIbRnyNJklmovfBdH_bJfAL45n4WXsxrfDN0xfcGR25vfyh1