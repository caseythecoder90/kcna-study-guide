<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="674px" preserveAspectRatio="none" style="width:1058px;height:674px;background:#FFFFFF;" version="1.1" viewBox="0 0 1058 674" width="1058px" zoomAndPan="magnify"><title>"Does not survive restarts" &#8212; which restart? Four kinds of storage against three events</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="752.2734" x="149.0884" y="30.8838">"Does not survive restarts" &#8212; which restart? Four kinds of storage against three events</text></g><!--cluster wl--><g class="cluster" data-entity="wl" data-source-line="4" data-uid="ent0002" id="cluster_wl"><rect fill="#FEF2F2" height="109" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="630" x="194.7251" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="300.7329" x="359.3586" y="71.8921">The container's writable layer &#8212; no volume at all</text></g><!--cluster ed--><g class="cluster" data-entity="ed" data-source-line="8" data-uid="ent0004" id="cluster_ed"><rect fill="#F8FAFC" height="135" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="684" x="194.7251" y="170.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="259.3018" x="407.0742" y="188.8921">emptyDir &#8212; EPHEMERAL, tied to the POD</text></g><!--cluster mem--><g class="cluster" data-entity="mem" data-source-line="12" data-uid="ent0006" id="cluster_mem"><rect fill="#F8FAFC" height="149" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="534" x="194.7251" y="313.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="377.7554" x="272.8474" y="331.8921">emptyDir with medium: Memory &#8212; EPHEMERAL, and in RAM</text></g><!--cluster pv--><g class="cluster" data-entity="pv" data-source-line="16" data-uid="ent0008" id="cluster_pv"><rect fill="#F0FDF4" height="152" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="636" x="194.7251" y="470.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="429.0889" x="298.1807" y="488.8921">PersistentVolume via a PVC &#8212; PERSISTENT, independent of any Pod</text></g><!--entity wl1--><g class="entity" data-entity="wl1" data-source-line="5" data-uid="ent0003" id="entity_wl1"><rect fill="#FEE2E2" height="68.2466" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="579.332" x="237.2251" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="164.6772" x="251.2251" y="112.8921">Dies with the CONTAINER.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="544.0273" x="251.2251" y="125.9648">Container crashes and the kubelet restarts it   &#8594;  GONE. The new container starts from the image again.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="551.332" x="251.2251" y="138.6138">Anything an app writes to its own filesystem without a volume is lost on the very first restart (chapter 03).</text></g><!--entity ed1--><g class="entity" data-entity="ed1" data-source-line="9" data-uid="ent0005" id="entity_ed1"><rect fill="#FFFFFF" height="93.5444" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="632.627" x="237.2251" y="203.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="604.627" x="251.2251" y="229.8921">Created when the Pod is assigned to a node. Deleted permanently when the Pod leaves that node.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="542.8511" x="251.2251" y="242.9648">Container crashes and restarts        &#8594;  SURVIVES.  'A container crashing does not remove a Pod from a node.'</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="313.6665" x="251.2251" y="255.6138">Pod deleted, evicted or rescheduled   &#8594;  GONE, for any reason.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="420.6963" x="251.2251" y="268.2627">Shared by every container in the Pod, each mounting it at the same or a different path.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="579.0361" x="251.2251" y="280.9116">Uses: scratch space &#183; checkpointing a long computation &#183; a fast cache &#183; files one container fetches and another serves.</text></g><!--entity mem1--><g class="entity" data-entity="mem1" data-source-line="13" data-uid="ent0007" id="entity_mem1"><rect fill="#326CE5" height="108.4932" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="483.4688" x="237.2251" y="346.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="372.9375" x="251.2251" y="372.8921">A tmpfs (RAM-backed filesystem) instead of the node's disk.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="443.1689" x="251.2251" y="385.9648">Everything emptyDir loses, PLUS: cleared on NODE REBOOT, and every byte written</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="455.4688" x="251.2251" y="398.6138">COUNTS AGAINST THE CONTAINER'S MEMORY LIMIT &#8212; fill it and you are OOM-killed.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="251.2251" y="413.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="432.937" x="251.2251" y="426.2114">The lecture's proof:  df -h /cache  &#8594;  Filesystem: tmpfs     dd 1000 MiB  &#8594;  3.5 GB/s</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="205.9707" x="251.2251" y="438.8604">Bound the risk with emptyDir.sizeLimit.</text></g><!--entity pv1--><g class="entity" data-entity="pv1" data-source-line="17" data-uid="ent0009" id="entity_pv1"><rect fill="#DCFCE7" height="110.793" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="584.9878" x="237.2251" y="503.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="395.8779" x="251.2251" y="529.8921">Survives container restarts, Pod deletion and Pod rescheduling.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="157.498" x="650.7148" y="529.8921">The PV is a cluster object</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="400.9116" x="251.2251" y="544.8408">whose lifecycle is independent of any individual Pod that uses it.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="251.2251" y="559.7896">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="463.8906" x="251.2251" y="572.8623">What finally ends it is not a Pod event at all &#8212; it is deleting the CLAIM, and even then the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="427.2813" x="251.2251" y="585.5112">RECLAIM POLICY decides: Retain keeps the data, Delete destroys it (diagram 22).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="496.8853" x="251.2251" y="598.1602">Survives a node reboot too &#8212; but if the storage is node-local, only on THAT node (diagram 23).</text></g><g class="link" data-entity-1="wl" data-entity-2="ed" data-uid="lnk10" id="link_wl_ed"><polygon fill="#475569" points="210.7251,170.6779,214.7251,161.6779,210.7251,165.6779,206.7251,161.6779,210.7251,170.6779" style="stroke:#475569;stroke-width:1;"/><path d="M210.7251,162.9986 C210.7251,163.148 210.7251,163.2977 210.7251,163.4475 C210.7251,164.6459 210.7251,165.8563 210.7251,167.0765 C210.7251,167.6866 210.7251,168.2992 210.7251,168.9141 C210.7251,169.2215 210.7251,169.5294 210.7251,169.8379 C210.7251,169.9922 210.7251,170.1465 210.7251,170.3011 C210.7251,170.3783 210.7251,170.4556 210.7251,170.5329 C210.7251,170.5716 210.7251,170.6102 210.7251,170.6489 C210.7251,170.6586 210.7251,164.6682 210.7251,164.6779" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ed" data-entity-2="mem" data-uid="lnk11" id="link_ed_mem"><polygon fill="#475569" points="210.7251,313.6288,214.7251,304.6288,210.7251,308.6288,206.7251,304.6288,210.7251,313.6288" style="stroke:#475569;stroke-width:1;"/><path d="M210.7251,306.2399 C210.7251,306.6112 210.7251,306.9832 210.7251,307.3558 C210.7251,308.8464 210.7251,310.3476 210.7251,311.8567 C210.7251,312.234 210.7251,312.6118 210.7251,312.9901 C210.7251,313.1792 210.7251,313.3684 210.7251,313.5578 C210.7251,313.5814 210.7251,307.6051 210.7251,307.6288" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="mem" data-entity-2="pv" data-uid="lnk12" id="link_mem_pv"><polygon fill="#475569" points="210.7251,470.6925,214.7251,461.6925,210.7251,465.6925,206.7251,461.6925,210.7251,470.6925" style="stroke:#475569;stroke-width:1;"/><path d="M210.7251,462.8927 C210.7251,463.6976 210.7251,464.5049 210.7251,465.3144 C210.7251,466.9335 210.7251,468.5612 210.7251,470.1947 C210.7251,470.2968 210.7251,470.3989 210.7251,470.501 C210.7251,470.5521 210.7251,470.6032 210.7251,470.6542 C210.7251,470.667 210.7251,464.6798 210.7251,464.6925" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1040.4502" x="5" y="642.8301">The slide's "ephemeral storage does not survive restarts" means a POD restart &#8212; delete and recreate. A CONTAINER restart is exactly what emptyDir exists to survive.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="581.2734" x="234.5884" y="658.9287">Get that distinction right and most ephemeral-versus-persistent questions answer themselves.</text></g><!--SRC=[ZLRRRkCs47ttLqppaWImdMGNVGa25qwYJGp4iM4xAHRe2oMDBTQIg9AKlMvHe4_zWAB_qlT-odv93qbRTYuBr0WSM28vC-USESFlP9daTShKxPw5FwjKRivIAHPQ5EPicPIYOpCkk5lLHTwoqkPCHxUA3PNAagdrIgwOD1ihj3L7zFMFlscToIJRFVk1FgbQqrAMgI4r9sEL5WiciH2oD9Piffc9LrnQqsffJgme5ox8B6DAL6cnZFMneRMMLiHuauiDQn-eLBHIULtWD4iYpu_ewcgXLLrTYxJN8u5DEVtM8ZeuzYhktKgalvOsGt2ccz7Zh3zuZ2RTgxEuzrDvPUIlV7bnqRlP1QT42vDXZoXJlsLPnvopRSecQOdewvz_4TsD7gCkkTnBNk_pf-t2kLQ5Fq8M3GY8wq8UXkwN6vl9Se689AhAruxuLY4IK5oND9SvcusnNFXAL0q0Tc18Gxa2jAhqeLQiDrYlJPCmdIIPg2pIElzukWllm8ltk5sqVdz11nULtTpA07mqle-6qQJ_q2OhENM9k