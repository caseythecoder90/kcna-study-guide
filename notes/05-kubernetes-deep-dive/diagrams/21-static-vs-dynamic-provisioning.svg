<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="797px" preserveAspectRatio="none" style="width:1100px;height:797px;background:#FFFFFF;" version="1.1" viewBox="0 0 1100 797" width="1100px" zoomAndPan="magnify"><title>Three objects, two ways to wire them &#8212; and only one of them needs an administrator</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="730.1338" x="181.0488" y="30.8838">Three objects, two ways to wire them &#8212; and only one of them needs an administrator</text></g><!--cluster objs--><g class="cluster" data-entity="objs" data-source-line="4" data-uid="ent0002" id="cluster_objs"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="960" x="77.6157" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.6836" x="488.2739" y="71.8921">THE THREE OBJECTS</text></g><!--cluster st--><g class="cluster" data-entity="st" data-source-line="12" data-uid="ent0008" id="cluster_st"><rect fill="#F8FAFC" height="205" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="566" x="77.6157" y="183.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="320.4233" x="200.4041" y="201.8921">STATIC &#8212; 'manually': the admin creates the PV first</text></g><!--cluster dy--><g class="cluster" data-entity="dy" data-source-line="16" data-uid="ent0010" id="cluster_dy"><rect fill="#F0FDF4" height="179" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="568" x="77.6157" y="396.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="357.6143" x="182.8086" y="414.8921">DYNAMIC &#8212; create ONLY the claim, name a StorageClass</text></g><!--cluster pod--><g class="cluster" data-entity="pod" data-source-line="20" data-uid="ent0012" id="cluster_pod"><rect fill="#F8FAFC" height="162" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="574" x="77.6157" y="583.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="285.3398" x="221.9458" y="601.8921">THE POD NEVER NAMES A PV &#8212; only a claim</text></g><!--entity sc--><g class="entity" data-entity="sc" data-source-line="5" data-uid="ent0003" id="entity_sc"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="292.7305" x="120.1157" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.0908" x="134.1157" y="112.8921">StorageClass</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.749" x="224.4302" y="112.8921">(sc &#183; cluster-scoped)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="264.7305" x="134.1157" y="125.9648">Describes a CLASS of storage an administrator offers.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="193.7783" x="134.1157" y="138.6138">provisioner &#183; parameters &#183; reclaimPolicy</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="223.1797" x="134.1157" y="151.2627">volumeBindingMode &#183; allowVolumeExpansion</text></g><!--entity pv--><g class="entity" data-entity="pv" data-source-line="6" data-uid="ent0004" id="entity_pv"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="263.5171" x="431.6157" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="109.8145" x="445.6157" y="112.8921">PersistentVolume</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.479" x="562.6538" y="112.8921">(pv &#183; cluster-scoped)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="226.8428" x="445.6157" y="125.9648">A piece of storage that EXISTS &#8212; made by an</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="204.8105" x="445.6157" y="138.6138">admin, or dynamically via a StorageClass.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="174.5176" x="445.6157" y="151.2627">Persists beyond any Pod's lifecycle.</text></g><!--entity pvc--><g class="entity" data-entity="pvc" data-source-line="7" data-uid="ent0005" id="entity_pvc"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="315.5044" x="713.6157" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.2153" x="727.6157" y="112.8921">PersistentVolumeClaim</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.0654" x="880.0547" y="112.8921">(pvc &#183; NAMESPACED)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="240.2061" x="727.6157" y="125.9648">A REQUEST for storage by a user: how much,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="241.4629" x="727.6157" y="138.6138">which access mode, which class. Once bound</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="255.6265" x="727.6157" y="151.2627">to a PV, a Pod mounts it BY THE CLAIM'S NAME.</text></g><!--entity st1--><g class="entity" data-entity="st1" data-source-line="13" data-uid="ent0009" id="entity_st1"><rect fill="#FFFFFF" height="163.6885" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="516.4849" x="119.6157" y="216.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8418" x="133.6157" y="242.8921">1.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.3042" x="148.0693" y="242.8921">kind: PersistentVolume  name: manual-pv001</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="311.792" x="142.7842" y="255.9648">storageClassName: local-path &#183; capacity 10Gi &#183; ReadWriteOnce</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="381.498" x="142.7842" y="268.6138">hostPath: /var/lib/rancher/k3s/storage/manual-pv001  (type DirectoryOrCreate)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="191.356" x="142.7842" y="281.2627">no reclaim policy written  &#8594;  defaults to</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="33.6177" x="337.1963" y="281.2627">Retain</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="133.6157" y="295.7876">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8418" x="133.6157" y="310.7363">2.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.4434" x="148.0693" y="310.7363">kind: PersistentVolumeClaim  name: manual-claim</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="244.5298" x="142.7842" y="323.8091">same storageClassName &#183; 10Gi &#183; ReadWriteOnce</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="9.1685" x="133.6157" y="336.458">&#160;&#160;&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="148.5537" x="142.7842" y="336.458">volumeName: manual-pv001</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="321.5942" x="300.5063" y="336.458">&#8592; pre-binds to THAT PV. Skip it and Kubernetes finds any match.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="133.6157" y="350.9829">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="485.751" x="133.6157" y="364.0557">Two objects, two people's jobs: someone has to know the storage exists before anyone can claim it.</text></g><!--entity dy1--><g class="entity" data-entity="dy1" data-source-line="17" data-uid="ent0011" id="entity_dy1"><rect fill="#DCFCE7" height="138.3906" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="518.3057" x="119.6157" y="429.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8418" x="133.6157" y="455.8921">1.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="319.3188" x="148.0693" y="455.8921">kind: PersistentVolumeClaim  name: dynamic-claim</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="384.4844" x="142.7842" y="468.9648">storageClassName: local-path &#183; 10Gi &#183; ReadWriteOnce   (no volumeName)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="133.6157" y="483.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="10.8418" x="133.6157" y="498.4385">2.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="430.771" x="148.0693" y="498.4385">The StorageClass's PROVISIONER notices and creates the PV for you</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="307.4897" x="142.7842" y="511.5112">name: pvc-&lt;uid&gt;  &#183;  reclaimPolicy copied from the class  &#8594;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="33.0161" x="456.3862" y="511.5112">Delete</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="69.6685" x="492.4585" y="511.5112">for local-path</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="481.1372" x="142.7842" y="524.1602">On k3s: provisioner rancher.io/local-path, directory pvc-&lt;uid&gt;_&lt;namespace&gt;_&lt;claim-name&gt;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="133.6157" y="538.6851">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="388.1206" x="133.6157" y="551.7578">One object. Nobody had to pre-create storage or know where it would live.</text></g><!--entity pod1--><g class="entity" data-entity="pod1" data-source-line="21" data-uid="ent0013" id="entity_pod1"><rect fill="#326CE5" height="121.1421" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="523.7144" x="119.6157" y="616.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="57.0718" x="133.6157" y="642.8921">volumes:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.7891" x="133.6157" y="655.9648">- name: manual-volume                 - name: dynamic-volume</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="300.7383" x="139.728" y="668.6138">persistentVolumeClaim:                persistentVolumeClaim:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="325.2358" x="145.8403" y="681.2627">claimName: manual-claim                claimName: dynamic-claim</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="133.6157" y="695.7876">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="495.7144" x="133.6157" y="708.8604">That indirection is the point: the Pod spec says WHAT it needs, and is portable across clusters</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="472.0977" x="133.6157" y="721.5093">whose storage is completely different. Which PV backs the claim is the cluster's business.</text></g><g class="link" data-entity-1="objs" data-entity-2="st" data-uid="lnk14" id="link_objs_st"><polygon fill="#475569" points="93.6157,183.6722,97.6157,174.6722,93.6157,178.6722,89.6157,174.6722,93.6157,183.6722" style="stroke:#475569;stroke-width:1;"/><path d="M93.6157,175.7375 C93.6157,177.3877 93.6157,179.0613 93.6157,180.7552 C93.6157,181.6021 93.6157,182.454 93.6157,183.3106 C93.6157,183.4176 93.6157,183.5248 93.6157,183.632 C93.6157,183.6454 93.6157,177.6588 93.6157,177.6722" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="st" data-entity-2="dy" data-uid="lnk15" id="link_st_dy"><polygon fill="#475569" points="93.6157,396.6811,97.6157,387.6811,93.6157,391.6811,89.6157,387.6811,93.6157,396.6811" style="stroke:#475569;stroke-width:1;"/><path d="M93.6157,388.9278 C93.6157,390.024 93.6157,391.1219 93.6157,392.2208 C93.6157,393.3197 93.6157,394.4197 93.6157,395.5203 C93.6157,395.7954 93.6157,396.0706 93.6157,396.3457 C93.6157,396.4145 93.6157,396.4833 93.6157,396.5521 C93.6157,396.5865 93.6157,396.6209 93.6157,396.6553 C93.6157,396.6639 93.6157,390.6725 93.6157,390.6811" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="dy" data-entity-2="pod" data-uid="lnk16" id="link_dy_pod"><polygon fill="#475569" points="93.6157,583.684,97.6157,574.684,93.6157,578.684,89.6157,574.684,93.6157,583.684" style="stroke:#475569;stroke-width:1;"/><path d="M93.6157,575.7621 C93.6157,575.9998 93.6157,576.2376 93.6157,576.4755 C93.6157,578.3786 93.6157,580.289 93.6157,582.203 C93.6157,582.6815 93.6157,583.1602 93.6157,583.6391 C93.6157,583.6541 93.6157,577.6691 93.6157,577.684" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1082.2314" x="5" y="765.8301">"These approaches have unique characteristics, specifically with Reclaim Policies" &#8212; the manual PV defaults to Retain, the dynamic one inherits Delete from its StorageClass.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="724.4863" x="183.8726" y="781.9287">Delete both claims and one directory survives on disk while the other is destroyed. Diagram 22 is what happens next.</text></g><!--SRC=[bLVRRjj647tNLqppaWJG9KxV1460Omk9sqHIBTLfq1R5ShaoDwPsMUvI2biKw5EVYwB_qlT-IhwaPvPKJ55iqXg6R74lCtFcd9dXPzh8j8WL3OUZwjTRcxfHhCLjBhPkT2UD6FX4RTKmAxPfpskVAbedkL9aexTAUjSdlxUq5wKZZxywLyG7wFslVv8mCLcJblZ0_asrO9IA7PP8n5jjjFEvy3RlzNBS9imjxd-mVZ6ZzOlhsOmMpxwONQnN3sWokSrjaKsd91oRTlHpZwXnPX9DLxX7tAgBL3Wt6KLJeaTEqjz_4O9qNkK39sscuiVVcOdJFwdnsTdqKZcPwqZ18RfuURvQiPkkkkV4HwnjLEw6an4VdpQkoNAxqquZp9pjPGBeALXq_0rEfa9lbpRLiZmzkxDfiLNFj8crkNrbaGsS4MbgzpTXPVOk4uRlheyo5XakD1KMJfxWi8HX-AoChsweiSXs7yVYd3Ajf6eYu1FXQVRDrMgz2WdT2hWNbK3cD8u0LPy0KrmQiTKICPIqqmBGDZFJ0L_jiAD8bHQS4QQafOqVEahrHibIfchO7Nss-sJq5mp-1mW27-RdhsQhvVd5xF8u_klPLr_FLclQ88W311mj5KxbOqhidhQ5JFgd4UmJBHCIKYhdQ8iazgbw94F8j300DhA5YK_FGZQ2bZTz_hGnJXS6K6XFpzuGAm6yl7hrS1MyRiB0rem_uC0q0Di7toOwZfNvFjUtYHzCAuIG-eu5sVlbI7QhzVdwwY8a-k5Mc88J-73CggrqG39NmaCh_6HvGnkTEz-IflCTmZmR1lplmF4njVD31BQeCLKM1zdkoPEp1Zf4XrG4zip3tjHAtYfy4YWjCY6rB-dioNFD3wwLY5_dsYk6_HHmN9bOvvSuFgRHJkIZL4UZN1YPg7nqzxaRrHP7JPz07rzcYYur1sVpSf5V13mUTremzY1yoeBoQG-F43RH-z_-88hLHXIf3rKJ45qh3r8pJ1zkmttHzEd7e0lKRk4NJBRmm_e9Y8pJVySBdbHrQdwIgqfQ2Eftod8rYE1f26hzudmDbWnfTQSpfZDtWo-BIEL6COasOIDBVIkyJ8RDk0-MrsWjHtqcKpPB5Gh3MnkvCJcxLTnR4X5CtXaebCbv4AzwLvSLA9hhUScR9UfwbHZj_wMiE7_MqiRb6yYl5aSb0rhCNxu9ri9b_P26Lgtx88xdriRLrN7vVmLobEMwjdQc-HCowSmspZq2LU-J-xYJVsk4sGmC6LXUBswkLbUB-UmQPFTQSXD5Yjj50hMqj4LB7C4zLA31fD0ndi2jupv9Q4zQnRJ