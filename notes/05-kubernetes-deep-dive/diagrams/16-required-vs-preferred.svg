<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1008px" preserveAspectRatio="none" style="width:1147px;height:1008px;background:#FFFFFF;" version="1.1" viewBox="0 0 1147 1008" width="1147px" zoomAndPan="magnify"><title>The two affinity types are the two halves of scheduling</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="467.0771" x="336.4346" y="30.8838">The two affinity types are the two halves of scheduling</text></g><!--cluster top--><g class="cluster" data-entity="top" data-source-line="4" data-uid="ent0002" id="cluster_top"><rect fill="#F8FAFC" height="126" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="636" x="263.4731" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="253.519" x="454.7136" y="71.8921">Both live under spec.affinity.nodeAffinity</text></g><!--cluster req--><g class="cluster" data-entity="req" data-source-line="8" data-uid="ent0004" id="cluster_req"><rect fill="#FEF2F2" height="268" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="562" x="263.4731" y="187.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="392.1836" x="348.3813" y="205.8921">requiredDuringSchedulingIgnoredDuringExecution &#8212; a FILTER</text></g><!--cluster pref--><g class="cluster" data-entity="pref" data-source-line="12" data-uid="ent0006" id="cluster_pref"><rect fill="#F0FDF4" height="308" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="568" x="263.4731" y="463.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="447.8208" x="323.5627" y="481.8921">preferredDuringSchedulingIgnoredDuringExecution &#8212; a SCORE BOOST</text></g><!--cluster ign--><g class="cluster" data-entity="ign" data-source-line="16" data-uid="ent0008" id="cluster_ign"><rect fill="#F8FAFC" height="177" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="578" x="263.4731" y="779.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="394.3672" x="355.2896" y="797.8921">...IgnoredDuringExecution &#8212; the half of the name nobody reads</text></g><!--entity top1--><g class="entity" data-entity="top1" data-source-line="5" data-uid="ent0003" id="entity_top1"><rect fill="#326CE5" height="85.4951" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="586.3462" x="305.4731" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="558.3462" x="319.4731" y="112.8921">Scheduling is FILTERING then SCORING (chapter 05-05), and the two affinity types are not</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.8164" x="319.4731" y="127.8408">two strengths of one thing &#8212;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="222.4409" x="502.9014" y="127.8408">they plug into DIFFERENT STAGES.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="319.4731" y="142.7896">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="506.0752" x="319.4731" y="155.8623">Which is why only one of them has a weight, and why only one of them can leave a Pod Pending.</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="9" data-uid="ent0005" id="entity_r1"><rect fill="#FEE2E2" height="226.9331" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="510.5361" x="305.9731" y="220.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.1646" x="319.9731" y="246.8921">A HARD RULE.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="385.7598" x="416.7495" y="246.8921">The scheduler cannot schedule the Pod unless the rule is met.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="319.9731" y="261.8408">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="439.4683" x="319.9731" y="274.9136">Nodes that do not match are REMOVED from the feasible set. If that empties the set,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="386.3481" x="319.9731" y="287.5625">the Pod stays Pending forever &#8212; exactly like an impossible nodeSelector.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="319.9731" y="302.0874">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="39.7192" x="319.9731" y="315.1602">affinity:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="67.8208" x="326.0854" y="327.8091">nodeAffinity:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="270.73" x="332.1978" y="340.458">requiredDuringSchedulingIgnoredDuringExecution:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="312.9468" x="338.3101" y="353.1069">nodeSelectorTerms:          &#8592; a LIST of terms, ORed together</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="354.5405" x="338.3101" y="365.7559">- matchExpressions:        &#8592; expressions within one term are ANDed</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="76.4199" x="344.4224" y="378.4048">- key: disktype</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="61.1123" x="350.5347" y="391.0537">operator: In</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="67.2461" x="350.5347" y="403.7026">values: [ssd]</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="319.9731" y="418.2275">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="479.1821" x="319.9731" y="431.3003">No weight field exists here. There is nothing to rank &#8212; a node either qualifies or it does not.</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="13" data-uid="ent0007" id="entity_p1"><rect fill="#DCFCE7" height="267.1797" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="516.979" x="305.9731" y="496.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="90.2764" x="319.9731" y="522.8921">A SOFT RULE.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="395.0908" x="413.8613" y="522.8921">The scheduler TRIES to find a node that meets it. If no matching</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="107.6563" x="319.9731" y="537.8408">node is available,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="232.6162" x="431.2412" y="537.8408">the scheduler still schedules the Pod.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="319.9731" y="552.7896">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="454.2012" x="319.9731" y="565.8623">Every node that survived filtering gets scored. For each preferred rule a node satisfies,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="456.0918" x="319.9731" y="578.5112">its WEIGHT is added to that node's sum, and the sum joins the other scoring functions.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="319.9731" y="593.0361">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="275.0161" x="332.1978" y="606.1089">preferredDuringSchedulingIgnoredDuringExecution:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="268.6406" x="332.1978" y="618.7578">- weight: 20                 &#8592; 1 to 100. Higher = stronger.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="348.4927" x="338.3101" y="631.4067">preference:                &#8592; note: 'preference', not 'nodeSelectorTerms'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="101.4814" x="344.4224" y="644.0557">matchExpressions:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="235.3452" x="344.4224" y="656.7046">- {key: disktype, operator: In, values: [nvme]}</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="60.5054" x="332.1978" y="669.3535">- weight: 10</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.9146" x="338.3101" y="682.0024">preference:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="101.4814" x="344.4224" y="694.6514">matchExpressions:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.5645" x="344.4224" y="707.3003">- {key: disktype, operator: In, values: [ssd]}</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="319.9731" y="721.8252">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="414.1597" x="319.9731" y="734.8979">Preference order: nvme (+20)  &#8594;  ssd (+10)  &#8594;  ANY node (+0, still schedulable)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="463.9067" x="319.9731" y="747.5469">A preferred rule can still LOSE: it only adds to a score other functions also contribute to.</text></g><!--entity i1--><g class="entity" data-entity="i1" data-source-line="17" data-uid="ent0009" id="entity_i1"><rect fill="#FFFFFF" height="136.0908" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="527.8271" x="305.4731" y="812.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="499.8271" x="319.4731" y="838.8921">If the node labels change AFTER the Pod is scheduled, the Pod continues to run.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="319.4731" y="853.8408">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="444.5332" x="319.4731" y="866.9136">Affinity is evaluated ONCE, at scheduling time. Remove the label that got a Pod placed and</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="406.0117" x="319.4731" y="879.5625">nothing happens to it &#8212; unlike a NoExecute taint (chapter 05-06), which does evict.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="439.5972" x="319.4731" y="892.2114">Only on the NEXT scheduling decision &#8212; a delete, a restart, a kubectl replace --force &#8212; is</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="433.5439" x="319.4731" y="904.8604">the rule re-evaluated, and that is when the Pod may land somewhere else or go Pending.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="319.4731" y="919.3853">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="408.4663" x="319.4731" y="932.458">A RequiredDuringExecution variant was designed but has never been implemented.</text></g><g class="link" data-entity-1="top" data-entity-2="req" data-uid="lnk10" id="link_top_req"><polygon fill="#475569" points="279.4731,187.6874,283.4731,178.6874,279.4731,182.6874,275.4731,178.6874,279.4731,187.6874" style="stroke:#475569;stroke-width:1;"/><path d="M279.4731,180.2437 C279.4731,180.4914 279.4731,180.7397 279.4731,180.9885 C279.4731,181.4861 279.4731,181.9858 279.4731,182.4877 C279.4731,183.4915 279.4731,184.5038 279.4731,185.524 C279.4731,186.0341 279.4731,186.5461 279.4731,187.0601 C279.4731,187.1886 279.4731,187.3172 279.4731,187.4459 C279.4731,187.5103 279.4731,187.5747 279.4731,187.6391 C279.4731,187.6552 279.4731,181.6713 279.4731,181.6874" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="req" data-entity-2="pref" data-uid="lnk11" id="link_req_pref"><polygon fill="#475569" points="279.4731,463.6829,283.4731,454.6829,279.4731,458.6829,275.4731,454.6829,279.4731,463.6829" style="stroke:#475569;stroke-width:1;"/><path d="M279.4731,455.9347 C279.4731,457.6679 279.4731,459.4062 279.4731,461.1485 C279.4731,461.584 279.4731,462.0199 279.4731,462.4559 C279.4731,462.6739 279.4731,462.892 279.4731,463.1102 C279.4731,463.2192 279.4731,463.3283 279.4731,463.4374 C279.4731,463.492 279.4731,463.5465 279.4731,463.6011 C279.4731,463.6284 279.4731,457.6557 279.4731,457.6829" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pref" data-entity-2="ign" data-uid="lnk12" id="link_pref_ign"><polygon fill="#475569" points="279.4731,779.6403,283.4731,770.6403,279.4731,774.6403,275.4731,770.6403,279.4731,779.6403" style="stroke:#475569;stroke-width:1;"/><path d="M279.4731,771.8869 C279.4731,772.2449 279.4731,772.6028 279.4731,772.9604 C279.4731,774.391 279.4731,775.8185 279.4731,777.242 C279.4731,777.9537 279.4731,778.6645 279.4731,779.3742 C279.4731,779.4629 279.4731,773.5516 279.4731,773.6403" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1129.9463" x="5" y="976.8301">required = mandatory, preferred = best effort. The giveaway in a question is what happens when NOTHING matches: required leaves the Pod Pending, preferred schedules it anyway.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="673.1826" x="233.3818" y="992.9287">And both names end in IgnoredDuringExecution, so neither one will ever move a Pod that is already running.</text></g><!--SRC=[lLVBZXf75Dtp5JVUZ2q30v6S1HeZOK_F3D84B21neemNHNS1bUckmbtLO69PoYhhACeN-ajoRdNJD2ydtcHaoUhNVPnxpwd3Dqg7SHP9QZOlyt_EcDXUHahCKv7OoyTGYuPRo4GsbraIrvnoiQJ9Gf9R6nApcTBARSXjbjAII76xUBGGyGgtp8nik91H5YizhzLI6JgXvmZnv9Ln2uhLIbAc8vcINSgmkGtOr2QIlUBY2LrTpLEJBRjT4fQSMTB76b4brhXCGShIJVz-4epwWrikHjFuzT1VF0qNOkcGgVMYqNhnh4v2HsMv9phHnZreVcPTAlNSBNmtHdEFdEdpxt_JrRIB21jQnXbIQsVekdzp4uo2mOJ6azvjC6vUNKwx3_f1Nrdrc-oqszst2nKkkCxrOeDmySR7H6Y66RWXEwsbcYzSNkB9rqAXAPO2w0bwOo9w8tM4ef2DqtGPCX66KhiIitRjqnx-gNoVgLH6rrcA3tS8zkVQbBU33pBCd3BQToiAQCk1l19H7X_13cS2Q7fqrnjTq-Y7-y33uFUcM0VC0Jq0u_A6dmNtakbOMkilKxuFg1BfcdiW3h0V_8fm51aU5IN20LOUt2ZuVlXZS4spr2G-oamAgwQ8P166-hFyEvaidP9v7Zoe5z1LacmBiavix1PYcW6U5SfdHEG74JgC9bQFc8GcbIoDpNFn1ezb341CsYnZLw9lLwvpd9YeklydNs2ilsQ0PuBGNfqJcIQsG-NVvp_-nD3l- -E9Npn-MgVXI88tPYu1JtekQYEVH_1XcMAMoByBoq7bxZwj5VCf9nOo-17s1jSoEXURep_AJOSYPH-Ph-TV939BcGgqrg6-_j9xAn5d4aN-OctqxjIu1gPW9SsKZ2EqeAop10naanSxzOkAJVJY02L8XNuiQCCOarGC6BtFHAncl7Wc9SNhA_rdLUfEIruTiXQmpMJwjRHb2GperN0udfJSlJMcIC8nJx9tFBoPd6NlPDGFnjmdbZJQzkY9bKW9O5HEDMtoJK1L3zg_0vJ4IgXOW2NrGa4hSQrJSLnUswqg7Eje019kAcbjbgvmd