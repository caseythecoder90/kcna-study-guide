<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="702px" preserveAspectRatio="none" style="width:1077px;height:702px;background:#FFFFFF;" version="1.1" viewBox="0 0 1077 702" width="1077px" zoomAndPan="magnify"><title>Same Pod template, two controllers &#8212; interchangeable Pods versus Pods with names</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="735.1963" x="167.1528" y="30.8838">Same Pod template, two controllers &#8212; interchangeable Pods versus Pods with names</text></g><!--cluster d--><g class="cluster" data-entity="d" data-source-line="4" data-uid="ent0002" id="cluster_d"><rect fill="#FEF2F2" height="202" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="638" x="227.251" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="325.8315" x="383.3352" y="71.8921">DEPLOYMENT &#8212; stateless, interchangeable replicas</text></g><!--cluster s--><g class="cluster" data-entity="s" data-source-line="8" data-uid="ent0004" id="cluster_s"><rect fill="#F0FDF4" height="215" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="620" x="227.251" y="263.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="312.8062" x="380.8479" y="281.8921">STATEFULSET &#8212; each Pod keeps a sticky identity</text></g><!--cluster g--><g class="cluster" data-entity="g" data-source-line="12" data-uid="ent0006" id="cluster_g"><rect fill="#F8FAFC" height="164" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="616" x="227.251" y="486.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="508.5107" x="280.9956" y="504.8921">The four things a StatefulSet adds &#8212; use one only if you need at least one of them</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="5" data-uid="ent0003" id="entity_d1"><rect fill="#FEE2E2" height="161.3887" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="586.771" x="269.751" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.2891" x="283.751" y="112.8921">Deployment  nginx</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="482.8882" x="289.8633" y="125.9648">owns a ReplicaSet  nginx-5d9c8b7f4   &#8592; each ReplicaSet has its own ID (pod-template-hash)</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="493.8936" x="289.8633" y="138.6138">which owns Pods     nginx-5d9c8b7f4-x7k2p &#183; nginx-5d9c8b7f4-q9w4m &#183; nginx-5d9c8b7f4-r2t8n</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="283.751" y="153.1387">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="156.4814" x="283.751" y="166.2114">Pod names are RANDOMISED</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.2334" x="443.2886" y="166.2114">and change every time a Pod is replaced. Any replica can serve any request,</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="403.4229" x="283.751" y="178.8604">so nobody cares which one answered. All created and deleted IN PARALLEL.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="283.751" y="193.3853">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="44.6177" x="283.751" y="206.458">Storage:</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="331.3267" x="331.4248" y="206.458">a PVC in the Pod template is the SAME claim in every replica &#8212;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="343.4976" x="283.751" y="219.1069">one PersistentVolume SHARED BY ALL PODS in the Deployment.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="355.7114" x="283.751" y="231.7559">With ReadWriteOnce, replicas on other nodes cannot even mount it.</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="9" data-uid="ent0005" id="entity_s1"><rect fill="#DCFCE7" height="174.0376" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="569.0298" x="269.751" y="296.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144.46" x="283.751" y="322.8921">StatefulSet  nginx      &#8592;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.7554" x="431.8228" y="322.8921">no ReplicaSet in between</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="236.2026" x="588.5781" y="322.8921">; the controller owns the Pods directly</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="202.2861" x="289.8633" y="335.9648">Pods  nginx-0 &#183; nginx-1 &#183; nginx-2       &#8592;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="42.7861" x="495.2056" y="335.9648">ordinals</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="46.4492" x="537.9917" y="335.9648">, 0 to N-1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="283.751" y="350.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.7969" x="283.751" y="363.5625">The identity sticks to the Pod</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256.0991" x="436.5479" y="363.5625">, regardless of which node it is (re)scheduled on:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="381.4229" x="289.8633" y="376.2114">&#183; the SAME NAME                nginx-1 is recreated as nginx-1, never nginx-7</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="352.6714" x="289.8633" y="388.8604">&#183; the SAME DNS NAME           nginx-1.nginx.default.svc.cluster.local</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="370.4121" x="289.8633" y="401.5093">&#183; the SAME STORAGE            its own PVC, reattached wherever it lands</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="435.3486" x="283.751" y="414.1582">The Pod's IP address CAN change. The name is the stable thing &#8212; that is the point.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="283.751" y="428.6831">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="44.6177" x="283.751" y="441.7559">Storage:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="313.5913" x="331.4248" y="441.7559">volumeClaimTemplates &#8212; each Pod gets its OWN claim, 1:1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="461.4253" x="289.8633" y="454.4048">nginx-0 &#8594; PVC nginx-nginx-0 &#8594; PV    nginx-1 &#8594; PVC nginx-nginx-1 &#8594; PV    nginx-2 &#8594; ...</text></g><!--entity g1--><g class="entity" data-entity="g1" data-source-line="13" data-uid="ent0007" id="entity_g1"><rect fill="#326CE5" height="123.4419" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="564.728" x="269.751" y="519.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="283.751" y="545.8921">1</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.0317" x="298.2046" y="545.8921">Stable, unique network identifiers</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="535.1309" y="545.8921">2</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="158.939" x="549.5845" y="545.8921">Stable, persistent storage</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="283.751" y="560.8408">3</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="260.0635" x="298.2046" y="560.8408">Ordered, graceful deployment and scaling</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="572.7153" y="560.8408">4</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="220.3081" x="587.1689" y="560.8408">Ordered, automated rolling updates</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="283.751" y="575.7896">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="483.8604" x="283.751" y="588.8623">'Stable' means persistence across Pod (re)scheduling. If an application needs none of these,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.2012" x="283.751" y="601.5112">the docs say to use a Deployment &#8212; it is simpler, faster, and easier to scale.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="536.728" x="283.751" y="614.1602">Typical StatefulSet workloads: databases, Kafka, ZooKeeper, etcd, Elasticsearch &#8212; anything clustered</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="376.5352" x="283.751" y="626.8091">whose members must find each other by name and keep their own data.</text></g><g class="link" data-entity-1="d" data-entity-2="s" data-uid="lnk8" id="link_d_s"><polygon fill="#475569" points="243.251,263.6532,247.251,254.6532,243.251,258.6532,239.251,254.6532,243.251,263.6532" style="stroke:#475569;stroke-width:1;"/><path d="M243.251,256.5603 C243.251,256.8591 243.251,257.1581 243.251,257.4574 C243.251,258.6543 243.251,259.8543 243.251,261.0568 C243.251,261.658 243.251,262.2599 243.251,262.8623 C243.251,263.0129 243.251,263.1635 243.251,263.3142 C243.251,263.3895 243.251,263.4648 243.251,263.5402 C243.251,263.5779 243.251,257.6155 243.251,257.6532" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s" data-entity-2="g" data-uid="lnk9" id="link_s_g"><polygon fill="#475569" points="243.251,486.5436,247.251,477.5436,243.251,481.5436,239.251,477.5436,243.251,486.5436" style="stroke:#475569;stroke-width:1;"/><path d="M243.251,478.836 C243.251,479.9173 243.251,480.9993 243.251,482.0813 C243.251,483.1633 243.251,484.2454 243.251,485.327 C243.251,485.5974 243.251,485.8678 243.251,486.1381 C243.251,486.2733 243.251,480.4085 243.251,480.5436" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1059.502" x="5" y="670.8301">Same template, same image, same replica count. The difference is whether a replica is a disposable copy or a named member &#8212; "cattle" or "pets", in the older vocabulary.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="717.4385" x="176.0317" y="686.9287">A Deployment's Pods are fungible; a StatefulSet's are not, and Kubernetes goes to some trouble to keep it that way.</text></g><!--SRC=[XLRDRXit4BxhAQQ-E06aTUIcIE880fHOJOmuac2f2LBqGf5SYJ2Nt91SAs