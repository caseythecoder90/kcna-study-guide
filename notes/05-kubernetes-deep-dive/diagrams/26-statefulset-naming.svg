<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="727px" preserveAspectRatio="none" style="width:1058px;height:727px;background:#FFFFFF;" version="1.1" viewBox="0 0 1058 727" width="1058px" zoomAndPan="magnify"><title>Three names, three formulas &#8212; the lecture named everything "nginx", so here every object gets its own name</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="939.3486" x="55.8105" y="30.8838">Three names, three formulas &#8212; the lecture named everything "nginx", so here every object gets its own name</text></g><!--cluster o--><g class="cluster" data-entity="o" data-source-line="4" data-uid="ent0002" id="cluster_o"><rect fill="#F8FAFC" height="139" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="600" x="220.9849" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="475.5347" x="283.2175" y="71.8921">THE OBJECTS &#8212; deliberately given different names (the docs' own example)</text></g><!--cluster pn--><g class="cluster" data-entity="pn" data-source-line="12" data-uid="ent0008" id="cluster_pn"><rect fill="#F0FDF4" height="135" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="592" x="220.9849" y="200.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="291.5034" x="371.2332" y="218.8921">1 &#183; POD NAME  =  &lt;statefulset name&gt;-&lt;ordinal&gt;</text></g><!--cluster dn--><g class="cluster" data-entity="dn" data-source-line="16" data-uid="ent0010" id="cluster_dn"><rect fill="#F0FDF4" height="162" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="632" x="220.9849" y="343.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="514.103" x="279.9333" y="361.8921">2 &#183; POD DNS NAME  =  &lt;pod name&gt;.&lt;service name&gt;.&lt;namespace&gt;.svc.cluster.local</text></g><!--cluster cn--><g class="cluster" data-entity="cn" data-source-line="20" data-uid="ent0012" id="cluster_cn"><rect fill="#F0FDF4" height="162" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="602" x="220.9849" y="513.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="400.6069" x="321.6814" y="531.8921">3 &#183; PVC NAME  =  &lt;template name&gt;-&lt;statefulset name&gt;-&lt;ordinal&gt;</text></g><!--entity sts--><g class="entity" data-entity="sts" data-source-line="5" data-uid="ent0003" id="entity_sts"><rect fill="#326CE5" height="72.8462" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="155.8735" x="262.9849" y="99.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.9009" x="276.9849" y="125.3921">StatefulSet</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.979" x="276.9849" y="140.3408">metadata.name:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="25.2827" x="379.5757" y="140.3408">web</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.3145" x="276.9849" y="155.2896">replicas: 3</text></g><!--entity svc--><g class="entity" data-entity="svc" data-source-line="6" data-uid="ent0004" id="entity_svc"><rect fill="#FFFFFF" height="98.144" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="160.2217" x="436.9849" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="106.9644" x="450.9849" y="112.8921">Headless Service</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.9453" x="450.9849" y="127.8408">metadata.name:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="34.6646" x="548.542" y="127.8408">nginx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="88.8735" x="450.9849" y="142.7896">clusterIP: None</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="129.626" x="450.9849" y="155.8623">StatefulSet points at it with</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="122.8853" x="450.9849" y="168.5112">spec.serviceName: nginx</text></g><!--entity vct--><g class="entity" data-entity="vct" data-source-line="7" data-uid="ent0005" id="entity_vct"><rect fill="#FFFFFF" height="83.1953" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="197.9575" x="614.9849" y="94.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.2153" x="628.9849" y="120.3921">volumeClaimTemplates</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8862" x="628.9849" y="135.3408">- metadata.name:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="30.3354" x="734.4829" y="135.3408">www</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="169.9575" x="628.9849" y="148.4136">accessModes, storageClassName,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="133.2891" x="628.9849" y="161.0625">resources.requests.storage</text></g><!--entity pn1--><g class="entity" data-entity="pn1" data-source-line="13" data-uid="ent0009" id="entity_pn1"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="541.0845" x="263.4849" y="233.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133.6309" x="277.4849" y="259.8921">web-0 &#183; web-1 &#183; web-2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="513.0845" x="277.4849" y="272.9648">Built from the STATEFULSET's name. NOT the Service's name &#8212; the lecture's 'nginx-0' came from</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="447.4658" x="277.4849" y="285.6138">a StatefulSet called nginx, which merely happened to share its name with the Service.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="350.9902" x="277.4849" y="298.2627">Also the Pod's HOSTNAME, and stamped on the Pod as two labels:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="410.1313" x="283.5972" y="310.9116">statefulset.kubernetes.io/pod-name: web-1      apps.kubernetes.io/pod-index: 1</text></g><!--entity dn1--><g class="entity" data-entity="dn1" data-source-line="17" data-uid="ent0011" id="entity_dn1"><rect fill="#DCFCE7" height="121.1421" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="582.4473" x="262.9849" y="376.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.1226" x="276.9849" y="402.8921">web-1.nginx.default.svc.cluster.local</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.7598" x="276.9849" y="415.9648">The governing Service supplies the DOMAIN:  nginx.default.svc.cluster.local</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="316.2876" x="276.9849" y="428.6138">Each Pod gets a subdomain of it:            web-1 + that domain</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="276.9849" y="443.1387">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="554.4473" x="276.9849" y="456.2114">REQUIRES a HEADLESS Service (clusterIP: None). A normal ClusterIP Service answers with one virtual IP</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="522.645" x="276.9849" y="468.8604">and load-balances; a headless one publishes a DNS record PER POD. You must create it yourself &#8212;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="472.6616" x="276.9849" y="481.5093">the StatefulSet never does. Its Endpoints list shows each Pod's hostname alongside its IP.</text></g><!--entity cn1--><g class="entity" data-entity="cn1" data-source-line="21" data-uid="ent0013" id="entity_cn1"><rect fill="#DCFCE7" height="121.1421" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="551.2412" x="263.4849" y="546.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="237.6245" x="277.4849" y="572.8921">www-web-0 &#183; www-web-1 &#183; www-web-2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="521.415" x="277.4849" y="585.9648">Read it as &lt;template name&gt;-&lt;POD name&gt;. In the lecture the template AND the StatefulSet were both</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="477.1411" x="277.4849" y="598.6138">called nginx, giving nginx-nginx-0 &#8212; which the slide labels '&lt;service&gt;-&lt;instance&gt;'. The first</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="323.4473" x="277.4849" y="611.2627">'nginx' is the volumeClaimTemplate's name, not the Service's.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="277.4849" y="625.7876">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="523.2412" x="277.4849" y="638.8604">Because the name is deterministic, a recreated web-1 finds www-web-1 waiting and mounts it again.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="504.6089" x="277.4849" y="651.5093">That is the whole mechanism behind 'stable storage' &#8212; no lookup table, just a predictable name.</text></g><g class="link" data-entity-1="o" data-entity-2="pn" data-uid="lnk14" id="link_o_pn"><polygon fill="#475569" points="236.9849,200.6908,240.9849,191.6908,236.9849,195.6908,232.9849,191.6908,236.9849,200.6908" style="stroke:#475569;stroke-width:1;"/><path d="M236.9849,192.9428 C236.9849,193.6614 236.9849,194.3821 236.9849,195.1047 C236.9849,196.5499 236.9849,198.0025 236.9849,199.46 C236.9849,199.8243 236.9849,200.189 236.9849,200.5539 C236.9849,200.5996 236.9849,194.6452 236.9849,194.6908" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="pn" data-entity-2="dn" data-uid="lnk15" id="link_pn_dn"><polygon fill="#475569" points="236.9849,343.6781,240.9849,334.6781,236.9849,338.6781,232.9849,334.6781,236.9849,343.6781" style="stroke:#475569;stroke-width:1;"/><path d="M236.9849,336.2041 C236.9849,336.594 236.9849,336.9847 236.9849,337.3763 C236.9849,338.1594 236.9849,338.9457 236.9849,339.7349 C236.9849,340.5241 236.9849,341.3162 236.9849,342.1107 C236.9849,342.508 236.9849,342.9059 236.9849,343.3043 C236.9849,343.404 236.9849,343.5036 236.9849,343.6033 C236.9849,343.6282 236.9849,337.6531 236.9849,337.6781" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="dn" data-entity-2="cn" data-uid="lnk16" id="link_dn_cn"><polygon fill="#475569" points="236.9849,513.6564,240.9849,504.6564,236.9849,508.6564,232.9849,504.6564,236.9849,513.6564" style="stroke:#475569;stroke-width:1;"/><path d="M236.9849,505.8494 C236.9849,507.6183 236.9849,509.3973 236.9849,511.1831 C236.9849,511.6295 236.9849,512.0764 236.9849,512.5236 C236.9849,512.7472 236.9849,512.9709 236.9849,513.1947 C236.9849,513.3066 236.9849,513.4185 236.9849,513.5304 C236.9849,513.5584 236.9849,513.5864 236.9849,513.6144 C236.9849,513.6284 236.9849,507.6424 236.9849,507.6564" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1040.9697" x="5" y="695.8301">Pod name from the StatefulSet. DNS domain from the Service. PVC prefix from the template. Name all three "nginx" and the formulas become impossible to tell apart &#8212;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="481.2432" x="284.8633" y="711.9287">which is exactly why the documentation's example uses web, nginx and www.</text></g><!--SRC=[bLRHRjis57ttLzpbnIrcAtNxvda6tCHRF3IE5xi3XdKFj4XRR2bI4oahsJ1W7x5_sVi-PL-oGr9s5Dl5i2099F7gtgjpppda5rAdgkA2akGo_ZfZbBtaacrBbjlBJwbcVPU9N2H5bQkEaqu9McMb4AHPBcoFNBZPc3Al5BFqpnz_uf4W9L9NbJ6AazY9yj5bKc_fGc-bVhZeaJMK2KI4DJBhZtY3ji9PalWpjGxlTZebdZEzHTsBrSsKxjv-DxrQBKCXBfHSYv8veHvfAtT24vUR3R9g5_kZ5xuPRbBR3Id50yiB9LvUq6YqBKrLZCU4hWtzrY5gLHgjnqk7l9jABOKRNQx77tGk7EFCiSHd7X92Qh6EIwKeb4oP7T8RdvcbAJg8gQsp9wbl1EDAM4jBKUvaAZwNFq0L5p4dwqGvMmnfRhJue4TM_Yg6Wq6xJogCr02FEM18jNJPwDA7ZLlXjX1fOcFTUIZKL0c1llj2CQcRvdVfIVCxewfSN24eNmc0YUeszjYdCn3LTLmyDE31iVRMSCyUwqp9jZwRjRwRtcd3fR2cAl5EKefVAW4ya-QjyptlKeUU4KRzdpB9kT0_btARkVwu-HpyFrtoR_t-Z6m3-lilMjnTqtnoEoNwccXa6wYjYFGQzqUcv58pDJuGwbjZU6oaq6TO1ShqN_dC_cAmltXzXD7RIYf7czBaGKpBrMGr_URzk-LqrRMXSaBpkrLSYwDidX_h3u-xORxzLrrAVO1FUWeoepQDKgOKL1jUx56ToJJ3Q4kliemLXT1OT8Ping1VhzPGslEjtL9oMcQYe7eViZ0ShTtSBLSUtHunpJ4oQ1EPZTw7U1HTRKYnjL1sU9hFp_amakHJ1JFG0dnCfBai3Ez76aQemm-wjsVYfERYOKY35gEshJaEZgZnUa-Dw_coHGzaYhH8Het0zhV1YmgMuXhiInen9ye0wJFCuPzZpY09CqcusB1AkTDaHpnQ0SUjWS5gRxtDNCXM1UmAvkXXlhwxdSpcGwB_p7mC_fI15dvAmRGPqgwvoQ53CXkmOaYjdpY2Br4HtXIZ3WbRAU-dtx-VtK-No7OpdLo_cowNXwvV75dWouGcfB7lC4LN-wL3DDEs5gMDf4GqxMJfAeJE5cVO3_OfmtX_pHJJi9glq42sDsd_Tb6jbRIPyD_fXuxHGFcqcDvx7YJqewaeHm-KbWA4zFRx2DUoGcsy94zB1fsq9AVzDWXam4cQ0SwfvesPeww3r4njIJI8GpgPiIweZYcZjrRoACJP8ZdBONx2uJU1mpzSjVZh6ZlVUzl_ixlqB6dhklzaUStDe7rpR7ttWDt3Xumd3Nd9HKNHJ3yxPlZhG_HaVat7-DR-gB4svtR4vsw7OuJNIZJDnZg3gqORz7cjyd17KwBkNkleJsf01lwCkmbvwMraQTrfmUZ8NP9HWMSsrCRDU-2tU-xooJdPl1Kfgsn48P02cJdyhSob1dja2eFrWmdSv8qODp0zsvf9pQJpN-x5a9jAXuCOiIsaUiR9Lrx8pGVKcS6uSv5c3ELoMWkSz3Xr0SOQ2yrktGqeQhYvCP-gWi9YZpvwrJ0gIi5b6by86znP6gUHneRw7ASvRDk5xc2RtTzntU5FTwdkT59ME8aDPIJ7YyQTMzlg4p-IeEh6lfu2ceqiw0GTRkJ3q-AURjYAemvLSnPkJhW1I1zuE1klOHf-E7bXh9N-Ix69ukogi2snqaMZa1vbEOvi0y0uiQOE6s-TFL9pbWLRD5h7TtNj_aHBcB_ra-r5weRg66xYC_uB]--></g></svg>