<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="891px" preserveAspectRatio="none" style="width:1320px;height:891px;background:#FFFFFF;" version="1.1" viewBox="0 0 1320 891" width="1320px" zoomAndPan="magnify"><title>How your admin kubeconfig became a superuser &#8212; and why your username appears nowhere</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="807.2227" x="252.6553" y="30.8838">How your admin kubeconfig became a superuser &#8212; and why your username appears nowhere</text></g><!--cluster point--><g class="cluster" data-entity="point" data-source-line="12" data-uid="ent0006" id="cluster_point"><rect fill="#FEF2F2" height="192" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="686" x="439.0166" y="647.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="496.9453" x="533.5439" y="665.8921">THE POINT: search the USERS column for system:admin and you will not find it.</text></g><!--entity cert--><g class="entity" data-entity="cert" data-source-line="4" data-uid="ent0002" id="entity_cert"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="402.6982" x="253.5166" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="236.9707" x="267.5166" y="79.8921">1 &#183; Your certificate, from chapter 05-02</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="259.8213" x="267.5166" y="92.9648">Subject: O = system:masters, CN = system:admin</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="374.6982" x="267.5166" y="105.6138">CN &#8594; the USERNAME system:admin &#183; O &#8594; the GROUP system:masters</text></g><!--entity authn--><g class="entity" data-entity="authn" data-source-line="6" data-uid="ent0003" id="entity_authn"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="521.0771" x="194.5166" y="158.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.1968" x="208.5166" y="184.8921">2 &#183; Authentication produces a username AND a set of groups</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="122.8799" x="208.5166" y="197.9648">username: system:admin</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="232.9282" x="208.5166" y="210.6138">groups:   system:masters, system:authenticated</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="493.0771" x="208.5166" y="223.2627">Nothing was looked up. The certificate ASSERTS the group and the CA's signature makes it credible.</text></g><!--entity crb--><g class="entity" data-entity="crb" data-source-line="8" data-uid="ent0004" id="entity_crb"><rect fill="#DCFCE7" height="123.4419" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="439.9683" x="235.0166" y="300.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="332.9663" x="249.0166" y="326.8921">3 &#183; A ClusterRoleBinding that shipped with the cluster</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="204.1392" x="249.0166" y="339.9648">kubectl get clusterrolebindings -o wide</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="249.0166" y="354.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="267.7061" x="249.0166" y="367.5625">NAME            ROLE                        USERS   GROUPS</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="218.2168" x="249.0166" y="380.2114">cluster-admin   ClusterRole/cluster-admin</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="39.7246" x="476.4019" y="380.2114">(empty)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="6.1123" x="516.1265" y="380.2114">&#160;&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="83.7729" x="522.2388" y="380.2114">system:masters</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="249.0166" y="394.7363">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="411.9683" x="249.0166" y="407.8091">It binds the SUBJECT Group system:masters to the ClusterRole cluster-admin.</text></g><!--entity cr--><g class="entity" data-entity="cr" data-source-line="10" data-uid="ent0005" id="entity_cr"><rect fill="#DCFCE7" height="136.0908" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="444.9365" x="232.5166" y="484.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="187.7954" x="246.5166" y="510.8921">4 &#183; The ClusterRole it points at</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.7891" x="246.5166" y="523.9648">kubectl describe ClusterRole/cluster-admin</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="246.5166" y="538.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="301.3882" x="246.5166" y="551.5625">Resources  Non-Resource URLs  Resource Names  Verbs</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.0669" x="246.5166" y="564.2114">*.*        []                 []              [*]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="122.2246" x="280.1343" y="576.8604">[*]                []              [*]</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="246.5166" y="591.3853">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="416.9365" x="246.5166" y="604.458">Every verb on every resource in every API group, plus every non-resource URL.</text></g><!--entity p--><g class="entity" data-entity="p" data-source-line="13" data-uid="ent0007" id="entity_p"><rect fill="#FEE2E2" height="151.0396" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="634.7407" x="481.5166" y="680.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="606.7407" x="495.5166" y="706.8921">There is no user of system:admin anywhere in Kubernetes &#8212; no object, no binding entry, nothing.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="495.5166" y="721.8408">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="541.562" x="495.5166" y="734.9136">The binding names a GROUP. Your certificate claims membership of that group. Permissions given to a</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="500.0542" x="495.5166" y="747.5625">group are received by every user in it, so the username never has to be written down anywhere.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="495.5166" y="762.0874">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="506.2363" x="495.5166" y="775.1602">&#8220;The user doesn't need to be listed in the clusterrolebinding output. If it is referenced in a signed</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="230.4521" x="495.5166" y="787.8091">CA certificate it is classed as in that group.&#8221;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="495.5166" y="802.334">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="553.1636" x="495.5166" y="815.4067">Which is also why a certificate cannot be revoked out of a group: the group membership IS the certificate.</text></g><g class="link" data-entity-1="cert" data-entity-2="authn" data-uid="lnk8" id="link_cert_authn"><polygon fill="#475569" points="455.0166,158.6033,459.0166,149.6033,455.0166,153.6033,451.0166,149.6033,455.0166,158.6033" style="stroke:#475569;stroke-width:1;"/><path d="M455.0166,121.849 C455.0166,133.4312 455.0166,140.5492 455.0166,152.6033" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="authn" data-entity-2="crb" data-uid="lnk9" id="link_authn_crb"><polygon fill="#475569" points="455.0166,300.539,459.0166,291.539,455.0166,295.539,451.0166,291.539,455.0166,300.539" style="stroke:#475569;stroke-width:1;"/><path d="M455.0166,239.996 C455.0166,258.2472 455.0166,274.2865 455.0166,294.539" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.7813" x="461.0166" y="274.9541">groups are the subject RBAC matches on</text></g><g class="link" data-entity-1="crb" data-entity-2="cr" data-uid="lnk10" id="link_crb_cr"><polygon fill="#475569" points="455.0166,484.6015,459.0166,475.6015,455.0166,479.6015,451.0166,475.6015,455.0166,484.6015" style="stroke:#475569;stroke-width:1;"/><path d="M455.0166,423.8784 C455.0166,443.2511 455.0166,458.8004 455.0166,478.6015" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="38.6836" x="461.0166" y="458.9541">roleRef</text></g><g class="link" data-entity-1="cr" data-entity-2="point" data-uid="lnk11" id="link_cr_point"><polygon fill="#475569" points="455.0166,647.3784,459.0166,638.3784,455.0166,642.3784,451.0166,638.3784,455.0166,647.3784" style="stroke:#475569;stroke-width:1;"/><path d="M455.0166,620.7948 C455.0166,626.4046 455.0166,632.1716 455.0166,638.0145 C455.0166,640.9359 455.0166,643.8763 455.0166,646.8254 C455.0166,647.0097 455.0166,641.194 455.0166,641.3784" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="21"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1302.5332" x="5" y="859.8301">This is the whole of RBAC in one chain, and every link is visible from the command line. It also explains chapter 05-02's warning: removing someone's access means removing the BINDING, because you cannot</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1042.0566" x="135.2383" y="875.9287">take the group out of a certificate you already signed. Bind to groups and the identity provider controls membership; bind to users and you are maintaining a list by hand.</text></g><!--SRC=[bLRDZkD44BxdAOgzB8mIPsU1ImYHCjdHR639Z98C22rxQDkLk1cxs-fk9mI4D2SU0764v-3EeyoJKDLs73l9217DJzokt- -hd_v8gYWjOeGWw9S_JklKzcCfraPajlyGAT5p2MOOv4MMTfnqAS9RlOMTBWo8E9CA7eeG8wrMSWtqHMG80coHeoai6dXw_0E4Yc6Rx4ebFbLUAizH60jARnCqsEaOZ9nGQ_BmuXB- -Hk-P_48ZPCh6Gc7NLWPdK6KYDoHvLUVzrwz_a4DhVmP1vUNeqKH_aWM1d0BNuBTMOVP81FqpzWkJ6Q7Gn_siCzweuO-YJpzzZjGkd2_k9xFnjzSjpGufDjQv6P-UtztvAQo-GA6Gn55gDne1CBw55hPlMPJuuBCACUPIQqWDpek8hG4NetGUFQ6iKG7UWLheulSDkBTYmt-8wzISG1m0ifUxn09ngVwC-qIgTQmfLHIhHymXY8FO4aWDCY1yO90MouyEDwbfvsV9kEN5gnSA-4AWv291qfJEeWCnZ9CCMZWbgT2gX8s3akrSFlKumQJjE04vZh5AwbYZiqbme5D99KKbPfqYNSSbOADN7ojkXJMX6drrf2Pi3HZeQT9EyOQX2OCN0-Dp_psNUkv-U7wMT1_NoIBKqWhrxsohg2PKV_utJ0SVOnPxdQV3FlXo3yVLrquEXVmr07dPJqKY_khhwudIxZnpBGDWDCbJuSee1L5aw2rrd5LrYPiiVCPixCyiaCqvregHtIwCpp4Q2CZGtmUWNEPpT7IQE1cWPbMlVqZtC_VqL7zEAFceETlqOJsb8EBu69Fr_iF9mmU7xs_-71gelt-_vXe6BdUeDa1_Gc1nW3w9xDFGUvFndVJigkwa1CyrQcYx4qZ- -U8Ql6qV7iDTxVJsP861mtWAAb7tW8YdHQPWfKsxT77hKpJcveZJSchWnLL5f4RU4ySrvMel7cwuPSEGDCdJtYGFEpzUEE1TkHWjorb57nDnM4KEYAFjmUfQ3_Pk_orQbMWWMLsVEA7Kz22b8jmBwTy4OYo5OEJdKA5BcHc8SECdF84uT3yEF5f1N279fFMqeosi9ORLDmkufan2u9IeBoH16C8TnLFFcNAJ58EjcosUiWh5e54-3QaJjWQwHnvYVNs04jmhdAU7lzSLfP86grwwSWQ-IqDfPBmZTbjOnOsfXtemkM52s2