<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="624px" preserveAspectRatio="none" style="width:1307px;height:624px;background:#FFFFFF;" version="1.1" viewBox="0 0 1307 624" width="1307px" zoomAndPan="magnify"><title>Three ways to prove who you are &#8212; and one set of rules afterwards</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="578.1533" x="360.6719" y="30.8838">Three ways to prove who you are &#8212; and one set of rules afterwards</text></g><!--cluster ext--><g class="cluster" data-entity="ext" data-source-line="4" data-uid="ent0002" id="cluster_ext"><rect fill="#F8FAFC" height="391" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="456" x="50.2485" y="67.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="319.2681" x="118.6145" y="85.8921">NORMAL USERS &#8212; managed OUTSIDE Kubernetes</text></g><!--cluster sa--><g class="cluster" data-entity="sa" data-source-line="10" data-uid="ent0006" id="cluster_sa"><rect fill="#F0FDF4" height="147" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="518" x="754.2485" y="61.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="308.4453" x="859.0259" y="79.8921">SERVICE ACCOUNTS &#8212; managed BY Kubernetes</text></g><!--entity out--><g class="entity" data-entity="out" data-source-line="14" data-uid="ent0008" id="entity_out"><rect fill="#326CE5" height="55.5977" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="508.3462" x="516.2485" y="315.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="480.3462" x="530.2485" y="341.8921">AUTHENTICATION produces the same three things, whichever route you took</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="369.1929" x="530.2485" y="354.9648">a USERNAME &#183; a set of GROUPS &#183; (plus system:authenticated, always)</text></g><!--entity rbac--><g class="entity" data-entity="rbac" data-source-line="16" data-uid="ent0009" id="entity_rbac"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="597.0352" x="471.7485" y="486.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="397.9663" x="485.7485" y="512.8921">AUTHORIZATION &#8212; RBAC does not care how you authenticated</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="569.0352" x="485.7485" y="525.9648">Roles and ClusterRoles say WHAT may be done; RoleBindings and ClusterRoleBindings say WHO may do it,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="399.1313" x="485.7485" y="538.6138">and the WHO is just a subject: User, Group, or ServiceAccount &#8212; a STRING.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="535.4766" x="485.7485" y="551.2627">Swap client certificates for SSO tomorrow and every binding still applies, as long as the names match.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="477.9844" x="485.7485" y="563.9116">That separation is the authentication/authorization split from chapter 05-01, made concrete.</text></g><!--entity cert--><g class="entity" data-entity="cert" data-source-line="5" data-uid="ent0003" id="entity_cert"><rect fill="#326CE5" height="93.5444" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="357.4629" x="99.7485" y="100.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.5698" x="113.7485" y="126.8921">X.509 client certificate</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="227.4067" x="113.7485" y="139.9648">the kubeadm and k3s default, and every lab</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.6899" x="113.7485" y="152.6138">CN &#8594; username &#183; O &#8594; groups</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="329.4629" x="113.7485" y="165.2627">issued by the cluster CA, often via a CertificateSigningRequest</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.9307" x="113.7485" y="177.9116">no revocation &#8212; valid until it expires</text></g><!--entity oidc--><g class="entity" data-entity="oidc" data-source-line="6" data-uid="ent0004" id="entity_oidc"><rect fill="#326CE5" height="214.2842" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="438.7705" x="58.7485" y="236.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="312.0635" x="72.7485" y="262.8921">OIDC / SSO token &#8212; how enterprises actually do it</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="297.0322" x="72.7485" y="275.9648">you run a login command, it talks to the identity provider</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="367.9253" x="72.7485" y="288.6138">(Entra ID, Okta, ADFS, Google) and writes tokens into your kubeconfig</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="72.7485" y="303.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="161.96" x="72.7485" y="316.2114">auth-provider or exec, holding:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="248.1338" x="78.8608" y="328.8604">id-token      a signed JWT &#8212; THIS is the identity</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="326.4121" x="78.8608" y="341.5093">refresh-token used to renew silently when the id-token expires</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="310.793" x="78.8608" y="354.1582">idp-issuer-url + client-id   which provider, which application</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="72.7485" y="368.6831">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="371.062" x="72.7485" y="381.7559">kubectl sends Authorization: Bearer &lt;id-token&gt;. The API server checks</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="345.9683" x="72.7485" y="394.4048">the signature and the expiry, then reads the username and groups</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="303.9341" x="72.7485" y="407.0537">FROM THE JWT'S CLAIMS instead of a certificate Subject.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="72.7485" y="421.5786">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="410.7705" x="72.7485" y="434.6514">Short-lived by design, which is the answer to &#8220;certificates cannot be revoked&#8221;.</text></g><!--entity s--><g class="entity" data-entity="s" data-source-line="11" data-uid="ent0007" id="entity_s"><rect fill="#DCFCE7" height="106.1934" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="467.5864" x="796.2485" y="94.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="285.3779" x="810.2485" y="120.8921">A real API object: kubectl get serviceaccounts</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="305.5723" x="810.2485" y="133.9648">for APPLICATIONS running inside the cluster, not humans</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="400.3345" x="810.2485" y="146.6138">TIED TO A NAMESPACE &#183; every Pod gets one (default) unless told otherwise</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="321.519" x="810.2485" y="159.2627">its token is projected into the Pod and used as a bearer token</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="310.6157" x="810.2485" y="171.9116">username is system:serviceaccount:&lt;namespace&gt;:&lt;name&gt;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="439.5864" x="810.2485" y="184.5605">groups include system:serviceaccounts and system:serviceaccounts:&lt;namespace&gt;</text></g><g class="link" data-entity-1="ext" data-entity-2="out" data-uid="lnk10" id="link_ext_out"><polygon fill="#475569" points="731.0855,315.5638,725.9657,307.1503,726.9756,312.7163,721.4096,313.7261,731.0855,315.5638" style="stroke:#475569;stroke-width:1;"/><path d="M506.3295,159.8401 C506.51,159.9651 506.6919,160.0911 506.875,160.218 C507.2414,160.4719 507.613,160.7293 507.9898,160.9904 C508.7435,161.5126 509.518,162.0492 510.3128,162.5999 C511.9023,163.7012 513.5727,164.8585 515.319,166.0685 C522.3042,170.9083 530.5042,176.5896 539.5996,182.8915 C557.7904,195.4951 579.5633,210.5806 602.3645,226.3786 C647.9671,257.9746 692.7515,289.0039 726.1536,312.1467" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="sa" data-entity-2="out" data-uid="lnk11" id="link_sa_out"><polygon fill="#475569" points="770.2485,315.5822,774.2485,306.5822,770.2485,310.5822,766.2485,306.5822,770.2485,315.5822" style="stroke:#475569;stroke-width:1;"/><path d="M770.2485,209.036 C770.2485,209.2547 770.2485,209.4738 770.2485,209.6932 C770.2485,210.1319 770.2485,210.5718 770.2485,211.0127 C770.2485,218.0681 770.2485,225.4055 770.2485,232.8456 C770.2485,262.6059 770.2485,288.0092 770.2485,309.5822" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="out" data-entity-2="rbac" data-uid="lnk12" id="link_out_rbac"><polygon fill="#475569" points="770.2485,486.4053,774.2485,477.4053,770.2485,481.4053,766.2485,477.4053,770.2485,486.4053" style="stroke:#475569;stroke-width:1;"/><path d="M770.2485,372.0351 C770.2485,401.9756 770.2485,444.5063 770.2485,480.4053" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="22"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1289.4971" x="5" y="592.8301">Two categories of user, and only one of them is a Kubernetes object: &#8220;Kubernetes does not have objects which represent normal user accounts. Normal users cannot be added to a cluster through an API call.&#8221;</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="880.0107" x="209.7432" y="608.9287">ServiceAccounts can &#8212; which is exactly why they exist. Humans come from a certificate or an identity provider; workloads come from the API.</text></g><!--SRC=[TLRBRXit5DtxAswpQOBgaQ38eeuWO2mhZffOCZHoq-U2cg4qZ4QaIdAiA4M1hFe1HPVjTtJVJ_6Nz5nIaaUHOjY0XpEylFUSSy_b5qfdPPLBQhNQyTSRKxfshiJSYgLhBp8jchwGIzbQLSlop2jVIfeKLafQYuqZRsXbpHsU2aCRKv6maku__aL2vsIq92SzcHdPgfIEnCnBknOsTsTdLcPUw3d2FHgEnjV96xfD- -CqR5uABUOofz7j91rSzkbrDPLMIo_T8-fqvjPKgswNX2FvtjDlPqIrOD-tdZ_zXh9IIUqfazQhcSg4bp_hZbCVvFcpPrqKH0k45FaovBdusb4kPw8gVICio3jfDrIAQQVDUxgrlRqXtV_n9rKE2OcbfF_-fL5O2LcvumtAkGgbJ3V4nm9k1moebpG0YvUQxfGWGRs7H5CrrqhFn_BNIZf_750Rb7jdyAaoEi1r9qgLKwMzAabvWB9ILkvIOSH4bW6D21b3SeZOQ73PepQbwGXqBcICMPWrOO-qAwiSKvVvIfJbXdA3CshfCEcsqgYXD7EbAJDBq9StE1CloaNG29UkSiHJVXC4WmTxNDhZllPMqE2oGQE55mrABb-c3Reo1ea-2TIihO8COgAEbFP1TZRmcHazK_Dzs5fWKVcYkJkNZ0L6CckWo387rEV7cH3IRKOqmeyW1rh0uxTl9m6VoQj1IieTL7OgZ9KpS55iOq4sEUDXfPPhX2on4PYk2xoBaROV7dBuIMAhPX2LRLQsfA-sMcz20eH8AYls23UspsArAbKKp2bq0dQ-HA_gt542h8nL7yBdvtGXqTAMEhlKkYtqlwJaPe3lBHg5ia9cYnEfSa6Ccl0LJ879uvLGsQR1_slW8FA8uRwX-BlFzTBByUWQoFUPXIzJwhr91jTWGQEbHCus8-eTJsarVOV2MgTgJb6ZRvRgBlPcBZdJ7LvRNeLsQzG7lku__bqBZ2OIMXjFKnbQSI7p-u__j3xJS4Rb6HgEzrFpfqBbKCilkLdhPZU- -_t03662tmrwVKfwlT7jS79eY1S_dF92z4SUptBYKpjC6ECoq6K26kUqetiEQsOALIQHhu5_k1f0CtH9SdFpPj1B9eFHCEKcPrzYkA6jkfirYC4eAcHvWhJ9e7z9an4bD4ok- -bDWkBWcj5ZRqpEURWmAnvlJVW9l0pZWhky1Aqu