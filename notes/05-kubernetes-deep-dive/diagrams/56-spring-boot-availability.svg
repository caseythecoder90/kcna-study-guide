<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="542px" preserveAspectRatio="none" style="width:906px;height:542px;background:#FFFFFF;" version="1.1" viewBox="0 0 906 542" width="906px" zoomAndPan="magnify"><title>Spring Boot availability states through a Pod's life &#8212; and what each probe endpoint returns</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="784.3799" x="53.3101" y="30.8838">Spring Boot availability states through a Pod's life &#8212; and what each probe endpoint returns</text></g><!--cluster s1--><g class="cluster" data-entity="s1" data-source-line="4" data-uid="ent0002" id="cluster_s1"><rect fill="#FEF2F2" height="112" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="760" x="14" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="665.6279" x="61.186" y="71.8921">1 &#183; STARTING &#8212; JVM up, application context refreshing (bean creation, @PostConstruct, connection pools)</text></g><!--cluster s2--><g class="cluster" data-entity="s2" data-source-line="8" data-uid="ent0004" id="cluster_s2"><rect fill="#F8FAFC" height="112" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="806" x="14" y="173.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="680.4497" x="76.7751" y="191.8921">2 &#183; STARTED &#8212; context refreshed, web server up; ApplicationRunner / CommandLineRunner beans executing</text></g><!--cluster s3--><g class="cluster" data-entity="s3" data-source-line="12" data-uid="ent0006" id="cluster_s3"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="868" x="14" y="293.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="204.4263" x="345.7869" y="311.8921">3 &#183; READY &#8212; all runners finished</text></g><!--cluster s4--><g class="cluster" data-entity="s4" data-source-line="16" data-uid="ent0008" id="cluster_s4"><rect fill="#F8FAFC" height="126" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="886" x="14" y="410.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="569.1309" x="172.4346" y="428.8921">4 &#183; SHUTTING DOWN &#8212; Pod deleted: endpoint removal and SIGTERM happen IN PARALLEL</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="5" data-uid="ent0003" id="entity_a1"><rect fill="#FEE2E2" height="70.5464" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="709.1924" x="56.5" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="294.0425" x="70.5" y="112.8921">HTTP server not started yet &#8594; every probe gets</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.9072" x="368.1543" y="112.8921">connection refused</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.8281" x="491.6733" y="112.8921">= failure.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.9009" x="70.5" y="127.8408">startupProbe</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="270.188" x="155.0127" y="127.8408">on /actuator/health/liveness keeps failing &#8212;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="60.6772" x="428.8125" y="127.8408">by design</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="262.2026" x="489.4897" y="127.8408">, within failureThreshold x periodSeconds.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="444.3828" x="70.5" y="140.9136">Liveness and readiness probes are NOT running yet &#8212; the startup probe gates them.</text></g><!--entity a2--><g class="entity" data-entity="a2" data-source-line="9" data-uid="ent0005" id="entity_a2"><rect fill="#FFFFFF" height="70.5464" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="756.3174" x="56" y="206.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.6626" x="70" y="232.8921">LivenessState</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.2764" x="155.2744" y="232.8921">CORRECT</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.418" x="226.7744" y="232.8921">&#8594;  /actuator/health/liveness</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="21.6899" x="398.0278" y="232.8921">200</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.9878" x="423.3296" y="232.8921">{status: UP}      &#8594; startupProbe SUCCEEDS, liveness takes over</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.7808" x="70" y="247.8408">ReadinessState</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="130" x="165.3926" y="247.8408">REFUSING_TRAFFIC</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.8188" x="302.6162" y="247.8408">&#8594;  /actuator/health/readiness</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="21.6899" x="479.6587" y="247.8408">503</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.3442" x="504.9604" y="247.8408">{status: OUT_OF_SERVICE}  &#8594; Pod 0/1, no traffic</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="530.1323" x="70" y="260.9136">This is where cache warm-up and other startup tasks belong: the app is alive but not yet in the load balancer.</text></g><!--entity a3--><g class="entity" data-entity="a3" data-source-line="13" data-uid="ent0007" id="entity_a3"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="817.7065" x="56" y="326.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="363.4287" x="70" y="352.8921">LivenessState CORRECT &#8594; liveness 200.   ReadinessState</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="139.3882" x="437.0405" y="352.8921">ACCEPTING_TRAFFIC</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="77.3145" x="580.0405" y="352.8921">&#8594; readiness</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="21.6899" x="660.9668" y="352.8921">200</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8608" x="686.2686" y="352.8921">&#8594; Pod 1/1, endpoint ready.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="789.7065" x="70" y="365.9648">At run time the app can flip either state itself: AvailabilityChangeEvent.publish(ctx, ReadinessState.REFUSING_TRAFFIC) &#8212; or LivenessState.BROKEN</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="498.7974" x="70" y="378.6138">for an unrecoverable internal fault (liveness &#8594; 503 DOWN &#8594; the kubelet restarts the container).</text></g><!--entity a4--><g class="entity" data-entity="a4" data-source-line="17" data-uid="ent0009" id="entity_a4"><rect fill="#326CE5" height="85.4951" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="834.8442" x="56.5" y="443.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="49.1118" x="70.5" y="469.8921">preStop</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="33.2427" x="123.2236" y="469.8921">sleep</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="621.2769" x="160.0781" y="469.8921">(e.g. 10s) runs FIRST &#8212; gives the EndpointSlice change time to reach every kube-proxy and Ingress.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="525.8398" x="70.5" y="484.8408">Then SIGTERM &#8594; graceful shutdown (default since Spring Boot 3.4): ReadinessState</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="130" x="599.9517" y="484.8408">REFUSING_TRAFFIC</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.3926" x="729.9517" y="484.8408">, new requests rejected,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="473.8018" x="70.5" y="499.7896">in-flight requests finish within spring.lifecycle.timeout-per-shutdown-phase (</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="21.6899" x="544.3018" y="499.7896">30s</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.9409" x="565.9917" y="499.7896">).</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="679.959" x="70.5" y="512.8623">Budget: preStop sleep + shutdown phase must fit inside terminationGracePeriodSeconds (30s default) &#8212; or SIGKILL cuts it short.</text></g><g class="link" data-entity-1="s1" data-entity-2="s2" data-uid="lnk10" id="link_s1_s2"><polygon fill="#475569" points="30,173.6711,34,164.6711,30,168.6711,26,164.6711,30,173.6711" style="stroke:#475569;stroke-width:1;"/><path d="M30,165.8644 C30,166.0021 30,166.1399 30,166.2779 C30,166.5538 30,166.8302 30,167.1071 C30,167.6609 30,168.2166 30,168.774 C30,169.8887 30,171.0102 30,172.1368 C30,172.4184 30,172.7003 30,172.9826 C30,173.1237 30,173.2649 30,173.4062 C30,173.4768 30,173.5474 30,173.6181 C30,173.6358 30,167.6534 30,167.6711" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s2" data-entity-2="s3" data-uid="lnk11" id="link_s2_s3"><polygon fill="#475569" points="30,293.6852,34,284.6852,30,288.6852,26,284.6852,30,293.6852" style="stroke:#475569;stroke-width:1;"/><path d="M30,285.9493 C30,286.0849 30,286.2207 30,286.3565 C30,286.9001 30,287.4455 30,287.9925 C30,289.0867 30,290.1875 30,291.2934 C30,291.8464 30,292.4006 30,292.9558 C30,293.0946 30,293.2335 30,293.3725 C30,293.4419 30,293.5114 30,293.5809 C30,293.6157 30,287.6504 30,287.6852" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="s3" data-entity-2="s4" data-uid="lnk12" id="link_s3_s4"><polygon fill="#475569" points="30,410.6601,34,401.6601,30,405.6601,26,401.6601,30,410.6601" style="stroke:#475569;stroke-width:1;"/><path d="M30,402.7546 C30,402.8983 30,403.0423 30,403.1863 C30,403.4745 30,403.7633 30,404.0528 C30,404.6317 30,405.2132 30,405.7969 C30,406.9644 30,408.1411 30,409.3251 C30,409.6211 30,409.9176 30,410.2145 C30,410.3629 30,404.5114 30,404.6601" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><!--SRC=[ZLRDRY974Bxp59Mz12im6EDSY8E2yTXBbhNHCDueagLLCrCm7G_Ta-uUssHbAQSyG9HtoJsFia-IgeOPZucq2kB0_7JLLz_tLHLVIPNaPOeG1BtTrscTsrugnTg8ZUtT9qfqNOOR38foaxUST3d2eZ1IhU5SQmVYGSXSB6KktHQi4mujkCpeSfs1WBbElxQGonN2vz__0g5IUCo40nH91eNHImHKQQ6bSc3GbKRPLijWueHQKw8tVVZdRrZ4uoYUNb_v43z-U0zbqG5H5BbCX9DQGQALmoUEi39eCyRMNgAW1mRz6ntuOQwjcsXbdIaJr-4ZYjBmwO9BFde3PsThWbsSYtGq0c71zk5J2w21vcqSpy6YUK03YcgdSet35BReuFCVVmBIW-s-h3Kw2sVBKICHmIijfcUzvGY-XnNnLXeCxXIzvIELnPoF-kVqUayahXHEcrw68dTPBvSFgD1Qk4Sih0_0fJ8h56AvXHIjN2i-tu57wOY8AakSCJ4wJ-492ZHIfmiaPAdbz5R-XiD-VpIhuhDCn5mg_PMlXsuQXEkR64of5AVrHLDgSWViuLUbxqs0c-2iny57JEwoubNqMy-lH3wfHGulVCW3FJ6bSd1PCLyMty7uHVs8yD3T7apqPaF8PuHwVuyzO06VC2aTGQubtkjxSgXlHS22RSoSJcwYA9p4NX6ly1T40JvmSdpiN_x4dL3Q8TpEdy5_-7HJPLZSJYPXUB7eG1t2YNiYJbEHTogg-A_1HE7bxOBQu6CSZIylfvCleNfHZqz-UpnuZUhcDlvuS_bn4KOVffFmUHU5UXMEU_qEMHkS4QkLJ1hcY3DfWRwF6P8H4kfVX4TXDbsIdVsYIMzJ6y49Us-9_rohzT1RXFgLZmik5fQbymt47YAJylDSYnIM8XSgGTFqJP4BgVREEJbmpe2T4uNZYvztuoNFlJtHK7T89TawjUXNMbUDFVYoy7lLFIcrDgHiG3B-LvOnoJYF3tNXioyYD9nHCTrdf