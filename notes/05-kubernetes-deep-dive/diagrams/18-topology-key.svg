<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1001px" preserveAspectRatio="none" style="width:1029px;height:1001px;background:#FFFFFF;" version="1.1" viewBox="0 0 1029 1001" width="1029px" zoomAndPan="magnify"><title>topologyKey &#8212; the word "same" has to mean something, and this is where you say what</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="760.2188" x="130.7397" y="30.8838">topologyKey &#8212; the word "same" has to mean something, and this is where you say what</text></g><!--cluster s--><g class="cluster" data-entity="s" data-source-line="4" data-uid="ent0002" id="cluster_s"><rect fill="#F8FAFC" height="192" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="570" x="192.3491" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="322.9497" x="315.8743" y="71.8921">The sentence every pod affinity rule is really making</text></g><!--cluster k--><g class="cluster" data-entity="k" data-source-line="8" data-uid="ent0004" id="cluster_k"><rect fill="#F8FAFC" height="243" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="528" x="192.3491" y="253.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.8208" x="342.9387" y="271.8921">It is a NODE LABEL KEY, not a value</text></g><!--cluster n--><g class="cluster" data-entity="n" data-source-line="12" data-uid="ent0006" id="cluster_n"><rect fill="#F8FAFC" height="217" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="660" x="192.3491" y="504.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="202.249" x="421.2246" y="522.8921">The nesting, widest to narrowest</text></g><!--cluster t--><g class="cluster" data-entity="t" data-source-line="16" data-uid="ent0008" id="cluster_t"><rect fill="#FEF2F2" height="220" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="612" x="192.3491" y="729.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="51.2827" x="472.7078" y="747.8921">The trap</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="5" data-uid="ent0003" id="entity_s1"><rect fill="#326CE5" height="151.0396" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="519.8418" x="234.3491" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="491.8418" x="248.3491" y="112.8921">This Pod should (or should not) run in an  X  if that  X  is already running one or</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.1563" x="248.3491" y="127.8408">more Pods that meet rule  Y .</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.3491" y="142.7896">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="301.3291" x="254.4614" y="155.8623">Y  is the labelSelector &#8212; WHICH Pods am I talking about?</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="387.5029" x="254.4614" y="168.5112">X  is the topologyKey &#8212; what counts as the SAME PLACE as those Pods?</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.3491" y="183.0361">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="459.3735" x="248.3491" y="196.1089">Without X the rule is meaningless: 'schedule me with the backend' &#8212; in the same what?</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="478.6611" x="248.3491" y="208.7578">The same machine? The same rack? The same region? They are very different instructions.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="59.8984" x="248.3491" y="221.4067">That is why</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="260.4067" x="311.3037" y="221.4067">topologyKey is required and may never be empty.</text></g><!--entity k1--><g class="entity" data-entity="k1" data-source-line="9" data-uid="ent0005" id="entity_k1"><rect fill="#FFFFFF" height="201.6353" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="477.394" x="234.8491" y="286.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="442.0508" x="248.8491" y="312.8921">topologyKey names the node label whose VALUE defines the grouping.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="248.8491" y="327.8408">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="449.394" x="248.8491" y="340.9136">Two nodes are in the same topology domain when they carry the SAME VALUE for that key.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="248.8491" y="355.4385">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="184.062" x="254.9614" y="368.5112">topologyKey: kubernetes.io/hostname</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="330.8433" x="264.1299" y="381.1602">node-1 has kubernetes.io/hostname=node-1  &#183;  node-2 has =node-2</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="306.9365" x="264.1299" y="393.8091">Every node is its own domain, because every value is different.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="237.0693" x="264.1299" y="406.458">'Same domain' therefore means 'same machine'.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="248.8491" y="420.9829">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="204.252" x="254.9614" y="434.0557">topologyKey: topology.kubernetes.io/zone</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="291.9888" x="264.1299" y="446.7046">node-1 and node-2 both have =us-east-1a  &#8594;  ONE domain</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="312.7964" x="264.1299" y="459.3535">node-3 and node-4 both have =us-east-1b  &#8594;  a second domain</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="358.1177" x="264.1299" y="472.0024">'Same domain' now means 'same availability zone', across two machines.</text></g><!--entity n1--><g class="entity" data-entity="n1" data-source-line="13" data-uid="ent0007" id="entity_n1"><rect fill="#DCFCE7" height="176.3374" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="609.4644" x="234.8491" y="537.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="581.4644" x="248.8491" y="563.8921">topology.kubernetes.io/region   &#8594;   topology.kubernetes.io/zone   &#8594;   kubernetes.io/hostname</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="379.6128" x="248.8491" y="576.9648">geographic region                    availability zone                    a single server</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.8491" y="591.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="338.6475" x="248.8491" y="604.5625">The narrower the scope, the more precise the placement control.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.8491" y="619.0874">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="471.8828" x="248.8491" y="632.1602">podAffinity + hostname  = same physical host. Fastest communication, worst blast radius.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="481.0513" x="248.8491" y="644.8091">podAffinity + zone      = same AZ. Low latency and no cross-zone egress, still two machines.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="267.0884" x="248.8491" y="657.458">podAntiAffinity + hostname = one replica per node.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="432.7383" x="248.8491" y="670.1069">podAntiAffinity + zone     = one replica per zone, which survives losing a whole AZ.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.8491" y="684.6318">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="522.6182" x="248.8491" y="697.7046">Same rule, same labelSelector &#8212; only the topologyKey changed, and the guarantee changed with it.</text></g><!--entity t1--><g class="entity" data-entity="t1" data-source-line="17" data-uid="ent0009" id="entity_t1"><rect fill="#FEE2E2" height="178.6372" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="561.7808" x="234.3491" y="762.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="406.6372" x="248.3491" y="788.8921">Pod anti-affinity requires nodes to be CONSISTENTLY LABELLED</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="123.5317" x="658.5981" y="788.8921">&#8212; every node in the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="327.2534" x="248.3491" y="803.8408">cluster must carry a label matching the topologyKey.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.3491" y="818.7896">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="477.356" x="248.3491" y="831.8623">If some or all nodes are missing that label, it can lead to unintended behaviour: a node with</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="398.5083" x="248.3491" y="844.5112">no value for the key is not in any domain, so the rule cannot reason about it.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.3491" y="859.0361">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="435.8589" x="248.3491" y="872.1089">kubernetes.io/hostname is safe &#8212; the kubelet sets it on every node (chapter 05-05).</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="483.5005" x="248.3491" y="884.7578">topology.kubernetes.io/zone is set by cloud providers, and is usually absent on a bare-metal</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="406.4844" x="248.3491" y="897.4067">or k3s lab cluster, so a zone-scoped rule there may silently do nothing useful.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="248.3491" y="911.9316">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="403.9922" x="248.3491" y="925.0044">Check before relying on it:  kubectl get nodes -L topology.kubernetes.io/zone</text></g><g class="link" data-entity-1="s" data-entity-2="k" data-uid="lnk10" id="link_s_k"><polygon fill="#475569" points="208.3491,253.6907,212.3491,244.6907,208.3491,248.6907,204.3491,244.6907,208.3491,253.6907" style="stroke:#475569;stroke-width:1;"/><path d="M208.3491,246.4774 C208.3491,247.096 208.3491,247.7159 208.3491,248.3369 C208.3491,249.5789 208.3491,250.8256 208.3491,252.0763 C208.3491,252.389 208.3491,252.7019 208.3491,253.0151 C208.3491,253.1716 208.3491,253.3283 208.3491,253.485 C208.3491,253.5241 208.3491,253.5633 208.3491,253.6025 C208.3491,253.6221 208.3491,253.6417 208.3491,253.6613 C208.3491,253.6711 208.3491,247.6809 208.3491,247.6907" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="k" data-entity-2="n" data-uid="lnk11" id="link_k_n"><polygon fill="#475569" points="208.3491,504.6824,212.3491,495.6824,208.3491,499.6824,204.3491,495.6824,208.3491,504.6824" style="stroke:#475569;stroke-width:1;"/><path d="M208.3491,497.5428 C208.3491,497.8822 208.3491,498.2218 208.3491,498.5614 C208.3491,499.92 208.3491,501.2801 208.3491,502.6408 C208.3491,503.3212 208.3491,498.0018 208.3491,498.6824" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="n" data-entity-2="t" data-uid="lnk12" id="link_n_t"><polygon fill="#475569" points="208.3491,729.6427,212.3491,720.6427,208.3491,724.6427,204.3491,720.6427,208.3491,729.6427" style="stroke:#475569;stroke-width:1;"/><path d="M208.3491,722.6027 C208.3491,722.9198 208.3491,723.237 208.3491,723.5545 C208.3491,724.8241 208.3491,726.0965 208.3491,727.3708 C208.3491,728.008 208.3491,728.6457 208.3491,729.2838 C208.3491,729.3635 208.3491,729.4433 208.3491,729.5231 C208.3491,729.563 208.3491,723.6029 208.3491,723.6427" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1011.6982" x="5" y="969.8301">topologyKey is the one field in this topic that has no equivalent anywhere else in Kubernetes scheduling, which is exactly why it is the part people do not remember.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="560.1162" x="230.791" y="985.9287">Read it as the answer to a question the rule cannot answer on its own: "the same WHAT?"</text></g><!--SRC=[ZLV1RXit4BtxAwQ-E44bEKwQYs4hS1mLCQ8uGUqsIP4BjKj9XBZaXkJQtHG5Uke75FsNtlif-PA-8LVhbRGnOlYm8cTdo3Tlvir-fqocgrpIQ7IO_eErsX_cIYoSAFpXAZDY69QoaAEoAlHUK45B2hQqsYxgLxAcBt_-Gp2WM-joslUYaFkq51usL4XXoDj2XgKoYm49ayDKUSB_xL8wIRMjo8iQlqJOstCo2y8i463_6XwzD46QJ9AyaQwcqkOavdDbLAZ9LR226oU5rZKLOeK8-tHoid2sAiTZmWay_Rv7r75wCXjVS_YtyEINjj8vFR1k_MXiU0Y_XfJ1IOdU4wavpYj2UlOaDCBb7DmOX2Dh95btSZWRVpJmNLZS2BvzUgcGCgHpqWSQ9IlOUVLP7XyTZNcLdJ9sMioalf8QHyLv6D5tBo_ENoPdeg0B2aBp3KdCR1MUdHoob_66j_Ujj-tiCBYKsSe4px2moTNPwmczdPwTJzAAzUdaTvuxljyf65G14VZLDVASNCMuUdzC1pvRofnt2Z01zj5q9hALDFb1F0LGvJKcI3nHpoMkr_k5oC0O-OpQ5GTNtPzoeQo92pK9m1uPaglv7Amo0S5yS5KMOEH7VO60I2HXJKXS5x38gK-LSZAFV2t0JiC4f1c8M9IXZgbiV3BZH9OXP4Evexq_DdXy4UC8kdppOaBJi-UJARsQV1WmsR1w8tGbjrYxwc5jzu06zqz9D3Plg8EBS0P_EPl-FA5SeaOQa-WNMTgbt_MjZGvyXA-Rd7KmocqXi85AZRirPS81vPO_ATmSZ8ryNybwr4SVwXBoc5RLJ3eZW_GZPGznxi0twcCq_lY4mwFOJ_hVEsqiwBz_6-l7qJgjF_wAsqcaIyIFkn7gmjwQvhu393eJbL-tdPWZDclPDVgAruChXYzvEM2Od9npI-1AyIYH3hCFlWMfzO_HvjK_e-tS3nVpji5YPb6BIt4ZwRJoGoby61u9eYz__KtqvdBIdFO-Tq_ktFtGwsxMk1Des9c5xRq-Dq4ozdO37d4Z51YjDFTulkW1L2DpreFE86o3NblIN3gbXgUcTBQhZ_i5p4DKdri5jWVM9GCUsrlys2ezirrwNyb0wZxKtFk-FBKs_UpjWBEG5efRBbL6hVkTlnruUet8nxwCT3Wmk8zeKGZb6WUNQZ-pfHp4noXa9N1Gg09U0COPHW33CcA2ixhR0pSyGwJFrXhzFQtlINIQUakvhBtAX8ux8_eH1EASPBOeAeCDRjW37YMmEDFOHUFFLTNNmpSZtO7HH3hxTKHJi4iBdY7gXiGKkJICrdBXe5q30ZsqxgNNLZGJLD_TJkCSu6IfSG4g0ISNopVvQ4-zwuEtW0Jui2HVkHjrWrQjhOz30FTx7U_ObuDOOIpJWmJ5xdHXZQvtHeLi2TRBV3scGJmguGH6CBdUIigkGhVy5jRcJVNqLLy0fzigUouQqz2ZSJoK8PeQtiruIOTzerCeN4Zm-PlBgukhwydbzVH34jJfv0MpCLvCTXfx5AsFFD-2P8wAYeaM5Kmqgbc8m0bVR4Cnse3pOXvdM4nw601rHpGBvNrw6-eNFGu03c8OqfWJ-S0WDS-mER2RIVHDPIjtZFZnX8pcBaj0qYGvILWbwohB3qyCSJAjMw7ozcuYGrIsm83gqJlYcDZ9rCQ5-diHn_1YBjk1diqqHbWl0siaIDE5zm4uKJAkZvuE