<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="242px" preserveAspectRatio="none" style="width:1397px;height:242px;background:#FFFFFF;" version="1.1" viewBox="0 0 1397 242" width="1397px" zoomAndPan="magnify"><title>The lecture's flow &#8212; author, package, install, and the release's revisions</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="618.7676" x="381.6162" y="30.8838">The lecture's flow &#8212; author, package, install, and the release's revisions</text></g><!--cluster a--><g class="cluster" data-entity="a" data-source-line="5" data-uid="ent0002" id="cluster_a"><rect fill="#F8FAFC" height="141" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="206" x="14" y="59.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.6055" x="89.1973" y="77.8921">AUTHOR</text></g><!--cluster p--><g class="cluster" data-entity="p" data-source-line="9" data-uid="ent0004" id="cluster_p"><rect fill="#F8FAFC" height="137" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="227" x="240" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="65.0063" x="320.9968" y="79.8921">PACKAGE</text></g><!--cluster r--><g class="cluster" data-entity="r" data-source-line="13" data-uid="ent0006" id="cluster_r"><rect fill="#F0FDF4" height="129" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="646" x="487" y="65.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="267.2744" x="676.3628" y="83.8921">RELEASE  flappy-app  (namespace default)</text></g><!--cluster u--><g class="cluster" data-entity="u" data-source-line="19" data-uid="ent0010" id="cluster_u"><rect fill="#FEF2F2" height="153" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="238" x="1153" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.6582" x="1235.1709" y="71.8921">UNINSTALL</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="6" data-uid="ent0003" id="entity_a1"><rect fill="#FFFFFF" height="100.4438" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="189.8398" x="22" y="92.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.5972" x="36" y="118.8921">helm create flappy-app</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.8398" x="36" y="133.8408">edit Chart.yaml (description,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.228" x="36" y="148.7896">version, appVersion)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.8862" x="36" y="163.7383">edit values.yaml (image)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="137.5537" x="36" y="176.811">helm lint .     helm template .</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="10" data-uid="ent0005" id="entity_p1"><rect fill="#FFFFFF" height="95.8442" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="211.0737" x="248" y="94.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.209" x="262" y="120.8921">helm package .</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.6499" x="262" y="135.8408">&#8594; flappy-app-</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28.9136" x="343.6499" y="135.8408">0.1.0</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="20.9536" x="372.5635" y="135.8408">.tgz</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.7476" x="262" y="148.9136">name + Chart.yaml version</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.9683" x="262" y="161.5625">Optional: helm push to an OCI</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="183.0737" x="262" y="174.2114">registry, or add to a repo's index.yaml</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="14" data-uid="ent0007" id="entity_r1"><rect fill="#DCFCE7" height="87.7949" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="168.8545" x="495" y="98.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="60.6963" x="509" y="124.8921">revision 1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140.8545" x="509" y="139.8408">helm install flappy-app</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.3481" x="516.2236" y="154.7896">flappy-app-0.1.0.tgz</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="112.6772" x="509" y="169.7383">STATUS deployed</text></g><!--entity r2--><g class="entity" data-entity="r2" data-source-line="15" data-uid="ent0008" id="entity_r2"><rect fill="#DCFCE7" height="87.7949" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="197.019" x="700" y="98.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="60.6963" x="714" y="124.8921">revision 2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="169.019" x="714" y="139.8408">helm upgrade flappy-app ...</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="113.7944" x="721.2236" y="154.7896">--set image.tag=v2</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="123.5571" x="714" y="169.7383">rev 1 &#8594; superseded</text></g><!--entity r3--><g class="entity" data-entity="r3" data-source-line="16" data-uid="ent0009" id="entity_r3"><rect fill="#DCFCE7" height="83.1953" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="191.9854" x="933" y="101.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="60.6963" x="947" y="127.3921">revision 3</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="163.9854" x="947" y="142.3408">helm rollback flappy-app 1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="142.6079" x="947" y="155.4136">a NEW revision with rev 1's</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="111.2676" x="947" y="168.0625">manifests and values</text></g><!--entity u1--><g class="entity" data-entity="u1" data-source-line="20" data-uid="ent0011" id="entity_u1"><rect fill="#FEE2E2" height="110.793" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="221.8765" x="1161" y="87.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.7363" x="1175" y="113.3921">helm uninstall flappy-app</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="124.0938" x="1175" y="126.4648">aliases: un &#183; del &#183; delete</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="193.8765" x="1175" y="140.9897">Deletes the release's resources</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="148.1035" x="1175" y="155.9385">AND its history Secrets.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="166.2676" x="1175" y="169.0112">--keep-history keeps the history</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="104.5054" x="1175" y="181.6602">(status: uninstalled)</text></g><g class="link" data-entity-1="a1" data-entity-2="p1" data-uid="lnk12" id="link_a1_p1"><polygon fill="#475569" points="247.6706,142.6982,238.6706,138.6982,242.6706,142.6982,238.6706,146.6982,247.6706,142.6982" style="stroke:#475569;stroke-width:1;"/><path d="M212.0289,142.6982 C223.7517,142.6982 229.7971,142.6982 241.6706,142.6982" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="p1" data-entity-2="r1" data-uid="lnk13" id="link_p1_r1"><polygon fill="#475569" points="494.9352,