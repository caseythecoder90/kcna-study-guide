<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="288px" preserveAspectRatio="none" style="width:1169px;height:288px;background:#FFFFFF;" version="1.1" viewBox="0 0 1169 288" width="1169px" zoomAndPan="magnify"><title>One request through an Envoy-based mesh (Istio sidecar mode)</title><defs/><g><g class="title" data-source-line="3"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="548.1123" x="307.4438" y="30.8838">One request through an Envoy-based mesh (Istio sidecar mode)</text></g><!--cluster pa--><g class="cluster" data-qualified-name="pa" data-source-line="7" id="ent0003"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="491.5" x="58.5" y="143.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89.5654" x="259.4673" y="161.3921">Pod: checkout</text></g><!--cluster pb--><g class="cluster" data-qualified-name="pb" data-source-line="12" id="ent0006"><rect fill="#F0FDF4" height="109" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="407.5" x="711" y="64.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.1836" x="868.1582" y="82.3921">Pod: payments</text></g><!--entity istiod--><g class="entity" data-qualified-name="istiod" data-source-line="5" id="ent0002"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="249.2998" x="6" y="53.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="128.5527" x="20" y="79.8921">istiod (control plane)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="221.2998" x="20" y="92.9648">translates VirtualService, DestinationRule,</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="196.1792" x="20" y="105.6138">PeerAuthentication into Envoy config</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="156.2129" x="20" y="118.2627">+ issues workload certificates</text></g><!--entity tel--><g class="entity" data-qualified-name="tel" data-source-line="17" id="ent0009"><rect fill="#F1F5F9" height="57.8975" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="156.6162" x="1007" y="181.1982"/><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.6162" x="1021" y="207.3921">Prometheus &#183; Grafana</text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.749" x="1021" y="222.3408">Jaeger</text></g><!--entity a--><g class="entity" data-qualified-name="pa.a" data-source-line="8" id="ent0004"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="128.2676" x="66.5" y="187.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6899" x="80.5" y="213.3921">app</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="100.2676" x="80.5" y="226.4648">calls http://payments</text></g><!--entity ea--><g class="entity" data-qualified-name="pa.ea" data-source-line="9" id="ent0005"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="171.6553" x="370" y="176.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.1563" x="384" y="202.3921">Envoy sidecar</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="136.8984" x="384" y="215.4648">routing &#183; retries &#183; timeouts</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="143.6553" x="384" y="228.1138">rate limits &#183; circuit breaking</text></g><!--entity eb--><g class="entity" data-qualified-name="pb.eb" data-source-line="13" id="ent0007"><rect fill="#DCFCE7" height="68.2466" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="180.1899" x="719" y="97.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="88.1563" x="733" y="123.3921">Envoy sidecar</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="144.896" x="733" y="136.4648">verifies the client certificate</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.1899" x="733" y="149.1138">enforces AuthorizationPolicy</text></g><!--entity b--><g class="entity" data-qualified-name="pb.b" data-source-line="14" id="ent0008"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="49.6899" x="1060.5" y="114.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.6899" x="1074.5" y="140.8921">app</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="369.9778,211.5123,360.917,207.6519,364.9784,211.5896,361.0406,215.651,369.9778,211.5123" style="stroke:#475569;stroke-width:1;"/><path d="M194.6