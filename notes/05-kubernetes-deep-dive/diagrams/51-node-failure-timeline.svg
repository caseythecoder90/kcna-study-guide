<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="736px" preserveAspectRatio="none" style="width:950px;height:736px;background:#FFFFFF;" version="1.1" viewBox="0 0 950 736" width="950px" zoomAndPan="magnify"><title>When a node stops reporting &#8212; the default timeline, and who acts at each step</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="674.0947" x="130.4526" y="30.8838">When a node stops reporting &#8212; the default timeline, and who acts at each step</text></g><!--cluster a--><g class="cluster" data-entity="a" data-source-line="4" data-uid="ent0002" id="cluster_a"><rect fill="#FEF2F2" height="112" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="756" x="14" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="439.5688" x="172.2156" y="71.8921">t = 0 &#183; the kubelet stops (the lab: systemctl stop k3s-agent on worker-2)</text></g><!--cluster b--><g class="cluster" data-entity="b" data-source-line="8" data-uid="ent0004" id="cluster_b"><rect fill="#F8FAFC" height="154" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="798" x="14" y="173.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="546.0508" x="139.9746" y="191.8921">t &#8776; 50s &#183; node-monitor-grace-period expires (kube-controller-manager &#183; 40s before v1.32)</text></g><!--cluster c--><g class="cluster" data-entity="c" data-source-line="12" data-uid="ent0006" id="cluster_c"><rect fill="#F8FAFC" height="124" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="930" x="14" y="335.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="233.6064" x="362.1968" y="353.8921">t &#8776; 50s + 300s &#183; the toleration runs out</text></g><!--cluster d--><g class="cluster" data-entity="d" data-source-line="16" data-uid="ent0008" id="cluster_d"><rect fill="#F0FDF4" height="126" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="848" x="14" y="467.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="309.2007" x="283.3997" y="485.8921">immediately after &#183; the controller replaces the Pod</text></g><!--cluster e--><g class="cluster" data-entity="e" data-source-line="20" data-uid="ent0010" id="cluster_e"><rect fill="#F8FAFC" height="99" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="758" x="14" y="601.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="315.0088" x="235.4956" y="619.8921">the kubelet comes back (systemctl start k3s-agent)</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="5" data-uid="ent0003" id="entity_a1"><rect fill="#FEE2E2" height="70.5464" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="704.8887" x="56.5" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="189.979" x="70.5" y="112.8921">The kubelet stops renewing its</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="36.8608" x="264.0908" y="112.8921">Lease</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.5527" x="304.5635" y="112.8921">in</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="102.5845" x="319.728" y="112.8921">kube-node-lease</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.1035" x="425.9243" y="112.8921">(normally every</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="21.6899" x="525.6396" y="112.8921">10s</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.0591" x="547.3296" y="112.8921">) and stops posting node status.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.4663" x="70.5" y="127.8408">The containers</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="81.6182" x="166.5781" y="127.8408">keep running</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="468.8379" x="251.8081" y="127.8408">&#8212; containerd and its shims do not need the kubelet to keep a process alive.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="350.249" x="70.5" y="140.9136">Nothing in the API changes yet. kubectl get nodes still says Ready.</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="9" data-uid="ent0005" id="entity_b1"><rect fill="#FFFFFF" height="113.0928" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="747.9385" x="56" y="206.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.4009" x="70" y="232.8921">The</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="149.5444" x="96.0127" y="232.8921">node lifecycle controller</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.1899" x="249.1689" y="232.8921">(checks every</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.46" x="332.9707" y="232.8921">5s</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.8188" x="347.4307" y="232.8921">) sets every node condition to</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58.4937" x="520.8613" y="232.8921">Unknown</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="579.355" y="232.8921">:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="650.2192" x="70" y="245.9648">Ready = Unknown &#183; reason NodeStatusUnknown &#183; 'Kubelet stopped posting node status.'   kubectl get nodes prints this as NotReady.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.1626" x="70" y="260.4897">It adds two taints:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="278.8398" x="178.3862" y="260.4897">node.kubernetes.io/unreachable:NoSchedule</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.5952" x="464.4497" y="260.4897">&#8212; no new Pods land here</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.8481" x="70" y="275.4385">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="270.9053" x="145.8481" y="275.4385">node.kubernetes.io/unreachable:NoExecute</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.9033" x="427.5889" y="275.4385">&#8212; the eviction clock starts for Pods already here</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.48" x="70" y="290.3872">It flips each Pod's</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="153.8545" x="175.0918" y="290.3872">Ready condition to False</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="457.3804" x="332.5581" y="290.3872">&#8594; the Pod drops out of Service endpoints. Traffic stops NOW, not at 5 minutes.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="672.5361" x="70" y="303.46">The READY column still says 1/1 and STATUS still says Running &#8212; those come from container status, which only the kubelet can update.</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="13" data-uid="ent0007" id="entity_c1"><rect fill="#326CE5" height="83.1953" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="878.9731" x="56.5" y="368.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="129.3335" x="70.5" y="394.8921">Every Pod was given</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="324.3589" x="203.4453" y="394.8921">unreachable:NoExecute with tolerationSeconds: 300</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="111.249" x="531.416" y="394.8921">at creation, by the</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="161.0781" x="646.2769" y="394.8921">DefaultTolerationSeconds</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="110.5063" x="810.9668" y="394.8921">admission plugin.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="122.8018" x="70.5" y="409.8408">When it expires, the</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.1772" x="196.9136" y="409.8408">taint-eviction-controller</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="480.9746" x="345.7026" y="409.8408">DELETES the Pod.  This is the docs' 'waits 5 minutes before the first eviction'.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="707.1636" x="70.5" y="422.9136">It is a plain DELETE, not the Eviction API &#8212; PodDisruptionBudgets are not consulted (chapter 05-13).  Rate limit: 0.1 nodes per second.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="503.6689" x="70.5" y="435.5625">DaemonSet Pods tolerate the taint with NO tolerationSeconds, so they are never evicted for this.</text></g><!--entity d1--><g class="entity" data-entity="d1" data-source-line="17" data-uid="ent0009" id="entity_d1"><rect fill="#DCFCE7" height="85.4951" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="796.6313" x="56.5" y="500.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="166.8608" x="70.5" y="526.8921">The deleted Pod now has a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.4663" x="240.9727" y="526.8921">deletionTimestamp</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="479.6924" x="359.439" y="526.8921">. A ReplicaSet does not count such Pods, so it creates a replacement at once.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="384.9917" x="70.5" y="541.8408">The scheduler avoids the tainted node &#8594; the new Pod runs on</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1899" x="459.1035" y="541.8408">worker-1</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="513.2935" y="541.8408">.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="118.4473" x="70.5" y="556.7896">The old Pod shows</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.3945" x="192.5591" y="556.7896">Terminating</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="497.707" x="270.5654" y="556.7896">&#8212; indefinitely. Only its kubelet can confirm the containers stopped (diagram 52).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="663.7705" x="70.5" y="569.8623">For a while the old containers may STILL be running on worker-2 &#8212; two copies exist. Fine for nginx; dangerous for a database.</text></g><!--entity e1--><g class="entity" data-entity="e1" data-source-line="21" data-uid="ent0011" id="entity_e1"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="708.272" x="56" y="634.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5986" x="70" y="660.8921">It renews its Lease, posts Ready = True, the taints are removed.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="680.272" x="70" y="675.8408">It sees the old Pod's deletionTimestamp, stops the containers, and confirms &#8212; the Terminating Pod finally disappears.</text></g><g class="link" data-entity-1="a" data-entity-2="b" data-uid="lnk12" id="link_a_b"><polygon fill="#475569" points="30,173.6839,34,164.6839,30,168.6839,26,164.6839,30,173.6839" style="stroke:#475569;stroke-width:1;"/><path d="M30,165.9819 C30,166.6396 30,167.301 30,167.9659 C30,169.2957 30,170.6394 30,171.9947 C30,172.3335 30,172.673 30,173.0133 C30,173.1834 30,173.3536 30,173.5241 C30,173.5667 30,173.6093 30,173.652 C30,173.6626 30,167.6733 30,167.6839" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="b" data-entity-2="c" data-uid="lnk13" id="link_b_c"><polygon fill="#475569" points="30,335.6638,34,326.6638,30,330.6638,26,326.6638,30,335.6638" style="stroke:#475569;stroke-width:1;"/><path d="M30,327.8377 C30,329.3156 30,330.7985 30,332.2838 C30,333.0264 30,333.7697 30,334.5133 C30,334.8851 30,335.257 30,335.6289 C30,335.6405 30,329.6521 30,329.6638" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="c" data-entity-2="d" data-uid="lnk14" id="link_c_d"><polygon fill="#475569" points="30,467.6476,34,458.6476,30,462.6476,26,458.6476,30,467.6476" style="stroke:#475569;stroke-width:1;"/><path d="M30,460.1579 C30,460.4764 30,460.7954 30,461.115 C30,462.3932 30,463.6798 30,464.9727 C30,465.6192 30,466.2672 30,466.9165 C30,467.0789 30,467.2413 30,467.4038 C30,467.485 30,461.5663 30,461.6476" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="d" data-entity-2="e" data-uid="lnk15" id="link_d_e"><polygon fill="#475569" points="30,601.6823,34,592.6823,30,596.6823,26,592.6823,30,601.6823" style="stroke:#475569;stroke-width:1;"/><path d="M30,593.7686 C30,593.9102 30,594.0518 30,594.1935 C30,594.477 30,594.7607 30,595.0447 C30,595.6127 30,596.1817 30,596.7516 C30,597.8913 30,599.0344 30,600.1791 C30,600.4653 30,600.7515 30,601.0379 C30,601.1811 30,601.3243 30,601.4675 C30,601.5391 30,595.6107 30,595.6823" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="29"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="915.4824" x="9.7588" y="720.8301">Total with defaults: about 50s + 300s &#8776; 6 minutes from the last heartbeat to a replacement Pod. Shorten it per Pod with your own tolerationSeconds.</text></g><!--SRC=[ZLV1RXit4BthAwQvs46bjLNNFRYk00TsYg264qGAWWAvKBiZYJ2NN91SosfHeAUYlHRzbzxxAVcIlY5NybfsWHe-o28vGxvvxytu2srBqrPCHN6KVwDp9XnLMYszgiFHRMdLAAwuvg9fQpE8EXgcZoksfCWwd0pHDO4yDyv7RPVq-TU_20UeueLgJQIeQpRQyf2KhMYzSgJA64X5ObMkS9oRmS1p6PLT8lIBID_HCVtpTmfosyxPSEoI7CfNHitFA6nmhYwZIIjqUn96QiasahEqTlwM_UYhbo_e_7pfNTkyKjLaGWf9wUS1KI_Px4aEpvRNyWwDIvxF9zUi0fyVpIUahVmjkqVoy97PhHnQvsjbp8RuZlr6jesFWoozJ8_EaHiN4a0TQYgseVXavGQbir418fyotZ8tv5jhiJc55qHtMweKKIuNLheEL3a4Z6IPgqU8HKSfaAB6kv837c_q7IFZUT0_yTbuFBbnSPLUQjF9YtTlg5m160wquLYaK0Bn4k7aqaWPjG7aQXFeFQjgKvmVIR2983tVWJm