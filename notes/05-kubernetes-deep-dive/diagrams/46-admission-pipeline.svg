<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="763px" preserveAspectRatio="none" style="width:1180px;height:763px;background:#FFFFFF;" version="1.1" viewBox="0 0 1180 763" width="1180px" zoomAndPan="magnify"><title>Where Pod Security Admission sits &#8212; mutate first, then validate, then store</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="646.1367" x="263.0273" y="30.8838">Where Pod Security Admission sits &#8212; mutate first, then validate, then store</text></g><!--cluster auth--><g class="cluster" data-entity="auth" data-source-line="6" data-uid="ent0003" id="cluster_auth"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="586" x="180.3457" y="131.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="256.4263" x="345.1326" y="149.8921">AuthN &#8594; AuthZ  (chapters 05-01 to 05-04)</text></g><!--cluster mut--><g class="cluster" data-entity="mut" data-source-line="10" data-uid="ent0005" id="cluster_mut"><rect fill="#F8FAFC" height="134" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="628" x="180.3457" y="272.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="383.5635" x="302.564" y="290.8921">PHASE 1 &#183; MUTATING admission &#8212; may CHANGE the request</text></g><!--cluster val--><g class="cluster" data-entity="val" data-source-line="14" data-uid="ent0007" id="cluster_val"><rect fill="#F0FDF4" height="174" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="630" x="180.3457" y="449.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="389.3589" x="300.6663" y="467.8921">PHASE 2 &#183; VALIDATING admission &#8212; may REJECT the request</text></g><!--entity req--><g class="entity" data-entity="req" data-source-line="4" data-uid="ent0002" id="entity_req"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="225.2598" x="83.8457" y="61.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.2598" x="97.8457" y="87.8921">kubectl apply -f insecure-pod.yaml</text></g><!--entity etcd--><g class="entity" data-entity="etcd" data-source-line="18" data-uid="ent0009" id="entity_etcd"><rect fill="#FFFFFF" height="42.9487" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="284.4263" x="54.3457" y="676.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.4263" x="68.3457" y="702.8921">Stored in etcd &#8212; 'the object becomes reality'</text></g><!--entity rej--><g class="entity" data-entity="rej" data-source-line="20" data-uid="ent0010" id="entity_rej"><rect fill="#FEE2E2" height="42.9487" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="304.6309" x="819.8457" y="540.1982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="276.6309" x="833.8457" y="566.3921">REJECTED &#8212; 403 Forbidden, nothing stored</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="7" data-uid="ent0004" id="entity_a1"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="534.8809" x="222.8457" y="189.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.2832" x="236.8457" y="215.8921">Who are you? May you create Pods in this namespace?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="506.8809" x="236.8457" y="228.9648">Passing here only means you are ALLOWED to ask. It says nothing about whether the Pod itself is safe.</text></g><!--entity m1--><g class="entity" data-entity="m1" data-source-line="11" data-uid="ent0006" id="entity_m1"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="577.4736" x="222.8457" y="330.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.2173" x="236.8457" y="356.8921">Mutate:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.1162" x="286.6748" y="356.8921">inject sidecars, add defaults</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="549.4736" x="236.8457" y="369.9648">Built in: ServiceAccount (mounts the token), DefaultStorageClass, LimitRanger (default requests/limits)...</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="413.2305" x="236.8457" y="382.6138">Webhooks: a service mesh injecting its proxy container &#183; Kyverno mutate rules</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="15" data-uid="ent0008" id="entity_v1"><rect fill="#DCFCE7" height="108.4932" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="579.1172" x="222.8457" y="507.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1836" x="236.8457" y="533.8921">Validate:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="254.4966" x="294.6411" y="533.8921">reject Pods that don't meet security rules</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="40.9331" x="236.8457" y="546.9648">Built in:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="64.1846" x="280.835" y="546.9648">PodSecurity</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="359.4067" x="348.0757" y="546.9648">(Type: Validating, stable v1.25) &#183; ResourceQuota &#183; NodeRestriction ...</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="276.3105" x="236.8457" y="559.6138">Webhooks: OPA Gatekeeper &#183; Kyverno validate rules</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="236.8457" y="574.1387">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="551.1172" x="236.8457" y="587.2114">PodSecurity reads the TARGET NAMESPACE's labels, then checks the Pod's spec against that PSS level.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="534.8159" x="236.8457" y="599.8604">Validation runs AFTER mutation, so it judges the Pod as it will actually be stored &#8212; sidecars included.</text></g><g class="link" data-entity-1="req" data-entity-2="auth" data-uid="lnk11" id="link_req_auth"><polygon fill="#475569" points="196.3457,131.5989,200.3457,122.5989,196.3457,126.5989,192.3457,122.5989,196.3457,131.5989" style="stroke:#475569;stroke-width:1;"/><path d="M196.3457,104.9014 C196.3457,111.9978 196.3457,120.4457 196.3457,129.4729 C196.3457,130.0371 196.3457,130.6036 196.3457,131.1721 C196.3457,131.3143 196.3457,125.4565 196.3457,125.5989" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="auth" data-entity-2="mut" data-uid="lnk12" id="link_auth_mut"><polygon fill="#475569" points="196.3457,272.6017,200.3457,263.6017,196.3457,267.6017,192.3457,263.6017,196.3457,272.6017" style="stroke:#475569;stroke-width:1;"/><path d="M196.3457,253.8633 C196.3457,254.1874 196.3457,254.5128 196.3457,254.8396 C196.3457,255.4932 196.3457,256.1521 196.3457,256.816 C196.3457,259.4716 196.3457,262.2073 196.3457,265.0031 C196.3457,266.401 196.3457,267.8139 196.3457,269.2393 C196.3457,269.9519 196.3457,270.6678 196.3457,271.3864 C196.3457,271.7457 196.3457,272.1057 196.3457,272.4664 C196.3457,272.5115 196.3457,266.5566 196.3457,266.6017" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="mut" data-entity-2="val" data-uid="lnk13" id="link_mut_val"><polygon fill="#475569" points="196.3457,449.5167,200.3457,440.5167,196.3457,444.5167,192.3457,440.5167,196.3457,449.5167" style="stroke:#475569;stroke-width:1;"/><path d="M196.3457,407.0183 C196.3457,407.2435 196.3457,407.4694 196.3457,407.6958 C196.3457,409.5072 196.3457,411.357 196.3457,413.2408 C196.3457,420.7762 196.3457,428.8571 196.3457,437.2126 C196.3457,439.3015 196.3457,441.4075 196.3457,443.5265 C196.3457,444.586 196.3457,445.6487 196.3457,446.7141 C196.3457,447.2468 196.3457,447.7802 196.3457,448.3142 C196.3457,448.5812 196.3457,448.8484 196.3457,449.1157 C196.3457,449.2493 196.3457,443.383 196.3457,443.5167" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="val" data-entity-2="etcd" data-uid="lnk14" id="link_val_etcd"><polygon fill="#475569" points="196.3457,676.498,200.3457,667.498,196.3457,671.498,192.3457,667.498,196.3457,676.498" style="stroke:#475569;stroke-width:1;"/><path d="M196.3457,624.0416 C196.3457,624.1925 196.3457,624.3434 196.3457,624.4944 C196.3457,625.0982 196.3457,625.7025 196.3457,626.3073 C196.3457,627.5169 196.3457,628.728 196.3457,629.9392 C196.3457,632.3615 196.3457,634.7838 196.3457,637.1936 C196.3457,642.0131 196.3457,646.7824 196.3457,651.4009 C196.3457,660.6379 196.3457,663.2718 196.3457,670.498" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.3867" x="202.3457" y="650.9541">every controller said yes</text></g><g class="link" data-entity-1="val" data-entity-2="rej" data-uid="lnk15" id="link_val_rej"><polygon fill="#475569" points="951.2121,540.1894,947.4834,531.0736,947.6028,536.7292,941.9472,536.8485,951.2121,540.1894" style="stroke:#475569;stroke-width:1;"/><path d="M213.955,449.1865 C214.1647,449.0169 214.3811,448.8483 214.604,448.6808 C215.0498,448.3457 215.5219,448.0147 216.0198,447.6877 C217.0157,447.0338 218.1149,446.3959 219.3143,445.7739 C221.713,444.5299 224.5122,443.3493 227.6856,442.2299 C234.0323,439.9913 241.8757,437.9977 251.0058,436.2323 C269.2658,432.7014 292.6722,430.0831 319.5437,428.2418 C373.2868,424.5591 440.8905,423.9841 508.906,425.4313 C644.9368,428.3257 782.6143,439.3091 814.3457,449.6982 C869.9459,467.9023 918.6255,508.9492 946.8809,536.0372" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.4316" x="407.8457" y="433.9541">ANY controller in EITHER phase said no</text></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1111.0723" x="30.5596" y="731.8301">"If any of the controllers in either phase reject the request, the entire request is rejected immediately." PSA is one validating controller among several &#8212; not the whole of admission.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1162.1914" x="5" y="747.9287">That is also why a rejected Pod never appears in kubectl get pods: it never reached etcd. A Deployment's Pods rejected this way show up as FailedCreate events on its ReplicaSet instead.</text></g><!--SRC=[XLNRRkCs47ttLqppaWI8xMIx-s8ONgY9SsaJRngx6xJO5reQMumfKajISTMYG9_w0KN_fU_zbFsI7bAMumGf2XYmH95dPiwSEVnAwbHL6LElrsz-tXZb-faKIoiArr-bMdHzpWNtogfG7I-zOhhFsJBTceocd5PM-fgIh93EIQF9IU_eo-z_KL5vuPaMqZf_H03Hz2YKpB2uUNNUMEvqBATUw2M0zrRL72-AH5cgcheBajg54DmjJTQhHQ7sQ3WibP1wD2BXoFBdPm19vVC9VVdZJmfFFn4TfBaeFLj7n- -wnoVaJNnuUnY0bjPKPGCai9r-xH3jWDtdXWGghKtrdcv47HuejHpAGlKEsQ4GwKYBWbqfKdx_IG-T_8K79oUZMm52z98YMKQZdeA5TX4ae2RNrn_knsSX8-5MFRhov4GDC0DCd1DpKtbQvmokR20iCWvsMO4NXyqBxWtx8Tpe1IlYfFFRCrfkBvFfc4xedx_fveTPChkQN93OjYns2-MTNYQJYt4C1LuhTlu5IMZfIuw6yz5DRFHWs9-FmCW3la446QV2kYD4oIZZXQYKTplaV5D9vR5x00dPHvboagQcqfuEYl3dOXBUh5WV7j5PStuAkOWbdoeGUqJNif3-3bc0d8DDX3PjrrVXgplizLg6TcBVypmtPkK69CWrqT4Qbs-I3zm73PVM_5nJQhG7hmW2xhwh7zbgqqhRLehTJWT4chBs6wfURy6R0FCnkRuw-wyct8s_7P_ENct2XJ5PWuv1UgKH7pVZrRJ2Scn55AhFXQVCw7sFIXdzQUSsbl1gNu27e-s0HyI3MLtoW3PXmDCHHbZC4VtnfFVctM6exOwTgMpAtrV6Yx0mCHbZqLi9Qb7d_xJamsr25wXXnLm-9xqrZsUqVzAx4_UKBweNMQEYMN9tCPxH9BaPJs-Jq_6-8oNchDp6XTASqvLh1mnVNSafYIMwxdp3tErqIeeVMRsIUii6IhCLnZivdutl6eLW3GmPg8aUgcp9so2XXLXSImMhItqb5DnXpeqXPb4AxGJHngAptL5VFWdXfSoc3GISYNtQGEs7g6OUrG1xDT1we4U1flqNnX7EF8Dhr0YN2a1lZx-cSsFdCiiObRL6rMGTaEOYQstv8S1yfcvcrhexYlRQYHxRhe2XJl2JzXtjxGHPj-yn_G61TTjCeJLAGH5Eo8ngTircAvUvxqQnOtCo-N5tAqWONyqkqOuo5uwRezfqEYckXD2meHpjNIr8w9hC8ZRdwNHqTvRHV9lZcu7QcSoe8CBCIxjT2zRSx0njA0h6PUfPrRqzo2W9NutcLio1lfs4HM42dw5c51Se1ySnnZetQ0UIt1e6z2233kLe5YGANA6WjNLUmzQs2GInwO0NhbHkz4JjBRk44-1UnTH1ZCqkw0Bpa4NsUvJ0UajbwW8bOZ2YbMoXuystXcEvtAofAaFVpuLKd9qsLoG0WvE3vs2dTq2IgPXoi1VdCPwnWdy1]--></g></svg>