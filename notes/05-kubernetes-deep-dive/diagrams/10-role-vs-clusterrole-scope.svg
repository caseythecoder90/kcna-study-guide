<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="600px" preserveAspectRatio="none" style="width:2048px;height:600px;background:#FFFFFF;" version="1.1" viewBox="0 0 2048 600" width="2048px" zoomAndPan="magnify"><title>The same permission, two scopes &#8212; and the one command that proves it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="629.1387" x="701.9307" y="30.8838">The same permission, two scopes &#8212; and the one command that proves it</text></g><!--cluster cw--><g class="cluster" data-entity="cw" data-source-line="4" data-uid="ent0002" id="cluster_cw"><rect fill="#FEF2F2" height="304.5" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="726" x="14" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="320.3218" x="216.8391" y="71.8921">CLUSTER-WIDE &#183; ClusterRole + ClusterRoleBinding</text></g><!--cluster ns--><g class="cluster" data-entity="ns" data-source-line="10" data-uid="ent0006" id="cluster_ns"><rect fill="#F0FDF4" height="353" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="526" x="748" y="192.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="223.5391" x="899.2305" y="210.8921">NAMESPACED &#183; Role + RoleBinding</text></g><!--cluster tbl--><g class="cluster" data-entity="tbl" data-source-line="16" data-uid="ent0010" id="cluster_tbl"><rect fill="#F8FAFC" height="182" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="760" x="1282" y="366.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="302.1548" x="1510.9226" y="384.3921">The four objects, as the lecture's table puts them</text></g><!--entity cw1--><g class="entity" data-entity="cw1" data-source-line="5" data-uid="ent0003" id="entity_cw1"><rect fill="#FEE2E2" height="98.144" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="674.5786" x="22.5" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="472.9131" x="36.5" y="112.8921">kubectl create clusterrole cluster-watcher --verb=list,get,watch --resource='*'</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="646.5786" x="36.5" y="127.8408">kubectl create clusterrolebinding cluster-watcher --clusterrole=cluster-watcher --group=cluster-watchers</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="36.5" y="142.7896">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="455.3774" x="36.5" y="155.8623">Read-only, everywhere. Note what changed from cluster-superhero: only the VERB list.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="387.8521" x="36.5" y="168.5112">Resource is still '*' &#8212; the constraint is which ACTIONS, not which objects.</text></g><!--entity cw2--><g class="entity" data-entity="cw2" data-source-line="6" data-uid="ent0004" id="entity_cw2"><rect fill="#FFFFFF" height="121.1421" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="393.6318" x="163" y="229.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.8628" x="177" y="255.3921">kubectl auth can-i '*' '*' --as-group=cluster-watchers --as=uatu</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="30.5562" x="177" y="268.4648">&#8594; NO</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="177" y="282.9897">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="360.6582" x="177" y="296.0625">Not a mistake: the question asks for the '*' VERB, and this role grants only</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="313.0488" x="177" y="308.7114">list, get and watch. Ask a question it can answer and it says yes:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="357.0435" x="177" y="321.3604">kubectl auth can-i list pods --as-group=cluster-watchers --as=uatu  &#8594; yes</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="365.6318" x="177" y="334.0093">kubectl auth can-i delete pods --as-group=cluster-watchers --as=uatu &#8594; no</text></g><!--entity ns1--><g class="entity" data-entity="ns1" data-source-line="11" data-uid="ent0007" id="entity_ns1"><rect fill="#DCFCE7" height="128.0415" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="475.9541" x="756" y="225.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.8589" x="770" y="251.8921">kubectl create namespace gryffindor</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="447.9541" x="770" y="266.8408">kubectl -n gryffindor create role gryffindor-admin --verb='*' --resource='*'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="357.519" x="770" y="281.7896">kubectl -n gryffindor create rolebinding gryffindor-admin \</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="311.9937" x="777.2236" y="296.7383">--role=gryffindor-admin --group=gryffindor-admins</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="770" y="311.687">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="397.3481" x="770" y="324.7598">Every verb on every resource &#8212; but ONLY inside the gryffindor namespace.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="285.4199" x="770" y="337.4087">Both objects live in that namespace; -n is not optional.</text></g><!--entity ns2--><g class="entity" data-entity="ns2" data-source-line="12" data-uid="ent0008" id="entity_ns2"><rect fill="#326CE5" height="136.0908" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="429.6182" x="779" y="401.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="330.8018" x="793" y="427.8921">THE DEMONSTRATION &#8212; one question, two answers</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="333.1851" x="793" y="440.9648">kubectl auth can-i '*' '*' --as-group=gryffindor-admins --as=harry</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="331.2891" x="793" y="453.6138">&#8594; NO      (no namespace given, so the question is cluster-wide)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="793" y="468.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="401.6182" x="793" y="481.2114">kubectl -n gryffindor auth can-i '*' '*' --as-group=gryffindor-admins --as=harry</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="394.3135" x="793" y="493.8604">&#8594; YES     (the same identity, the same verbs, asked INSIDE the namespace)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="793" y="508.3853">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="325.1714" x="793" y="521.458">Identical user, identical group, identical role. Only -n changed.</text></g><!--entity t--><g class="entity" data-entity="t" data-source-line="17" data-uid="ent0011" id="entity_t"><rect fill="#326CE5" height="140.6904" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="709.9097" x="1324" y="399.1982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="561.3677" x="1338" y="425.3921">Role               Namespace     grants permissions to resources WITHIN a specific namespace</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="619.1187" x="1338" y="440.3408">RoleBinding        Namespace     binds users/groups/service accounts to a Role WITHIN a namespace</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="638.644" x="1338" y="455.2896">ClusterRole        Cluster-Wide  grants permissions across the ENTIRE cluster, regardless of namespace</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="681.9097" x="1338" y="470.2383">ClusterRoleBinding Cluster-Wide  binds subjects to a ClusterRole, giving them permissions across the cluster</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="1338" y="485.187">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="517.6553" x="1338" y="498.2598">And the combination that is neither row: a ROLEBINDING referencing a CLUSTERROLE grants that</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="533.7847" x="1338" y="510.9087">ClusterRole's rules INSIDE ONE NAMESPACE &#8212; how the built-in view/edit/admin are reused per team.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="236.5376" x="1338" y="523.5576">The BINDING decides the scope, not the role.</text></g><g class="link" data-entity-1="cw1" data-entity-2="cw2" data-uid="lnk5" id="link_cw1_cw2"><polygon fill="#475569" points="360,229.1691,364,220.1691,360,224.1691,356,220.1691,360,229.1691" style="stroke:#475569;stroke-width:1;"/><path d="M360,184.792 C360,198.882 360,208.458 360,223.1691" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ns1" data-entity-2="ns2" data-uid="lnk9" id="link_ns1_ns2"><polygon fill="#475569" points="994,401.5502,998,392.5502,994,396.5502,990,392.5502,994,401.5502" style="stroke:#475569;stroke-width:1;"/><path d="M994,353.7049 C994,369.2064 994,379.8612 994,395.5502" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="23"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1409.9941" x="311.5029" y="568.3301">Two independent dials: the VERB list narrows what may be done, the BINDING KIND narrows where. cluster-watcher shows the first, gryffindor-admin shows the second, and cluster-superhero from chapter 05-03 turned both off.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="502.6328" x="765.1836" y="584.4287">Least privilege is just choosing a real value for each instead of leaving them at '*'.</text></g><!--SRC=[jLRBSXj55DtxAoxPc8T6Ig3O65jLVambAXoPiWMk56BHccb97O-wHNUFLOOYnOeFeFWNzdnAleHpksT68taCOO4ggMJwSP_ddBuVAPqLPIwftn_4FzwOmWro9HPMhDpWBjCYyKkvalrrkIeElFA5fCbIaXChIMjfLyevPNIF_CQGoynQEdh_wnyaT4wuI4PBoing5R-5fxKrzpYZ_C61bPaNUW6BpyullxsPfDV9xUWYfR_-fFEYT5xQQuFDpzfVPqhdIY-UqV7nmffoVIRouP24esn3FnyGjMpUbJDy59HPAJoYY4Oicwp-dso4pvRIqhlaNN8lxUoaKCxt5jBtmavOjzAPqcRovF3Jmwb-skWiHjPfktNif6i_fBA_uwPwge-T-aaUlNWnl9OYJumk7dea4Uh31YTadyO6KMouiDaIUSkSvjQicY1SYHxXf3aYlXjQybrwVKQSQFzumDQ7ErvYigGSEQ-AWf1rQ2ZVp8nstWgbFUzlbWebEZsVZAx6DptInbTBPlOMDNArUUxLRDkc5zrT4gLVKYPqee9B_ikL4Uw9ubIx9wNmPIk1zx_zJkEh9h7M3Yf5We1NB-xaKSZdnr8YIQCHs9sZkR5XbLrpZNeLY95g00qeeRqBTNnSk00S0dB2fH1adqxT7LmsNfJd1770RT1tFeSL9nuSFKXtzDXcHsdO3QrDxZwyE4HS4tZu80UvB2GGzHzTi0TjMlrU5q19tV7FqN7qdPBSR7Go32k_xD1_VFewlVdcz3ozOF9NhE-Y-qjZAY1fzozyrr0ejnOPD-vXFeSXOxVyJNHhkRvIjRbUJaI-Kdeh3ZKcknNXIOkrC3moF9rEDKMBB0oTZcFnzxTsfI5bFI0E4U2Cwa1rZ86xizBJrVZo3U6cWjmpobknDfNg48Gpunj20tttK0OTXRovzHMd3fAm09Wr8rqKRUulMZtR8__aLKeNwMlen-Jwb7KaXCjlHasQ-B14ohX_XcwdR3ogN8tRfR2sWyTHFoZyFjQcZI8aZt2SsPKE9DvG0xNzf4jwkY7oVuJ-9hs9eVlwZKPC6iysdercYP7YUYnwU2v6unj-StcpoRKpYL4mb8c2IYTjhpBCto7SzWB3kKzN_E0WvUfXQaD2P1dErg1WVG0q6dtWbLrzu8bZ3ZpNIEJWGyW5laeh3_4bPZYvBdtOM3MA4PtuMR4l5q5bTd_Zfjdyg_H-E-J0Z6c8vUXsD7ar6aFWtLfcQgwoRG6dkYLUtTPP5LmefHk4GDq0_xzNs4Pr