<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="815px" preserveAspectRatio="none" style="width:883px;height:815px;background:#FFFFFF;" version="1.1" viewBox="0 0 883 815" width="883px" zoomAndPan="magnify"><title>PSS is the rulebook, PSA is the referee &#8212; and namespace labels decide the game</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="698.2559" x="88.8091" y="30.8838">PSS is the rulebook, PSA is the referee &#8212; and namespace labels decide the game</text></g><!--cluster pss--><g class="cluster" data-entity="pss" data-source-line="4" data-uid="ent0002" id="cluster_pss"><rect fill="#F8FAFC" height="160" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="632" x="52.437" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="481.7871" x="127.5435" y="71.8921">POD SECURITY STANDARDS (PSS) &#8212; three levels, from open to locked down</text></g><!--cluster psa--><g class="cluster" data-entity="psa" data-source-line="12" data-uid="ent0008" id="cluster_psa"><rect fill="#F0FDF4" height="235" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="648" x="52.437" y="256.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="610.3525" x="71.2607" y="274.8921">POD SECURITY ADMISSION (PSA) &#8212; the built-in admission controller that applies them (GA v1.25)</text></g><!--cluster wh--><g class="cluster" data-entity="wh" data-source-line="16" data-uid="ent0010" id="cluster_wh"><rect fill="#F8FAFC" height="112" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="794" x="52.437" y="510.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="440.7876" x="229.0432" y="528.8921">WHEN THE BUILT-IN ISN'T ENOUGH &#8212; webhook admission controllers</text></g><!--cluster psp--><g class="cluster" data-entity="psp" data-source-line="20" data-uid="ent0012" id="cluster_psp"><rect fill="#FEF2F2" height="122" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="760" x="52.437" y="641.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.8271" x="319.0234" y="659.8921">LEGACY &#8212; PodSecurityPolicy (PSP)</text></g><!--entity p1--><g class="entity" data-entity="p1" data-source-line="5" data-uid="ent0003" id="entity_p1"><rect fill="#FEE2E2" height="118.8423" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="185.0991" x="94.937" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="62.1372" x="108.937" y="112.8921">Privileged</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="135.6953" x="108.937" y="125.9648">Unrestricted &#8212; the widest</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="154.043" x="108.937" y="138.6138">possible permissions. Allows</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="157.0991" x="108.937" y="151.2627">KNOWN privilege escalations.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="121.6392" x="108.937" y="163.9116">For trusted system and</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="128.9761" x="108.937" y="176.5605">infrastructure workloads</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="153.4307" x="108.937" y="189.2095">(CNI agents, storage drivers).</text></g><!--entity p2--><g class="entity" data-entity="p2" data-source-line="6" data-uid="ent0004" id="entity_p2"><rect fill="#FFFFFF" height="118.8423" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="177.7944" x="298.437" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="53.4727" x="312.437" y="112.8921">Baseline</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.0107" x="312.437" y="125.9648">Minimally restrictive &#8212;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.166" x="312.437" y="138.6138">PREVENTS known privilege</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="127.7891" x="312.437" y="151.2627">escalations, yet allows the</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.7544" x="312.437" y="163.9116">default Pod configuration.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="149.7944" x="312.437" y="176.5605">No privileged, no hostNetwork,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="140.0513" x="312.437" y="189.2095">no hostPath, no added caps.</text></g><!--entity p3--><g class="entity" data-entity="p3" data-source-line="7" data-uid="ent0005" id="entity_p3"><rect fill="#DCFCE7" height="118.8423" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="181.3984" x="494.937" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="63.5781" x="508.937" y="112.8921">Restricted</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.7275" x="508.937" y="125.9648">Heavily restricted &#8212; current</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="150.9761" x="508.937" y="138.6138">Pod hardening best practice.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="140.54" x="508.937" y="151.2627">Must run as non-root, drop</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="152.2007" x="508.937" y="163.9116">ALL capabilities, no privilege</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="107.6045" x="508.937" y="176.5605">escalation, seccomp</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="153.3984" x="508.937" y="189.2095">RuntimeDefault or Localhost.</text></g><!--entity psa1--><g class="entity" data-entity="psa1" data-source-line="13" data-uid="ent0009" id="entity_psa1"><rect fill="#DCFCE7" height="193.5859" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="597.3145" x="94.937" y="289.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="560.5425" x="108.937" y="315.8921">Configured PER NAMESPACE with labels:   pod-security.kubernetes.io/&lt;MODE&gt;: &lt;LEVEL&gt;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="108.937" y="330.8408">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="190.1367" x="108.937" y="343.9136">kubectl label namespace payments \</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="246.0498" x="121.1616" y="356.5625">pod-security.kubernetes.io/enforce=restricted \</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="231.9883" x="121.1616" y="369.2114">pod-security.kubernetes.io/warn=restricted \</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="226.4775" x="121.1616" y="381.8604">pod-security.kubernetes.io/audit=restricted</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="108.937" y="396.3853">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.96" x="108.937" y="411.334">enforce</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="179.8672" x="163.1206" y="411.334">a violating Pod is REJECTED</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="30.3418" x="108.937" y="426.2827">warn</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="290.4053" x="157.3379" y="426.2827">allowed, but the user sees a warning in kubectl</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="31.0527" x="108.937" y="441.2314">audit</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="354.6245" x="154.437" y="441.2314">allowed, but an annotation is added to the audit log event</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="569.3145" x="108.937" y="454.3042">Common rollout: warn + audit first to find violations, then enforce. enforce checks Pods only; warn and audit</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="558.728" x="108.937" y="466.9531">also check Deployments and other workload templates &#8212; so they catch problems before Pods are created.</text></g><!--entity wh1--><g class="entity" data-entity="wh1" data-source-line="17" data-uid="ent0011" id="entity_wh1"><rect fill="#326CE5" height="70.5464" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="743.165" x="94.937" y="543.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="102.6035" x="108.937" y="569.8921">OPA Gatekeeper</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="486.1035" x="218.7642" y="569.8921">(Open Policy Agent, CNCF Graduated) &#8212; policies written in the Rego language</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="52.019" x="108.937" y="584.8408">Kyverno</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="655.9224" x="168.1797" y="584.8408">(CNCF Graduated) &#8212; policies written as Kubernetes YAML; can validate, MUTATE and generate resources</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="554.2646" x="108.937" y="597.9136">Any rule you can express: 'images only from our registry', 'every Pod needs a team label', 'no :latest tags'.</text></g><!--entity psp1--><g class="entity" data-entity="psp1" data-source-line="21" data-uid="ent0013" id="entity_psp1"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="708.5132" x="94.937" y="674.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="216.0488" x="108.937" y="700.8921">Deprecated v1.21, REMOVED v1.25</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="460.8525" x="328.5977" y="700.8921">&#8212; replaced by Pod Security Admission (or a third-party admission plugin).</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="622.9341" x="108.937" y="713.9648">A cluster-level resource that controlled security-sensitive aspects of Pod specs, granted to users and ServiceAccounts</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="642.3237" x="108.937" y="726.6138">through RBAC. The study tips' phrasing to recognise: 'Pod Security Policies manage clusters and namespaces at runtime'.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="679.7173" x="108.937" y="739.2627">Hard to use correctly &#8212; which policy applied depended on RBAC, and mistakes silently over-granted. That is why it was removed.</text></g><g class="link" data-entity-1="pss" data-entity-2="psa" data-uid="lnk14" id="link_pss_psa"><polygon fill="#475569" points="68.437,256.6813,72.437,247.6813,68.437,251.6813,64.437,247.6813,68.437,256.6813" style="stroke:#475569;stroke-width:1;"/><path d="M68.437,214.4219 C68.437,215.6741 68.437,216.9358 68.437,218.2064 C68.437,223.2884 68.437,228.5111 68.437,233.8274 C68.437,239.1438 68.437,244.5538 68.437,250.0107 C68.437,251.3749 68.437,252.742 68.437,254.1114 C68.437,254.7961 68.437,255.4813 68.437,256.1669 C68.437,256.3384 68.437,250.5098 68.437,250.6813" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.4004" x="74.437" y="240.9541">the levels PSA enforces</text></g><g class="link" data-entity-1="psa" data-entity-2="wh" data-uid="lnk15" id="link_psa_wh"><polygon fill="#475569" points="68.437,510.6629,72.437,501.6629,68.437,505.6629,64.437,501.6629,68.437,510.6629" style="stroke:#475569;stroke-width:1;"/><path d="M68.437,492.3715 C68.437,493.4188 68.437,494.4647 68.437,495.5084 C68.437,499.6835 68.437,503.8258 68.437,507.9025 C68.437,508.4121 68.437,508.9207 68.437,509.4282 C68.437,509.6819 68.437,509.9354 68.437,510.1886 C68.437,510.3151 68.437,510.4417 68.437,510.5681 C68.437,510.5997 68.437,504.6313 68.437,504.6629" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="wh" data-entity-2="psp" data-uid="lnk16" id="link_wh_psp"><polygon fill="#475569" points="68.437,641.6717,72.437,632.6717,68.437,636.6717,64.437,632.6717,68.437,641.6717" style="stroke:#475569;stroke-width:1;"/><path d="M68.437,622.7718 C68.437,623.0881 68.437,623.4053 68.437,623.7234 C68.437,626.2676 68.437,628.8634 68.437,631.4935 C68.437,634.1236 68.437,636.7879 68.437,639.469 C68.437,640.1392 68.437,640.8105 68.437,641.4826 C68.437,641.5246 68.437,641.5666 68.437,641.6086 C68.437,641.6296 68.437,635.6507 68.437,635.6717" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="28"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="865.874" x="5" y="783.8301">Admission is the layer; PSA is one admission controller; PSS is the set of rules it checks. "PSA enforces PSS" is the sentence to remember.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="575.8936" x="149.9902" y="799.9287">Unlabelled namespaces are, by default, privileged &#8212; nothing is checked until you label them.</text></g><!--SRC=[fLV1RkD64hthAshdOXihoV04kNWK0Hn9iRrZou8a9nXaScYHBR8XifleRbhH1W7o4Vd2_P9zrQGaZgKiWerXm39LNLtrwjMhuZ-KZlCgaTJlNzU_tfZSNITAf5OKxdeJQz7pcInalwoAlEELpoND5WjIZl2SR9NBbJ6RBXv6XuToBQsKz9_V_o2X4zAYaAuKiQHSh6JkA96nmgric-AxJiVAs0kTmlUxsVEO5fFHo_nX-PaMosWwZkRZ1LtYqglWqMViEvUlyDIbjJK5cL9gyePo4szaGedPwdSq6AJMLELmIC9HwHpzsY5gNJHO3MTMlQfSfZ8PNA-6N_J0gN_BsvkRuOksqdchOWztzQMIjeZP-S4r6xMDI-ESMi5bAMsXyDberwSepytMdLf_cZx_EALoVpD95ujS-73erFfxOydRod4SReS_1IDwQgVqsWf4NCM-iWZLs4rkH7Bc_ilHz854AhK7UiuRYy-K81nftTK-0aPl9P86kviJu3uA9tEbvHlOdfHMXSZp7UtXWrl6xpICsNpomsIwND16erf7F4ujMm1rQISzYO0ib-JKE95hKUMUPYQXsEYrIYiRpfx1TcgEroPTqeOou_nKUaQlUshV6Co4puArI19K9HQbQyDMvaBf1hZt9y3D3xHw0zsz58Za25p3kxYo5gKwWnyIp8HDf5OwfHLE8Ha1m6Dv9jKdC0YzgZagRNJF6kExgBefJssZnqTEIgnKhhoIBkJwb-e3FiauDiKPf_DAUrN8SLCUiFhHu1ZZsGOlDMPFkc-0NNb3lPyo1PprprQbcUyDQr3BzsU- -ARpsvyhIJH-UbWi7fwdh2JHrQ6fLvNAVKy1cQJfNUQDjoRF9Lel4-1RMUR0WSqBkhoBwFMc__xRguF2t1s3TkAjoemQ4gAUiycSfj7JP36BHXEeYSyQFRmbP6II7j2hhFAx_gPQIQkbbwwlpFNWwNay6TxIu14jymXKMxYoPUppsb5BQ4knAxZ5wSkNqsBG_xvFwhMniVokHSN_myjMMFqtNOWgKRxbu-00BbR39apk8o91hyem2z4Ct1gOHFF9loQZvMGSZ3cQsX8_GK2uvLUL3oIe76hj96eiY2tP2oZHW1iSX5Zs7hvo8C0ThOqFBS0Nrxg0SSIkmpaCffGmiBHl9JyoHO43p3HJ-TjmCVspER1M5XqB7sk50Tha5XGGJZKrkVVt7oZEPBnndBeZe_FTXzeTJzycyhVOYzoP-XYDPPcRXYzymk0EUvWXXA43KKDDGjEuaDSE4k7Z3BfWCFaA1mL