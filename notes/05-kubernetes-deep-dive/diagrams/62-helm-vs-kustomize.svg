<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="369px" preserveAspectRatio="none" style="width:962px;height:369px;background:#FFFFFF;" version="1.1" viewBox="0 0 962 369" width="962px" zoomAndPan="magnify"><title>Helm = template and render &#183; Kustomize = patch and overlay</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="517.1484" x="218.7651" y="30.8838">Helm = template and render &#183; Kustomize = patch and overlay</text></g><!--cluster helm--><g class="cluster" data-qualified-name="helm" data-source-line="4" id="ent0002"><rect fill="#F8FAFC" height="280" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="390" x="90.3394" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101.8418" x="234.4185" y="71.8921">Helm: substitute</text></g><!--cluster kust--><g class="cluster" data-qualified-name="kust" data-source-line="14" id="ent0010"><rect fill="#F8FAFC" height="280" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="399" x="488.3394" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="112.6899" x="631.4944" y="71.8921">Kustomize: merge</text></g><!--entity h1--><g class="entity" data-qualified-name="helm.h1" data-source-line="5" id="ent0003"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="194.3267" x="278.3394" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.2407" x="292.3394" y="112.8921">templates/deployment.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="166.3267" x="292.3394" y="125.9648">replicas: {{ .Values.replicaCount }}</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="152.2329" x="292.3394" y="138.6138">NOT valid YAML until rendered</text></g><!--entity h2--><g class="entity" data-qualified-name="helm.h2" data-source-line="6" id="ent0004"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="126.9854" x="132.8394" y="92.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.9854" x="146.8394" y="118.8921">values-prod.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="73.9868" x="146.8394" y="131.9648">replicaCount: 5</text></g><!--entity h3--><g class="entity" data-qualified-name="helm.h3" data-source-line="7" id="ent0005"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="148.6309" x="210.8394" y="190.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6309" x="224.8394" y="216.8921">Go template engine</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="109.4199" x="224.8394" y="229.9648">fills the placeholders</text></g><!--entity h4--><g class="entity" data-qualified-name="helm.h4" data-source-line="8" id="ent0006"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="92.3145" x="239.3394" y="282.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.3145" x="253.3394" y="308.8921">replicas: 5</text></g><!--entity k1--><g class="entity" data-qualified-name="kust.k1" data-source-line="15" id="ent0011"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="189.4229" x="689.8394" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.0698" x="703.8394" y="112.8921">base/deployment.yaml</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="50.1338" x="703.8394" y="125.9648">replicas: 1</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="161.4229" x="703.8394" y="138.6138">valid YAML, applyable on its own</text></g><!--entity k2--><g class="entity" data-qualified-name="kust.k2" data-source-line="16" id="ent0012"><rect fill="#FFFFFF" height="55.5977" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="141.4517" x="530.8394" y="92.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="113.4517" x="544.8394" y="118.8921">overlays/prod patch</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="50.1338" x="544.8394" y="131.9648">replicas: 5</text></g><!--entity k3--><g class="entity" data-qualified-name="kust.k3" data-source-line="17" id="ent0013"><rect fill="#EFF6FF" height="55.5977" rx="5" ry="5" style="stroke:#326CE5;stroke-width:1.5;" width="193.6445" x="594.3394" y="190.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.23" x="608.3394" y="216.8921">kustomize build</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="165.6445" x="608.3394" y="229.9648">merges the patch onto the base</text></g><!--entity k4--><g class="entity" data-qualified-name="kust.k4" data-source-line="18" id="ent0014"><rect fill="#DCFCE7" height="42.9487" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="92.3145" x="645.3394" y="282.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="64.3145" x="659.3394" y="308.8921">replicas: 5</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" id="lnk7"><polygon fill="#475569" points="310.7014,190.6454,319.775,186.8154,314.1211,186.9978,313.9387,181.3438,310.7014,190.6454" style="stroke:#475569;stroke-width:1;"/><path d="M344.3665,154.736 C333.3835,166.4512 325.2655,175.1104 314.805,186.2682" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk8"><polygon fill="#475569" points="260.0104,190.3771,256.825,181.0576,256.6111,186.7104,250.9583,186.4966,260.0104,190.3771" style="stroke:#475569;stroke-width:1;"/><path d="M221.6051,148.9512 C233.6307,161.9226 243.8976,172.997 255.9312,185.9771" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" id="lnk9"><polygon fill="#475569" points="285.3394,282.685,289.3394,273.685,285.3394,277.685,281.3394,273.685,285.3394,282.685" style="stroke:#475569;stroke-width:1;"/><path d="M285.3394,247.0393 C285.3394,258.6446 285.3394,265.9429 285.3394,276.685" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0011" data-entity-2="ent0013" data-link-type="dependency" id="lnk15"><polygon fill="#475569" points="717.5468,190.6454,726.6819,186.9645,721.0257,187.0542,720.936,181.3981,717.5468,190.6454" style="stroke:#475569;stroke-width:1;"/><path d="M752.334,154.736 C740.9849,166.4512 732.5307,175.1782 721.7215,186.336" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g cla