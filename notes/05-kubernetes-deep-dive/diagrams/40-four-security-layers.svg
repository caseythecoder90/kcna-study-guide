<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="718px" preserveAspectRatio="none" style="width:1052px;height:718px;background:#FFFFFF;" version="1.1" viewBox="0 0 1052 718" width="1052px" zoomAndPan="magnify"><title>Four layers, four questions &#8212; and what an attacker gets if each one is left open</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="679.1484" x="182.5542" y="30.8838">Four layers, four questions &#8212; and what an attacker gets if each one is left open</text></g><!--cluster l1--><g class="cluster" data-entity="l1" data-source-line="4" data-uid="ent0002" id="cluster_l1"><rect fill="#F8FAFC" height="124" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="806" x="130.6284" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="486.8018" x="290.2275" y="71.8921">LAYER 1 &#183; AuthN and AuthZ &#8212; who can talk to the API, and what may they do?</text></g><!--cluster l2--><g class="cluster" data-entity="l2" data-source-line="8" data-uid="ent0004" id="cluster_l2"><rect fill="#F8FAFC" height="124" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="748" x="130.6284" y="220.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="489.7852" x="259.7358" y="238.8921">LAYER 2 &#183; Admission control &#8212; which requests may create or change objects?</text></g><!--cluster l3--><g class="cluster" data-entity="l3" data-source-line="12" data-uid="ent0006" id="cluster_l3"><rect fill="#F8FAFC" height="112" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="734" x="130.6284" y="387.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="561.9517" x="216.6526" y="405.8921">LAYER 3 &#183; Workload runtime settings &#8212; how Pods and containers actually run on the node</text></g><!--cluster l4--><g class="cluster" data-entity="l4" data-source-line="16" data-uid="ent0008" id="cluster_l4"><rect fill="#F8FAFC" height="124" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="740" x="130.6284" y="542.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="502.7344" x="249.2612" y="560.8921">LAYER 4 &#183; Network and data plane &#8212; how traffic flows, and how data is protected</text></g><!--entity l1a--><g class="entity" data-entity="l1a" data-source-line="5" data-uid="ent0003" id="entity_l1a"><rect fill="#326CE5" height="83.1953" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="755.0859" x="173.1284" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.9873" x="187.1284" y="112.8921">AuthN</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="684.4868" x="229.7275" y="112.8921">('N' for autheNtication) &#8212; who are you?   TLS client certificates &#183; bearer tokens &#183; OIDC &#183; ServiceAccount tokens</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="37.54" x="187.1284" y="127.8408">AuthZ</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="644.6489" x="228.2803" y="127.8408">('Z' for authoriZation) &#8212; what are you allowed to do?   RBAC &#183; Node authorizer &#183; legacy ABAC &#183; webhook</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="560.5059" x="187.1284" y="140.9136">Chapters 05-01 to 05-04.  The API server is the front door: almost everything in Kubernetes goes through it.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="571.5005" x="187.1284" y="153.5625">LEFT OPEN &#8594; anyone with a leaked kubeconfig or an over-broad binding can create, read or delete anything.</text></g><!--entity l2a--><g class="entity" data-entity="l2a" data-source-line="9" data-uid="ent0005" id="entity_l2a"><rect fill="#DCFCE7" height="83.1953" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="698.2871" x="172.6284" y="253.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="396.5063" x="186.6284" y="279.8921">Runs AFTER AuthN/AuthZ, BEFORE the object is stored in etcd.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="266.5571" x="590.3584" y="279.8921">Mutating admission may change a request;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="504.1245" x="186.6284" y="294.8408">validating admission may reject it ('rejecting Pods that don't meet security rules').</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="533.6235" x="186.6284" y="307.9136">Pod Security Admission enforcing the Pod Security Standards &#183; webhooks: OPA Gatekeeper, Kyverno</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="519.5674" x="186.6284" y="320.5625">LEFT OPEN &#8594; an authorised user may still create a privileged Pod that mounts the host filesystem.</text></g><!--entity l3a--><g class="entity" data-entity="l3a" data-source-line="13" data-uid="ent0007" id="entity_l3a"><rect fill="#DCFCE7" height="70.5464" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="683.9604" x="172.6284" y="420.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="556.3086" x="186.6284" y="446.8921">securityContext (user, privileged, capabilities, host namespaces) &#183; seccomp (syscall filter)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="655.9604" x="186.6284" y="461.8408">AppArmor / SELinux (mandatory access control) &#183; user namespaces &#183; sandboxed runtimes such as gVisor</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="589.832" x="186.6284" y="474.9136">LEFT OPEN &#8594; one compromised container runs as root with every capability and a short path to the host kernel.</text></g><!--entity l4a--><g class="entity" data-entity="l4a" data-source-line="17" data-uid="ent0009" id="entity_l4a"><rect fill="#DCFCE7" height="83.1953" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="690.4541" x="172.6284" y="575.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="662.4541" x="186.6284" y="601.8921">NetworkPolicies (which Pods may talk to which, chapter 05-10) &#183; Ingress / Gateway API and TLS at the edge</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="631.4712" x="186.6284" y="616.8408">(chapters 05-11, 05-12) &#183; encryption at rest for Secrets in etcd &#183; mTLS between services (service mesh)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="574.6909" x="186.6284" y="629.9136">LEFT OPEN &#8594; 'even if your AuthN, AuthZ or runtime settings are good, an attacker might still be able to move</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="368.1563" x="186.6284" y="642.5625">laterally inside the cluster or read sensitive data if they get a foothold.'</text></g><g class="link" data-entity-1="l1" data-entity-2="l2" data-uid="lnk10" id="link_l1_l2"><polygon fill="#475569" points="146.6284,220.6547,150.6284,211.6547,146.6284,215.6547,142.6284,211.6547,146.6284,220.6547" style="stroke:#475569;stroke-width:1;"/><path d="M146.6284,178.24 C146.6284,179.0537 146.6284,179.8727 146.6284,180.6966 C146.6284,183.9919 146.6284,187.3645 146.6284,190.7884 C146.6284,197.6364 146.6284,204.6902 146.6284,211.7436 C146.6284,213.5069 146.6284,215.2702 146.6284,217.0303 C146.6284,217.9103 146.6284,218.7895 146.6284,219.6675 C146.6284,219.887 146.6284,220.1064 146.6284,220.3258 C146.6284,220.4354 146.6284,214.5451 146.6284,214.6547" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.7871" x="152.6284" y="204.9541">authenticated and authorised</text></g><g class="link" data-entity-1="l2" data-entity-2="l3" data-uid="lnk11" id="link_l2_l3"><polygon fill="#475569" points="146.6284,387.4113,150.6284,378.4113,146.6284,382.4113,142.6284,378.4113,146.6284,387.4113" style="stroke:#475569;stroke-width:1;"/><path d="M146.6284,344.846 C146.6284,345.2354 146.6284,345.6259 146.6284,346.0176 C146.6284,349.151 146.6284,352.3561 146.6284,355.6093 C146.6284,362.1157 146.6284,368.8142 146.6284,375.5145 C146.6284,378.8646 146.6284,382.2151 146.6284,385.5423 C146.6284,385.9582 146.6284,386.3738 146.6284,386.7889 C146.6284,386.9965 146.6284,381.2039 146.6284,381.4113" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="147.4219" x="152.6284" y="371.9541">admitted, stored, scheduled</text></g><g class="link" data-entity-1="l3" data-entity-2="l4" data-uid="lnk12" id="link_l3_l4"><polygon fill="#475569" points="146.6284,542.4773,150.6284,533.4773,146.6284,537.4773,142.6284,533.4773,146.6284,542.4773" style="stroke:#475569;stroke-width:1;"/><path d="M146.6284,500.0988 C146.6284,500.8519 146.6284,501.6105 146.6284,502.3744 C146.6284,503.9022 146.6284,505.4509 146.6284,507.0176 C146.6284,510.151 146.6284,513.3561 146.6284,516.6093 C146.6284,523.1157 146.6284,529.8142 146.6284,536.5145 C146.6284,538.1895 146.6284,539.8647 146.6284,541.537 C146.6284,541.746 146.6284,541.955 146.6284,542.164 C146.6284,542.2684 146.6284,536.3729 146.6284,536.4773" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.0898" x="152.6284" y="526.9541">running, and now talking</text></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1034.2568" x="5" y="686.8301">The question to ask of every layer: if this were misconfigured, what bad thing could happen? Each layer assumes the one above it might fail &#8212; that is defence in depth.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="680.9277" x="181.6646" y="702.9287">Layers 1 and 2 decide what gets INTO the cluster; layers 3 and 4 limit the damage once something is running.</text></g><!--SRC=[XLRTJXj75BxtKvpc1f2C7GEz8SYHaveAbG82rAg8czdPizwfTsUsCxCuRbMfLts0gk_I-pvAdgJVcLs3GuWgHMApFdj-lkyxFryPgwisPngDnjs_w5mLnhbH2w_gC5vgg_PZoJMFchQk1j74