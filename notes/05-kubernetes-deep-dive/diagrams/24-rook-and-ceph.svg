<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="784px" preserveAspectRatio="none" style="width:1118px;height:784px;background:#FFFFFF;" version="1.1" viewBox="0 0 1118 784" width="1118px" zoomAndPan="magnify"><title>Rook and Ceph &#8212; the operator, and the thing it operates</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="484.0313" x="313.1987" y="30.8838">Rook and Ceph &#8212; the operator, and the thing it operates</text></g><!--cluster app--><g class="cluster" data-entity="app" data-source-line="4" data-uid="ent0002" id="cluster_app"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="626" x="233.7144" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="355.3418" x="369.0435" y="71.8921">WHAT THE APPLICATION SEES &#8212; nothing Ceph-specific</text></g><!--cluster csi--><g class="cluster" data-entity="csi" data-source-line="8" data-uid="ent0004" id="cluster_csi"><rect fill="#F8FAFC" height="122" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="568" x="233.7144" y="181.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="323.6035" x="355.9126" y="199.8921">CSI &#8212; the plug between Kubernetes and the storage</text></g><!--cluster rook--><g class="cluster" data-entity="rook" data-source-line="12" data-uid="ent0006" id="cluster_rook"><rect fill="#F0FDF4" height="205" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="666" x="233.7144" y="322.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="419.6626" x="356.8831" y="340.8921">ROOK &#8212; CNCF GRADUATED (Oct 2020) &#183; a Kubernetes OPERATOR</text></g><!--cluster ceph--><g class="cluster" data-entity="ceph" data-source-line="16" data-uid="ent0008" id="cluster_ceph"><rect fill="#F8FAFC" height="162" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="586" x="233.7144" y="570.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="430.4663" x="311.4812" y="588.8921">CEPH &#8212; the distributed storage platform ITSELF &#183; not a CNCF project</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="5" data-uid="ent0003" id="entity_a1"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="575.0996" x="276.2144" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="307.7534" x="290.2144" y="112.8921">Pod  &#8594;  PersistentVolumeClaim  &#8594;  StorageClass</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="191.3345" x="290.2144" y="125.9648">storageClassName: rook-ceph-block</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="547.0996" x="290.2144" y="138.6138">The same three objects as diagram 21. Swap local-path for this class and the Pod spec does not change.</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="9" data-uid="ent0005" id="entity_c1"><rect fill="#FFFFFF" height="80.8955" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="518.4131" x="275.7144" y="214.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="99.7153" x="289.7144" y="240.8921">ceph-csi drivers</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.2935" x="389.4297" y="240.8921">, deployed by Rook</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="301.3774" x="289.7144" y="253.9648">provisioner: rook-ceph.rbd.csi.ceph.com      &#8592; BLOCK  (RBD)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="445.0596" x="289.7144" y="266.6138">provisioner: rook-ceph.cephfs.csi.ceph.com   &#8592; FILE   (CephFS, supports ReadWriteMany)</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="490.4131" x="289.7144" y="279.2627">The Container Storage Interface from chapter 02-07: create, attach and mount, behind one standard.</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="13" data-uid="ent0007" id="entity_r1"><rect fill="#DCFCE7" height="163.6885" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="614.5298" x="276.2144" y="355.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="262.9072" x="290.2144" y="381.8921">Rook does not provide storage on its own.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="257.207" x="556.7334" y="381.8921">It deploys and manages a storage system</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="586.5298" x="290.2144" y="396.8408">inside the cluster, using the OPERATOR PATTERN and CUSTOM RESOURCES (chapter 05-01).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="290.2144" y="411.7896">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="513.208" x="290.2144" y="424.8623">'Turns distributed storage systems into self-managing, self-scaling, self-healing storage services.'</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="520.8672" x="290.2144" y="437.5112">Automates the storage administrator's job: deployment, bootstrapping, configuration, provisioning,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="460.8882" x="290.2144" y="450.1602">scaling, upgrading, migration, disaster recovery, monitoring and resource management.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="290.2144" y="464.6851">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="451.0806" x="290.2144" y="477.7578">You declare   kind: CephCluster &#183; CephBlockPool &#183; CephFilesystem &#183; CephObjectStore</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="511.6021" x="290.2144" y="490.4067">and the rook-ceph-operator reconciles a running Ceph to match &#8212; the same desired-state loop as</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="279.9629" x="290.2144" y="503.0557">a Deployment controller, applied to a storage system.</text></g><!--entity ce1--><g class="entity" data-entity="ce1" data-source-line="17" data-uid="ent0009" id="entity_ce1"><rect fill="#326CE5" height="121.1421" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="534.7251" x="276.2144" y="603.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="405.2153" x="290.2144" y="629.8921">One unified system providing OBJECT, BLOCK and FILE storage.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="506.7251" x="290.2144" y="642.9648">Widely used as a backend for cloud-native and virtualized workloads. Older than Kubernetes and</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="501.8105" x="290.2144" y="655.6138">notoriously demanding to run by hand &#8212; which is precisely the problem Rook exists to remove.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="290.2144" y="670.1387">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="341.0591" x="296.3267" y="683.2114">BLOCK  &#8212; RBD            &#8594; a disk for one Pod at a time (databases)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="338.6475" x="296.3267" y="695.8604">FILE   &#8212; CephFS         &#8594; a shared filesystem, many Pods at once</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="342.9014" x="296.3267" y="708.5093">OBJECT &#8212; RGW, S3-compatible &#8594; buckets, via CephObjectStore</text></g><g class="link" data-entity-1="app" data-entity-2="csi" data-uid="lnk10" id="link_app_csi"><polygon fill="#475569" points="249.7144,181.6373,253.7144,172.6373,249.7144,176.6373,245.7144,172.6373,249.7144,181.6373" style="stroke:#475569;stroke-width:1;"/><path d="M249.7144,163.1474 C249.7144,163.3024 249.7144,163.4577 249.7144,163.6132 C249.7144,163.9241 249.7144,164.2359 249.7144,164.5485 C249.7144,167.0492 249.7144,169.6008 249.7144,172.1865 C249.7144,174.7722 249.7144,177.3919 249.7144,180.0286 C249.7144,180.3582 249.7144,180.688 249.7144,181.0181 C249.7144,181.1831 249.7144,181.3482 249.7144,181.5134 C249.7144,181.5547 249.7144,175.596 249.7144,175.6373" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="csi" data-entity-2="rook" data-uid="lnk11" id="link_csi_rook"><polygon fill="#475569" points="249.7144,322.6675,253.7144,313.6675,249.7144,317.6675,245.7144,313.6675,249.7144,322.6675" style="stroke:#475569;stroke-width:1;"/><path d="M249.7144,304.1795 C249.7144,304.3995 249.7144,304.6199 249.7144,304.8407 C249.7144,305.2824 249.7144,305.7258 249.7144,306.1708 C249.7144,307.951 249.7144,309.7574 249.7144,311.5864 C249.7144,313.4154 249.7144,315.2669 249.7144,317.1374 C249.7144,318.0726 249.7144,319.0125 249.7144,319.9566 C249.7144,320.4287 249.7144,320.9019 249.7144,321.376 C249.7144,321.6131 249.7144,321.8504 249.7144,322.088 C249.7144,322.2067 249.7144,322.3256 249.7144,322.4445 C249.7144,322.5039 249.7144,322.5634 249.7144,322.6229 C249.7144,322.6378 249.7144,316.6526 249.7144,316.6675" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="rook" data-entity-2="ceph" data-uid="lnk12" id="link_rook_ceph"><polygon fill="#475569" points="249.7144,570.4741,253.7144,561.4741,249.7144,565.4741,245.7144,561.4741,249.7144,570.4741" style="stroke:#475569;stroke-width:1;"/><path d="M249.7144,527.974 C249.7144,530.4865 249.7144,533.0151 249.7144,535.5545 C249.7144,540.6331 249.7144,545.7546 249.7144,550.8763 C249.7144,555.998 249.7144,561.1199 249.7144,566.1993 C249.7144,567.4692 249.7144,568.7364 249.7144,570.0003 C249.7144,570.1583 249.7144,564.3162 249.7144,564.4741" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.7461" x="255.7144" y="554.9541">installs, configures, manages</text></g><g class="caption" data-source-line="24"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1100.4287" x="5" y="752.8301">The relationship in one line: Rook is designed to ease the orchestration of Ceph in Kubernetes. Ceph stores the data; Rook makes Ceph behave like a Kubernetes-native service.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="588.082" x="261.1733" y="768.9287">The distractor to avoid: "Rook is a storage system". It is an orchestrator &#8212; the storage is Ceph.</text></g><!--SRC=[TLRBRjj65DthAswzYGr8zACe2hY205cM4pUE9KXAZGBPZCYHD14vGymCvIf5WQwoBeh-I_Vzb7n9pnrID2CfWc6GyxYFSyyzbzyf7QT58YcApii_RqpgpXCbbbPaxdmTQz7nAvd9A2-ojEMLJoLDZ5cJq0aDPBwYBt_-GpX29fTMU6FROOjN_4hf9IbVRKdNQbaPUw6NC7BozAO_ezcR8VN7uuVxGNzsFtgawN0u3HQrAM-pYuxBPQmMAZwXRdTfJP7tUYGSYJodtrj43QDZan1z-VmtqLXQfvoNslzYqYAJWrIehDgR8aonv2NdFkYkKv_azULbppMM7qKchyaYqqxC8SnJ4w-xvtoqrxWoGveEHv6hbS1W_X6nE0wkmf2kBYEQFekSO42adLpu5IsCPN0SnUognek3vrGfCT8n0XIla9UCAh-SleXZf5JbVzdwuoj81zFxkXnvMYnfBlspb9hU5dDfjKG9QcTLidkGnaxjGzgTzm82l9LOjG6ktVDvhqs9p5EpbGdDju4I3LXoQpRAAQEbRO0OsNaImKmKNcA3Sl3lo-U_wEPXD7XBT3gvkJqxHFaRvlZVmkrRP7Dtzmz3F9uoU-wcRN95dXkBmaoaI9wiylATqDkpu_KS6Es5WgyTJ-XUUsaN8fQqiF21gkHOe8khpiMFrnHR2NA3zjwBU1K0paoXVHlmWyC98Mx0ZNLXasOjSr1ILxZlbt8o6hqDjHmy3kxezQH_-xu_6zxIwIZsT7LnTN56__rBebdPqNWuwSz6axgahur9IlECsP6wXaQkoHPGJcfc86pqhYFph2CkEDtxgkGbYJAXSGhFzGMtHRzb7xJIZkqmoo0lM8Cc58wxcPTsOTAuFviD9u-bahoVpaRlQ3ASZjvF1j20qnha7peNbsVH1zseqgjPOJMtcFDMpGiF3duTWoEblI4dqqKdn0ddxVBLeGjVtbOolBrSbtQZOkcYLuVSw1VUP2nZpVuXaMHASo2iVQySVJJpwmgdJ0OI6EDvEy-3szZeXLeME0u-jwccDcyU-goZBNAeIH8UCxNStGO2Wl7bkXfqvXQxC8L8E2a6rafd2WlcbkNYaABQJSFHhwP0rD0ZAz4uQz3sEcZle2mWaurVRrW