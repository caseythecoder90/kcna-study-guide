<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="525px" preserveAspectRatio="none" style="width:1297px;height:525px;background:#FFFFFF;" version="1.1" viewBox="0 0 1297 525" width="1297px" zoomAndPan="magnify"><title>The 4C's of cloud native security &#8212; each layer builds on the one outside it</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="635.4141" x="326.9043" y="30.8838">The 4C's of cloud native security &#8212; each layer builds on the one outside it</text></g><!--cluster cloud--><g class="cluster" data-entity="cloud" data-source-line="4" data-uid="ent0002" id="cluster_cloud"><rect fill="#F8FAFC" height="420" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="752" x="280.1113" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="400.937" x="455.6428" y="71.8921">CLOUD  &#8212; or the co-located servers, or the corporate datacenter</text></g><!--cluster cluster--><g class="cluster" data-entity="cluster" data-source-line="6" data-uid="ent0004" id="cluster_cluster"><rect fill="#F8FAFC" height="313" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="736" x="288.1113" y="152.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="424.7153" x="443.7537" y="170.8921">CLUSTER &#8212; the Kubernetes components and the workloads in them</text></g><!--cluster container--><g class="cluster" data-entity="container" data-source-line="8" data-uid="ent0006" id="cluster_container"><rect fill="#F8FAFC" height="206" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="720" x="296.1113" y="251.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="257.8481" x="527.1873" y="269.8921">CONTAINER &#8212; the image and how it runs</text></g><!--cluster code--><g class="cluster" data-entity="code" data-source-line="10" data-uid="ent0008" id="cluster_code"><rect fill="#F0FDF4" height="99" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="704" x="304.1113" y="350.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="183.4663" x="564.3782" y="368.8921">CODE &#8212; the application itself</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="5" data-uid="ent0003" id="entity_c1"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="720.0913" x="288.1113" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="692.0913" x="302.1113" y="112.8921">The TRUSTED COMPUTING BASE of the cluster. Provider IAM, network firewalls, encrypted disks, restricting access to</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.4268" x="302.1113" y="127.8408">the control-plane endpoint and to etcd, node security.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="303.9019" x="615.7617" y="128.2646">If this layer is vulnerable, nothing built on it is guaranteed safe.</text></g><!--entity k1--><g class="entity" data-entity="k1" data-source-line="7" data-uid="ent0005" id="entity_k1"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="676.8828" x="334.6113" y="185.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="638.6948" x="348.6113" y="211.8921">RBAC and API access (layer 1) &#183; admission and Pod Security (layer 2) &#183; NetworkPolicies, Secrets encryption at</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="648.8828" x="348.6113" y="226.8408">rest, TLS for Ingress/Gateway (layer 4). Kubescape checks this layer against the NSA/CISA hardening guidance.</text></g><!--entity ct1--><g class="entity" data-entity="ct1" data-source-line="9" data-uid="ent0007" id="entity_ct1"><rect fill="#FFFFFF" height="57.8975" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="629.8848" x="358.1113" y="284.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="601.8848" x="372.1113" y="310.8921">Scan images for vulnerabilities &#183; sign images and verify signatures &#183; minimal base images &#183; do not run as</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="601.1167" x="372.1113" y="325.8408">root &#183; runtime fences (securityContext, seccomp, AppArmor, sandboxed runtimes &#8212; layer 3) &#183; an SBOM.</text></g><!--entity cd1--><g class="entity" data-entity="cd1" data-source-line="11" data-uid="ent0009" id="entity_cd1"><rect fill="#DCFCE7" height="57.8975" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="654.3613" x="346.1113" y="383.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="626.3613" x="360.1113" y="409.8921">The layer you control most directly. TLS for everything the app serves, least-privilege access to other</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="445.0596" x="360.1113" y="424.8408">systems, dependency scanning, static analysis, careful secret handling.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="114.0444" x="812.3945" y="425.2646">'Code is the treasure.'</text></g><g class="caption" data-source-line="20"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1279.2227" x="5" y="493.8301">Read from the outside in. "You cannot safeguard against poor security standards in the base layers by addressing security at the Code level" &#8212; perfect application code still loses if the cloud account is open.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="852.0586" x="218.582" y="509.9287">A defence-in-depth model: the 4Cs say WHERE controls sit; the four Kubernetes layers in diagram 40 say how the CLUSTER ring is built.</text></g><!--SRC=[RPNHJYCt58RlynIdtB0haQHfkTgYI650D2e4H8AgglJ2iKyIAnvxP7jWizLAVOY-I-_xA7sI_lRCX00hWP9upjZdVFz_Zh_JLffQCGq6m-OlEcV2K6cnzg8CmwsqeXytNFAWgalJYpeQfiM6wRGu3kHM98sh5LaHzHDJO5bx7NVqtrz_4mkv8IDsx6bPQwCGRWbxuGF_TGmQ1-lOwtcMKTWrDZughcyVBYY_xdmEbgvld1IH5NRtJ-p3oSiZNpcFHwH4599jP7z4PsThx-fgF2OHskp-x14T79BINzm_p1UN5rJStjmzBAQpApgVp2zJGNbdKmTiDg0xxvwGfgVfvEQ4BCTdvxUqqfwVXJ58XQtqkofbftJOOi5pY5xBgEsQX9GS0aNtQ9jyRVJEz2iZG82jgfosaOHL226EKk48frum3eZEWlx2dqQZyJHbfaCB55-UQcFPYwNXz1QUuS34EIRCEgQGTIsy09N4JgnuS3PCkuqJ8-IWRSjez1fFSPtGt6SHKjg_r4lsA9qHwieAwjaOcgpnD04nJa1TdTKjtocGKMODNXrpVpufyYwJksb7waDJtUWZ_ViF2LNg43IgIL5tJj6yirSRzqEEcpMgt3cZfMP8W33FIB7L9kyG7srIveGMrtDQmK1JkyP265x1FyzYl-Nfnq4kE4XHGR4Dosqu12_Mu1PYBdqsdmoBwNn26-4LsoJ0kjPAMCc3DuotexVb5xUpnMGwE-2iIx7cNEl6FIS5VMt3Mvgm43RTytorvLmAs-mISecTGxJH4M0Igw3N-v1q4lf9htPvMSJQDq6bjWWnj1I1ks0iAvTybh929i3fy0FB-1rroRG2RWH-wCnR85N-3E9OIBuveKbLJNpfF9Pmzj9zXY_RjqEcq23-iL7VqlpyzkOjI1b7xmilRYykznX5LS488ikkOs2psZEySavr7D5c7S9tmw79O-VghcMfTD1SwHHdq9QTYHZyTathjKStGmecD2n2x5TUFsd3ITTk5X1wbVsZ3JlqHOb8nHLc0UX11oYOV0H24HL8K11c5pIYfF2ygasY2NF3SbOPH1wEYECYLQL3pYLw90151yS7NR