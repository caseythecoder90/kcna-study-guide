<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="802px" preserveAspectRatio="none" style="width:1229px;height:802px;background:#FFFFFF;" version="1.1" viewBox="0 0 1229 802" width="1229px" zoomAndPan="magnify"><title>One request, end to end &#8212; and which object does what along the way</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="597.0762" x="311.9995" y="30.8838">One request, end to end &#8212; and which object does what along the way</text></g><!--cluster c--><g class="cluster" data-entity="c" data-source-line="4" data-uid="ent0002" id="cluster_c"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="588" x="278.0376" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.46" x="532.3076" y="71.8921">1 &#183; The client</text></g><!--cluster svc--><g class="cluster" data-entity="svc" data-source-line="8" data-uid="ent0004" id="cluster_svc"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="688" x="278.0376" y="181.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="366.4375" x="438.8188" y="199.8921">2 &#183; The controller's own Service &#8212; the ONLY thing exposed</text></g><!--cluster ctl--><g class="cluster" data-entity="ctl" data-source-line="12" data-uid="ent0006" id="cluster_ctl"><rect fill="#F0FDF4" height="135" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="566" x="278.0376" y="309.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="431.9834" x="345.0459" y="327.8921">3 &#183; The INGRESS CONTROLLER &#8212; a real Pod running a reverse proxy</text></g><!--cluster cfg--><g class="cluster" data-entity="cfg" data-source-line="16" data-uid="ent0008" id="cluster_cfg"><rect fill="#F8FAFC" height="135" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="646" x="278.0376" y="487.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="467.3525" x="367.3613" y="505.8921">4 &#183; The configuration it read &#8212; three API objects, none of which carry traffic</text></g><!--cluster be--><g class="cluster" data-entity="be" data-source-line="24" data-uid="ent0014" id="cluster_be"><rect fill="#F8FAFC" height="109" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="626" x="278.0376" y="641.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="275.9644" x="453.0554" y="659.8921">5 &#183; An ordinary ClusterIP Service, then a Pod</text></g><!--entity c1--><g class="entity" data-entity="c1" data-source-line="5" data-uid="ent0003" id="entity_c1"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="537.9209" x="320.0376" y="86.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6416" x="334.0376" y="112.8921">curl http://myingress-app.local/api</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="499.7534" x="334.0376" y="125.9648">DNS (or /etc/hosts, or curl --resolve) turns myingress-app.local into the controller's address: 172.18.0.4</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="509.9209" x="334.0376" y="138.6138">The request carries   Host: myingress-app.local   and the path   /api   &#8212; the two things Ingress routes on.</text></g><!--entity s1--><g class="entity" data-entity="s1" data-source-line="9" data-uid="ent0005" id="entity_s1"><rect fill="#326CE5" height="68.2466" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="638.4795" x="320.0376" y="214.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="610.4795" x="334.0376" y="240.8921">Service  nginx-ingress-controller   type: LoadBalancer   EXTERNAL-IP 172.18.0.4   80/TCP, 443/TCP</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="415.0459" x="334.0376" y="253.9648">One LoadBalancer for the whole cluster, instead of one per application Service.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="276.9067" x="334.0376" y="266.6138">That consolidation is the main reason Ingress exists.</text></g><!--entity k1--><g class="entity" data-entity="k1" data-source-line="13" data-uid="ent0007" id="entity_k1"><rect fill="#DCFCE7" height="93.5444" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="515.7329" x="320.0376" y="342.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="175.5317" x="334.0376" y="368.8921">F5 NGINX Ingress Controller</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="261.5044" x="520.4048" y="368.8921">(Deployment in namespace nginx-ingress)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="485.9604" x="334.0376" y="381.9648">It WATCHES the API for Ingress objects whose ingressClassName points at its IngressClass,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="305.583" x="334.0376" y="394.6138">and turns them into NGINX configuration. Here it matches:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="389.0767" x="346.2622" y="407.2627">host  myingress-app.local   +   path  /api  (Prefix)   &#8594;   Service nginx-api:80</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="487.7329" x="334.0376" y="419.9116">If TLS is configured, THIS is where it ends: the controller decrypts, then forwards plain HTTP.</text></g><!--entity ic--><g class="entity" data-entity="ic" data-source-line="17" data-uid="ent0009" id="entity_ic"><rect fill="#FFFFFF" height="93.5444" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="169.813" x="320.0376" y="520.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="80.9326" x="334.0376" y="546.8921">IngressClass</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="31.0781" x="422.1938" y="546.8921">nginx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="74.5884" x="334.0376" y="559.9648">spec.controller:</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="132.6714" x="340.1499" y="572.6138">nginx.org/ingress-controller</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="141.813" x="334.0376" y="585.2627">Says WHICH controller owns</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="108.2114" x="334.0376" y="597.9116">Ingresses of this class</text></g><!--entity ig--><g class="entity" data-entity="ig" data-source-line="18" data-uid="ent0010" id="entity_ig"><rect fill="#FFFFFF" height="93.5444" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="191.8667" x="508.0376" y="520.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.2427" x="522.0376" y="546.8921">Ingress</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2554" x="575.5039" y="546.8921">myingress-app</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.7168" x="522.0376" y="559.9648">ingressClassName: nginx</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="158.9683" x="522.0376" y="572.6138">rules: host &#8594; paths &#8594; backends</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="115.2368" x="522.0376" y="585.2627">tls: hosts + secretName</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="163.8667" x="522.0376" y="597.9116">The routing TABLE, nothing more</text></g><!--entity sec--><g class="entity" data-entity="sec" data-source-line="19" data-uid="ent0011" id="entity_sec"><rect fill="#FFFFFF" height="93.5444" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="197.8188" x="718.0376" y="520.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.749" x="732.0376" y="546.8921">Secret</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.8462" x="779.0103" y="546.8921">type kubernetes.io/tls</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="111.8638" x="732.0376" y="559.9648">tls.crt  &#8212; the certificate</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="122.8799" x="732.0376" y="572.6138">tls.key  &#8212; the private key</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="119.8452" x="732.0376" y="585.2627">Read by the controller to</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="84.9653" x="732.0376" y="597.9116">terminate HTTPS</text></g><!--entity b1--><g class="entity" data-entity="b1" data-source-line="25" data-uid="ent0015" id="entity_b1"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="576.4585" x="320.0376" y="674.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="351.9014" x="334.0376" y="700.8921">Service nginx-api (ClusterIP)  &#8594;  Pod nginx-api  10.42.0.4:80</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="548.4585" x="334.0376" y="713.9648">The backend Services stay internal &#8212; no NodePort, no LoadBalancer. The response comes back the same way.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="545.4185" x="334.0376" y="726.6138">The nginx-debug image echoes Hostname: nginx-api and URL: /api, which is how the lecture proves the routing.</text></g><g class="link" data-entity-1="c" data-entity-2="svc" data-uid="lnk16" id="link_c_svc"><polygon fill="#475569" points="294.0376,181.6559,298.0376,172.6559,294.0376,176.6559,290.0376,172.6559,294.0376,181.6559" style="stroke:#475569;stroke-width:1;"/><path d="M294.0376,163.0577 C294.0376,163.2046 294.0376,163.3517 294.0376,163.499 C294.0376,163.7936 294.0376,164.0889 294.0376,164.3848 C294.0376,164.9768 294.0376,165.5714 294.0376,166.1684 C294.0376,167.3625 294.0376,168.5663 294.0376,169.7779 C294.0376,172.2011 294.0376,174.6556 294.0376,177.1259 C294.0376,178.361 294.0376,179.6001 294.0376,180.8412 C294.0376,180.9963 294.0376,181.1515 294.0376,181.3067 C294.0376,181.3843 294.0376,181.4619 294.0376,181.5395 C294.0376,181.5783 294.0376,175.6171 294.0376,175.6559" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="svc" data-entity-2="ctl" data-uid="lnk17" id="link_svc_ctl"><polygon fill="#475569" points="294.0376,309.6922,298.0376,300.6922,294.0376,304.6922,290.0376,300.6922,294.0376,309.6922" style="stroke:#475569;stroke-width:1;"/><path d="M294.0376,291.0087 C294.0376,291.1716 294.0376,291.3348 294.0376,291.4983 C294.0376,291.8252 294.0376,292.1531 294.0376,292.4819 C294.0376,293.1396 294.0376,293.801 294.0376,294.4659 C294.0376,297.1255 294.0376,299.8407 294.0376,302.5928 C294.0376,303.9688 294.0376,305.3541 294.0376,306.7462 C294.0376,307.4423 294.0376,308.1401 294.0376,308.8394 C294.0376,309.0142 294.0376,309.1891 294.0376,309.364 C294.0376,309.4515 294.0376,309.539 294.0376,309.6266 C294.0376,309.6485 294.0376,303.6703 294.0376,303.6922" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ctl" data-entity-2="cfg" data-uid="lnk18" id="link_ctl_cfg"><polygon fill="#475569" points="294.0376,487.6519,298.0376,478.6519,294.0376,482.6519,290.0376,478.6519,294.0376,487.6519" style="stroke:#475569;stroke-width:1;"/><path d="M294.0376,445.0626 C294.0376,448.627 294.0376,452.2781 294.0376,455.987 C294.0376,463.4047 294.0376,471.0535 294.0376,478.7023 C294.0376,480.6145 294.0376,482.5267 294.0376,484.4352 C294.0376,485.3895 294.0376,486.3429 294.0376,487.2949 C294.0376,487.4139 294.0376,481.5329 294.0376,481.6519" fill="none" style="stroke:#475569;stroke-width:1.6;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="30.0176" x="300.0376" y="471.9541">reads</text></g><g class="link" data-entity-1="cfg" data-entity-2="be" data-uid="lnk19" id="link_cfg_be"><polygon fill="#475569" points="294.0376,641.5756,298.0376,632.5756,294.0376,636.5756,290.0376,632.5756,294.0376,641.5756" style="stroke:#475569;stroke-width:1;"/><path d="M294.0376,623.1446 C294.0376,623.3174 294.0376,623.4904 294.0376,623.6635 C294.0376,624.3558 294.0376,625.0502 294.0376,625.7462 C294.0376,627.1384 294.0376,628.5374 294.0376,629.941 C294.0376,632.7482 294.0376,635.5737 294.0376,638.3987 C294.0376,639.1049 294.0376,639.8111 294.0376,640.517 C294.0376,640.87 294.0376,635.2229 294.0376,635.5756" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="33"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1211.0752" x="5" y="770.8301">Create an Ingress with no controller installed and nothing happens &#8212; the object is stored and ignored. "By default the Ingress API exists, but clusters typically don't ship with an enabled controller."</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="708.9209" x="256.0771" y="786.9287">The Ingress is configuration; the controller is the proxy. Every Ingress question is easier once those are kept apart.</text></g><!--SRC=[TLVRRjj647tNLqpz4XkLo2Xnq40L13YA6WaGPC5IaHHj7rRaYjoQscLsbvBPea6V-W55_wNl_PH-IMTsIOcw6B3Ds-xEp3apPyPV2HbbHSmX24B_OvNAJ1WBbcYsCU5Z95d7fdp3WxpOP2qhRCRXNdBG_7F1ZMq3bp5OvIx__V4tCBpkKX6be5Q_yCX2hBZ1Dym2ovHC04-37IjRBOrVcKpmlAik_FiFBF53b0akxHNq-ubMHJuO03CGmMyjWCRogD0PfDRclJ3Sb48ccXlJONaUP2fYMSXoyPFi6_4hxtMxW_Up1Lmh3I6tKPWgOqqRyD4TygNpfOERLRRbDs0BBGrSE124n0Z9yKX9grMMSVt208jZMjU3xZUlWkxRu6Lmsm_9wg1XdQAgi8A8QIqG3O0nkj6xQ0eSWcGhPpR5Hue6BuGjlRKxyWJt6PZupO18MJnLoQ0oJ_Zb6HEomg_R-lq8xbTxk9lXg9s41TTR4V6zjVlPz0Tl3lXJhWoFJxWnspDswZD09a8-TUeG3xOm6blcl0TJnU9tB6CoSYz7dvQZXzdTj3EPDo353szVXilXl0stjw_ffe4kPUBHAMjarcLOgZ9Afy9Ohjj885vP36gDC26qk18XpqJ4h53xi8DBz67YekkO8YBsYuLn5ZQ8BuRD3BwgcU1F0jEhIGEB8ape2gjJ7bxNF4nc7nv6YmKCxsVBX_lfTFJWQudEps2kOj25bCG2lTfoRJ06hPxAFHiVb8ehjcrsoaX_DVZk3Sm-J6QVzguEztJqmzK0GRv-p_DCbHjq5-42oJRSv0nvFABnfe7DnCB7k-LmF5euGExc4mT_RS7NFzK-vWrK-uSPCsQ6PqEkiAgmYD2QtUUo-zm-fy7LX2jF4YDVZpuUv6Ojaa8xRW8OSussBB9ZevIRtlbH62gG2i0pvVSr_lhIyvLtFTTyBPvkg0R__0l_rldjSS4rlRSlpyrCrh2SBYXPQWzvt8RbUEBUxTBAJvHD591ZQO6OHxhCIQVmWoHGTqp71bnDmtYvd3TJBDbJ_tYQOBUDGZ-WH7OrLOElSiqzTnLVRP1K8bWfNiP9j4gmcgtN8ZfLvdLo8TUQNFhaSb0rm34vZu93m1TPSdi2fPFmN47ErozOQU3ZU38SDu54IJCNgF7daMIkITmm3k_g9V4KqNFn-T2EagXXv3JVUpwWSszqaM6U-fIa1AFSC-vknQ97oe_pFJQhTXXCLuFPmYtPUARxO7iWwLZUlPkEY5slvnkb-JCX9sSXBvmD7p5fDpmMAwubnxuJ21MYFyVU1P6sXvw5mcp5ciIMNumbUEJbONMknHPN0huyN_r0URigJol6gWi7SxqHaawYYbbSZXN1ms1519qVKn77NFwiHPBQpi2Z89Bp3xJbkCpUK9dTIPmgOZI8rJBqVGVxM2KMLIKpqlAJ6bhnvnheNc3WUd_WJQL2r1CEtw6BZV8LTKlKeXFwgoogFS6GBIj9GP4_53n2NQAOgfZFbRQK7qSTDG0_mPWSco1XZct1dUaeCAJaECq5brFFUnZpLP60sB240uzIcWTf_f67gd11aCP__p3jETrjL-g3nPcgdREL8KAeejJujjptu2grdvbxLauEaTeOTO28sqOjcbVgP-oKBUgM-sTKivvJHjEY-_hzYkCfB7VIsHU38Qx0f6A7jhyJs2uGjqP2qi31y2vsOTKrbw96S6nYTQfN8x8WKh0S_MAHIBeFuEfTYQrWpOhCkjMrEH9hFscqOLNOUienL9bOP5c6svHyOS6a8lVEeRDSiXNvSt0okEg7WYWJZgpw-4RBSktYszDYgmOWDu04CC9nfDnlTeDkDINXR2H8X36DS0CD0KnJMUVuhq3Ej0t8_Fy0]--></g></svg>