<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="880px" preserveAspectRatio="none" style="width:1076px;height:880px;background:#FFFFFF;" version="1.1" viewBox="0 0 1076 880" width="1076px" zoomAndPan="magnify"><title>mTLS with kubectl: each side runs TWO checks on the other</title><defs/><g><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="518.0889" x="280.8965" y="35.8838">mTLS with kubectl: each side runs TWO checks on the other</text><rect fill="none" height="221.7417" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="624.7866" x="148" y="248.3413"/><rect fill="none" height="221.7417" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="922.8818" x="148" y="484.083"/><g class="participant-lifeline" data-entity-uid="part1" data-qualified-name="c" id="part1-lifeline"><g><title>kubectl</title><rect fill="#000000" fill-opacity="0.00000" height="695.4775" width="8" x="251.958" y="117.9448"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="255" x2="255" y1="117.9448" y2="813.4224"/></g></g><g class="participant-lifeline" data-entity-uid="part2" data-qualified-name="s" id="part2-lifeline"><g><title>kube-apiserver</title><rect fill="#000000" fill-opacity="0.00000" height="695.4775" width="8" x="651.0479" y="117.9448"/><line style="stroke:#94A3B8;stroke-width:0.5;stroke-dasharray:5,5;" x1="654.3091" x2="654.3091" y1="117.9448" y2="813.4224"/></g></g><g class="participant participant-head" data-entity-uid="part1" data-qualified-name="c" id="part1-head"><rect fill="#EFF6FF" height="62.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:0.5;" width="195.916" x="158" y="54.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1899" x="235.363" y="77.8921">kubectl</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.1553" x="186.8804" y="90.9648">holds: ca.crt (CA public cert)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="173.916" x="169" y="103.6138">client cert + CLIENT PRIVATE KEY</text></g><g class="participant participant-tail" data-entity-uid="part1" data-qualified-name="c" id="part1-tail"><rect fill="#EFF6FF" height="62.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:0.5;" width="195.916" x="158" y="812.4224"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="41.1899" x="235.363" y="835.6162">kubectl</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="138.1553" x="186.8804" y="848.689">holds: ca.crt (CA public cert)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="173.916" x="169" y="861.3379">client cert + CLIENT PRIVATE KEY</text></g><g class="participant participant-head" data-entity-uid="part2" data-qualified-name="s" id="part2-head"><rect fill="#EFF6FF" height="62.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:0.5;" width="215.4775" x="547.3091" y="54.6982"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9854" x="612.0552" y="77.8921">kube-apiserver</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="135.6953" x="587.2002" y="90.9648">holds: ca.crt (--client-ca-file)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="193.4775" x="558.3091" y="103.6138">apiserver.crt + SERVER PRIVATE KEY</text></g><g class="participant participant-tail" data-entity-uid="part2" data-qualified-name="s" id="part2-tail"><rect fill="#EFF6FF" height="62.2466" rx="5" ry="5" style="stroke:#326CE5;stroke-width:0.5;" width="215.4775" x="547.3091" y="812.4224"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9854" x="612.0552" y="835.6162">kube-apiserver</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="135.6953" x="587.2002" y="848.689">holds: ca.crt (--client-ca-file)</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="193.4775" x="558.3091" y="861.3379">apiserver.crt + SERVER PRIVATE KEY</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#475569" points="643.0479,151.7437,653.0479,155.7437,643.0479,159.7437,647.0479,155.7437" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="255.958" x2="649.0479" y1="155.7437" y2="155.7437"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.75" x="266.958" y="147.2007">hello + fresh random value</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg2"><polygon fill="#475569" points="266.958,187.5425,256.958,191.5425,266.958,195.5425,262.958,191.5425" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="260.958" x2="654.0479" y1="191.5425" y2="191.5425"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.75" x="276.958" y="182.9995">hello + fresh random value</text></g><path d="M155,209.5425 L155,230.5425 A5,5 0 0 0 160,235.5425 L749,235.5425 A5,5 0 0 0 754,230.5425 L754,214.5425 L744,204.5425 L160,204.5425 A5,5 0 0 0 155,209.5425" fill="#FEFCE8" style="stroke:#CA8A04;stroke-width:1;"/><path d="M744,204.5425 L744,212.0425 A2.5,2.5 0 0 0 746.5,214.5425 L754,214.5425 L744,204.5425" fill="#FEFCE8" style="stroke:#CA8A04;stroke-width:1;"/><text fill="#422006" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="487.582" x="206.6023" y="224.7983">Both random values go into the handshake transcript, so it is different every time (no replay)</text><path d="M153,248.3413 L346.958,248.3413 L346.958,263.29 L336.958,273.29 L148,273.29 L148,253.3413 A5,5 0 0 1 153,248.3413" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:1.5;"/><rect fill="none" height="221.7417" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="624.7866" x="148" y="248.3413"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.958" x="167" y="265.5352">The server proves itself</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg3"><polygon fill="#475569" points="266.958,297.0889,256.958,301.0889,266.958,305.0889,262.958,301.0889" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="260.958" x2="654.0479" y1="301.0889" y2="301.0889"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.0293" x="276.958" y="292.5459">its certificate (apiserver.crt)</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg4"><polygon fill="#475569" points="266.958,332.8877,256.958,336.8877,266.958,340.8877,262.958,336.8877" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="260.958" x2="654.0479" y1="336.8877" y2="336.8877"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="367.0898" x="276.958" y="328.3447">a SIGNATURE over the transcript, made with the server's private key</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg5"><line style="stroke:#475569;stroke-width:1.6;" x1="255.958" x2="297.958" y1="386.4854" y2="386.4854"/><line style="stroke:#475569;stroke-width:1.6;" x1="297.958" x2="297.958" y1="386.4854" y2="399.4854"/><line style="stroke:#475569;stroke-width:1.6;" x1="256.958" x2="297.958" y1="399.4854" y2="399.4854"/><polygon fill="#475569" points="266.958,395.4854,256.958,399.4854,266.958,403.4854,262.958,399.4854" style="stroke:#475569;stroke-width:1;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.7617" x="266.958" y="364.1436">CHECK 1 - is the certificate genuine?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.041" x="266.958" y="377.9424">verify the CA's signature on it with ca.crt</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg6"><line style="stroke:#475569;stroke-width:1.6;" x1="255.958" x2="297.958" y1="449.083" y2="449.083"/><line style="stroke:#475569;stroke-width:1.6;" x1="297.958" x2="297.958" y1="449.083" y2="462.083"/><line style="stroke:#475569;stroke-width:1.6;" x1="256.958" x2="297.958" y1="462.083" y2="462.083"/><polygon fill="#475569" points="266.958,458.083,256.958,462.083,266.958,466.083,262.958,462.083" style="stroke:#475569;stroke-width:1;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.4102" x="266.958" y="426.7412">CHECK 2 - is the sender its owner?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="376.8223" x="266.958" y="440.54">verify the transcript signature with the PUBLIC KEY inside apiserver.crt</text></g><path d="M153,484.083 L463.958,484.083 L463.958,499.0317 L453.958,509.0317 L148,509.0317 L148,489.083 A5,5 0 0 1 153,484.083" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:1.5;"/><rect fill="none" height="221.7417" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.5;" width="922.8818" x="148" y="484.083"/><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="262.958" x="167" y="501.2769">You prove yourself (the "mutual" in mTLS)</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg7"><polygon fill="#475569" points="643.0479,532.8306,653.0479,536.8306,643.0479,540.8306,647.0479,536.8306" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="255.958" x2="649.0479" y1="536.8306" y2="536.8306"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.0684" x="266.958" y="528.2876">your certificate (client-certificate-data)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg8"><polygon fill="#475569" points="643.0479,568.6294,653.0479,572.6294,643.0479,576.6294,647.0479,572.6294" style="stroke:#475569;stroke-width:1;"/><line style="stroke:#475569;stroke-width:1.6;" x1="255.958" x2="649.0479" y1="572.6294" y2="572.6294"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="322.1191" x="266.958" y="564.0864">a SIGNATURE over the transcript, made with client-key-data</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg9"><line style="stroke:#475569;stroke-width:1.6;" x1="655.0479" x2="697.0479" y1="622.2271" y2="622.2271"/><line style="stroke:#475569;stroke-width:1.6;" x1="697.0479" x2="697.0479" y1="622.2271" y2="635.2271"/><line style="stroke:#475569;stroke-width:1.6;" x1="656.0479" x2="697.0479" y1="635.2271" y2="635.2271"/><polygon fill="#475569" points="666.0479,631.2271,656.0479,635.2271,666.0479,639.2271,662.0479,635.2271" style="stroke:#475569;stroke-width:1;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.7617" x="666.0479" y="599.8853">CHECK 1 - is the certificate genuine?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.041" x="666.0479" y="613.6841">verify the CA's signature on it with ca.crt</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg10"><line style="stroke:#475569;stroke-width:1.6;" x1="655.0479" x2="697.0479" y1="684.8247" y2="684.8247"/><line style="stroke:#475569;stroke-width:1.6;" x1="697.0479" x2="697.0479" y1="684.8247" y2="697.8247"/><line style="stroke:#475569;stroke-width:1.6;" x1="656.0479" x2="697.0479" y1="697.8247" y2="697.8247"/><polygon fill="#475569" points="666.0479,693.8247,656.0479,697.8247,666.0479,701.8247,662.0479,697.8247" style="stroke:#475569;stroke-width:1;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.4102" x="666.0479" y="662.4829">CHECK 2 - is the sender its owner?</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="388.834" x="666.0479" y="676.2817">verify the transcript signature with the PUBLIC KEY inside your certificate</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg11"><line style="stroke:#475569;stroke-width:1.6;" x1="655.0479" x2="697.0479" y1="740.6235" y2="740.6235"/><line style="stroke:#475569;stroke-width:1.6;" x1="697.0479" x2="697.0479" y1="740.6235" y2="753.6235"/><line style="stroke:#475569;stroke-width:1.6;" x1="656.0479" x2="697.0479" y1="753.6235" y2="753.6235"/><polygon fill="#475569" points="666.0479,749.6235,656.0479,753.6235,666.0479,757.6235,662.0479,753.6235" style="stroke:#475569;stroke-width:1;"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="251.4551" x="666.0479" y="732.0806">authenticated: CN = user, O = groups &#8594; RBAC</text></g><path d="M5,771.6235 L5,792.6235 A5,5 0 0 0 10,797.6235 L901,797.6235 A5,5 0 0 0 906,792.6235 L906,776.6235 L896,766.6235 L10,766.6235 A5,5 0 0 0 5,771.6235" fill="#FEFCE8" style="stroke:#CA8A04;stroke-width:1;"/><path d="M896,766.6235 L896,774.1235 A2.5,2.5 0 0 0 898.5,776.6235 L906,776.6235 L896,766.6235" fill="#FEFCE8" style="stroke:#CA8A04;stroke-width:1;"/><text fill="#422006" font-family="Arial, Helvetica, sans-serif" font-size="12" lengthAdjust="spacing" textLength="872.0391" x="15" y="786.8794">Private keys never cross the network, only signatures made with them. The CA's private key is not used at all: it signed the certificates once, when they were issued.</text><?plantuml-src jLJRRXCn47tVhnZA0wtQJLKALQbAKRBQbAYXhT8KXCIBySvchNZjnPT60V7A1_29V0bZfxaMa7Ye54MHP-RCcNDcyaGeBds1q6hjppvEQsdt2y56XjLsVymLIrs5DROQNyl4ZeLg68N0uXUFYYDyIm2kcN62YuOfrz6cG9DfgGqyFNn-bEKlDn8O7u-CzgguJygxtQDkbvBweiI-KBW6yUf5-x1pJD5pgcd-5Th4xHvtszqi-Vu7qk_GMZR2jXGZ1H9BbpZX948zxD_0HBWAnlupSYTF01clm0hIo7XbOVZX2dY5V6n1Ao1bGDENIP9cEI5itLT_KgTMVCMJWuEpIil2dW1dBMuSR6TjQFndAJXmD6xdT3_adQtaSocGa48KTY7hz_BB8LmFUk_Rmnmkye_t5Ll0BF27pLFM28lc3itVEQJfh4dAMLeAYNzWiK295Rjmam_UvuE_yR19mY4z0midKA6KcYfAWxO2mrIXQxXZqcDYGmx_TuxIZfIbni3t8bw7P5vBiJ3I89JJqOIA8hPYOmH7IPORqJWgf0m7ma8XoX9D41G9SmfEr0ZRIeF1HhBfJfA4pMbWI52pWQ4nrDvIlKLPqeujMDDBj4MKWZDYkRqcqivgAeERtlbbUtWxo6V31Agh16j6UnNtpIqwFxFKMzm5w35E2OxFuRAtUNO11v26aKB1AeqHAa-ty-QJ8WnHJcD2rYOqIqlEd3SODfRqYFrcI_0G_VaItQAYMulpweb2imwz76EbmMAKwzjElvU51I6FulMigPGGz5ppZzhFn8QfzYQe3Ti1OglspZEvHG3nBdVcPCCwXDHr5-Qxl7nB2-ROMjL_-74FHmv4cBchzh5is41_D1isXPiviUZEF9Kf5qC5aRc4r-39jpsueb_HC0k_Vlo4GQUTFRpIw-NYMb0O8qRRsI0AtKIRyHxDBwTBjdRz2kfMlC8esSeT13MeNI1J07F0f0od667ePSE6yEVCSGycD4o8JM52vqyOrcFH-Wq0?></g></svg>