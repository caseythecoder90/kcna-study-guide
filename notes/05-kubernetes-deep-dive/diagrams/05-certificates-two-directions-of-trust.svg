<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="693px" preserveAspectRatio="none" style="width:1244px;height:693px;background:#FFFFFF;" version="1.1" viewBox="0 0 1244 693" width="1244px" zoomAndPan="magnify"><title>Two certificates, two directions of trust</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="335.0479" x="450.6768" y="30.8838">Two certificates, two directions of trust</text></g><!--cluster d1--><g class="cluster" data-entity="d1" data-source-line="6" data-uid="ent0003" id="cluster_d1"><rect fill="#F0FDF4" height="177" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="460" x="120.7007" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="220.3335" x="240.5339" y="168.8921">Direction 1 &#183; you verify the SERVER</text></g><!--cluster d2--><g class="cluster" data-entity="d2" data-source-line="10" data-uid="ent0005" id="cluster_d2"><rect fill="#F0FDF4" height="164" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="550" x="588.7007" y="157.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="221.8125" x="752.7944" y="175.3921">Direction 2 &#183; the server verifies YOU</text></g><!--cluster subj--><g class="cluster" data-entity="subj" data-source-line="14" data-uid="ent0007" id="cluster_subj"><rect fill="#F8FAFC" height="192" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="474" x="588.7007" y="335.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="312.2666" x="669.5674" y="353.8921">And the identity itself is IN the certificate's Subject</text></g><!--entity ca--><g class="entity" data-entity="ca" data-source-line="4" data-uid="ent0002" id="entity_ca"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="410.626" x="165.2007" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.2476" x="179.2007" y="87.8921">The cluster's Certificate Authority</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="283.6206" x="179.2007" y="100.9648">created when the cluster was built &#183; a core component</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="382.626" x="179.2007" y="113.6138">holds a PRIVATE key (kept on the control plane) and a PUBLIC certificate</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="363.0752" x="179.2007" y="126.2627">anything signed by the private key can be verified with the public one</text></g><!--entity conseq--><g class="entity" data-entity="conseq" data-source-line="18" data-uid="ent0009" id="entity_conseq"><rect fill="#FEE2E2" height="93.5444" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="601.3213" x="304.2007" y="555.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234.7871" x="318.2007" y="581.8921">The consequence that catches people</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="518.9658" x="318.2007" y="594.9648">Kubernetes has NO User object. A certificate signed by the CA with a CN and an O simply IS a valid</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="509.7544" x="318.2007" y="607.6138">user and group &#8212; nothing was created, nothing can be listed, and there is no kubectl delete user.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="573.3213" x="318.2007" y="620.2627">Worse: Kubernetes does NOT SUPPORT CERTIFICATE REVOCATION. An issued certificate stays valid until it</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="443.1421" x="318.2007" y="632.9116">EXPIRES. Removing access means removing the RBAC bindings, or rotating the CA.</text></g><!--entity v1--><g class="entity" data-entity="v1" data-source-line="7" data-uid="ent0004" id="entity_v1"><rect fill="#DCFCE7" height="136.0908" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="408.7891" x="163.2007" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="272.3145" x="177.2007" y="209.8921">certificate-authority-data in your kubeconfig</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="367.5332" x="177.2007" y="222.9648">the CA's PUBLIC certificate &#8212; safe to share, it verifies but cannot sign</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="177.2007" y="237.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="324.5913" x="177.2007" y="250.5625">The API server presents its own certificate, signed by that CA.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="375.9336" x="177.2007" y="263.2114">Your client checks the signature against the public cert it already holds.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="177.2007" y="277.7363">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="380.7891" x="177.2007" y="290.8091">WHY: so you are talking to the GENUINE API server and not an imposter.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="304.9922" x="177.2007" y="303.458">This is what protects you from a man-in-the-middle attack.</text></g><!--entity v2--><g class="entity" data-entity="v2" data-source-line="11" data-uid="ent0006" id="entity_v2"><rect fill="#DCFCE7" height="123.4419" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="498.7817" x="631.2007" y="190.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="356.5034" x="645.2007" y="216.3921">client-certificate-data + client-key-data in your kubeconfig</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="371.6743" x="645.2007" y="229.4648">a certificate SIGNED BY THE CA, plus YOUR private key (never shared)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="243.9897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="323.5439" x="645.2007" y="257.0625">The API server checks the signature with the CA's public cert.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="333.1421" x="645.2007" y="269.7114">Valid signature = an identity this cluster issued = authenticated.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="284.2363">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="470.7817" x="645.2007" y="297.3091">Both directions at once is MUTUAL TLS &#8212; chapter 02-02's mTLS, in your own kubeconfig.</text></g><!--entity s--><g class="entity" data-entity="s" data-source-line="15" data-uid="ent0008" id="entity_s"><rect fill="#326CE5" height="151.0396" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="422.8774" x="631.2007" y="368.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="307.0615" x="645.2007" y="394.8921">Subject: O = system:masters, CN = system:admin</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="409.8408">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="209.6445" x="645.2007" y="422.9136">CN = Common Name = THE USERNAME</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="317.2061" x="645.2007" y="435.5625">O  = Organisation = A GROUP  (repeat O for multiple groups)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="450.0874">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="299.5942" x="645.2007" y="463.1602">echo &lt;base64&gt; | base64 -d | openssl x509 -noout -subject</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.3853" x="645.2007" y="475.8091">is how you read who a kubeconfig actually is.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="490.334">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="394.8774" x="645.2007" y="503.4067">Every successful authentication also joins the group system:authenticated.</text></g><g class="link" data-entity-1="ca" data-entity-2="d1" data-uid="lnk10" id="link_ca_d1"><polygon fill="#475569" points="154.7319,150.6658,163.8604,146.9685,158.2045,147.0684,158.1046,141.4124,154.7319,150.6658" style="stroke:#475569;stroke-width:1;"/><path d="M165.2378,142.8202 C163.0828,144.0638 161.1142,145.3417 159.3514,146.6545 C158.4701,147.3108 157.6402,147.976 156.8642,148.6499 C156.4763,148.9869 156.1018,149.326 155.7411,149.6674 C155.5607,149.8381 155.3838,150.0094 155.2104,150.1812 C155.1237,150.2671 155.0379,150.3531 154.9529,150.4393 C154.9104,150.4824 154.8682,150.5255 154.8261,150.5687 C154.8051,150.5902 154.7842,150.6118 154.7632,150.6334 C154.7528,150.6442 158.9094,146.3381 158.899,146.3489" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ca" data-entity-2="d2" data-uid="lnk11" id="link_ca_d2"><polygon fill="#475569" points="590.0733,157.0516,587.988,147.426,587.1212,153.0161,581.5312,152.1493,590.0733,157.0516" style="stroke:#475569;stroke-width:1;"/><path d="M573.8749,142.7573 C578.3072,145.2657 581.9715,147.9111 584.7007,150.6982 C586.1871,152.2163 587.5781,153.8117 588.8794,155.474 C589.2048,155.8895 589.5245,156.3093 589.8387,156.733 C589.9172,156.8389 586.453,152.1025 586.5308,152.209" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="d2" data-entity-2="subj" data-uid="lnk12" id="link_d2_subj"><polygon fill="#475569" points="604.7007,335.6211,608.7007,326.6211,604.7007,330.6211,600.7007,326.6211,604.7007,335.6211" style="stroke:#475569;stroke-width:1;"/><path d="M604.7007,321.4094 C604.7007,321.9168 604.7007,322.4253 604.7007,322.9348 C604.7007,327.0109 604.7007,331.1527 604.7007,335.3275 C604.7007,335.3927 604.7007,335.458 604.7007,335.5232 C604.7007,335.5558 604.7007,329.5884 604.7007,329.6211" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="subj" data-entity-2="conseq" data-uid="lnk13" id="link_subj_conseq"><polygon fill="#475569" points="604.7007,555.6291,608.7007,546.6291,604.7007,550.6291,600.7007,546.6291,604.7007,555.6291" style="stroke:#475569;stroke-width:1;"/><path d="M604.7007,528.0844 C604.7007,528.2298 604.7007,528.3753 604.7007,528.5208 C604.7007,537.8297 604.7007,541.0424 604.7007,549.6291" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1226.4014" x="5" y="661.8301">The asymmetry is the whole idea: the PUBLIC certificate goes in your kubeconfig because it can only verify, never sign. The PRIVATE key stays on the control plane. Anything the private key signed,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1079.3057" x="78.5479" y="677.9287">the public certificate proves &#8212; which is why a file you can safely email around is enough to detect an imposter server, and why your client key must never leave your machine.</text></g><!--SRC=[ZPRRRXit48RlzHJJt3H19JassW8r506oeZf27SdGmQc1tensAIsZNL9PSkMg1w0FqNVfVH-bJz9_k3giB0K8u0kPImvd_lbcXbzf4wL5hAZPl2Z_lBMfkuWrBtBEtCKoCjpmYSfKSrLaQSrhdogQF5cALExrN4VibQkJnqgiSnLvROqZEoUV5yxNQhB4Pe53BoQ98jpclCg_TjGzdATEuHERQx_vnRIS_arTNrwserpXKqnFYJBa3qVfYHtD2frw-lSVOefiZcysMrcZZ6zToFbsnKvYqzXXt_se_z2Pz6YfDlHogLQUxDQkDJwtAQrIDkeLiObbz_Jchj-j1dbgcSt69zeioEc5WQUpJR2tolLQWfAB8ZOqKxHMEQn8CDedvQPYbke8Bkpilg1MYwC88RJRX0WZFjBkxKvRkfImDxOeZPPNZdkZXzv8J2noMwnkhOrBA_4b_LuZgXYgHDJWdUoDc3sJDc8tfsKnKn1bhXULOEMQRWTvErM6_llhRt8yL-GjkOHpLIVjTq5Bihm8OQmFIks5h5WND3htVN8gnp58g1oKS303bfvCzRRwaTpiuLNpD3UF4aYKQbYXA57HqWMXv2Zx0iJmWhLnlfeCkKGSvnJenHiAv3JFkVlXtUCrEHlIW739SxeK412_sBlj3QRzGQyQaL0b0e073LG5v3DUJnADc1sOHroht7hapOLRvhdDW6N6fg6D56GZqt6CXBBt72sR5OeM- -olBsj_VeQYAw4eA5Bwjq_Mut1wZgEh4uw2jeqgJW6YRxQgDu3_5s35Ho2D-xU3tbkwUQJ9knuIMqTH5i6dqL5PlJHAd0winQ- -0AYp2EoBCN1TWU1CPXuurN7bx9kGoHY1ednW14dRzIVjN04yiGFb9HiajFWiHpSM7bJQ9ajJYfGWy7uwcNRkQ78t3kKL9RmIuw-l6g-lu6s63_Mzj58Y1ta_0yFLCnWwG5AYtqU1ObFfN2xl3yhEU4WDhXmNiuyulQUZDEkm-foDxSvh6a85ju4gsNN68WucHNTmMEGuq-P8aV2rQxCCZ0uu4w45XIawtA3pldUQc25Xop1ViD6E0zflg4Ete-7qdkXbhbQO8l1ZRdFAYjJh5HmCxhkptAWeiTIQiLFVVzkcFwZyHOqOl-rA6UTI-lMxrpzGmrYBljPmPQodZa76n3w5ufLsWfgsAE13beWZNt2QGlVpJQO7S3VG5qF1kNcHLdcIE3b51_feqSL2ia9GUs7FeVTynBXdG4pAOUZKfq89XQ6xmWAA1-MXBAIhkFSJ8icDmlId1CO6GvgYsCW6EPh8GRMmZoTajrFM7WiCOTuQfCYXCKAD_XZhQoctKqqBjssbPR1I66YgOGRBgs3xPAZl5xVZDzKkB7D9V1uApDWo6JwbMAM8WyJwcTB_O7EdhgaIRsoL13oXyVJ-VZYQKBStclH_x7VbVJ7gFGpnepySG0IpwmP7OdZUk394Af2a59LtUctlv_l-g3TkqaXbTYtHS221CiL8URvR5K57DvqkpRI9iO0I0-kO7Q1a-_am8GM16MyxGfdhMYrYy8qMqcZZlN3qtrKDZN_tdv1U2-M-MpaOM0KYMphqNNQRB5C-5xB3_K0_3Ns6hyF_PvuG2v7qT58WUn4ZBpAM9PdMW93ouOCibqC0Q3L9xgs-y4gDpxtm92lRTzlprrf9QRrreIKHkltiRR3p5ODv3M-5lgT4HqaviJV0TguHfrIy-2el8dYhCaQ66S22FknKnXQBH9uAiPBvNdqIRCTLIQgOt5IUCU9XXX6pZJjLl5RbXemZnAEQulZ_]--></g></svg>