<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="706px" preserveAspectRatio="none" style="width:1244px;height:706px;background:#FFFFFF;" version="1.1" viewBox="0 0 1244 706" width="1244px" zoomAndPan="magnify"><title>Two certificates, two directions of trust</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="335.0479" x="450.6768" y="30.8838">Two certificates, two directions of trust</text></g><!--cluster d1--><g class="cluster" data-qualified-name="d1" data-source-line="6" id="ent0003"><rect fill="#F0FDF4" height="190" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="460" x="120.7007" y="150.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="220.3335" x="240.5339" y="168.8921">Direction 1 &#183; you verify the SERVER</text></g><!--cluster d2--><g class="cluster" data-qualified-name="d2" data-source-line="10" id="ent0005"><rect fill="#F0FDF4" height="177" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="550" x="588.7007" y="157.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="221.8125" x="752.7944" y="175.3921">Direction 2 &#183; the server verifies YOU</text></g><!--cluster subj--><g class="cluster" data-qualified-name="subj" data-source-line="14" id="ent0007"><rect fill="#F8FAFC" height="192" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="474" x="588.7007" y="348.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="312.2666" x="669.5674" y="366.8921">And the identity itself is IN the certificate's Subject</text></g><!--entity ca--><g class="entity" data-qualified-name="ca" data-source-line="4" id="ent0002"><rect fill="#326CE5" height="80.8955" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="410.626" x="165.2007" y="61.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208.2476" x="179.2007" y="87.8921">The cluster's Certificate Authority</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="283.6206" x="179.2007" y="100.9648">created when the cluster was built &#183; a core component</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="382.626" x="179.2007" y="113.6138">holds a PRIVATE key (kept on the control plane) and a PUBLIC certificate</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="363.0752" x="179.2007" y="126.2627">anything signed by the private key can be verified with the public one</text></g><!--entity conseq--><g class="entity" data-qualified-name="conseq" data-source-line="18" id="ent0009"><rect fill="#FEE2E2" height="93.5444" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="601.3213" x="304.2007" y="568.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="234.7871" x="318.2007" y="594.8921">The consequence that catches people</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="518.9658" x="318.2007" y="607.9648">Kubernetes has NO User object. A certificate signed by the CA with a CN and an O simply IS a valid</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="509.7544" x="318.2007" y="620.6138">user and group &#8212; nothing was created, nothing can be listed, and there is no kubectl delete user.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="573.3213" x="318.2007" y="633.2627">Worse: Kubernetes does NOT SUPPORT CERTIFICATE REVOCATION. An issued certificate stays valid until it</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="443.1421" x="318.2007" y="645.9116">EXPIRES. Removing access means removing the RBAC bindings, or rotating the CA.</text></g><!--entity v1--><g class="entity" data-qualified-name="d1.v1" data-source-line="7" id="ent0004"><rect fill="#DCFCE7" height="148.7397" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="408.7891" x="163.2007" y="183.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="272.3145" x="177.2007" y="209.8921">certificate-authority-data in your kubeconfig</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="367.5332" x="177.2007" y="222.9648">the CA's PUBLIC certificate &#8212; safe to share, it verifies but cannot sign</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="177.2007" y="237.4897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="324.5913" x="177.2007" y="250.5625">The API server presents its own certificate, signed by that CA.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="375.9336" x="177.2007" y="263.2114">Your client checks the signature against the public cert it already holds,</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="374.709" x="177.2007" y="275.8604">and the server proves it owns that certificate by signing the handshake.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="177.2007" y="290.3853">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="380.7891" x="177.2007" y="303.458">WHY: so you are talking to the GENUINE API server and not an imposter.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="304.9922" x="177.2007" y="316.1069">This is what protects you from a man-in-the-middle attack.</text></g><!--entity v2--><g class="entity" data-qualified-name="d2.v2" data-source-line="11" id="ent0006"><rect fill="#DCFCE7" height="136.0908" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="498.7817" x="631.2007" y="190.1982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="356.5034" x="645.2007" y="216.3921">client-certificate-data + client-key-data in your kubeconfig</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="371.6743" x="645.2007" y="229.4648">a certificate SIGNED BY THE CA, plus YOUR private key (never shared)</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="243.9897">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="425.0146" x="645.2007" y="257.0625">Check 1: the API server verifies the CA's signature on your certificate (genuine?).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="409.5405" x="645.2007" y="269.7114">Check 2: you sign the handshake with your private key; it verifies that with the</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="348.4067" x="645.2007" y="282.3604">public key inside your certificate (is it YOURS, not a stolen copy?).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="296.8853">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="470.7817" x="645.2007" y="309.958">Both directions at once is MUTUAL TLS &#8212; chapter 02-02's mTLS, in your own kubeconfig.</text></g><!--entity s--><g class="entity" data-qualified-name="subj.s" data-source-line="15" id="ent0008"><rect fill="#326CE5" height="151.0396" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="422.8774" x="631.2007" y="381.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="307.0615" x="645.2007" y="407.8921">Subject: O = system:masters, CN = system:admin</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="422.8408">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="209.6445" x="645.2007" y="435.9136">CN = Common Name = THE USERNAME</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="317.2061" x="645.2007" y="448.5625">O  = Organisation = A GROUP  (repeat O for multiple groups)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="463.0874">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="299.5942" x="645.2007" y="476.1602">echo &lt;base64&gt; | base64 -d | openssl x509 -noout -subject</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="238.3853" x="645.2007" y="488.8091">is how you read who a kubeconfig actually is.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="645.2007" y="503.334">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="394.8774" x="645.2007" y="516.4067">Every successful authentication also joins the group system:authenticated.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk10"><polygon fill="#475569" points="154.7318,150.6657,163.8405,146.9198,158.1851,147.0498,158.0551,141.3945,154.7318,150.6657" style="stroke:#475569;stroke-width:1;"/><path d="M165.2001,142.7841 C163.0504,144.0327 161.0874,145.3161 159.331,146.6349 C158.4527,147.2942 157.6261,147.9625 156.8536,148.6397 C156.4673,148.9783 156.0946,149.3191 155.7356,149.6622 C155.5562,149.8338 155.3802,150.0059 155.2077,150.1785 C155.1214,150.2649 155.036,150.3514 154.9515,150.438 C154.9093,150.4813 154.8673,150.5246 154.8255,150.568 C154.8045,150.5897 154.7837,150.6114 154.7629,150.6331 C154.7525,150.6439 158.8861,146.3158 158.8758,146.3266" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk11"><polygon fill="#475569" points="589.9167,156.8722,587.7882,147.2561,586.9466,152.85,581.3527,152.0083,589.9167,156.8722" style="stroke:#475569;stroke-width:1;"/><path d="M573.9167,142.7167 C578.3374,145.2363 581.988,147.8951 584.7007,150.6982 C586.287,152.3374 587.7679,154.0602 589.1498,155.8551 C589.3225,156.0794 589.4937,156.3049 589.6634,156.5315 C589.7482,156.6448 586.2685,151.9317 586.3525,152.0455" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" id="lnk12"><polygon fill="#475569" points="604.7007,348.6931,608.7007,339.6931,604.7007,343.6931,600.7007,339.6931,604.7007,348.6931" style="stroke:#475569;stroke-width:1;"/><path d="M604.7007,334.1991 C604.7007,334.4659 604.7007,334.733 604.7007,335.0003 C604.7007,336.0695 604.7007,337.1425 604.7007,338.2187 C604.7007,340.3711 604.7007,342.5364 604.7007,344.7103 C604.7007,345.7973 604.7007,346.8864 604.7007,347.9771 C604.7007,348.1134 604.7007,348.2498 604.7007,348.3862 C604.7007,348.4544 604.7007,348.5226 604.7007,348.5908 C604.7007,348.6249 604.7007,342.659 604.7007,342.6931" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0009" data-link-type="dependency" id="lnk13"><polygon fill="#475569" points="604.7007,568.6291,608.7007,559.6291,604.7007,563.6291,600.7007,559.6291,604.7007,568.6291" style="stroke:#475569;stroke-width:1;"/><path d="M604.7007,541.0844 C604.7007,541.2298 604.7007,541.3753 604.7007,541.5208 C604.7007,550.8297 604.7007,554.0424 604.7007,562.6291" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="25"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1226.4014" x="5" y="674.8301">The asymmetry is the whole idea: the PUBLIC certificate goes in your kubeconfig because it can only verify, never sign. The PRIVATE key stays on the control plane. Anything the private key signed,</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1079.3057" x="78.5479" y="690.9287">the public certificate proves &#8212; which is why a file you can safely email around is enough to detect an imposter server, and why your client key must never leave your machine.</text></g><?plantuml-src ZLRBRY975Dtp5JUpYKS1FBQII74yH9WX7XGFM3ncOYcRehkWQwYk8btLTiX3oaVaNxBFf-HBScvL0urXf4Wickgk-pZdtCTdoYIwJ2Mrs-VnvwtLxZnLObc8t9sl4YDQFfEvRA_BN3UyybhIzCbI8Wkl5YeHNhecUPoagf29LzOuiWloHUbyey57mYnnwSKqamHlpilYSqUz_NtgbZwpXVARdyorKx_AgukBJb98l4hfAPE6_FugFGb7yr9fJ__yJO8IM-2TpTVMIEElp_b-fsOdipfr-Ev-F7ZVdVPf9JTqjf9hJxQoQuqlhAQr5aQ-965I_dfsSpVerPCyjYpCncVABCcffK6ayqsmjoxK8oV5ZX9XQ2xfKHQmmiaedyMFohbM2KBOsdr1rzSYIP12fqF8C147sBtPOaiNdFR6bj5eT3dfZz_tnsnYMTXoVMjj6gsa5_HRWwXcg9PHIsnXRwN22rA6xHQqAkSIe2pKifOik-brmTinClJldt-H4mj9tfBBH26RfFmsQIRBCn36-e3K3iYQTPP6ztv0JXQu1WYb0n8EPg2b9rFtrZo0MtX4rJxcve4JIRI25KeocQnS08gl2bz2CM8fb76-JWOxuS25XlJI3GNbD4_ndaPZss3je-HGEL8NOwgZWpZPBGk5RsMu3f1MidqAY0zl7wx8sK0mW2Glz2hSjE7oRNyu6mpxTQmu6eOMIbCe0YwH4tXCCuKG7Qe9qI5Y3qMuu6LHs1o2puLfASEbtifLca8gmdkHhDerVIvtkdgyQFpn2NrUiZvhyEnay32QdLBevP520skjkb23FB-e-6oXiFw7OCK12PF1xR3_XcuUQFgs3yaqKUvbY6byKB1dHdBGGSNforCCzLXDT74LSgpniCjpLobxiTagq7f4PqjfIcNaTozFq1MTN5u5XjZEeNHY7macQy5_Ur1rGOVRVdFieT8yvumwK1W1nn6ge6h6QDAC6YFdhKO_JknwKm-yPlZ6mcLj50Xkj8bayRsRJMVTEvhUJKBBI3AnveR-whBrwX9uvNZHt97APRydzXCol7mcmsvLciZ7O5Hjk858lM3dWs7izli4uN9IpZ_YzawNqQp3wNDLLbzUqOXUazkWpFAhN72rOVhrXlj3aURA72g6t_PidaC6Gv5B_6CHpj2rXzrt_MDkHeHFHiLI6EL4AAhNrANRyMXsJtHMo3Kc8-9Os8BoKdkrHe0XV7TIiJB9B5tFXPDVVzcXtoa-KIl5irrBuvocNxvwzGsrZBNerIqNSpqE331czYc8abiakec59lOiaKXyARG6xkwaEFgG9zfXYK7dtABKn2E8gKfYdaAZztsqoiGo2adjWDr_AjFs9yQcUoQ8QHpmJlvSIbPXxCx2OoOuMaiBw6hX_O1C2YE