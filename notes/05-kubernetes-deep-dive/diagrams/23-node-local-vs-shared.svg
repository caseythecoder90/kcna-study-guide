<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="795px" preserveAspectRatio="none" style="width:797px;height:795px;background:#FFFFFF;" version="1.1" viewBox="0 0 797 795" width="797px" zoomAndPan="magnify"><title>Why the lecture pinned the Pod to worker-1 &#8212; node-local storage lives on ONE disk</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="716.124" x="36.8325" y="30.8838">Why the lecture pinned the Pod to worker-1 &#8212; node-local storage lives on ONE disk</text></g><!--cluster nl--><g class="cluster" data-entity="nl" data-source-line="4" data-uid="ent0002" id="cluster_nl"><rect fill="#FEF2F2" height="122" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="494" x="78.3945" y="53.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="351.0381" x="149.8755" y="71.8921">NODE-SPECIFIC STORAGE &#8212; local-path, hostPath, local</text></g><!--cluster k--><g class="cluster" data-entity="k" data-source-line="10" data-uid="ent0006" id="cluster_k"><rect fill="#F8FAFC" height="230" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="570" x="78.3945" y="183.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="294.709" x="216.04" y="201.8921">What the scheduler KNOWS about each volume</text></g><!--cluster fix--><g class="cluster" data-entity="fix" data-source-line="14" data-uid="ent0008" id="cluster_fix"><rect fill="#F0FDF4" height="162" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="656" x="78.3945" y="421.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="322.188" x="245.3005" y="439.8921">So: nodeSelector kubernetes.io/hostname: worker-1</text></g><!--cluster sh--><g class="cluster" data-entity="sh" data-source-line="18" data-uid="ent0010" id="cluster_sh"><rect fill="#F0FDF4" height="152" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="604" x="78.3945" y="591.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="368.3799" x="196.2046" y="609.8921">SHARED STORAGE &#8212; NFS, Ceph via Rook, cloud block/file</text></g><!--entity w1--><g class="entity" data-entity="w1" data-source-line="5" data-uid="ent0003" id="entity_w1"><rect fill="#FEE2E2" height="80.8955" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="259.6821" x="120.3945" y="86.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1899" x="134.3945" y="112.8921">worker-1</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="146.126" x="134.3945" y="125.9648">/var/lib/rancher/k3s/storage/</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="122.2622" x="140.5068" y="138.6138">manual-pv001/   &#8592; data</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="225.5698" x="140.5068" y="151.2627">pvc-&lt;uid&gt;_default_dynamic-claim/   &#8592; data</text></g><!--entity w2--><g class="entity" data-entity="w2" data-source-line="6" data-uid="ent0004" id="entity_w2"><rect fill="#FFFFFF" height="68.2466" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="166.1768" x="398.3945" y="93.1982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.5654" x="412.3945" y="119.3921">worker-2</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="135.7275" x="412.3945" y="132.4648">/var/lib/rancher/k3s/storage/</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="132.0645" x="418.5068" y="145.1138">(nothing &#8212; a different disk)</text></g><!--entity k1--><g class="entity" data-entity="k1" data-source-line="11" data-uid="ent0007" id="entity_k1"><rect fill="#FFFFFF" height="188.9863" rx="5" ry="5" style="stroke:#CBD5E1;stroke-width:1;" width="519.6001" x="120.3945" y="216.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="256.4326" x="134.3945" y="242.8921">dynamic-claim &#8594; a PV WITH node affinity</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="446.6494" x="134.3945" y="255.9648">local-path writes kubernetes.io/hostname=worker-1 into the PV. From then on the scheduler</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="431.0679" x="134.3945" y="268.6138">FILTERS every other node out for any Pod using that claim. It cannot be placed wrongly.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="437.7495" x="134.3945" y="281.2627">k3s docs: this 'does result in permanently binding the pod to the node hosting the volume'.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="134.3945" y="295.7876">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="324.3208" x="134.3945" y="310.7363">manual-claim &#8594; a hostPath PV with NO node affinity</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="491.6001" x="134.3945" y="323.8091">The scheduler believes it is usable on ANY node. A Pod using only this claim could land on worker-2,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="470.1426" x="134.3945" y="336.458">where the kubelet runs DirectoryOrCreate &#8212; a brand-new EMPTY directory. The data is not lost,</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="357.7148" x="134.3945" y="349.1069">just on the other machine, and a persistence demo would appear to FAIL.</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="134.3945" y="363.6318">&#160;</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="478.0596" x="134.3945" y="376.7046">In the lecture's Pod the two are mounted together, so after the FIRST placement the dynamic PV's</text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" lengthAdjust="spacing" textLength="394.4155" x="134.3945" y="389.3535">affinity would hold the Pod on its node anyway. Nothing holds it there before that.</text></g><!--entity fix1--><g class="entity" data-entity="fix1" data-source-line="15" data-uid="ent0009" id="entity_fix1"><rect fill="#DCFCE7" height="121.1421" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="604.5259" x="120.8945" y="454.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="286.0825" x="134.8945" y="480.8921">Not a resource decision &#8212; a determinism one.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="286.8315" x="424.5889" y="480.8921">It removes every way the demo could mislead:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="506.0645" x="134.8945" y="493.9648">&#183; the hostPath PV, which carries NO node affinity of its own, is pinned explicitly from the first run</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="482.856" x="134.8945" y="506.6138">&#183; the dynamic PV, provisioned WaitForFirstConsumer, is created on that same KNOWN node</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="382.6152" x="134.8945" y="519.2627">&#183; you know exactly which node to ssh into to see both directories on disk</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="134.8945" y="533.7876">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="518.4556" x="134.8945" y="546.8604">And the docs say nodeSelector, NOT nodeName, for this: with WaitForFirstConsumer 'if nodeName</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="488.5815" x="134.8945" y="559.5093">is used, the scheduler will be bypassed and PVC will remain in pending state' (chapter 05-05).</text></g><!--entity sh1--><g class="entity" data-entity="sh1" data-source-line="19" data-uid="ent0011" id="entity_sh1"><rect fill="#DCFCE7" height="110.793" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="552.5195" x="120.8945" y="624.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="344.6396" x="134.8945" y="650.8921">Every node reaches the same storage over the network.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="176.2681" x="483.146" y="650.8921">The Pod can be rescheduled</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="222.4854" x="134.8945" y="665.8408">anywhere and finds its data waiting.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="134.8945" y="680.7896">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="473.1235" x="134.8945" y="693.8623">This is the production answer, and the reason node-local provisioners are for labs, caches</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="433.3774" x="134.8945" y="706.5112">and single-node clusters. It is also exactly the gap Rook and Ceph fill (diagram 24).</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="493.2759" x="134.8945" y="719.1602">Note: ReadWriteMany needs storage like this &#8212; node-local disk can only ever be on one node.</text></g><g class="link" data-entity-1="nl" data-entity-2="k" data-uid="lnk12" id="link_nl_k"><polygon fill="#475569" points="94.3945,183.6796,98.3945,174.6796,94.3945,178.6796,90.3945,174.6796,94.3945,183.6796" style="stroke:#475569;stroke-width:1;"/><path d="M94.3945,175.9141 C94.3945,176.7978 94.3945,177.6887 94.3945,178.5861 C94.3945,179.4836 94.3945,180.3877 94.3945,181.2979 C94.3945,181.753 94.3945,182.2097 94.3945,182.6679 C94.3945,182.8969 94.3945,183.1264 94.3945,183.3562 C94.3945,183.4136 94.3945,183.4711 94.3945,183.5286 C94.3945,183.5573 94.3945,183.5861 94.3945,183.6149 C94.3945,183.6292 94.3945,183.6436 94.3945,183.658 C94.3945,183.6652 94.3945,177.6724 94.3945,177.6796" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="k" data-entity-2="fix" data-uid="lnk13" id="link_k_fix"><polygon fill="#475569" points="94.3945,421.6785,98.3945,412.6785,94.3945,416.6785,90.3945,412.6785,94.3945,421.6785" style="stroke:#475569;stroke-width:1;"/><path d="M94.3945,413.8242 C94.3945,414.1056 94.3945,414.3871 94.3945,414.6685 C94.3945,415.2314 94.3945,415.7942 94.3945,416.3568 C94.3945,417.4822 94.3945,418.607 94.3945,419.7308 C94.3945,420.2926 94.3945,420.8542 94.3945,421.4155 C94.3945,421.4856 94.3945,421.5558 94.3945,421.6259 C94.3945,421.6435 94.3945,415.661 94.3945,415.6785" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="fix" data-entity-2="sh" data-uid="lnk14" id="link_fix_sh"><polygon fill="#475569" points="94.3945,591.6715,98.3945,582.6715,94.3945,586.6715,90.3945,582.6715,94.3945,591.6715" style="stroke:#475569;stroke-width:1;"/><path d="M94.3945,584.0624 C94.3945,584.2759 94.3945,584.4895 94.3945,584.7033 C94.3945,585.5582 94.3945,586.4151 94.3945,587.2736 C94.3945,588.132 94.3945,588.9921 94.3945,589.8533 C94.3945,590.2839 94.3945,590.7148 94.3945,591.1459 C94.3945,591.2537 94.3945,591.3615 94.3945,591.4693 C94.3945,591.5232 94.3945,591.5771 94.3945,591.6311 C94.3945,591.6445 94.3945,585.658 94.3945,585.6715" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="26"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="779.7891" x="5" y="763.8301">Persistent does not mean portable. Node-local persistent storage survives the Pod &#8212; but only on the node that holds the disk.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="723.707" x="33.041" y="779.9287">Shared storage survives the Pod AND the node, which is why it is what production stateful workloads actually run on.</text></g><!--SRC=[fLVTRjis5BxFKvpr9YtWdwHRRmBFG9RQhR7M2MAZGR4E1INH5cUQ54ZAgZSCsDMkXs7lilizIfzatw7alzZTpO00bYMPFEVxEynNogIwp2HrEjtwBrYhVJTJOkx4qdSNgH7jaCkbx1JbKfy55RIaXtnDk4bQfg5qaWfbZCpYhJkBJqkLTGlfsfVq-RU_oDXCjhLDXIOVh1Dp_5Ajf2Thw7Oye4pvnTcPmsB2pB7ya_7joq5xSZUu6Gr7DpIPtjvVlnh4fU8gxKA4l4MvzU4kNiMxJwZNcpjR5j-9hDyduSbe-kMCQ6_XJLaVJC-hd-NLvMM_knAkgrNITSAakNJTnTU-svJPxNNvjVxUwqHBOKgkONLnSTabei-__q6P2EBKkyKgRVTAbVK_Pd8cIXq-PciZbYfjfrgevOcVSnV9fe7gycJvp_zF-K-D3RaoymYd0FQpcNJIXCZ2ixqg2bHecZgUeuxgaje_v2hBfFdHgNaUsdr-yEi1Sm-v25477iLafPQElX_VFan89BOC94MQqyhgSYctTDLRB1vJrKlw1rW1g3zHxzqxUXXDNqTDaPZDb55XtUic-qtkH4ALKm52MvI9T4RYigDibuM3bUMtMvKg0yr6-RxhqD3P9NynhC-3Nexn78xUJ0Vt4v8hwTO4PD5mB8sxdLb7mgoZ9qhFc0U69xRJeH6kX04RbC11MgHmKEKikbztZZS2hPJPr5zX3UNfFBDeoqaFJQ5wAgI3Ba6ZNbEYJ5PlXdLhE_9bB8jRtpohUJZVRORjaduZxttCDqPZy2k5p_7jV-8_FU0_aLf9Thj2fHv0Y0Jy0jhhyVkuJ8Ukzo2oHg_h7kiIKblgZBGm6Vzcuu3MCK8Li9UnCMPRoq2kD9vUAXQLTUjRT-Ea2B8HVWB3P6qZAngylPk-X_oRzph4zRCbkLpcHwF_4nl-LFgmaKZD_1BoLaQsYAiLJ8fNFaYJOZsvv5JaNaHHIE6Obk7rwCq1_9kbHsO_Nyzz7Qku4ofB0cqkRMa2HwwTIzwwHHuFPW55y6l3qVraMejgoTxcUusRGEAvFsvcGsLJOsxrBi_Hemg-eToiAm6CnasAy8kHsX3XJoH4BwFEEwUpP77vA38czYekFP4w4l05irvjPyesELvPsmJbJ7qwaH-e4Ip09BPqaO9KUOLcckJ33cw9flqI7SeEYvXDwS0KoxMsD9gjqMF-QYqkbTTIP5TxwFtpTtnfpoWjgdA5i4k5SmghFROCsLa4rLQcnJfhHgZyL6YLAhRnh8aXDETy5FCnQys-EsfRL3YxYcrYjGUXmj2w8IzmOus7tLtSBOrEo6hr8f8y08v1FOvLdjneRKjQ65kXHf5oWNM3iIjesVkyYL5SIoW10jcQIjN3daVCARbVcrfi772ePNsWXnQmcyOxOrJPYgdA-N1LPz6f7kbSpRQ_E6ucff3CMey6LQMqvYnEreNmU1vTVFVkfdu0MK33TTRM-Ue3C3odfsak2ZRUnOlsnOjd-xAVxmlqIFUlh-y7BmzED-FXf4Ktii2CL8BkhLsqa8Asp2Z1J5jqPqhB4-e7yiVY7qJvHdOSZrqm4DjbfZUdCEYypWkuZTrLUs3Qs1xJYU60Vng8iW-6xH-DpjX0oT7xlaxB2am0byu1jLDESbNl3MbcPHhOWiBuYhKe6kPHeiVjlPFYJiVEnyXZthL8F229xPp8C2p6CqJBTkmRHrkah_Dnrg86eH6I6_NohdDHH9HZ6H7t6L