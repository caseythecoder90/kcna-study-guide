<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="637px" preserveAspectRatio="none" style="width:1006px;height:637px;background:#FFFFFF;" version="1.1" viewBox="0 0 1006 637" width="1006px" zoomAndPan="magnify"><title>"Ingress" means two different things &#8212; a routing object, and a direction of traffic</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="693.1406" x="152.5347" y="30.8838">"Ingress" means two different things &#8212; a routing object, and a direction of traffic</text></g><!--cluster ing--><g class="cluster" data-entity="ing" data-source-line="4" data-uid="ent0002" id="cluster_ing"><rect fill="#F0FDF4" height="202" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="572" x="124.605" y="53.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="268.7026" x="276.2537" y="71.8921">INGRESS &#8212; the RESOURCE (kind: Ingress)</text></g><!--cluster np--><g class="cluster" data-entity="np" data-source-line="8" data-uid="ent0004" id="cluster_np"><rect fill="#FEF2F2" height="162" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="628" x="124.605" y="263.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="324.3398" x="276.4351" y="281.8921">NETWORKPOLICY &#8212; policyTypes: [Ingress, Egress]</text></g><!--cluster tog--><g class="cluster" data-entity="tog" data-source-line="12" data-uid="ent0006" id="cluster_tog"><rect fill="#F8FAFC" height="152" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="772" x="124.605" y="433.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="390.7871" x="315.2114" y="451.8921">They answer different questions &#8212; and are often used together</text></g><!--entity ing1--><g class="entity" data-entity="ing1" data-source-line="5" data-uid="ent0003" id="entity_ing1"><rect fill="#DCFCE7" height="161.3887" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="521.2759" x="167.105" y="86.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1709" x="181.105" y="112.8921">ROUTES</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="405.2407" x="238.8877" y="112.8921">HTTP and HTTPS from OUTSIDE the cluster to Services INSIDE it.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="181.105" y="127.8408">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="391.2144" x="181.105" y="140.9136">internet &#8594; Ingress controller (Traefik on k3s, NGINX, ...) &#8594; Service &#8594; Pods</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="349.0459" x="181.105" y="153.5625">Host- and path-based rules:  shop.example.com/cart &#8594; cart-svc:80</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="493.2759" x="181.105" y="166.2114">Also: externally reachable URLs, load balancing, TLS termination, name-based virtual hosting.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="483.4951" x="181.105" y="178.8604">Layer 7. HTTP(S) only &#8212; other ports and protocols use a NodePort or LoadBalancer Service.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="310.4922" x="181.105" y="191.5093">Needs an Ingress controller; the object alone does nothing.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="181.105" y="206.0342">&#160;</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="101.4546" x="181.105" y="219.1069">The API is FROZEN</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="361.813" x="282.5596" y="219.1069">: still GA and not being removed, but no further changes. Kubernetes</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="68.4707" x="181.105" y="231.7559">recommends</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="66.6392" x="252.6318" y="231.7559">Gateway API</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="323.9468" x="322.3271" y="231.7559">(GatewayClass &#183; Gateway &#183; HTTPRoute &#183; GRPCRoute) instead.</text></g><!--entity np1--><g class="entity" data-entity="np1" data-source-line="9" data-uid="ent0005" id="entity_np1"><rect fill="#FEE2E2" height="121.1421" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="577.7515" x="166.605" y="296.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="54.1646" x="180.605" y="322.8921">FILTERS</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="491.9751" x="238.3813" y="322.8921">which connections may reach (Ingress) or leave (Egress) the SELECTED PODS.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="180.605" y="337.8408">&#160;</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="447.1436" x="180.605" y="350.9136">Here 'Ingress' is just a DIRECTION: traffic arriving at a Pod &#8212; from another Pod in the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="462.4834" x="180.605" y="363.5625">same namespace just as much as from the internet. 'Egress' is traffic the Pod sends out.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="499.3882" x="180.605" y="376.2114">Pod, namespace and IP-block peers; ports and protocols.  Layer 3/4 &#8212; IPs and ports, not URLs.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="404.0083" x="180.605" y="388.8604">Routes nothing. Opens nothing. It can only narrow what is already reachable.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="311.7061" x="180.605" y="401.5093">Needs a CNI that enforces it; the object alone does nothing.</text></g><!--entity tog1--><g class="entity" data-entity="tog1" data-source-line="13" data-uid="ent0007" id="entity_tog1"><rect fill="#326CE5" height="110.793" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="720.7832" x="167.105" y="466.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="628.4941" x="181.105" y="492.8921">Ingress resource:   HOW does outside traffic get to my Service?     &#8594; routing, makes things reachable</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="692.7832" x="181.105" y="507.8408">NetworkPolicy:      WHICH connections may this Pod accept or make?   &#8594; firewalling, makes things unreachable</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="181.105" y="522.7896">&#160;</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="538.5327" x="181.105" y="535.8623">A typical pairing: the Ingress resource sends shop.example.com to the web Pods, and a NetworkPolicy</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="533.1724" x="181.105" y="548.5112">on those Pods allows ingress ONLY from the Ingress controller's namespace &#8212; so nothing else in the</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="482.8721" x="181.105" y="561.1602">cluster can bypass the front door. The policy has to allow the controller, or the route breaks.</text></g><g class="link" data-entity-1="ing" data-entity-2="np" data-uid="lnk8" id="link_ing_np"><polygon fill="#475569" points="140.605,263.5681,144.605,254.5681,140.605,258.5681,136.605,254.5681,140.605,263.5681" style="stroke:#475569;stroke-width:1;"/><path d="M140.605,255.8409 C140.605,257.8984 140.605,259.9601 140.605,262.0218 C140.605,262.5373 140.605,257.0527 140.605,257.5681" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="np" data-entity-2="tog" data-uid="lnk9" id="link_np_tog"><polygon fill="#475569" points="140.605,433.6715,144.605,424.6715,140.605,428.6715,136.605,424.6715,140.605,433.6715" style="stroke:#475569;stroke-width:1;"/><path d="M140.605,426.0624 C140.605,426.2759 140.605,426.4895 140.605,426.7033 C140.605,427.5582 140.605,428.4151 140.605,429.2736 C140.605,430.132 140.605,430.9921 140.605,431.8533 C140.605,432.2839 140.605,432.7148 140.605,433.1459 C140.605,433.2537 140.605,433.3615 140.605,433.4693 C140.605,433.5232 140.605,433.5771 140.605,433.6311 C140.605,433.6445 140.605,427.658 140.605,427.6715" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="988.21" x="5" y="605.8301">Same word, different layer: kind: Ingress is a Layer 7 router for traffic entering the CLUSTER; policyTypes: Ingress is a Layer 3/4 filter on traffic entering a POD.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="781.2656" x="108.4722" y="621.9287">Neither is a Service, and neither does anything until a controller &#8212; an Ingress controller or a policy-enforcing CNI &#8212; acts on it.</text></g><!--SRC=[ZLRTRjis5BxtKvpb9WbWooiwe8DZk4WTDH5gs8Rj8EkMNL0IPREcI8sax7h3W5tj0OQzo-xtA7sIdKD9iHExm88W4Ido_7xVT_IDK8aiKmv1qAr-dTRITbF1beRbjhjE5Eku5SzvK9IvR3dX98UpI2qDj_OCSiwK1RVLa8eiuuOh1subrDB2bp_-1WP6bmwNeEDFF75jO2h5tLGON0cjG6VW3CioaRHQjCVKqZiOtyx2-TmRGVU0YydzR1Z2nLgej0Tr09TdqEylqKTngtKw602pGDv-Qm4SMEl7WzdaVX7E-zru07UBnTJ7GGzpo8pE0T_EevlG-yAAMCSDE0rpRZOYuHQYiNyjNF2e7bNVYbzvxzMhWL1uK747N_xygua94gsSqLAYYOk5OJmJQy1Crwzj6yQtqVY7DfOxkFHtQWV-UQfJs- -IwS61YpjjNSU7Mp2twiJCyXHCARdj0TYLBWB-cUM5v46Yysx2J1KCFNJi9kbz_-snpMjfTG_uPmgUIRd3Mh5anMAirVriX65ApLA8cMGgmNAsOJ6Q0nxEXMBKjJOeblCwbeqmhcGILXWe7WwEtOtO3cln9l05lvXVOZNG9xLMOxqD5DeuMwLejDC98X1Aon4dOvtoARu5RM24CRtp8U6Lkcudd8qvJydOYNPS-VPMI0Gc