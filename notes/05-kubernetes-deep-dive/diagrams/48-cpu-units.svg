<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="561px" preserveAspectRatio="none" style="width:1067px;height:561px;background:#FFFFFF;" version="1.1" viewBox="0 0 1067 561" width="1067px" zoomAndPan="magnify"><title>CPU in Kubernetes &#8212; an amount of CPU TIME, measured in cores and thousandths of a core</title><defs/><g><g class="title" data-source-line="2"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" lengthAdjust="spacing" textLength="794.1182" x="132.6846" y="30.8838">CPU in Kubernetes &#8212; an amount of CPU TIME, measured in cores and thousandths of a core</text></g><!--cluster u--><g class="cluster" data-entity="u" data-source-line="4" data-uid="ent0002" id="cluster_u"><rect fill="#F8FAFC" height="164" rx="5" ry="5" style="stroke:#94A3B8;stroke-width:1.2;" width="690" x="122.2437" y="53.6982"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59.9409" x="437.2732" y="71.8921">THE UNIT</text></g><!--cluster r--><g class="cluster" data-entity="r" data-source-line="8" data-uid="ent0004" id="cluster_r"><rect fill="#F0FDF4" height="129" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="788" x="122.2437" y="225.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="505.6226" x="263.4324" y="243.8921">REQUEST &#8212; what the container is GUARANTEED, and what the scheduler counts</text></g><!--cluster l--><g class="cluster" data-entity="l" data-source-line="12" data-uid="ent0006" id="cluster_l"><rect fill="#FEF2F2" height="147" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="838" x="122.2437" y="362.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="413.1563" x="334.6655" y="380.8921">LIMIT &#8212; a hard ceiling, enforced by THROTTLING (never by killing)</text></g><!--entity u1--><g class="entity" data-entity="u1" data-source-line="5" data-uid="ent0003" id="entity_u1"><rect fill="#326CE5" height="123.4419" rx="5" ry="5" style="stroke:#1E4FB8;stroke-width:1.5;" width="640.2505" x="164.2437" y="86.6982"/><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="298.7524" x="178.2437" y="112.8921">1 CPU = 1 physical core, or 1 virtual core (vCPU)</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="309.8862" x="480.6079" y="112.8921">if the node is a VM. On most clouds a vCPU is one</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="305.5889" x="178.2437" y="127.8408">hardware thread (hyperthread) of a physical core.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.5835" x="178.2437" y="142.7896">1 CPU = 1000m</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="416.2031" x="279.0508" y="142.7896">&#8212; m is 'millicpu', usually said 'millicores'. Finest precision allowed:</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="18.7891" x="698.8657" y="142.7896">1m</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="717.6548" y="142.7896">.</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="317.3081" x="187.4121" y="155.8623">1      =  1000m   one whole core          0.5  =  500m   half a core</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="471.6895" x="187.4121" y="168.5112">0.25   =   250m   a quarter                0.1  =  100m   a tenth          0.001 = 1m   the smallest step</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="565.1196" x="187.4121" y="181.1602">2.5    =  2500m   two and a half cores &#8212; a single container CAN use more than one core if it is multi-threaded</text><text fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="531.8027" x="178.2437" y="193.8091">ABSOLUTE, never relative: 500m is the same amount of CPU on a 2-core node and on a 48-core node.</text></g><!--entity r1--><g class="entity" data-entity="r1" data-source-line="9" data-uid="ent0005" id="entity_r1"><rect fill="#DCFCE7" height="87.7949" rx="5" ry="5" style="stroke:#16A34A;stroke-width:1.5;" width="736.6016" x="164.7437" y="258.6982"/><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="74.3882" x="178.7437" y="284.8921">Scheduling:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="559.0762" x="256.7437" y="284.8921">a Pod fits a node only if the SUM of requests on that node stays within its allocatable CPU.</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="72.9409" x="178.7437" y="299.8408">At run time:</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="632.0488" x="255.2964" y="299.8408">the request becomes a WEIGHT (cgroup cpu shares / cpu.weight). When the node is busy, CPU time is</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="692.7578" x="178.7437" y="314.7896">shared in proportion to requests &#8212; a 500m container gets twice the time of a 250m one. When the node is idle, a</text><text fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="447.1797" x="178.7437" y="329.7383">container may use MORE than its request. Unused CPU is never wasted.</text></g><!--entity l1--><g class="entity" data-entity="l1" data-source-line="13" data-uid="ent0007" id="entity_l1"><rect fill="#FEE2E2" height="106.1934" rx="5" ry="5" style="stroke:#DC2626;stroke-width:1.5;" width="787.6748" x="164.2437" y="395.6982"/><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="711.9722" x="178.2437" y="421.8921">The kernel's CFS scheduler gives each container a QUOTA of CPU time per PERIOD. The kubelet's default period is</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="40.479" x="893.8276" y="421.8921">100ms</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="3.6118" x="934.3066" y="421.8921">.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="589.3755" x="184.356" y="434.9648">limit 1     &#8594;  100ms of CPU time per 100ms        limit 500m  &#8594;  50ms per 100ms        limit 250m &#8594; 25ms per 100ms</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="632.8115" x="178.2437" y="447.6138">Quota is the TOTAL across all of the container's threads. A 4-thread app with a 1 CPU limit can burn its 100ms in 25ms of</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="617.939" x="178.2437" y="460.2627">wall-clock time &#8212; then it is frozen for the remaining 75ms. That is CPU THROTTLING: no error, no restart, just latency.</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="668.0137" x="178.2437" y="472.9116">'Container runtimes don't terminate Pods or containers for excessive CPU usage.' CPU is COMPRESSIBLE: take it away and the</text><text fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="237.1499" x="178.2437" y="485.5605">app slows down. Memory is not (diagram 49).</text></g><g class="link" data-entity-1="u" data-entity-2="r" data-uid="lnk8" id="link_u_r"><polygon fill="#475569" points="138.2437,225.6827,142.2437,216.6827,138.2437,220.6827,134.2437,216.6827,138.2437,225.6827" style="stroke:#475569;stroke-width:1;"/><path d="M138.2437,217.9724 C138.2437,218.17 138.2437,218.3677 138.2437,218.5654 C138.2437,219.3563 138.2437,220.1482 138.2437,220.9408 C138.2437,221.7334 138.2437,222.5266 138.2437,223.3201 C138.2437,223.7169 138.2437,224.1137 138.2437,224.5106 C138.2437,224.7091 138.2437,224.9075 138.2437,225.1059 C138.2437,225.2052 138.2437,225.3044 138.2437,225.4036 C138.2437,225.4532 138.2437,225.5028 138.2437,225.5525 C138.2437,225.5773 138.2437,225.6021 138.2437,225.6269 C138.2437,225.6393 138.2437,225.6517 138.2437,225.6641 C138.2437,225.6703 138.2437,219.6765 138.2437,219.6827" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="link" data-entity-1="r" data-entity-2="l" data-uid="lnk9" id="link_r_l"><polygon fill="#475569" points="138.2437,362.6496,142.2437,353.6496,138.2437,357.6496,134.2437,353.6496,138.2437,362.6496" style="stroke:#475569;stroke-width:1;"/><path d="M138.2437,354.9547 C138.2437,355.3101 138.2437,355.6662 138.2437,356.023 C138.2437,356.7367 138.2437,357.4532 138.2437,358.1721 C138.2437,359.6101 138.2437,361.0579 138.2437,362.5132 C138.2437,362.5586 138.2437,356.6041 138.2437,356.6496" fill="none" style="stroke:#475569;stroke-width:1.6;"/></g><g class="caption" data-source-line="19"><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="1049.4873" x="5" y="529.8301">Write sub-core values in millicores: 0.005 and 5m are the same, but '0.5m' is visibly invalid where '0.0005' is not. The docs recommend the m form for exactly that reason.</text><text fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="883.2441" x="88.1216" y="545.9287">A limit with no request? Kubernetes copies the limit into the request. A request with no limit? The container may use any idle CPU on the node.</text></g><!--SRC=[TLRDSY8t4Bxp59szO5VXCRYMIa9vsMAzh4t56A-1xCKNeH6CuXc9bJGGDfMgdF80gJpXFacwMyEFZJF5OP1QtLztV_rfVj16vcMg84dEuozOc_lpL8k54uK_Vv96d8LC5IfPbaLU2pha2gxkfw0D_5BEb3CgA0_V__eNX05HsD84i7CscGo6_GOKIlZIgPHEIElGM9WKGcPBZoyXysGkUAjMSqe6OHOOuytafW_Jky7a3LnUBfmjbzqk20yb_543EB2xd7LR7EuTj62PRRoM8cTt3R0ErrRQXR9QWfCLcfvUdi-weEU8Ge6ncBz6LF3hC86HWSBw03AtPKgBAquMGHhrQ3BXqhL0Do5pIgHmacsMoiK_fp6FPmYIHtC8hzbi5XoQwrMGstgXyrpBPLblGEaHPhu1BtIwtQ22rHFuf8r2L4lCMtjjiT9vRjSgxG3vPwSKo-jlgjDgOG3Ccvzt4CFYAsO0wynYpRWIkwUPjDck7SqoaM_xSNbE3hlF7JUJYtPq31TjFY7WQobSK0vUFCsajKKGxO8o8JlSRpPRL1ZQfLxu0lEYH7rGorUZNn1OTdfHuGrhoumI4Nca6FCHl6QAI6k2m08wkEhTOPKLjfXxY8obed0va0qwK4UACW_wBFPKfSSWUX_6ezlf19bjr0fzEfMBe5Ug4mk87ZWJKQWNuq1TWuipZiQa8zIy-FQd_MfIHIJQ2ocnO1NlMxK_dyt7G__pj3-USAhhJ0GEkqyLSLnFUm-zkqc__x71iNPMNcOgBNEqaWJGxqRisjeqXdElZDau7iEYTfZ50kvj2dCTQ4uu8skGljLSZQT3ojofhoLsb0Q8AXwYeGzYus6jGuQgm0wGpr84COlo4WUd5y2LU4mNAaOalvL3c2bf2r8J-D8VNDzCu