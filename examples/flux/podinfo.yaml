# Flux, without bootstrap: a source plus a Kustomization that deploys the public podinfo app.
#   flux install && kubectl apply -f podinfo.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/stefanprodan/podinfo
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1      # a FLUX Kustomization, not kustomization.yaml
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 2m                                  # short, so the drift demo is quick
  sourceRef:
    kind: GitRepository
    name: podinfo
  path: ./kustomize                             # kustomize build runs here
  prune: true
  targetNamespace: default
  wait: true
