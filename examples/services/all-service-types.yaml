# One Deployment, then the SAME app exposed four ways plus headless, so every
# type can be compared side by side in one `kubectl get service`.
#
#   kubectl apply -f all-service-types.yaml
#   kubectl get service
#   kubectl get endpoints            # every selector-based Service lists the same 3 Pod IPs
#   kubectl get endpointslices
#
# Expected:
#   nginx-clusterip     ClusterIP      10.43.x.x    <none>        80/TCP
#   nginx-nodeport      NodePort       10.43.x.x    <none>        80:30080/TCP
#   nginx-loadbalancer  LoadBalancer   10.43.x.x    <pending>     80:3xxxx/TCP   <- pending without a provider
#   nginx-headless      ClusterIP      None         <none>        80/TCP         <- None, not an IP
#   nginx-external      ExternalName   <none>       nginx-clusterip.default...   <none>
#
# Then test everything from a throwaway Pod on the Pod network:
#   kubectl run -it --rm curl --image=curlimages/curl --restart=Never -- sh
#     nslookup nginx-clusterip     # ONE answer: the virtual IP
#     nslookup nginx-headless      # THREE answers: the Pod IPs themselves
#     nslookup nginx-external      # a CNAME to nginx-clusterip
#     curl nginx-clusterip         # repeat: Hostname changes (kube-proxy balancing)
#     curl nginx-headless          # repeat: also changes, but that is the RESOLVER choosing
#     exit
#
#   kubectl delete -f all-service-types.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
          name: http           # a NAMED port, referenced by targetPort below

---
# 1. ClusterIP — the DEFAULT. Reachable only from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
spec:
  type: ClusterIP              # could be omitted entirely
  selector:
    app: nginx                 # matches PODS BY LABEL — it has no idea a Deployment exists
  ports:
  - port: 80                   # the SERVICE's port: what clients connect to
    targetPort: http           # the CONTAINER's port, by name: survives the app changing its port

---
# 2. NodePort — every node opens the same port and forwards inward.
# Also gets a ClusterIP: the types stack, they do not replace each other.
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: http
    nodePort: 30080            # optional; from 30000-32767, else one is allocated

---
# 3. LoadBalancer — asks the cloud provider for a real load balancer.
# Kubernetes ships none, so on a cluster with no provider (and no MetalLB)
# EXTERNAL-IP stays <pending> forever. That is expected, not broken.
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: http

---
# 4. Headless — NOT a fifth type. Still ClusterIP; the None is what matters.
# No virtual IP, kube-proxy ignores it, no platform load balancing.
# DNS returns A records for the Pods themselves.
#
# With a plain Deployment you get only the flat list. Per-Pod names like
# web-0.nginx-headless... need spec.hostname + spec.subdomain, which a
# StatefulSet sets automatically from spec.serviceName.
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: http

---
# 5. ExternalName — a DNS alias. No ClusterIP, no selector, no endpoints,
# no kube-proxy, no proxying of any kind: CoreDNS just returns a CNAME.
#
# Repoint externalName and every client following this name moves at once,
# with no client-side change. It could equally point outside the cluster,
# e.g. my.database.example.com.
#
# Caveat: HTTP/HTTPS clients send Host: nginx-external, which the origin may
# not recognise and a TLS certificate will not match.
apiVersion: v1
kind: Service
metadata:
  name: nginx-external
spec:
  type: ExternalName
  externalName: nginx-clusterip.default.svc.cluster.local
