# Simple fanout: one host, three paths, three Services.
#
# F5 NGINX REQUIRES the host field (the Ingress API does not). Order of the
# paths is irrelevant: the longest matching path wins, and on a tie Exact beats
# Prefix.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress-app
spec:
  ingressClassName: nginx            # the class the F5 controller registered
  rules:
  - host: myingress-app.local
    http:
      paths:
      - path: /                      # the catch-all: / is a prefix of every path
        pathType: Prefix
        backend:
          service: {name: nginx-frontend, port: {number: 80}}
      - path: /api
        pathType: Prefix             # /api, /api/, /api/v1/users ... (and on F5
        backend:                     # NGINX, /apiary too -- see the README)
          service: {name: nginx-api, port: {number: 80}}
      - path: /admin
        pathType: Prefix
        backend:
          service: {name: nginx-admin, port: {number: 80}}
      - path: /healthz
        pathType: Exact              # /healthz only -- not /healthz/ and not /healthz/x
        backend:
          service: {name: nginx-admin, port: {number: 80}}
