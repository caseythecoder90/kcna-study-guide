# Alerting rules as a PrometheusRule. Prometheus evaluates them; Alertmanager routes them.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: orders-alerts
  namespace: shop
spec:
  groups:
    - name: orders
      rules:
        - alert: OrdersHighErrorRate
          # counter -> rate -> ratio: share of 5xx responses over 5 minutes (Micrometer metric names)
          expr: |
            sum(rate(http_server_requests_seconds_count{job="orders", status=~"5.."}[5m]))
              /
            sum(rate(http_server_requests_seconds_count{job="orders"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "orders: more than 5% of requests failing for 10 minutes"
        - alert: OrdersSlowP95
          # histogram -> percentile. Needs management.metrics.distribution.percentiles-histogram.http.server.requests=true
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="orders"}[5m]))) > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "orders: p95 latency above 200 ms (the SLO from 02-06)"
