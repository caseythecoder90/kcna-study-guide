# A one-replica StatefulSet. When its node becomes unreachable, web-0 is deleted
# after 300s but stays Terminating -- and no new web-0 is created until the kubelet
# returns, the Pod is force-deleted, or the node is tainted out-of-service.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None
  selector: {app: web}
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: nginx
        image: nginx
