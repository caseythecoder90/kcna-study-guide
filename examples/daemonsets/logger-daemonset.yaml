# A DaemonSet that proves its own coverage: every Pod prints the node it landed
# on, using the downward API to read spec.nodeName into an env var.
#
#   kubectl apply -f logger-daemonset.yaml
#   kubectl get daemonset
#   kubectl get pods -o wide                  # one per eligible node, named logger-<suffix>
#   kubectl logs -l app=logger --prefix       # one line per node, labelled by Pod
#
# DESIRED is the count of ELIGIBLE nodes, not a number you set. If it is lower
# than your node count, a taint is usually why:
#
#   kubectl get nodes -o custom-columns='NAME:.metadata.name,TAINTS:.spec.taints[*].key'
#   kubectl describe node <control-plane> | grep -A3 Taints
#
# On a kubeadm cluster the control-plane node carries
# node-role.kubernetes.io/control-plane:NoSchedule, and the tolerations the
# DaemonSet controller adds automatically (not-ready, unreachable,
# disk/memory/pid-pressure, unschedulable) do NOT include it. Uncomment the
# tolerations block below to cover the control plane too. On k3s the server
# node is untainted by default, so you get full coverage without it.
#
# Compare with a Deployment, which cannot guarantee this:
#   kubectl create deployment logger-dep --image=alpine --replicas=6 -- /bin/sh -c "sleep infinity"
#   kubectl get pods -l app=logger-dep -o wide   # count them per node — doubles and gaps
#   kubectl delete deployment logger-dep
#
#   kubectl delete -f logger-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logger
  labels:
    app: logger
spec:
  # NOTE: there is no `replicas` field on a DaemonSet. The count is an output.

  selector:
    matchLabels:
      app: logger

  revisionHistoryLimit: 10

  # Defaults written out. Far more conservative than a Deployment's 25%/25%:
  # one node at a time loses its agent, and two agents never share a node.
  updateStrategy:
    type: RollingUpdate           # the alternative is OnDelete
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  template:
    metadata:
      labels:
        app: logger               # must match spec.selector.matchLabels
    spec:
      # Uncomment to also run on kubeadm control-plane nodes. This is what
      # kube-proxy and CNI agents such as calico-node declare (they usually go
      # further and use a bare `- operator: Exists`, which tolerates every
      # taint — appropriate only for something the node cannot function without).
      #
      # tolerations:
      # - key: node-role.kubernetes.io/control-plane
      #   operator: Exists
      #   effect: NoSchedule

      # Uncomment to cover only a subset of nodes. Coverage follows the labels:
      # label a node later and a Pod appears on it.
      #
      # nodeSelector:
      #   gpu: "true"

      containers:
      - name: logger
        image: alpine:3.20
        command:
        - /bin/sh
        - -c
        - while true; do date +"%Y-%m-%d-%H:%M:%S - Hello from $NODE_NAME"; sleep 30; done
        env:
        # The downward API: expose a field of this Pod's own spec as an env var.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
