# A Secret consumed the three common ways, plus the two fields that differ
# from a ConfigMap: `type` and `stringData`.
#
#   kubectl apply -f secret-demo.yaml
#   kubectl get secrets                    # TYPE column · DATA = number of keys, not bytes
#   kubectl logs pod/secret-consumer
#
# THE POINT OF THIS FILE — prove that base64 is not encryption:
#
#   kubectl get secret db-creds -o yaml                                  # base64, not ciphertext
#   kubectl get secret db-creds -o jsonpath='{.data.password}' | base64 -d   # supersecret
#   kubectl describe secret db-creds                                     # REDACTED here, but not above
#
# Anyone with `get` on Secrets reads them. Anyone with `list` or `watch` reads
# EVERY Secret in the namespace. Anyone who can create a Pod can mount one and
# print it. What actually protects a Secret is encryption at rest + RBAC.
#
#   kubectl delete -f secret-demo.yaml

---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
type: Opaque                  # the DEFAULT — omit `type` and you get this
data:
  # `data` values must be base64 YOU encoded:  echo -n 'supersecret' | base64
  password: c3VwZXJzZWNyZXQ=
stringData:
  # `stringData` takes plain text and Kubernetes encodes it on save. It is
  # WRITE-ONLY: read the object back and you see only `data`. On a key clash,
  # stringData wins.
  username: admin
  connection.properties: |
    host=db.default.svc.cluster.local
    port=5432

# immutable: true    # same as ConfigMaps: stable since 1.21, and CANNOT be reverted

---
apiVersion: v1
kind: Pod
metadata:
  name: secret-consumer
spec:
  restartPolicy: Never

  # The one consumption path with no ConfigMap equivalent: pulling from a
  # private registry. Needs a kubernetes.io/dockerconfigjson Secret, created
  # with `kubectl create secret docker-registry regcred ...`.
  # imagePullSecrets:
  # - name: regcred

  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "=== envFrom + secretRef — every key becomes a variable ==="
      env | grep '^SECRET_' | sort
      echo "   note: SECRET_CONNECTION.PROPERTIES is absent — a dot is not a valid"
      echo "   variable name, so that key is SKIPPED, exactly as with a ConfigMap"
      echo
      echo "=== env + secretKeyRef — one key, renamed ==="
      echo "DB_PASSWORD=$DB_PASSWORD"
      echo
      echo "=== volume mount — each key becomes a file, on tmpfs (RAM) ==="
      ls -l /etc/creds
      echo "--- /etc/creds/username ---"; cat /etc/creds/username
      echo
      mount | grep /etc/creds || true
      sleep infinity

    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-creds
          key: password
          optional: false      # the default: a missing Secret or key blocks startup

    envFrom:
    - secretRef:
        name: db-creds
      prefix: SECRET_

    volumeMounts:
    - name: creds
      mountPath: /etc/creds
      readOnly: true

  volumes:
  - name: creds
    secret:
      secretName: db-creds
      defaultMode: 0400        # tighter than a ConfigMap's default; only the owner reads it
