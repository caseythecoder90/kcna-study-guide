# The third subject kind: a ServiceAccount.
#
# Unlike User and Group, a ServiceAccount is a real, namespaced Kubernetes
# object. It must exist before a binding can reference it, and the binding
# must say which namespace it lives in.
#
#   kubectl apply -f serviceaccount-demo.yaml
#
# Then compare the two Pods:
#
#   kubectl exec -it robot-default -- sh
#   kubectl exec -it robot-granted -- sh
#
# ...running the same curl inside each. Same image, same command, different
# ServiceAccount, different answer.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-robot
  namespace: default
---
# The minimum grant: read Pods in this namespace and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: robot-reader
  namespace: default
subjects:
# Note what is required here that a User subject does not need:
#   - the ServiceAccount must already exist
#   - the namespace is mandatory
- kind: ServiceAccount
  name: build-robot
  namespace: default
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
# No serviceAccountName -> assigned the 'default' ServiceAccount of this
# namespace, which holds no permissions. The curl below returns 403.
apiVersion: v1
kind: Pod
metadata:
  name: robot-default
spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sleep", "3600"]
---
# The same Pod with an identity that has been granted something.
apiVersion: v1
kind: Pod
metadata:
  name: robot-granted
spec:
  serviceAccountName: build-robot
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sleep", "3600"]
---
# A Pod that talks to nothing has no business holding a credential at all.
# automountServiceAccountToken: false leaves
# /var/run/secrets/kubernetes.io/serviceaccount/ absent entirely.
apiVersion: v1
kind: Pod
metadata:
  name: robot-no-token
spec:
  automountServiceAccountToken: false
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sleep", "3600"]
