# Apply AFTER pods.yaml. Fits every CPU and memory total EXACTLY (equal is
# allowed) -- but it would be Pod #4.
#   exceeded quota: limited, requested: pods=1, used: pods=3, limited: pods=3
apiVersion: v1
kind: Pod
metadata: {name: pod4, namespace: limited}
spec:
  containers:
  - name: app
    image: nginx
    resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
