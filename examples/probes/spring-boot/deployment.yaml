# Probe wiring for a Spring Boot service with Actuator on the classpath.
# Replace the image with your own Spring Boot application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      terminationGracePeriodSeconds: 45      # >= preStop (10s) + shutdown phase (20s) + margin
      containers:
      - name: orders
        image: registry.example.com/orders:1.4.2
        ports:
        - {name: http, containerPort: 8080}
        startupProbe:                        # same endpoint as liveness; generous budget, runs once
          httpGet: {path: /livez, port: http}
          periodSeconds: 5
          failureThreshold: 36               # 36 x 5s = 3 minutes to start
        livenessProbe:                       # internal state only -- never external dependencies
          httpGet: {path: /livez, port: http}
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:                      # 503 during startup runners, graceful shutdown, load shedding
          httpGet: {path: /readyz, port: http}
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            sleep: {seconds: 10}             # let the EndpointSlice change propagate before SIGTERM (k8s 1.30+)
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector: {app: orders}
  ports:
  - {port: 80, targetPort: http}
