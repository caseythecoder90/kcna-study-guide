# The APPLICATION TEAM's object, in their own namespace.
#
# sectionName: https pins it to the https listener. Without it the route also
# attaches to http, where it would beat the redirect route (longer prefixes win,
# and on the "/" tie the OLDER route wins) and the redirect would never fire.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mygateway-app
  namespace: default
spec:
  parentRefs:
  - name: edge-gw
    namespace: gateway-system
    sectionName: https
  hostnames:
  - mygateway-app.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: nginx-frontend, port: 80}
  - matches:
    - path: {type: PathPrefix, value: /api}
    backendRefs:
    - {name: nginx-api, port: 80}
  - matches:
    - path: {type: PathPrefix, value: /admin}
    backendRefs:
    - {name: nginx-admin, port: 80}
