# CANARY -- 95/5. Weights are PROPORTIONS (weight / sum), not percentages:
# 19 and 1 would be the same split. Raise v2 step by step: 90/10, 50/50, 0/100.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mygateway-app          # same name as 03-httproute.yaml: applying REPLACES it
  namespace: default
spec:
  parentRefs:
  - name: edge-gw
    namespace: gateway-system
    sectionName: https
  hostnames:
  - mygateway-app.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: nginx-frontend, port: 80}
  - matches:
    - path: {type: PathPrefix, value: /api}
    backendRefs:
    - {name: nginx-api,    port: 80, weight: 95}    # stable (v1)
    - {name: nginx-api-v2, port: 80, weight: 5}     # canary (v2)
