# BLUE/GREEN -- weights 100/0. Every /api request goes to nginx-api (blue).
# Switch: swap the weights to 0/100. Roll back: swap them back. Both stay running.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mygateway-app          # same name as 03-httproute.yaml: applying REPLACES it
  namespace: default
spec:
  parentRefs:
  - name: edge-gw
    namespace: gateway-system
    sectionName: https
  hostnames:
  - mygateway-app.local
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - {name: nginx-frontend, port: 80}
  - matches:
    - path: {type: PathPrefix, value: /api}
    backendRefs:
    - {name: nginx-api,    port: 80, weight: 100}   # blue  (v1)
    - {name: nginx-api-v2, port: 80, weight: 0}     # green (v2) -- 0 = no traffic
